<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    user-select: none;
  }
  .top-bar {
    display: flex;
    align-items: center;
    gap: 2rem;
    margin-bottom: 1.2rem;
  }
  .top-bar a { color: #7b2ff7; text-decoration: none; font-size: 0.9rem; }
  .top-bar a:hover { text-decoration: underline; }
  h1 { font-size: 2rem; }

  /* Solved groups area */
  .solved-area {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 8px;
  }
  .solved-group {
    border-radius: 10px;
    padding: 14px 16px;
    text-align: center;
    animation: groupReveal 0.5s ease;
  }
  .solved-group .cat-name {
    font-weight: 800;
    font-size: 1rem;
    text-transform: uppercase;
    color: #1a1a2e;
    letter-spacing: 0.04em;
  }
  .solved-group .cat-words {
    font-size: 0.88rem;
    font-weight: 600;
    color: #1a1a2e;
    margin-top: 2px;
  }

  @keyframes groupReveal {
    0% { transform: scaleY(0); opacity: 0; }
    100% { transform: scaleY(1); opacity: 1; }
  }

  /* Grid */
  .grid-area {
    width: 100%;
    max-width: 520px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .tile {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    padding: 16px 6px;
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.88rem;
    font-weight: 700;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.12s, border-color 0.15s, box-shadow 0.15s, background 0.15s;
    text-align: center;
    line-height: 1.2;
    word-break: break-word;
  }
  .tile:hover {
    border-color: #3a3a6a;
    transform: scale(1.03);
  }
  .tile.selected {
    background: #2a1a4e;
    border-color: #7b2ff7;
    box-shadow: 0 0 14px rgba(123, 47, 247, 0.4);
    transform: scale(1.04);
  }
  .tile.shake {
    animation: shake 0.5s ease;
  }
  .tile.pop-out {
    animation: popOut 0.4s ease forwards;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    15% { transform: translateX(-8px); }
    30% { transform: translateX(8px); }
    45% { transform: translateX(-6px); }
    60% { transform: translateX(6px); }
    75% { transform: translateX(-3px); }
    90% { transform: translateX(3px); }
  }
  @keyframes popOut {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(0); opacity: 0; }
  }

  /* Message bar */
  .message-bar {
    height: 2.2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .message {
    background: #e0e0e0;
    color: #0f0f1a;
    padding: 0.3rem 1.4rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.92rem;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .message.show { opacity: 1; }

  /* Mistakes */
  .mistakes-area {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
    justify-content: center;
  }
  .mistakes-label {
    font-size: 0.85rem;
    color: #888;
    font-weight: 600;
  }
  .dots {
    display: flex;
    gap: 6px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #3a3a5a;
    transition: background 0.3s;
  }
  .dot.filled {
    background: #7b2ff7;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .btn {
    padding: 10px 22px;
    border-radius: 24px;
    border: 2px solid #2a2a4a;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 0.88rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn:hover:not(:disabled) {
    border-color: #7b2ff7;
    color: #7b2ff7;
  }
  .btn:disabled {
    opacity: 0.35;
    cursor: default;
  }
  .btn.submit-btn {
    background: linear-gradient(135deg, #7b2ff7, #2a2a4a);
    border-color: #7b2ff7;
    color: #fff;
  }
  .btn.submit-btn:hover:not(:disabled) {
    background: linear-gradient(135deg, #8f4ff9, #3a3a5a);
    color: #fff;
  }
  .btn.submit-btn:disabled {
    background: #1a1a2e;
    border-color: #2a2a4a;
    color: #e0e0e0;
  }
  .btn.new-game-btn {
    background: linear-gradient(135deg, #7b2ff7, #2a2a4a);
    border-color: #7b2ff7;
    color: #fff;
    font-size: 1rem;
    padding: 12px 32px;
    margin-top: 10px;
  }
  .btn.new-game-btn:hover {
    background: linear-gradient(135deg, #8f4ff9, #3a3a5a);
  }

  /* End screen */
  .end-overlay {
    display: none;
    text-align: center;
    margin-top: 12px;
  }
  .end-overlay.show { display: block; }
  .end-title {
    font-size: 1.5rem;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .end-sub {
    font-size: 0.95rem;
    color: #888;
    margin-bottom: 14px;
  }
  .win-title {
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .lose-title { color: #ff4466; }

  /* Responsive */
  @media (max-width: 560px) {
    body { padding: 1rem 0.5rem; }
    .grid { gap: 6px; }
    .tile { padding: 12px 4px; font-size: 0.78rem; min-height: 54px; }
    .btn { padding: 8px 16px; font-size: 0.82rem; }
  }
</style>

      { category: "Modes of Transport", color: "green", words: ["TRAIN", "FERRY", "CABLE CAR", "GONDOLA"] },
      { category: "Famous Michaels", color: "blue", words: ["JORDAN", "JACKSON", "SCOTT", "DOUGLAS"] },
      { category: "Things With Tails", color: "purple", words: ["KITE", "COMET", "COAT", "PIANO"] }
    ]
  },
  {
    groups: [
      { category: "Condiments", color: "yellow", words: ["KETCHUP", "MUSTARD", "MAYO", "RELISH"] },
      { category: "Denim Items", color: "green", words: ["JACKET", "JEANS", "SKIRT", "VEST"] },
      { category: "Ancient Wonders", color: "blue", words: ["PYRAMID", "COLOSSUS", "LIGHTHOUSE", "GARDENS"] },
      { category: "Words Before 'Line'", color: "purple", words: ["PUNCH", "DEAD", "SIDE", "BOTTOM"] }
    ]
  },
  {
    groups: [
      { category: "Grains", color: "yellow", words: ["RICE", "WHEAT", "BARLEY", "OATS"] },
      { category: "Percussion Instruments", color: "green", words: ["CYMBAL", "BONGO", "TRIANGLE", "GONG"] },
      { category: "Pixar Movies", color: "blue", words: ["COCO", "BRAVE", "UP", "CARS"] },
      { category: "Words That Mean Money", color: "purple", words: ["BREAD", "DOUGH", "CHEDDAR", "BACON"] }
    ]
  }
];

// ============ GROUP COLORS ============
const GROUP_COLORS = {
  yellow: { bg: "#f9df6d", text: "#1a1a2e" },
  green:  { bg: "#a0c35a", text: "#1a1a2e" },
  blue:   { bg: "#b0c4ef", text: "#1a1a2e" },
  purple: { bg: "#ba81c5", text: "#1a1a2e" }
};
const DIFFICULTY_ORDER = ["yellow", "green", "blue", "purple"];

// ============ GAME STATE ============
let currentPuzzle = null;
let tiles = []; // { word, groupIdx }
let selected = [];
let solvedGroups = [];
let mistakesLeft = 4;
let gameOver = false;
let previousGuesses = [];
let usedPuzzles = [];

// ============ DOM ============
const gridEl = document.getElementById("grid");
const solvedAreaEl = document.getElementById("solvedArea");
const msgEl = document.getElementById("msg");
const dotsEl = document.getElementById("dots");
const submitBtn = document.getElementById("submitBtn");
const deselectBtn = document.getElementById("deselectBtn");
const shuffleBtn = document.getElementById("shuffleBtn");
const newGameBtn = document.getElementById("newGameBtn");
const endOverlay = document.getElementById("endOverlay");
const endTitle = document.getElementById("endTitle");
const endSub = document.getElementById("endSub");
const btnRow = document.getElementById("btnRow");
const mistakesArea = document.getElementById("mistakesArea");

// ============ INIT ============
function pickPuzzle() {
  if (usedPuzzles.length >= PUZZLES.length) usedPuzzles = [];
  let idx;
  do {
    idx = Math.floor(Math.random() * PUZZLES.length);
  } while (usedPuzzles.includes(idx));
  usedPuzzles.push(idx);
  return JSON.parse(JSON.stringify(PUZZLES[idx]));
}

function startGame() {
  currentPuzzle = pickPuzzle();
  tiles = [];
  selected = [];
  solvedGroups = [];
  mistakesLeft = 4;
  gameOver = false;
  previousGuesses = [];

  currentPuzzle.groups.forEach((g, gi) => {
    g.words.forEach(w => tiles.push({ word: w, groupIdx: gi }));
  });
  shuffle(tiles);

  solvedAreaEl.innerHTML = "";
  endOverlay.classList.remove("show");
  btnRow.style.display = "flex";
  mistakesArea.style.display = "flex";
  document.getElementById("gridArea").style.display = "block";
  hideMsg();
  renderDots();
  renderGrid();
  updateButtons();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

// ============ RENDER ============
function renderGrid() {
  gridEl.innerHTML = "";
  tiles.forEach((t, i) => {
    const el = document.createElement("div");
    el.className = "tile" + (selected.includes(i) ? " selected" : "");
    el.textContent = t.word;
    el.addEventListener("click", () => onTileClick(i));
    gridEl.appendChild(el);
  });
}

function renderDots() {
  dotsEl.innerHTML = "";
  for (let i = 0; i < 4; i++) {
    const d = document.createElement("div");
    d.className = "dot" + (i < mistakesLeft ? " filled" : "");
    dotsEl.appendChild(d);
  }
}

function renderSolvedGroup(group) {
  const div = document.createElement("div");
  div.className = "solved-group";
  const c = GROUP_COLORS[group.color];
  div.style.background = c.bg;
  div.style.color = c.text;
  div.innerHTML = `
    <div class="cat-name">${group.category}</div>
    <div class="cat-words">${group.words.join(", ")}</div>
  `;
  // Insert in difficulty order
  const order = DIFFICULTY_ORDER.indexOf(group.color);
  const children = Array.from(solvedAreaEl.children);
  let inserted = false;
  for (let i = 0; i < children.length; i++) {
    const childColor = children[i].dataset.color;
    if (DIFFICULTY_ORDER.indexOf(childColor) > order) {
      solvedAreaEl.insertBefore(div, children[i]);
      inserted = true;
      break;
    }
  }
  if (!inserted) solvedAreaEl.appendChild(div);
  div.dataset.color = group.color;
}

function updateButtons() {
  submitBtn.disabled = selected.length !== 4 || gameOver;
  deselectBtn.disabled = selected.length === 0 || gameOver;
  shuffleBtn.disabled = gameOver;
}

// ============ MESSAGES ============
let msgTimeout = null;
function showMsg(text, duration) {
  msgEl.textContent = text;
  msgEl.classList.add("show");
  if (msgTimeout) clearTimeout(msgTimeout);
  if (duration) {
    msgTimeout = setTimeout(hideMsg, duration);
  }
}
function hideMsg() {
  msgEl.classList.remove("show");
}

// ============ TILE CLICK ============
function onTileClick(idx) {
  if (gameOver) return;
  const selIdx = selected.indexOf(idx);
  if (selIdx >= 0) {
    selected.splice(selIdx, 1);
    window.SFX?.click();
  } else {
    if (selected.length >= 4) return;
    selected.push(idx);
    window.SFX?.click();
  }
  renderGrid();
  updateButtons();
}

// ============ SUBMIT ============
submitBtn.addEventListener("click", onSubmit);
deselectBtn.addEventListener("click", () => {
  selected = [];
  renderGrid();
  updateButtons();
});
shuffleBtn.addEventListener("click", () => {
  window.SFX?.swoosh();
  shuffle(tiles);
  selected = [];
  renderGrid();
  updateButtons();
});
newGameBtn.addEventListener("click", startGame);

function onSubmit() {
  if (selected.length !== 4 || gameOver) return;

  const selectedWords = selected.map(i => tiles[i].word).sort();
  const guessKey = selectedWords.join(",");
  if (previousGuesses.includes(guessKey)) {
    showMsg("Already guessed!", 1500);
    return;
  }
  previousGuesses.push(guessKey);

  // Check which group these belong to
  const groupCounts = {};
  selected.forEach(i => {
    const gi = tiles[i].groupIdx;
    groupCounts[gi] = (groupCounts[gi] || 0) + 1;
  });

  // Find if any group has all 4
  let correctGroupIdx = null;
  for (const [gi, count] of Object.entries(groupCounts)) {
    if (count === 4) {
      correctGroupIdx = parseInt(gi);
      break;
    }
  }

  if (correctGroupIdx !== null) {
    // Correct guess!
    window.SFX?.correct();
    handleCorrectGuess(correctGroupIdx);
  } else {
    // Wrong guess
    // Check if 3 of 4 are from one group ("one away")
    let oneAway = false;
    for (const [gi, count] of Object.entries(groupCounts)) {
      if (count === 3) { oneAway = true; break; }
    }
    window.SFX?.wrong();
    handleWrongGuess(oneAway);
  }
}

function handleCorrectGuess(groupIdx) {
  const group = currentPuzzle.groups[groupIdx];
  const tileEls = gridEl.querySelectorAll(".tile");

  // Animate selected tiles
  selected.forEach(i => {
    tileEls[i].classList.add("pop-out");
  });

  setTimeout(() => {
    // Remove tiles from array
    const removedWords = selected.map(i => tiles[i].word);
    tiles = tiles.filter(t => !removedWords.includes(t.word));
    selected = [];
    solvedGroups.push(groupIdx);

    renderSolvedGroup(group);
    renderGrid();
    updateButtons();

    // Check win
    if (solvedGroups.length === 4) {
      gameOver = true;
      window.SFX?.win();
      const ws = window.HallOfFame?.winStreak('connections');
      if(window.HallOfFame) window.HallOfFame.submit('connections', 1);
      setTimeout(() => {
        btnRow.style.display = "none";
        mistakesArea.style.display = "none";
        endTitle.className = "end-title win-title";
        endTitle.textContent = "Excellent!";
        const base = mistakesLeft === 4
          ? "Perfect - no mistakes!"
          : `Solved with ${4 - mistakesLeft} mistake${4 - mistakesLeft > 1 ? "s" : ""}`;
        endSub.innerHTML = base + (ws ? ' | Streak: <span style="color:#00d4ff;font-weight:bold;">' + ws.current + '</span> | Best: <span style="color:#00d4ff;font-weight:bold;">' + ws.best + '</span>' : '');
        endOverlay.classList.add("show");
      }, 300);
    }
  }, 450);
}

function handleWrongGuess(oneAway) {
  const tileEls = gridEl.querySelectorAll(".tile");
  selected.forEach(i => {
    tileEls[i].classList.add("shake");
  });

  if (oneAway) {
    showMsg("One away...", 2000);
  } else {
    showMsg("Incorrect", 1500);
  }

  mistakesLeft--;
  renderDots();

  setTimeout(() => {
    selected.forEach(i => {
      const el = gridEl.querySelectorAll(".tile")[i];
      if (el) el.classList.remove("shake");
    });
    selected = [];
    renderGrid();
    updateButtons();

    if (mistakesLeft <= 0) {
      // Game over - reveal all
      gameOver = true;
      window.SFX?.fail();
      revealAll();
    }
  }, 600);
}

function revealAll() {
  // Reveal remaining groups in difficulty order
  const remaining = [];
  currentPuzzle.groups.forEach((g, gi) => {
    if (!solvedGroups.includes(gi)) remaining.push(gi);
  });
  remaining.sort((a, b) => {
    return DIFFICULTY_ORDER.indexOf(currentPuzzle.groups[a].color)
         - DIFFICULTY_ORDER.indexOf(currentPuzzle.groups[b].color);
  });

  let delay = 0;
  remaining.forEach(gi => {
    setTimeout(() => {
      const group = currentPuzzle.groups[gi];
      tiles = tiles.filter(t => t.groupIdx !== gi);
      renderSolvedGroup(group);
      renderGrid();
    }, delay);
    delay += 500;
  });

  const ls = window.HallOfFame?.loseStreak('connections');
  setTimeout(() => {
    btnRow.style.display = "none";
    mistakesArea.style.display = "none";
    document.getElementById("gridArea").style.display = "none";
    endTitle.className = "end-title lose-title";
    endTitle.textContent = "Next Time!";
    endSub.innerHTML = 'Better luck on the next puzzle.' + (ls ? ' | Streak: <span style="color:#00d4ff;font-weight:bold;">' + ls.current + '</span> | Best: <span style="color:#00d4ff;font-weight:bold;">' + ls.best + '</span>' : '');
    endOverlay.classList.add("show");
  }, delay + 200);
}

// ============ START ============
startGame();
</script>
<script src="sound.js"></script>
<script src="fame.js"></script>
