<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo - Arcade</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6544292175874864" crossorigin="anonymous"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0f0f1a;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        a.back {
            position: fixed;
            top: 12px;
            left: 16px;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            z-index: 100;
            transition: color 0.2s;
        }
        a.back:hover { color: #00d4ff; }

        h1 {
            margin-top: 28px;
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #7b2ff7, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            margin-top: 16px;
            width: 100%;
            max-width: 520px;
            padding: 0 12px;
        }

        /* Call display */
        .call-area {
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 16px;
            padding: 18px 28px;
            text-align: center;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        .call-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(123,47,247,0.06), rgba(0,212,255,0.06));
            pointer-events: none;
        }
        .call-label {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .call-number {
            font-size: 3rem;
            font-weight: 800;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.3s;
        }
        .call-number .letter {
            color: #7b2ff7;
        }
        .call-number .num {
            color: #00d4ff;
        }
        .call-number.pop {
            animation: popIn 0.4s ease;
        }
        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); opacity: 1; }
        }

        .call-count {
            font-size: 0.8rem;
            color: #666;
            margin-top: 4px;
        }

        /* Buttons row */
        .btn-row {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-call {
            background: linear-gradient(135deg, #7b2ff7, #5a1fd0);
            color: #fff;
            box-shadow: 0 4px 16px rgba(123,47,247,0.3);
        }
        .btn-call:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(123,47,247,0.45);
        }
        .btn-call:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .btn-new {
            background: linear-gradient(135deg, #00d4ff, #0094b3);
            color: #0f0f1a;
            box-shadow: 0 4px 16px rgba(0,212,255,0.2);
        }
        .btn-new:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,212,255,0.35);
        }

        /* Bingo grid */
        .bingo-board {
            width: 100%;
            max-width: 420px;
        }
        .bingo-header {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-bottom: 4px;
        }
        .bingo-header span {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            padding: 8px 0;
            border-radius: 10px 10px 4px 4px;
            background: linear-gradient(180deg, rgba(123,47,247,0.25), rgba(123,47,247,0.1));
            color: #c9a0ff;
            letter-spacing: 1px;
        }

        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .cell {
            aspect-ratio: 1;
            background: #1a1a2e;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            user-select: none;
        }
        .cell:hover:not(.marked):not(.free) {
            border-color: #7b2ff7;
            background: #22223a;
        }
        .cell.called:not(.marked):not(.free) {
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0,212,255,0.2);
            animation: pulse 1.5s ease infinite;
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 8px rgba(0,212,255,0.2); }
            50% { box-shadow: 0 0 18px rgba(0,212,255,0.4); }
        }
        .cell.marked {
            background: linear-gradient(135deg, #7b2ff7, #5a1fd0);
            border-color: #9b5fff;
            color: #fff;
            animation: stamp 0.35s ease;
            cursor: default;
        }
        .cell.marked::after {
            content: '';
            position: absolute;
            width: 55%;
            height: 55%;
            border: 3px solid rgba(255,255,255,0.5);
            border-radius: 50%;
        }
        @keyframes stamp {
            0% { transform: scale(1.25); }
            50% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }
        .cell.free {
            background: linear-gradient(135deg, #00d4ff22, #7b2ff722);
            border-color: #3a3a5a;
            font-size: 0.7rem;
            font-weight: 600;
            color: #aaa;
            cursor: default;
            letter-spacing: 1px;
        }
        .cell.free.marked {
            background: linear-gradient(135deg, #7b2ff7, #5a1fd0);
            color: #fff;
        }
        .cell.win-cell {
            animation: winGlow 0.6s ease infinite alternate;
            border-color: #00d4ff;
            z-index: 1;
        }
        @keyframes winGlow {
            from { box-shadow: 0 0 10px rgba(0,212,255,0.4); }
            to { box-shadow: 0 0 24px rgba(0,212,255,0.8), 0 0 48px rgba(123,47,247,0.4); }
        }

        /* Called numbers history */
        .history-section {
            width: 100%;
            margin-top: 4px;
        }
        .history-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .history {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
        }
        .history::-webkit-scrollbar { width: 4px; }
        .history::-webkit-scrollbar-track { background: transparent; }
        .history::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 4px; }
        .history .chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 26px;
            padding: 0 6px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 600;
            background: #22223a;
            border: 1px solid #2a2a4a;
            color: #999;
            animation: chipIn 0.25s ease;
        }
        .history .chip.latest {
            background: rgba(123,47,247,0.2);
            border-color: #7b2ff7;
            color: #c9a0ff;
        }
        @keyframes chipIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Win banner */
        .win-banner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #1a1a2e, #22223a);
            border: 3px solid #7b2ff7;
            border-radius: 20px;
            padding: 36px 48px;
            text-align: center;
            z-index: 1000;
            box-shadow: 0 0 60px rgba(123,47,247,0.4), 0 0 120px rgba(0,212,255,0.2);
        }
        .win-banner.show {
            display: block;
            animation: bannerIn 0.5s ease forwards;
        }
        @keyframes bannerIn {
            from { transform: translate(-50%, -50%) scale(0) rotate(-10deg); }
            to { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        .win-banner h2 {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7b2ff7, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        .win-banner .win-score {
            font-size: 1.1rem;
            color: #aaa;
            margin-bottom: 18px;
        }
        .win-banner .btn-new {
            display: inline-block;
            padding: 12px 32px;
        }

        /* Overlay */
        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 999;
        }
        .overlay.show { display: block; }

        /* Confetti canvas */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1001;
        }

        /* Status message */
        .status-msg {
            font-size: 0.85rem;
            color: #888;
            min-height: 20px;
            text-align: center;
        }
        .status-msg.warn { color: #ffa726; }

        /* Responsive */
        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; margin-top: 20px; }
            .call-number { font-size: 2.2rem; min-height: 48px; }
            .cell { font-size: 1.1rem; border-radius: 8px; }
            .bingo-header span { font-size: 1.2rem; }
            .game-wrapper { gap: 12px; }
            .call-area { padding: 14px 20px; }
            .win-banner { padding: 28px 32px; }
            .win-banner h2 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <a class="back" href="index.html">&larr; Back</a>

    <h1>BINGO</h1>

    <div class="game-wrapper">
        <div class="call-area">
            <div class="call-label">Current Call</div>
            <div class="call-number" id="callDisplay">
                <span style="color:#666; font-size:1.2rem;">Press &ldquo;Call Number&rdquo; to start</span>
            </div>
            <div class="call-count" id="callCount"></div>
        </div>

        <div class="btn-row">
            <button class="btn btn-call" id="callBtn" onclick="callNumber()">Call Number</button>
            <button class="btn btn-new" onclick="newGame()">New Game</button>
        </div>

        <div class="status-msg" id="statusMsg"></div>

        <div class="bingo-board">
            <div class="bingo-header">
                <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
            </div>
            <div class="bingo-grid" id="grid"></div>
        </div>

        <div class="history-section">
            <div class="history-label">Called Numbers</div>
            <div class="history" id="history"></div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div class="win-banner" id="winBanner">
        <h2>BINGO!</h2>
        <div class="win-score" id="winScore"></div>
        <button class="btn btn-new" onclick="newGame()">Play Again</button>
    </div>
    <canvas id="confetti-canvas"></canvas>

    <script>
        // ─── Game State ───
        let card = [];          // 5x5 array of numbers (0 = free)
        let marked = [];        // 5x5 booleans
        let calledNumbers = []; // ordered list of called numbers
        let pool = [];          // remaining numbers to call
        let gameOver = false;
        let totalCalls = 0;

        const COLS = ['B','I','N','G','O'];
        const RANGES = [[1,15],[16,30],[31,45],[46,60],[61,75]];

        function getLetter(n) {
            if (n <= 15) return 'B';
            if (n <= 30) return 'I';
            if (n <= 45) return 'N';
            if (n <= 60) return 'G';
            return 'O';
        }

        // ─── Generate Card ───
        function generateCard() {
            card = [];
            for (let row = 0; row < 5; row++) {
                card[row] = [];
                for (let col = 0; col < 5; col++) {
                    card[row][col] = 0; // placeholder
                }
            }
            // Pick 5 unique numbers per column from correct range
            for (let col = 0; col < 5; col++) {
                const [lo, hi] = RANGES[col];
                const picks = [];
                while (picks.length < 5) {
                    const n = lo + Math.floor(Math.random() * (hi - lo + 1));
                    if (!picks.includes(n)) picks.push(n);
                }
                for (let row = 0; row < 5; row++) {
                    card[row][col] = picks[row];
                }
            }
            card[2][2] = 0; // free space
        }

        // ─── Build Pool ───
        function buildPool() {
            pool = [];
            for (let i = 1; i <= 75; i++) pool.push(i);
            // Shuffle (Fisher-Yates)
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
        }

        // ─── Render Grid ───
        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 5; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    if (row === 2 && col === 2) {
                        cell.classList.add('free', 'marked');
                        cell.textContent = 'FREE';
                    } else {
                        cell.textContent = card[row][col];
                        cell.addEventListener('click', () => markCell(row, col, cell));
                    }

                    if (marked[row][col]) {
                        cell.classList.add('marked');
                    }

                    grid.appendChild(cell);
                }
            }
            updateCalledHighlights();
        }

        // ─── Update called highlights on grid ───
        function updateCalledHighlights() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (r === 2 && c === 2) return;
                if (!marked[r][c] && calledNumbers.includes(card[r][c])) {
                    cell.classList.add('called');
                } else {
                    cell.classList.remove('called');
                }
            });
        }

        // ─── Mark Cell ───
        function markCell(row, col, cellEl) {
            if (gameOver) return;
            if (marked[row][col]) return;

            const num = card[row][col];
            if (!calledNumbers.includes(num)) {
                showStatus('That number hasn\'t been called yet!', true);
                cellEl.style.animation = 'none';
                cellEl.offsetHeight; // reflow
                cellEl.style.animation = '';
                return;
            }

            marked[row][col] = true;
            cellEl.classList.add('marked');
            cellEl.classList.remove('called');
            showStatus('');

            if (typeof SoundFX !== 'undefined' && SoundFX.play) {
                SoundFX.play('click');
            }

            checkWin();
        }

        // ─── Call Number ───
        function callNumber() {
            if (gameOver) return;
            if (pool.length === 0) {
                showStatus('All 75 numbers have been called!', true);
                document.getElementById('callBtn').disabled = true;
                return;
            }

            const num = pool.pop();
            calledNumbers.push(num);
            totalCalls++;

            // Update display
            const display = document.getElementById('callDisplay');
            const letter = getLetter(num);
            display.innerHTML = `<span class="letter">${letter}</span><span class="num">${num}</span>`;
            display.classList.remove('pop');
            void display.offsetHeight;
            display.classList.add('pop');

            document.getElementById('callCount').textContent = `Call #${totalCalls} \u2022 ${pool.length} remaining`;

            // Update history
            const historyEl = document.getElementById('history');
            // Remove latest class from previous
            const prev = historyEl.querySelector('.chip.latest');
            if (prev) prev.classList.remove('latest');

            const chip = document.createElement('span');
            chip.className = 'chip latest';
            chip.textContent = `${letter}${num}`;
            historyEl.appendChild(chip);
            historyEl.scrollTop = historyEl.scrollHeight;

            // Highlight matching cells
            updateCalledHighlights();
            showStatus('');
        }

        // ─── Check Win ───
        function checkWin() {
            const wins = [];

            // Check rows
            for (let r = 0; r < 5; r++) {
                if (marked[r].every(v => v)) {
                    for (let c = 0; c < 5; c++) wins.push([r, c]);
                }
            }
            // Check columns
            for (let c = 0; c < 5; c++) {
                if (marked.every(row => row[c])) {
                    for (let r = 0; r < 5; r++) wins.push([r, c]);
                }
            }
            // Diagonal top-left to bottom-right
            if ([0,1,2,3,4].every(i => marked[i][i])) {
                for (let i = 0; i < 5; i++) wins.push([i, i]);
            }
            // Diagonal top-right to bottom-left
            if ([0,1,2,3,4].every(i => marked[i][4 - i])) {
                for (let i = 0; i < 5; i++) wins.push([i, 4 - i]);
            }

            if (wins.length > 0) {
                triggerWin(wins);
            }
        }

        // ─── Trigger Win ───
        function triggerWin(winCells) {
            gameOver = true;
            document.getElementById('callBtn').disabled = true;

            // Highlight winning cells
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                if (winCells.some(([wr, wc]) => wr === r && wc === c)) {
                    cell.classList.add('win-cell');
                }
            });

            // Show banner after short delay
            setTimeout(() => {
                document.getElementById('winScore').textContent = `You won in ${totalCalls} calls!`;
                document.getElementById('overlay').classList.add('show');
                document.getElementById('winBanner').classList.add('show');
                launchConfetti();

                if (typeof SoundFX !== 'undefined' && SoundFX.play) {
                    SoundFX.play('win');
                }

                // Submit score (lower is better)
                if (typeof HallOfFame !== 'undefined' && HallOfFame.submit) {
                    HallOfFame.submit('bingo', totalCalls);
                }
            }, 400);
        }

        // ─── Status Message ───
        function showStatus(msg, warn) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status-msg' + (warn ? ' warn' : '');
        }

        // ─── New Game ───
        function newGame() {
            gameOver = false;
            totalCalls = 0;
            calledNumbers = [];
            marked = Array.from({length: 5}, () => Array(5).fill(false));
            marked[2][2] = true; // free space

            generateCard();
            buildPool();
            renderGrid();

            document.getElementById('callDisplay').innerHTML =
                '<span style="color:#666; font-size:1.2rem;">Press \u201CCall Number\u201D to start</span>';
            document.getElementById('callCount').textContent = '';
            document.getElementById('history').innerHTML = '';
            document.getElementById('callBtn').disabled = false;
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('winBanner').classList.remove('show');
            showStatus('');

            // Clear confetti
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ─── Confetti ───
        function launchConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#7b2ff7','#00d4ff','#ffa726','#ff4081','#69f0ae','#ffeb3b','#e040fb','#40c4ff'];

            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * 3 + 2,
                    rot: Math.random() * 360,
                    rotV: (Math.random() - 0.5) * 10,
                    opacity: 1
                });
            }

            let frame = 0;
            const maxFrames = 180;

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                frame++;

                pieces.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05;
                    p.rot += p.rotV;
                    if (frame > maxFrames - 40) {
                        p.opacity = Math.max(0, p.opacity - 0.025);
                    }

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rot * Math.PI / 180);
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();
                });

                if (frame < maxFrames) {
                    requestAnimationFrame(draw);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            requestAnimationFrame(draw);
        }

        // ─── Resize confetti canvas ───
        window.addEventListener('resize', () => {
            const canvas = document.getElementById('confetti-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // ─── Init ───
        newGame();
    </script>

    <script src="fame.js?v=5"></script>
    <script type="module" src="firebase-lb.js?v=5"></script>

    <script src="avatar.js?v=6"></script>
