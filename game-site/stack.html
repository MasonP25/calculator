<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower Stack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
    overflow: hidden;
  }
  canvas { border: 2px solid #2a2a4a; border-radius: 8px; cursor: pointer; }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<canvas id="c" width="400" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 400, H = 600;

// ---- Constants ----
const BLOCK_H = 24;
const BASE_WIDTH = 200;
const BASE_SPEED = 2.2;
const MAX_SPEED = 9;
const SPEED_INC = 0.15;
const PERFECT_TOL = 3;
const SIZE_RESTORE = 8;
const DEPTH_X = 10;
const DEPTH_Y = 8;

// ---- Rainbow colors ----
function blockColor(i) {
  const hue = (i * 27 + 10) % 360;
  return { hue, top: hsl(hue,70,58), front: hsl(hue,65,44), side: hsl(hue,60,34), glow: hsl(hue,80,65) };
}
function hsl(h,s,l) { return `hsl(${h},${s}%,${l}%)`; }

// ---- State ----
let state = 'title'; // title | playing | gameover
let stack = [];
let moving = null;
let debris = [];
let particles = [];
let popups = [];
let score = 0;
let combo = 0;
let camera = 0;
let camTarget = 0;
let speed = BASE_SPEED;
let dir = 1;
let flashTimer = 0;
let flashBlock = null;
let animFrame = null;

// ---- Start Game ----
function startGame() {
  window.SFX?.click();
  state = 'playing';
  score = 0;
  combo = 0;
  camera = 0;
  camTarget = 0;
  speed = BASE_SPEED;
  dir = 1;
  stack = [];
  debris = [];
  particles = [];
  popups = [];
  flashTimer = 0;
  flashBlock = null;
  moving = null;

  // Foundation block
  stack.push({ x: W/2 - BASE_WIDTH/2, y: H - 50, w: BASE_WIDTH, col: blockColor(0) });
  spawnBlock();
  if (!animFrame) loop();
}

function spawnBlock() {
  const prev = stack[stack.length - 1];
  const hue = stack.length;
  const y = prev.y - BLOCK_H;
  const startX = dir === 1 ? -prev.w : W;
  moving = { x: startX, y, w: prev.w, col: blockColor(hue) };
  speed = Math.min(MAX_SPEED, BASE_SPEED + stack.length * SPEED_INC);
}

// ---- Place Block ----
function placeBlock() {
  if (!moving || state !== 'playing') return;
  const prev = stack[stack.length - 1];
  const m = moving;

  const oL = Math.max(m.x, prev.x);
  const oR = Math.min(m.x + m.w, prev.x + prev.w);
  const oW = oR - oL;

  if (oW <= 0) {
    // Miss - entire block falls
    debris.push(makeDebris(m.x, m.y, m.w, m.col, dir));
    moving = null;
    gameOver();
    return;
  }

  const diff = Math.abs(m.x - prev.x);
  const isPerfect = diff <= PERFECT_TOL && Math.abs(m.w - prev.w) < PERFECT_TOL;

  if (isPerfect) {
    // Perfect placement: snap and restore width
    const restoredW = Math.min(BASE_WIDTH, prev.w + SIZE_RESTORE);
    const restoredX = prev.x - (restoredW - prev.w) / 2;
    // Clamp to canvas
    const clampX = Math.max(0, Math.min(W - restoredW, restoredX));
    const placed = { x: clampX, y: m.y, w: restoredW, col: m.col };
    stack.push(placed);
    combo++;

    flashBlock = placed;
    flashTimer = 20;

    // Particles
    spawnParticles(placed, 25);

    // Popup
    const txt = combo >= 3 ? 'COMBO x' + combo + '!' : 'Perfect!';
    popups.push({ x: placed.x + placed.w/2, y: placed.y - 8, text: txt, life: 1 });

    window.SFX?.combo();
  } else {
    combo = 0;
    const placed = { x: oL, y: m.y, w: oW, col: m.col };
    stack.push(placed);

    // Left overhang debris
    if (m.x < prev.x) {
      const cutW = oL - m.x;
      if (cutW > 0.5) debris.push(makeDebris(m.x, m.y, cutW, m.col, -1));
    }
    // Right overhang debris
    if (m.x + m.w > prev.x + prev.w) {
      const cutW = (m.x + m.w) - oR;
      if (cutW > 0.5) debris.push(makeDebris(oR, m.y, cutW, m.col, 1));
    }

    window.SFX?.bounce();
  }

  score = stack.length - 1;

  // Camera
  const blockY = stack[stack.length - 1].y;
  const viewTarget = H * 0.6;
  if (blockY - camTarget < viewTarget) {
    camTarget = blockY - viewTarget;
  }

  dir *= -1;

  // Too narrow
  if (stack[stack.length - 1].w < 2) {
    moving = null;
    gameOver();
    return;
  }

  spawnBlock();
}

function makeDebris(x, y, w, col, xdir) {
  return { x, y, w, col, vy: 0, vx: xdir * (1 + Math.random()*2), rot: 0, vrot: xdir * 0.04 };
}

function gameOver() {
  state = 'gameover';
  moving = null;
  window.SFX?.fail();
  if (score > 0) window.HallOfFame?.submit('stack', score);
}

// ---- Particles ----
function spawnParticles(block, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: block.x + Math.random() * block.w,
      y: block.y + Math.random() * BLOCK_H,
      vx: (Math.random()-0.5)*7,
      vy: -(Math.random()*5+1),
      life: 1,
      decay: 0.015 + Math.random()*0.02,
      size: 2 + Math.random()*3,
      col: block.col
    });
  }
}

// ---- Update ----
function update() {
  if (state === 'playing' && moving) {
    moving.x += speed * dir;
    if (dir === 1 && moving.x > W) { moving.x = W; dir = -1; }
    else if (dir === -1 && moving.x + moving.w < 0) { moving.x = -moving.w; dir = 1; }
  }

  // Smooth camera
  camera += (camTarget - camera) * 0.07;

  // Flash
  if (flashTimer > 0) flashTimer--;

  // Debris
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i];
    d.vy += 0.35;
    d.y += d.vy;
    d.x += d.vx;
    d.rot += d.vrot;
    if (d.y - camera > H + 300) debris.splice(i, 1);
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 0.7;
    p.life -= 0.013;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

// ---- Draw Helpers ----
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r); ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawBlock3D(x, sy, w, col, alpha) {
  if (sy > H + 50 || sy + BLOCK_H + DEPTH_Y < -50) return;
  ctx.globalAlpha = alpha;

  // Top face
  ctx.fillStyle = col.top;
  ctx.beginPath();
  ctx.moveTo(x, sy);
  ctx.lineTo(x + DEPTH_X, sy - DEPTH_Y);
  ctx.lineTo(x + w + DEPTH_X, sy - DEPTH_Y);
  ctx.lineTo(x + w, sy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = col.glow;
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Front face
  ctx.fillStyle = col.front;
  ctx.fillRect(x, sy, w, BLOCK_H);
  // Subtle gradient
  const g = ctx.createLinearGradient(x, sy, x, sy+BLOCK_H);
  g.addColorStop(0, 'rgba(255,255,255,0.1)');
  g.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = g;
  ctx.fillRect(x, sy, w, BLOCK_H);

  // Right side
  ctx.fillStyle = col.side;
  ctx.beginPath();
  ctx.moveTo(x+w, sy);
  ctx.lineTo(x+w+DEPTH_X, sy-DEPTH_Y);
  ctx.lineTo(x+w+DEPTH_X, sy-DEPTH_Y+BLOCK_H);
  ctx.lineTo(x+w, sy+BLOCK_H);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = 1;
}

function drawDebris(d) {
  const sy = d.y - camera;
  if (sy > H + 100 || sy < -100) return;
  ctx.save();
  ctx.translate(d.x + d.w/2, sy + BLOCK_H/2);
  ctx.rotate(d.rot);
  ctx.globalAlpha = Math.max(0, 1 - d.vy/18);

  ctx.fillStyle = d.col.front;
  ctx.fillRect(-d.w/2, -BLOCK_H/2, d.w, BLOCK_H);
  ctx.fillStyle = d.col.top;
  ctx.beginPath();
  ctx.moveTo(-d.w/2, -BLOCK_H/2);
  ctx.lineTo(-d.w/2+DEPTH_X, -BLOCK_H/2-DEPTH_Y);
  ctx.lineTo(d.w/2+DEPTH_X, -BLOCK_H/2-DEPTH_Y);
  ctx.lineTo(d.w/2, -BLOCK_H/2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = d.col.side;
  ctx.beginPath();
  ctx.moveTo(d.w/2, -BLOCK_H/2);
  ctx.lineTo(d.w/2+DEPTH_X, -BLOCK_H/2-DEPTH_Y);
  ctx.lineTo(d.w/2+DEPTH_X, -BLOCK_H/2-DEPTH_Y+BLOCK_H);
  ctx.lineTo(d.w/2, BLOCK_H/2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0a0a14');
  g.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  const gs = 40;
  const oy = (camera * 0.3) % gs;
  for (let y = -gs + oy; y < H + gs; y += gs) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for (let x = 0; x < W; x += gs) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
}

// ---- Draw ----
function draw() {
  drawBg();

  if (state === 'title') {
    drawTitleScreen();
    return;
  }

  // Stack
  for (const b of stack) {
    const sy = b.y - camera;
    const isFlash = flashTimer > 0 && b === flashBlock;
    if (isFlash) {
      const pulse = Math.sin(flashTimer * 0.8) * 0.3 + 0.7;
      const flashCol = { top: `hsl(${b.col.hue},90%,${55+pulse*20}%)`, front: `hsl(${b.col.hue},85%,${45+pulse*20}%)`, side: `hsl(${b.col.hue},75%,${35+pulse*15}%)`, glow: '#fff' };
      drawBlock3D(b.x, sy, b.w, flashCol, 1);
    } else {
      drawBlock3D(b.x, sy, b.w, b.col, 1);
    }
  }

  // Moving block
  if (moving && state === 'playing') {
    drawBlock3D(moving.x, moving.y - camera, moving.w, moving.col, 1);
    // Guide line (ghost)
    const prev = stack[stack.length - 1];
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    const gy = prev.y - camera - BLOCK_H;
    ctx.strokeRect(prev.x, gy, prev.w, BLOCK_H);
    ctx.setLineDash([]);
  }

  // Debris
  for (const d of debris) drawDebris(d);

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.col.glow;
    ctx.beginPath();
    ctx.arc(p.x, p.y - camera, p.size, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Popups
  for (const p of popups) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = combo >= 3 ? '#feca57' : '#00d4ff';
    ctx.font = 'bold 22px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.fillText(p.text, p.x, p.y - camera);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;

  // Score display during play
  if (state === 'playing') {
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.9;
    ctx.font = 'bold 48px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 10;
    ctx.fillText(score, W/2, 60);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Game over overlay
  if (state === 'gameover') {
    drawGameOver();
  }
}

function drawTitleScreen() {
  // Sample tower
  const count = 10;
  const baseY = H - 50;
  for (let i = 0; i < count; i++) {
    const w = BASE_WIDTH - i * 4;
    const x = W/2 - w/2 + Math.sin(i * 0.8) * 6;
    const y = baseY - i * BLOCK_H;
    drawBlock3D(x, y, w, blockColor(i), 0.45);
  }

  // Title
  ctx.shadowColor = '#7b2ff7';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 44px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Tower Stack', W/2, H/2 - 80);
  ctx.shadowBlur = 0;

  // Subtitle
  ctx.fillStyle = '#888';
  ctx.font = '18px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('Click to start', W/2, H/2 - 40);

  // Instructions
  ctx.fillStyle = '#555';
  ctx.font = '14px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('Click / Tap / Space to drop blocks', W/2, H/2);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(15, 15, 26, 0.78)';
  ctx.fillRect(0, 0, W, H);

  const pw = 280, ph = 240;
  const px = (W-pw)/2, py = (H-ph)/2 - 20;

  ctx.fillStyle = '#1a1a2e';
  ctx.strokeStyle = '#2a2a4a';
  ctx.lineWidth = 2;
  roundRect(px, py, pw, ph, 16);
  ctx.fill(); ctx.stroke();

  // Title
  ctx.fillStyle = '#ff4757';
  ctx.font = 'bold 34px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over', W/2, py + 52);

  // Height
  ctx.fillStyle = '#e0e0e0';
  ctx.font = '20px "Segoe UI", Tahoma, sans-serif';
  ctx.fillText('Height reached: ' + score, W/2, py + 95);

  // Combo info
  if (score > 0) {
    ctx.fillStyle = '#00d4ff';
    ctx.font = '16px "Segoe UI", Tahoma, sans-serif';
    ctx.fillText(score + ' block' + (score !== 1 ? 's' : '') + ' stacked', W/2, py + 125);
  }

  // Play Again button
  const bw = 160, bh = 42;
  const bx = (W-bw)/2, by = py + ph - 65;

  ctx.fillStyle = '#7b2ff7';
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();

  // Hover glow
  ctx.shadowColor = '#7b2ff7';
  ctx.shadowBlur = 12;
  roundRect(bx, by, bw, bh, 10);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 17px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Play Again', W/2, by + 27);

  // Store button bounds for click detection
  drawGameOver._btn = { x: bx, y: by, w: bw, h: bh };
}

// ---- Game Loop ----
function loop() {
  update();
  draw();
  animFrame = requestAnimationFrame(loop);
}

// ---- Input ----
function handleAction(e) {
  if (state === 'title') {
    startGame();
  } else if (state === 'gameover') {
    // Check if click is on Play Again button
    if (e && e.type === 'click' && drawGameOver._btn) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      const b = drawGameOver._btn;
      if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) {
        startGame();
        return;
      }
    }
    // Space or tap anywhere restarts too
    startGame();
  } else if (state === 'playing') {
    placeBlock();
  }
}

canvas.addEventListener('click', (e) => handleAction(e));
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(e); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') { e.preventDefault(); handleAction(null); }
});

// ---- Theme support ----
function updateColors() {
  // Theme-aware: we use HSL throughout so colors adapt naturally
}
window.addEventListener('themechange', updateColors);

// ---- Initial title draw ----
drawBg();
drawTitleScreen();
// Start loop for animations
loop();
</script>
