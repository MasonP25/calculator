<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }
  h1 { font-size: 2rem; }
  .info { display: flex; gap: 2rem; margin-bottom: 0.8rem; font-size: 1.1rem; }
  .info span { color: #00d4ff; font-weight: bold; }
  canvas { border: 2px solid #2a2a4a; border-radius: 8px; cursor: pointer; }
  .msg { margin-top: 0.8rem; color: #888; min-height: 1.5rem; font-size: 0.9rem; }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Stack</h1>
<div class="info">
  Score: <span id="score">0</span>
  Best: <span id="best">0</span>
</div>
<canvas id="c" width="400" height="600"></canvas>
<div class="msg" id="msg">Click or press Space to start</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const W = canvas.width, H = canvas.height;

// ─── THEME-AWARE COLORS ───
let COL = {
  bg: '#1a1a2e',
  bgGrad: '#0a0a15',
  accent: '#7b2ff7',
  accent2: '#00d4ff',
  text: '#e0e0e0',
  dim: '#888',
  border: '#2a2a4a',
  red: '#ff4757',
  yellow: '#feca57',
};

function updateColors() {
  const t = window.THEME;
  if (!t) return;
  COL.bg = t.canvasBg || '#1a1a2e';
  COL.bgGrad = t.canvasBg2 || '#0a0a15';
  COL.accent = t.accent || '#7b2ff7';
  COL.accent2 = t.accent2 || '#00d4ff';
  COL.text = t.text || '#e0e0e0';
  COL.dim = t.dim || '#888';
  COL.border = t.border || '#2a2a4a';
}
window.addEventListener('themechange', updateColors);

// ─── CONSTANTS ───
const BLOCK_HEIGHT = 22;
const DEPTH_X = 12;
const DEPTH_Y = 10;
const INITIAL_WIDTH = 200;
const INITIAL_SPEED = 2;
const MAX_SPEED = 8;
const SPEED_INCREMENT = 0.12;
const PERFECT_THRESHOLD = 3;

// ─── STATE ───
// state: 'title' | 'playing' | 'gameover'
let state = 'title';
let loopStarted = false;

let stack = [];         // placed blocks: { x, y, w, hue }
let moving = null;      // the block currently sliding
let fallingPieces = []; // trimmed-off pieces falling away
let particles = [];     // perfect placement particles
let popups = [];        // "Perfect!" text popups
let score = 0;
let highScore = 0;
let combo = 0;
let camera = 0;         // vertical camera offset
let targetCamera = 0;
let speed = INITIAL_SPEED;
let direction = 1;      // 1 or -1

highScore = parseInt(localStorage.getItem('stackBest') || '0');
bestEl.textContent = highScore;

// ─── COLOR ───
function blockHue(index) {
  return (index * 18 + 200) % 360;
}

function hslColor(hue, s, l) {
  return `hsl(${hue}, ${s}%, ${l}%)`;
}

// ─── INIT ───
function startGame() {
  score = 0;
  combo = 0;
  camera = 0;
  targetCamera = 0;
  speed = INITIAL_SPEED;
  direction = 1;
  state = 'playing';
  stack = [];
  fallingPieces = [];
  particles = [];
  popups = [];
  moving = null;

  scoreEl.textContent = '0';
  msgEl.textContent = '';

  // Base block (foundation)
  stack.push({
    x: W / 2 - INITIAL_WIDTH / 2,
    y: H - 40,
    w: INITIAL_WIDTH,
    hue: blockHue(0),
  });

  spawnMovingBlock();

  if (!loopStarted) {
    loopStarted = true;
    loop();
  }
}

function spawnMovingBlock() {
  const prev = stack[stack.length - 1];
  const hue = blockHue(stack.length);
  const y = prev.y - BLOCK_HEIGHT;

  // Start from the side the block is approaching from
  const startX = direction === 1 ? -prev.w : W;

  moving = {
    x: startX,
    y: y,
    w: prev.w,
    hue: hue,
  };

  // Increase speed gradually
  speed = Math.min(MAX_SPEED, INITIAL_SPEED + stack.length * SPEED_INCREMENT);
}

// ─── PLACE BLOCK ───
function placeBlock() {
  if (!moving || state !== 'playing') return;

  const prev = stack[stack.length - 1];
  const m = moving;

  // Calculate overlap
  const overlapLeft = Math.max(m.x, prev.x);
  const overlapRight = Math.min(m.x + m.w, prev.x + prev.w);
  const overlapWidth = overlapRight - overlapLeft;

  if (overlapWidth <= 0) {
    // Missed completely - game over
    fallingPieces.push({
      x: m.x, y: m.y, w: m.w, hue: m.hue,
      vy: 0, vx: direction * 2, rot: 0, vrot: direction * 0.05,
    });
    moving = null;
    endGame();
    return;
  }

  // Check for perfect placement
  const diff = Math.abs(m.x - prev.x);
  const isPerfect = diff < PERFECT_THRESHOLD;

  if (isPerfect) {
    // Perfect placement - keep same width, snap to previous position
    const placed = {
      x: prev.x,
      y: m.y,
      w: prev.w,
      hue: m.hue,
    };
    stack.push(placed);
    combo++;

    // Spawn perfect particles
    spawnPerfectParticles(placed);

    // "Perfect!" popup
    popups.push({
      x: placed.x + placed.w / 2,
      y: placed.y - 10,
      text: combo >= 3 ? 'COMBO x' + combo + '!' : 'Perfect!',
      life: 1,
      color: combo >= 3 ? COL.yellow : COL.accent2,
    });

    if (combo >= 3) {
      window.SFX?.combo();
    } else {
      window.SFX?.correct();
    }
  } else {
    // Trimmed placement
    combo = 0;

    const placed = {
      x: overlapLeft,
      y: m.y,
      w: overlapWidth,
      hue: m.hue,
    };
    stack.push(placed);

    // Create falling piece for the trimmed part
    if (m.x < prev.x) {
      // Overhang on left
      const cutW = overlapLeft - m.x;
      if (cutW > 0.5) {
        fallingPieces.push({
          x: m.x, y: m.y, w: cutW, hue: m.hue,
          vy: 0, vx: -1.5, rot: 0, vrot: -0.03,
        });
      }
    }
    if (m.x + m.w > prev.x + prev.w) {
      // Overhang on right
      const cutW = (m.x + m.w) - overlapRight;
      if (cutW > 0.5) {
        fallingPieces.push({
          x: overlapRight, y: m.y, w: cutW, hue: m.hue,
          vy: 0, vx: 1.5, rot: 0, vrot: 0.03,
        });
      }
    }

    window.SFX?.hit();
  }

  // Update score
  score = stack.length - 1;
  scoreEl.textContent = score;

  // Scroll camera up
  const blockWorldY = stack[stack.length - 1].y;
  const targetVisibleY = H * 0.6;
  if (blockWorldY - camera < targetVisibleY) {
    targetCamera = blockWorldY - targetVisibleY;
  }

  // Alternate direction
  direction *= -1;

  // Check if block is too narrow
  if (stack[stack.length - 1].w < 3) {
    moving = null;
    endGame();
    return;
  }

  if (!isPerfect) {
    window.SFX?.place();
  }

  spawnMovingBlock();
}

function endGame() {
  state = 'gameover';
  moving = null;

  window.SFX?.fail();

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('stackBest', highScore);
    bestEl.textContent = highScore;
    window.SFX?.win();
  }

  window.HallOfFame?.submit('stack', score);
  msgEl.textContent = 'Click or press Space to restart';
}

// ─── PARTICLES ───
function spawnPerfectParticles(block) {
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: block.x + Math.random() * block.w,
      y: block.y + Math.random() * BLOCK_HEIGHT,
      vx: (Math.random() - 0.5) * 6,
      vy: -(Math.random() * 4 + 1),
      life: 1,
      decay: 0.015 + Math.random() * 0.02,
      size: 2 + Math.random() * 3,
      hue: block.hue,
    });
  }
}

// ─── UPDATE ───
function update() {
  // Move the sliding block (only while playing)
  if (state === 'playing' && moving) {
    moving.x += speed * direction;

    // Bounce off edges
    if (direction === 1 && moving.x > W) {
      moving.x = W;
      direction = -1;
    } else if (direction === -1 && moving.x + moving.w < 0) {
      moving.x = -moving.w;
      direction = 1;
    }
  }

  // Smooth camera scroll (always, so it finishes during game over)
  camera += (targetCamera - camera) * 0.08;

  // Update falling pieces (always, for game-over animation)
  for (let i = fallingPieces.length - 1; i >= 0; i--) {
    const f = fallingPieces[i];
    f.vy += 0.3;
    f.y += f.vy;
    f.x += f.vx;
    f.rot += f.vrot;
    if (f.y - camera > H + 200) {
      fallingPieces.splice(i, 1);
    }
  }

  // Update particles (always)
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.08;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update popups (always)
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 0.8;
    p.life -= 0.012;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

// ─── DRAW ───
function drawBlock3D(x, y, w, hue, alpha) {
  const screenY = y - camera;
  if (screenY > H + 50 || screenY + BLOCK_HEIGHT + DEPTH_Y < -50) return;

  ctx.globalAlpha = alpha != null ? alpha : 1;

  const topColor = hslColor(hue, 65, 55);
  const frontColor = hslColor(hue, 65, 42);
  const sideColor = hslColor(hue, 65, 32);
  const highlight = hslColor(hue, 70, 70);

  // Top face (parallelogram)
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(x, screenY);
  ctx.lineTo(x + DEPTH_X, screenY - DEPTH_Y);
  ctx.lineTo(x + w + DEPTH_X, screenY - DEPTH_Y);
  ctx.lineTo(x + w, screenY);
  ctx.closePath();
  ctx.fill();

  // Top face highlight line
  ctx.strokeStyle = highlight;
  ctx.lineWidth = 0.5;
  ctx.stroke();

  // Front face
  ctx.fillStyle = frontColor;
  ctx.fillRect(x, screenY, w, BLOCK_HEIGHT);

  // Front face subtle gradient overlay
  const grad = ctx.createLinearGradient(x, screenY, x, screenY + BLOCK_HEIGHT);
  grad.addColorStop(0, 'rgba(255,255,255,0.08)');
  grad.addColorStop(1, 'rgba(0,0,0,0.12)');
  ctx.fillStyle = grad;
  ctx.fillRect(x, screenY, w, BLOCK_HEIGHT);

  // Front face border
  ctx.strokeStyle = hslColor(hue, 50, 28);
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x, screenY, w, BLOCK_HEIGHT);

  // Right side face
  ctx.fillStyle = sideColor;
  ctx.beginPath();
  ctx.moveTo(x + w, screenY);
  ctx.lineTo(x + w + DEPTH_X, screenY - DEPTH_Y);
  ctx.lineTo(x + w + DEPTH_X, screenY - DEPTH_Y + BLOCK_HEIGHT);
  ctx.lineTo(x + w, screenY + BLOCK_HEIGHT);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = hslColor(hue, 50, 25);
  ctx.lineWidth = 0.5;
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function drawFallingBlock(piece) {
  const screenY = piece.y - camera;
  if (screenY > H + 100 || screenY < -100) return;

  ctx.save();
  ctx.translate(piece.x + piece.w / 2, screenY + BLOCK_HEIGHT / 2);
  ctx.rotate(piece.rot);
  ctx.globalAlpha = Math.max(0, 1 - (piece.vy / 15));

  const topColor = hslColor(piece.hue, 65, 55);
  const frontColor = hslColor(piece.hue, 65, 42);
  const sideColor = hslColor(piece.hue, 65, 32);

  // Front face
  ctx.fillStyle = frontColor;
  ctx.fillRect(-piece.w / 2, -BLOCK_HEIGHT / 2, piece.w, BLOCK_HEIGHT);

  // Top face
  ctx.fillStyle = topColor;
  ctx.beginPath();
  ctx.moveTo(-piece.w / 2, -BLOCK_HEIGHT / 2);
  ctx.lineTo(-piece.w / 2 + DEPTH_X, -BLOCK_HEIGHT / 2 - DEPTH_Y);
  ctx.lineTo(piece.w / 2 + DEPTH_X, -BLOCK_HEIGHT / 2 - DEPTH_Y);
  ctx.lineTo(piece.w / 2, -BLOCK_HEIGHT / 2);
  ctx.closePath();
  ctx.fill();

  // Right side face
  ctx.fillStyle = sideColor;
  ctx.beginPath();
  ctx.moveTo(piece.w / 2, -BLOCK_HEIGHT / 2);
  ctx.lineTo(piece.w / 2 + DEPTH_X, -BLOCK_HEIGHT / 2 - DEPTH_Y);
  ctx.lineTo(piece.w / 2 + DEPTH_X, -BLOCK_HEIGHT / 2 - DEPTH_Y + BLOCK_HEIGHT);
  ctx.lineTo(piece.w / 2, BLOCK_HEIGHT / 2);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawBackground() {
  // Gradient background
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, COL.bgGrad);
  grad.addColorStop(1, COL.bg);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Subtle grid lines that scroll with camera
  ctx.strokeStyle = 'rgba(255,255,255,0.02)';
  ctx.lineWidth = 1;
  const gridSize = 40;
  const offsetY = (camera * 0.3) % gridSize;
  for (let y = -gridSize + offsetY; y < H + gridSize; y += gridSize) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  for (let x = 0; x < W; x += gridSize) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
}

function draw() {
  drawBackground();

  // Draw placed stack blocks (bottom to top)
  for (let i = 0; i < stack.length; i++) {
    const b = stack[i];
    drawBlock3D(b.x, b.y, b.w, b.hue, 1);
  }

  // Draw moving block
  if (moving && state === 'playing') {
    drawBlock3D(moving.x, moving.y, moving.w, moving.hue, 1);
  }

  // Draw falling pieces
  for (const f of fallingPieces) {
    drawFallingBlock(f);
  }

  // Draw particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = hslColor(p.hue, 80, 70);
    ctx.beginPath();
    ctx.arc(p.x, p.y - camera, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Draw popups
  for (const p of popups) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y - camera);
  }
  ctx.globalAlpha = 1;

  // Draw game over overlay
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(15, 15, 26, 0.75)';
    ctx.fillRect(0, 0, W, H);

    // Panel
    const panelW = 260;
    const panelH = 210;
    const panelX = (W - panelW) / 2;
    const panelY = (H - panelH) / 2 - 20;

    ctx.fillStyle = '#1a1a2e';
    ctx.strokeStyle = '#2a2a4a';
    ctx.lineWidth = 2;
    roundRect(ctx, panelX, panelY, panelW, panelH, 16);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = COL.red;
    ctx.font = 'bold 32px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W / 2, panelY + 50);

    ctx.fillStyle = COL.text;
    ctx.font = '18px "Segoe UI", Tahoma, sans-serif';
    ctx.fillText('Score: ' + score, W / 2, panelY + 90);

    ctx.fillStyle = COL.accent2;
    ctx.fillText('Best: ' + highScore, W / 2, panelY + 118);

    if (score >= highScore && score > 0) {
      ctx.fillStyle = COL.yellow;
      ctx.font = 'bold 16px "Segoe UI", Tahoma, sans-serif';
      ctx.fillText('New High Score!', W / 2, panelY + 148);
    }

    // Restart button
    const btnW = 140;
    const btnH = 38;
    const btnX = (W - btnW) / 2;
    const btnY = panelY + panelH - 52;

    ctx.fillStyle = COL.accent;
    roundRect(ctx, btnX, btnY, btnW, btnH, 8);
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 15px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Play Again', W / 2, btnY + 24);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── GAME LOOP ───
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ─── INPUT ───
function handleAction() {
  if (state === 'title') {
    startGame();
    return;
  }
  if (state === 'gameover') {
    startGame();
    return;
  }
  if (state === 'playing') {
    placeBlock();
  }
}

canvas.addEventListener('click', handleAction);

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  handleAction();
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    handleAction();
  }
});

// ─── TITLE SCREEN ───
function drawTitleScreen() {
  drawBackground();

  // Draw a decorative sample stack
  const sampleCount = 10;
  const baseY = H - 40;
  for (let i = 0; i < sampleCount; i++) {
    const w = INITIAL_WIDTH - i * 5;
    const x = W / 2 - w / 2 + Math.sin(i * 0.7) * 8;
    const y = baseY - i * BLOCK_HEIGHT;
    drawBlock3D(x, y, w, blockHue(i), 0.5);
  }

  // Title text with glow
  ctx.shadowColor = COL.accent;
  ctx.shadowBlur = 15;
  ctx.fillStyle = COL.text;
  ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Click or press Space to start', W / 2, H / 2 - 60);
  ctx.shadowBlur = 0;
}

drawTitleScreen();
</script>
<script src="sound.js"></script>
<script src="fame.js"></script>
<script type="module" src="firebase-lb.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=3"></script>
</body>
</html>
