<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0f0f1a;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;

  .score-box {

  .game-area {

  canvas {
    display: block;

  .save-quit-btn {

  .overlay {

  .overlay.show { display: flex; }
  .overlay h2 {

  .overlay .final-score { font-size: 1.3rem; color: #ccc; }
  .overlay button {
    margin-top: 8px;
    padding: 12px 36px;

    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    color: #fff;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .overlay button:hover { transform: scale(1.05); }
  .merge-label {
    position: absolute;
    pointer-events: none;
    font-weight: 800;

  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }

<body>
<a class="back" href="index.html">&larr; Back</a>

<div class="game-header">
  <div class="game-title">Fruit Merge</div>
  <div class="next-preview">
    <div class="label">Next</div>
    <div class="fruit" id="nextFruit"></div>
  </div>
  <div class="score-box"><div class="label">Score</div><div class="value" id="scoreVal">0</div></div>
  <div class="score-box"><div class="label">Best</div><div class="value" id="bestVal">0</div></div>
  <button class="save-quit-btn" id="saveQuitBtn">Save &amp; Quit</button>
</div>

<div class="game-area">
  <div class="bin-wrapper" id="binWrapper">
    <div class="drop-line"></div>
    <div class="aim-line" id="aimLine"></div>
    <canvas id="gc"></canvas>
  </div>
</div>

<div class="overlay" id="gameOverOverlay">
  <h2>Game Over</h2>
  <div class="final-score" id="finalScore">Score: 0</div>
  <button id="restartBtn">Play Again</button>
</div>

<script>
(function(){
  // ---- Fruit definitions ----
  const FRUITS = [
    { name:'Cherry',      emoji:'&#127826;', color:'#e74c3c', r:14, points:1   },
    { name:'Grape',       emoji:'&#127815;', color:'#8e44ad', r:18, points:3   },
    { name:'Strawberry',  emoji:'&#127827;', color:'#ff6b81', r:22, points:6   },
    { name:'Orange',      emoji:'&#127818;', color:'#f39c12', r:27, points:10  },
    { name:'Apple',       emoji:'&#127822;', color:'#27ae60', r:32, points:15  },
    { name:'Pear',        emoji:'&#127824;', color:'#a8d948', r:37, points:21  },
    { name:'Peach',       emoji:'&#127825;', color:'#fdcb6e', r:42, points:28  },
    { name:'Pineapple',   emoji:'&#127821;', color:'#f9ca24', r:48, points:36  },
    { name:'Melon',       emoji:'&#127816;', color:'#2ecc71', r:55, points:45  },
    { name:'Watermelon',  emoji:'&#127817;', color:'#1abc9c', r:62, points:55  },
  ];

  // Only drop fruits 0-4 (cherry through apple)
  const DROP_MAX = 4;

  // ---- Canvas / sizing ----
  const canvas = document.getElementById('gc');
  const ctx = canvas.getContext('2d');
  const binWrapper = document.getElementById('binWrapper');
  const aimLine = document.getElementById('aimLine');
  const scoreEl = document.getElementById('scoreVal');
  const bestEl = document.getElementById('bestVal');
  const nextFruitEl = document.getElementById('nextFruit');
  const overlay = document.getElementById('gameOverOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const restartBtn = document.getElementById('restartBtn');

  let W, H;
  const WALL = 3; // border width accounted in CSS

  function resize() {
    const vh = window.innerHeight;
    const headerH = 60;
    const topPad = 6;
    const availH = vh - headerH - topPad - 60;
    H = Math.min(availH, 640);
    W = Math.min(Math.floor(H * 0.55), 360);
    if (W > window.innerWidth - 20) {
      W = window.innerWidth - 20;
      H = Math.min(Math.floor(W / 0.55), availH);
    }
    canvas.width = W;
    canvas.height = H;
    binWrapper.style.width = (W + 6) + 'px';
    aimLine.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', () => { resize(); });

  // ---- Game state ----
  let fruits = [];
  let score = 0;
  let best = parseInt(localStorage.getItem('fruitmerge_best') || '0');
  bestEl.textContent = best;
  let currentType = randType();
  let nextType = randType();
  let dropX = W / 2;
  let canDrop = true;
  let gameOver = false;
  let animId;
  let lastTime = 0;
  const GRAVITY = 800;
  const DAMPING = 0.7;
  const FRICTION = 0.4;
  const DANGER_Y = 50; // "top line" threshold
  let dangerTimer = 0; // how long fruits have been above line
  const DANGER_LIMIT = 1.5; // seconds above line before game over
  let mergesThisFrame = [];

  function randType() {
    // weighted: smaller fruits more likely
    const weights = [35, 28, 20, 12, 5];
    const total = weights.reduce((a,b) => a+b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return 0;
  }

  function spawnFruit(type, x, y, vx, vy) {
    const f = FRUITS[type];
    return {
      type, x, y,
      vx: vx || 0,
      vy: vy || 0,
      r: f.r,
      settled: false,
      merging: false,
      mergeTimer: 0,
      alive: true,
      justDropped: true,
      dropGrace: 0.5,
    };
  }

  // ---- Input ----
  function getCanvasX(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    return clientX - rect.left;
  }

  function clampX(x, type) {
    const r = FRUITS[type].r;
    return Math.max(r, Math.min(W - r, x));
  }

  canvas.addEventListener('mousemove', (e) => {
    if (gameOver) return;
    dropX = clampX(getCanvasX(e), currentType);
    aimLine.style.left = (dropX + WALL - 1) + 'px';
  });
  canvas.addEventListener('touchmove', (e) => {
    if (gameOver) return;
    e.preventDefault();
    dropX = clampX(getCanvasX(e), currentType);
    aimLine.style.left = (dropX + WALL - 1) + 'px';
  }, { passive: false });

  canvas.addEventListener('click', doDrop);
  canvas.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) doDrop(e);
  });

  function doDrop(e) {
    if (!canDrop || gameOver) return;
    canDrop = false;
    const fr = spawnFruit(currentType, dropX, FRUITS[currentType].r + 2, 0, 0);
    fruits.push(fr);
    currentType = nextType;
    nextType = randType();
    updateNextPreview();
    dropX = clampX(dropX, currentType);
    setTimeout(() => { canDrop = true; }, 350);
  }

  function updateNextPreview() {
    nextFruitEl.innerHTML = FRUITS[nextType].emoji;
  }
  updateNextPreview();
  aimLine.style.left = (W/2 + WALL - 1) + 'px';

  // ---- Physics ----
  function step(dt) {
    if (dt > 0.05) dt = 0.05;

    // Apply gravity and move
    for (const f of fruits) {
      if (!f.alive) continue;
      f.vy += GRAVITY * dt;
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.dropGrace -= dt;
    }

    // Wall collisions
    for (const f of fruits) {
      if (!f.alive) continue;
      // Floor
      if (f.y + f.r > H) {
        f.y = H - f.r;
        f.vy = -f.vy * DAMPING;
        f.vx *= (1 - FRICTION * 0.5);
        if (Math.abs(f.vy) < 10) f.vy = 0;
      }
      // Left wall
      if (f.x - f.r < 0) {
        f.x = f.r;
        f.vx = -f.vx * DAMPING;
      }
      // Right wall
      if (f.x + f.r > W) {
        f.x = W - f.r;
        f.vx = -f.vx * DAMPING;
      }
    }

    // Circle-circle collision + merge detection
    mergesThisFrame = [];
    for (let i = 0; i < fruits.length; i++) {
      const a = fruits[i];
      if (!a.alive) continue;
      for (let j = i + 1; j < fruits.length; j++) {
        const b = fruits[j];
        if (!b.alive) continue;
        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = a.r + b.r;
        if (dist < minDist && dist > 0.01) {
          // Resolve overlap
          const nx = dx / dist;
          const ny = dy / dist;
          const overlap = minDist - dist;
          const pushFactor = 0.5;
          a.x -= nx * overlap * pushFactor;
          a.y -= ny * overlap * pushFactor;
          b.x += nx * overlap * pushFactor;
          b.y += ny * overlap * pushFactor;

          // Bounce
          const relVx = a.vx - b.vx;
          const relVy = a.vy - b.vy;
          const relDot = relVx * nx + relVy * ny;
          if (relDot > 0) {
            const impulse = relDot * DAMPING;
            a.vx -= impulse * nx;
            a.vy -= impulse * ny;
            b.vx += impulse * nx;
            b.vy += impulse * ny;
          }

          // Merge check
          if (a.type === b.type && a.type < FRUITS.length - 1) {
            mergesThisFrame.push({ i, j });
          }
        }
      }
    }

    // Process merges
    const removed = new Set();
    for (const m of mergesThisFrame) {
      const a = fruits[m.i];
      const b = fruits[m.j];
      if (removed.has(m.i) || removed.has(m.j)) continue;
      if (!a.alive || !b.alive) continue;
      removed.add(m.i);
      removed.add(m.j);
      a.alive = false;
      b.alive = false;

      const newType = a.type + 1;
      const mx = (a.x + b.x) / 2;
      const my = (a.y + b.y) / 2;
      const nf = spawnFruit(newType, mx, my, (a.vx + b.vx) * 0.3, (a.vy + b.vy) * 0.3 - 80);
      nf.dropGrace = 0;
      nf.justDropped = false;
      fruits.push(nf);

      const pts = FRUITS[newType].points;
      score += pts;
      scoreEl.textContent = score;

      showMergeLabel(mx, my, '+' + pts, newType);
    }

    // Remove dead
    fruits = fruits.filter(f => f.alive);

    // Check game over: any fruit above danger line for too long
    let anyAbove = false;
    for (const f of fruits) {
      if (f.dropGrace > 0) continue;
      if (f.y - f.r < DANGER_Y) {
        anyAbove = true;
        break;
      }
    }
    if (anyAbove) {
      dangerTimer += dt;
      if (dangerTimer >= DANGER_LIMIT) {
        endGame();
      }
    } else {
      dangerTimer = 0;
    }
  }

  function showMergeLabel(x, y, text, type) {
    const rect = canvas.getBoundingClientRect();
    const lbl = document.createElement('div');
    lbl.className = 'merge-label';
    lbl.textContent = text;
    lbl.style.left = (rect.left + x) + 'px';
    lbl.style.top = (rect.top + y - 20) + 'px';
    lbl.style.color = FRUITS[type].color;
    document.body.appendChild(lbl);
    setTimeout(() => lbl.remove(), 700);
  }

  // ---- Rendering ----
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Danger line
    ctx.save();
    ctx.strokeStyle = dangerTimer > 0 ? 'rgba(255,60,60,0.6)' : 'rgba(255,60,60,0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(0, DANGER_Y);
    ctx.lineTo(W, DANGER_Y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Draw current drop preview
    if (canDrop && !gameOver) {
      const f = FRUITS[currentType];
      ctx.save();
      ctx.globalAlpha = 0.35;
      ctx.beginPath();
      ctx.arc(dropX, f.r + 2, f.r, 0, Math.PI * 2);
      ctx.fillStyle = f.color;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.font = (f.r * 1.1) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(decodeEmoji(f.emoji), dropX, f.r + 3);
      ctx.restore();
    }

    // Draw fruits
    for (const fr of fruits) {
      if (!fr.alive) continue;
      const f = FRUITS[fr.type];
      ctx.save();

      // Colored circle
      const grad = ctx.createRadialGradient(fr.x - fr.r * 0.3, fr.y - fr.r * 0.3, fr.r * 0.1, fr.x, fr.y, fr.r);
      grad.addColorStop(0, lightenColor(f.color, 40));
      grad.addColorStop(1, f.color);
      ctx.beginPath();
      ctx.arc(fr.x, fr.y, fr.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Emoji
      ctx.font = (fr.r * 1.1) + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(decodeEmoji(f.emoji), fr.x, fr.y + 1);

      ctx.restore();
    }
  }

  const emojiDiv = document.createElement('div');
  function decodeEmoji(html) {
    emojiDiv.innerHTML = html;
    return emojiDiv.textContent;
  }

  function lightenColor(hex, amt) {
    let r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    r = Math.min(255, r + amt); g = Math.min(255, g + amt); b = Math.min(255, b + amt);
    return '#' + [r,g,b].map(c => c.toString(16).padStart(2,'0')).join('');
  }

  // ---- Game loop ----
  function loop(ts) {
    if (gameOver) return;
    const dt = lastTime ? (ts - lastTime) / 1000 : 1/60;
    lastTime = ts;
    step(dt);
    draw();
    animId = requestAnimationFrame(loop);
  }

  function startGame() {
    fruits = [];
    score = 0;
    scoreEl.textContent = 0;
    dangerTimer = 0;
    gameOver = false;
    canDrop = true;
    currentType = randType();
    nextType = randType();
    updateNextPreview();
    dropX = W / 2;
    aimLine.style.left = (W/2 + WALL - 1) + 'px';
    overlay.classList.remove('show');
    lastTime = 0;
    animId = requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    cancelAnimationFrame(animId);
    if (score > best) {
      best = score;
      localStorage.setItem('fruitmerge_best', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = 'Score: ' + score;
    overlay.classList.add('show');
    if (window.HallOfFame) window.HallOfFame.submit('fruitmerge', score);
  }

  // ---- Save & Load (Firebase persistence) ----
  function getUsername() {
    return localStorage.getItem('arcade_currentUser') || null;
  }

  function serializeGame() {
    return {
      fruits: fruits.map(f => ({ type: f.type, x: Math.round(f.x*10)/10, y: Math.round(f.y*10)/10, vx: Math.round(f.vx*10)/10, vy: Math.round(f.vy*10)/10 })),
      score: score,
      currentType: currentType,
      nextType: nextType,
      dropX: dropX,
      ts: Date.now()
    };
  }

  function deserializeGame(data) {
    fruits = [];
    for (const fd of data.fruits) {
      const fr = spawnFruit(fd.type, fd.x, fd.y, fd.vx || 0, fd.vy || 0);
      fr.dropGrace = 0;
      fr.justDropped = false;
      fruits.push(fr);
    }
    score = data.score || 0;
    scoreEl.textContent = score;
    currentType = data.currentType || randType();
    nextType = data.nextType || randType();
    dropX = data.dropX || W / 2;
    updateNextPreview();
    aimLine.style.left = (dropX + WALL - 1) + 'px';
    dangerTimer = 0;
    gameOver = false;
    canDrop = true;
    overlay.classList.remove('show');
    lastTime = 0;
    animId = requestAnimationFrame(loop);
  }

  // Firebase helper for save/load
  let _fmDb = null;
  async function _getFmDb() {
    if (_fmDb) return _fmDb;
    const [appMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js')
    ]);
    const config = {
      apiKey: "AIzaSyCyK7tEcAaqrVNFRggviaEmWH2SMkiwGKk",
      authDomain: "calculator-81d08.firebaseapp.com",
      projectId: "calculator-81d08",
      storageBucket: "calculator-81d08.firebasestorage.app",
      messagingSenderId: "375406495739",
      appId: "1:375406495739:web:fd28553263599864426d5e"
    };
    let app;
    try { app = appMod.initializeApp(config, 'fruitmerge-app'); }
    catch(e) { try { app = appMod.getApp('fruitmerge-app'); } catch(e2) { app = appMod.initializeApp(config, 'fruitmerge-app-' + Date.now()); } }
    _fmDb = fsMod.getFirestore(app);
    return _fmDb;
  }

  async function saveGame() {
    const user = getUsername();
    if (!user) { alert('Sign in to save your game!'); return; }
    try {
      const { doc, setDoc } = await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js');
      const db = await _getFmDb();
      const saveData = serializeGame();
      await setDoc(doc(db, 'users', user), { fruitmerge_save: JSON.stringify(saveData) }, { merge: true });
      // Submit score to leaderboard
      if (window.HallOfFame) window.HallOfFame.submit('fruitmerge', score);
      // Go back to index
      window.location.href = 'index.html';
    } catch (e) {
      console.error('Save failed:', e);
      alert('Save failed: ' + e.message);
    }
  }

  async function loadGame() {
    const user = getUsername();
    if (!user) return null;
    try {
      const { doc, getDoc } = await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js');
      const db = await _getFmDb();
      const snap = await getDoc(doc(db, 'users', user));
      if (snap.exists() && snap.data().fruitmerge_save) {
        return JSON.parse(snap.data().fruitmerge_save);
      }
    } catch (e) { console.error('Load failed:', e); }
    return null;
  }

  async function clearSave() {
    const user = getUsername();
    if (!user) return;
    try {
      const { doc, updateDoc, deleteField } = await import('https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js');
      const db = await _getFmDb();
      await updateDoc(doc(db, 'users', user), { fruitmerge_save: deleteField() });
    } catch (e) {}
  }

  document.getElementById('saveQuitBtn').addEventListener('click', () => {
    if (gameOver) { window.location.href = 'index.html'; return; }
    saveGame();
  });

  // ---- End game: clear save ----
  const origEndGame = endGame;
  endGame = function() {
    origEndGame();
    clearSave();
  };

  restartBtn.addEventListener('click', () => {
    clearSave();
    startGame();
  });

  // ---- Init: try to load saved game ----
  startGame();
  (async () => {
    const saved = await loadGame();
    if (saved && saved.fruits && saved.fruits.length > 0) {
      // Check if save is less than 7 days old
      if (saved.ts && Date.now() - saved.ts < 7 * 24 * 60 * 60 * 1000) {
        cancelAnimationFrame(animId);
        gameOver = false;
        deserializeGame(saved);
      }
    }
  })();
})();
</script>
