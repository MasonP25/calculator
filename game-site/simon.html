<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon Says</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    user-select: none;
  }
  h1 { font-size: 2rem; background: linear-gradient(135deg, #00d4ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

  .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }

  .game-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    width: 100%;
    max-width: 500px;
  }

  /* Scores row */
  .scores {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 0.3rem;
  }
  .scores .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.1rem;
  }
  .scores .label { color: #888; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .scores .val { color: #00d4ff; font-size: 1.5rem; font-weight: 700; }

  /* Strict mode toggle */
  .mode-row {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 0.3rem;
  }
  .mode-label { color: #888; font-size: 0.8rem; }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #2a2a4a;
    border-radius: 12px;
    transition: background 0.3s;
  }
  .toggle .slider::before {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    background: #888;
    border-radius: 50%;
    transition: all 0.3s;
  }
  .toggle input:checked + .slider {
    background: #7b2ff7;
  }
  .toggle input:checked + .slider::before {
    transform: translateX(20px);
    background: #e0e0e0;
  }

  /* Simon board */
  .simon-board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    width: 320px;
    height: 320px;
    padding: 10px;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 20px;
    position: relative;
  }

  .simon-btn {
    border-radius: 16px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .simon-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 16px;
    background: rgba(255,255,255,0);
    transition: background 0.15s;
  }
  .simon-btn.disabled { cursor: default; }

  /* Button colors */
  .simon-btn.red    { background: #8b1a1a; }
  .simon-btn.blue   { background: #1a3a8b; }
  .simon-btn.green  { background: #1a6b2a; }
  .simon-btn.yellow { background: #8b7a1a; }

  /* Active (lit up) states */
  .simon-btn.red.active    { background: #ff3b3b; box-shadow: 0 0 30px rgba(255,59,59,0.6), inset 0 0 20px rgba(255,255,255,0.2); }
  .simon-btn.blue.active   { background: #3b7bff; box-shadow: 0 0 30px rgba(59,123,255,0.6), inset 0 0 20px rgba(255,255,255,0.2); }
  .simon-btn.green.active  { background: #3bff5b; box-shadow: 0 0 30px rgba(59,255,91,0.6), inset 0 0 20px rgba(255,255,255,0.2); }
  .simon-btn.yellow.active { background: #ffeb3b; box-shadow: 0 0 30px rgba(255,235,59,0.6), inset 0 0 20px rgba(255,255,255,0.2); }

  /* Pressed (player click) */
  .simon-btn.pressed::after {
    background: rgba(255,255,255,0.15);
  }

  /* Error flash */
  .simon-btn.error {
    background: #ff0040 !important;
    box-shadow: 0 0 40px rgba(255,0,64,0.8) !important;
  }

  /* Center status */
  .center-status {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 0.1rem;
    z-index: 2;
    pointer-events: none;
  }
  .center-status .round-num {
    font-size: 1.6rem;
    font-weight: 700;
    color: #00d4ff;
    line-height: 1;
  }
  .center-status .round-label {
    font-size: 0.55rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Message */
  .message-area {
    min-height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .message {
    padding: 0.4rem 1.5rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .message.show { opacity: 1; }
  .message.info { background: #1a1a2e; color: #00d4ff; border: 1px solid #2a2a4a; }
  .message.error { background: #ff4757; color: #fff; }
  .message.success { background: #35d073; color: #0f0f1a; }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 0.8rem;
  }
  .action-btn {
    background: linear-gradient(135deg, #7b2ff7, #2a2a4a);
    border: none;
    color: #e0e0e0;
    padding: 0.6rem 2rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
  }
  .action-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(123,47,247,0.3); }
  .action-btn:disabled { opacity: 0.4; cursor: default; transform: none; box-shadow: none; }

  /* Keyboard hints */
  .hints {
    color: #555;
    font-size: 0.7rem;
    text-align: center;
    line-height: 1.6;
  }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>
</head>
<body>

<a class="back" href="index.html">&#8592; Back</a>
<h1>Simon Says</h1>

<p class="subtitle">Watch the sequence, then repeat it from memory</p>

<div class="game-container">
  <div class="scores">
    <div class="stat"><span class="label">Round</span><span class="val" id="round">0</span></div>
    <div class="stat"><span class="label">High Score</span><span class="val" id="high-score">0</span></div>
  </div>

  <div class="mode-row">
    <span class="mode-label">Strict Mode</span>
    <label class="toggle">
      <input type="checkbox" id="strict-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="simon-board" id="simon-board">
    <button class="simon-btn red disabled" data-color="red" data-index="0"></button>
    <button class="simon-btn blue disabled" data-color="blue" data-index="1"></button>
    <button class="simon-btn green disabled" data-color="green" data-index="2"></button>
    <button class="simon-btn yellow disabled" data-color="yellow" data-index="3"></button>
    <div class="center-status">
      <span class="round-num" id="center-round">-</span>
      <span class="round-label">Round</span>
    </div>
  </div>

  <div class="message-area">
    <div class="message" id="message"></div>
  </div>

  <div class="btn-row">
    <button class="action-btn" id="start-btn">Start</button>
  </div>

  <div class="hints">
    Keyboard: <strong>1</strong> or <strong>Arrow Up</strong> = Red &nbsp;|&nbsp;
    <strong>2</strong> or <strong>Arrow Right</strong> = Blue<br>
    <strong>3</strong> or <strong>Arrow Down</strong> = Green &nbsp;|&nbsp;
    <strong>4</strong> or <strong>Arrow Left</strong> = Yellow
  </div>
</div>

<script>
function _gb(k,f){return(window.HallOfFame?window.HallOfFame.getBest(k,f):localStorage.getItem(k))||f}
function _sb(k,v){window.HallOfFame?window.HallOfFame.setBest(k,v):localStorage.setItem(k,v)}
(function() {
  const COLORS = ['red', 'blue', 'green', 'yellow'];
  const BASE_SPEED = 600;  // ms for initial flash duration
  const MIN_SPEED = 200;   // fastest flash duration

  let sequence = [];
  let playerIndex = 0;
  let round = 0;
  let isPlaying = false;      // is a sequence being shown
  let isPlayerTurn = false;   // can the player click
  let gameActive = false;
  let strictMode = false;
  let highScore = parseInt(_gb('simon_high', '0'));

  const roundEl = document.getElementById('round');
  const highScoreEl = document.getElementById('high-score');
  const centerRoundEl = document.getElementById('center-round');
  const messageEl = document.getElementById('message');
  const startBtn = document.getElementById('start-btn');
  const strictToggle = document.getElementById('strict-toggle');
  const buttons = document.querySelectorAll('.simon-btn');

  highScoreEl.textContent = highScore;

  function getFlashDuration() {
    // Speed increases as rounds progress
    return Math.max(MIN_SPEED, BASE_SPEED - (round - 1) * 30);
  }

  function showMessage(text, type) {
    messageEl.textContent = text;
    messageEl.className = 'message show ' + type;
  }

  function clearMessage() {
    messageEl.className = 'message';
  }

  function lightUp(colorIndex, duration) {
    return new Promise(resolve => {
      const btn = buttons[colorIndex];
      btn.classList.add('active');
      setTimeout(() => {
        btn.classList.remove('active');
        setTimeout(resolve, duration * 0.3); // gap between flashes
      }, duration);
    });
  }

  async function playSequence() {
    isPlaying = true;
    isPlayerTurn = false;
    disableButtons(true);
    showMessage('Watch...', 'info');

    await sleep(500);

    const duration = getFlashDuration();

    for (let i = 0; i < sequence.length; i++) {
      await lightUp(sequence[i], duration);
    }

    isPlaying = false;
    isPlayerTurn = true;
    playerIndex = 0;
    disableButtons(false);
    showMessage('Your turn!', 'info');
  }

  function addToSequence() {
    sequence.push(Math.floor(Math.random() * 4));
    round = sequence.length;
    roundEl.textContent = round;
    centerRoundEl.textContent = round;
  }

  function disableButtons(disabled) {
    buttons.forEach(btn => {
      if (disabled) {
        btn.classList.add('disabled');
      } else {
        btn.classList.remove('disabled');
      }
    });
  }

  function flashButton(index) {
    const btn = buttons[index];
    btn.classList.add('active', 'pressed');
    setTimeout(() => {
      btn.classList.remove('active', 'pressed');
    }, 200);
  }

  async function handlePlayerInput(colorIndex) {
    if (!isPlayerTurn || isPlaying || !gameActive) return;

    flashButton(colorIndex);

    if (colorIndex === sequence[playerIndex]) {
      // Correct
      if(window.SFX) window.SFX.click();
      playerIndex++;

      if (playerIndex === sequence.length) {
        // Completed this round
        if(window.SFX) window.SFX.levelup();
        isPlayerTurn = false;
        disableButtons(true);
        showMessage('Correct!', 'success');

        if (round > highScore) {
          highScore = round;
          _sb('simon_high', highScore);
          highScoreEl.textContent = highScore;
        }

        await sleep(1000);
        addToSequence();
        playSequence();
      }
    } else {
      // Wrong!
      if(window.SFX) window.SFX.wrong();
      await handleMistake();
    }
  }

  async function handleMistake() {
    isPlayerTurn = false;
    disableButtons(true);

    // Flash all buttons red
    buttons.forEach(btn => btn.classList.add('error'));
    await sleep(600);
    buttons.forEach(btn => btn.classList.remove('error'));

    if (strictMode) {
      // Strict mode: game over
      gameOver();
    } else {
      // Normal mode: submit score then retry same sequence
      const finalRound = round > 0 ? round - 1 : 0;
      if(finalRound > 0 && window.HallOfFame) window.HallOfFame.submit('simon', finalRound);
      showMessage('Wrong! Try again...', 'error');
      await sleep(1000);
      playSequence();
    }
  }

  function gameOver() {
    gameActive = false;
    isPlayerTurn = false;
    if(window.SFX) window.SFX.fail();

    if (round > highScore) {
      highScore = round;
      _sb('simon_high', highScore);
      highScoreEl.textContent = highScore;
    }

    const finalRound = round > 0 ? round - 1 : 0;
    if(finalRound > 0 && window.HallOfFame) window.HallOfFame.submit('simon', finalRound);
    showMessage('Game Over! You reached round ' + round + '. Score: ' + finalRound, 'error');
    startBtn.textContent = 'Play Again';
    startBtn.disabled = false;
  }

  function startGame() {
    sequence = [];
    playerIndex = 0;
    round = 0;
    gameActive = true;
    strictMode = strictToggle.checked;

    roundEl.textContent = '0';
    centerRoundEl.textContent = '0';
    startBtn.disabled = true;
    clearMessage();

    addToSequence();
    playSequence();
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  // ─── Event Listeners ───
  startBtn.addEventListener('click', startGame);

  buttons.forEach((btn, index) => {
    btn.addEventListener('click', () => handlePlayerInput(index));

    // Touch support
    btn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handlePlayerInput(index);
    });
  });

  // Keyboard support
  const KEY_MAP = {
    '1': 0, 'ArrowUp': 0,
    '2': 1, 'ArrowRight': 1,
    '3': 2, 'ArrowDown': 2,
    '4': 3, 'ArrowLeft': 3,
  };

  document.addEventListener('keydown', e => {
    if (KEY_MAP.hasOwnProperty(e.key)) {
      e.preventDefault();
      handlePlayerInput(KEY_MAP[e.key]);
    }
    // Space/Enter to start
    if ((e.key === ' ' || e.key === 'Enter') && !startBtn.disabled) {
      e.preventDefault();
      startGame();
    }
  });

  // Prevent strict toggle change during active game
  strictToggle.addEventListener('change', () => {
    if (gameActive) {
      strictMode = strictToggle.checked;
    }
  });

})();
</script>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=3"></script>
<script type="module" src="firebase-lb.js?v=2"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
