<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whisper</title>
<link rel="manifest" href="whisper-manifest.json">
<meta name="theme-color" content="#0f0f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%230f0f1a'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%237b2ff7' stroke-width='2' opacity='0.6'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%237b2ff7'/%3E%3C/svg%3E">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --t-bg1: #0f0f1a;
    --t-bg2: #1a1a2e;
    --t-bg3: #2a2a4a;
    --t-border: #2a2a4a;
    --t-accent: #7b2ff7;
    --t-accent2: #00d4ff;
    --t-dim: #888;
    --t-text: #e0e0e0;
    --t-glow: rgba(123,47,247,0.35);
  }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: 'Outfit', 'Segoe UI', sans-serif;
    background: var(--t-bg1);
    color: var(--t-text);
    -webkit-font-smoothing: antialiased;
  }
  body {
    display: flex;
    flex-direction: column;
    background: radial-gradient(ellipse at top, var(--t-bg2), var(--t-bg1));
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--t-accent); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--t-accent2); }

  header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--t-border);
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
    background: rgba(26,26,46,0.6);
    backdrop-filter: blur(10px);
  }
  header .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--t-accent);
    box-shadow: 0 0 12px var(--t-accent);
    animation: whisperPulse 2s ease-in-out infinite;
  }
  @keyframes whisperPulse { 50% { opacity: 0.5; transform: scale(0.85); } }
  header h1 {
    font-family: 'Orbitron', 'Outfit', sans-serif;
    font-size: 0.82rem;
    font-weight: 900;
    letter-spacing: 3px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--t-accent2), var(--t-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    flex: 1;
  }
  header .me {
    font-size: 0.7rem;
    color: var(--t-dim);
    letter-spacing: 0.4px;
    font-weight: 500;
  }

  .tabs {
    display: flex;
    gap: 6px;
    padding: 10px 16px 10px;
    border-bottom: 1px solid var(--t-border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: var(--t-bg2);
    border: 1px solid var(--t-border);
    color: var(--t-dim);
    padding: 5px 12px;
    font-size: 0.72rem;
    font-family: inherit;
    font-weight: 500;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 0.3px;
    white-space: nowrap;
    transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.2s;
  }
  .tab:hover { color: var(--t-text); border-color: var(--t-accent); transform: translateY(-1px); }
  .tab.active {
    color: #fff;
    border-color: var(--t-accent);
    background: linear-gradient(135deg, var(--t-accent), var(--t-accent2));
    box-shadow: 0 0 12px var(--t-glow);
  }
  .tab .x {
    margin-left: 6px;
    opacity: 0.6;
    font-size: 1em;
  }
  .tab .x:hover { opacity: 1; }

  .new-dm {
    padding: 10px 16px 4px;
    display: none;
    gap: 6px;
    border-bottom: 1px solid var(--t-border);
  }
  .new-dm.show { display: flex; }
  .new-dm input {
    flex: 1;
    background: var(--t-bg2);
    border: 1px solid var(--t-border);
    color: var(--t-text);
    font-family: inherit;
    font-size: 0.8rem;
    padding: 7px 12px;
    border-radius: 8px;
    outline: none;
    transition: border-color 0.15s;
  }
  .new-dm input:focus { border-color: var(--t-accent); }
  .new-dm button {
    background: linear-gradient(135deg, var(--t-accent), var(--t-accent2));
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 0 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .new-dm button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px var(--t-glow); }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--t-accent) transparent;
  }

  .msg {
    padding: 7px 12px;
    margin-bottom: 4px;
    border-radius: 10px;
    display: flex;
    gap: 9px;
    align-items: baseline;
    transition: background 0.2s, border-color 0.2s;
    border: 1px solid transparent;
  }
  .msg:hover {
    background: rgba(123, 47, 247, 0.08);
    border-color: rgba(123, 47, 247, 0.25);
  }
  .msg .name {
    color: var(--t-accent);
    font-weight: 700;
    font-size: 0.74rem;
    flex-shrink: 0;
    letter-spacing: 0.3px;
  }
  .msg.me .name { color: var(--t-accent2); }
  .msg .text {
    color: var(--t-text);
    font-size: 0.84rem;
    line-height: 1.45;
    font-weight: 400;
    filter: blur(6px);
    transition: filter 0.3s ease;
    user-select: none;
    word-break: break-word;
  }
  .msg:hover .text {
    filter: blur(0);
    user-select: text;
  }
  .msg .time {
    color: var(--t-dim);
    font-size: 0.64rem;
    margin-left: auto;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.25s;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .msg:hover .time { opacity: 1; }

  .empty {
    text-align: center;
    color: var(--t-dim);
    font-size: 0.78rem;
    padding: 50px 20px;
    font-style: italic;
    letter-spacing: 0.3px;
  }

  .hint {
    padding: 6px 16px 9px;
    color: var(--t-dim);
    font-size: 0.62rem;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
    border-top: 1px solid var(--t-border);
    font-weight: 600;
  }

  .input-row {
    display: flex;
    gap: 8px;
    padding: 12px 16px 16px;
    border-top: 1px solid var(--t-border);
    background: rgba(26,26,46,0.6);
    backdrop-filter: blur(10px);
  }
  .input-row input {
    flex: 1;
    background: var(--t-bg2);
    border: 1px solid var(--t-border);
    color: var(--t-text);
    font-family: inherit;
    font-size: 0.84rem;
    padding: 10px 14px;
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row input:focus {
    border-color: var(--t-accent);
    box-shadow: 0 0 12px var(--t-glow);
  }
  .input-row input:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-row button {
    background: linear-gradient(135deg, var(--t-accent), var(--t-accent2));
    color: #fff;
    border: none;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .input-row button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px var(--t-glow); }
  .input-row button:active { transform: scale(0.96); }
  .input-row button:disabled { opacity: 0.4; cursor: not-allowed; }

  .guest-notice {
    padding: 60px 28px;
    text-align: center;
    color: var(--t-dim);
    font-size: 0.84rem;
    line-height: 1.6;
  }
  .guest-notice strong {
    color: var(--t-text);
    display: block;
    margin-bottom: 10px;
    font-size: 1rem;
    font-family: 'Orbitron', 'Outfit', sans-serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(135deg, var(--t-accent2), var(--t-accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .guest-notice a {
    display: inline-block;
    margin-top: 18px;
    padding: 9px 22px;
    background: linear-gradient(135deg, var(--t-accent), var(--t-accent2));
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.5px;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .guest-notice a:hover { transform: translateY(-1px); box-shadow: 0 6px 18px var(--t-glow); }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Whisper</h1>
  <div class="me" id="me-label"></div>
</header>

<div class="tabs" id="tabs">
  <button class="tab active" data-ch="global">Global</button>
  <button class="tab" data-ch="__new__" id="new-dm-tab">+ New</button>
</div>

<div class="new-dm" id="new-dm">
  <input id="new-dm-input" placeholder="Username to message..." maxlength="20" autocomplete="off">
  <button id="new-dm-go">Start</button>
</div>

<div class="messages" id="messages"></div>

<div class="hint">Hover a message to reveal it</div>

<div class="input-row">
  <input id="msg-input" placeholder="Type a message..." maxlength="500" autocomplete="off">
  <button id="send-btn">&#10148;</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// Apply the user's saved theme colors if any (reads localStorage from main site)
(function() {
  try {
    var themeKey = localStorage.getItem('arcadeTheme');
    var themes = {
      dark: { accent: '#7b2ff7', accent2: '#00d4ff', bg1: '#0f0f1a', bg2: '#1a1a2e', border: '#2a2a4a', text: '#e0e0e0', dim: '#888', glow: 'rgba(123,47,247,0.35)' },
      ocean: { accent: '#00d4ff', accent2: '#7b2ff7', bg1: '#0a1420', bg2: '#14223a', border: '#1f3556', text: '#e0f0ff', dim: '#6a8ba8', glow: 'rgba(0,212,255,0.35)' },
      sunset: { accent: '#ff6b9d', accent2: '#feca57', bg1: '#1a0f1a', bg2: '#2a1a2e', border: '#4a2a3a', text: '#ffe0f0', dim: '#a87890', glow: 'rgba(255,107,157,0.35)' },
      forest: { accent: '#2ecc71', accent2: '#f39c12', bg1: '#0f1a10', bg2: '#1a2e1f', border: '#2a4a33', text: '#e0f0e4', dim: '#6a8a78', glow: 'rgba(46,204,113,0.35)' },
      mono: { accent: '#ffffff', accent2: '#aaaaaa', bg1: '#0a0a0a', bg2: '#1a1a1a', border: '#2a2a2a', text: '#e0e0e0', dim: '#666', glow: 'rgba(255,255,255,0.25)' }
    };
    var t = themes[themeKey] || themes.dark;
    var s = document.documentElement.style;
    s.setProperty('--t-accent', t.accent);
    s.setProperty('--t-accent2', t.accent2);
    s.setProperty('--t-bg1', t.bg1);
    s.setProperty('--t-bg2', t.bg2);
    s.setProperty('--t-border', t.border);
    s.setProperty('--t-text', t.text);
    s.setProperty('--t-dim', t.dim);
    s.setProperty('--t-glow', t.glow);
  } catch(e) {}
})();

(function() {
  var me = localStorage.getItem('arcade_currentUser') || '';
  var meLabel = document.getElementById('me-label');
  var messagesEl = document.getElementById('messages');
  var inputEl = document.getElementById('msg-input');
  var sendBtn = document.getElementById('send-btn');
  var tabsEl = document.getElementById('tabs');
  var newDmBar = document.getElementById('new-dm');
  var newDmInput = document.getElementById('new-dm-input');
  var newDmGo = document.getElementById('new-dm-go');

  if (!me) {
    messagesEl.innerHTML = '<div class="guest-notice"><strong>Sign in required</strong>Open the main site, sign in, then come back here.<a href="index.html">Go to Arcade &rarr;</a></div>';
    inputEl.disabled = true;
    sendBtn.disabled = true;
    return;
  }
  meLabel.textContent = me;

  var firebaseConfig = {
    apiKey: "AIzaSyCyK7tEcAaqrVNFRggviaEmWH2SMkiwGKk",
    authDomain: "calculator-81d08.firebaseapp.com",
    projectId: "calculator-81d08",
    storageBucket: "calculator-81d08.firebasestorage.app",
    messagingSenderId: "375406495739",
    appId: "1:375406495739:web:fd28553263599864426d5e"
  };
  var app;
  try { app = firebase.app('whisper-app'); }
  catch(e) { app = firebase.initializeApp(firebaseConfig, 'whisper-app'); }
  var db = firebase.firestore(app);

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }
  function hhmm(ts) {
    var dt = new Date(ts);
    var h = dt.getHours();
    var ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return h + ':' + String(dt.getMinutes()).padStart(2, '0') + ' ' + ampm;
  }
  function chatId(a, b) {
    return [a.toLowerCase(), b.toLowerCase()].sort().join('_');
  }

  var activeChannel = 'global';
  var unsub = null;
  var currentMsgs = [];

  function render() {
    if (currentMsgs.length === 0) {
      messagesEl.innerHTML = '<div class="empty">No messages yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < currentMsgs.length; i++) {
      var m = currentMsgs[i];
      var isMe = (m.name || m.from || '').toLowerCase() === me.toLowerCase();
      html += '<div class="msg' + (isMe ? ' me' : '') + '">'
        + '<span class="name">' + esc(m.name || m.from || '?') + '</span>'
        + '<span class="text">' + esc(m.text || '') + '</span>'
        + '<span class="time">' + hhmm(m.timestamp || Date.now()) + '</span>'
        + '</div>';
    }
    messagesEl.innerHTML = html;
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function listen(channel) {
    if (unsub) { unsub(); unsub = null; }
    currentMsgs = [];
    render();
    if (channel === 'global') {
      unsub = db.collection('global_chat').orderBy('timestamp', 'asc').limitToLast(30)
        .onSnapshot(function(snap) {
          currentMsgs = [];
          snap.forEach(function(doc) { currentMsgs.push(doc.data()); });
          render();
        }, function(err) { console.error(err); });
    } else {
      var cid = chatId(me, channel);
      unsub = db.collection('direct_messages').where('chatId', '==', cid)
        .onSnapshot(function(snap) {
          var msgs = [];
          snap.forEach(function(doc) { msgs.push(doc.data()); });
          msgs.sort(function(a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
          if (msgs.length > 50) msgs = msgs.slice(msgs.length - 50);
          currentMsgs = msgs;
          render();
        }, function(err) { console.error(err); });
    }
  }

  function switchTo(channel) {
    activeChannel = channel;
    var tabs = tabsEl.querySelectorAll('.tab');
    for (var i = 0; i < tabs.length; i++) {
      tabs[i].classList.toggle('active', tabs[i].dataset.ch === channel);
    }
    newDmBar.classList.remove('show');
    listen(channel);
    inputEl.placeholder = channel === 'global' ? 'Type a message...' : 'Message ' + channel + '...';
    inputEl.focus();
  }

  var dmList = [];
  try { dmList = JSON.parse(localStorage.getItem('_whisperDms') || '[]'); } catch(e) { dmList = []; }
  function saveDmList() { localStorage.setItem('_whisperDms', JSON.stringify(dmList)); }
  function rebuildTabs() {
    var html = '<button class="tab" data-ch="global">Global</button>';
    for (var i = 0; i < dmList.length; i++) {
      html += '<button class="tab" data-ch="' + esc(dmList[i]) + '">' + esc(dmList[i]) + '<span class="x" data-close="' + esc(dmList[i]) + '">&#215;</span></button>';
    }
    html += '<button class="tab" data-ch="__new__" id="new-dm-tab">+ New</button>';
    tabsEl.innerHTML = html;
    var tabs = tabsEl.querySelectorAll('.tab');
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.toggle('active', tabs[j].dataset.ch === activeChannel);
    }
  }
  rebuildTabs();

  tabsEl.addEventListener('click', function(e) {
    var closeBtn = e.target.closest('[data-close]');
    if (closeBtn) {
      e.stopPropagation();
      var name = closeBtn.dataset.close;
      dmList = dmList.filter(function(n) { return n !== name; });
      saveDmList();
      if (activeChannel === name) activeChannel = 'global';
      rebuildTabs();
      switchTo(activeChannel);
      return;
    }
    var tab = e.target.closest('.tab');
    if (!tab) return;
    var ch = tab.dataset.ch;
    if (ch === '__new__') {
      newDmBar.classList.toggle('show');
      setTimeout(function(){ newDmInput.focus(); }, 20);
    } else {
      switchTo(ch);
    }
  });

  newDmGo.onclick = function() {
    var name = newDmInput.value.trim();
    if (!name || name.toLowerCase() === me.toLowerCase()) { newDmInput.value = ''; return; }
    if (dmList.indexOf(name) === -1) {
      dmList.push(name);
      saveDmList();
      rebuildTabs();
    }
    newDmInput.value = '';
    switchTo(name);
  };
  newDmInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') newDmGo.click();
  });

  function send() {
    var text = inputEl.value.trim();
    if (!text) return;
    var now = Date.now();
    inputEl.value = '';
    if (activeChannel === 'global') {
      db.collection('global_chat').add({
        name: me, text: text, time: hhmm(now), timestamp: now, type: 'global'
      }).catch(function(err) { console.error(err); });
    } else {
      var cid = chatId(me, activeChannel);
      db.collection('direct_messages').add({
        chatId: cid, from: me, to: activeChannel, text: text, time: hhmm(now), timestamp: now
      }).catch(function(err) { console.error(err); });
    }
  }
  sendBtn.onclick = send;
  inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') send(); });

  listen('global');
})();
</script>

</body>
</html>
