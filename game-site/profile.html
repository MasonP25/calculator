<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile — Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 0 1rem 3rem;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem 0;
    position: relative;
    max-width: 900px;
    margin: 0 auto;
  }
  .back-link {
    position: absolute;
    left: 0;
    color: #00d4ff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .back-link:hover { color: #7b2ff7; }
  .top-bar h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Hero section */
  .profile-hero {
    max-width: 900px;
    margin: 1.5rem auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 20px;
    padding: 2rem;
  }
  .hero-avatar {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #0f0f1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-info {
    flex: 1;
    min-width: 0;
  }
  .hero-username {
    font-size: 1.8rem;
    font-weight: 700;
    color: #e0e0e0;
    margin-bottom: 0.3rem;
    word-break: break-word;
  }
  .hero-meta {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1rem;
  }
  .hero-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .profile-btn {
    padding: 0.45rem 1.2rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    font-weight: 600;
  }
  .profile-btn.primary {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: #fff;
    border-color: #7b2ff7;
  }
  .profile-btn.primary:hover { opacity: 0.9; }
  .profile-btn.secondary {
    background: #0f0f1a;
    color: #aaa;
    border-color: #2a2a4a;
  }
  .profile-btn.secondary:hover { border-color: #7b2ff7; color: #e0e0e0; }
  .profile-btn.success {
    background: #0f0f1a;
    color: #2ed573;
    border-color: #2ed573;
    cursor: default;
  }
  .profile-btn.pending {
    background: #0f0f1a;
    color: #ffa502;
    border-color: #ffa502;
    cursor: default;
  }
  .profile-btn.danger {
    background: #0f0f1a;
    color: #ff4757;
    border-color: #2a2a4a;
  }
  .profile-btn.danger:hover { border-color: #ff4757; }

  /* Stats row */
  .stats-row {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat-box {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 0.8rem 1.5rem;
    text-align: center;
    min-width: 140px;
    flex: 1;
    max-width: 200px;
  }
  .stat-box .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #00d4ff;
  }
  .stat-box .stat-label {
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 0.2rem;
  }

  /* Section headers */
  .section-header {
    max-width: 900px;
    margin: 2rem auto 0.8rem;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #555;
    border-bottom: 1px solid #2a2a4a;
    padding-bottom: 0.4rem;
  }

  /* Recently Played */
  .recent-games {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .recent-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: #e0e0e0;
    transition: border-color 0.2s, transform 0.2s;
    flex: 1;
    min-width: 180px;
  }
  .recent-card:hover { border-color: #7b2ff7; transform: translateY(-2px); }
  .recent-card .rc-emoji { font-size: 1.5rem; }
  .recent-card .rc-name { font-size: 0.9rem; font-weight: 600; }
  .recent-card .rc-time { font-size: 0.7rem; color: #888; }

  /* Badges section */
  .badges-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  /* Scores section */
  .scores-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .score-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .score-card .sc-emoji { font-size: 1.6rem; }
  .score-card .sc-info { flex: 1; min-width: 0; }
  .score-card .sc-name { font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: color 0.15s; color: #e0e0e0; text-decoration: none; display: block; }
  .score-card .sc-name:hover { color: #7b2ff7; text-decoration: underline; }
  .score-card .sc-score {
    font-size: 0.8rem;
    color: #aaa;
    margin-top: 0.15rem;
  }
  .score-card .sc-rank {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.25rem 0.6rem;
    border-radius: 8px;
    white-space: nowrap;
  }
  .sc-rank.gold   { color: #ffd700; background: #ffd70015; }
  .sc-rank.silver { color: #c0c0c0; background: #c0c0c015; }
  .sc-rank.bronze { color: #cd7f32; background: #cd7f3215; }
  .sc-rank.normal { color: #888; background: #ffffff08; }

  /* Friends section */
  .friends-wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  .friends-list {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .friend-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s;
    min-width: 140px;
  }
  .friend-card:hover {
    border-color: #7b2ff7;
    transform: translateY(-2px);
  }
  .friend-avatar {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .friend-name {
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* Friend requests */
  .request-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }
  .request-card .req-name {
    flex: 1;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .request-card .req-btn {
    padding: 0.3rem 0.8rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    border: none;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .request-card .req-btn:hover { opacity: 0.8; }
  .req-accept { background: #2ed573; color: #000; }
  .req-decline { background: #ff475733; color: #ff4757; }

  /* Add friend bar */
  .add-friend-bar {
    max-width: 900px;
    margin: 1rem auto;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .add-friend-bar input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 0.5rem 0.8rem;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-friend-bar input:focus { border-color: #7b2ff7; }
  .add-friend-bar input::placeholder { color: #555; }
  .add-friend-msg {
    font-size: 0.8rem;
    margin-left: 0.5rem;
  }

  .empty-text {
    color: #555;
    font-size: 0.85rem;
    font-style: italic;
    padding: 1rem 0;
  }

  .loading-text {
    color: #888;
    font-size: 0.9rem;
    text-align: center;
    padding: 3rem 0;
  }

  /* Streak Widget */
  .streak-widget {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    background: #1a1a2e;
    border: 2px solid #ffd70044;
    border-radius: 16px;
    padding: 1.2rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 1.2rem;
  }
  .streak-fire { font-size: 2.5rem; line-height: 1; }
  .streak-info { flex: 1; min-width: 0; }
  .streak-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }
  .streak-count { font-size: 1.8rem; font-weight: 700; color: #ffd700; }
  .streak-reward { font-size: 0.85rem; color: #aaa; margin-top: 0.2rem; }
  .streak-collect-btn {
    padding: 0.6rem 1.5rem;
    border-radius: 12px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid #ffd700;
    background: linear-gradient(135deg, #ffd700, #ffaa00);
    color: #0f0f1a;
    transition: opacity 0.2s, transform 0.1s;
  }
  .streak-collect-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .streak-collect-btn:disabled {
    background: #2a2a4a;
    border-color: #2a2a4a;
    color: #888;
    cursor: default;
    transform: none;
  }

  @media (max-width: 600px) {
    .profile-hero {
      flex-direction: column;
      text-align: center;
      padding: 1.5rem;
    }
    .hero-actions { justify-content: center; }
    .stat-box { min-width: 100px; padding: 0.6rem 0.8rem; }
    .stat-box .stat-value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="index.html">&#8592; Back</a>
  <h1>Player Profile</h1>
</div>

<div id="loading" class="loading-text">Loading profile...</div>
<div id="content" style="display:none">

  <!-- Hero -->
  <div class="profile-hero" id="profileHero">
    <div class="hero-avatar" id="heroAvatar"></div>
    <div class="hero-info">
      <div class="hero-username" id="heroName"></div>
      <div class="hero-bio" id="heroBio" style="font-size:0.85rem;color:#aaa;margin:0.2rem 0;font-style:italic;display:none"></div>
      <div class="hero-level" id="heroLevel"></div>
      <div id="heroStatus" style="font-size:0.78rem;margin:0.3rem 0;display:none"></div>
      <div class="hero-meta" id="heroMeta"></div>
      <div class="hero-actions" id="heroActions"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Daily Login Streak (own profile only) -->
  <div id="streakSection" style="display:none">
    <div class="section-header">Daily Login</div>
    <div class="streak-widget" id="streakWidget"></div>
  </div>

  <!-- Daily Challenge + Weekly Quests (own profile only) -->
  <div id="challengesSection" style="display:none">
    <div class="section-header">Daily Challenge</div>
    <div id="profileChallengeWrap" style="max-width:900px;margin:0 auto 1rem"></div>
    <div class="section-header">Weekly Quests <span style="font-size:0.65rem;color:#888;font-weight:400;letter-spacing:0;text-transform:none;margin-left:0.4rem">Resets every Monday</span></div>
    <div id="profileQuestsWrap" style="max-width:900px;margin:0 auto 1rem"></div>
  </div>

  <!-- Recently Played -->
  <div class="section-header" id="recentHeader" style="display:none">Recently Played</div>
  <div class="recent-games" id="recentGames"></div>

  <!-- Badges -->
  <div class="section-header">Badges</div>
  <div class="badges-wrap" id="badgesWrap"></div>

  <!-- Scores -->
  <div class="section-header">Scores</div>
  <div class="scores-grid" id="scoresGrid"></div>

  <!-- Friends -->
  <div class="section-header" id="friendsHeader">Friends</div>
  <div class="friends-wrap" id="friendsWrap"></div>

  <!-- Pending Trades (own profile only) -->
  <div class="section-header" id="tradesHeader" style="display:none">Pending Trades</div>
  <div class="friends-wrap" id="tradesWrap" style="display:none"></div>

  <!-- Friend Requests (own profile only) -->
  <div class="section-header" id="requestsHeader" style="display:none">Friend Requests</div>
  <div class="friends-wrap" id="requestsWrap" style="display:none"></div>

  <!-- Add Friend bar (own profile only) -->
  <div class="section-header" id="addFriendHeader" style="display:none">Add Friend</div>
  <div class="add-friend-bar" id="addFriendBar" style="display:none">
    <input type="text" id="addFriendInput" placeholder="Enter username..." maxlength="15">
    <button class="profile-btn primary" id="addFriendBtn" onclick="doAddFriend()">Send Request</button>
    <span class="add-friend-msg" id="addFriendMsg"></span>
  </div>
</div>

// Number formatting
var NUM_SUFFIXES = ['','K','M','B','T'];
function fmtScore(n) {
  if (n < 1e3) return Math.floor(n).toLocaleString();
  var tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier >= NUM_SUFFIXES.length) tier = NUM_SUFFIXES.length - 1;
  if (tier < 1) return Math.floor(n).toString();
  var scale = Math.pow(10, tier * 3);
  return (n / scale).toFixed(1) + NUM_SUFFIXES[tier];
}

async function renderStreakWidget(profileData, isOwnProfile) {
  var section = document.getElementById('streakSection');
  var widget = document.getElementById('streakWidget');
  section.style.display = '';

  function dateStr(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  var today = dateStr(new Date());
  var yd = new Date(); yd.setDate(yd.getDate() - 1);
  var yesterday = dateStr(yd);

  var lastDate = profileData.lastStreakDate || '';
  var streak = profileData.loginStreak || 0;
  var alreadyCollected = (lastDate === today);
  var continues = (lastDate === yesterday);

  var displayStreak, todayReward;
  if (alreadyCollected) {
    displayStreak = streak;
    todayReward = 40 + streak * 10;
  } else if (continues) {
    displayStreak = streak;
    todayReward = 40 + (streak + 1) * 10;

          messagingSenderId:"375406495739",appId:"1:375406495739:web:fd28553263599864426d5e"
        };
        var db;

        catch(e) {
          try { db = getFirestore(initializeApp(config, 'streak-app')); }

    if (eq.hat || eq.hair || eq.face || eq.shirt || eq.nametagColor || eq.nametagFont) {

    });
    window.ArcadeBadges.render(badgesWrap, earnedBadges, { showAll: true });
  }

  // ─── RECENTLY PLAYED ───
  renderRecentGames(profileData);

  // ─── FRIENDS ───

  if (isOwnProfile) {

    document.getElementById('addFriendBar').style.display = '';
  }

function renderRecentGames(profileData) {
  var recent = profileData.recentGames || [];
  var wrap = document.getElementById('recentGames');
  var header = document.getElementById('recentHeader');
  if (recent.length === 0) return;

  header.style.display = '';
  wrap.innerHTML = '';

  function timeAgo(ts) {
    var diff = Date.now() - ts;
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  recent.forEach(function(r) {
    var game = GAME_MAP[r.gameId];
    if (!game) return;
    var url = GAME_URLS[r.gameId] || (r.gameId + '.html');
    var card = document.createElement('a');
    card.className = 'recent-card';
    card.href = url;
    card.innerHTML =
      '<span class="rc-emoji">' + game.emoji + '</span>' +
      '<div>' +
        '<div class="rc-name">' + game.name + '</div>' +
        '<div class="rc-time">' + timeAgo(r.time) + '</div>' +
      '</div>';
    wrap.appendChild(card);
  });
}

async function renderScores(username) {
  var grid = document.getElementById('scoresGrid');
  grid.innerHTML = '';

  if (!window.FirebaseLB) {
    grid.innerHTML = '<p class="empty-text">Leaderboard unavailable</p>';
    return;
  }

  // Fetch scores for all games where user has an entry
  var found = [];
  var key = username.toLowerCase();

  // Query all games concurrently (batch of promises)
  var promises = GAMES.map(function(game) {
    return window.FirebaseLB.getScores(game.id, 10).then(function(scores) {
      for (var i = 0; i < scores.length; i++) {
        if (scores[i].name.toLowerCase() === key) {
          found.push({
            game: game,
            score: scores[i].score,
            rank: i + 1
          });
          break;
        }
      }
    }).catch(function() {});
  });

  await Promise.all(promises);

  if (found.length === 0) {
    grid.innerHTML = '<p class="empty-text">No scores yet</p>';
    return;
  }

  // Sort by rank (best placements first)
  found.sort(function(a, b) { return a.rank - b.rank; });

  found.forEach(function(entry) {
    var card = document.createElement('div');
    card.className = 'score-card';

    var rankClass = 'normal';
    if (entry.rank === 1) rankClass = 'gold';
    else if (entry.rank === 2) rankClass = 'silver';
    else if (entry.rank === 3) rankClass = 'bronze';

    var gameUrl = GAME_URLS[entry.game.id] || (entry.game.id + '.html');
    card.innerHTML =
      '<span class="sc-emoji">' + entry.game.emoji + '</span>' +
      '<div class="sc-info">' +
        '<a class="sc-name" href="' + gameUrl + '">' + entry.game.name + '</a>' +

      '</div>' +
      '<span class="sc-rank ' + rankClass + '">#' + entry.rank + '</span>';
    grid.appendChild(card);
  });
}

async function renderFriends(profileData) {
  var wrap = document.getElementById('friendsWrap');
  var friendKeys = profileData.friends || [];

  if (friendKeys.length === 0) {
    wrap.innerHTML = '<p class="empty-text">No friends yet</p>';
    return;
  }

  var list = document.createElement('div');
  list.className = 'friends-list';

  for (var i = 0; i < friendKeys.length; i++) {
    var fKey = friendKeys[i];
    var card = document.createElement('a');
    card.className = 'friend-card';
    card.href = 'profile.html?user=' + encodeURIComponent(fKey);

    var avatar = document.createElement('span');
    avatar.className = 'friend-avatar';
    avatar.dataset.username = fKey;

    var name = document.createElement('span');
    name.className = 'friend-name';
    name.dataset.username = fKey;
    name.textContent = fKey;

    var statusDot = document.createElement('span');
    statusDot.className = 'friend-status';
    statusDot.dataset.username = fKey;
    statusDot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#444;flex-shrink:0;margin-left:auto';

    card.appendChild(avatar);
    card.appendChild(name);
    card.appendChild(statusDot);
    list.appendChild(card);

    // Load avatar + display name + status async
    (function(avatarEl, nameEl, dotEl, username) {
      if (window.ArcadeCoins && window.ArcadeCoins.getProfile) {
        window.ArcadeCoins.getProfile(username).then(function(profile) {
          if (!profile) return;
          if (window.ArcadeAvatar) {
            window.ArcadeAvatar.renderMini(avatarEl, profile, 32);
            window.ArcadeAvatar.styleName(nameEl, profile);
          }
        }).catch(function() {});
      }
      // Get display name + status
      if (window.ArcadeBadges && window.ArcadeBadges.getFullProfile) {
        window.ArcadeBadges.getFullProfile(username).then(function(data) {
          if (data && data.username) {
            nameEl.textContent = data.username;
            nameEl.closest('a').href = 'profile.html?user=' + encodeURIComponent(data.username);
          }
          if (data) {
            var isOnline = data.online === true;
            var ls = data.lastSeen;
            var ts = 0;
            if (ls) ts = ls.toDate ? ls.toDate().getTime() : (typeof ls === 'number' ? ls : 0);
            if (isOnline && ts && (Date.now() - ts > 120000)) isOnline = false;
            dotEl.style.background = isOnline ? '#44cc44' : '#444';
            dotEl.title = isOnline ? (data.currentPage || 'Online') : 'Offline';
          }
        }).catch(function() {});
      }
    })(avatar, name, statusDot, fKey);
  }

  wrap.appendChild(list);
}

async function renderRequests() {
  if (!window.ArcadeFriends) return;
  var requests = await window.ArcadeFriends.getIncomingRequests();
  if (requests.length === 0) return;

  document.getElementById('requestsHeader').style.display = '';
  document.getElementById('requestsWrap').style.display = '';

  var wrap = document.getElementById('requestsWrap');
  wrap.innerHTML = '';

  requests.forEach(function(fromUser) {
    var card = document.createElement('div');
    card.className = 'request-card';

    var nameEl = document.createElement('span');
    nameEl.className = 'req-name';
    nameEl.textContent = fromUser;

    var acceptBtn = document.createElement('button');
    acceptBtn.className = 'req-btn req-accept';
    acceptBtn.textContent = 'Accept';
    acceptBtn.onclick = async function() {
      var r = await window.ArcadeFriends.acceptRequest(fromUser);
      if (r.ok) {
        card.remove();
        if (wrap.children.length === 0) {
          document.getElementById('requestsHeader').style.display = 'none';
          document.getElementById('requestsWrap').style.display = 'none';
        }
      }
    };

    var declineBtn = document.createElement('button');
    declineBtn.className = 'req-btn req-decline';
    declineBtn.textContent = 'Decline';
    declineBtn.onclick = async function() {
      var r = await window.ArcadeFriends.declineRequest(fromUser);
      if (r.ok) {
        card.remove();
        if (wrap.children.length === 0) {
          document.getElementById('requestsHeader').style.display = 'none';
          document.getElementById('requestsWrap').style.display = 'none';
        }
      }
    };

    card.appendChild(nameEl);
    card.appendChild(acceptBtn);
    card.appendChild(declineBtn);
    wrap.appendChild(card);
  });
}

// Add friend from the add friend bar
async function doAddFriend() {
  var input = document.getElementById('addFriendInput');
  var msg = document.getElementById('addFriendMsg');
  var btn = document.getElementById('addFriendBtn');
  var username = input.value.trim();
  if (!username) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  msg.textContent = '';

  if (!window.ArcadeFriends) {
    msg.textContent = 'Friends system not loaded';
    msg.style.color = '#ff4757';
    btn.disabled = false;
    btn.textContent = 'Send Request';
    return;
  }

  var result = await window.ArcadeFriends.sendRequest(username);
  if (result.ok) {
    msg.textContent = result.msg;
    msg.style.color = '#2ed573';
    input.value = '';
  } else {
    msg.textContent = result.msg;
    msg.style.color = '#ff4757';
  }
  btn.disabled = false;
  btn.textContent = 'Send Request';
}

// Enter key in add friend input
document.getElementById('addFriendInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAddFriend();
});
