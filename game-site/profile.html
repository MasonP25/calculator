<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Profile — Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 0 1rem 3rem;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem 0;
    position: relative;
    max-width: 900px;
    margin: 0 auto;
  }
  .back-link {
    position: absolute;
    left: 0;
    color: #00d4ff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .back-link:hover { color: #7b2ff7; }
  .top-bar h1 {
    font-size: 2rem;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Hero section */
  .profile-hero {
    max-width: 900px;
    margin: 1.5rem auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 20px;
    padding: 2rem;
  }
  .hero-avatar {
    width: 120px;
    height: 120px;
    flex-shrink: 0;
    border-radius: 50%;
    background: #0f0f1a;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-info {
    flex: 1;
    min-width: 0;
  }
  .hero-username {
    font-size: 1.8rem;
    font-weight: 700;
    color: #e0e0e0;
    margin-bottom: 0.3rem;
    word-break: break-word;
  }
  .hero-meta {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 1rem;
  }
  .hero-actions {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
  }
  .profile-btn {
    padding: 0.45rem 1.2rem;
    border-radius: 10px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.2s;
    font-weight: 600;
  }
  .profile-btn.primary {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: #fff;
    border-color: #7b2ff7;
  }
  .profile-btn.primary:hover { opacity: 0.9; }
  .profile-btn.secondary {
    background: #0f0f1a;
    color: #aaa;
    border-color: #2a2a4a;
  }
  .profile-btn.secondary:hover { border-color: #7b2ff7; color: #e0e0e0; }
  .profile-btn.success {
    background: #0f0f1a;
    color: #2ed573;
    border-color: #2ed573;
    cursor: default;
  }
  .profile-btn.pending {
    background: #0f0f1a;
    color: #ffa502;
    border-color: #ffa502;
    cursor: default;
  }
  .profile-btn.danger {
    background: #0f0f1a;
    color: #ff4757;
    border-color: #2a2a4a;
  }
  .profile-btn.danger:hover { border-color: #ff4757; }

  /* Stats row */
  .stats-row {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .stat-box {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 12px;
    padding: 0.8rem 1.5rem;
    text-align: center;
    min-width: 140px;
    flex: 1;
    max-width: 200px;
  }
  .stat-box .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: #00d4ff;
  }
  .stat-box .stat-label {
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 0.2rem;
  }

  /* Section headers */
  .section-header {
    max-width: 900px;
    margin: 2rem auto 0.8rem;
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #555;
    border-bottom: 1px solid #2a2a4a;
    padding-bottom: 0.4rem;
  }

  /* Recently Played */
  .recent-games {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .recent-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1.2rem;
    display: flex;
    align-items: center;
    gap: 0.7rem;
    text-decoration: none;
    color: #e0e0e0;
    transition: border-color 0.2s, transform 0.2s;
    flex: 1;
    min-width: 180px;
  }
  .recent-card:hover { border-color: #7b2ff7; transform: translateY(-2px); }
  .recent-card .rc-emoji { font-size: 1.5rem; }
  .recent-card .rc-name { font-size: 0.9rem; font-weight: 600; }
  .recent-card .rc-time { font-size: 0.7rem; color: #888; }

  /* Badges section */
  .badges-wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  /* Scores section */
  .scores-grid {
    max-width: 900px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }
  .score-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
  }
  .score-card .sc-emoji { font-size: 1.6rem; }
  .score-card .sc-info { flex: 1; min-width: 0; }
  .score-card .sc-name { font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: color 0.15s; color: #e0e0e0; text-decoration: none; display: block; }
  .score-card .sc-name:hover { color: #7b2ff7; text-decoration: underline; }
  .score-card .sc-score {
    font-size: 0.8rem;
    color: #aaa;
    margin-top: 0.15rem;
  }
  .score-card .sc-rank {
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0.25rem 0.6rem;
    border-radius: 8px;
    white-space: nowrap;
  }
  .sc-rank.gold   { color: #ffd700; background: #ffd70015; }
  .sc-rank.silver { color: #c0c0c0; background: #c0c0c015; }
  .sc-rank.bronze { color: #cd7f32; background: #cd7f3215; }
  .sc-rank.normal { color: #888; background: #ffffff08; }

  /* Friends section */
  .friends-wrap {
    max-width: 900px;
    margin: 0 auto;
  }
  .friends-list {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .friend-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.2s, transform 0.2s;
    min-width: 140px;
  }
  .friend-card:hover {
    border-color: #7b2ff7;
    transform: translateY(-2px);
  }
  .friend-avatar {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .friend-name {
    font-size: 0.85rem;
    font-weight: 600;
  }

  /* Friend requests */
  .request-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 14px;
    padding: 0.8rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }
  .request-card .req-name {
    flex: 1;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .request-card .req-btn {
    padding: 0.3rem 0.8rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-family: inherit;
    cursor: pointer;
    border: none;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .request-card .req-btn:hover { opacity: 0.8; }
  .req-accept { background: #2ed573; color: #000; }
  .req-decline { background: #ff475733; color: #ff4757; }

  /* Add friend bar */
  .add-friend-bar {
    max-width: 900px;
    margin: 1rem auto;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  .add-friend-bar input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 0.88rem;
    padding: 0.5rem 0.8rem;
    width: 220px;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-friend-bar input:focus { border-color: #7b2ff7; }
  .add-friend-bar input::placeholder { color: #555; }
  .add-friend-msg {
    font-size: 0.8rem;
    margin-left: 0.5rem;
  }

  .empty-text {
    color: #555;
    font-size: 0.85rem;
    font-style: italic;
    padding: 1rem 0;
  }

  .loading-text {
    color: #888;
    font-size: 0.9rem;
    text-align: center;
    padding: 3rem 0;
  }

  @media (max-width: 600px) {
    .profile-hero {
      flex-direction: column;
      text-align: center;
      padding: 1.5rem;
    }
    .hero-actions { justify-content: center; }
    .stat-box { min-width: 100px; padding: 0.6rem 0.8rem; }
    .stat-box .stat-value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a class="back-link" href="index.html">&#8592; Back</a>
  <h1>Player Profile</h1>
</div>

<div id="loading" class="loading-text">Loading profile...</div>
<div id="content" style="display:none">

  <!-- Hero -->
  <div class="profile-hero">
    <div class="hero-avatar" id="heroAvatar"></div>
    <div class="hero-info">
      <div class="hero-username" id="heroName"></div>
      <div class="hero-meta" id="heroMeta"></div>
      <div class="hero-actions" id="heroActions"></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- Recently Played -->
  <div class="section-header" id="recentHeader" style="display:none">Recently Played</div>
  <div class="recent-games" id="recentGames"></div>

  <!-- Badges -->
  <div class="section-header">Badges</div>
  <div class="badges-wrap" id="badgesWrap"></div>

  <!-- Scores -->
  <div class="section-header">Scores</div>
  <div class="scores-grid" id="scoresGrid"></div>

  <!-- Friends -->
  <div class="section-header" id="friendsHeader">Friends</div>
  <div class="friends-wrap" id="friendsWrap"></div>

  <!-- Friend Requests (own profile only) -->
  <div class="section-header" id="requestsHeader" style="display:none">Friend Requests</div>
  <div class="friends-wrap" id="requestsWrap" style="display:none"></div>

  <!-- Add Friend bar (own profile only) -->
  <div class="section-header" id="addFriendHeader" style="display:none">Add Friend</div>
  <div class="add-friend-bar" id="addFriendBar" style="display:none">
    <input type="text" id="addFriendInput" placeholder="Enter username..." maxlength="15">
    <button class="profile-btn primary" id="addFriendBtn" onclick="doAddFriend()">Send Request</button>
    <span class="add-friend-msg" id="addFriendMsg"></span>
  </div>
</div>

var GAME_MAP = {};
GAMES.forEach(function(g) { GAME_MAP[g.id] = g; });

// Map game IDs to their HTML file URLs
var GAME_URLS = {};
GAMES.forEach(function(g) {
  // Most games follow gameId.html pattern; special cases handled here
  if (g.id.startsWith('aim_')) {
    GAME_URLS[g.id] = 'aim.html';
  } else {
    GAME_URLS[g.id] = g.id + '.html';
  }
});

// Number formatting
var NUM_SUFFIXES = ['','K','M','B','T'];
function fmtScore(n) {
  if (n < 1e3) return Math.floor(n).toLocaleString();
  var tier = Math.floor(Math.log10(Math.abs(n)) / 3);
  if (tier >= NUM_SUFFIXES.length) tier = NUM_SUFFIXES.length - 1;
  if (tier < 1) return Math.floor(n).toString();
  var scale = Math.pow(10, tier * 3);
  return (n / scale).toFixed(1) + NUM_SUFFIXES[tier];
}

// Get target username from URL
var params = new URLSearchParams(window.location.search);
var targetUser = params.get('user') || '';

async function loadProfile() {
  // Wait for Firebase modules
  await new Promise(function(r) { setTimeout(r, 1500); });

  // Determine which user to view
  var currentUser = localStorage.getItem('arcade_currentUser') || '';
  if (!targetUser) {
    targetUser = currentUser || 'Guest';
  }
  var isOwnProfile = currentUser && currentUser.toLowerCase() === targetUser.toLowerCase();

  if (targetUser === 'Guest') {
    document.getElementById('loading').textContent = 'Sign in to view your profile';
    return;
  }

  // Fetch profile data from Firebase
  var profileData = null;
  if (window.ArcadeBadges && window.ArcadeBadges.getFullProfile) {
    profileData = await window.ArcadeBadges.getFullProfile(targetUser);
  }
  if (!profileData) {
    document.getElementById('loading').textContent = 'User not found';
    return;
  }

  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';

  // ─── HERO ───
  var heroNameEl = document.getElementById('heroName');
  heroNameEl.textContent = profileData.username || targetUser;

  // Apply nametag style
  if (window.ArcadeAvatar && profileData.equipped) {
    window.ArcadeAvatar.styleName(heroNameEl, profileData.equipped);
  }

  // Render avatar
  var avatarEl = document.getElementById('heroAvatar');
  if (window.ArcadeAvatar && profileData.equipped) {
    window.ArcadeAvatar.render(avatarEl, profileData.equipped, 110);
  }

  // Meta info
  var metaEl = document.getElementById('heroMeta');
  metaEl.textContent = 'Member since ' + (profileData.createdAt || 'unknown');

  // Actions
  var actionsEl = document.getElementById('heroActions');
  if (isOwnProfile) {
    actionsEl.innerHTML = '<a href="shop.html" class="profile-btn secondary" style="text-decoration:none">Edit Avatar</a>';
  } else if (currentUser) {
    // Show friend status button
    renderFriendButton(actionsEl, targetUser);
  }

  // ─── COMPUTE STATS LIVE ───
  var progress = profileData.badgeProgress || {};
  var friendCount = (profileData.friends || []).length;
  var itemCount = (profileData.inventory || []).length;
  var displayName = profileData.username || targetUser;

  // Count games played + leaderboard placements from scores collection
  var liveGamesPlayed = 0;
  var livePodiumGames = [];
  var liveFirstPlaceGames = [];
  var liveCoinsEarned = progress.totalCoinsEarned || 0;
  var liveBestStreak = progress.bestStreak || 0;

  // Query all scores for this user
  if (window.FirebaseLB) {
    var scorePromises = GAMES.map(function(game) {
      return window.FirebaseLB.getScores(game.id, 10).then(function(scores) {
        for (var i = 0; i < scores.length; i++) {
          if (scores[i].name && scores[i].name.toLowerCase() === targetUser.toLowerCase()) {
            liveGamesPlayed++;
            if (i < 3) livePodiumGames.push(game.id);
            if (i === 0) liveFirstPlaceGames.push(game.id);
            break;
          }
        }
      }).catch(function() {});
    });
    await Promise.all(scorePromises);
  }

  // Use best available data
  var gamesPlayed = Math.max(liveGamesPlayed, progress.gamesPlayed || 0);
  var coinsEarned = Math.max(liveCoinsEarned, (profileData.coins || 0) + (itemCount * 30));
  var itemsPurchased = Math.max(itemCount, progress.itemsPurchased || 0);
  var podiumCount = Math.max(livePodiumGames.length, progress.podiumCount || 0);
  var firstPlaceCount = Math.max(liveFirstPlaceGames.length, progress.firstPlaceCount || 0);

  // ─── STATS ROW ───
  var statsRow = document.getElementById('statsRow');
  var stats = [
    { value: gamesPlayed, label: 'Games Played' },
    { value: fmtScore(coinsEarned), label: 'Coins Earned' },
    { value: itemCount, label: 'Items Owned' },
    { value: friendCount, label: 'Friends' }
  ];
  stats.forEach(function(s) {
    var box = document.createElement('div');
    box.className = 'stat-box';
    box.innerHTML = '<div class="stat-value">' + s.value + '</div><div class="stat-label">' + s.label + '</div>';
    statsRow.appendChild(box);
  });

  // ─── BADGES (compute live) ───
  var badgesWrap = document.getElementById('badgesWrap');
  var earnedBadges = (profileData.badges || []).slice();

  // Evaluate badges on the fly using live data
  if (window.ArcadeBadges) {
    var liveValues = {
      gamesPlayed: gamesPlayed,
      totalCoinsEarned: coinsEarned,
      itemsPurchased: itemsPurchased,
      podiumCount: podiumCount,
      firstPlaceCount: firstPlaceCount,
      friendCount: friendCount,
      bestStreak: liveBestStreak,
      hasCustomized: 0,
      gamesWithScores: liveGamesPlayed
    };
    var eq = profileData.equipped || {};
    if (eq.hat || eq.hair || eq.face || eq.shirt || eq.nametagColor || eq.nametagFont) {
      liveValues.hasCustomized = 1;
    }
    window.ArcadeBadges.BADGES.forEach(function(b) {
      if (earnedBadges.indexOf(b.id) === -1 && (liveValues[b.field] || 0) >= b.target) {
        earnedBadges.push(b.id);
      }
    });
    window.ArcadeBadges.render(badgesWrap, earnedBadges, { showAll: true });
  }

  // ─── RECENTLY PLAYED ───
  renderRecentGames(profileData);

  // ─── SCORES ───
  await renderScores(targetUser);

  // ─── FRIENDS ───
  await renderFriends(profileData);

  // ─── FRIEND REQUESTS (own profile) ───
  if (isOwnProfile) {
    await renderRequests();
    // Show add friend section
    document.getElementById('addFriendHeader').style.display = '';
    document.getElementById('addFriendBar').style.display = '';
  }
}

async function renderFriendButton(container, username) {
  if (!window.ArcadeFriends) {
    container.innerHTML = '';
    return;
  }
  var status = await window.ArcadeFriends.getStatus(username);
  container.innerHTML = '';
  if (status === 'friends') {
    var btn = document.createElement('button');
    btn.className = 'profile-btn success';
    btn.textContent = '\u2714 Friends';
    container.appendChild(btn);
    var chatBtn = document.createElement('a');
    chatBtn.className = 'profile-btn primary';
    chatBtn.style.textDecoration = 'none';
    chatBtn.href = 'index.html?dm=' + encodeURIComponent(username);
    chatBtn.textContent = '\uD83D\uDCAC Chat';
    container.appendChild(chatBtn);
    var removeBtn = document.createElement('button');
    removeBtn.className = 'profile-btn danger';
    removeBtn.textContent = 'Remove';
    removeBtn.onclick = async function() {
      var r = await window.ArcadeFriends.removeFriend(username);
      if (r.ok) renderFriendButton(container, username);
    };
    container.appendChild(removeBtn);
  } else if (status === 'pending_sent') {
    var btn = document.createElement('button');
    btn.className = 'profile-btn pending';
    btn.textContent = '\u23F3 Pending';
    container.appendChild(btn);
  } else if (status === 'pending_received') {
    var btn = document.createElement('button');
    btn.className = 'profile-btn primary';
    btn.textContent = 'Accept Request';
    btn.onclick = async function() {
      var r = await window.ArcadeFriends.acceptRequest(username);
      if (r.ok) renderFriendButton(container, username);
    };
    container.appendChild(btn);
  } else {
    var btn = document.createElement('button');
    btn.className = 'profile-btn primary';
    btn.textContent = '+ Add Friend';
    btn.onclick = async function() {
      btn.disabled = true;
      btn.textContent = 'Sending...';
      var r = await window.ArcadeFriends.sendRequest(username);
      if (r.ok) {
        renderFriendButton(container, username);
      } else {
        btn.disabled = false;
        btn.textContent = r.msg || 'Failed';
      }
    };
    container.appendChild(btn);
  }
}

function renderRecentGames(profileData) {
  var recent = profileData.recentGames || [];
  var wrap = document.getElementById('recentGames');
  var header = document.getElementById('recentHeader');
  if (recent.length === 0) return;

  header.style.display = '';
  wrap.innerHTML = '';

  function timeAgo(ts) {
    var diff = Date.now() - ts;
    var mins = Math.floor(diff / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs / 24);
    return days + 'd ago';
  }

  recent.forEach(function(r) {
    var game = GAME_MAP[r.gameId];
    if (!game) return;
    var url = GAME_URLS[r.gameId] || (r.gameId + '.html');
    var card = document.createElement('a');
    card.className = 'recent-card';
    card.href = url;
    card.innerHTML =
      '<span class="rc-emoji">' + game.emoji + '</span>' +
      '<div>' +
        '<div class="rc-name">' + game.name + '</div>' +
        '<div class="rc-time">' + timeAgo(r.time) + '</div>' +
      '</div>';
    wrap.appendChild(card);
  });
}

async function renderScores(username) {
  var grid = document.getElementById('scoresGrid');
  grid.innerHTML = '';

  if (!window.FirebaseLB) {
    grid.innerHTML = '<p class="empty-text">Leaderboard unavailable</p>';
    return;
  }

  // Fetch scores for all games where user has an entry
  var found = [];
  var key = username.toLowerCase();

  // Query all games concurrently (batch of promises)
  var promises = GAMES.map(function(game) {
    return window.FirebaseLB.getScores(game.id, 10).then(function(scores) {
      for (var i = 0; i < scores.length; i++) {
        if (scores[i].name.toLowerCase() === key) {
          found.push({
            game: game,
            score: scores[i].score,
            rank: i + 1
          });
          break;
        }
      }
    }).catch(function() {});
  });

  await Promise.all(promises);

  if (found.length === 0) {
    grid.innerHTML = '<p class="empty-text">No scores yet</p>';
    return;
  }

  // Sort by rank (best placements first)
  found.sort(function(a, b) { return a.rank - b.rank; });

  found.forEach(function(entry) {
    var card = document.createElement('div');
    card.className = 'score-card';

    var rankClass = 'normal';
    if (entry.rank === 1) rankClass = 'gold';
    else if (entry.rank === 2) rankClass = 'silver';
    else if (entry.rank === 3) rankClass = 'bronze';

    var gameUrl = GAME_URLS[entry.game.id] || (entry.game.id + '.html');
    card.innerHTML =
      '<span class="sc-emoji">' + entry.game.emoji + '</span>' +
      '<div class="sc-info">' +
        '<a class="sc-name" href="' + gameUrl + '">' + entry.game.name + '</a>' +
        '<div class="sc-score">' + fmtScore(entry.score) + ' ' + entry.game.unit + '</div>' +
      '</div>' +
      '<span class="sc-rank ' + rankClass + '">#' + entry.rank + '</span>';
    grid.appendChild(card);
  });
}

async function renderFriends(profileData) {
  var wrap = document.getElementById('friendsWrap');
  var friendKeys = profileData.friends || [];

  if (friendKeys.length === 0) {
    wrap.innerHTML = '<p class="empty-text">No friends yet</p>';
    return;
  }

  var list = document.createElement('div');
  list.className = 'friends-list';

  for (var i = 0; i < friendKeys.length; i++) {
    var fKey = friendKeys[i];
    var card = document.createElement('a');
    card.className = 'friend-card';
    card.href = 'profile.html?user=' + encodeURIComponent(fKey);

    var avatar = document.createElement('span');
    avatar.className = 'friend-avatar';
    avatar.dataset.username = fKey;

    var name = document.createElement('span');
    name.className = 'friend-name';
    name.dataset.username = fKey;
    name.textContent = fKey;

    card.appendChild(avatar);
    card.appendChild(name);
    list.appendChild(card);

    // Load avatar + display name async
    (function(avatarEl, nameEl, username) {
      if (window.ArcadeCoins && window.ArcadeCoins.getProfile) {
        window.ArcadeCoins.getProfile(username).then(function(profile) {
          if (!profile) return;
          if (window.ArcadeAvatar) {
            window.ArcadeAvatar.renderMini(avatarEl, profile, 32);
            window.ArcadeAvatar.styleName(nameEl, profile);
          }
        }).catch(function() {});
      }
      // Get display name
      if (window.ArcadeBadges && window.ArcadeBadges.getFullProfile) {
        window.ArcadeBadges.getFullProfile(username).then(function(data) {
          if (data && data.username) {
            nameEl.textContent = data.username;
            // Update href too
            nameEl.closest('a').href = 'profile.html?user=' + encodeURIComponent(data.username);
          }
        }).catch(function() {});
      }
    })(avatar, name, fKey);
  }

  wrap.appendChild(list);
}

async function renderRequests() {
  if (!window.ArcadeFriends) return;
  var requests = await window.ArcadeFriends.getIncomingRequests();
  if (requests.length === 0) return;

  document.getElementById('requestsHeader').style.display = '';
  document.getElementById('requestsWrap').style.display = '';

  var wrap = document.getElementById('requestsWrap');
  wrap.innerHTML = '';

  requests.forEach(function(fromUser) {
    var card = document.createElement('div');
    card.className = 'request-card';

    var nameEl = document.createElement('span');
    nameEl.className = 'req-name';
    nameEl.textContent = fromUser;

    var acceptBtn = document.createElement('button');
    acceptBtn.className = 'req-btn req-accept';
    acceptBtn.textContent = 'Accept';
    acceptBtn.onclick = async function() {
      var r = await window.ArcadeFriends.acceptRequest(fromUser);
      if (r.ok) {
        card.remove();
        if (wrap.children.length === 0) {
          document.getElementById('requestsHeader').style.display = 'none';
          document.getElementById('requestsWrap').style.display = 'none';
        }
      }
    };

    var declineBtn = document.createElement('button');
    declineBtn.className = 'req-btn req-decline';
    declineBtn.textContent = 'Decline';
    declineBtn.onclick = async function() {
      var r = await window.ArcadeFriends.declineRequest(fromUser);
      if (r.ok) {
        card.remove();
        if (wrap.children.length === 0) {
          document.getElementById('requestsHeader').style.display = 'none';
          document.getElementById('requestsWrap').style.display = 'none';
        }
      }
    };

    card.appendChild(nameEl);
    card.appendChild(acceptBtn);
    card.appendChild(declineBtn);
    wrap.appendChild(card);
  });
}

// Add friend from the add friend bar
async function doAddFriend() {
  var input = document.getElementById('addFriendInput');
  var msg = document.getElementById('addFriendMsg');
  var btn = document.getElementById('addFriendBtn');
  var username = input.value.trim();
  if (!username) return;

  btn.disabled = true;
  btn.textContent = 'Sending...';
  msg.textContent = '';

  if (!window.ArcadeFriends) {
    msg.textContent = 'Friends system not loaded';
    msg.style.color = '#ff4757';
    btn.disabled = false;
    btn.textContent = 'Send Request';
    return;
  }

  var result = await window.ArcadeFriends.sendRequest(username);
  if (result.ok) {
    msg.textContent = result.msg;
    msg.style.color = '#2ed573';
    input.value = '';
  } else {
    msg.textContent = result.msg;
    msg.style.color = '#ff4757';
  }
  btn.disabled = false;
  btn.textContent = 'Send Request';
}

// Enter key in add friend input
document.getElementById('addFriendInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doAddFriend();
});

// Load the profile
loadProfile();
</script>
