  function loadHole(idx) {
    const h = holes[idx];
    ball.x = h.ball.x;
    ball.y = h.ball.y;
    ball.vx = 0;
    ball.vy = 0;
    ballMoving = false;
    sinking = false;
    sinkTimer = 0;
    holeComplete = false;
    strokesThisHole = 0;
    aiming = false;
    holeNumEl.textContent = idx + 1;
    strokesEl.textContent = 0;
    parEl.textContent = h.par;
    messageEl.textContent = '';
    powerFill.style.width = '0%';
  }

  function draw() {
    const h = holes[currentHole];
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#0f0f1a';
    ctx.fillRect(0, 0, W, H);

    // Determine course bounds for felt
    ctx.fillStyle = '#1a4a2a';
    // Draw felt as the playable area (inside outer walls)
    // Simple: fill a large rect, walls will draw on top
    let minX = W, minY = H, maxX = 0, maxY = 0;
    h.walls.forEach(w => {
      if (w.x < minX) minX = w.x;
      if (w.y < minY) minY = w.y;
      if (w.x + w.w > maxX) maxX = w.x + w.w;
      if (w.y + w.h > maxY) maxY = w.y + w.h;
    });
    ctx.fillRect(minX, minY, maxX - minX, maxY - minY);

    // Walls
    ctx.fillStyle = '#2a2a4a';
    h.walls.forEach(w => {
      ctx.fillRect(w.x, w.y, w.w, w.h);
    });

    // Bumpers
    h.bumpers.forEach(b => {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = '#2a2a4a';
      ctx.fill();
      ctx.strokeStyle = '#4a4a7a';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // Hole target
    ctx.beginPath();
    ctx.arc(h.hole.x, h.hole.y, HOLE_R, 0, Math.PI * 2);
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Flag
    ctx.beginPath();
    ctx.arc(h.hole.x, h.hole.y, HOLE_R - 3, 0, Math.PI * 2);
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Aiming line
    if (aiming && !ballMoving && !sinking && !holeComplete) {
      const dx = aimEnd.x - aimStart.x;
      const dy = aimEnd.y - aimStart.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 5) {
        // Direction is opposite of drag
        const dirX = -dx / dist;
        const dirY = -dy / dist;
        const power = Math.min(dist, MAX_POWER * 15) / (MAX_POWER * 15);
        const lineLen = power * 120;

        ctx.setLineDash([6, 6]);
        ctx.strokeStyle = 'rgba(255,255,255,0.7)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + dirX * lineLen, ball.y + dirY * lineLen);
        ctx.stroke();
        ctx.setLineDash([]);

        // Arrow head
        const ax = ball.x + dirX * lineLen;
        const ay = ball.y + dirY * lineLen;
        ctx.beginPath();
        ctx.arc(ax, ay, 3, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.fill();
      }
    }

    // Ball (unless fully sunk)
    if (!holeComplete) {
      if (sinking) {
        // Shrinking animation
        const r = BALL_R * (1 - sinkTimer / 20);
        if (r > 0) {
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, r, 0, Math.PI * 2);
          ctx.fillStyle = '#fff';
          ctx.fill();
        }
      } else {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
  }

  function wallCollision(bx, by, bvx, bvy) {
    const h = holes[currentHole];
    let nvx = bvx, nvy = bvy;
    let nx = bx, ny = by;
    let bounced = false;

    h.walls.forEach(w => {
      // Find closest point on rect to ball
      const cx = Math.max(w.x, Math.min(bx, w.x + w.w));
      const cy = Math.max(w.y, Math.min(by, w.y + w.h));
      const dx = bx - cx;
      const dy = by - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < BALL_R) {
        bounced = true;
        // Push ball out
        if (dist === 0) {
          // Ball center is inside wall - push out based on velocity
          if (Math.abs(bvx) > Math.abs(bvy)) {
            nvx = -bvx * 0.8;
            nx = bvx > 0 ? w.x - BALL_R : w.x + w.w + BALL_R;
          } else {
            nvy = -bvy * 0.8;
            ny = bvy > 0 ? w.y - BALL_R : w.y + w.h + BALL_R;
          }
        } else {
          const normX = dx / dist;
          const normY = dy / dist;
          // Push out
          nx = cx + normX * BALL_R;
          ny = cy + normY * BALL_R;
          // Reflect velocity
          const dot = nvx * normX + nvy * normY;
          nvx = (nvx - 2 * dot * normX) * 0.8;
          nvy = (nvy - 2 * dot * normY) * 0.8;
        }
      }
    });

    // Bumper collision
    h.bumpers.forEach(b => {
      const dx = bx - b.x;
      const dy = by - b.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < BALL_R + b.r) {
        bounced = true;
        const normX = dx / dist;
        const normY = dy / dist;
        nx = b.x + normX * (BALL_R + b.r);
        ny = b.y + normY * (BALL_R + b.r);
        const dot = nvx * normX + nvy * normY;
        nvx = (nvx - 2 * dot * normX) * 1.05;
        nvy = (nvy - 2 * dot * normY) * 1.05;
      }
    });

    return { x: nx, y: ny, vx: nvx, vy: nvy, bounced };
  }

  function update() {
    if (sinking) {
      sinkTimer++;
      if (sinkTimer >= 20) {
        sinking = false;
        holeComplete = true;
        ballMoving = false;
        scores.push(strokesThisHole);
        // strokesThisHole already counted in totalStrokes
        const h = holes[currentHole];
        const diff = strokesThisHole - h.par;
        let label = '';
        if (diff <= -2) label = 'Eagle!';
        else if (diff === -1) label = 'Birdie!';
        else if (diff === 0) label = 'Par!';
        else if (diff === 1) label = 'Bogey';
        else label = '+' + diff;
        messageEl.textContent = label + (currentHole < 14 ? ' - Click to continue' : '');
        window.SFX?.coin();

        if (currentHole >= 14) {
          // Game complete
          setTimeout(showScorecard, 1200);
        }
      }
      return;
    }

    if (!ballMoving) return;

    ball.x += ball.vx;
    ball.y += ball.vy;

    // Wall collisions
    const col = wallCollision(ball.x, ball.y, ball.vx, ball.vy);
    if (col.bounced) {
      ball.x = col.x;
      ball.y = col.y;
      ball.vx = col.vx;
      ball.vy = col.vy;
      window.SFX?.bounce();
    }

    // Friction
    ball.vx *= FRICTION;
    ball.vy *= FRICTION;

    // Check if stopped
    const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (speed < MIN_SPEED) {
      ball.vx = 0;
      ball.vy = 0;
      ballMoving = false;
    }

    // Hole detection - check both current position and trajectory
    const h = holes[currentHole];
    const hx = h.hole.x - ball.x;
    const hy = h.hole.y - ball.y;
    const hDist = Math.sqrt(hx * hx + hy * hy);
    // Also check if ball crossed over the hole this frame (line segment intersection)
    const prevX = ball.x - ball.vx;
    const prevY = ball.y - ball.vy;
    const closestT = Math.max(0, Math.min(1,
      ((h.hole.x - prevX) * ball.vx + (h.hole.y - prevY) * ball.vy) / (ball.vx * ball.vx + ball.vy * ball.vy + 0.001)));
    const nearX = prevX + closestT * ball.vx;
    const nearY = prevY + closestT * ball.vy;
    const nearDist = Math.sqrt((h.hole.x - nearX) ** 2 + (h.hole.y - nearY) ** 2);
    const effectiveDist = Math.min(hDist, nearDist);
    if (effectiveDist < SINK_DIST && speed < SINK_SPEED) {
      // Sinking!
      sinking = true;
      sinkTimer = 0;
      ball.vx = 0;
      ball.vy = 0;
      ball.x = h.hole.x;
      ball.y = h.hole.y;
      ballMoving = false;
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  // Input handling
  canvas.addEventListener('mousedown', function(e) {
    if (gameOver) return;
    if (holeComplete) {
      if (currentHole < 14) {
        currentHole++;
        loadHole(currentHole);
      }
      return;
    }
    if (ballMoving || sinking) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    aiming = true;
    aimStart.x = mx;
    aimStart.y = my;
    aimEnd.x = mx;
    aimEnd.y = my;
  });

  canvas.addEventListener('mousemove', function(e) {
    if (!aiming) return;
    const rect = canvas.getBoundingClientRect();
    aimEnd.x = (e.clientX - rect.left) * (W / rect.width);
    aimEnd.y = (e.clientY - rect.top) * (H / rect.height);
    // Update power bar
    const dx = aimEnd.x - aimStart.x;
    const dy = aimEnd.y - aimStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const power = Math.min(dist / (MAX_POWER * 15), 1);
    powerFill.style.width = (power * 100) + '%';
  });

  canvas.addEventListener('mouseup', function(e) {
    if (!aiming) return;
    aiming = false;
    powerFill.style.width = '0%';
    if (ballMoving || sinking || holeComplete || gameOver) return;

    const dx = aimEnd.x - aimStart.x;
    const dy = aimEnd.y - aimStart.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < 8) return; // too small, ignore

    const power = Math.min(dist / 15, MAX_POWER);
    ball.vx = -(dx / dist) * power;
    ball.vy = -(dy / dist) * power;
    ballMoving = true;
    strokesThisHole++;
    totalStrokes++;
    strokesEl.textContent = strokesThisHole;
    totalEl.textContent = totalStrokes;
    window.SFX?.click();
  });

  // Touch support
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousedown', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    const t = e.touches[0];
    canvas.dispatchEvent(new MouseEvent('mousemove', { clientX: t.clientX, clientY: t.clientY }));
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    canvas.dispatchEvent(new MouseEvent('mouseup', {}));
  }, { passive: false });

  function showScorecard() {
    gameOver = true;
    window.SFX?.win();
    const tbody = document.querySelector('#scoreTable tbody');
    tbody.innerHTML = '';
    let totalPar = 0;
    for (let i = 0; i < 15; i++) {
      const h = holes[i];
      const s = scores[i];
      const diff = s - h.par;
      totalPar += h.par;
      const cls = diff < 0 ? 'under-par' : diff > 0 ? 'over-par' : 'on-par';
      const diffStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : diff);
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${i + 1}</td><td>${h.par}</td><td>${s}</td><td class="${cls}">${diffStr}</td>`;
      tbody.appendChild(tr);
    }
    // Total row
    const diff = totalStrokes - totalPar;
    const diffStr = diff === 0 ? 'E' : (diff > 0 ? '+' + diff : diff);
    const tr = document.createElement('tr');
    tr.className = 'total-row';
    tr.innerHTML = `<td>Total</td><td>${totalPar}</td><td>${totalStrokes}</td><td>${diffStr}</td>`;
    tbody.appendChild(tr);
    scorecardEl.style.display = 'block';
    messageEl.textContent = 'Final Score: ' + totalStrokes + ' (' + diffStr + ')';

    // Submit to leaderboard
    if (totalStrokes > 0 && window.HallOfFame) {
      window.HallOfFame.submit('golf', totalStrokes);
    }
  }

  document.getElementById('playAgain').addEventListener('click', function() {
    currentHole = 0;
    totalStrokes = 0;
    scores = [];
    gameOver = false;
    scorecardEl.style.display = 'none';
    totalEl.textContent = '0';
    loadHole(0);
  });

  // Start
  loadHole(0);
  gameLoop();
})();
</script>
