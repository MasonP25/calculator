<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Nights at Freddy's</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 20px 20px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 1.5rem;
    background: linear-gradient(90deg, #555, #e74c3c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .game-container {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    overflow: hidden;
    background: #231F20;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .game-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  a.back {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10001;
    color: #aaa;
    text-decoration: none;
    font-size: 15px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    padding: 6px 14px;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  a.back:hover {
    background: #2a2a4a;
    color: #fff;
  }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Five Nights at Freddy's</h1>
<div class="game-container">
  <iframe src="https://irv77.github.io/hd_fnaf/1/" allowfullscreen></iframe>
</div>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="badges.js"></script>
<script src="friends.js"></script>
<script src="notifications.js?v=2"></script>
<script src="levels.js?v=2"></script>
<script src="gifting.js?v=2"></script>
<script src="trading.js?v=2"></script>
<script src="challenges.js?v=1"></script>
<script src="activity.js?v=2"></script>
<script src="ratings.js?v=2"></script>
<script src="admin.js"></script>
<script src="auth.js?v=2"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
