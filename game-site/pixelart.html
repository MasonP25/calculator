<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Art Maker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#e0e0e0;font-family:'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:60px 16px 100px}
a.back{position:fixed;top:12px;left:16px;color:#888;text-decoration:none;z-index:100;font-size:1.1rem}
a.back:hover{color:#e0e0e0}
h1{font-size:1.8rem;margin-bottom:12px;background:linear-gradient(90deg,#7b2ff7,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;justify-content:center}
.toolbar button{background:#1a1a2e;color:#ccc;border:2px solid #2a2a4a;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:0.85rem;transition:all 0.2s}
.toolbar button:hover{border-color:#7b2ff7;color:#fff}
.toolbar button.active{background:#7b2ff7;color:#fff;border-color:#7b2ff7}
.toolbar .sep{width:2px;background:#2a2a4a;margin:0 4px;align-self:stretch}

.size-bar{display:flex;gap:6px;margin-bottom:10px;justify-content:center}
.size-bar button{background:#1a1a2e;color:#ccc;border:2px solid #2a2a4a;border-radius:8px;padding:5px 14px;cursor:pointer;font-size:0.8rem;transition:all 0.2s}
.size-bar button:hover{border-color:#00d4ff;color:#fff}
.size-bar button.active{background:#00d4ff;color:#0f0f1a;border-color:#00d4ff;font-weight:700}

.color-section{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.current-color{width:36px;height:36px;border:2px solid #555;border-radius:6px}
.palette{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:340px}
.palette .swatch{width:24px;height:24px;border:2px solid #333;border-radius:4px;cursor:pointer;transition:transform 0.15s}
.palette .swatch:hover{transform:scale(1.2)}
.palette .swatch.active{border-color:#fff;transform:scale(1.15)}
.custom-color-wrap{display:flex;align-items:center;gap:8px;margin-top:4px}
.custom-color-wrap label{font-size:0.8rem;color:#aaa}
.custom-color-wrap input[type="color"]{width:48px;height:36px;border:2px solid #3a3a5a;border-radius:8px;cursor:pointer;padding:2px;background:transparent}
.custom-color-wrap input[type="color"]::-webkit-color-swatch-wrapper{padding:2px}
.custom-color-wrap input[type="color"]::-webkit-color-swatch{border:none;border-radius:4px}

.canvas-wrap{position:relative;margin-bottom:14px}
canvas#art{background:#1a1a2e;cursor:crosshair;border:2px solid #2a2a4a;border-radius:4px;image-rendering:pixelated}

.actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;justify-content:center}
.actions button{background:linear-gradient(135deg,#7b2ff7,#00d4ff);color:#fff;border:none;border-radius:8px;padding:8px 18px;cursor:pointer;font-size:0.85rem;font-weight:600;transition:opacity 0.2s}
.actions button:hover{opacity:0.85}
.actions button.secondary{background:#1a1a2e;border:2px solid #2a2a4a}
.actions button.secondary:hover{border-color:#7b2ff7}

.mirror-indicator{color:#ff6b81;font-size:0.75rem;margin-bottom:6px;display:none}
.mirror-indicator.on{display:block}

.gallery{max-width:600px;width:100%;display:none}
.gallery h2{font-size:1.2rem;margin-bottom:10px;text-align:center;color:#00d4ff}
.gallery-grid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.gallery-item{background:#1a1a2e;border:2px solid #2a2a4a;border-radius:8px;padding:8px;text-align:center;cursor:pointer;transition:border-color 0.2s;position:relative}
.gallery-item:hover{border-color:#7b2ff7}
.gallery-item canvas{border-radius:4px;image-rendering:pixelated}
.gallery-item .name{font-size:0.72rem;color:#ccc;margin-top:4px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gallery-item .date{font-size:0.62rem;color:#666;margin-top:2px}
.gallery-item .del{position:absolute;top:4px;right:6px;color:#ff4757;font-size:0.8rem;cursor:pointer;opacity:0;transition:opacity 0.2s}
.gallery-item:hover .del{opacity:1}
.empty-gallery{color:#666;text-align:center;padding:20px;font-size:0.9rem}

@media(max-width:500px){
  canvas#art{max-width:90vw;max-height:90vw}
  .toolbar button{padding:5px 8px;font-size:0.75rem}
}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<h1>Pixel Art Maker</h1>

<div class="size-bar">
  <button onclick="setSize(8)" id="s8">8&times;8</button>
  <button onclick="setSize(16)" id="s16" class="active">16&times;16</button>
  <button onclick="setSize(32)" id="s32">32&times;32</button>
  <button onclick="setSize(64)" id="s64">64&times;64</button>
</div>

<div class="toolbar">
  <button onclick="setTool('pencil')" id="tPencil" class="active" title="Pencil (B)">&#9998; Pencil</button>
  <button onclick="setTool('eraser')" id="tEraser" title="Eraser (E)">&#9003; Eraser</button>
  <div class="sep"></div>
  <button onclick="doUndo()" title="Undo (Ctrl+Z)">&#8630; Undo</button>
  <button onclick="doRedo()" title="Redo (Ctrl+Y)">&#8631; Redo</button>
  <div class="sep"></div>
  <button onclick="toggleMirror()" id="tMirror" title="Mirror Mode (M)">&#8596; Mirror</button>
  <button onclick="toggleGrid()" id="tGrid" class="active" title="Toggle Grid (H)">&#9638; Grid</button>
  <button onclick="clearCanvas()" title="Clear (Del)">&#10060; Clear</button>
</div>

<div class="color-section">
  <div class="current-color" id="curColor" style="background:#e0e0e0"></div>
  <div class="palette" id="palette"></div>
</div>
<div class="custom-color-wrap">
  <label>Custom:</label>
  <input type="color" id="colorPicker" value="#e0e0e0">
  <button onclick="useCustomColor()" style="background:#1a1a2e;color:#ccc;border:2px solid #3a3a5a;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:0.8rem">Use</button>
</div>

<div class="mirror-indicator" id="mirrorInd">&#8596; Mirror Mode ON</div>

<div class="canvas-wrap">
  <canvas id="art" width="512" height="512"></canvas>
</div>

<div class="actions">
  <button onclick="savePNG()">&#128190; Save PNG</button>
  <button onclick="saveToGallery()" class="secondary">&#128194; Save to Gallery</button>
  <button onclick="toggleGallery()" class="secondary" id="galleryBtn">&#128444; Gallery</button>
</div>

<div class="gallery" id="gallery">
  <h2>Saved Creations</h2>
  <div class="gallery-grid" id="galleryGrid"></div>
</div>

<script>
var CANVAS_PX = 512;
var PALETTE_COLORS = [
  '#000000','#ffffff','#e0e0e0','#808080','#404040',
  '#ff0000','#ff4757','#ff6b81','#ff8c00','#ffa502',
  '#ffd700','#fffa65','#2ed573','#00b894','#00d4ff',
  '#1e90ff','#7b2ff7','#a855f7','#ff69b4','#8b4513'
];

var canvas = document.getElementById('art');
var ctx = canvas.getContext('2d');
var gridSize = 16;
var grid = [];
var tool = 'pencil';
var color = '#e0e0e0';
var showGrid = true;
var mirror = false;
var undoStack = [];
var redoStack = [];
var MAX_HISTORY = 30;
var isDrawing = false;
var lastCell = null;

// Init palette
(function() {
  var pal = document.getElementById('palette');
  for (var i = 0; i < PALETTE_COLORS.length; i++) {
    var s = document.createElement('div');
    s.className = 'swatch' + (PALETTE_COLORS[i] === color ? ' active' : '');
    s.style.background = PALETTE_COLORS[i];
    s.dataset.color = PALETTE_COLORS[i];
    s.onclick = function() {
      setColor(this.dataset.color);
    };
    pal.appendChild(s);
  }
})();

// Custom color picker — live preview as you drag
document.getElementById('colorPicker').addEventListener('input', function() {
  document.getElementById('curColor').style.background = this.value;
});

function useCustomColor() {
  setColor(document.getElementById('colorPicker').value);
}

function setColor(c) {
  color = c;
  document.getElementById('curColor').style.background = c;
  document.getElementById('colorPicker').value = c;
  var swatches = document.querySelectorAll('.swatch');
  for (var i = 0; i < swatches.length; i++) {
    swatches[i].classList.toggle('active', swatches[i].dataset.color === c);
  }
}

function initGrid() {
  grid = [];
  for (var r = 0; r < gridSize; r++) {
    grid[r] = [];
    for (var c = 0; c < gridSize; c++) {
      grid[r][c] = null;
    }
  }
  undoStack = [];
  redoStack = [];
  draw();
}

function cellSize() { return CANVAS_PX / gridSize; }

function draw() {
  ctx.clearRect(0, 0, CANVAS_PX, CANVAS_PX);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CANVAS_PX, CANVAS_PX);
  var cs = cellSize();
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      if (grid[r][c]) {
        ctx.fillStyle = grid[r][c];
        ctx.fillRect(c * cs, r * cs, cs, cs);
      }
    }
  }
  if (showGrid && gridSize <= 32) {
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    for (var i = 0; i <= gridSize; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cs + 0.5, 0);
      ctx.lineTo(i * cs + 0.5, CANVAS_PX);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * cs + 0.5);
      ctx.lineTo(CANVAS_PX, i * cs + 0.5);
      ctx.stroke();
    }
  }
}

function getCell(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = CANVAS_PX / rect.width;
  var scaleY = CANVAS_PX / rect.height;
  var x = (e.clientX - rect.left) * scaleX;
  var y = (e.clientY - rect.top) * scaleY;
  var cs = cellSize();
  var col = Math.floor(x / cs);
  var row = Math.floor(y / cs);
  if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return null;
  return { r: row, c: col };
}

function getTouchCell(e) {
  var t = e.touches[0];
  var rect = canvas.getBoundingClientRect();
  var scaleX = CANVAS_PX / rect.width;
  var scaleY = CANVAS_PX / rect.height;
  var x = (t.clientX - rect.left) * scaleX;
  var y = (t.clientY - rect.top) * scaleY;
  var cs = cellSize();
  var col = Math.floor(x / cs);
  var row = Math.floor(y / cs);
  if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return null;
  return { r: row, c: col };
}

function applyTool(cell) {
  if (!cell) return;
  if (tool === 'pencil') {
    grid[cell.r][cell.c] = color;
    if (mirror) {
      grid[cell.r][gridSize - 1 - cell.c] = color;
    }
    draw();
  } else if (tool === 'eraser') {
    grid[cell.r][cell.c] = null;
    if (mirror) {
      grid[cell.r][gridSize - 1 - cell.c] = null;
    }
    draw();
  }
}

// Undo/Redo with two stacks
function copyGrid() {
  var g = [];
  for (var r = 0; r < grid.length; r++) {
    g[r] = grid[r].slice();
  }
  return g;
}

function copyGridFrom(src) {
  var g = [];
  for (var r = 0; r < src.length; r++) {
    g[r] = src[r].slice();
  }
  return g;
}

function saveState() {
  undoStack.push(copyGrid());
  if (undoStack.length > MAX_HISTORY) undoStack.shift();
  redoStack = [];
}

function doUndo() {
  if (undoStack.length === 0) return;
  redoStack.push(copyGrid());
  grid = undoStack.pop();
  draw();
  if (window.SFX) window.SFX.click();
}

function doRedo() {
  if (redoStack.length === 0) return;
  undoStack.push(copyGrid());
  grid = redoStack.pop();
  draw();
  if (window.SFX) window.SFX.click();
}

// Mouse events
canvas.addEventListener('mousedown', function(e) {
  e.preventDefault();
  var cell = getCell(e);
  if (!cell) return;
  isDrawing = true;
  lastCell = cell;
  saveState();
  applyTool(cell);
});

canvas.addEventListener('mousemove', function(e) {
  if (!isDrawing) return;
  var cell = getCell(e);
  if (!cell || (lastCell && cell.r === lastCell.r && cell.c === lastCell.c)) return;
  lastCell = cell;
  applyTool(cell);
});

canvas.addEventListener('mouseup', function() {
  if (isDrawing) {
    isDrawing = false;
    lastCell = null;
  }
});

canvas.addEventListener('mouseleave', function() {
  if (isDrawing) {
    isDrawing = false;
    lastCell = null;
  }
});

// Touch events
canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var cell = getTouchCell(e);
  if (!cell) return;
  isDrawing = true;
  lastCell = cell;
  saveState();
  applyTool(cell);
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
  e.preventDefault();
  if (!isDrawing) return;
  var cell = getTouchCell(e);
  if (!cell || (lastCell && cell.r === lastCell.r && cell.c === lastCell.c)) return;
  lastCell = cell;
  applyTool(cell);
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
  e.preventDefault();
  if (isDrawing) {
    isDrawing = false;
    lastCell = null;
  }
});

// Tools
function setTool(t) {
  tool = t;
  document.getElementById('tPencil').classList.toggle('active', t === 'pencil');
  document.getElementById('tEraser').classList.toggle('active', t === 'eraser');
}

function toggleMirror() {
  mirror = !mirror;
  document.getElementById('tMirror').classList.toggle('active', mirror);
  document.getElementById('mirrorInd').classList.toggle('on', mirror);
}

function toggleGrid() {
  showGrid = !showGrid;
  document.getElementById('tGrid').classList.toggle('active', showGrid);
  draw();
}

function clearCanvas() {
  var hasPixels = false;
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      if (grid[r][c]) { hasPixels = true; break; }
    }
    if (hasPixels) break;
  }
  if (hasPixels && !confirm('Clear the canvas?')) return;
  saveState();
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      grid[r][c] = null;
    }
  }
  draw();
}

function setSize(s) {
  if (s === gridSize) return;
  var hasPixels = false;
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      if (grid[r][c]) { hasPixels = true; break; }
    }
    if (hasPixels) break;
  }
  if (hasPixels && !confirm('Changing grid size will clear your canvas. Continue?')) return;
  gridSize = s;
  document.getElementById('s8').classList.toggle('active', s === 8);
  document.getElementById('s16').classList.toggle('active', s === 16);
  document.getElementById('s32').classList.toggle('active', s === 32);
  document.getElementById('s64').classList.toggle('active', s === 64);
  initGrid();
}

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); doUndo(); return; }
  if (e.ctrlKey && e.key === 'y') { e.preventDefault(); doRedo(); return; }
  if (e.key === 'b') setTool('pencil');
  if (e.key === 'e') setTool('eraser');
  if (e.key === 'm') toggleMirror();
  if (e.key === 'h') toggleGrid();
  if (e.key === 'Delete') clearCanvas();
});

// Save PNG
function savePNG() {
  var scale = gridSize <= 16 ? 16 : (gridSize <= 32 ? 8 : 4);
  var size = gridSize * scale;
  var offscreen = document.createElement('canvas');
  offscreen.width = size;
  offscreen.height = size;
  var octx = offscreen.getContext('2d');
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      if (grid[r][c]) {
        octx.fillStyle = grid[r][c];
        octx.fillRect(c * scale, r * scale, scale, scale);
      }
    }
  }
  offscreen.toBlob(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'pixelart_' + gridSize + 'x' + gridSize + '.png';
    a.click();
    URL.revokeObjectURL(url);
  });
  if (window.SFX) window.SFX.coin();
}

// Gallery
var GALLERY_KEY = 'arcade_pixelart_gallery';
var MAX_GALLERY = 20;

function getGallery() {
  try { return JSON.parse(localStorage.getItem(GALLERY_KEY)) || []; }
  catch(e) { return []; }
}

function saveGallery(g) {
  localStorage.setItem(GALLERY_KEY, JSON.stringify(g));
}

function saveToGallery() {
  var hasPixels = false;
  for (var r = 0; r < gridSize; r++) {
    for (var c = 0; c < gridSize; c++) {
      if (grid[r][c]) { hasPixels = true; break; }
    }
    if (hasPixels) break;
  }
  if (!hasPixels) { alert('Draw something first!'); return; }
  var name = prompt('Name your creation:', 'Untitled');
  if (name === null) return;
  if (!name.trim()) name = 'Untitled';
  var gallery = getGallery();
  if (gallery.length >= MAX_GALLERY) {
    if (!confirm('Gallery is full (' + MAX_GALLERY + '). Remove oldest to save?')) return;
    gallery.shift();
  }
  gallery.push({
    name: name.trim().substring(0, 30),
    size: gridSize,
    grid: copyGrid(),
    date: Date.now()
  });
  saveGallery(gallery);
  if (window.SFX) window.SFX.coin();
  renderGallery();
}

function toggleGallery() {
  var g = document.getElementById('gallery');
  var showing = g.style.display !== 'none' && g.style.display !== '';
  g.style.display = showing ? 'none' : 'block';
  if (!showing) renderGallery();
}

function renderGallery() {
  var container = document.getElementById('galleryGrid');
  var gallery = getGallery();
  if (!gallery.length) {
    container.innerHTML = '<div class="empty-gallery">No saved creations yet. Start drawing!</div>';
    return;
  }
  container.innerHTML = '';
  for (var i = gallery.length - 1; i >= 0; i--) {
    (function(idx) {
      var item = gallery[idx];
      var div = document.createElement('div');
      div.className = 'gallery-item';
      var mc = document.createElement('canvas');
      var thumbSize = 80;
      mc.width = thumbSize;
      mc.height = thumbSize;
      mc.style.width = thumbSize + 'px';
      mc.style.height = thumbSize + 'px';
      var mctx = mc.getContext('2d');
      mctx.fillStyle = '#1a1a2e';
      mctx.fillRect(0, 0, thumbSize, thumbSize);
      var ps = thumbSize / item.size;
      for (var r = 0; r < item.size; r++) {
        for (var c = 0; c < item.size; c++) {
          if (item.grid[r] && item.grid[r][c]) {
            mctx.fillStyle = item.grid[r][c];
            mctx.fillRect(c * ps, r * ps, ps, ps);
          }
        }
      }
      div.appendChild(mc);
      var nameDiv = document.createElement('div');
      nameDiv.className = 'name';
      nameDiv.textContent = item.name;
      div.appendChild(nameDiv);
      var dateDiv = document.createElement('div');
      dateDiv.className = 'date';
      var d = new Date(item.date);
      dateDiv.textContent = (d.getMonth() + 1) + '/' + d.getDate();
      div.appendChild(dateDiv);
      var del = document.createElement('div');
      del.className = 'del';
      del.textContent = '\u2715';
      del.onclick = function(e) {
        e.stopPropagation();
        if (!confirm('Delete "' + item.name + '"?')) return;
        var g = getGallery();
        g.splice(idx, 1);
        saveGallery(g);
        renderGallery();
      };
      div.appendChild(del);
      div.onclick = function() {
        if (!confirm('Load "' + item.name + '"? Current canvas will be replaced.')) return;
        gridSize = item.size;
        document.getElementById('s8').classList.toggle('active', gridSize === 8);
        document.getElementById('s16').classList.toggle('active', gridSize === 16);
        document.getElementById('s32').classList.toggle('active', gridSize === 32);
        document.getElementById('s64').classList.toggle('active', gridSize === 64);
        grid = copyGridFrom(item.grid);
        undoStack = [];
        redoStack = [];
        draw();
        document.getElementById('gallery').style.display = 'none';
      };
      container.appendChild(div);
    })(i);
  }
}

// Init
initGrid();
</script>
