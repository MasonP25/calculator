<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    user-select: none;
  }
  h1 { font-size: 2rem; }

  .mode-select { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .mode-btn {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 0.4rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .mode-btn:hover { border-color: #7b2ff7; }
  .mode-btn.active { border-color: #7b2ff7; color: #7b2ff7; font-weight: 600; }

  .message-bar {
    height: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.5rem;
  }
  .message {
    background: #e0e0e0;
    color: #0f0f1a;
    padding: 0.3rem 1.2rem;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.95rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .message.show { opacity: 1; }

  /* Board */
  .board {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    gap: 6px;
    margin-bottom: 1.2rem;
  }
  .row {
    display: grid;
    gap: 6px;
  }
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    text-transform: uppercase;
    border: 2px solid #3a3a5a;
    border-radius: 4px;
    background: transparent;
    color: #e0e0e0;
    transition: transform 0.1s;
  }
  .tile.filled {
    border-color: #5a5a7a;
    animation: pop 0.1s ease;
  }
  .tile.reveal {
    animation: flipIn 0.25s ease forwards;
  }
  .tile.reveal-out {
    animation: flipOut 0.25s ease forwards;
  }
  .tile.correct  { background: #1b5e20; border-color: #1b5e20; }
  .tile.present  { background: #f9a825; border-color: #f9a825; color: #1a1a2e; }
  .tile.absent   { background: #3a3a5a; border-color: #3a3a5a; }

  .tile.bounce {
    animation: bounce 0.5s ease;
  }

  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes flipIn {
    0%   { transform: rotateX(0deg); }
    100% { transform: rotateX(90deg); }
  }
  @keyframes flipOut {
    0%   { transform: rotateX(90deg); }
    100% { transform: rotateX(0deg); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    30%  { transform: translateY(-20px); }
    60%  { transform: translateY(-8px); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%  { transform: translateX(-6px); }
    40%  { transform: translateX(6px); }
    60%  { transform: translateX(-4px); }
    80%  { transform: translateX(4px); }
  }
  .row.shake { animation: shake 0.4s ease; }

  /* Keyboard */
  .keyboard {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
  }
  .kb-row {
    display: flex;
    gap: 5px;
  }
  .key {
    height: 52px;
    min-width: 36px;
    padding: 0 8px;
    border: none;
    border-radius: 6px;
    background: #5a5a7a;
    color: #e0e0e0;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, color 0.2s;
  }
  .key:hover { background: #6a6a8a; }
  .key.wide { min-width: 60px; font-size: 0.8rem; }
  .key.correct { background: #1b5e20; color: #e0e0e0; }
  .key.present { background: #f9a825; color: #1a1a2e; }
  .key.absent  { background: #2a2a3a; color: #666; }

  /* Stats Popup */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .overlay.show { display: flex; }
  .stats-popup {
    background: #1a1a2e;
    border: 2px solid #7b2ff7;
    border-radius: 12px;
    padding: 2rem;
    width: 360px;
    max-width: 90vw;
    text-align: center;
    position: relative;
  }
  .stats-popup h2 {
    font-size: 1.4rem;
    margin-bottom: 0.3rem;
    color: #00d4ff;
  }
  .stats-popup .result-msg {
    font-size: 1rem;
    margin-bottom: 1rem;
    color: #ccc;
  }
  .stats-popup .result-msg .answer {
    color: #7b2ff7;
    font-weight: 700;
    text-transform: uppercase;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 1.2rem;
    margin-bottom: 1.5rem;
  }
  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stat-val {
    font-size: 1.8rem;
    font-weight: 700;
    color: #00d4ff;
  }
  .stat-label {
    font-size: 0.7rem;
    color: #999;
    text-transform: uppercase;
  }
  .distribution {
    text-align: left;
    margin-bottom: 1.5rem;
  }
  .distribution h3 {
    font-size: 0.85rem;
    text-transform: uppercase;
    color: #999;
    margin-bottom: 0.6rem;
  }
  .dist-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 0.85rem;
  }
  .dist-num { width: 14px; text-align: right; color: #999; }
  .dist-bar {
    height: 20px;
    min-width: 24px;
    background: #3a3a5a;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 6px;
    font-weight: 700;
    font-size: 0.8rem;
    color: #e0e0e0;
    transition: width 0.5s ease;
  }
  .dist-bar.highlight { background: #1b5e20; }

  .btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 2rem;
    font-size: 1rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn:hover { background: #6a1fe0; }

  .close-btn {
    position: absolute;
    top: 10px;
    right: 14px;
    background: none;
    border: none;
    color: #999;
    font-size: 1.4rem;
    cursor: pointer;
  }
  .close-btn:hover { color: #e0e0e0; }

  @media (max-width: 420px) {
    .tile { font-size: 1.3rem !important; }
    .key { height: 46px; min-width: 28px; font-size: 0.82rem; }
    .key.wide { min-width: 48px; }
    .stats-popup { padding: 1.5rem; }
    .mode-btn { padding: 0.3rem 0.8rem; font-size: 0.8rem; }
  }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>

  const WORD_LISTS = { 4: WORDS_4, 5: WORDS_5, 6: WORDS_6 };
  const TILE_SIZES = { 4: 62, 5: 58, 6: 52 };
  const FONT_SIZES = { 4: '2rem', 5: '1.8rem', 6: '1.55rem' };
  const MAX_GUESSES = 6;

  let wordLength = 5;
  let WORDS = WORDS_5;
  let VALID_WORDS = new Set(WORDS);
  let answer = "";
  let currentRow = 0;
  let currentCol = 0;
  let currentGuess = "";
  let gameOver = false;
  let revealInProgress = false;

  // ── DOM refs ──
  const boardEl = document.getElementById("board");
  const kbEl = document.getElementById("keyboard");
  const msgEl = document.getElementById("message");
  const overlayEl = document.getElementById("overlay");

  // ── Mode Selection ──
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const len = parseInt(btn.dataset.len);
      if (len === wordLength && !gameOver) return;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      wordLength = len;
      WORDS = WORD_LISTS[wordLength];
      VALID_WORDS = new Set(WORDS);
      startGame();
    });
  });

  // ── Initialize Board ──
  function buildBoard() {
    boardEl.innerHTML = "";
    const tileSize = TILE_SIZES[wordLength];
    const fontSize = FONT_SIZES[wordLength];
    for (let r = 0; r < MAX_GUESSES; r++) {
      const row = document.createElement("div");
      row.className = "row";
      row.id = "row-" + r;
      row.style.gridTemplateColumns = "repeat(" + wordLength + ", 1fr)";
      for (let c = 0; c < wordLength; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = "tile-" + r + "-" + c;
        tile.style.width = tileSize + "px";
        tile.style.height = tileSize + "px";
        tile.style.fontSize = fontSize;
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }
  }

  // ── Initialize Keyboard ──
  const KB_ROWS = [
    ["q","w","e","r","t","y","u","i","o","p"],
    ["a","s","d","f","g","h","j","k","l"],
    ["Enter","z","x","c","v","b","n","m","Backspace"]
  ];
  const keyState = {};

  function buildKeyboard() {
    kbEl.innerHTML = "";
    KB_ROWS.forEach(row => {
      const rowEl = document.createElement("div");
      rowEl.className = "kb-row";
      row.forEach(k => {
        const btn = document.createElement("button");
        btn.className = "key";
        btn.setAttribute("data-key", k);
        if (k === "Enter" || k === "Backspace") {
          btn.classList.add("wide");
          btn.textContent = k === "Backspace" ? "Del" : "Enter";
        } else {
          btn.textContent = k;
        }
        btn.addEventListener("click", () => handleKey(k));
        rowEl.appendChild(btn);
      });
      kbEl.appendChild(rowEl);
    });
  }

  function updateKeyboard(letter, state) {
    const priority = { absent: 0, present: 1, correct: 2 };
    const cur = keyState[letter];
    if (!cur || priority[state] > priority[cur]) {
      keyState[letter] = state;
      const btn = kbEl.querySelector('[data-key="' + letter + '"]');
      if (btn) {
        btn.classList.remove("absent","present","correct");
        btn.classList.add(state);
      }
    }
  }

  // ── Message ──
  let msgTimer = null;
  function showMessage(text, persist) {
    clearTimeout(msgTimer);
    msgEl.textContent = text;
    msgEl.classList.add("show");
    if (!persist) {
      msgTimer = setTimeout(() => msgEl.classList.remove("show"), 1800);
    }
  }

  // ── Tile helpers ──
  function getTile(r, c) {
    return document.getElementById("tile-" + r + "-" + c);
  }

  // ── Handle Key Input ──
  function handleKey(key) {
    if (gameOver || revealInProgress) return;

    if (key === "Backspace") {
      if (currentCol > 0) {
        currentCol--;
        currentGuess = currentGuess.slice(0, -1);
        const tile = getTile(currentRow, currentCol);
        tile.textContent = "";
        tile.classList.remove("filled");
        window.SFX?.click();
      }
      return;
    }

    if (key === "Enter") {
      if (currentGuess.length < wordLength) {
        shakeRow(currentRow);
        showMessage("Not enough letters");
        window.SFX?.wrong();
        return;
      }
      if (!VALID_WORDS.has(currentGuess)) {
        shakeRow(currentRow);
        showMessage("Not in word list");
        window.SFX?.wrong();
        return;
      }
      submitGuess();
      return;
    }

    if (/^[a-z]$/.test(key) && currentCol < wordLength) {
      const tile = getTile(currentRow, currentCol);
      tile.textContent = key;
      tile.classList.add("filled");
      currentGuess += key;
      currentCol++;
      window.SFX?.type();
    }
  }

  function shakeRow(r) {
    const row = document.getElementById("row-" + r);
    row.classList.add("shake");
    setTimeout(() => row.classList.remove("shake"), 500);
  }

  // ── Evaluate Guess ──
  function evaluateGuess(guess) {
    const result = Array(wordLength).fill("absent");
    const ansArr = answer.split("");
    const guessArr = guess.split("");
    const used = Array(wordLength).fill(false);

    for (let i = 0; i < wordLength; i++) {
      if (guessArr[i] === ansArr[i]) {
        result[i] = "correct";
        used[i] = true;
      }
    }
    for (let i = 0; i < wordLength; i++) {
      if (result[i] === "correct") continue;
      for (let j = 0; j < wordLength; j++) {
        if (!used[j] && guessArr[i] === ansArr[j]) {
          result[i] = "present";
          used[j] = true;
          break;
        }
      }
    }
    return result;
  }

  // ── Submit Guess with Animation ──
  function submitGuess() {
    const guess = currentGuess;
    const result = evaluateGuess(guess);
    revealInProgress = true;

    revealTiles(currentRow, guess, result, () => {
      for (let i = 0; i < wordLength; i++) {
        updateKeyboard(guess[i], result[i]);
      }

      const won = result.every(r => r === "correct");
      if (won) {
        gameOver = true;
        window.SFX?.win();
        if (window.HallOfFame) { var sk = window.HallOfFame.winStreak('wordle'); window.HallOfFame.submit('wordle', sk.current); }
        bounceRow(currentRow);
        const messages = ["Genius!", "Magnificent!", "Impressive!", "Splendid!", "Great!", "Phew!"];
        setTimeout(() => {
          showMessage(messages[currentRow] || "Nice!", true);
          saveResult(true, currentRow + 1);
          setTimeout(() => showStats(true, currentRow + 1), 1200);
        }, 300);
      } else if (currentRow === MAX_GUESSES - 1) {
        gameOver = true;
        window.SFX?.fail();
        if (window.HallOfFame) window.HallOfFame.loseStreak('wordle');
        setTimeout(() => {
          showMessage(answer.toUpperCase(), true);
          saveResult(false, null);
          setTimeout(() => showStats(false, null), 1200);
        }, 300);
      }

      currentRow++;
      currentCol = 0;
      currentGuess = "";
      revealInProgress = false;
    });
  }

  function revealTiles(row, guess, result, cb) {
    let i = 0;
    function next() {
      if (i >= wordLength) {
        if (cb) cb();
        return;
      }
      const tile = getTile(row, i);
      const state = result[i];
      const letter = guess[i];

      tile.classList.add("reveal");
      window.SFX?.reveal();
      setTimeout(() => {
        tile.classList.remove("reveal");
        tile.classList.add(state);
        tile.textContent = letter;
        tile.classList.add("reveal-out");
        setTimeout(() => {
          tile.classList.remove("reveal-out");
          i++;
          next();
        }, 250);
      }, 250);
    }
    next();
  }

  function bounceRow(row) {
    for (let c = 0; c < wordLength; c++) {
      const tile = getTile(row, c);
      setTimeout(() => tile.classList.add("bounce"), c * 80);
    }
  }

  // ── Physical Keyboard ──
  document.addEventListener("keydown", e => {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    if (e.key === "Enter") { handleKey("Enter"); e.preventDefault(); }
    else if (e.key === "Backspace") { handleKey("Backspace"); e.preventDefault(); }
    else if (/^[a-zA-Z]$/.test(e.key)) { handleKey(e.key.toLowerCase()); }
  });

  // ── Statistics (localStorage) ──
  function getStorageKey() {
    return "wordle_stats_" + wordLength;
  }

  function loadStats() {
    try {
      const d = JSON.parse(localStorage.getItem(getStorageKey()));
      if (d && typeof d.played === "number") return d;
    } catch(e) {}
    return { played: 0, won: 0, streak: 0, maxStreak: 0, dist: [0,0,0,0,0,0] };
  }

  function saveStats(s) {
    localStorage.setItem(getStorageKey(), JSON.stringify(s));
  }

  function saveResult(won, guessNum) {
    const s = loadStats();
    s.played++;
    if (won) {
      s.won++;
      s.streak++;
      if (s.streak > s.maxStreak) s.maxStreak = s.streak;
      s.dist[guessNum - 1]++;
    } else {
      s.streak = 0;
    }
    saveStats(s);
  }

  // ── Stats Popup ──
  function showStats(won, guessNum) {
    const s = loadStats();
    const title = document.getElementById("popupTitle");
    const resultMsg = document.getElementById("resultMsg");
    const statsRow = document.getElementById("statsRow");
    const distBars = document.getElementById("distBars");

    title.textContent = "Statistics (" + wordLength + " Letters)";
    if (won === true) {
      resultMsg.innerHTML = "You got it!";
    } else if (won === false) {
      resultMsg.innerHTML = 'The word was <span class="answer">' + answer + '</span>';
    } else {
      resultMsg.innerHTML = "";
    }

    const winPct = s.played > 0 ? Math.round(100 * s.won / s.played) : 0;
    statsRow.innerHTML = [
      { val: s.played, label: "Played" },
      { val: winPct, label: "Win %" },
      { val: s.streak, label: "Streak" },
      { val: s.maxStreak, label: "Max Streak" }
    ].map(x => '<div class="stat-item"><span class="stat-val">' + x.val + '</span><span class="stat-label">' + x.label + '</span></div>').join("");

    const maxDist = Math.max(...s.dist, 1);
    distBars.innerHTML = s.dist.map((count, i) => {
      const pct = Math.max(count / maxDist * 100, 8);
      const hl = (won && guessNum === i + 1) ? " highlight" : "";
      return '<div class="dist-row">' +
        '<span class="dist-num">' + (i + 1) + '</span>' +
        '<div class="dist-bar' + hl + '" style="width:' + pct + '%">' + count + '</div>' +
      '</div>';
    }).join("");

    overlayEl.classList.add("show");
  }

  document.getElementById("closeStats").addEventListener("click", () => {
    overlayEl.classList.remove("show");
  });
  overlayEl.addEventListener("click", e => {
    if (e.target === overlayEl) overlayEl.classList.remove("show");
  });

  // ── New Game ──
  document.getElementById("newGameBtn").addEventListener("click", () => {
    overlayEl.classList.remove("show");
    startGame();
  });

  function startGame() {
    answer = WORDS[Math.floor(Math.random() * WORDS.length)];
    currentRow = 0;
    currentCol = 0;
    currentGuess = "";
    gameOver = false;
    revealInProgress = false;
    Object.keys(keyState).forEach(k => delete keyState[k]);
    msgEl.classList.remove("show");
    buildBoard();
    buildKeyboard();
  }

  // ── Init ──
  startGame();
})();
