<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Jump - Arcade</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f1a;
  color: #fff;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
  touch-action: none;
  user-select: none;
}
a.back {
  position: fixed; top: 14px; left: 16px;
  color: #00d4ff; text-decoration: none; font-size: 1.1rem;
  z-index: 100; font-weight: 600;
  text-shadow: 0 0 8px rgba(0,212,255,0.4);
  transition: color 0.2s;
}
a.back:hover { color: #7b2ff7; }
#gameCanvas {
  display: block;
  margin: 0 auto;
  background: #0f0f1a;
  touch-action: none;
}
#ui-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 50;
}
#start-screen, #gameover-screen {
  background: rgba(26,26,46,0.95);
  border: 2px solid #7b2ff7;
  border-radius: 18px;
  padding: 40px 36px;
  text-align: center;
  pointer-events: auto;
  max-width: 360px;
  width: 90%;
  box-shadow: 0 0 40px rgba(123,47,247,0.3);
}
#gameover-screen { display: none; }
#start-screen h1, #gameover-screen h1 {
  font-size: 2rem;
  margin-bottom: 10px;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
#start-screen p, #gameover-screen p {
  color: #aaa; margin: 8px 0; font-size: 0.95rem; line-height: 1.5;
}
.btn {
  display: inline-block;
  margin-top: 18px; padding: 12px 36px;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  color: #fff; border: none; border-radius: 10px;
  font-size: 1.1rem; font-weight: 700; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  text-transform: uppercase; letter-spacing: 1px;
}
.btn:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0,212,255,0.4); }
#score-display {
  position: fixed; top: 14px; right: 16px;
  font-size: 1.4rem; font-weight: 700; z-index: 100;
  background: linear-gradient(135deg, #00d4ff, #7b2ff7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
}
#final-score { font-size: 2.4rem; font-weight: 800; color: #00d4ff; }
#final-best { color: #7b2ff7; font-size: 1.1rem; margin-top: 4px; }
.controls-hint {
  font-size: 0.8rem; color: #666; margin-top: 14px;
}
#powerup-indicator {
  position: fixed; top: 50px; right: 16px;
  font-size: 0.9rem; font-weight: 600; z-index: 100;
  color: #ffaa00;
  display: none;
}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<div id="score-display">0</div>
<div id="powerup-indicator"></div>
<canvas id="gameCanvas"></canvas>

<div id="ui-overlay">
  <div id="start-screen">
    <h1>Flappy Jump</h1>
    <p>Bounce higher and higher!<br>Avoid enemies and collect power-ups.</p>
    <p style="font-size:0.85rem; color:#888;">
      <strong style="color:#4f4;">Green</strong> = Normal &nbsp;
      <strong style="color:#4af;">Blue</strong> = Moving<br>
      <strong style="color:#b86;">Brown</strong> = Breakable &nbsp;
      <strong style="color:#f44;">Red</strong> = Spring
    </p>
    <button class="btn" id="startBtn">Play</button>
    <div class="controls-hint">Arrow keys / A,D to move &bull; Space / Tap to flap</div>
  </div>
  <div id="gameover-screen">
    <h1>Game Over</h1>
    <div id="final-score">0</div>
    <div id="final-best"></div>
    <button class="btn" id="restartBtn">Play Again</button>
    <div class="controls-hint">Press Space or Tap to restart</div>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('score-display');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const finalScoreEl = document.getElementById('final-score');
  const finalBestEl = document.getElementById('final-best');
  const powerupIndicator = document.getElementById('powerup-indicator');

  // --- Canvas sizing ---
  const MAX_W = 420;
  let W, H;
  function resize() {
    W = Math.min(window.innerWidth, MAX_W);
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Stars ---
  const stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * MAX_W,
      y: Math.random() * 2000,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random() * 0.6 + 0.2,
      speed: Math.random() * 0.3 + 0.1
    });
  }

  // --- Game state ---
  let state = 'menu'; // menu, playing, over
  let score = 0;
  let maxHeight = 0;
  let bestScore = parseInt(localStorage.getItem('flappyjump_best') || '0');
  let cameraY = 0;
  let frameCount = 0;

  // Player
  const player = {
    x: 0, y: 0, vx: 0, vy: 0,
    w: 28, h: 28,
    onPlatform: false,
    facingRight: true,
    jetpackTimer: 0,
    springTimer: 0,
    alive: true
  };

  // Platforms
  let platforms = [];
  const PLAT_W = 64;
  const PLAT_H = 14;
  const PLAT_GAP_MIN = 50;
  const PLAT_GAP_MAX = 90;

  // Enemies
  let enemies = [];

  // Power-ups
  let powerups = [];

  // Particles
  let particles = [];

  // --- Platform types ---
  const PLAT_NORMAL = 0;
  const PLAT_MOVING = 1;
  const PLAT_BREAKABLE = 2;
  const PLAT_SPRING = 3;

  function createPlatform(x, y, type) {
    return {
      x, y, type,
      w: PLAT_W, h: PLAT_H,
      broken: false,
      moveDir: Math.random() < 0.5 ? 1 : -1,
      moveSpeed: 1 + Math.random() * 1.5,
      springAnim: 0
    };
  }

  function initGame() {
    score = 0;
    maxHeight = 0;
    cameraY = 0;
    frameCount = 0;
    platforms = [];
    enemies = [];
    powerups = [];
    particles = [];

    player.x = W / 2 - player.w / 2;
    player.y = H - 120;
    player.vx = 0;
    player.vy = 0;
    player.jetpackTimer = 0;
    player.springTimer = 0;
    player.alive = true;
    player.facingRight = true;

    // Base platform
    platforms.push(createPlatform(W / 2 - PLAT_W / 2, H - 80, PLAT_NORMAL));

    // Generate initial platforms
    let py = H - 80;
    for (let i = 0; i < 30; i++) {
      py -= PLAT_GAP_MIN + Math.random() * (PLAT_GAP_MAX - PLAT_GAP_MIN);
      let px = Math.random() * (W - PLAT_W);
      let type = pickPlatformType(0);
      platforms.push(createPlatform(px, py, type));
    }

    scoreDisplay.textContent = '0';
    powerupIndicator.style.display = 'none';
  }

  function pickPlatformType(height) {
    let r = Math.random();
    let movingChance = Math.min(0.25, 0.05 + height / 20000);
    let breakChance = Math.min(0.2, 0.03 + height / 25000);
    let springChance = 0.08;
    if (r < springChance) return PLAT_SPRING;
    if (r < springChance + movingChance) return PLAT_MOVING;
    if (r < springChance + movingChance + breakChance) return PLAT_BREAKABLE;
    return PLAT_NORMAL;
  }

  // --- Input ---
  const keys = {};
  let touchX = null;
  let touchStartX = null;

  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'menu') startGame();
      else if (state === 'over') startGame();
      else if (state === 'playing') flap();
    }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchX = t.clientX;
    if (state === 'playing') flap();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touchX = e.touches[0].clientX;
  }, { passive: false });
  canvas.addEventListener('touchend', e => {
    touchX = null;
    touchStartX = null;
  });
  canvas.addEventListener('mousedown', e => {
    if (state === 'playing') flap();
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  function flap() {
    if (!player.alive) return;
    player.vy = Math.min(player.vy, -3.5);
    // particles
    for (let i = 0; i < 4; i++) {
      particles.push({
        x: player.x + player.w / 2,
        y: player.y + player.h,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 2 + 1,
        life: 20 + Math.random() * 10,
        color: '#00d4ff',
        r: 2 + Math.random() * 2
      });
    }
  }

  function startGame() {
    startScreen.style.display = 'none';
    gameoverScreen.style.display = 'none';
    state = 'playing';
    initGame();
  }

  function gameOver() {
    state = 'over';
    player.alive = false;
    score = Math.floor(maxHeight / 10);

    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('flappyjump_best', bestScore);
    }

    finalScoreEl.textContent = score;
    finalBestEl.textContent = 'Best: ' + bestScore;
    gameoverScreen.style.display = 'block';

    if (window.HallOfFame) window.HallOfFame.submit('flappyjump', score);

    // Coins
    if (window.ArcadeCoins && score > 0) {
      let earned = Math.floor(score / 50);
      if (earned > 0) window.ArcadeCoins.earn(earned);
    }
  }

  // --- Update ---
  function update() {
    if (state !== 'playing') return;
    frameCount++;

    // Input
    let moveForce = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) moveForce = -1;
    if (keys['ArrowRight'] || keys['KeyD']) moveForce = 1;

    // Touch tilt
    if (touchX !== null && touchStartX !== null) {
      let dx = touchX - touchStartX;
      if (Math.abs(dx) > 10) {
        moveForce = dx > 0 ? 1 : -1;
      }
    }

    const ACCEL = 0.6;
    const FRICTION = 0.85;
    const MAX_VX = 6;

    player.vx += moveForce * ACCEL;
    player.vx *= FRICTION;
    if (Math.abs(player.vx) > MAX_VX) player.vx = MAX_VX * Math.sign(player.vx);
    if (Math.abs(player.vx) < 0.1) player.vx = 0;
    if (moveForce > 0) player.facingRight = true;
    if (moveForce < 0) player.facingRight = false;

    // Gravity
    const GRAVITY = 0.35;
    const BOUNCE_VY = -10;
    const SPRING_VY = -15;

    if (player.jetpackTimer > 0) {
      player.jetpackTimer--;
      player.vy = -7;
      // Jetpack particles
      if (frameCount % 2 === 0) {
        particles.push({
          x: player.x + player.w / 2 + (Math.random() - 0.5) * 10,
          y: player.y + player.h,
          vx: (Math.random() - 0.5) * 2,
          vy: Math.random() * 4 + 2,
          life: 15 + Math.random() * 10,
          color: Math.random() < 0.5 ? '#ff6600' : '#ffcc00',
          r: 2 + Math.random() * 3
        });
      }
      powerupIndicator.textContent = 'JETPACK ' + Math.ceil(player.jetpackTimer / 60) + 's';
      powerupIndicator.style.display = 'block';
      powerupIndicator.style.color = '#ff6600';
    } else {
      player.vy += GRAVITY;
    }

    if (player.springTimer > 0) {
      player.springTimer--;
      if (player.jetpackTimer <= 0) {
        powerupIndicator.textContent = 'SPRING SHOES ' + Math.ceil(player.springTimer / 60) + 's';
        powerupIndicator.style.display = 'block';
        powerupIndicator.style.color = '#44ff44';
      }
    }

    if (player.jetpackTimer <= 0 && player.springTimer <= 0) {
      powerupIndicator.style.display = 'none';
    }

    player.x += player.vx;
    player.y += player.vy;

    // Screen wrap
    if (player.x + player.w < 0) player.x = W;
    if (player.x > W) player.x = -player.w;

    // Platform collision (only when falling)
    if (player.vy >= 0) {
      for (let p of platforms) {
        if (p.broken) continue;
        let px = player.x + 4;
        let pw = player.w - 8;
        let py = player.y + player.h;
        let pvy = player.vy;

        if (px + pw > p.x && px < p.x + p.w &&
            py >= p.y && py - pvy <= p.y + 6) {
          // Land
          if (p.type === PLAT_BREAKABLE) {
            p.broken = true;
            // Break particles
            for (let i = 0; i < 6; i++) {
              particles.push({
                x: p.x + Math.random() * p.w,
                y: p.y,
                vx: (Math.random() - 0.5) * 4,
                vy: Math.random() * -3 - 1,
                life: 25,
                color: '#b8860b',
                r: 3
              });
            }
          } else {
            player.y = p.y - player.h;
            let bounceV = BOUNCE_VY;
            if (p.type === PLAT_SPRING) {
              bounceV = SPRING_VY;
              p.springAnim = 10;
            }
            if (player.springTimer > 0) bounceV *= 1.3;
            player.vy = bounceV;

            // Bounce particles
            for (let i = 0; i < 3; i++) {
              particles.push({
                x: player.x + player.w / 2,
                y: player.y + player.h,
                vx: (Math.random() - 0.5) * 3,
                vy: Math.random() * 2,
                life: 15,
                color: p.type === PLAT_SPRING ? '#ff4444' : '#4f4',
                r: 2
              });
            }
          }
          break;
        }
      }
    }

    // Camera
    let targetCam = player.y - H * 0.4;
    if (targetCam < cameraY) {
      cameraY += (targetCam - cameraY) * 0.1;
    }

    // Score
    let h = -(player.y - (H - 120));
    if (h > maxHeight) maxHeight = h;
    score = Math.floor(maxHeight / 10);
    scoreDisplay.textContent = score;

    // Update moving platforms
    for (let p of platforms) {
      if (p.type === PLAT_MOVING && !p.broken) {
        p.x += p.moveDir * p.moveSpeed;
        if (p.x <= 0 || p.x + p.w >= W) p.moveDir *= -1;
        p.x = Math.max(0, Math.min(W - p.w, p.x));
      }
      if (p.springAnim > 0) p.springAnim--;
    }

    // Generate platforms above
    let topP = platforms.reduce((m, p) => p.y < m ? p.y : m, Infinity);
    while (topP > cameraY - 200) {
      let gap = PLAT_GAP_MIN + Math.random() * (PLAT_GAP_MAX - PLAT_GAP_MIN);
      // Increase gap at higher scores
      if (score > 200) gap += Math.min(30, (score - 200) / 20);
      topP -= gap;
      let px = Math.random() * (W - PLAT_W);
      let type = pickPlatformType(maxHeight);
      platforms.push(createPlatform(px, topP, type));

      // Spawn enemy
      if (score > 100 && Math.random() < Math.min(0.15, 0.03 + score / 5000)) {
        enemies.push({
          x: Math.random() * (W - 30),
          y: topP - 40 - Math.random() * 30,
          w: 30, h: 24,
          type: Math.random() < 0.5 ? 'spike' : 'bird',
          vx: Math.random() < 0.5 ? 1.5 : -1.5,
          frame: 0
        });
      }

      // Spawn power-up
      if (Math.random() < 0.03) {
        powerups.push({
          x: Math.random() * (W - 20),
          y: topP - 30,
          w: 22, h: 22,
          type: Math.random() < 0.5 ? 'jetpack' : 'spring',
          collected: false
        });
      }
    }

    // Remove off-screen platforms
    platforms = platforms.filter(p => p.y < cameraY + H + 50);

    // Update enemies
    for (let e of enemies) {
      if (e.type === 'bird') {
        e.x += e.vx;
        if (e.x <= 0 || e.x + e.w >= W) e.vx *= -1;
      }
      e.frame++;
    }
    enemies = enemies.filter(e => e.y > cameraY - 50 && e.y < cameraY + H + 50);

    // Enemy collision
    for (let e of enemies) {
      let ex = e.x, ey = e.y, ew = e.w, eh = e.h;
      if (player.x + player.w > ex + 4 && player.x < ex + ew - 4 &&
          player.y + player.h > ey + 4 && player.y < ey + eh - 4) {
        // If falling on top of bird, bounce off it
        if (e.type === 'bird' && player.vy > 0 && player.y + player.h < ey + eh / 2) {
          player.vy = -12;
          enemies = enemies.filter(en => en !== e);
          for (let i = 0; i < 5; i++) {
            particles.push({
              x: e.x + e.w / 2, y: e.y + e.h / 2,
              vx: (Math.random() - 0.5) * 5,
              vy: (Math.random() - 0.5) * 5,
              life: 20, color: '#ff4444', r: 3
            });
          }
        } else if (player.jetpackTimer <= 0) {
          gameOver();
          return;
        }
      }
    }

    // Power-up collision
    for (let pu of powerups) {
      if (pu.collected) continue;
      if (player.x + player.w > pu.x && player.x < pu.x + pu.w &&
          player.y + player.h > pu.y && player.y < pu.y + pu.h) {
        pu.collected = true;
        if (pu.type === 'jetpack') {
          player.jetpackTimer = 180; // 3 seconds
        } else {
          player.springTimer = 300; // 5 seconds
        }
        for (let i = 0; i < 8; i++) {
          particles.push({
            x: pu.x + pu.w / 2, y: pu.y + pu.h / 2,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 25,
            color: pu.type === 'jetpack' ? '#ff6600' : '#44ff44',
            r: 3
          });
        }
      }
    }
    powerups = powerups.filter(pu => !pu.collected && pu.y > cameraY - 50 && pu.y < cameraY + H + 50);

    // Update particles
    for (let p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
    }
    particles = particles.filter(p => p.life > 0);

    // Fall off screen
    if (player.y > cameraY + H + 50) {
      gameOver();
    }
  }

  // --- Draw ---
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background gradient
    let grd = ctx.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#0a0a15');
    grd.addColorStop(1, '#0f0f1a');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // Parallax stars
    ctx.save();
    for (let s of stars) {
      let sy = ((s.y - cameraY * s.speed * 0.3) % H + H) % H;
      let sx = s.x % W;
      ctx.globalAlpha = s.a + Math.sin(frameCount * 0.02 + s.x) * 0.15;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // Camera offset
    let offsetY = -cameraY;

    // Draw platforms
    for (let p of platforms) {
      if (p.broken) continue;
      let py = p.y + offsetY;
      if (py < -20 || py > H + 20) continue;

      ctx.save();
      let colors;
      switch (p.type) {
        case PLAT_NORMAL: colors = ['#22cc55', '#1a9944']; break;
        case PLAT_MOVING: colors = ['#4499ff', '#3377cc']; break;
        case PLAT_BREAKABLE: colors = ['#b8860b', '#8b6508']; break;
        case PLAT_SPRING: colors = ['#ff4444', '#cc2222']; break;
      }

      let drawY = py;
      let drawH = p.h;
      if (p.type === PLAT_SPRING && p.springAnim > 0) {
        drawH = p.h + p.springAnim;
        drawY = py - p.springAnim;
      }

      // Platform shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      roundRect(ctx, p.x + 2, drawY + 3, p.w, drawH, 6);
      ctx.fill();

      // Platform body
      let pgrd = ctx.createLinearGradient(p.x, drawY, p.x, drawY + drawH);
      pgrd.addColorStop(0, colors[0]);
      pgrd.addColorStop(1, colors[1]);
      ctx.fillStyle = pgrd;
      roundRect(ctx, p.x, drawY, p.w, drawH, 6);
      ctx.fill();

      // Top highlight
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      roundRect(ctx, p.x + 3, drawY + 1, p.w - 6, 4, 2);
      ctx.fill();

      // Spring coil indicator
      if (p.type === PLAT_SPRING) {
        ctx.strokeStyle = '#ffaa00';
        ctx.lineWidth = 2;
        let cx = p.x + p.w / 2;
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          let yy = drawY - 4 - i * 5;
          ctx.moveTo(cx - 6, yy);
          ctx.lineTo(cx + 6, yy - 3);
          ctx.moveTo(cx + 6, yy - 3);
          ctx.lineTo(cx - 6, yy - 5);
        }
        ctx.stroke();
      }

      // Breakable crack lines
      if (p.type === PLAT_BREAKABLE) {
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p.x + p.w * 0.3, drawY + 2);
        ctx.lineTo(p.x + p.w * 0.4, drawY + drawH - 2);
        ctx.moveTo(p.x + p.w * 0.6, drawY + 3);
        ctx.lineTo(p.x + p.w * 0.7, drawY + drawH - 1);
        ctx.stroke();
      }

      ctx.restore();
    }

    // Draw power-ups
    for (let pu of powerups) {
      if (pu.collected) continue;
      let py = pu.y + offsetY;
      if (py < -30 || py > H + 30) continue;

      ctx.save();
      let bob = Math.sin(frameCount * 0.08 + pu.x) * 3;
      let dx = pu.x, dy = py + bob;

      // Glow
      ctx.shadowColor = pu.type === 'jetpack' ? '#ff6600' : '#44ff44';
      ctx.shadowBlur = 12;

      if (pu.type === 'jetpack') {
        // Jetpack icon
        ctx.fillStyle = '#ff6600';
        roundRect(ctx, dx + 3, dy + 2, 16, 18, 3);
        ctx.fill();
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(dx + 6, dy + 14, 4, 6);
        ctx.fillRect(dx + 12, dy + 14, 4, 6);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px sans-serif';
        ctx.fillText('J', dx + 7, dy + 14);
      } else {
        // Spring shoes icon
        ctx.fillStyle = '#44ff44';
        roundRect(ctx, dx + 2, dy + 10, 18, 10, 3);
        ctx.fill();
        ctx.strokeStyle = '#22aa22';
        ctx.lineWidth = 2;
        ctx.beginPath();
        let sx = dx + 11;
        for (let i = 0; i < 3; i++) {
          ctx.moveTo(sx - 5, dy + 8 - i * 4);
          ctx.lineTo(sx + 5, dy + 6 - i * 4);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // Draw enemies
    for (let e of enemies) {
      let ey = e.y + offsetY;
      if (ey < -40 || ey > H + 40) continue;

      ctx.save();
      if (e.type === 'spike') {
        // Spike triangle
        ctx.fillStyle = '#ff3366';
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2, ey);
        ctx.lineTo(e.x, ey + e.h);
        ctx.lineTo(e.x + e.w, ey + e.h);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#cc1144';
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2, ey + 6);
        ctx.lineTo(e.x + 5, ey + e.h);
        ctx.lineTo(e.x + e.w - 5, ey + e.h);
        ctx.closePath();
        ctx.fill();
      } else {
        // Bird
        let wingY = Math.sin(e.frame * 0.15) * 5;
        ctx.fillStyle = '#aa33ff';
        // Body
        ctx.beginPath();
        ctx.ellipse(e.x + e.w / 2, ey + e.h / 2, 12, 8, 0, 0, Math.PI * 2);
        ctx.fill();
        // Wings
        ctx.fillStyle = '#8822cc';
        ctx.beginPath();
        ctx.moveTo(e.x + 5, ey + e.h / 2);
        ctx.lineTo(e.x - 4, ey + e.h / 2 + wingY - 6);
        ctx.lineTo(e.x + 10, ey + e.h / 2 + 2);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(e.x + e.w - 5, ey + e.h / 2);
        ctx.lineTo(e.x + e.w + 4, ey + e.h / 2 + wingY - 6);
        ctx.lineTo(e.x + e.w - 10, ey + e.h / 2 + 2);
        ctx.fill();
        // Eye
        ctx.fillStyle = '#fff';
        let eyeX = e.vx > 0 ? e.x + e.w / 2 + 5 : e.x + e.w / 2 - 5;
        ctx.beginPath();
        ctx.arc(eyeX, ey + e.h / 2 - 2, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(eyeX + (e.vx > 0 ? 1 : -1), ey + e.h / 2 - 2, 1.5, 0, Math.PI * 2);
        ctx.fill();
        // Beak
        ctx.fillStyle = '#ffaa00';
        let beakDir = e.vx > 0 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(e.x + e.w / 2 + 10 * beakDir, ey + e.h / 2);
        ctx.lineTo(e.x + e.w / 2 + 16 * beakDir, ey + e.h / 2 + 2);
        ctx.lineTo(e.x + e.w / 2 + 10 * beakDir, ey + e.h / 2 + 4);
        ctx.fill();
      }
      ctx.restore();
    }

    // Draw player
    if (player.alive || state === 'over') {
      let px = player.x;
      let py = player.y + offsetY;

      ctx.save();

      // Jetpack visual
      if (player.jetpackTimer > 0) {
        ctx.fillStyle = '#885500';
        ctx.fillRect(px - 4, py + 6, 6, 14);
        ctx.fillRect(px + player.w - 2, py + 6, 6, 14);
      }

      // Body glow
      ctx.shadowColor = player.jetpackTimer > 0 ? '#ff6600' :
                         player.springTimer > 0 ? '#44ff44' : '#00d4ff';
      ctx.shadowBlur = 15;

      // Body
      let bodyGrd = ctx.createRadialGradient(
        px + player.w / 2, py + player.h / 2, 2,
        px + player.w / 2, py + player.h / 2, player.w / 2
      );
      bodyGrd.addColorStop(0, '#44eeff');
      bodyGrd.addColorStop(1, '#0088cc');
      ctx.fillStyle = bodyGrd;
      ctx.beginPath();
      ctx.arc(px + player.w / 2, py + player.h / 2, player.w / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.shadowBlur = 0;

      // Eyes
      let ex1 = player.facingRight ? px + player.w * 0.35 : px + player.w * 0.3;
      let ex2 = player.facingRight ? px + player.w * 0.65 : px + player.w * 0.6;
      let eyeY = py + player.h * 0.4;

      // White
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(ex1, eyeY, 5, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(ex2, eyeY, 5, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Pupils
      let lookX = player.facingRight ? 1.5 : -1.5;
      let lookY = player.vy > 2 ? 2 : player.vy < -3 ? -1 : 0;
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(ex1 + lookX, eyeY + lookY, 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex2 + lookX, eyeY + lookY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Mouth
      if (player.vy < -5 || player.jetpackTimer > 0) {
        // Excited
        ctx.fillStyle = '#ff6699';
        ctx.beginPath();
        ctx.arc(px + player.w / 2, py + player.h * 0.65, 4, 0, Math.PI);
        ctx.fill();
      } else {
        // Smile
        ctx.strokeStyle = '#115577';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(px + player.w / 2, py + player.h * 0.58, 5, 0.1, Math.PI - 0.1);
        ctx.stroke();
      }

      // Spring shoes visual
      if (player.springTimer > 0) {
        ctx.fillStyle = '#44ff44';
        ctx.fillRect(px + 3, py + player.h - 2, 8, 4);
        ctx.fillRect(px + player.w - 11, py + player.h - 2, 8, 4);
      }

      ctx.restore();
    }

    // Draw particles
    for (let p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, p.life / 10);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y + offsetY, p.r * (p.life / 25), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Height markers
    if (state === 'playing') {
      let markerInterval = 500;
      let startMarker = Math.floor((-cameraY - H) / (markerInterval * 0.1)) * markerInterval;
      for (let m = startMarker; m < startMarker + markerInterval * 15; m += markerInterval) {
        if (m <= 0) continue;
        let my = (H - 120) - m * 0.1 + offsetY;
        if (my > 0 && my < H) {
          ctx.save();
          ctx.globalAlpha = 0.15;
          ctx.strokeStyle = '#00d4ff';
          ctx.setLineDash([4, 8]);
          ctx.beginPath();
          ctx.moveTo(0, my);
          ctx.lineTo(W, my);
          ctx.stroke();
          ctx.globalAlpha = 0.3;
          ctx.fillStyle = '#00d4ff';
          ctx.font = '10px sans-serif';
          ctx.fillText(Math.floor(m / 10) + 'm', 4, my - 3);
          ctx.restore();
        }
      }
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // --- Game loop ---
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }
  loop();

})();
</script>
