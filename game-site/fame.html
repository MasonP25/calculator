<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall of Fame — Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 0 1rem 3rem;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem 0;
    position: relative;
    max-width: 1100px;
    margin: 0 auto;
  }
  .back-link {
    position: absolute;
    left: 0;
    color: #00d4ff;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .back-link:hover { color: #7b2ff7; }
  .top-bar h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Name input area */
  .name-section {
    max-width: 1100px;
    margin: 0.8rem auto 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
  }
  .name-section label {
    font-size: 0.95rem;
    color: #aaa;
  }
  .name-section input {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 8px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 0.95rem;
    padding: 0.45rem 0.8rem;
    width: 180px;
    outline: none;
    transition: border-color 0.2s;
  }
  .name-section input:focus { border-color: #7b2ff7; }


  /* Search bar */
  .search-bar {
    max-width: 1100px;
    margin: 0 auto 1.5rem;
    display: flex;
    gap: 0.6rem;
    justify-content: center;
    align-items: center;
  }
  .search-input {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 10px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    width: 280px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--t-accent, #7b2ff7); }
  .search-input::placeholder { color: #555; }

  /* Game cards grid */
  .grid {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.2rem;
  }
  .game-card {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 16px;
    padding: 1.2rem;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .game-card:hover {
    border-color: var(--t-accent, #7b2ff7);
    box-shadow: 0 4px 20px color-mix(in srgb, var(--t-accent, #7b2ff7) 25%, transparent);
  }
  .game-card-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.8rem;
  }
  .game-card-header .game-emoji { font-size: 1.6rem; }
  .game-card-header .game-name {
    font-size: 1.1rem;
    font-weight: 700;
  }
  .game-card-header .score-type {
    margin-left: auto;
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: #0f0f1a;
    padding: 0.2rem 0.6rem;
    border-radius: 8px;
  }

  /* Score table */
  .score-table {
    width: 100%;
    border-collapse: collapse;
  }
  .score-table th {
    font-size: 0.65rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: left;
    padding: 0.3rem 0.4rem;
    border-bottom: 1px solid #2a2a4a;
  }
  .score-table th:last-child { text-align: right; }
  .score-table td {
    padding: 0.4rem;
    font-size: 0.85rem;
    border-bottom: 1px solid #1f1f35;
  }
  .score-table td:last-child {
    text-align: right;
    font-size: 0.75rem;
    color: #666;
  }
  .score-table tr.rank-1 td { color: #ffd700; }
  .score-table tr.rank-2 td { color: #c0c0c0; }
  .score-table tr.rank-3 td { color: #cd7f32; }
  .score-table tr.rank-1 .rank-badge,
  .score-table tr.rank-2 .rank-badge,
  .score-table tr.rank-3 .rank-badge {
    font-weight: 700;
  }
  .rank-badge {
    display: inline-block;
    width: 1.4rem;
    text-align: center;
  }
  .score-val {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .name-cell {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .name-cell .mini-avatar {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: inline-flex;
  }
  .name-cell .player-name-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
    transition: text-decoration 0.2s;
  }
  .name-cell .player-name-text:hover {
    text-decoration: underline;
  }
  .empty-msg {
    color: #555;
    font-size: 0.85rem;
    text-align: center;
    padding: 1.2rem 0;
    font-style: italic;
  }

  .loading-msg {
    color: #888;
    font-size: 0.85rem;
    text-align: center;
    padding: 1.2rem 0;
  }

  /* Coin Leaderboard — full-width game-card */
  .coin-lb-card{grid-column:1/-1}
  .coin-lb-tables{display:flex;gap:2rem}
  .coin-lb-tables .score-table{flex:1;min-width:0}
  @media(max-width:600px){.coin-lb-tables{flex-direction:column;gap:0.5rem}}
</style>
</head>

  function fmtScore(n) {
    if (n < 1e3) return Math.floor(n).toLocaleString();
    var tier = Math.floor(Math.log10(Math.abs(n)) / 3);
    if (tier >= NUM_SUFFIXES.length) tier = NUM_SUFFIXES.length - 1;
    if (tier < 1) return Math.floor(n).toString();
    var scale = Math.pow(10, tier * 3);
    return (n / scale).toFixed(2) + NUM_SUFFIXES[tier];
  }

  var searchQuery = '';

  // --- Player name (from auth) ---
  var userDisplay = document.getElementById('currentUserDisplay');
  function updateNameDisplay() {
    var name = window.HallOfFame.getPlayerName();
    userDisplay.textContent = name;
    userDisplay.style.color = (name === 'Guest') ? 'var(--t-dim,#888)' : 'var(--t-accent,#00d4ff)';
  }

  });

  // --- Rank medal ---
  function rankDisplay(i) {
    if (i === 0) return '\uD83E\uDD47';
    if (i === 1) return '\uD83E\uDD48';
    if (i === 2) return '\uD83E\uDD49';
    return '#' + (i + 1);
  }

  // --- Render a score table into a card ---
  function renderScoreTable(card, scores, game) {
    // Remove old table/empty/loading
    var old = card.querySelector('.score-table, .empty-msg, .loading-msg');
    if (old) old.remove();

    var top5 = scores.slice(0, 5);
    if (top5.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty-msg';
      empty.textContent = 'No scores yet';
      card.appendChild(empty);
      return;
    }

    var table = document.createElement('table');
    table.className = 'score-table';
    var thead = document.createElement('thead');
    var headRow = document.createElement('tr');
    ['Rank', 'Name', 'Score', 'Date'].forEach(function(h) {
      var th = document.createElement('th');
      th.textContent = h;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    top5.forEach(function(entry, i) {
      var tr = document.createElement('tr');
      if (i === 0) tr.className = 'rank-1';
      else if (i === 1) tr.className = 'rank-2';
      else if (i === 2) tr.className = 'rank-3';

      var tdRank = document.createElement('td');
      var badge = document.createElement('span');
      badge.className = 'rank-badge';
      badge.textContent = rankDisplay(i);
      tdRank.appendChild(badge);
      tr.appendChild(tdRank);

      var tdName = document.createElement('td');
      var nameCell = document.createElement('div');
      nameCell.className = 'name-cell';
      var miniAvatar = document.createElement('span');
      miniAvatar.className = 'mini-avatar';
      miniAvatar.dataset.username = entry.name;
      var nameText = document.createElement('span');
      nameText.className = 'player-name-text';
      nameText.dataset.username = entry.name;
      nameText.textContent = entry.name;
      if (entry.name && entry.name !== 'Guest') {
        nameText.style.cursor = 'pointer';
        nameText.onclick = function() { window.location.href = 'profile.html?user=' + encodeURIComponent(entry.name); };
        nameText.onmouseover = function() { this.style.textDecoration = 'underline'; };
        nameText.onmouseout = function() { this.style.textDecoration = 'none'; };
      }
      nameCell.appendChild(miniAvatar);
      nameCell.appendChild(nameText);
      tdName.appendChild(nameCell);
      tr.appendChild(tdName);

      var tdScore = document.createElement('td');
      tdScore.className = 'score-val';
      tdScore.textContent = fmtScore(entry.score) + ' ' + game.unit;
      tr.appendChild(tdScore);

      var tdDate = document.createElement('td');
      tdDate.textContent = entry.date || '';
      tr.appendChild(tdDate);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    card.appendChild(table);

    // Render avatars and nametag styles for all players
    if (window.ArcadeAvatar && window.ArcadeCoins && window.ArcadeCoins.getProfile) {
      table.querySelectorAll('.mini-avatar[data-username]').forEach(function(el) {
        var name = el.dataset.username;
        if (!name || name === 'Guest') return;
        window.ArcadeCoins.getProfile(name).then(function(profile) {
          if (!profile) return;
          window.ArcadeAvatar.renderMini(el, profile, 22);
          // Apply nametag style + effects to the name text
          var nameEl = el.parentElement.querySelector('.player-name-text[data-username="' + name + '"]');
          if (nameEl) {
            window.ArcadeAvatar.styleName(nameEl, profile);
            window.ArcadeAvatar.styleNameEffect(nameEl, profile);
          }
        }).catch(function() {});
      });
    }
  }

  // --- Build a game card ---
  function buildCard(game) {
    var card = document.createElement('div');
    card.className = 'game-card';

    // Header
    var header = document.createElement('div');
    header.className = 'game-card-header';
    var emojiSpan = document.createElement('span');
    emojiSpan.className = 'game-emoji';
    emojiSpan.textContent = game.emoji;
    var nameSpan = document.createElement('a');
    nameSpan.className = 'game-name';
    nameSpan.textContent = game.name;
    nameSpan.href = game.id + '.html';
    nameSpan.style.cssText = 'text-decoration:none;color:inherit;cursor:pointer;';
    nameSpan.onmouseover = function() { this.style.color = '#7b2ff7'; this.style.textDecoration = 'underline'; };
    nameSpan.onmouseout = function() { this.style.color = ''; this.style.textDecoration = 'none'; };
    var unitSpan = document.createElement('span');
    unitSpan.className = 'score-type';
    unitSpan.textContent = game.unit;
    header.appendChild(emojiSpan);
    header.appendChild(nameSpan);
    header.appendChild(unitSpan);
    card.appendChild(header);

    var loading = document.createElement('div');
    loading.className = 'loading-msg';
    loading.textContent = 'Loading scores...';
    card.appendChild(loading);

    if (window.FirebaseLB) {
      window.FirebaseLB.getScores(game.id, 5).then(function(scores) {
        renderScoreTable(card, scores, game);
      }).catch(function() {
        loading.textContent = 'Failed to load scores';
      });
    } else {
      loading.textContent = 'Leaderboard unavailable';
    }

    return card;
  }

  // --- Overall stats ---
  // --- Main render ---
  window.render = function() {
    var grid = document.getElementById('grid');
    grid.innerHTML = '';

    // Coin leaderboard — only when not searching
    if (!searchQuery) {
    var coinCard = document.createElement('div');
    coinCard.className = 'game-card coin-lb-card';
    var coinHeader = document.createElement('div');
    coinHeader.className = 'game-card-header';
    var coinEmoji = document.createElement('span');
    coinEmoji.className = 'game-emoji';
    coinEmoji.textContent = '\uD83E\uDE99';
    var coinName = document.createElement('span');
    coinName.className = 'game-name';
    coinName.textContent = 'Top Coins';
    var coinUnit = document.createElement('span');
    coinUnit.className = 'score-type';
    coinUnit.textContent = 'coins';
    coinHeader.appendChild(coinEmoji);
    coinHeader.appendChild(coinName);
    coinHeader.appendChild(coinUnit);
    coinCard.appendChild(coinHeader);

    var coinLoading = document.createElement('div');
    coinLoading.className = 'loading-msg';
    coinLoading.textContent = 'Loading...';
    coinCard.appendChild(coinLoading);
    grid.appendChild(coinCard);

    var COIN_LB_KEY = '_coinLbCache';
    var COIN_LB_TTL = 30 * 60 * 1000;
    var cached = null;
    try { cached = JSON.parse(localStorage.getItem(COIN_LB_KEY)); } catch(e) {}

    function buildCoinTable(entries, startIdx) {
      var table = document.createElement('table');
      table.className = 'score-table';
      var thead = document.createElement('thead');
      var headRow = document.createElement('tr');
      ['Rank', 'Name', 'Coins'].forEach(function(h) {
        var th = document.createElement('th');
        th.textContent = h;
        headRow.appendChild(th);
      });
      thead.appendChild(headRow);
      table.appendChild(thead);
      var tbody = document.createElement('tbody');
      entries.forEach(function(d, i) {
        var idx = startIdx + i;
        var tr = document.createElement('tr');
        if (idx === 0) tr.className = 'rank-1';
        else if (idx === 1) tr.className = 'rank-2';
        else if (idx === 2) tr.className = 'rank-3';
        var tdRank = document.createElement('td');
        var badge = document.createElement('span');
        badge.className = 'rank-badge';
        badge.textContent = rankDisplay(idx);
        tdRank.appendChild(badge);
        tr.appendChild(tdRank);
        var tdName = document.createElement('td');
        var nameCell = document.createElement('div');
        nameCell.className = 'name-cell';
        var miniAvatar = document.createElement('span');
        miniAvatar.className = 'mini-avatar';
        miniAvatar.dataset.username = d.name;
        var nameText = document.createElement('span');
        nameText.className = 'player-name-text';
        nameText.dataset.username = d.name;
        nameText.textContent = d.name;
        nameText.style.cursor = 'pointer';
        nameText.onclick = function() { window.location.href = 'profile.html?user=' + encodeURIComponent(d.name); };
        nameText.onmouseover = function() { this.style.textDecoration = 'underline'; };
        nameText.onmouseout = function() { this.style.textDecoration = 'none'; };
        nameCell.appendChild(miniAvatar);
        nameCell.appendChild(nameText);
        tdName.appendChild(nameCell);
        tr.appendChild(tdName);
        var tdCoins = document.createElement('td');
        tdCoins.className = 'score-val';
        tdCoins.textContent = fmtScore(d.coins) + ' coins';
        tr.appendChild(tdCoins);
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      return table;
    }

    function renderCoinLb(data) {
      var old = coinCard.querySelector('.loading-msg');
      if (old) old.remove();
      var wrap = document.createElement('div');
      wrap.className = 'coin-lb-tables';
      wrap.appendChild(buildCoinTable(data.slice(0, 5), 0));
      if (data.length > 5) wrap.appendChild(buildCoinTable(data.slice(5, 10), 5));
      coinCard.appendChild(wrap);
      if (window._renderFameAvatars) window._renderFameAvatars();
    }

    if (cached && cached.ts && Date.now() - cached.ts < COIN_LB_TTL && cached.data && cached.data.length) {
      renderCoinLb(cached.data);
    } else if (window._arcadeDB) {
      var fdb = window._arcadeDB;
      var q = fdb.query(fdb.collection(fdb.db, 'users'), fdb.orderBy('coins', 'desc'), fdb.limit(10));
      fdb.getDocs(q).then(function(snap) {
        if (snap.empty) { coinLoading.textContent = 'No data yet'; return; }
        var data = [];
        snap.forEach(function(doc) {
          var d = doc.data();
          if (d.username) data.push({ name: d.username, coins: d.coins || 0 });
        });
        localStorage.setItem(COIN_LB_KEY, JSON.stringify({ ts: Date.now(), data: data }));
        renderCoinLb(data);
      }).catch(function(e) { console.warn('[CoinLB]', e); coinLoading.textContent = 'Failed to load'; });
    }
    } // end if (!searchQuery)

    var list = GAMES;
    if (searchQuery) {
      list = GAMES.filter(function(g) {
        return g.name.toLowerCase().indexOf(searchQuery) !== -1 ||
               g.id.toLowerCase().indexOf(searchQuery) !== -1 ||
               g.unit.toLowerCase().indexOf(searchQuery) !== -1;
      });
    }


    list.forEach(function(g) {
      grid.appendChild(buildCard(g));
    });
  };

  // Render avatars/nametags on all visible tables
  window._renderFameAvatars = function() {
    if (!window.ArcadeAvatar || !window.ArcadeCoins || !window.ArcadeCoins.getProfile) return;
    document.querySelectorAll('.mini-avatar[data-username]').forEach(function(el) {
      if (el.dataset.rendered) return;
      var name = el.dataset.username;
      if (!name || name === 'Guest') return;
      el.dataset.rendered = '1';
      window.ArcadeCoins.getProfile(name).then(function(profile) {
        if (!profile) return;
        window.ArcadeAvatar.renderMini(el, profile);
        var nameEl = el.parentElement.querySelector('.player-name-text[data-username="' + name + '"]');
        if (nameEl) {
          window.ArcadeAvatar.styleName(nameEl, profile);
          window.ArcadeAvatar.styleNameEffect(nameEl, profile);
        }
      }).catch(function() {});
    });
  };

  // Wait for Firebase to load before rendering
  function tryRender() {
    if (!window._arcadeDB) {
      setTimeout(tryRender, 300);
      return;
    }
    render();
  }
  tryRender();
})();
</script>
