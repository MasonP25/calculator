<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reaction Time</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  h1 { font-size: 2rem; }
  .mode-select { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
  .mode-btn {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .mode-btn:hover, .mode-btn.active { border-color: #7b2ff7; }
  .arena {
    width: 600px; height: 350px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    flex-direction: column;
    gap: 1rem;
  }
  .arena.waiting { background: #1a1a2e; border: 2px solid #2a2a4a; }
  .arena.ready { background: #b71c1c; border: 2px solid #d32f2f; }
  .arena.go { background: #1b5e20; border: 2px solid #2e7d32; }
  .arena.result { background: #1a1a2e; border: 2px solid #2a2a4a; }
  .arena.early { background: #e65100; border: 2px solid #f57c00; }
  .arena-text { font-size: 2rem; font-weight: bold; text-align: center; }
  .arena-sub { font-size: 1rem; color: #ffffffaa; text-align: center; }
  .arena-time { font-size: 4rem; font-weight: bold; }
  .scores-area {
    margin-top: 1rem;
    display: flex;
    gap: 2rem;
  }
  .score-col {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 1rem;
    min-width: 200px;
    text-align: center;
  }
  .score-col h3 { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.5rem; }
  .score-entry { font-size: 0.9rem; padding: 0.2rem 0; }
  .score-entry .ms { color: #00d4ff; font-weight: bold; }
  .score-col .avg { color: #feca57; font-size: 1.2rem; font-weight: bold; margin-top: 0.5rem; }
  /* 2P specific */
  .split {
    display: flex;
    width: 600px;
    height: 350px;
    border-radius: 16px;
    overflow: hidden;
  }
  .split-half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s;
    user-select: none;
    border: 2px solid #2a2a4a;
  }
  .split-half:first-child { border-radius: 16px 0 0 16px; border-right: 1px solid #2a2a4a; }
  .split-half:last-child { border-radius: 0 16px 16px 0; border-left: 1px solid #2a2a4a; }
  .split-text { font-size: 1.3rem; font-weight: bold; text-align: center; }
  .split-time { font-size: 2.5rem; font-weight: bold; }
  .split-sub { font-size: 0.8rem; color: #ffffffaa; }
  .p1color { color: #00d4ff; } .p2color { color: #ff4757; }
  .vs-scores {
    margin-top: 1rem;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 1rem 2rem;
    text-align: center;
    font-size: 1.2rem;
  }
  .controls-hint { color: #555; font-size: 0.75rem; margin-top: 0.5rem; }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Reaction Time</h1>
<div class="mode-select">
  <button class="mode-btn active" data-m="solo">Solo</button>
  <button class="mode-btn" data-m="vs">2 Players</button>
</div>

<!-- Solo mode -->
<div id="soloArea">
  <div class="arena waiting" id="arena">
    <div class="arena-text" id="arenaText">Click to start</div>
    <div class="arena-sub" id="arenaSub">Test your reaction time!</div>
  </div>
  <div class="scores-area">
    <div class="score-col">
      <h3>Recent</h3>
      <div id="recentScores"></div>
      <div class="avg" id="avgScore"></div>
    </div>
    <div class="score-col">
      <h3>Best</h3>
      <div class="avg" id="bestScore">---</div>
    </div>
  </div>
</div>

<!-- 2P mode -->
<div id="vsArea" style="display:none">
  <div class="split" id="split">
    <div class="split-half waiting" id="half1">
      <div class="split-text p1color">P1</div>
      <div class="split-sub">Press Q</div>
    </div>
    <div class="split-half waiting" id="half2">
      <div class="split-text p2color">P2</div>
      <div class="split-sub">Press P</div>
    </div>
  </div>
  <div class="vs-scores" id="vsScores">
    <span class="p1color">P1: 0</span> &nbsp; - &nbsp; <span class="p2color">P2: 0</span>
  </div>
  <p class="controls-hint">P1: Q key &nbsp;|&nbsp; P2: P key &nbsp;|&nbsp; First to react when it turns GREEN wins!</p>
</div>

<script>
let mode = 'solo';
let state = 'waiting'; // waiting, ready, go, result, early
let timeout, startTime;
let scores = [];
let best = Infinity;
// VS
let vsState = 'waiting';
let p1Score = 0, p2Score = 0;
let p1Time = 0, p2Time = 0;
let p1Done = false, p2Done = false;

const arena = document.getElementById('arena');
const arenaText = document.getElementById('arenaText');
const arenaSub = document.getElementById('arenaSub');

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.m;
    document.getElementById('soloArea').style.display = mode === 'solo' ? 'block' : 'none';
    document.getElementById('vsArea').style.display = mode === 'vs' ? 'block' : 'none';
    resetSolo();
    resetVS();
  });
});

// ─── SOLO ───
function resetSolo() {
  state = 'waiting';
  arena.className = 'arena waiting';
  arenaText.textContent = 'Click to start';
  arenaSub.textContent = 'Test your reaction time!';
  if (timeout) clearTimeout(timeout);
}

arena.addEventListener('click', () => {
  if (state === 'waiting') {
    state = 'ready';
    arena.className = 'arena ready';
    arenaText.textContent = 'Wait for green...';
    arenaSub.textContent = '';
    const delay = 1500 + Math.random() * 3500;
    timeout = setTimeout(() => {
      state = 'go';
      arena.className = 'arena go';
      arenaText.textContent = 'CLICK NOW!';
      startTime = performance.now();
    }, delay);
  } else if (state === 'ready') {
    // Too early
    clearTimeout(timeout);
    state = 'early';
    arena.className = 'arena early';
    arenaText.textContent = 'Too early!';
    arenaSub.textContent = 'Click to try again';
    setTimeout(() => { state = 'waiting'; resetSolo(); }, 1500);
  } else if (state === 'go') {
    const time = Math.round(performance.now() - startTime);
    state = 'result';
    arena.className = 'arena result';
    arenaText.innerHTML = `<span style="color:#00d4ff">${time}ms</span>`;
    arenaSub.textContent = 'Click to try again';
    scores.push(time);
    if (scores.length > 5) scores.shift();
    if (time < best) best = time;
    if(window.HallOfFame) window.HallOfFame.submit('reaction', time);
    updateScores();
    setTimeout(() => { state = 'waiting'; }, 300);
  } else if (state === 'result') {
    resetSolo();
  }
});

function updateScores() {
  const recent = document.getElementById('recentScores');
  recent.innerHTML = scores.map(s => `<div class="score-entry"><span class="ms">${s}ms</span></div>`).join('');
  const avg = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
  document.getElementById('avgScore').textContent = `Avg: ${avg}ms`;
  document.getElementById('bestScore').textContent = best === Infinity ? '---' : best + 'ms';
}

// ─── VS MODE ───
const half1 = document.getElementById('half1');
const half2 = document.getElementById('half2');

function resetVS() {
  vsState = 'waiting';
  p1Done = false; p2Done = false;
  half1.className = 'split-half waiting';
  half2.className = 'split-half waiting';
  half1.innerHTML = '<div class="split-text p1color">P1</div><div class="split-sub">Press Q to ready up</div>';
  half2.innerHTML = '<div class="split-text p2color">P2</div><div class="split-sub">Press P to ready up</div>';
  if (timeout) clearTimeout(timeout);
}

function startVSRound() {
  vsState = 'ready';
  half1.className = 'split-half';
  half2.className = 'split-half';
  half1.style.background = '#b71c1c';
  half2.style.background = '#b71c1c';
  half1.innerHTML = '<div class="split-text">Wait...</div>';
  half2.innerHTML = '<div class="split-text">Wait...</div>';
  p1Done = false; p2Done = false;
  p1Time = 0; p2Time = 0;

  const delay = 1500 + Math.random() * 3500;
  timeout = setTimeout(() => {
    vsState = 'go';
    half1.style.background = '#1b5e20';
    half2.style.background = '#1b5e20';
    half1.innerHTML = '<div class="split-text">GO!</div>';
    half2.innerHTML = '<div class="split-text">GO!</div>';
    startTime = performance.now();
  }, delay);
}

function vsPress(player) {
  if (vsState === 'waiting') {
    // Start round on any press
    startVSRound();
    return;
  }
  if (vsState === 'ready') {
    // Too early
    clearTimeout(timeout);
    vsState = 'result';
    const loser = player;
    const winner = player === 1 ? 2 : 1;
    if (winner === 1) p1Score++; else p2Score++;
    const wHalf = winner === 1 ? half1 : half2;
    const lHalf = loser === 1 ? half1 : half2;
    wHalf.style.background = '#1a1a2e';
    wHalf.innerHTML = `<div class="split-text" style="color:#00d4ff">Win!</div><div class="split-sub">Opponent was too early</div>`;
    lHalf.style.background = '#e65100';
    lHalf.innerHTML = `<div class="split-text">Too early!</div>`;
    updateVSScores();
    setTimeout(resetVS, 2000);
    return;
  }
  if (vsState === 'go') {
    const time = Math.round(performance.now() - startTime);
    if (player === 1 && !p1Done) {
      p1Done = true; p1Time = time;
      half1.innerHTML = `<div class="split-time p1color">${time}ms</div>`;
    }
    if (player === 2 && !p2Done) {
      p2Done = true; p2Time = time;
      half2.innerHTML = `<div class="split-time p2color">${time}ms</div>`;
    }
    if (p1Done && p2Done) {
      vsState = 'result';
      if (p1Time < p2Time) {
        p1Score++;
        half1.style.background = '#1b5e20';
      } else if (p2Time < p1Time) {
        p2Score++;
        half2.style.background = '#1b5e20';
      }
      updateVSScores();
      setTimeout(resetVS, 2000);
    } else if (p1Done || p2Done) {
      // Give the other player 2 seconds
      setTimeout(() => {
        if (vsState !== 'go') return;
        vsState = 'result';
        if (p1Done && !p2Done) {
          p1Score++;
          half1.style.background = '#1b5e20';
          half2.innerHTML = '<div class="split-text" style="color:#ff4757">Too slow!</div>';
        } else if (p2Done && !p1Done) {
          p2Score++;
          half2.style.background = '#1b5e20';
          half1.innerHTML = '<div class="split-text" style="color:#ff4757">Too slow!</div>';
        }
        updateVSScores();
        setTimeout(resetVS, 2000);
      }, 2000);
    }
  }
}

function updateVSScores() {
  document.getElementById('vsScores').innerHTML =
    `<span class="p1color">P1: ${p1Score}</span> &nbsp; - &nbsp; <span class="p2color">P2: ${p2Score}</span>`;
}

document.addEventListener('keydown', e => {
  if (mode === 'vs') {
    if (e.key === 'q' || e.key === 'Q') vsPress(1);
    if (e.key === 'p' || e.key === 'P') vsPress(2);
  }
});
</script>
<script src="sound.js"></script>
<script src="fame.js"></script>
<script type="module" src="firebase-lb.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=3"></script>
</body>
</html>
