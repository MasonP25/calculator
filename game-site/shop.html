<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — Arcade</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: var(--t-bg1, #0f0f1a);
    color: var(--t-text, #e0e0e0);
    min-height: 100vh;
    padding: 0 1rem 3rem;
  }

  /* Top bar */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2rem 0;
    position: relative;
    max-width: 900px;
    margin: 0 auto;
  }
  .back-link {
    position: absolute;
    left: 0;
    color: var(--t-accent2, #00d4ff);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 600;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--t-accent, #7b2ff7); }
  .top-bar h1 {
    font-size: 2.2rem;
    background: linear-gradient(135deg, var(--t-accent2, #00d4ff), var(--t-accent, #7b2ff7));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Coin balance */
  .coin-balance {
    text-align: center;
    font-size: 1.3rem;
    margin: 0.4rem 0 1.2rem;
    color: #ffd700;
    font-weight: 700;
  }

  /* Tab toggle (matching fame.html scope toggle) */
  .tab-toggle {
    max-width: 900px;
    margin: 0 auto 1.5rem;
    display: flex;
    justify-content: center;
    gap: 0;
  }
  .tab-btn {
    background: var(--t-bg2, #1a1a2e);
    border: 1px solid var(--t-border, #2a2a4a);
    color: var(--t-dim, #aaa);
    padding: 0.45rem 1.4rem;
    font-size: 0.85rem;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab-btn:first-child { border-radius: 10px 0 0 10px; }
  .tab-btn:last-child  { border-radius: 0 10px 10px 0; }
  .tab-btn.active {
    background: var(--t-accent, #7b2ff7);
    border-color: var(--t-accent, #7b2ff7);
    color: #fff;
    font-weight: 600;
  }

  /* Guest message */
  .guest-msg {
    text-align: center;
    font-size: 1.2rem;
    color: var(--t-dim, #888);
    margin-top: 4rem;
  }

  /* Shop container */
  .shop-container {
    max-width: 900px;
    margin: 0 auto;
  }

  /* ─── Avatar Tab ─── */
  .avatar-preview-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .avatar-preview-box {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1.2rem 2rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s;
  }
  .avatar-preview-box.previewing {
    border: 2px dashed var(--t-accent, #7b2ff7);
    opacity: 0.85;
  }
  .preview-label {
    text-align: center;
    font-size: 0.75rem;
    color: var(--t-accent, #7b2ff7);
    margin-top: 0.3rem;
    height: 1rem;
  }

  /* Category rows */
  .category-row {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex-wrap: wrap;
  }
  .category-label {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--t-dim, #888);
    width: 60px;
    flex-shrink: 0;
  }
  .category-content {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 1;
    min-width: 0;
    justify-content: center;
  }

  /* Arrow buttons */
  .arrow-btn {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--t-bg3, #2a2a4a);
    border: none;
    color: var(--t-text, #e0e0e0);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .arrow-btn:hover { background: var(--t-border, #3a3a5a); }

  /* Item info area */
  .item-info {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    min-width: 220px;
    justify-content: center;
  }
  .item-mini-preview {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .item-details {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.3rem;
  }
  .item-name {
    font-size: 0.95rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* Action buttons */
  .btn-buy {
    background: #22c55e;
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.35rem 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn-buy:hover { background: #1ea34e; }
  .btn-buy.disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-buy.disabled:hover { background: #22c55e; }

  .btn-equip {
    background: var(--t-accent, #7b2ff7);
    border: none;
    color: #fff;
    font-family: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 0.35rem 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-equip:hover { opacity: 0.85; }

  .btn-remove {
    background: transparent;
    border: 1px solid #555;
    color: #aaa;
    font-family: inherit;
    font-size: 0.8rem;
    padding: 0.35rem 0.9rem;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-remove:hover { border-color: #888; color: #ddd; }

  .equipped-label {
    font-size: 0.8rem;
    color: var(--t-dim, #555);
    font-weight: 600;
  }

  /* Skin color picker */
  .skin-row {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1rem 1.2rem;
    margin-bottom: 1rem;
  }
  .skin-row-label {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--t-dim, #888);
    margin-bottom: 0.6rem;
  }
  .skin-section-label {
    font-size: 0.7rem;
    color: var(--t-dim, #666);
    margin: 0.5rem 0 0.3rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .skin-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .skin-swatch {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }
  .skin-swatch:hover { transform: scale(1.15); }
  .skin-swatch.active { border-color: var(--t-accent, #7b2ff7); }
  .skin-swatch .swatch-price {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.55rem;
    color: #ffd700;
    white-space: nowrap;
  }
  .skin-swatch .swatch-lock {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 0.7rem;
    opacity: 0.8;
  }

  .item-price {
    font-size: 0.75rem;
    color: #ffd700;
  }

  /* ─── Nametag Tab ─── */
  .nametag-preview-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .nametag-preview-box {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1.2rem 2.5rem;
    text-align: center;
  }
  .nametag-preview-name {
    font-size: 2rem;
    font-weight: 700;
    min-height: 2.5rem;
  }
  .nametag-preview-label {
    font-size: 0.75rem;
    color: var(--t-dim, #666);
    margin-top: 0.3rem;
  }

  /* Nametag section titles */
  .nt-section-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--t-dim, #aaa);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 1.5rem 0 0.8rem;
    padding-left: 0.3rem;
  }

  /* Nametag grid */
  .nt-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1rem;
  }
  .nt-card {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1rem;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: default;
  }
  .nt-card:hover {
    border-color: var(--t-bg3, #3a3a5a);
    box-shadow: 0 2px 12px var(--t-glow, rgba(123, 47, 247, 0.1));
  }
  .nt-card.equipped-card {
    border-color: var(--t-accent, #7b2ff7);
  }
  .nt-card-name-preview {
    font-size: 1.3rem;
    font-weight: 700;
    min-height: 1.8rem;
    margin-bottom: 0.4rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nt-card-style-name {
    font-size: 0.8rem;
    color: var(--t-dim, #888);
    margin-bottom: 0.5rem;
  }
  .nt-card-actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }

  /* Chat bubble preview */
  .bubble-preview {
    background: var(--t-bg1, #0f0f1a);
    border-radius: 8px;
    padding: 6px 10px;
    text-align: left;
    margin-bottom: 0.4rem;
    font-size: 0.85rem;
    color: var(--t-text, #e0e0e0);
    min-height: 1.8rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .bubble-preview-name {
    color: #feca57;
    font-weight: 700;
    font-size: 0.8rem;
    white-space: nowrap;
  }
  .bubble-preview-text {
    color: var(--t-text, #e0e0e0);
    font-size: 0.82rem;
  }

  /* ─── Cursor Tab ─── */
  .cursor-preview-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .cursor-preview-box {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 2rem 3rem;
    text-align: center;
    min-width: 200px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
  }
  .cursor-demo {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cursor-demo svg { width: 32px; height: 38px; }
  .cursor-card {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1rem;
    text-align: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .cursor-card:hover {
    border-color: var(--t-bg3, #3a3a5a);
    box-shadow: 0 2px 12px var(--t-glow, rgba(123, 47, 247, 0.1));
  }
  .cursor-card.equipped-card {
    border-color: var(--t-accent, #7b2ff7);
  }
  .cursor-card-preview {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 0.4rem;
  }
  .cursor-card-preview svg { width: 28px; height: 34px; }

  /* Custom cursor drawer (admin) */
  .cursor-drawer {
    background: var(--t-bg2, #1a1a2e);
    border: 2px solid var(--t-border, #2a2a4a);
    border-radius: 16px;
    padding: 1rem 1.2rem;
    margin-top: 1rem;
  }
  .cursor-drawer-title {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--t-dim, #888);
    margin-bottom: 0.8rem;
  }
  .cursor-canvas-wrap {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .cursor-canvas-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
  }
  #cursorCanvas {
    border: 1px solid var(--t-border, #2a2a4a);
    border-radius: 4px;
    image-rendering: pixelated;
    cursor: crosshair;
  }
  .cursor-tools {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .cursor-tools label {
    font-size: 0.8rem;
    color: var(--t-dim, #aaa);
  }
  .cursor-tool-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .category-row { flex-direction: column; gap: 0.5rem; padding: 0.8rem; }
    .category-label { width: auto; text-align: center; }
    .item-info { min-width: 0; flex-wrap: wrap; justify-content: center; }
    .nt-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .top-bar h1 { font-size: 1.6rem; }
    .cursor-canvas-wrap { justify-content: center; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-link">&larr; Back</a>
  <h1>Shop</h1>
</div>

<div class="coin-balance" id="coinBalance">&#x1FA99; ---</div>

<div class="tab-toggle">
  <button class="tab-btn active" id="tabAvatar" onclick="switchTab('avatar')">Avatar</button>
  <button class="tab-btn" id="tabNametags" onclick="switchTab('nametags')">Nametags</button>
  <button class="tab-btn" id="tabCursors" onclick="switchTab('cursors')">Cursors</button>
</div>

<div class="guest-msg" id="guestMsg" style="display:none;">Sign in to use the shop</div>

<div class="shop-container" id="shopContainer" style="display:none;">

  <!-- ── Avatar Tab ── -->
  <div id="avatarTab">
    <div class="avatar-preview-wrap">
      <div>
        <div class="avatar-preview-box" id="avatarPreviewBox">
          <div id="avatarPreview"></div>
        </div>
        <div class="preview-label" id="previewLabel"></div>
      </div>
    </div>

    <div id="skinColorRow"></div>
    <div id="categoryRows"></div>
  </div>

  <!-- ── Nametag Tab ── -->
  <div id="nametagTab" style="display:none;">
    <div class="nametag-preview-wrap">
      <div class="nametag-preview-box">
        <div class="nametag-preview-name" id="ntPreviewName">Player</div>
        <div class="nametag-preview-label">Your nametag preview</div>
      </div>
    </div>

    <div class="nt-section-title">Colors &amp; Gradients</div>
    <div class="nt-grid" id="ntColorGrid"></div>

    <div class="nt-section-title">Fonts</div>
    <div class="nt-grid" id="ntFontGrid"></div>

    <div class="nt-section-title">Chat Bubbles</div>
    <div class="nt-grid" id="ntBubbleGrid"></div>

    <div class="nt-section-title">Name Effects</div>
    <div class="nt-grid" id="ntEffectGrid"></div>
  </div>

  <!-- ── Cursors Tab ── -->
  <div id="cursorTab" style="display:none;">
    <div class="cursor-preview-wrap">
      <div class="cursor-preview-box">
        <div class="cursor-demo" id="cursorPreview"></div>
        <div style="font-size:0.75rem;color:var(--t-dim,#666);">Your current cursor</div>
      </div>
    </div>

    <div class="nt-section-title">Cursor Styles</div>
    <div class="nt-grid" id="cursorGrid"></div>

    <div id="cursorDrawerWrap"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ── State ──
  var CATEGORIES = ['hat', 'hair', 'face', 'shirt'];
  var categoryItems = {}; // { hat: [{id, name, price}, ...], ... }
  var categoryIndex = { hat: 0, hair: 0, face: 0, shirt: 0 }; // 0 = None
  var currentTab = 'avatar';

  // Build category item lists (index 0 = None)
  CATEGORIES.forEach(function(cat) {
    categoryItems[cat] = [{ id: '', name: 'None', price: 0 }];
  });
  var AA = window.ArcadeAvatar || {};
  var ITEMS = AA.ITEMS || {};
  Object.keys(ITEMS).forEach(function(id) {
    var item = ITEMS[id];
    if (item.exclusive) return; // exclusive items added dynamically when owned
    categoryItems[item.category].push({ id: id, name: item.name, price: item.price });
  });

  // Build skin color list
  var SKIN_COLORS = AA.SKIN_COLORS || {};

  // Build nametag lists
  var NAMETAGS = AA.NAMETAGS || {};
  var ntColors = []; // colors + gradients
  var ntFonts = [];
  Object.keys(NAMETAGS).forEach(function(id) {
    var nt = NAMETAGS[id];
    if (nt.exclusive) return; // exclusive nametags added dynamically when owned
    var entry = { id: id, name: nt.name, type: nt.type, css: nt.css, price: nt.price };
    if (nt.type === 'font') {
      ntFonts.push(entry);
    } else {
      ntColors.push(entry);
    }
  });

  // Build chat bubble list
  var CHAT_BUBBLES = AA.CHAT_BUBBLES || {};
  var cbItems = [];
  Object.keys(CHAT_BUBBLES).forEach(function(id) {
    var cb = CHAT_BUBBLES[id];
    if (cb.exclusive) return;
    cbItems.push({ id: id, name: cb.name, css: cb.css, price: cb.price });
  });

  // Build name effect list
  var NAME_EFFECTS = AA.NAME_EFFECTS || {};
  var neItems = [];
  Object.keys(NAME_EFFECTS).forEach(function(id) {
    var ne = NAME_EFFECTS[id];
    if (ne.exclusive) return;
    neItems.push({ id: id, name: ne.name, css: ne.css, price: ne.price });
  });

  // Add owned exclusive items to their respective lists
  function addOwnedExclusives() {
    // Avatar items
    Object.keys(ITEMS).forEach(function(id) {
      var item = ITEMS[id];
      if (!item.exclusive) return;
      if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem(id)) return;
      // Check not already added
      var list = categoryItems[item.category];
      for (var i = 0; i < list.length; i++) { if (list[i].id === id) return; }
      list.push({ id: id, name: item.name + ' \u2605', price: 0 });
    });
    // Nametags
    Object.keys(NAMETAGS).forEach(function(id) {
      var nt = NAMETAGS[id];
      if (!nt.exclusive) return;
      if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem(id)) return;
      var entry = { id: id, name: nt.name + ' \u2605', type: nt.type, css: nt.css, price: 0 };
      if (nt.type === 'font') {
        for (var i = 0; i < ntFonts.length; i++) { if (ntFonts[i].id === id) return; }
        ntFonts.push(entry);
      } else {
        for (var i = 0; i < ntColors.length; i++) { if (ntColors[i].id === id) return; }
        ntColors.push(entry);
      }
    });
    // Chat bubbles
    Object.keys(CHAT_BUBBLES).forEach(function(id) {
      var cb = CHAT_BUBBLES[id];
      if (!cb.exclusive) return;
      if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem(id)) return;
      for (var i = 0; i < cbItems.length; i++) { if (cbItems[i].id === id) return; }
      cbItems.push({ id: id, name: cb.name + ' \u2605', css: cb.css, price: 0 });
    });
    // Name effects
    Object.keys(NAME_EFFECTS).forEach(function(id) {
      var ne = NAME_EFFECTS[id];
      if (!ne.exclusive) return;
      if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem(id)) return;
      for (var i = 0; i < neItems.length; i++) { if (neItems[i].id === id) return; }
      neItems.push({ id: id, name: ne.name + ' \u2605', css: ne.css, price: 0 });
    });
    // Cursors
    Object.keys(CURSORS).forEach(function(id) {
      var c = CURSORS[id];
      if (!c.exclusive) return;
      if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem(id)) return;
      for (var i = 0; i < cursorItems.length; i++) { if (cursorItems[i].id === id) return; }
      cursorItems.push({ id: id, name: c.name + ' \u2605', svg: c.svg, price: 0 });
    });
  }

  // ── Helpers ──
  function getUser() {
    return localStorage.getItem('arcade_currentUser') || localStorage.getItem('arcadePlayerName') || 'Guest';
  }
  function isGuest() {
    var u = getUser();
    return !u || u === 'Guest';
  }
  function sfxCoin()  { if (window.SFX && window.SFX.coin) window.SFX.coin(); }
  function sfxClick() { if (window.SFX && window.SFX.click) window.SFX.click(); }

  // ── Admin check ──
  function _hasExclusive() {
    if (!window.ArcadeCoins || !window.ArcadeCoins.ownsItem) return false;
    var allIds = Object.keys(ITEMS).concat(Object.keys(NAMETAGS));
    for (var i = 0; i < allIds.length; i++) {
      var item = ITEMS[allIds[i]] || NAMETAGS[allIds[i]];
      if (item && item.exclusive && window.ArcadeCoins.ownsItem(allIds[i])) return true;
    }
    return false;
  }

  // Build cursor list
  var CURSORS = AA.CURSORS || {};
  var cursorItems = [];
  Object.keys(CURSORS).forEach(function(id) {
    var c = CURSORS[id];
    if (c.exclusive) return;
    if (id === 'cur_custom') return; // handled by drawer
    cursorItems.push({ id: id, name: c.name, svg: c.svg, price: c.price });
  });

  // ── Tab switching ──
  window.switchTab = function(tab) {
    currentTab = tab;
    document.getElementById('tabAvatar').className = 'tab-btn' + (tab === 'avatar' ? ' active' : '');
    document.getElementById('tabNametags').className = 'tab-btn' + (tab === 'nametags' ? ' active' : '');
    document.getElementById('tabCursors').className = 'tab-btn' + (tab === 'cursors' ? ' active' : '');
    document.getElementById('avatarTab').style.display = tab === 'avatar' ? '' : 'none';
    document.getElementById('nametagTab').style.display = tab === 'nametags' ? '' : 'none';
    document.getElementById('cursorTab').style.display = tab === 'cursors' ? '' : 'none';
    if (tab === 'nametags') renderNametags();
    if (tab === 'cursors') renderCursors();
  };

  // ── Balance display ──
  function updateBalance() {
    var bal = window.ArcadeCoins.getBalance();
    document.getElementById('coinBalance').innerHTML = '&#x1FA99; ' + bal.toLocaleString() + ' coins';
  }

  // ── Avatar preview ──
  function getPreviewEquipped() {
    var equipped = window.ArcadeCoins.getEquipped();
    // Overlay current browsing selections (only if owned or is "None")
    CATEGORIES.forEach(function(cat) {
      var idx = categoryIndex[cat];
      var item = categoryItems[cat][idx];
      if (item.id === '') {
        // "None" selected in browser
        equipped[cat] = '';
      } else if (window.ArcadeCoins.ownsItem(item.id)) {
        equipped[cat] = item.id;
      } else {
        // Previewing unowned item — show it anyway
        equipped[cat] = item.id;
      }
    });
    return equipped;
  }

  function isPreviewingUnowned() {
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var idx = categoryIndex[cat];
      var item = categoryItems[cat][idx];
      if (item.id !== '' && !window.ArcadeCoins.ownsItem(item.id)) return true;
    }
    return false;
  }

  function renderAvatarPreview() {
    var container = document.getElementById('avatarPreview');
    var box = document.getElementById('avatarPreviewBox');
    var label = document.getElementById('previewLabel');
    var equipped = getPreviewEquipped();
    window.ArcadeAvatar.render(container, equipped, 200);

    if (isPreviewingUnowned()) {
      box.classList.add('previewing');
      label.textContent = 'Preview (not owned)';
    } else {
      box.classList.remove('previewing');
      label.textContent = '';
    }
  }

  // ── Sync category indices to equipped ──
  function syncIndicesToEquipped() {
    var equipped = window.ArcadeCoins.getEquipped();
    CATEGORIES.forEach(function(cat) {
      var eqId = equipped[cat] || '';
      categoryIndex[cat] = 0;
      for (var i = 0; i < categoryItems[cat].length; i++) {
        if (categoryItems[cat][i].id === eqId) {
          categoryIndex[cat] = i;
          break;
        }
      }
    });
  }

  // ── Build category rows ──
  function buildCategoryRows() {
    var container = document.getElementById('categoryRows');
    container.innerHTML = '';

    CATEGORIES.forEach(function(cat) {
      var row = document.createElement('div');
      row.className = 'category-row';
      row.id = 'row-' + cat;

      var label = document.createElement('div');
      label.className = 'category-label';
      label.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);

      var content = document.createElement('div');
      content.className = 'category-content';

      var leftBtn = document.createElement('button');
      leftBtn.className = 'arrow-btn';
      leftBtn.innerHTML = '&#9664;';
      leftBtn.onclick = function() { cycleCategory(cat, -1); };

      var rightBtn = document.createElement('button');
      rightBtn.className = 'arrow-btn';
      rightBtn.innerHTML = '&#9654;';
      rightBtn.onclick = function() { cycleCategory(cat, 1); };

      var info = document.createElement('div');
      info.className = 'item-info';
      info.id = 'info-' + cat;

      content.appendChild(leftBtn);
      content.appendChild(info);
      content.appendChild(rightBtn);
      row.appendChild(label);
      row.appendChild(content);
      container.appendChild(row);
    });

    updateAllCategoryInfo();
  }

  function cycleCategory(cat, dir) {
    var items = categoryItems[cat];
    categoryIndex[cat] = (categoryIndex[cat] + dir + items.length) % items.length;
    updateCategoryInfo(cat);
    renderAvatarPreview();
  }

  function updateAllCategoryInfo() {
    CATEGORIES.forEach(function(cat) { updateCategoryInfo(cat); });
  }

  function updateCategoryInfo(cat) {
    var info = document.getElementById('info-' + cat);
    if (!info) return;
    info.innerHTML = '';

    var idx = categoryIndex[cat];
    var item = categoryItems[cat][idx];
    var equipped = window.ArcadeCoins.getEquipped();

    // Mini avatar preview
    var miniWrap = document.createElement('div');
    miniWrap.className = 'item-mini-preview';
    if (item.id !== '') {
      var miniEquipped = { hat: '', hair: '', face: '', shirt: '' };
      miniEquipped[cat] = item.id;
      window.ArcadeAvatar.render(miniWrap, miniEquipped, 40);
    } else {
      miniWrap.innerHTML = '<span style="font-size:1.5rem;color:#555;">&#8709;</span>';
    }
    info.appendChild(miniWrap);

    // Details
    var details = document.createElement('div');
    details.className = 'item-details';

    var nameEl = document.createElement('div');
    nameEl.className = 'item-name';
    nameEl.textContent = item.name;
    details.appendChild(nameEl);

    if (item.id === '') {
      // "None" option
      if (equipped[cat] === '' || !equipped[cat]) {
        var eqLabel = document.createElement('span');
        eqLabel.className = 'equipped-label';
        eqLabel.textContent = 'Current';
        details.appendChild(eqLabel);
      } else {
        var removeBtn = document.createElement('button');
        removeBtn.className = 'btn-remove';
        removeBtn.textContent = 'Remove';
        removeBtn.onclick = function() {
          sfxClick();
          window.ArcadeCoins.equipItem(cat, '');
          syncIndicesToEquipped();
          updateAllCategoryInfo();
          renderAvatarPreview();
        };
        details.appendChild(removeBtn);
      }
    } else if (window.ArcadeCoins.ownsItem(item.id)) {
      // Owned
      if (equipped[cat] === item.id) {
        var row2 = document.createElement('div');
        row2.style.display = 'flex';
        row2.style.alignItems = 'center';
        row2.style.gap = '0.5rem';
        var eqLabel2 = document.createElement('span');
        eqLabel2.className = 'equipped-label';
        eqLabel2.innerHTML = 'Equipped &#10003;';
        row2.appendChild(eqLabel2);
        var removeBtn2 = document.createElement('button');
        removeBtn2.className = 'btn-remove';
        removeBtn2.textContent = 'Remove';
        removeBtn2.onclick = function() {
          sfxClick();
          window.ArcadeCoins.equipItem(cat, '');
          categoryIndex[cat] = 0;
          updateAllCategoryInfo();
          renderAvatarPreview();
        };
        row2.appendChild(removeBtn2);
        details.appendChild(row2);
      } else {
        var equipBtn = document.createElement('button');
        equipBtn.className = 'btn-equip';
        equipBtn.textContent = 'Equip';
        (function(c, iid) {
          equipBtn.onclick = function() {
            sfxClick();
            window.ArcadeCoins.equipItem(c, iid);
            syncIndicesToEquipped();
            updateAllCategoryInfo();
            renderAvatarPreview();
          };
        })(cat, item.id);
        details.appendChild(equipBtn);
      }
    } else {
      // Not owned
      var priceRow = document.createElement('div');
      priceRow.style.display = 'flex';
      priceRow.style.alignItems = 'center';
      priceRow.style.gap = '0.5rem';

      var priceLabel = document.createElement('span');
      priceLabel.className = 'item-price';
      priceLabel.innerHTML = '&#x1FA99; ' + item.price;
      priceRow.appendChild(priceLabel);

      var canAfford = window.ArcadeCoins.getBalance() >= item.price;
      var buyBtn = document.createElement('button');
      buyBtn.className = 'btn-buy' + (canAfford ? '' : ' disabled');
      buyBtn.textContent = 'Buy';
      if (canAfford) {
        (function(c, iid, iprice) {
          buyBtn.onclick = function() {
            var result = window.ArcadeCoins.buyItem(iid, iprice);
            if (result.ok) {
              sfxCoin();
              // Auto-equip after purchase
              window.ArcadeCoins.equipItem(c, iid);
              syncIndicesToEquipped();
              updateBalance();
              updateAllCategoryInfo();
              renderAvatarPreview();
            }
          };
        })(cat, item.id, item.price);
      }
      priceRow.appendChild(buyBtn);
      details.appendChild(priceRow);
    }

    info.appendChild(details);
  }

  // ── Skin color picker ──
  function buildSkinColorRow() {
    var container = document.getElementById('skinColorRow');
    container.innerHTML = '';

    var row = document.createElement('div');
    row.className = 'skin-row';

    // Separate free and paid
    var freeSkins = [];

    Object.keys(SKIN_COLORS).forEach(function(id) {
      var s = SKIN_COLORS[id];
      if (s.price === 0) freeSkins.push({ id: id, name: s.name, color: s.color, price: 0 });
      else paidSkins.push({ id: id, name: s.name, color: s.color, price: s.price });
    });

    // Free section

    freeSwatches.className = 'skin-swatches';

    defSwatch.className = 'skin-swatch' + (currentSkin === '' ? ' active' : '');
    defSwatch.style.background = '#FFD3B5';
    defSwatch.title = 'Default';
    defSwatch.onclick = function() {
      sfxClick();
      window.ArcadeCoins.equipItem('skin', '');
      buildSkinColorRow();
      renderAvatarPreview();
    };
    freeSwatches.appendChild(defSwatch);

    freeSkins.forEach(function(s) {
      var swatch = document.createElement('div');
      swatch.className = 'skin-swatch' + (currentSkin === s.id ? ' active' : '');
      swatch.style.background = s.color;
      swatch.title = s.name;
      swatch.onclick = function() {
        sfxClick();
        window.ArcadeCoins.equipItem('skin', s.id);
        buildSkinColorRow();
        renderAvatarPreview();
      };
      freeSwatches.appendChild(swatch);
    });
    row.appendChild(freeSwatches);

    // Paid ROYGBIV section
    var paidLabel = document.createElement('div');
    paidLabel.className = 'skin-section-label';
    paidLabel.style.marginTop = '0.8rem';
    paidLabel.textContent = 'Colors (50 coins each)';
    row.appendChild(paidLabel);

    var paidSwatches = document.createElement('div');
    paidSwatches.className = 'skin-swatches';
    paidSkins.forEach(function(s) {
      var owned = window.ArcadeCoins.ownsItem(s.id);
      var swatch = document.createElement('div');
      swatch.className = 'skin-swatch' + (currentSkin === s.id ? ' active' : '');
      swatch.style.background = s.color;
      swatch.title = s.name + (owned ? '' : ' (50 coins)');

      if (owned) {
        swatch.onclick = function() {
          sfxClick();
          window.ArcadeCoins.equipItem('skin', s.id);
          buildSkinColorRow();
          renderAvatarPreview();
        };
      } else {
        swatch.style.opacity = '0.5';
        var lock = document.createElement('span');
        lock.className = 'swatch-lock';
        lock.textContent = '\uD83D\uDD12';
        swatch.appendChild(lock);
        var priceTag = document.createElement('span');
        priceTag.className = 'swatch-price';
        priceTag.textContent = '50';
        swatch.appendChild(priceTag);
        (function(sid, sprice) {
          swatch.onclick = function() {
            if (window.ArcadeCoins.getBalance() >= sprice) {
              var result = window.ArcadeCoins.buyItem(sid, sprice);
              if (result.ok) {
                sfxCoin();
                window.ArcadeCoins.equipItem('skin', sid);
                updateBalance();
                buildSkinColorRow();
                renderAvatarPreview();
              }
            }
          };
        })(s.id, s.price);
      }
      paidSwatches.appendChild(swatch);
    });
    row.appendChild(paidSwatches);

    // Admin custom color picker — only show if user owns any exclusive item
    if (_hasExclusive()) {
      var adminLabel = document.createElement('div');
      adminLabel.className = 'skin-section-label';
      adminLabel.style.marginTop = '0.8rem';
      adminLabel.textContent = 'Custom Color \u2605';
      row.appendChild(adminLabel);

      var customRow = document.createElement('div');
      Object.assign(customRow.style, {
        display: 'flex', alignItems: 'center', gap: '10px', padding: '4px 0'
      });

      var colorInput = document.createElement('input');
      colorInput.type = 'color';
      colorInput.value = (currentSkin && currentSkin.charAt(0) === '#') ? currentSkin : '#ff69b4';
      Object.assign(colorInput.style, {
        width: '48px', height: '36px', border: '2px solid #3a3a5a', borderRadius: '8px',
        cursor: 'pointer', padding: '2px', background: 'transparent'
      });

      var applyBtn = document.createElement('button');
      applyBtn.textContent = 'Apply';
      applyBtn.className = 'btn-equip';
      Object.assign(applyBtn.style, {
        padding: '6px 16px', fontSize: '0.85rem', borderRadius: '6px'
      });

      var customActive = (currentSkin && currentSkin.charAt(0) === '#');
      if (customActive) {
        var indicator = document.createElement('span');
        indicator.textContent = 'Equipped';
        Object.assign(indicator.style, {
          color: '#7b2ff7', fontWeight: '600', fontSize: '0.8rem'
        });
        customRow.appendChild(indicator);
      }

      applyBtn.onclick = function() {
        sfxClick();
        var hexVal = colorInput.value;
        // Directly set equipped and save
        var eq = window.ArcadeCoins.getEquipped();
        eq.skin = hexVal;
        window.ArcadeCoins.equipItem('skin', hexVal);
        buildSkinColorRow();
        renderAvatarPreview();
      };

      // Live preview on color change
      colorInput.addEventListener('input', function() {
        var previewEquipped = Object.assign({}, window.ArcadeCoins.getEquipped(), { skin: colorInput.value });
        var previewContainer = document.getElementById('avatarPreview');
        if (previewContainer && window.ArcadeAvatar) {
          previewContainer.innerHTML = '';
          window.ArcadeAvatar.render(previewContainer, previewEquipped, 200);
        }
      });

      customRow.appendChild(colorInput);
      customRow.appendChild(applyBtn);
      row.appendChild(customRow);
    }

    container.appendChild(row);
  }

  // ── Custom nametag color picker (admin only) ──
  function buildCustomNtColor() {
    var existing = document.getElementById('customNtColorRow');
    if (existing) existing.remove();
    if (!_hasExclusive()) return;

    var equipped = window.ArcadeCoins.getEquipped();
    var currentColor = equipped.nametagColor || '';
    var isCustom = currentColor.charAt(0) === '#';

    var wrap = document.createElement('div');
    wrap.id = 'customNtColorRow';
    Object.assign(wrap.style, {
      display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 12px',
      background: '#1a1a2e', borderRadius: '10px', margin: '8px 0'
    });

    var label = document.createElement('span');
    label.textContent = 'Custom Color \u2605';
    Object.assign(label.style, { fontSize: '0.85rem', fontWeight: '600', color: '#ccc' });
    wrap.appendChild(label);

    var colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = isCustom ? currentColor : '#ff4444';
    Object.assign(colorInput.style, {
      width: '44px', height: '32px', border: '2px solid #3a3a5a', borderRadius: '6px',
      cursor: 'pointer', padding: '2px', background: 'transparent'
    });
    wrap.appendChild(colorInput);

    var applyBtn = document.createElement('button');
    applyBtn.textContent = isCustom ? 'Equipped' : 'Apply';
    applyBtn.className = 'btn-equip';
    Object.assign(applyBtn.style, {
      padding: '5px 14px', fontSize: '0.8rem', borderRadius: '6px'
    });
    if (isCustom) {
      applyBtn.style.background = '#3a3a5a';
    }
    wrap.appendChild(applyBtn);

    if (isCustom) {
      var removeBtn = document.createElement('button');
      removeBtn.className = 'btn-remove';
      removeBtn.textContent = 'Remove';
      removeBtn.onclick = function() {
        sfxClick();
        window.ArcadeCoins.equipItem('nametagColor', '');
        renderNametags();
      };
      wrap.appendChild(removeBtn);
    }

    // Live preview
    colorInput.addEventListener('input', function() {
      var el = document.getElementById('ntPreviewName');
      if (el) {
        el.style.cssText = 'font-size:2rem;font-weight:700;min-height:2.5rem;';
        el.style.color = colorInput.value;
        // Re-apply font if equipped
        var eq = window.ArcadeCoins.getEquipped();
        if (eq.nametagFont && NAMETAGS[eq.nametagFont]) {
          applyNtCSS(el, NAMETAGS[eq.nametagFont].css);
        }
      }
    });

    applyBtn.onclick = function() {
      sfxClick();
      window.ArcadeCoins.equipItem('nametagColor', colorInput.value);
      renderNametags();
    };

    // Insert after the ntColorGrid
    var grid = document.getElementById('ntColorGrid');
    grid.parentNode.insertBefore(wrap, grid.nextSibling);
  }

            window.ArcadeCoins.equipItem(ec, nid);
            renderNametags();
          };
        })(equipCategory, nt.id);
        actions.appendChild(equipBtn);
      } else {
        var priceLabel = document.createElement('span');
        priceLabel.className = 'item-price';
        priceLabel.innerHTML = '&#x1FA99; ' + nt.price;
        actions.appendChild(priceLabel);

        var canAfford = window.ArcadeCoins.getBalance() >= nt.price;
        var buyBtn = document.createElement('button');
        buyBtn.className = 'btn-buy' + (canAfford ? '' : ' disabled');
        buyBtn.textContent = 'Buy';
        if (canAfford) {
          (function(ec, nid, nprice) {
            buyBtn.onclick = function() {
              var result = window.ArcadeCoins.buyItem(nid, nprice);
              if (result.ok) {
                sfxCoin();
                window.ArcadeCoins.equipItem(ec, nid);
                updateBalance();
                renderNametags();
              }
            };
          })(equipCategory, nt.id, nt.price);
        }
        actions.appendChild(buyBtn);
      }

      card.appendChild(actions);
      container.appendChild(card);
    });
  }

  function updateNtPreview() {
    var el = document.getElementById('ntPreviewName');
    var userName = getUser();
    el.textContent = userName;
    // Reset styles
    el.style.cssText = 'font-size:2rem;font-weight:700;min-height:2.5rem;';
    var equipped = window.ArcadeCoins.getEquipped();
    window.ArcadeAvatar.styleName(el, equipped);
    window.ArcadeAvatar.styleNameEffect(el, equipped);
  }

  function applyNtCSS(element, cssString) {
    var declarations = cssString.split(';');
    declarations.forEach(function(decl) {
      decl = decl.trim();
      if (!decl) return;
      var colonIndex = decl.indexOf(':');
      if (colonIndex === -1) return;
      var prop = decl.substring(0, colonIndex).trim();
      var val = decl.substring(colonIndex + 1).trim();
      var camelProp = prop.replace(/-([a-z])/g, function(m, c) { return c.toUpperCase(); });
      element.style[camelProp] = val;
    });
  }

  // ── Cursor rendering ──
  function getCursorPreviewSVG(entry) {
    if (entry.svg === 'rainbow') {
      return '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="34"><defs><linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff0000"/><stop offset="17%" stop-color="#ff8800"/><stop offset="33%" stop-color="#ffff00"/><stop offset="50%" stop-color="#00ff00"/><stop offset="67%" stop-color="#0088ff"/><stop offset="83%" stop-color="#8800ff"/><stop offset="100%" stop-color="#ff0088"/></linearGradient></defs><path d="M4 1L4 17L8 13L12 21L15 19.5L11 12L16 12Z" fill="url(#rbg)" stroke="#fff" stroke-width="1.2"/></svg>';
    }
    return entry.svg;
  }

  function renderCursors() {
    var container = document.getElementById('cursorGrid');
    container.innerHTML = '';
    var equipped = window.ArcadeCoins.getEquipped();

    // Current cursor preview
    var previewEl = document.getElementById('cursorPreview');
    if (equipped.cursor === 'cur_custom' || equipped.cursor === 'custom') {
      var customSvg = localStorage.getItem('arcade_custom_cursor');
      previewEl.innerHTML = customSvg || '<span style="font-size:1.2rem;color:var(--t-dim,#666)">Custom</span>';
    } else if (equipped.cursor && CURSORS[equipped.cursor]) {
      previewEl.innerHTML = getCursorPreviewSVG(CURSORS[equipped.cursor]);
    } else {
      previewEl.innerHTML = '<span style="font-size:2rem;color:var(--t-dim,#666)">Default</span>';
    }

    // "None" card
    var noneCard = document.createElement('div');
    noneCard.className = 'cursor-card' + (!equipped.cursor ? ' equipped-card' : '');
    noneCard.innerHTML = '<div class="cursor-card-preview"><span style="font-size:1.5rem;color:#555;">&#8709;</span></div>' +
      '<div class="nt-card-style-name">Default</div>';
    var noneActions = document.createElement('div');
    noneActions.className = 'nt-card-actions';
    if (!equipped.cursor) {
      noneActions.innerHTML = '<span class="equipped-label">Current</span>';
    } else {
      var removeBtn = document.createElement('button');
      removeBtn.className = 'btn-remove';
      removeBtn.textContent = 'Remove';
      removeBtn.onclick = function() {
        sfxClick();
        window.ArcadeCoins.equipItem('cursor', '');
        renderCursors();
      };
      noneActions.appendChild(removeBtn);
    }
    noneCard.appendChild(noneActions);
    container.appendChild(noneCard);

    // Cursor cards
    cursorItems.forEach(function(cur) {
      var card = document.createElement('div');
      card.className = 'cursor-card' + (equipped.cursor === cur.id ? ' equipped-card' : '');

      var preview = document.createElement('div');
      preview.className = 'cursor-card-preview';
      preview.innerHTML = getCursorPreviewSVG(cur);
      card.appendChild(preview);

      var sn = document.createElement('div');
      sn.className = 'nt-card-style-name';
      sn.textContent = cur.name;
      card.appendChild(sn);

      var actions = document.createElement('div');
      actions.className = 'nt-card-actions';
      var owned = window.ArcadeCoins.ownsItem(cur.id);
      var isEquipped = equipped.cursor === cur.id;

      if (isEquipped) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;align-items:center;gap:0.4rem';
        var eqLabel = document.createElement('span');
        eqLabel.className = 'equipped-label';
        eqLabel.innerHTML = 'Equipped &#10003;';
        row.appendChild(eqLabel);
        var rb = document.createElement('button');
        rb.className = 'btn-remove';
        rb.textContent = 'Remove';
        rb.onclick = function() {
          sfxClick();
          window.ArcadeCoins.equipItem('cursor', '');
          renderCursors();
        };
        row.appendChild(rb);
        actions.appendChild(row);
      } else if (owned) {
        var equipBtn = document.createElement('button');
        equipBtn.className = 'btn-equip';
        equipBtn.textContent = 'Equip';
        (function(cid) {
          equipBtn.onclick = function() {
            sfxClick();
            window.ArcadeCoins.equipItem('cursor', cid);
            renderCursors();
          };
        })(cur.id);
        actions.appendChild(equipBtn);
      } else {
        var priceLabel = document.createElement('span');
        priceLabel.className = 'item-price';
        priceLabel.innerHTML = '&#x1FA99; ' + cur.price;
        actions.appendChild(priceLabel);
        var canAfford = window.ArcadeCoins.getBalance() >= cur.price;
        var buyBtn = document.createElement('button');
        buyBtn.className = 'btn-buy' + (canAfford ? '' : ' disabled');
        buyBtn.textContent = 'Buy';
        if (canAfford) {
          (function(cid, cprice) {
            buyBtn.onclick = function() {
              var result = window.ArcadeCoins.buyItem(cid, cprice);
              if (result.ok) {
                sfxCoin();
                window.ArcadeCoins.equipItem('cursor', cid);
                updateBalance();
                renderCursors();
              }
            };
          })(cur.id, cur.price);
        }
        actions.appendChild(buyBtn);
      }
      card.appendChild(actions);
      container.appendChild(card);
    });

    // Admin custom cursor drawer
    buildCursorDrawer();
  }

  // ── Custom cursor drawer (admin only) ──
  var _drawCanvas = null, _drawCtx = null, _drawGrid = 16, _drawScale = 12;
  var _drawColor = '#ff4400';
  var _drawPixels = [];
  var _drawErasing = false;

  function buildCursorDrawer() {
    var wrap = document.getElementById('cursorDrawerWrap');
    wrap.innerHTML = '';

    var ownsCustom = window.ArcadeCoins.ownsItem('cur_custom');

    // Show buy prompt if not owned
    if (!ownsCustom) {
      var buyWrap = document.createElement('div');
      buyWrap.className = 'cursor-drawer';
      buyWrap.style.textAlign = 'center';
      buyWrap.innerHTML = '<div class="cursor-drawer-title">Custom Cursor Designer</div>' +
        '<p style="color:var(--t-dim,#888);font-size:0.85rem;margin-bottom:0.8rem;">Draw your own pixel cursor!</p>';
      var canAfford = window.ArcadeCoins.getBalance() >= 1000;
      var priceLabel = document.createElement('span');
      priceLabel.className = 'item-price';
      priceLabel.innerHTML = '&#x1FA99; 1000';
      priceLabel.style.marginRight = '8px';
      buyWrap.appendChild(priceLabel);
      var buyBtn = document.createElement('button');
      buyBtn.className = 'btn-buy' + (canAfford ? '' : ' disabled');
      buyBtn.textContent = 'Unlock';
      if (canAfford) {
        buyBtn.onclick = function() {
          var result = window.ArcadeCoins.buyItem('cur_custom', 1000);
          if (result.ok) {
            sfxCoin();
            updateBalance();
            renderCursors();
          }
        };
      }
      buyWrap.appendChild(buyBtn);
      wrap.appendChild(buyWrap);
      return;
    }

    var drawer = document.createElement('div');
    drawer.className = 'cursor-drawer';

    var title = document.createElement('div');
    title.className = 'cursor-drawer-title';
    title.textContent = 'Custom Cursor Designer';
    drawer.appendChild(title);

    var canvasWrap = document.createElement('div');
    canvasWrap.className = 'cursor-canvas-wrap';

    // Canvas area
    var canvasArea = document.createElement('div');
    canvasArea.className = 'cursor-canvas-area';

    _drawCanvas = document.createElement('canvas');
    _drawCanvas.id = 'cursorCanvas';
    _drawCanvas.width = _drawGrid * _drawScale;
    _drawCanvas.height = _drawGrid * _drawScale;
    _drawCtx = _drawCanvas.getContext('2d');
    canvasArea.appendChild(_drawCanvas);

    // Canvas label
    var canvasLabel = document.createElement('div');
    canvasLabel.style.cssText = 'font-size:0.7rem;color:var(--t-dim,#666);';
    canvasLabel.textContent = _drawGrid + 'x' + _drawGrid + ' pixel canvas';
    canvasArea.appendChild(canvasLabel);

    canvasWrap.appendChild(canvasArea);

    // Tools panel
    var tools = document.createElement('div');
    tools.className = 'cursor-tools';

    // Color picker
    var colorRow = document.createElement('div');
    colorRow.className = 'cursor-tool-row';
    var colorLabel = document.createElement('label');
    colorLabel.textContent = 'Color:';
    var colorInput = document.createElement('input');
    colorInput.type = 'color';
    colorInput.value = _drawColor;
    colorInput.style.cssText = 'width:40px;height:30px;border:1px solid #3a3a5a;border-radius:4px;cursor:pointer;padding:1px;background:transparent';
    colorInput.addEventListener('input', function() { _drawColor = colorInput.value; _drawErasing = false; });
    colorRow.appendChild(colorLabel);
    colorRow.appendChild(colorInput);
    tools.appendChild(colorRow);

    // Quick color palette
    var paletteRow = document.createElement('div');
    paletteRow.className = 'cursor-tool-row';
    paletteRow.style.flexWrap = 'wrap';
    var quickColors = ['#ff0000','#ff8800','#ffff00','#00ff00','#00aaff','#7b2ff7','#ff00ff','#ffffff','#888888','#000000','#ffd700','#00ffcc'];
    quickColors.forEach(function(c) {
      var swatch = document.createElement('div');
      swatch.style.cssText = 'width:20px;height:20px;border-radius:3px;cursor:pointer;border:1px solid #555;';
      swatch.style.background = c;
      swatch.onclick = function() {
        _drawColor = c;
        colorInput.value = c;
        _drawErasing = false;
      };
      paletteRow.appendChild(swatch);
    });
    tools.appendChild(paletteRow);

    // Eraser toggle
    var eraserBtn = document.createElement('button');
    eraserBtn.className = 'btn-remove';
    eraserBtn.textContent = 'Eraser';
    eraserBtn.style.fontSize = '0.75rem';
    eraserBtn.onclick = function() { _drawErasing = !_drawErasing; eraserBtn.style.borderColor = _drawErasing ? '#ff4444' : '#555'; };
    tools.appendChild(eraserBtn);

    // Clear button
    var clearBtn = document.createElement('button');
    clearBtn.className = 'btn-remove';
    clearBtn.textContent = 'Clear';
    clearBtn.style.fontSize = '0.75rem';
    clearBtn.onclick = function() {
      _drawPixels = [];
      for (var i = 0; i < _drawGrid * _drawGrid; i++) _drawPixels.push(null);
      _redrawCanvas();
    };
    tools.appendChild(clearBtn);

    // Apply as cursor button
    var applyBtn = document.createElement('button');
    applyBtn.className = 'btn-equip';
    applyBtn.textContent = 'Use as Cursor';
    applyBtn.style.fontSize = '0.8rem';
    applyBtn.onclick = function() {
      var svg = _pixelsToSVG();
      if (!svg) return;
      // Store custom cursor SVG as a special equipped value
      window.ArcadeCoins.equipItem('cursor', 'cur_custom');
      localStorage.setItem('arcade_custom_cursor', svg);
      sfxClick();
      renderCursors();
    };
    tools.appendChild(applyBtn);

    // Live preview
    var previewLabel = document.createElement('label');
    previewLabel.textContent = 'Preview:';
    tools.appendChild(previewLabel);
    var previewDiv = document.createElement('div');
    previewDiv.id = 'cursorDrawPreview';
    previewDiv.style.cssText = 'width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--t-bg1,#0f0f1a);border-radius:8px;border:1px solid var(--t-border,#2a2a4a);';
    tools.appendChild(previewDiv);

    canvasWrap.appendChild(tools);
    drawer.appendChild(canvasWrap);
    wrap.appendChild(drawer);

    // Init pixel grid
    if (_drawPixels.length !== _drawGrid * _drawGrid) {
      _drawPixels = [];
      for (var i = 0; i < _drawGrid * _drawGrid; i++) _drawPixels.push(null);
    }

    // Load existing custom cursor if any
    var saved = localStorage.getItem('arcade_custom_cursor');
    if (saved) _loadSVGToPixels(saved);

    _redrawCanvas();

    // Mouse events
    var _drawing = false;
    _drawCanvas.addEventListener('mousedown', function(e) { _drawing = true; _drawPixel(e); });
    _drawCanvas.addEventListener('mousemove', function(e) { if (_drawing) _drawPixel(e); });
    _drawCanvas.addEventListener('mouseup', function() { _drawing = false; _updateDrawPreview(); });
    _drawCanvas.addEventListener('mouseleave', function() { _drawing = false; });
    // Touch events
    _drawCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); _drawing = true; _drawPixelTouch(e); });
    _drawCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); if (_drawing) _drawPixelTouch(e); });
    _drawCanvas.addEventListener('touchend', function() { _drawing = false; _updateDrawPreview(); });
  }

  function _drawPixel(e) {
    var rect = _drawCanvas.getBoundingClientRect();
    var x = Math.floor((e.clientX - rect.left) / _drawScale);
    var y = Math.floor((e.clientY - rect.top) / _drawScale);
    if (x < 0 || x >= _drawGrid || y < 0 || y >= _drawGrid) return;
    var idx = y * _drawGrid + x;
    _drawPixels[idx] = _drawErasing ? null : _drawColor;
    _redrawCanvas();
  }

  function _drawPixelTouch(e) {
    var touch = e.touches[0];
    var rect = _drawCanvas.getBoundingClientRect();
    var x = Math.floor((touch.clientX - rect.left) / _drawScale);
    var y = Math.floor((touch.clientY - rect.top) / _drawScale);
    if (x < 0 || x >= _drawGrid || y < 0 || y >= _drawGrid) return;
    var idx = y * _drawGrid + x;
    _drawPixels[idx] = _drawErasing ? null : _drawColor;
    _redrawCanvas();
  }

  function _redrawCanvas() {
    if (!_drawCtx) return;
    _drawCtx.clearRect(0, 0, _drawCanvas.width, _drawCanvas.height);
    // Grid background
    _drawCtx.fillStyle = '#1a1a2e';
    _drawCtx.fillRect(0, 0, _drawCanvas.width, _drawCanvas.height);
    // Grid lines
    _drawCtx.strokeStyle = '#2a2a4a';
    _drawCtx.lineWidth = 0.5;
    for (var i = 0; i <= _drawGrid; i++) {
      _drawCtx.beginPath();
      _drawCtx.moveTo(i * _drawScale, 0);
      _drawCtx.lineTo(i * _drawScale, _drawCanvas.height);
      _drawCtx.stroke();
      _drawCtx.beginPath();
      _drawCtx.moveTo(0, i * _drawScale);
      _drawCtx.lineTo(_drawCanvas.width, i * _drawScale);
      _drawCtx.stroke();
    }
    // Pixels
    for (var i = 0; i < _drawPixels.length; i++) {
      if (!_drawPixels[i]) continue;
      var px = (i % _drawGrid) * _drawScale;
      var py = Math.floor(i / _drawGrid) * _drawScale;
      _drawCtx.fillStyle = _drawPixels[i];
      _drawCtx.fillRect(px, py, _drawScale, _drawScale);
    }
  }

  function _pixelsToSVG() {
    var hasPixels = false;
    for (var i = 0; i < _drawPixels.length; i++) {
      if (_drawPixels[i]) { hasPixels = true; break; }
    }
    if (!hasPixels) return null;
    var rects = '';
    for (var i = 0; i < _drawPixels.length; i++) {
      if (!_drawPixels[i]) continue;
      var x = i % _drawGrid;
      var y = Math.floor(i / _drawGrid);
      rects += '<rect x="' + (x * 1.5) + '" y="' + (y * 1.75) + '" width="1.5" height="1.75" fill="' + _drawPixels[i] + '"/>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="28">' + rects + '</svg>';
  }

  function _loadSVGToPixels(svg) {
    // Parse the SVG rects back to pixels
    _drawPixels = [];
    for (var i = 0; i < _drawGrid * _drawGrid; i++) _drawPixels.push(null);
    var parser = new DOMParser();
    var doc = parser.parseFromString(svg, 'image/svg+xml');
    var rects = doc.querySelectorAll('rect');
    rects.forEach(function(r) {
      var rx = parseFloat(r.getAttribute('x'));
      var ry = parseFloat(r.getAttribute('y'));
      var fill = r.getAttribute('fill');
      var x = Math.round(rx / 1.5);
      var y = Math.round(ry / 1.75);
      if (x >= 0 && x < _drawGrid && y >= 0 && y < _drawGrid) {
        _drawPixels[y * _drawGrid + x] = fill;
      }
    });
  }

  function _updateDrawPreview() {
    var el = document.getElementById('cursorDrawPreview');
    if (!el) return;
    var svg = _pixelsToSVG();
    if (svg) {
      el.innerHTML = svg;
    } else {
      el.innerHTML = '<span style="font-size:0.7rem;color:#666;">Empty</span>';
    }
  }

  // ── Init ──
  function init() {
    if (isGuest()) {
      document.getElementById('guestMsg').style.display = '';
      document.getElementById('shopContainer').style.display = 'none';
      document.getElementById('coinBalance').innerHTML = '&#x1FA99; 0 coins';
      return;
    }

    // Wait for ArcadeCoins to load
    function tryInit() {
      if (!window.ArcadeCoins || !window.ArcadeCoins.isLoaded()) {
        setTimeout(tryInit, 100);
        return;
      }
      document.getElementById('guestMsg').style.display = 'none';
      document.getElementById('shopContainer').style.display = '';
      addOwnedExclusives();
      updateBalance();
      syncIndicesToEquipped();
      buildSkinColorRow();
      buildCategoryRows();
      renderAvatarPreview();
      if (currentTab === 'nametags') renderNametags();
    }
    tryInit();
  }

  // Listen for coin updates
  window.addEventListener('coins-updated', function() {
    addOwnedExclusives();
    updateBalance();
    if (currentTab === 'avatar') {
      updateAllCategoryInfo();
      buildSkinColorRow();
    } else if (currentTab === 'cursors') {
      renderCursors();
    } else {
      renderNametags();
    }
  });

  // Listen for auth changes
  window.addEventListener('arcade-auth-change', function() {
    setTimeout(function() { init(); }, 300);
  });

  // Start
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
