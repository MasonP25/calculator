<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entertainment</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { margin: 0; background: #0a0a0f; color: #e0e4f0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .movies-container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .movies-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .movies-header h1 { font-size: 1.6rem; margin: 0; }
    .back-btn { text-decoration: none; color: #aaa; font-size: 1.4rem; padding: 4px 8px; border-radius: 8px; transition: background .15s; }
    .back-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

    /* Browse grid */
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .movie-thumb { position: relative; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .2s; }
    .movie-thumb:hover { transform: translateY(-3px); border-color: rgba(139,122,255,.4); }
    .movie-poster-emoji { width: 100%; aspect-ratio: 2/3; display: flex; align-items: center; justify-content: center; font-size: 4rem; background: linear-gradient(135deg, #1a1a2e 0%, #12121f 100%); }
    .movie-poster-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
    .movie-info { padding: 10px 12px; }
    .movie-info h3 { margin: 0 0 4px; font-size: 0.9rem; font-weight: 600; }
    .movie-info p { margin: 0; font-size: 0.72rem; color: #888; }
    .movie-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translate(0, -20px); width: 48px; height: 48px; background: rgba(0,0,0,.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
    .movie-thumb:hover .movie-play-icon { opacity: 1; }
    .movie-play-icon::after { content: ''; border-style: solid; border-width: 8px 0 8px 14px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
    .collection-badge { position: absolute; top: 8px; right: 8px; background: rgba(139,122,255,.7); color: #fff; font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; }

    /* Player view */
    #player-view { display: none; }
    #player-view.active { display: block; }
    #browse-view.hidden { display: none; }
    #collection-view { display: none; }
    #collection-view.active { display: block; }
    .player-back { display: inline-flex; align-items: center; gap: 6px; color: #aaa; font-size: 0.85rem; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: none; background: none; font-family: inherit; transition: background .15s; margin-bottom: 16px; }
    .player-back:hover { background: rgba(255,255,255,.08); color: #fff; }
    .player-title { font-size: 1.3rem; font-weight: 600; margin: 0 0 16px; }
    .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
    .player-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }

    /* Comic viewer */
    #comic-view { display: none; }
    #comic-view.active { display: block; }
    .comic-img { width: 100%; max-width: 700px; margin: 0 auto; display: block; border-radius: 8px; background: #111; min-height: 300px; }
    .comic-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
    .comic-nav button { padding: 8px 20px; border-radius: 10px; border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); color: #e0e4f0; font-size: 0.9rem; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
    .comic-nav button:hover { border-color: rgba(139,122,255,.5); background: rgba(139,122,255,.1); }
    .comic-nav button:disabled { opacity: .3; cursor: default; }
    .comic-page-num { color: #888; font-size: 0.85rem; min-width: 80px; text-align: center; }
    .comic-page-picker { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; padding: 12px 0 8px; margin-top: 8px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.15) transparent; }
    .comic-page-picker::-webkit-scrollbar { height: 6px; }
    .comic-page-picker::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 3px; }
    .comic-page-btn { min-width: 36px; height: 32px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); color: #aaa; font-size: 0.75rem; font-weight: 600; border-radius: 6px; cursor: pointer; flex-shrink: 0; font-family: inherit; transition: all .15s; }
    .comic-page-btn:hover { border-color: rgba(139,122,255,.4); color: #fff; }
    .comic-page-btn.active { background: rgba(139,122,255,.2); border-color: rgba(139,122,255,.6); color: #fff; }
    .resume-badge { display: inline-block; background: rgba(139,122,255,.15); color: rgba(139,122,255,.8); font-size: 0.6rem; font-weight: 600; padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
  </style>
</head>

  <div id="ent-gate" style="position:fixed;inset:0;background:rgba(10,10,15,0.993);backdrop-filter:blur(8px);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;transition:opacity 0.2s ease;">
    <a href="index.html" style="position:fixed;top:12px;left:16px;color:rgba(255,255,255,.15);text-decoration:none;font-size:0.85rem;">&#8592; Back</a>
    <p style="color:rgba(255,255,255,.15);font-size:0.8rem;">Enter code to continue</p>
    <input id="ent-gate-input" type="password" maxlength="10" placeholder="..." style="width:120px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:rgba(255,255,255,.2);font-size:1rem;text-align:center;font-family:inherit;outline:none;" autofocus>
    <button onclick="document.getElementById('ent-gate-input').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))" style="padding:6px 20px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:rgba(255,255,255,.15);font-size:0.75rem;font-family:inherit;cursor:pointer;">Enter</button>
    <p id="ent-gate-err" style="color:rgba(255,71,87,.3);font-size:0.7rem;min-height:1em;"></p>
  </div>
  <script>
  (function(){
    var KEY = "ent_access";
    var gate = document.getElementById("ent-gate");
    if (localStorage.getItem(KEY) === "1") { gate.style.display = "none"; return; }
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ gate.style.opacity = "1"; }); });
    var inp = document.getElementById("ent-gate-input");
    inp.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        if (inp.value === "123") {
          localStorage.setItem(KEY, "1");
          gate.style.opacity = "0";
          setTimeout(function(){ gate.style.display = "none"; }, 200);
        } else {
          document.getElementById("ent-gate-err").textContent = "Wrong code";
          inp.value = "";
        }
      }
    });
  })();
  </script>

    <div class="movies-header">

        <button id="ent-search-clear" onclick="document.getElementById('ent-search').value='';filterGrid();this.style.display='none';" style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:#888;font-size:1.1rem;cursor:pointer;padding:4px 8px;">&#10005;</button>
      </div>
      <div class="movies-grid" id="movies-grid"></div>
    </div>

    <div id="collection-view">
      <button class="player-back" id="collection-back">&#8592; Back to entertainment</button>
      <div class="movies-grid" id="collection-grid"></div>
    </div>

    <div id="player-view">
      <button class="player-back" id="player-back">&#8592; Back</button>
      <h2 class="player-title" id="player-title"></h2>
      <div class="player-wrapper">
        <iframe id="player-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>

    <div id="comic-view">
      <button class="player-back" id="comic-back">&#8592; Back</button>
      <h2 class="player-title" id="comic-title"></h2>
      <img class="comic-img" id="comic-img" src="" alt="Page">
      <div class="comic-nav">
        <button id="comic-prev" onclick="comicPrev()">&#8592; Prev</button>

        <button id="comic-next" onclick="comicNext()">Next &#8594;</button>
      </div>
      <div class="comic-page-picker" id="comic-page-picker"></div>
    </div>
  </div>

    function showView(view) {
      browseView.classList.toggle("hidden", view !== "browse");
      collectionView.classList.toggle("active", view === "collection");
      playerView.classList.toggle("active", view === "player");
      comicView.classList.toggle("active", view === "comic");
      if (view === "browse") {
        pageTitle.textContent = "\uD83C\uDFAC Entertainment";
        mainBack.href = "index.html";
        mainBack.onclick = null;
      }
    }

    function buildCard(item, onClick) {
      var card = document.createElement("div");
      card.className = "movie-thumb";
      var emoji = item.emoji || "\uD83C\uDFAC";
      var posterHtml = item.poster
        ? '<img class="movie-poster-img" src="' + item.poster + '" alt="' + item.title + '">'
        : '<div class="movie-poster-emoji">' + emoji + '</div>';
      card.innerHTML =
        posterHtml +
        '<div class="movie-play-icon"></div>' +
        '<div class="movie-info"><h3>' + item.title + '</h3>' +
        (item.desc ? '<p>' + item.desc + '</p>' : '') +
        '</div>' +
        (item.collection ? '<div class="collection-badge">' + item.collection.length + ' titles</div>' : '') +
        (item.comic ? '<div class="collection-badge">' + item.comic.length + ' pages</div>' : '');
      card.addEventListener("click", onClick);
      return card;
    }

    function renderGrid(filter) {
      grid.innerHTML = "";
      var q = (filter || "").toLowerCase();
      MOVIES.forEach(function(movie, i) {
        var match = !q || movie.title.toLowerCase().includes(q) || (movie.desc && movie.desc.toLowerCase().includes(q));
        if (!match && movie.collection) {
          match = movie.collection.some(function(c) { return c.title.toLowerCase().includes(q); });
        }
        if (!match) return;
        var card = buildCard(movie, function() {
          if (movie.collection) {
            openCollection(movie);
          } else if (movie.comic) {
            openComic(movie);
          } else if (movie.folder) {
            window.open(movie.folder, "_blank");
          } else if (movie.link) {
            window.open(movie.link, "_blank");
          } else {
            openPlayer(movie.title, movie.src);
          }
        });
        grid.appendChild(card);
      });
    }

    window.filterGrid = function() {
      var q = document.getElementById("ent-search").value;
      document.getElementById("ent-search-clear").style.display = q ? "" : "none";
      renderGrid(q);
    };

    function openCollection(movie) {
      currentCollection = movie;
      showView("collection");
      pageTitle.textContent = movie.emoji + " " + movie.title;
      mainBack.href = "#";
      mainBack.onclick = function(e) { e.preventDefault(); closeCollection(); };
      collectionGrid.innerHTML = "";
      var colKey = "col_" + makeKey(movie.title);
      var lastWatched = getLastProgress(colKey + "_last");
      movie.collection.forEach(function(item, idx) {
        var card = buildCard(item, function() {
          if (item.link) {
            window.open(item.link, "_blank");
          } else if (item.src) {
            saveProgress(colKey + "_last", idx);
            openPlayer(item.title, item.src);
          }
        });
        if (lastWatched != null && parseInt(lastWatched) === idx) {
          var badge = document.createElement("div");
          badge.className = "collection-badge";
          badge.textContent = "Continue";
          badge.style.background = "rgba(255,165,2,.8)";
          card.appendChild(badge);
        }
        collectionGrid.appendChild(card);
      });
    }

    function closeCollection() {
      currentCollection = null;
      showView("browse");
    }

    function openPlayer(title, src) {
      playerTitle.textContent = title;
      playerIframe.src = src;
      showView("player");
      playerBack.textContent = currentCollection ? "\u2190 Back to " + currentCollection.title : "\u2190 Back to entertainment";
      mainBack.href = "#";
      mainBack.onclick = function(e) { e.preventDefault(); closePlayer(); };
    }

    function closePlayer() {
      playerIframe.src = "";
      if (currentCollection) {
        openCollection(currentCollection);
      } else {
        showView("browse");
      }
    }

    // ─── Progress saving (localStorage) ───
    var PROGRESS_KEY = "ent_progress";
    function getProgress() {
      try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch(e) { return {}; }
    }
    function saveProgress(key, val) {
      var p = getProgress();
      p[key] = val;
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(p));
    }
    function getLastProgress(key) {
      var v = getProgress()[key]; return v != null ? v : null;
    }
    function makeKey(title) {
      return title.toLowerCase().replace(/[^a-z0-9]/g, "_");
    }

    var currentComicTitle = "";
    var comicPicker = document.getElementById("comic-page-picker");

    function openComic(movie) {
      currentComicPages = movie.comic;
      currentComicTitle = movie.title;
      var saved = getLastProgress("comic_" + makeKey(movie.title));
      currentComicPage = saved ? Math.min(saved, movie.comic.length - 1) : 0;
      showView("comic");
      comicTitle.textContent = movie.title;
      pageTitle.textContent = movie.emoji + " " + movie.title;
      mainBack.href = "#";
      mainBack.onclick = function(e) { e.preventDefault(); closeComic(); };
      buildPagePicker();
      updateComicPage();
    }

    function closeComic() {
      showView("browse");
      comicImg.src = "";
    }

    function buildPagePicker() {
      comicPicker.innerHTML = "";
      for (var i = 0; i < currentComicPages.length; i++) {
        var btn = document.createElement("button");
        btn.className = "comic-page-btn" + (i === currentComicPage ? " active" : "");
        btn.textContent = i + 1;
        btn.dataset.page = i;
        btn.addEventListener("click", function() {
          currentComicPage = parseInt(this.dataset.page);
          updateComicPage();
        });
        comicPicker.appendChild(btn);
      }
    }

    function updateComicPage() {
      var id = currentComicPages[currentComicPage];
      comicImg.src = "https://lh3.googleusercontent.com/d/" + id;
      comicPageNum.textContent = (currentComicPage + 1) + " / " + currentComicPages.length;
      document.getElementById("comic-prev").disabled = currentComicPage === 0;
      document.getElementById("comic-next").disabled = currentComicPage === currentComicPages.length - 1;
      // Update picker active state
      var btns = comicPicker.querySelectorAll(".comic-page-btn");
      btns.forEach(function(b) { b.classList.toggle("active", parseInt(b.dataset.page) === currentComicPage); });
      // Scroll active button into view
      if (btns[currentComicPage]) btns[currentComicPage].scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
      // Save progress
      saveProgress("comic_" + makeKey(currentComicTitle), currentComicPage);
    }

    window.comicPrev = function() {
      if (currentComicPage > 0) { currentComicPage--; updateComicPage(); }
    };
    window.comicNext = function() {
      if (currentComicPage < currentComicPages.length - 1) { currentComicPage++; updateComicPage(); }
    };

    playerBack.addEventListener("click", closePlayer);
    collectionBack.addEventListener("click", closeCollection);
    comicBack.addEventListener("click", closeComic);
    renderGrid();
  </script>
