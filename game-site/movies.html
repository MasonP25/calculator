<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movies</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { margin: 0; background: #0a0a0f; color: #e0e4f0; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    .movies-container { max-width: 960px; margin: 0 auto; padding: 20px; }
    .movies-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
    .movies-header h1 { font-size: 1.6rem; margin: 0; }
    .back-btn { text-decoration: none; color: #aaa; font-size: 1.4rem; padding: 4px 8px; border-radius: 8px; transition: background .15s; }
    .back-btn:hover { background: rgba(255,255,255,.08); color: #fff; }

    /* Browse grid */
    .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .movie-thumb { position: relative; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .2s; }
    .movie-thumb:hover { transform: translateY(-3px); border-color: rgba(139,122,255,.4); }
    .movie-poster-emoji { width: 100%; aspect-ratio: 2/3; display: flex; align-items: center; justify-content: center; font-size: 4rem; background: linear-gradient(135deg, #1a1a2e 0%, #12121f 100%); }
    .movie-info { padding: 10px 12px; }
    .movie-info h3 { margin: 0 0 4px; font-size: 0.9rem; font-weight: 600; }
    .movie-info p { margin: 0; font-size: 0.72rem; color: #888; }
    .movie-play-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) translate(0, -20px); width: 48px; height: 48px; background: rgba(0,0,0,.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
    .movie-thumb:hover .movie-play-icon { opacity: 1; }
    .movie-play-icon::after { content: ''; border-style: solid; border-width: 8px 0 8px 14px; border-color: transparent transparent transparent #fff; margin-left: 3px; }
    .collection-badge { position: absolute; top: 8px; right: 8px; background: rgba(139,122,255,.7); color: #fff; font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 6px; }

    /* Player view */
    #player-view { display: none; }
    #player-view.active { display: block; }
    #browse-view.hidden { display: none; }
    #collection-view { display: none; }
    #collection-view.active { display: block; }
    .player-back { display: inline-flex; align-items: center; gap: 6px; color: #aaa; font-size: 0.85rem; cursor: pointer; padding: 6px 10px; border-radius: 8px; border: none; background: none; font-family: inherit; transition: background .15s; margin-bottom: 16px; }
    .player-back:hover { background: rgba(255,255,255,.08); color: #fff; }
    .player-title { font-size: 1.3rem; font-weight: 600; margin: 0 0 16px; }
    .player-wrapper { position: relative; width: 100%; padding-top: 56.25%; background: #000; border-radius: 12px; overflow: hidden; }
    .player-wrapper iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div class="movies-container">
    <div class="movies-header">
      <a class="back-btn" href="index.html" id="main-back">&#8592;</a>
      <h1 id="page-title">&#127916; Movies</h1>
    </div>

    <div id="browse-view">
      <div class="movies-grid" id="movies-grid"></div>
    </div>

    <div id="collection-view">
      <div class="movies-grid" id="collection-grid"></div>
    </div>

    <div id="player-view">
      <button class="player-back" id="player-back">&#8592; Back</button>
      <h2 class="player-title" id="player-title"></h2>
      <div class="player-wrapper">
        <iframe id="player-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    var MOVIES = [

          { title: "Cars 2", desc: "Mater gets caught up in international espionage", src: "https://drive.google.com/file/d/1V_NqIAHOgKjhklWQO7XzC8ideK4LOe6n/preview" },
          { title: "Cars 3", desc: "Lightning McQueen faces a new generation of racers", src: "https://drive.google.com/file/d/1pv9o7dvaM04DYqWrAOCz_0DfQztn9At8/preview" }
        ]

      },
      {

        src: "https://drive.google.com/file/d/1MAaR6vGifjMCr7A5afVP7hW2B3rndLhv/preview"
      },
      {
        title: "Spongebob",
        desc: "25 episodes",
        emoji: "\uD83E\uDDBD",
        collection: [
          { title: "Spongebob Episode 1", src: "https://drive.google.com/file/d/10vaFFYPT4dGp7832P-9HQ8etgSuZr3Y7/preview" },
          { title: "Spongebob Episode 2", src: "https://drive.google.com/file/d/1Csq8IYrgWCrPNgXT12UxTYRfsDhifaMg/preview" },
          { title: "Spongebob Episode 3", src: "https://drive.google.com/file/d/1jK1ssDdpiIt1cex6zR93AcIIXKU9a8aA/preview" },
          { title: "Spongebob Episode 4", src: "https://drive.google.com/file/d/1O1r6wVAm6ubD-zIoqXH9k5dPBR-W7dnD/preview" },
          { title: "Spongebob Episode 5", src: "https://drive.google.com/file/d/1tzDFQ5oo2bReLjeqLe7v2TmxUB4-64fq/preview" },
          { title: "Spongebob Episode 6", src: "https://drive.google.com/file/d/1piMF8gZDeXDfpARa6Jv7aI5lKaPa6R3o/preview" },
          { title: "Spongebob Episode 7", src: "https://drive.google.com/file/d/1eIhLQci-5-_ssMiJ0EiNnSDV5pxT9xAu/preview" },
          { title: "Spongebob Episode 8", src: "https://drive.google.com/file/d/1psvM7z3W6J66lbk_OIYgmKaJqbvftW5U/preview" },
          { title: "Spongebob Episode 9", src: "https://drive.google.com/file/d/1SlpAq-LcIvBVjPbPNrSn--vrdiB-HECt/preview" },
          { title: "Spongebob Episode 10", src: "https://drive.google.com/file/d/1UlLaaZmnMSMqAu4kevgkXnA1j5jILmXA/preview" },
          { title: "Spongebob Episode 11", src: "https://drive.google.com/file/d/142U_-EyGaLL5GkZGrY4TU4MSyVeY9-xA/preview" },

          { title: "Spongebob Episode 13", src: "https://drive.google.com/file/d/1q3hdXnu-_m5_-vYLIe2BgXHBFnTag13Q/preview" },
          { title: "Spongebob Episode 14", src: "https://drive.google.com/file/d/1yz0yRkAuxcadBXnk2egwapjO9iLukJm1/preview" },
          { title: "Spongebob Episode 15", src: "https://drive.google.com/file/d/1nv_tF49B_7cjc-IJSUeVrRxeTZBVrb-Y/preview" },
          { title: "Spongebob Episode 16", src: "https://drive.google.com/file/d/1IKagiPiesULKN4uJfCPZihw2bzlA9BZG/preview" },
          { title: "Spongebob Episode 17", src: "https://drive.google.com/file/d/13AdBSmzzS7Et-5Id2g1O0yDeMRTwKJ1g/preview" },
          { title: "Spongebob Episode 18", src: "https://drive.google.com/file/d/1mAVxNekP5ZDSPI6KP8HgV77udMtoscuX/preview" },
          { title: "Spongebob Episode 19", src: "https://drive.google.com/file/d/1ib5Nle_Rq9D3ZLqEvriXuCW85x20Y-07/preview" },
          { title: "Spongebob Episode 20", src: "https://drive.google.com/file/d/1_3QE-0Qs93r_4vDdgKWC-9gG7FZ-EB7J/preview" },
          { title: "Spongebob Episode 21", src: "https://drive.google.com/file/d/1H8oNGVk5zdma7Gv5DpY7e7bfX9eKBY6n/preview" },
          { title: "Spongebob Episode 22", src: "https://drive.google.com/file/d/1XsvcKYxfJ7vo29Na1qegy1yFAWoTpybD/preview" },
          { title: "Spongebob Episode 23", src: "https://drive.google.com/file/d/1wC3_a4aJ4nrAyH0PZk0jLbmKBIiICpOg/preview" },
          { title: "Spongebob Episode 24", src: "https://drive.google.com/file/d/16OeUkOuVysZREGDQS62KI6fwW3568c-D/preview" },
          { title: "Spongebob Episode 25", src: "https://drive.google.com/file/d/1cvsoiKcmy1hPyiKbmb0uXRgOS12ncrVX/preview" }
        ]
      },
      {
        title: "Dragon Ball",
        desc: "Series, movies & sagas",
        emoji: "\uD83D\uDC09",
        src: "https://drive.google.com/file/d/1CA0psyd_gHWcWUW8LyHKOc5Uspu3igHQ/preview"
      },
    ];

    var currentCollection = null;
    var grid = document.getElementById("movies-grid");
    var browseView = document.getElementById("browse-view");
    var collectionView = document.getElementById("collection-view");
    var collectionGrid = document.getElementById("collection-grid");
    var playerView = document.getElementById("player-view");
    var playerTitle = document.getElementById("player-title");
    var playerIframe = document.getElementById("player-iframe");
    var playerBack = document.getElementById("player-back");
    var mainBack = document.getElementById("main-back");
    var pageTitle = document.getElementById("page-title");

    function buildCard(item, onClick) {
      var card = document.createElement("div");
      card.className = "movie-thumb";
      var emoji = item.emoji || "\uD83C\uDFAC";
      card.innerHTML =
        '<div class="movie-poster-emoji">' + emoji + '</div>' +
        '<div class="movie-play-icon"></div>' +
        '<div class="movie-info"><h3>' + item.title + '</h3>' +
        (item.desc ? '<p>' + item.desc + '</p>' : '') +
        '</div>' +
        (item.collection ? '<div class="collection-badge">' + item.collection.length + ' titles</div>' : '');
      card.addEventListener("click", onClick);
      return card;
    }

    function renderGrid() {
      grid.innerHTML = "";
      MOVIES.forEach(function(movie, i) {
        var card = buildCard(movie, function() {
          if (movie.collection) {
            openCollection(movie);
          } else if (movie.folder) {
            window.open(movie.folder, "_blank");
          } else if (movie.link) {
            window.open(movie.link, "_blank");
          } else {
            openPlayer(movie.title, movie.src);
          }
        });
        grid.appendChild(card);
      });
    }

    function openCollection(movie) {
      currentCollection = movie;
      browseView.classList.add("hidden");
      collectionView.classList.add("active");
      pageTitle.textContent = movie.emoji + " " + movie.title;
      mainBack.href = "#";
      mainBack.onclick = function(e) { e.preventDefault(); closeCollection(); };
      collectionGrid.innerHTML = "";
      movie.collection.forEach(function(item) {
        var card = buildCard(item, function() {
          if (item.link) {
            window.open(item.link, "_blank");
          } else if (item.src) {
            openPlayer(item.title, item.src);
          }
        });
        collectionGrid.appendChild(card);
      });
    }

    function closeCollection() {
      currentCollection = null;
      collectionView.classList.remove("active");
      browseView.classList.remove("hidden");
      pageTitle.textContent = "\uD83C\uDFAC Movies";
      mainBack.href = "index.html";
      mainBack.onclick = null;
    }

    function openPlayer(title, src) {
      playerTitle.textContent = title;
      playerIframe.src = src;
      browseView.classList.add("hidden");
      collectionView.classList.remove("active");
      playerView.classList.add("active");
      playerBack.textContent = currentCollection ? "\u2190 Back to " + currentCollection.title : "\u2190 Back to movies";
    }

    function closePlayer() {
      playerIframe.src = "";
      playerView.classList.remove("active");
      if (currentCollection) {
        openCollection(currentCollection);
      } else {
        browseView.classList.remove("hidden");
      }
    }

    playerBack.addEventListener("click", closePlayer);
    renderGrid();
  </script>

  <script src="sound.js?v=2"></script>
  <script src="fame.js?v=4"></script>
  <script type="module" src="firebase-lb.js?v=4"></script>
  <script src="coins.js"></script>
  <script src="avatar.js"></script>
  <script src="admin.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js?v=4"></script>
</body>
</html>
