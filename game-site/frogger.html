<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f1a;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 20px 20px}
  h1{font-size:2.2rem;margin-bottom:1rem;background:linear-gradient(90deg,#2ecc71,#f1c40f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  canvas{border:2px solid #2a2a4a;border-radius:12px;display:block;max-width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
  a.back{position:fixed;top:14px;left:14px;z-index:10001;color:#aaa;text-decoration:none;font-size:15px;background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 14px;border-radius:8px;transition:background .2s,color .2s}
  a.back:hover{background:#2a2a4a;color:#fff}
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Frogger</h1>
<canvas id="c" width="560" height="624"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const COLS=14,ROWS=13,TILE=canvas.width/COLS;
const TROW=canvas.height/ROWS;
let frog,lives,score,bestScore=0,level,state='menu';
let cars=[],logs=[],turtles=[];

function initLevel(){
  frog={x:6,y:12,targetX:6,targetY:12,animT:0};
  cars=[];logs=[];turtles=[];
  const sp=0.5+level*0.15;
  // Road lanes (rows 7-11)
  cars.push({row:11,items:makeVehicles(3,2,sp*1,1)});
  cars.push({row:10,items:makeVehicles(3,2.5,sp*1.2,-1)});
  cars.push({row:9,items:makeVehicles(4,2,sp*0.9,1)});
  cars.push({row:8,items:makeVehicles(3,3,sp*1.3,-1)});
  cars.push({row:7,items:makeVehicles(2,3.5,sp*1.5,1)});
  // Water lanes (rows 1-5)
  logs.push({row:5,items:makeLogs(3,3,sp*0.7,1)});
  logs.push({row:4,items:makeLogs(2,4,sp*0.9,-1)});
  logs.push({row:3,items:makeLogs(3,3,sp*0.6,1)});
  logs.push({row:2,items:makeLogs(2,4,sp*1.0,-1)});
  logs.push({row:1,items:makeLogs(3,3,sp*0.8,1)});
}

function makeVehicles(count,len,speed,dir){
  let arr=[];
  for(let i=0;i<count;i++){
    arr.push({x:(i*(COLS/count))*TILE,len:len*TILE,speed:speed*dir,color:['#e74c3c','#e67e22','#9b59b6','#3498db','#1abc9c'][Math.floor(Math.random()*5)]});
  }
  return arr;
}

function makeLogs(count,len,speed,dir){
  let arr=[];
  for(let i=0;i<count;i++){
    arr.push({x:(i*(COLS/count))*TILE,len:len*TILE,speed:speed*dir});
  }
  return arr;
}

function reset(){
  lives=3;score=0;level=1;
  initLevel();
}

function moveFrog(dx,dy){
  if(state!=='play')return;
  let nx=frog.x+dx,ny=frog.y+dy;
  if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
  frog.x=nx;frog.y=ny;
  if(ny===0){
    score+=100+level*50;
    level++;
    initLevel();
  }
}

document.addEventListener('keydown',e=>{
  if(state==='menu'||state==='dead'){
    if(e.code==='Space'||e.code==='Enter'){state='play';if(state!=='play')return;reset();state='play';}
    return;
  }
  switch(e.code){
    case'ArrowUp':case'KeyW':moveFrog(0,-1);break;
    case'ArrowDown':case'KeyS':moveFrog(0,1);break;
    case'ArrowLeft':case'KeyA':moveFrog(-1,0);break;
    case'ArrowRight':case'KeyD':moveFrog(1,0);break;
  }
  e.preventDefault();
});

canvas.addEventListener('click',()=>{
  if(state==='menu'){reset();state='play';}
  else if(state==='dead'){reset();state='play';}
});

function checkCollisions(){
  let fy=frog.y,fx=frog.x*TILE+TILE/2;
  // Road check
  if(fy>=7&&fy<=11){
    for(let lane of cars){
      if(lane.row===fy){
        for(let v of lane.items){
          if(fx>v.x&&fx<v.x+v.len){
            die();return;
          }
        }
      }
    }
  }
  // Water check
  if(fy>=1&&fy<=5){
    let onLog=false;
    for(let lane of logs){
      if(lane.row===fy){
        for(let l of lane.items){
          if(fx>l.x&&fx<l.x+l.len){
            onLog=true;
            frog.x+=l.speed/(TILE)*0.5;
            if(frog.x<0||frog.x>=COLS){die();return;}
          }
        }
      }
    }
    if(!onLog){die();return;}
  }
}

function die(){
  lives--;
  if(lives<=0){
    state='dead';
    bestScore=Math.max(bestScore,score);
    if(typeof HallOfFame!=='undefined')HallOfFame.submit('frogger',score);
  }else{
    frog.x=6;frog.y=12;
  }
}

function update(){
  if(state!=='play')return;
  for(let lane of cars){
    for(let v of lane.items){
      v.x+=v.speed;
      if(v.speed>0&&v.x>canvas.width)v.x=-v.len;
      if(v.speed<0&&v.x+v.len<0)v.x=canvas.width;
    }
  }
  for(let lane of logs){
    for(let l of lane.items){
      l.x+=l.speed;
      if(l.speed>0&&l.x>canvas.width)l.x=-l.len;
      if(l.speed<0&&l.x+l.len<0)l.x=canvas.width;
    }
  }
  checkCollisions();
}

function draw(){
  // Background
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,canvas.width,canvas.height);
  // Safe zones (row 0, 6, 12)
  ctx.fillStyle='#1a4a1a';
  ctx.fillRect(0,0,canvas.width,TROW);
  ctx.fillRect(0,6*TROW,canvas.width,TROW);
  ctx.fillRect(0,12*TROW,canvas.width,TROW);
  // Water (rows 1-5)
  ctx.fillStyle='#1a3a5a';
  ctx.fillRect(0,TROW,canvas.width,5*TROW);
  // Road (rows 7-11)
  ctx.fillStyle='#2a2a2a';
  ctx.fillRect(0,7*TROW,canvas.width,5*TROW);
  // Road lines
  ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.setLineDash([15,15]);
  for(let r=8;r<=11;r++){ctx.beginPath();ctx.moveTo(0,r*TROW);ctx.lineTo(canvas.width,r*TROW);ctx.stroke();}
  ctx.setLineDash([]);
  // Logs
  for(let lane of logs){
    for(let l of lane.items){
      ctx.fillStyle='#8B4513';
      roundRect(ctx,l.x,lane.row*TROW+4,l.len,TROW-8,6);
      ctx.fillStyle='#A0522D';
      roundRect(ctx,l.x+4,lane.row*TROW+8,l.len-8,TROW-16,4);
    }
  }
  // Cars
  for(let lane of cars){
    for(let v of lane.items){
      ctx.fillStyle=v.color;
      roundRect(ctx,v.x,lane.row*TROW+6,v.len,TROW-12,8);
      ctx.fillStyle='rgba(255,255,255,0.3)';
      roundRect(ctx,v.x+6,lane.row*TROW+10,v.len*0.3,TROW-20,4);
    }
  }
  // Frog
  if(state==='play'){
    let fx=frog.x*TILE,fy=frog.y*TROW;
    ctx.fillStyle='#2ecc71';
    ctx.beginPath();
    ctx.ellipse(fx+TILE/2,fy+TROW/2,TILE/2.5,TROW/2.5,0,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle='#27ae60';
    ctx.beginPath();
    ctx.ellipse(fx+TILE/2,fy+TROW/2,TILE/3.5,TROW/3.5,0,0,Math.PI*2);
    ctx.fill();
    // Eyes
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(fx+TILE/3,fy+TROW/3,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(fx+TILE*2/3,fy+TROW/3,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';
    ctx.beginPath();ctx.arc(fx+TILE/3,fy+TROW/3,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(fx+TILE*2/3,fy+TROW/3,2,0,Math.PI*2);ctx.fill();
  }
  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 18px Segoe UI';ctx.textAlign='left';
  ctx.fillText('Score: '+score,10,canvas.height-10);
  ctx.textAlign='center';
  ctx.fillText('Level '+level,canvas.width/2,canvas.height-10);
  ctx.textAlign='right';
  ctx.fillText('Lives: '+'🐸'.repeat(lives),canvas.width-10,canvas.height-10);
  // Overlays
  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#2ecc71';ctx.font='bold 48px Segoe UI';ctx.textAlign='center';
    ctx.fillText('FROGGER',canvas.width/2,canvas.height/2-40);
    ctx.fillStyle='#aaa';ctx.font='20px Segoe UI';
    ctx.fillText('Click or press Space to start',canvas.width/2,canvas.height/2+20);
    ctx.fillText('Arrow keys / WASD to move',canvas.width/2,canvas.height/2+50);
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#e74c3c';ctx.font='bold 44px Segoe UI';ctx.textAlign='center';
    ctx.fillText('GAME OVER',canvas.width/2,canvas.height/2-50);
    ctx.fillStyle='#fff';ctx.font='24px Segoe UI';
    ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2);
    ctx.fillText('Best: '+bestScore,canvas.width/2,canvas.height/2+35);
    ctx.fillStyle='#aaa';ctx.font='18px Segoe UI';
    ctx.fillText('Click or press Space to retry',canvas.width/2,canvas.height/2+75);
  }
}

function roundRect(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.fill();
}

function loop(){
  update();draw();requestAnimationFrame(loop);
}
loop();
</script>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>

</body>
</html>
