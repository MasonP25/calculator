<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 2rem;
  }
  h1 { font-size: 2rem; }
  .info {
    display: flex;
    gap: 2rem;
    margin-bottom: 1.5rem;
    font-size: 1.1rem;
  }
  .info span { color: #00d4ff; font-weight: bold; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    gap: 12px;
    margin-bottom: 1.5rem;
  }
  .card {
    width: 90px;
    height: 90px;
    perspective: 600px;
    cursor: pointer;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s;
  }
  .card.flipped .card-inner { transform: rotateY(180deg); }
  .card.matched .card-inner { transform: rotateY(180deg); }
  .card-front, .card-back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
  }
  .card-front {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #3a3a5a;
    color: #4a4a6a;
    font-size: 1.5rem;
  }
  .card-front::after { content: '?'; }
  .card-back {
    background: #1a1a2e;
    border: 2px solid #7b2ff7;
    transform: rotateY(180deg);
  }
  .card.matched .card-back {
    border-color: #00d4ff;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
  }
  .card:hover:not(.flipped):not(.matched) .card-front {
    border-color: #7b2ff7;
  }
  button {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: white;
    border: none;
    padding: 0.7rem 2rem;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  .win-msg {
    font-size: 1.3rem;
    color: #00d4ff;
    margin-bottom: 1rem;
    height: 2rem;
  }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Memory Match</h1>
<div class="info">
  Moves: <span id="moves">0</span>
  Pairs: <span id="pairs">0</span> / <span id="total">8</span>
</div>
<div class="board" id="board"></div>
<div class="win-msg" id="winMsg"></div>
<button id="restart">New Game</button>
<script>
const EMOJIS = [
  '&#127922;','&#127918;','&#127919;','&#127921;',
  '&#128142;','&#9889;','&#127775;','&#128640;',
  '&#127800;','&#129412;','&#127925;','&#128293;'
];

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const totalEl = document.getElementById('total');
const winMsgEl = document.getElementById('winMsg');
const restartBtn = document.getElementById('restart');

let cards, flipped, matched, moves, locked, pairCount, totalPairs;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function init() {
  // Pick 8 random emojis
  const picked = shuffle([...EMOJIS]).slice(0, 8);
  totalPairs = picked.length;
  totalEl.textContent = totalPairs;

  // Create pairs and shuffle
  const deck = shuffle([...picked, ...picked]);

  flipped = [];
  matched = new Set();
  moves = 0;
  pairCount = 0;
  locked = false;
  movesEl.textContent = '0';
  pairsEl.textContent = '0';
  winMsgEl.textContent = '';

  boardEl.innerHTML = '';
  // 4 columns, adjust grid for 16 cards (4x4)
  boardEl.style.gridTemplateColumns = `repeat(4, 90px)`;

  cards = deck.map((emoji, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.dataset.emoji = emoji;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-front"></div>
        <div class="card-back">${emoji}</div>
      </div>
    `;
    card.addEventListener('click', () => flipCard(i));
    boardEl.appendChild(card);
    return card;
  });
}

function flipCard(index) {
  const card = cards[index];
  if (locked || card.classList.contains('flipped') || card.classList.contains('matched')) return;

  card.classList.add('flipped');
  if(window.SFX) window.SFX.flip();
  flipped.push(index);

  if (flipped.length === 2) {
    moves++;
    movesEl.textContent = moves;
    locked = true;

    const [a, b] = flipped;
    if (cards[a].dataset.emoji === cards[b].dataset.emoji) {
      // Match!
      setTimeout(() => {
        cards[a].classList.add('matched');
        cards[b].classList.add('matched');
        matched.add(a);
        matched.add(b);
        pairCount++;
        pairsEl.textContent = pairCount;
        if(window.SFX) window.SFX.coin();
        flipped = [];
        locked = false;

        if (pairCount === totalPairs) {
          if(window.SFX) window.SFX.win();
          winMsgEl.textContent = `You won in ${moves} moves!`;
          if(window.HallOfFame) window.HallOfFame.submit('memory', moves);
        }
      }, 400);
    } else {
      // No match — flip back
      if(window.SFX) window.SFX.wrong();
      setTimeout(() => {
        cards[a].classList.remove('flipped');
        cards[b].classList.remove('flipped');
        flipped = [];
        locked = false;
      }, 800);
    }
  }
}

restartBtn.addEventListener('click', init);
init();
</script>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=3"></script>
<script type="module" src="firebase-lb.js?v=2"></script>
<script src="auth.js"></script>
<script src="theme.js?v=3"></script>
</body>
</html>
