<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parking Jam</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f1a;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem;user-select:none;}
a.back{position:fixed;top:12px;left:16px;color:#888;text-decoration:none;font-size:0.85rem;z-index:100;transition:color .2s;}
a.back:hover{color:#e0e0e0;}
h1{font-size:2.2rem;margin:0.5rem 0;background:linear-gradient(135deg,#ff4757,#feca57);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;letter-spacing:3px;}
.subtitle{color:#888;font-size:0.9rem;margin-bottom:1.2rem;text-align:center;max-width:440px;}

/* Menu */
#menu{display:flex;flex-direction:column;align-items:center;gap:12px;}
.diff-btns{display:flex;gap:12px;margin-bottom:8px;}
.diff-btn{background:#1a1a2e;border:2px solid #2a2a4a;color:#e0e0e0;padding:14px 28px;border-radius:10px;cursor:pointer;font-size:1rem;font-weight:600;font-family:inherit;transition:border-color .2s,transform .15s;}
.diff-btn:hover{transform:translateY(-2px);}
.diff-btn.easy:hover{border-color:#00e5a0;}
.diff-btn.medium:hover{border-color:#feca57;}
.diff-btn.hard:hover{border-color:#ff4757;}
.diff-btn.impossible:hover{border-color:#7b2ff7;}
.diff-btn .d-name{display:block;}
.diff-btn .d-desc{display:block;font-size:0.7rem;color:#666;font-weight:400;margin-top:2px;}
.how{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;padding:16px 22px;max-width:440px;color:#aaa;font-size:0.85rem;line-height:1.7;}
.how h3{color:#ff4757;font-size:0.75rem;text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}

/* Game */
#game{display:none;flex-direction:column;align-items:center;}
.hud{display:flex;gap:24px;padding:10px 20px;background:#1a1a2e;border:1px solid #2a2a4a;border-radius:10px;margin-bottom:12px;}
.hud-item{text-align:center;}
.hud-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:1px;color:#888;}
.hud-val{font-size:1.3rem;font-weight:800;color:#00d4ff;}
.grid-wrap{position:relative;background:#1a1a2e;border:2px solid #2a2a4a;border-radius:12px;padding:4px;}
.grid{position:relative;}
.cell-bg{position:absolute;background:#12121f;border:1px solid #1e1e35;border-radius:4px;}
.exit-marker{position:absolute;display:flex;align-items:center;justify-content:center;color:#feca57;font-size:1.6rem;font-weight:800;z-index:5;}
.vehicle{position:absolute;border-radius:8px;cursor:grab;z-index:10;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;color:rgba(255,255,255,0.7);transition:box-shadow .2s;touch-action:none;}
.vehicle:hover{box-shadow:0 0 12px rgba(255,255,255,0.2);}
.vehicle.dragging{z-index:20;box-shadow:0 0 18px rgba(255,255,255,0.3);cursor:grabbing;}
.vehicle.player{box-shadow:0 0 12px rgba(255,71,87,0.5);}
.buttons{display:flex;gap:10px;margin-top:12px;}
.btn{background:#1a1a2e;border:2px solid #2a2a4a;color:#e0e0e0;padding:8px 20px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:0.85rem;font-weight:600;transition:border-color .2s;}
.btn:hover{border-color:#7b2ff7;}
.btn.reset{border-color:#ff475766;color:#ff4757;}
.btn.reset:hover{border-color:#ff4757;background:#ff475722;}

/* Win overlay */
#winOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:100;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.win-title{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,#feca57,#ff4757);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.win-stats{display:flex;gap:32px;}
.win-stat{text-align:center;}
.win-stat-val{font-size:2.5rem;font-weight:800;color:#feca57;}
.win-stat-label{font-size:0.7rem;color:#888;text-transform:uppercase;letter-spacing:2px;}
.win-streak{color:#00d4ff;font-size:1rem;font-weight:700;margin-top:4px;}
.win-btn{background:linear-gradient(135deg,#ff4757,#feca57);color:#0f0f1a;border:none;padding:14px 44px;border-radius:8px;font-size:1.1rem;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s;}
.win-btn:hover{transform:translateY(-2px);}
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>PARKING JAM</h1>
<p class="subtitle">Slide the cars out of the way to free the red car!</p>

<div id="menu">
  <div class="diff-btns">
    <button class="diff-btn easy" onclick="startGame('easy')"><span class="d-name">Easy</span><span class="d-desc">4-6 vehicles</span></button>
    <button class="diff-btn medium" onclick="startGame('medium')"><span class="d-name">Medium</span><span class="d-desc">7-9 vehicles</span></button>
    <button class="diff-btn hard" onclick="startGame('hard')"><span class="d-name">Hard</span><span class="d-desc">10-12 vehicles</span></button>
    <button class="diff-btn impossible" onclick="startGame('impossible')"><span class="d-name">Impossible</span><span class="d-desc">13 vehicles</span></button>
  </div>
  <div class="how"><h3>How to Play</h3>Drag vehicles along their direction to move them. Free the <strong style="color:#ff4757;">red car</strong> by sliding it to the exit on the right. Solve it in as few moves as possible!</div>
</div>

<div id="game">
  <div class="hud">
    <div class="hud-item"><div class="hud-label">Moves</div><div class="hud-val" id="movesVal">0</div></div>
    <div class="hud-item"><div class="hud-label">Level</div><div class="hud-val" id="levelVal">1</div></div>
    <div class="hud-item"><div class="hud-label">Streak</div><div class="hud-val" id="streakVal" style="color:#feca57;">0</div></div>
  </div>
  <div class="grid-wrap"><div class="grid" id="grid"></div></div>
  <div class="buttons">
    <button class="btn reset" onclick="resetPuzzle()">Reset</button>
    <button class="btn" onclick="backToMenu()">Menu</button>
  </div>
</div>

<div id="winOverlay">
  <div class="win-title">Level Complete!</div>
  <div class="win-stats">
    <div class="win-stat"><div class="win-stat-val" id="winMoves">0</div><div class="win-stat-label">Moves</div></div>
  </div>
  <div class="win-streak" id="winStreak"></div>
  <button class="win-btn" onclick="nextPuzzle()">Next Level</button>
</div>

<script>
const CELL=62, GAP=2, GRID_SIZE=6;
const COLORS=['#3498db','#2ecc71','#9b59b6','#e67e22','#1abc9c','#e74c3c','#f39c12','#00d4ff','#95a5a6','#d35400','#8e44ad','#27ae60'];

const PUZZLES={
  easy:[
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:2,col:3,len:2,dir:'v'},{row:0,col:4,len:2,dir:'h'},{row:4,col:0,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:1,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:2,col:4,len:2,dir:'v'},{row:4,col:0,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:3,len:2,dir:'h'},{row:2,col:4,len:2,dir:'v'},{row:5,col:1,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:2,col:3,len:3,dir:'v'},{row:0,col:4,len:2,dir:'h'},{row:5,col:0,len:2,dir:'h'},{row:0,col:0,len:2,dir:'v'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:2,len:2,dir:'v'},{row:0,col:4,len:2,dir:'v'},{row:2,col:4,len:2,dir:'v'},{row:5,col:0,len:2,dir:'h'}]}
  ],
  medium:[
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:2,len:2,dir:'v'},{row:0,col:3,len:2,dir:'h'},{row:1,col:5,len:2,dir:'v'},{row:2,col:3,len:2,dir:'v'},{row:4,col:4,len:2,dir:'v'},{row:5,col:0,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:1,len:2,dir:'h',player:true},{row:0,col:3,len:3,dir:'v'},{row:0,col:5,len:2,dir:'v'},{row:2,col:0,len:2,dir:'v'},{row:3,col:1,len:2,dir:'h'},{row:4,col:1,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:3,len:2,dir:'v'},{row:0,col:5,len:2,dir:'v'},{row:2,col:4,len:2,dir:'v'},{row:3,col:2,len:2,dir:'v'},{row:3,col:0,len:2,dir:'h'},{row:4,col:0,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:2,len:2,dir:'h'},{row:1,col:5,len:2,dir:'v'},{row:3,col:2,len:2,dir:'h'},{row:3,col:5,len:3,dir:'v'},{row:4,col:0,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:2,len:2,dir:'v'},{row:0,col:5,len:2,dir:'v'},{row:1,col:4,len:2,dir:'v'},{row:2,col:3,len:2,dir:'v'},{row:3,col:0,len:2,dir:'h'},{row:4,col:0,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]}
  ],
  hard:[
    {vehicles:[{row:2,col:3,len:2,dir:'h',player:true},{row:0,col:2,len:3,dir:'v'},{row:0,col:0,len:2,dir:'v'},{row:0,col:4,len:2,dir:'v'},{row:1,col:5,len:2,dir:'v'},{row:3,col:1,len:2,dir:'h'},{row:3,col:5,len:3,dir:'v'},{row:4,col:0,len:2,dir:'h'},{row:5,col:2,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'h'},{row:1,col:3,len:2,dir:'v'},{row:1,col:4,len:2,dir:'v'},{row:1,col:5,len:2,dir:'v'},{row:4,col:1,len:2,dir:'h'},{row:4,col:3,len:2,dir:'v'},{row:4,col:4,len:2,dir:'v'},{row:5,col:1,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:1,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:3,len:2,dir:'v'},{row:0,col:4,len:2,dir:'v'},{row:1,col:1,len:2,dir:'h'},{row:2,col:4,len:2,dir:'v'},{row:2,col:5,len:2,dir:'v'},{row:3,col:1,len:2,dir:'h'},{row:4,col:0,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:2,len:3,dir:'v'},{row:0,col:5,len:2,dir:'v'},{row:1,col:0,len:2,dir:'h'},{row:1,col:4,len:2,dir:'v'},{row:3,col:1,len:2,dir:'h'},{row:3,col:3,len:2,dir:'h'},{row:3,col:5,len:2,dir:'v'},{row:4,col:0,len:2,dir:'h'},{row:4,col:3,len:2,dir:'h'},{row:5,col:2,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:2,len:2,dir:'h'},{row:0,col:4,len:2,dir:'v'},{row:1,col:2,len:2,dir:'h'},{row:2,col:2,len:2,dir:'v'},{row:3,col:0,len:2,dir:'h'},{row:3,col:4,len:2,dir:'v'},{row:4,col:0,len:2,dir:'h'},{row:4,col:5,len:2,dir:'v'},{row:5,col:2,len:2,dir:'h'}]}
  ],
  impossible:[
    {vehicles:[{row:2,col:0,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'h'},{row:0,col:3,len:2,dir:'v'},{row:0,col:5,len:2,dir:'v'},{row:1,col:2,len:3,dir:'v'},{row:1,col:4,len:2,dir:'v'},{row:3,col:0,len:2,dir:'v'},{row:3,col:3,len:2,dir:'h'},{row:4,col:1,len:2,dir:'h'},{row:4,col:5,len:2,dir:'v'},{row:5,col:2,len:2,dir:'h'},{row:5,col:0,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:2,len:2,dir:'h'},{row:0,col:4,len:2,dir:'h'},{row:1,col:1,len:2,dir:'v'},{row:1,col:5,len:2,dir:'v'},{row:3,col:0,len:2,dir:'v'},{row:3,col:3,len:2,dir:'h'},{row:4,col:1,len:2,dir:'h'},{row:4,col:5,len:2,dir:'v'},{row:5,col:2,len:2,dir:'h'},{row:5,col:0,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'h'},{row:0,col:2,len:2,dir:'v'},{row:0,col:4,len:2,dir:'h'},{row:1,col:0,len:2,dir:'v'},{row:1,col:5,len:2,dir:'v'},{row:2,col:4,len:2,dir:'v'},{row:3,col:1,len:2,dir:'v'},{row:3,col:5,len:2,dir:'v'},{row:4,col:0,len:2,dir:'v'},{row:4,col:2,len:2,dir:'h'},{row:5,col:3,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:2,len:2,dir:'h'},{row:0,col:5,len:2,dir:'v'},{row:1,col:1,len:2,dir:'v'},{row:1,col:4,len:2,dir:'v'},{row:3,col:0,len:2,dir:'v'},{row:3,col:3,len:2,dir:'v'},{row:3,col:5,len:2,dir:'v'},{row:4,col:1,len:2,dir:'h'},{row:4,col:4,len:2,dir:'v'},{row:5,col:2,len:2,dir:'h'}]},
    {vehicles:[{row:2,col:2,len:2,dir:'h',player:true},{row:0,col:0,len:2,dir:'v'},{row:0,col:3,len:2,dir:'h'},{row:0,col:5,len:2,dir:'v'},{row:1,col:1,len:2,dir:'h'},{row:2,col:4,len:2,dir:'v'},{row:3,col:0,len:2,dir:'v'},{row:3,col:1,len:2,dir:'h'},{row:4,col:2,len:2,dir:'h'},{row:4,col:4,len:2,dir:'v'},{row:4,col:5,len:2,dir:'v'},{row:5,col:1,len:2,dir:'h'}]}
  ]
};

let difficulty='', levelIndex=0, moves=0, streak=0, bestStreak=0, vehicles=[], dragging=null, dragStart=null, puzzleState=[];

function startGame(diff){
  difficulty=diff;
  levelIndex=0;
  streak=0;
  if(window.HallOfFame){const s=window.HallOfFame.getStreak('parkingjam');streak=s.current;bestStreak=s.best;}
  document.getElementById('menu').style.display='none';
  document.getElementById('game').style.display='flex';
  if(window.SFX) window.SFX.click();
  loadPuzzle();
}

function loadPuzzle(){
  const puzzles=PUZZLES[difficulty];
  const puzzle=puzzles[levelIndex % puzzles.length];
  moves=0;
  document.getElementById('movesVal').textContent='0';
  document.getElementById('levelVal').textContent=(levelIndex+1);
  document.getElementById('streakVal').textContent=streak;
  vehicles=puzzle.vehicles.map((v,i)=>({...v,id:i,origRow:v.row,origCol:v.col}));
  puzzleState=vehicles.map(v=>({row:v.row,col:v.col}));
  renderGrid();
}

function resetPuzzle(){
  vehicles.forEach((v,i)=>{v.row=v.origRow;v.col=v.origCol;});
  moves=0;
  document.getElementById('movesVal').textContent='0';
  if(window.SFX) window.SFX.click();
  renderGrid();
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const size=CELL*GRID_SIZE+GAP*(GRID_SIZE-1);
  grid.style.width=size+'px';
  grid.style.height=size+'px';
  grid.innerHTML='';

  // Cell backgrounds
  for(let r=0;r<GRID_SIZE;r++) for(let c=0;c<GRID_SIZE;c++){
    const cell=document.createElement('div');
    cell.className='cell-bg';
    cell.style.left=(c*(CELL+GAP))+'px';
    cell.style.top=(r*(CELL+GAP))+'px';
    cell.style.width=CELL+'px';
    cell.style.height=CELL+'px';
    grid.appendChild(cell);
  }

  // Exit marker
  const exit=document.createElement('div');
  exit.className='exit-marker';
  exit.style.right='-28px';
  exit.style.top=(2*(CELL+GAP))+'px';
  exit.style.width='24px';
  exit.style.height=CELL+'px';
  exit.textContent='→';
  grid.appendChild(exit);

  // Vehicles
  vehicles.forEach((v,i)=>{
    const el=document.createElement('div');
    el.className='vehicle'+(v.player?' player':'');
    const w=v.dir==='h'? v.len*(CELL+GAP)-GAP : CELL;
    const h=v.dir==='v'? v.len*(CELL+GAP)-GAP : CELL;
    el.style.width=w+'px';
    el.style.height=h+'px';
    el.style.left=(v.col*(CELL+GAP))+'px';
    el.style.top=(v.row*(CELL+GAP))+'px';
    el.style.background=v.player?'linear-gradient(135deg,#ff4757,#ff6b81)':COLORS[i%COLORS.length];
    el.style.borderRadius=(v.len>2?'10px':'8px');
    el.dataset.idx=i;

    // Drag events
    el.addEventListener('mousedown',e=>startDrag(e,i));
    el.addEventListener('touchstart',e=>{e.preventDefault();startDrag(e.touches[0],i);},{passive:false});

    grid.appendChild(el);
  });
}

function startDrag(e,idx){
  dragging=idx;
  dragStart={x:e.clientX,y:e.clientY,row:vehicles[idx].row,col:vehicles[idx].col};
  const el=document.querySelector(`[data-idx="${idx}"]`);
  if(el) el.classList.add('dragging');
}

function onMove(e){
  if(dragging===null) return;
  const ev=e.touches?e.touches[0]:e;
  const v=vehicles[dragging];
  const dx=ev.clientX-dragStart.x;
  const dy=ev.clientY-dragStart.y;
  const cellStep=CELL+GAP;

  if(v.dir==='h'){
    let newCol=dragStart.col+Math.round(dx/cellStep);
    newCol=clampPosition(dragging,newCol,'col');
    v.col=newCol;
  } else {
    let newRow=dragStart.row+Math.round(dy/cellStep);
    newRow=clampPosition(dragging,newRow,'row');
    v.row=newRow;
  }
  updateVehiclePosition(dragging);
}

function onUp(){
  if(dragging===null) return;
  const v=vehicles[dragging];
  const moved=(v.row!==dragStart.row||v.col!==dragStart.col);
  if(moved){
    moves++;
    document.getElementById('movesVal').textContent=moves;
    if(window.SFX) window.SFX.click();
  }
  const el=document.querySelector(`[data-idx="${dragging}"]`);
  if(el) el.classList.remove('dragging');

  // Check win: player car at col 4 or beyond (len 2, so col+len >= 6)
  if(v.player && v.col+v.len>=GRID_SIZE){
    dragging=null;
    setTimeout(()=>winLevel(),200);
    return;
  }
  dragging=null;
}

function clampPosition(idx,newPos,axis){
  const v=vehicles[idx];
  const isH=v.dir==='h';

  if(axis==='col'&&isH){
    // Player car can exit (col+len can be >= GRID_SIZE)
    const maxC=v.player?GRID_SIZE-1:GRID_SIZE-v.len;
    newPos=Math.max(0,Math.min(maxC,newPos));
    // Check collisions
    for(let c=Math.min(v.col,newPos);c<=Math.max(v.col,newPos);c++){
      const testV={...v,col:c};
      if(collides(testV,idx)){
        // Can't go this far
        if(c>v.col) return c-1; // going right
        if(c<v.col) return c+1; // going left
        return v.col;
      }
    }
    return newPos;
  } else if(axis==='row'&&!isH){
    newPos=Math.max(0,Math.min(GRID_SIZE-v.len,newPos));
    for(let r=Math.min(v.row,newPos);r<=Math.max(v.row,newPos);r++){
      const testV={...v,row:r};
      if(collides(testV,idx)){
        if(r>v.row) return r-1;
        if(r<v.row) return r+1;
        return v.row;
      }
    }
    return newPos;
  }
  return newPos;
}

function collides(testV,skipIdx){
  for(let i=0;i<vehicles.length;i++){
    if(i===skipIdx) continue;
    const o=vehicles[i];
    const tCells=getCells(testV);
    const oCells=getCells(o);
    for(const tc of tCells) for(const oc of oCells){
      if(tc.r===oc.r&&tc.c===oc.c) return true;
    }
  }
  return false;
}

function getCells(v){
  const cells=[];
  for(let i=0;i<v.len;i++){
    cells.push({r:v.row+(v.dir==='v'?i:0),c:v.col+(v.dir==='h'?i:0)});
  }
  return cells;
}

function updateVehiclePosition(idx){
  const el=document.querySelector(`[data-idx="${idx}"]`);
  if(!el) return;
  const v=vehicles[idx];
  el.style.left=(v.col*(CELL+GAP))+'px';
  el.style.top=(v.row*(CELL+GAP))+'px';
}

function winLevel(){
  if(window.SFX) window.SFX.win();
  if(window.HallOfFame){
    const s=window.HallOfFame.winStreak('parkingjam');
    streak=s.current;
    bestStreak=s.best;
    window.HallOfFame.submit('parkingjam',streak);
  }
  document.getElementById('winMoves').textContent=moves;
  document.getElementById('winStreak').textContent='Streak: '+streak+(bestStreak>0?' (Best: '+bestStreak+')':'');
  document.getElementById('winOverlay').style.display='flex';
}

function nextPuzzle(){
  document.getElementById('winOverlay').style.display='none';
  levelIndex++;
  loadPuzzle();
  if(window.SFX) window.SFX.click();
}

function backToMenu(){
  document.getElementById('game').style.display='none';
  document.getElementById('winOverlay').style.display='none';
  document.getElementById('menu').style.display='flex';
  if(window.SFX) window.SFX.click();
}

document.addEventListener('mousemove',onMove);
document.addEventListener('mouseup',onUp);
document.addEventListener('touchmove',e=>{if(dragging!==null)e.preventDefault();onMove(e);},{passive:false});
document.addEventListener('touchend',onUp);
