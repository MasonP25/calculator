<h1>Snake</h1>
<div class="info">
  Score: <span id="score">0</span>
  High Score: <span id="high">0</span>
</div>
<canvas id="c" width="400" height="400"></canvas>
<div class="msg" id="msg">Press any arrow key to start</div>
<script>
function _gb(k,f){return(window.HallOfFame?window.HallOfFame.getBest(k,f):localStorage.getItem(k))||f}
function _sb(k,v){window.HallOfFame?window.HallOfFame.setBest(k,v):localStorage.setItem(k,v)}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const msgEl = document.getElementById('msg');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, highScore, running, gameOver, speed, interval;

highScore = parseInt(_gb('snakeHigh', '0'));
highEl.textContent = highScore;

function init() {
  snake = [{x: 10, y: 10}];
  dir = {x: 0, y: 0};
  nextDir = {x: 0, y: 0};
  score = 0;
  running = false;
  gameOver = false;
  speed = 120;
  scoreEl.textContent = '0';
  placeFood();
  draw();
  msgEl.textContent = 'Press any arrow key to start';
  if (interval) clearInterval(interval);
}

function placeFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function draw() {
  var T=window.TC||{};
  ctx.fillStyle = T.bg||'#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw grid lines (subtle)
  ctx.strokeStyle = T.bg2||'#1f1f35';
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= canvas.width; x += GRID) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y <= canvas.height; y += GRID) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Food
  ctx.fillStyle = '#ff4757';
  ctx.shadowColor = '#ff4757';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Snake
  snake.forEach((seg, i) => {
    const t = i / snake.length;
    const r = Math.floor(0 + t * 0);
    const g = Math.floor(212 - t * 100);
    const b = Math.floor(255 - t * 100);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.shadowColor = i === 0 ? '#00d4ff' : 'transparent';
    ctx.shadowBlur = i === 0 ? 8 : 0;
    ctx.beginPath();
    ctx.roundRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2, 4);
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  if (gameOver) {
    ctx.fillStyle = T.overlay?T.overlay(0.75):'rgba(15,15,26,0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 36px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 10);
    ctx.fillStyle = T.dim||'#888';
    ctx.font = '16px Segoe UI';
    ctx.fillText('Press SPACE to play again', canvas.width/2, canvas.height/2 + 25);
  }
}

function update() {
  dir = {...nextDir};
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame();
    return;
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score++;
    scoreEl.textContent = score;
    if (window.SFX) window.SFX.coin();
    if (score > highScore) {
      highScore = score;
      highEl.textContent = highScore;
      _sb('snakeHigh', highScore.toString());
    }
    placeFood();
    // Speed up slightly
    if (speed > 60) {
      speed -= 2;
      clearInterval(interval);
      interval = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }
  draw();
}

function tick() {
  if (!gameOver) update();
}

function endGame() {
  gameOver = true;
  clearInterval(interval);
  if (window.SFX) window.SFX.death();
  if (window.HallOfFame) window.HallOfFame.submit('snake', score);
  draw();
  msgEl.textContent = 'Game over! Press SPACE to restart';
}

function startGame() {
  if (!running && !gameOver) {
    running = true;
    msgEl.textContent = '';
    interval = setInterval(tick, speed);
  }
}

document.addEventListener('keydown', e => {
  if (e.key === ' ' && gameOver) {
    init();
    return;
  }
  switch(e.key) {
    case 'ArrowUp':
      e.preventDefault();
      if (dir.y !== 1) { nextDir = {x:0, y:-1}; if (window.SFX) window.SFX.move(); startGame(); }
      break;
    case 'ArrowDown':
      e.preventDefault();
      if (dir.y !== -1) { nextDir = {x:0, y:1}; if (window.SFX) window.SFX.move(); startGame(); }
      break;
    case 'ArrowLeft':
      e.preventDefault();
      if (dir.x !== 1) { nextDir = {x:-1, y:0}; if (window.SFX) window.SFX.move(); startGame(); }
      break;
    case 'ArrowRight':
      e.preventDefault();
      if (dir.x !== -1) { nextDir = {x:1, y:0}; if (window.SFX) window.SFX.move(); startGame(); }
      break;
  }
});

init();
</script>
