<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<script src="slope-build/TemplateData/unityloader41.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#231F20;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;height:100vh}
.back{position:fixed;top:16px;left:16px;color:#0f0;text-decoration:none;font-size:18px;z-index:10001;font-weight:bold;text-shadow:0 0 8px rgba(0,255,0,0.5)}
.back:hover{text-shadow:0 0 16px rgba(0,255,0,0.8)}
.webgl-content{width:100%;height:100vh}
#gameContainer{width:100%;height:100%;margin:0}
/* Hide Unity's default loading screen completely */
#gameContainer .logo,
#gameContainer .progress{display:none!important}
/* Custom loading overlay */
#loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
#loading-overlay h1{color:#0f0;font-size:48px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:30px}
.loader{width:40px;height:40px;border:3px solid transparent;border-top:3px solid #0f0;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{color:#888;margin-top:15px;font-size:14px}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>

<div id="loading-overlay">
  <h1>SLOPE</h1>
  <div class="loader"></div>
  <div id="loading-text">Loading game...</div>
</div>

<div class="webgl-content">
  <div id="gameContainer"></div>
</div>

<script>
// Custom progress handler - no Unity logo/bar, just our overlay
function UnityProgress(inst, progress) {
  var txt = document.getElementById('loading-text');
  if (txt) {
    if (typeof progress === 'number') {
      txt.textContent = 'Loading... ' + Math.floor(progress * 100) + '%';
    }
    if (progress === 1 || progress === 'complete') {
      // Game loaded - hide loading, auto-start game
      setTimeout(function() {
        var overlay = document.getElementById('loading-overlay');
        if (overlay) overlay.classList.add('hidden');
        setTimeout(function() { if (overlay) overlay.style.display = 'none'; }, 600);
        // Try to skip main menu and start game directly
        tryAutoStart();
      }, 500);
    }
  }
}

var gameInstance = UnityLoader.instantiate('gameContainer', 'slope-build/Build/slope.json', {
  onProgress: UnityProgress,
  Module: {
    onRuntimeInitialized: function() {
      UnityProgress(gameInstance, 'complete');
    }
  }
});

// Disable branding, hide menus, and auto-start gameplay
function tryAutoStart() {
  var started = false;
  var attempts = 0;
  var interval = setInterval(function() {
    attempts++;
    try {
      if (!started) {
        // Disable all branding / external links / IDnet
        gameInstance.SendMessage('Branding', 'DisableMoreGames');
        gameInstance.SendMessage('BrandingScript', 'DisableMoreGames');
        gameInstance.SendMessage('Y8Branding', 'DisableY8Link');
        gameInstance.SendMessage('Branding_Y8', 'SetActive', '0');
        gameInstance.SendMessage('Branding_Y8_MoreGames', 'SetActive', '0');
        gameInstance.SendMessage('Branding_IDnet', 'SetActive', '0');
        gameInstance.SendMessage('IDnetObject', 'SetActive', '0');
        gameInstance.SendMessage('y8_logo', 'SetActive', '0');
        gameInstance.SendMessage('y8_logo_moregames', 'SetActive', '0');
        gameInstance.SendMessage('idnet_logo', 'SetActive', '0');
        gameInstance.SendMessage('PromoScreen', 'SetActive', '0');

        // Hide all screens then start the game
        gameInstance.SendMessage('GameLogic', 'HideAllScreens');
        gameInstance.SendMessage('GameLogic', 'RestartLevel');
        started = true;
      }
    } catch(e) {}

    // Safety: keep trying for a bit in case game isn't ready yet
    if (attempts > 20) clearInterval(interval);
  }, 600);
}
</script>

<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
