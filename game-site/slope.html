<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<link rel="stylesheet" href="slope-build/TemplateData/style.css">
<script src="slope-build/TemplateData/UnityProgress.js"></script>
<script src="slope-build/TemplateData/unityloader41.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #231F20;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  height: 100vh;
}
.back {
  position: fixed; top: 16px; left: 16px;
  color: #0f0; text-decoration: none; font-size: 18px;
  z-index: 10001; font-weight: bold;
  text-shadow: 0 0 8px rgba(0,255,0,0.5);
}
.back:hover { text-shadow: 0 0 16px rgba(0,255,0,0.8); }
.webgl-content {
  width: 100%;
  height: 100vh;
}
#gameContainer {
  width: 100%;
  height: 100%;
  margin: 0;
}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<div class="webgl-content">
  <div id="gameContainer"></div>
</div>
<script>
  var gameInstance = UnityLoader.instantiate('gameContainer', 'slope-build/Build/slope.json', {
    onProgress: UnityProgress,
    Module: {
      onRuntimeInitialized: function() {
        UnityProgress(gameInstance, 'complete');
      }
    }
  });
</script>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
