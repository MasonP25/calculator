<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<script src="slope-build/TemplateData/unityloader41.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#231F20;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif;height:100vh}
.back{position:fixed;top:16px;left:16px;color:#0f0;text-decoration:none;font-size:18px;z-index:10001;font-weight:bold;text-shadow:0 0 8px rgba(0,255,0,0.5)}
.back:hover{text-shadow:0 0 16px rgba(0,255,0,0.8)}
.webgl-content{width:100%;height:100vh}
#gameContainer{width:100%;height:100%;margin:0}
#gameContainer .logo,
#gameContainer .progress{display:none!important}
#loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.6s}
#loading-overlay.hidden{opacity:0;pointer-events:none}
#loading-overlay h1{color:#0f0;font-size:48px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:30px}
.loader{width:40px;height:40px;border:3px solid transparent;border-top:3px solid #0f0;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{color:#888;margin-top:15px;font-size:14px}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>

<div id="loading-overlay">
  <h1>SLOPE</h1>
  <div class="loader"></div>
  <div id="loading-text">Loading game...</div>
</div>

<div class="webgl-content">
  <div id="gameContainer"></div>
</div>

<script>
var gameLoaded = false;
var gameStarted = false;

function UnityProgress(inst, progress) {
  var txt = document.getElementById('loading-text');
  if (txt && typeof progress === 'number') {
    txt.textContent = 'Loading... ' + Math.floor(progress * 100) + '%';
  }
  if ((progress === 1 || progress === 'complete') && !gameLoaded) {
    gameLoaded = true;
    // Give Unity time to fully initialize and render the menu
    setTimeout(startAutoPlay, 3000);
  }
}

var gameInstance = UnityLoader.instantiate('gameContainer', 'slope-build/Build/slope.json', {
  onProgress: UnityProgress,
  Module: {
    onRuntimeInitialized: function() {
      UnityProgress(gameInstance, 'complete');
    }
  }
});

function startAutoPlay() {
  var canvas = document.querySelector('#gameContainer canvas');
  if (!canvas) {
    setTimeout(startAutoPlay, 500);
    return;
  }

  // Phase 1: Disable all branding/promo objects
  disableBranding();

  // Phase 2: Try SendMessage to start the game directly
  trySendMessages();

  // Phase 3: After SendMessage attempts, do a precise click on Play button
  // In the Y8 Slope game, the Play button is a large area roughly centered
  // horizontally and positioned about 58% down the screen.
  // The leaderboard icon is a small trophy in the UPPER RIGHT corner.
  // So we click center-horizontal, slightly above vertical center to hit Play.
  setTimeout(function() {
    var rect = canvas.getBoundingClientRect();
    var cx = rect.left + rect.width * 0.5;
    // Play button is roughly at 58% from top in the Y8 Slope menu
    var cy = rect.top + rect.height * 0.58;
    fireClick(canvas, cx, cy);
  }, 500);

  // Phase 4: Try again with a slight offset if first click didn't work
  setTimeout(function() {
    if (gameStarted) return;
    var rect = canvas.getBoundingClientRect();
    var cx = rect.left + rect.width * 0.5;
    var cy = rect.top + rect.height * 0.52;
    fireClick(canvas, cx, cy);
  }, 1200);

  // Phase 5: One more try at slightly different position
  setTimeout(function() {
    if (gameStarted) return;
    var rect = canvas.getBoundingClientRect();
    var cx = rect.left + rect.width * 0.5;
    var cy = rect.top + rect.height * 0.45;
    fireClick(canvas, cx, cy);
  }, 2000);

  // Phase 6: Try keyboard - some Slope versions start with any keypress
  setTimeout(function() {
    if (gameStarted) return;
    // Simulate Enter key
    canvas.dispatchEvent(new KeyboardEvent('keydown', {
      key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true
    }));
    canvas.dispatchEvent(new KeyboardEvent('keyup', {
      key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true
    }));
    // Also try Space
    canvas.dispatchEvent(new KeyboardEvent('keydown', {
      key: ' ', code: 'Space', keyCode: 32, bubbles: true
    }));
    canvas.dispatchEvent(new KeyboardEvent('keyup', {
      key: ' ', code: 'Space', keyCode: 32, bubbles: true
    }));
  }, 2500);

  // Hide the overlay after attempts - give it enough time
  setTimeout(function() {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.classList.add('hidden');
    setTimeout(function() { if (overlay) overlay.style.display = 'none'; }, 700);

    // Continue disabling branding periodically
    disableBranding();
    setTimeout(disableBranding, 2000);
    setTimeout(disableBranding, 5000);
    setTimeout(disableBranding, 10000);
  }, 3000);
}

function trySendMessages() {
  if (!gameInstance) return;

  // Try every known method to start the game
  var startMethods = [
    'PlayGame', 'StartGame', 'Play', 'Start', 'OnPlayButton',
    'OnPlayClick', 'OnPlay', 'BeginGame', 'NewGame',
    'HideAllScreens', 'RestartLevel', 'StartLevel', 'LoadLevel'
  ];
  var gameObjects = [
    'GameLogic', 'CanvasScripts', 'GameManager', 'Game',
    'Manager', 'Controller', 'GameController', 'LevelManager',
    'UIManager', 'MenuManager', 'MainMenu'
  ];

  for (var i = 0; i < gameObjects.length; i++) {
    for (var j = 0; j < startMethods.length; j++) {
      try { gameInstance.SendMessage(gameObjects[i], startMethods[j]); } catch(e) {}
    }
  }

  // Try PlayMaker FSM events
  var fsmEvents = ['PLAY', 'START', 'GAME_START', 'BEGIN', 'START_GAME', 'PLAY_GAME'];
  for (var k = 0; k < fsmEvents.length; k++) {
    try { gameInstance.SendMessage('PlayMakerFSM', 'SendEvent', fsmEvents[k]); } catch(e) {}
    try { gameInstance.SendMessage('GameLogic', 'SendEvent', fsmEvents[k]); } catch(e) {}
  }

  // Hide specific UI screens
  var screens = ['MainMenuScreen', 'GameOverScreen', 'PromoScreen', 'IDNETLogin',
    'IdnetSample', 'IdnetWrap', 'Leaderboard', 'LoginPanel'];
  for (var s = 0; s < screens.length; s++) {
    try { gameInstance.SendMessage(screens[s], 'SetActive', '0'); } catch(e) {}
  }

  // Retry SendMessages after a delay
  setTimeout(function() {
    for (var i = 0; i < gameObjects.length; i++) {
      try { gameInstance.SendMessage(gameObjects[i], 'HideAllScreens'); } catch(e) {}
      try { gameInstance.SendMessage(gameObjects[i], 'RestartLevel'); } catch(e) {}
      try { gameInstance.SendMessage(gameObjects[i], 'PlayGame'); } catch(e) {}
    }
  }, 1000);
}

function fireClick(el, x, y) {
  // Fire a complete mouse click sequence
  var common = {
    bubbles: true, cancelable: true, view: window,
    clientX: x, clientY: y, button: 0, pointerId: 1,
    pointerType: 'mouse'
  };
  el.dispatchEvent(new PointerEvent('pointerdown', common));
  el.dispatchEvent(new MouseEvent('mousedown', common));
  // Small delay between down and up for realism
  setTimeout(function() {
    el.dispatchEvent(new PointerEvent('pointerup', common));
    el.dispatchEvent(new MouseEvent('mouseup', common));
    el.dispatchEvent(new MouseEvent('click', common));
  }, 50);
}

function disableBranding() {
  if (!gameInstance) return;
  var objs = ['Branding', 'BrandingScript', 'Y8Branding', 'Branding_Y8',
    'Branding_Y8_MoreGames', 'Branding_IDnet', 'IDnetObject',
    'y8_logo', 'y8_logo_moregames', 'idnet_logo', 'PromoScreen',
    'IDNETLogin', 'IdnetSample', 'IdnetWrap', 'Leaderboard'];
  for (var i = 0; i < objs.length; i++) {
    try { gameInstance.SendMessage(objs[i], 'SetActive', '0'); } catch(e) {}
  }
  try { gameInstance.SendMessage('Branding', 'DisableMoreGames'); } catch(e) {}
  try { gameInstance.SendMessage('Y8Branding', 'DisableY8Link'); } catch(e) {}
}

// Listen for game state changes - if keys are being pressed,
// the game has likely started
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
      e.key === 'a' || e.key === 'd') {
    gameStarted = true;
  }
});
</script>

<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
