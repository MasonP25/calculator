<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: none;
  user-select: none;
}
canvas { display: block; border-radius: 8px; }
.back {
  position: fixed; top: 16px; left: 16px;
  color: #0f0; text-decoration: none; font-size: 18px;
  z-index: 100; font-weight: bold;
  text-shadow: 0 0 8px rgba(0,255,0,0.5);
}
.back:hover { text-shadow: 0 0 16px rgba(0,255,0,0.8); }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<canvas id="c"></canvas>
<script>
(function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // --- Sizing ---
  let W, H;
  function resize() {
    W = Math.min(window.innerWidth, 500);
    H = Math.min(window.innerHeight, 700);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Constants ---
  const BASE_SPEED = 5;
  const MAX_STEER = 5.5;
  const TRACK_HW = 2.2; // half-width of track in world units
  const SEG_LEN = 2.5;
  const NUM_SEGS = 200; // how many segments to generate ahead
  const FOCAL = 5.5;
  const VP_Y = 0.12; // vanishing point Y ratio
  const BALL_Y = 0.78; // ball screen Y ratio
  const BALL_RAD_WORLD = 0.28;
  const OBS_SIZE = 0.55;

  // Colors
  const NEON = '#0f0';
  const NEON_RGB = '0,255,0';
  const NEON_DIM = '#0a0';
  const RED_GLOW = '#ff2222';
  const RED_RGB = '255,34,34';
  const TRACK_FILL_A = '#0c1a0c';
  const TRACK_FILL_B = '#0a130a';
  const BG_TOP = '#020204';
  const BG_BOT = '#080812';

  // --- State ---
  let state = 'menu';
  let distance = 0;
  let bestScore = parseInt(localStorage.getItem('slope_best')) || 0;
  let ballX = 0; // world X relative to track center
  let speed = BASE_SPEED;
  let steerDir = 0;
  let shakeTimer = 0;
  let lastTime = 0;
  let deathParticles = [];
  let coinEarned = false;

  // Track data: array of segment objects
  let track = [];
  let trackGenIndex = 0;
  let curveAccum = 0;
  let curveTarget = 0;
  let curveVel = 0;
  let tiltAccum = 0;
  let tiltTarget = 0;
  let narrowAccum = 0;
  let narrowTarget = 0;

  // --- Track Generation ---
  function genSegment(idx) {
    // Evolve curve
    if (Math.random() < 0.015 + Math.min(distance * 0.00002, 0.03)) {
      curveTarget = (Math.random() - 0.5) * 4.5;
    }
    curveVel += (curveTarget - curveAccum) * 0.012;
    curveVel *= 0.96;
    curveAccum += curveVel;

    // Evolve tilt (banking)
    if (Math.random() < 0.01) {
      tiltTarget = (Math.random() - 0.5) * 0.5;
    }
    tiltAccum += (tiltTarget - tiltAccum) * 0.03;

    // Evolve narrowing
    if (Math.random() < 0.008 && distance > 100) {
      narrowTarget = Math.random() < 0.5 ? 0 : (0.2 + Math.random() * 0.35);
    }
    if (Math.random() < 0.02) narrowTarget = 0;
    narrowAccum += (narrowTarget - narrowAccum) * 0.04;

    // Determine gap
    let isGap = false;
    const distAtSeg = idx * SEG_LEN;
    if (distAtSeg > 120) {
      // Gaps appear periodically
      const gapCycle = Math.max(60, 140 - distance * 0.02);
      const gapPhase = distAtSeg % gapCycle;
      if (gapPhase < 6 + Math.min(distance * 0.004, 6)) {
        isGap = true;
      }
    }

    // Obstacles
    let obstacle = null;
    const obsDist = distAtSeg;
    if (obsDist > 30 && !isGap) {
      const freq = Math.max(8, 35 - distance * 0.015);
      if (idx % Math.max(3, Math.floor(freq / SEG_LEN)) === 0 && Math.random() < 0.55) {
        // Place obstacle on left or right side, or center
        const side = Math.random();
        let ox;
        const hw = TRACK_HW * (1 - narrowAccum * 0.5);
        if (side < 0.33) ox = -hw * 0.5;
        else if (side < 0.66) ox = hw * 0.5;
        else ox = (Math.random() - 0.5) * hw * 0.8;
        obstacle = { x: ox, size: OBS_SIZE };
        // Sometimes double obstacle
        if (Math.random() < 0.15 + distance * 0.0002) {
          obstacle.x2 = -ox * 0.7 + (Math.random() - 0.5) * 0.3;
        }
      }
    }

    return {
      idx: idx,
      cx: curveAccum,
      tilt: tiltAccum,
      narrow: narrowAccum,
      gap: isGap,
      obstacle: obstacle
    };
  }

  function ensureTrack(ahead) {
    const needIdx = Math.floor((distance + ahead) / SEG_LEN) + 2;
    while (trackGenIndex <= needIdx) {
      track.push(genSegment(trackGenIndex));
      trackGenIndex++;
    }
    // Prune old segments
    const minIdx = Math.floor(distance / SEG_LEN) - 5;
    while (track.length > 0 && track[0].idx < minIdx) {
      track.shift();
    }
  }

  function getSegByIdx(idx) {
    for (let i = 0; i < track.length; i++) {
      if (track[i].idx === idx) return track[i];
    }
    return null;
  }

  function getSegAtDist(d) {
    const idx = Math.floor(d / SEG_LEN);
    return getSegByIdx(idx);
  }

  function interpTrack(d) {
    const fi = d / SEG_LEN;
    const i0 = Math.floor(fi);
    const frac = fi - i0;
    const s0 = getSegByIdx(i0);
    const s1 = getSegByIdx(i0 + 1);
    if (!s0) return { cx: 0, tilt: 0, narrow: 0, gap: false };
    if (!s1) return { cx: s0.cx, tilt: s0.tilt, narrow: s0.narrow, gap: s0.gap };
    return {
      cx: s0.cx + (s1.cx - s0.cx) * frac,
      tilt: s0.tilt + (s1.tilt - s0.tilt) * frac,
      narrow: s0.narrow + (s1.narrow - s0.narrow) * frac,
      gap: s0.gap
    };
  }

  // --- Perspective Projection ---
  function project(worldX, worldZ) {
    const z = Math.max(worldZ, 0.01);
    const scale = FOCAL / (FOCAL + z);
    const vpx = W / 2;
    const vpy = H * VP_Y;
    const ballSY = H * BALL_Y;
    const sx = vpx + worldX * scale * (W * 0.24);
    const sy = vpy + (ballSY - vpy) * scale;
    return { x: sx, y: sy, s: scale };
  }

  // --- Init / Reset ---
  function initGame() {
    distance = 0;
    ballX = 0;
    speed = BASE_SPEED;
    steerDir = 0;
    shakeTimer = 0;
    deathParticles = [];
    track = [];
    trackGenIndex = 0;
    curveAccum = 0;
    curveTarget = 0;
    curveVel = 0;
    tiltAccum = 0;
    tiltTarget = 0;
    narrowAccum = 0;
    narrowTarget = 0;
    coinEarned = false;
    ensureTrack(NUM_SEGS * SEG_LEN);
    state = 'play';
    lastTime = performance.now();
  }

  // --- Input ---
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (state === 'menu') { initGame(); e.preventDefault(); return; }
    if (state === 'over' && (e.code === 'Space' || e.code === 'Enter')) { initGame(); e.preventDefault(); }
    if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space','Enter'].includes(e.code)) e.preventDefault();
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  let touchL = false, touchR = false;
  function handleTouches(e) {
    touchL = false; touchR = false;
    for (const t of e.touches) {
      if (t.clientX < window.innerWidth / 2) touchL = true;
      else touchR = true;
    }
  }
  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if (state === 'menu' || state === 'over') { initGame(); return; }
    handleTouches(e);
  });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); handleTouches(e); });
  canvas.addEventListener('touchend', e => { e.preventDefault(); handleTouches(e); });
  canvas.addEventListener('mousedown', e => {
    if (state === 'menu' || state === 'over') initGame();
  });

  // --- Death Particles ---
  function spawnDeath(sx, sy) {
    for (let i = 0; i < 40; i++) {
      const angle = Math.random() * Math.PI * 2;
      const spd = 2 + Math.random() * 6;
      deathParticles.push({
        x: sx, y: sy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 3,
        life: 1,
        r: 2 + Math.random() * 4,
        green: Math.random() > 0.3
      });
    }
  }

  // --- Update ---
  function update(dt) {
    if (state !== 'play') return;

    // Speed increases
    speed = BASE_SPEED + distance * 0.004 + Math.min(distance * 0.0001, 3);
    const move = speed * dt;
    distance += move;

    // Steering
    steerDir = 0;
    if (keys['ArrowLeft'] || keys['KeyA'] || touchL) steerDir = -1;
    if (keys['ArrowRight'] || keys['KeyD'] || touchR) steerDir = 1;

    const steerSpeed = MAX_STEER + speed * 0.12;
    ballX += steerDir * steerSpeed * dt;

    // Track tilt pushes ball
    const tr = interpTrack(distance);
    ballX += tr.tilt * speed * dt * 0.6;

    // Ensure track ahead
    ensureTrack(NUM_SEGS * SEG_LEN);

    // Track half-width at current position
    const hw = TRACK_HW * (1 - tr.narrow * 0.5);

    // Off-edge death
    if (ballX < -hw - 0.1 || ballX > hw + 0.1) {
      die(); return;
    }

    // Gap death
    if (tr.gap) {
      die(); return;
    }

    // Obstacle collision
    const curIdx = Math.floor(distance / SEG_LEN);
    for (let di = -1; di <= 1; di++) {
      const seg = getSegByIdx(curIdx + di);
      if (!seg || !seg.obstacle) continue;
      const segDist = seg.idx * SEG_LEN;
      const relZ = segDist - distance;
      if (relZ > 1.5 || relZ < -1.0) continue;
      const obs = seg.obstacle;
      const dx = Math.abs(ballX - obs.x);
      if (dx < OBS_SIZE * 0.5 + BALL_RAD_WORLD && Math.abs(relZ) < OBS_SIZE * 0.7 + BALL_RAD_WORLD) {
        die(); return;
      }
      if (obs.x2 !== undefined) {
        const dx2 = Math.abs(ballX - obs.x2);
        if (dx2 < OBS_SIZE * 0.5 + BALL_RAD_WORLD && Math.abs(relZ) < OBS_SIZE * 0.7 + BALL_RAD_WORLD) {
          die(); return;
        }
      }
    }

    if (shakeTimer > 0) shakeTimer -= dt;
  }

  function die() {
    state = 'over';
    const score = Math.floor(distance);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('slope_best', score);
    }
    shakeTimer = 0.4;
    spawnDeath(W / 2, H * BALL_Y);
    if (window.SFX) window.SFX.death();
    if (score > 0 && window.HallOfFame) window.HallOfFame.submit('slope', score);
  }

  // --- Drawing ---
  function draw() {
    ctx.save();
    if (shakeTimer > 0) {
      const s = shakeTimer * 18;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // Background - deep dark
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, BG_TOP);
    bg.addColorStop(1, BG_BOT);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Distant stars
    drawStars();

    if (state === 'menu') {
      drawMenuScene();
      ctx.restore();
      return;
    }

    drawTrack3D();
    drawBall();
    drawDeathParticles();
    drawHUD();

    if (state === 'over') drawGameOver();

    ctx.restore();
  }

  // Stars (cached)
  let stars = null;
  function drawStars() {
    if (!stars) {
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random(), y: Math.random() * 0.45,
          r: 0.4 + Math.random() * 1.0,
          phase: Math.random() * 6.28
        });
      }
    }
    const t = performance.now() * 0.001;
    for (const s of stars) {
      const a = 0.2 + Math.sin(t + s.phase) * 0.2;
      ctx.fillStyle = `rgba(180,200,255,${a})`;
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, 6.28);
      ctx.fill();
    }
  }

  // --- 3D Track Drawing ---
  function drawTrack3D() {
    const ballTr = interpTrack(distance);
    const camCX = ballTr.cx; // camera follows track center roughly

    const drawSegs = 110;
    const stepsPerSeg = 2;
    const totalSteps = drawSegs * stepsPerSeg;
    const stepLen = SEG_LEN / stepsPerSeg;

    // Build projected points for left/right edges and center
    const points = [];
    for (let i = 0; i <= totalSteps; i++) {
      const zWorld = i * stepLen;
      const absDist = distance + zWorld;
      const tr = interpTrack(absDist);
      const relCX = tr.cx - camCX - ballX * 0.0; // camera offset: we keep ball centered
      const hw = TRACK_HW * (1 - tr.narrow * 0.5);

      // Apply tilt: offset left/right edges vertically in screen space
      const tiltOffset = tr.tilt * 0.3;

      const leftX = relCX - hw - ballX;
      const rightX = relCX + hw - ballX;
      const centerX = relCX - ballX;

      const pL = project(leftX, zWorld);
      const pR = project(rightX, zWorld);
      const pC = project(centerX, zWorld);

      // Tilt shifts Y slightly
      pL.y += tiltOffset * pL.s * 40;
      pR.y -= tiltOffset * pR.s * 40;

      points.push({
        z: zWorld, absDist, tr,
        pL, pR, pC, hw,
        gap: tr.gap,
        segIdx: Math.floor(absDist / SEG_LEN)
      });
    }

    // Draw track segments (far to near)
    for (let i = points.length - 2; i >= 0; i--) {
      const far = points[i + 1];
      const near = points[i];

      if (far.gap && near.gap) continue;

      const depthFade = Math.max(0, 1 - far.z / (drawSegs * SEG_LEN));
      if (depthFade < 0.01) continue;

      // Track surface
      const tileAlt = near.segIdx % 2 === 0;
      ctx.fillStyle = tileAlt ? TRACK_FILL_A : TRACK_FILL_B;
      ctx.globalAlpha = (0.4 + depthFade * 0.6);

      ctx.beginPath();
      ctx.moveTo(far.pL.x, far.pL.y);
      ctx.lineTo(far.pR.x, far.pR.y);
      ctx.lineTo(near.pR.x, near.pR.y);
      ctx.lineTo(near.pL.x, near.pL.y);
      ctx.closePath();
      ctx.fill();

      // Grid lines (horizontal every segment boundary)
      if (near.segIdx !== far.segIdx && depthFade > 0.05) {
        ctx.strokeStyle = `rgba(${NEON_RGB},${0.15 * depthFade})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(far.pL.x, far.pL.y);
        ctx.lineTo(far.pR.x, far.pR.y);
        ctx.stroke();
      }

      // Center line dashed
      if (i % 4 < 2 && depthFade > 0.08) {
        ctx.strokeStyle = `rgba(${NEON_RGB},${0.07 * depthFade})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(far.pC.x, far.pC.y);
        ctx.lineTo(near.pC.x, near.pC.y);
        ctx.stroke();
      }

      // Neon edge glow (left and right)
      if (depthFade > 0.03) {
        const alpha = 0.6 * depthFade;
        const lw = Math.max(0.5, 2.5 * depthFade);

        // Glow layer (thicker, dimmer)
        ctx.strokeStyle = `rgba(${NEON_RGB},${alpha * 0.3})`;
        ctx.lineWidth = lw * 3;
        ctx.beginPath();
        ctx.moveTo(far.pL.x, far.pL.y);
        ctx.lineTo(near.pL.x, near.pL.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(far.pR.x, far.pR.y);
        ctx.lineTo(near.pR.x, near.pR.y);
        ctx.stroke();

        // Core line (bright)
        ctx.strokeStyle = `rgba(${NEON_RGB},${alpha})`;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.moveTo(far.pL.x, far.pL.y);
        ctx.lineTo(near.pL.x, near.pL.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(far.pR.x, far.pR.y);
        ctx.lineTo(near.pR.x, near.pR.y);
        ctx.stroke();
      }

      // Gap edge glow - bright neon line at gap boundaries
      if ((far.gap && !near.gap) || (!far.gap && near.gap)) {
        const edgeP = far.gap ? near : far;
        ctx.strokeStyle = `rgba(${NEON_RGB},${0.8 * depthFade})`;
        ctx.lineWidth = 2 * depthFade;
        ctx.shadowColor = NEON;
        ctx.shadowBlur = 8 * depthFade;
        ctx.beginPath();
        ctx.moveTo(edgeP.pL.x, edgeP.pL.y);
        ctx.lineTo(edgeP.pR.x, edgeP.pR.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;

    // Draw obstacles on track
    drawObstacles3D(points);
  }

  function drawObstacles3D(points) {
    // Collect visible obstacle segments, draw far to near
    const obsData = [];
    const curIdx = Math.floor(distance / SEG_LEN);
    const aheadIdx = curIdx + 100;

    for (let si = curIdx; si <= aheadIdx; si++) {
      const seg = getSegByIdx(si);
      if (!seg || !seg.obstacle) continue;
      const segDist = seg.idx * SEG_LEN;
      const relZ = segDist - distance;
      if (relZ < -2 || relZ > 250) continue;
      obsData.push({ seg, relZ, segDist });
    }

    // Sort far to near
    obsData.sort((a, b) => b.relZ - a.relZ);

    for (const od of obsData) {
      const { seg, relZ } = od;
      const obs = seg.obstacle;
      const depthFade = Math.max(0, 1 - relZ / 250);
      if (depthFade < 0.02) continue;

      drawOneObstacle(obs.x, relZ, depthFade, seg);
      if (obs.x2 !== undefined) {
        drawOneObstacle(obs.x2, relZ, depthFade, seg);
      }
    }
  }

  function drawOneObstacle(ox, relZ, depthFade, seg) {
    const ballTr = interpTrack(distance);
    const relOX = ox + seg.cx - ballTr.cx - ballX;
    const p = project(relOX, relZ);
    const sz = p.s * OBS_SIZE * W * 0.14;
    if (sz < 1.5) return;

    ctx.globalAlpha = depthFade;

    // Shadow on ground
    ctx.fillStyle = `rgba(${RED_RGB},${0.2 * depthFade})`;
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + sz * 0.05, sz * 0.7, sz * 0.15, 0, 0, 6.28);
    ctx.fill();

    // Front face
    const topH = sz * 0.35;
    ctx.fillStyle = '#cc1111';
    ctx.fillRect(p.x - sz / 2, p.y - sz, sz, sz);

    // Top face
    ctx.fillStyle = '#ff3333';
    ctx.beginPath();
    ctx.moveTo(p.x - sz / 2, p.y - sz);
    ctx.lineTo(p.x - sz / 2 + topH * 0.45, p.y - sz - topH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.45, p.y - sz - topH);
    ctx.lineTo(p.x + sz / 2, p.y - sz);
    ctx.closePath();
    ctx.fill();

    // Right face
    ctx.fillStyle = '#991111';
    ctx.beginPath();
    ctx.moveTo(p.x + sz / 2, p.y);
    ctx.lineTo(p.x + sz / 2, p.y - sz);
    ctx.lineTo(p.x + sz / 2 + topH * 0.45, p.y - sz - topH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.45, p.y - topH);
    ctx.closePath();
    ctx.fill();

    // Glow
    ctx.shadowColor = RED_GLOW;
    ctx.shadowBlur = 12 * depthFade;
    ctx.fillStyle = `rgba(${RED_RGB},0.02)`;
    ctx.fillRect(p.x - sz / 2, p.y - sz, sz, sz);
    ctx.shadowBlur = 0;

    // Edge lines
    ctx.strokeStyle = `rgba(${RED_RGB},${0.5 * depthFade})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x - sz / 2, p.y - sz, sz, sz);

    ctx.globalAlpha = 1;
  }

  // --- Ball ---
  function drawBall() {
    const bx = W / 2;
    const by = H * BALL_Y;
    const r = 15;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(bx, by + r * 0.4, r * 1.3, r * 0.3, 0, 0, 6.28);
    ctx.fill();

    // Outer glow
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 25;
    ctx.fillStyle = 'rgba(0,255,0,0.08)';
    ctx.beginPath();
    ctx.arc(bx, by, r * 2.2, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Inner glow ring
    const glowGrad = ctx.createRadialGradient(bx, by, r * 0.3, bx, by, r * 1.8);
    glowGrad.addColorStop(0, 'rgba(0,255,0,0.25)');
    glowGrad.addColorStop(0.6, 'rgba(0,255,0,0.08)');
    glowGrad.addColorStop(1, 'rgba(0,255,0,0)');
    ctx.fillStyle = glowGrad;
    ctx.beginPath();
    ctx.arc(bx, by, r * 1.8, 0, 6.28);
    ctx.fill();

    // Ball body gradient
    const ballGrad = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.35, r * 0.1, bx, by, r);
    ballGrad.addColorStop(0, '#88ff88');
    ballGrad.addColorStop(0.4, '#22dd22');
    ballGrad.addColorStop(0.8, '#00aa00');
    ballGrad.addColorStop(1, '#006600');
    ctx.fillStyle = ballGrad;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(bx - r * 0.25, by - r * 0.3, r * 0.35, 0, 6.28);
    ctx.fill();

    // Rolling lines (subtle rotating arcs)
    const rot = distance * 0.8;
    ctx.strokeStyle = 'rgba(0,180,0,0.25)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 3; i++) {
      const a = rot + i * 2.09;
      ctx.beginPath();
      ctx.arc(bx, by, r * 0.7, a, a + 0.8);
      ctx.stroke();
    }
  }

  // --- Death Particles ---
  function drawDeathParticles() {
    for (const p of deathParticles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.life -= 0.018;
      if (p.life <= 0) continue;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.green ? NEON : '#88ff88';
      ctx.shadowColor = NEON;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, 6.28);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    deathParticles = deathParticles.filter(p => p.life > 0);
  }

  // --- HUD ---
  function drawHUD() {
    // Score
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px Segoe UI, Arial, sans-serif';
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.fillText(Math.floor(distance) + ' m', W / 2, 38);
    ctx.shadowBlur = 0;

    // Speed indicator
    const sp = speed.toFixed(1);
    ctx.font = '14px Segoe UI, Arial, sans-serif';
    const fast = speed > 12;
    ctx.fillStyle = fast ? '#ff4444' : NEON;
    if (fast) {
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 6;
    }
    ctx.fillText('Speed: ' + sp, W / 2, 58);
    ctx.shadowBlur = 0;

    // Best score (top right)
    if (bestScore > 0) {
      ctx.textAlign = 'right';
      ctx.font = '13px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#888';
      ctx.fillText('Best: ' + bestScore + ' m', W - 14, 30);
    }
  }

  // --- Menu ---
  let menuAnim = 0;
  function drawMenuScene() {
    menuAnim += 0.015;

    // Draw a preview track
    const fakeSegs = 80;
    for (let i = fakeSegs; i >= 1; i--) {
      const zFar = i * 1.5;
      const zNear = (i - 1) * 1.5;
      const waveFar = Math.sin((zFar + menuAnim * 40) * 0.06) * 2;
      const waveNear = Math.sin((zNear + menuAnim * 40) * 0.06) * 2;
      const depthFade = Math.max(0, 1 - zFar / (fakeSegs * 1.5));

      const pLF = project(waveFar - TRACK_HW, zFar);
      const pRF = project(waveFar + TRACK_HW, zFar);
      const pLN = project(waveNear - TRACK_HW, zNear);
      const pRN = project(waveNear + TRACK_HW, zNear);

      ctx.fillStyle = i % 2 === 0 ? TRACK_FILL_A : TRACK_FILL_B;
      ctx.globalAlpha = 0.25 + depthFade * 0.35;
      ctx.beginPath();
      ctx.moveTo(pLF.x, pLF.y);
      ctx.lineTo(pRF.x, pRF.y);
      ctx.lineTo(pRN.x, pRN.y);
      ctx.lineTo(pLN.x, pLN.y);
      ctx.closePath();
      ctx.fill();

      if (depthFade > 0.08) {
        ctx.globalAlpha = 0.25 * depthFade;
        ctx.strokeStyle = NEON;
        ctx.lineWidth = 1.5 * depthFade;
        ctx.beginPath(); ctx.moveTo(pLF.x, pLF.y); ctx.lineTo(pLN.x, pLN.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pRF.x, pRF.y); ctx.lineTo(pRN.x, pRN.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // Overlay
    ctx.fillStyle = 'rgba(4,4,10,0.5)';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.save();
    const pulse = 1 + Math.sin(performance.now() * 0.003) * 0.04;
    ctx.translate(W / 2, H * 0.24);
    ctx.scale(pulse, pulse);
    ctx.font = 'bold 68px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 40;
    ctx.fillStyle = NEON;
    ctx.fillText('SLOPE', 0, 0);
    ctx.shadowBlur = 15;
    ctx.fillText('SLOPE', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Ball icon
    const bx = W / 2, by = H * 0.38;
    const bgr = ctx.createRadialGradient(bx - 4, by - 4, 2, bx, by, 20);
    bgr.addColorStop(0, '#88ff88');
    bgr.addColorStop(0.5, '#00cc00');
    bgr.addColorStop(1, '#006600');
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 20;
    ctx.fillStyle = bgr;
    ctx.beginPath();
    ctx.arc(bx, by, 20, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Specular
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(bx - 6, by - 6, 7, 0, 6.28);
    ctx.fill();

    // Instructions
    ctx.font = '17px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#7a7a9a';
    ctx.textAlign = 'center';
    ctx.fillText('Arrow Keys / A-D to steer', W / 2, H * 0.50);
    ctx.fillText('Tap left/right on mobile', W / 2, H * 0.55);

    // Best score
    if (bestScore > 0) {
      ctx.font = 'bold 16px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = NEON;
      ctx.shadowColor = NEON;
      ctx.shadowBlur = 8;
      ctx.fillText('Best: ' + bestScore + ' m', W / 2, H * 0.63);
      ctx.shadowBlur = 0;
    }

    // Start prompt
    const blink = Math.sin(performance.now() * 0.004) * 0.4 + 0.6;
    ctx.globalAlpha = blink;
    ctx.font = 'bold 20px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 12;
    ctx.fillText('Press any key or tap to start', W / 2, H * 0.76);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // --- Game Over ---
  function drawGameOver() {
    const score = Math.floor(distance);

    ctx.fillStyle = 'rgba(4,4,10,0.7)';
    ctx.fillRect(0, 0, W, H);

    // Panel
    const pw = 280, ph = 230;
    const px = (W - pw) / 2, py = (H - ph) / 2 - 20;
    ctx.fillStyle = '#0a0a18';
    ctx.strokeStyle = NEON_DIM;
    ctx.lineWidth = 2;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    roundRect(ctx, px, py, pw, ph, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';

    // Title
    ctx.font = 'bold 30px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 10;
    ctx.fillText('Game Over', W / 2, py + 48);
    ctx.shadowBlur = 0;

    // Score
    ctx.font = 'bold 40px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(score + ' m', W / 2, py + 100);

    // Best
    ctx.font = '16px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 6;
    ctx.fillText('Best: ' + bestScore + ' m', W / 2, py + 130);
    ctx.shadowBlur = 0;

    // New best indicator
    if (score >= bestScore && score > 0) {
      ctx.font = 'bold 14px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText('NEW BEST!', W / 2, py + 152);
    }

    // Play again
    const bw = 180, bh = 44;
    const bbx = (W - bw) / 2, bby = py + 168;
    const blink = Math.sin(performance.now() * 0.005) * 0.15 + 0.85;
    ctx.globalAlpha = blink;
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    roundRect(ctx, bbx, bby, bw, bh, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.font = 'bold 18px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#0a0a18';
    ctx.fillText('Play Again', W / 2, bby + 29);
  }

  // roundRect helper
  function roundRect(c, x, y, w, h, r) {
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  // --- Game Loop ---
  function loop(ts) {
    requestAnimationFrame(loop);
    const dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    if (state === 'play') update(dt);
    draw();
  }

  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
