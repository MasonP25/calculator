<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<script src="slope-build/TemplateData/unityloader41.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;overflow-y:auto;overflow-x:hidden;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem}
a.back{position:fixed;top:14px;left:14px;z-index:10001;color:#aaa;text-decoration:none;font-size:15px;background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 14px;border-radius:8px;transition:background .2s,color .2s}
a.back:hover{background:#2a2a4a;color:#fff}
h1.title{color:#0f0;font-size:28px;margin:10px 0 12px;text-shadow:0 0 20px rgba(0,255,0,0.4);text-align:center}
#game-wrapper{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;border:2px solid #2a2a4a;border-radius:12px;overflow:hidden;background:#231F20;box-shadow:0 0 30px rgba(0,0,0,0.6)}
#gameContainer{width:100%;height:100%}
#gameContainer canvas{width:100%!important;height:100%!important}
#gameContainer .logo,
#gameContainer .progress{display:none!important}
/* Bar covering Unity's built-in score at top center */
#score-cover{position:absolute;top:0;left:50%;transform:translateX(-50%);width:200px;height:48px;background:#231F20;z-index:10;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:center;pointer-events:none}
#our-score{color:#0f0;font-size:22px;font-weight:bold;text-shadow:0 0 10px rgba(0,255,0,0.5);font-family:'Segoe UI',Arial,sans-serif}
/* Loading overlay - blocks view while loading, then becomes click-through */
#loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity 0.5s;border-radius:12px}
#loading-overlay.click-through{pointer-events:none;cursor:pointer}
#loading-overlay.hidden{opacity:0;pointer-events:none}
#loading-overlay h2{color:#0f0;font-size:36px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:20px}
.loader{width:36px;height:36px;border:3px solid transparent;border-top:3px solid #0f0;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{color:#888;margin-top:12px;font-size:13px}
#click-prompt{display:none;color:#0f0;font-size:20px;margin-top:20px;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
/* Game over overlay */
#gameover-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:15;border-radius:12px}
#gameover-overlay.visible{display:flex}
#gameover-overlay h2{color:#0f0;font-size:36px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:8px}
#gameover-time{color:#ccc;font-size:28px;margin-bottom:6px}
#gameover-best{color:#888;font-size:16px;margin-bottom:24px}
#play-again-btn{background:none;border:2px solid #0f0;color:#0f0;font-size:20px;padding:12px 40px;border-radius:8px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:2px;transition:all 0.2s;text-shadow:0 0 8px rgba(0,255,0,0.4)}
#play-again-btn:hover{background:#0f0;color:#111;text-shadow:none;box-shadow:0 0 20px rgba(0,255,0,0.5)}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<h1 class="title">SLOPE</h1>

<div id="game-wrapper">
  <div id="loading-overlay">
    <h2>SLOPE</h2>
    <div class="loader" id="load-spinner"></div>
    <div id="loading-text">Loading game...</div>
    <div id="click-prompt">Click here to play</div>
  </div>

  <div id="gameover-overlay">
    <h2>GAME OVER</h2>
    <div id="gameover-time"></div>
    <div id="gameover-best"></div>
    <button id="play-again-btn">Play Again</button>
  </div>

  <!-- Covers Unity's built-in score, shows our timer instead -->
  <div id="score-cover">
    <span id="our-score">0.0s</span>
  </div>

  <div id="gameContainer"></div>
</div>

<script>
var gameLoaded = false;
var gameStarted = false;
var gameActive = false;
var lastInputTime = 0;
var deathCheckInterval = null;
var menuReady = false;

// Timer-based scoring
var startTime = 0;
var currentTime = 0;
var timerInterval = null;

function UnityProgress(inst, progress) {
  var txt = document.getElementById('loading-text');
  if (txt && typeof progress === 'number') {
    txt.textContent = 'Loading... ' + Math.floor(progress * 100) + '%';
  }
  if ((progress === 1 || progress === 'complete') && !gameLoaded) {
    gameLoaded = true;
    // Wait for menu to render, then make overlay click-through
    setTimeout(enableClickThrough, 2000);
  }
}

var gameInstance = UnityLoader.instantiate('gameContainer', 'slope-build/Build/slope.json', {
  onProgress: UnityProgress,
  Module: {
    onRuntimeInitialized: function() {
      UnityProgress(gameInstance, 'complete');
    }
  }
});

function enableClickThrough() {
  var canvas = document.querySelector('#gameContainer canvas');
  if (!canvas) {
    setTimeout(enableClickThrough, 500);
    return;
  }

  // Disable branding
  disableBranding();

  // The overlay stays visually opaque (user can't see the ugly menu)
  // but becomes pointer-events:none so their REAL click passes through
  // to Unity's Play button underneath
  var overlay = document.getElementById('loading-overlay');
  var spinner = document.getElementById('load-spinner');
  var loadText = document.getElementById('loading-text');
  var clickPrompt = document.getElementById('click-prompt');

  // Switch from "Loading..." to "Click to Play"
  if (spinner) spinner.style.display = 'none';
  if (loadText) loadText.style.display = 'none';
  if (clickPrompt) clickPrompt.style.display = 'block';

  // Make overlay click-through - user's real click goes to Unity canvas
  if (overlay) overlay.classList.add('click-through');

  menuReady = true;
  canvas.focus();

  // Start monitoring for game start
  startDeathDetection();
}

// --- Timer ---
function startTimer() {
  startTime = Date.now();
  var scoreEl = document.getElementById('our-score');
  timerInterval = setInterval(function() {
    currentTime = ((Date.now() - startTime) / 1000);
    if (scoreEl) scoreEl.textContent = currentTime.toFixed(1) + 's';
  }, 100);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  currentTime = ((Date.now() - startTime) / 1000);
}

// --- Game Over Detection ---
function startDeathDetection() {
  if (deathCheckInterval) return;
  deathCheckInterval = setInterval(function() {
    if (!gameActive) return;
    var now = Date.now();
    if (lastInputTime > 0 && (now - lastInputTime) > 1500) {
      showGameOver();
    }
  }, 500);
}

function showGameOver() {
  gameActive = false;
  stopTimer();

  var finalScore = Math.round(currentTime);
  var overlay = document.getElementById('gameover-overlay');
  if (overlay) overlay.classList.add('visible');

  var timeEl = document.getElementById('gameover-time');
  if (timeEl) timeEl.textContent = currentTime.toFixed(1) + ' seconds';

  // Submit to leaderboard
  if (finalScore > 0) {
    try { HallOfFame.submit('slope', finalScore); } catch(e) {}
  }

  // Show best score from leaderboard
  var bestEl = document.getElementById('gameover-best');
  if (bestEl) {
    try {
      var scores = HallOfFame.getScores('slope');
      if (scores && scores.length > 0) {
        var best = scores[0].score;
        if (finalScore >= best) {
          bestEl.textContent = 'New Best!';
          bestEl.style.color = '#0f0';
        } else {
          bestEl.textContent = 'Best: ' + best + 's';
          bestEl.style.color = '#888';
        }
      }
    } catch(e) {
      bestEl.textContent = '';
    }
  }

  if (window.SFX && window.SFX.death) window.SFX.death();
}

function restartGame() {
  var btn = document.getElementById('play-again-btn');
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="loader" style="width:20px;height:20px;display:inline-block;vertical-align:middle;margin-right:10px"></span> Restarting...';
  }
  setTimeout(function() { location.reload(); }, 300);
}

document.getElementById('play-again-btn').addEventListener('click', restartGame);

function disableBranding() {
  if (!gameInstance) return;
  var objs = ['Branding', 'BrandingScript', 'Y8Branding', 'Branding_Y8',
    'Branding_Y8_MoreGames', 'Branding_IDnet', 'IDnetObject',
    'y8_logo', 'y8_logo_moregames', 'idnet_logo', 'PromoScreen',
    'IDNETLogin', 'IdnetSample', 'IdnetWrap', 'Leaderboard'];
  for (var i = 0; i < objs.length; i++) {
    try { gameInstance.SendMessage(objs[i], 'SetActive', '0'); } catch(e) {}
  }
  try { gameInstance.SendMessage('Branding', 'DisableMoreGames'); } catch(e) {}
  try { gameInstance.SendMessage('Y8Branding', 'DisableY8Link'); } catch(e) {}
}

// Track gameplay input
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') {
    if (!gameStarted) {
      gameStarted = true;
      gameActive = true;
      startTimer();
      // Hide the loading overlay now that the game is running
      var overlay = document.getElementById('loading-overlay');
      if (overlay) {
        overlay.classList.add('hidden');
        setTimeout(function() { overlay.style.display = 'none'; }, 600);
      }
      disableBranding();
      setTimeout(disableBranding, 2000);
      setTimeout(disableBranding, 5000);
    }
    lastInputTime = Date.now();
    gameActive = true;
  }
});

document.addEventListener('touchstart', function(e) {
  if (gameLoaded && !gameStarted) {
    gameStarted = true;
    gameActive = true;
    startTimer();
    var overlay = document.getElementById('loading-overlay');
    if (overlay) {
      overlay.classList.add('hidden');
      setTimeout(function() { overlay.style.display = 'none'; }, 600);
    }
    disableBranding();
    setTimeout(disableBranding, 2000);
  }
  if (gameStarted) {
    lastInputTime = Date.now();
    gameActive = true;
  }
});
</script>

<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
