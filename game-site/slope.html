<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a1a;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
canvas { display: block; margin: 0 auto; }
a.back {
  position: fixed; top: 14px; left: 14px; z-index: 100;
  color: #aaa; text-decoration: none; font-size: 15px;
  background: #1a1a2e; border: 1px solid #2a2a4a;
  padding: 6px 14px; border-radius: 8px;
  transition: background .2s, color .2s;
}
a.back:hover { background: #2a2a4a; color: #fff; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  // ---- Constants ----
  var SEG_LEN = 200;
  var DRAW_DIST = 300;
  var TRACK_W = 1200;
  var CAM_H = 1200;
  var FOV_RAD = (80 / 2) * Math.PI / 180;
  var CAM_DEPTH = 1 / Math.tan(FOV_RAD);

  // ---- State ----
  var state = 'menu';
  var segments = [];
  var totalCreated = 0;
  var playerX = 0;
  var playerVX = 0;
  var position = 0;
  var speed = 0;
  var BASE_SPEED = 180;
  var MAX_SPEED = 500;
  var score = 0;
  var bestScore = parseInt(localStorage.getItem('slope_best') || '0', 10);
  var stars = [];
  var deadTimer = 0;
  var menuPulse = 0;

  // Track generation state
  var curveTarget = 0, curveValue = 0, curveDur = 0;
  var hillPhase = 0, hillAmp = 0, hillTarget = 0, hillDur = 0;
  var nextObstacle = 50;

  // Input
  var keyLeft = false, keyRight = false;
  var tLeft = false, tRight = false;

  // ---- Canvas sizing ----
  function resize() {
    canvas.width = Math.min(window.innerWidth, 960);
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Stars ----
  function initStars() {
    stars = [];
    for (var i = 0; i < 120; i++) {
      stars.push({
        x: Math.random(),
        y: Math.random() * 0.45,
        s: Math.random() * 1.6 + 0.5,
        b: Math.random() * 0.5 + 0.5
      });
    }
  }
  initStars();

  // ---- Track generation ----
  function genSegment() {
    var seg = { index: totalCreated, curve: 0, y: 0, obstacle: null };

    // Curves - first 40 segments are straight
    if (totalCreated < 40) {
      seg.curve = 0;
    } else {
      if (curveDur <= 0) {
        curveTarget = (Math.random() - 0.5) * 5;
        curveDur = 40 + Math.random() * 80;
      }
      curveValue += (curveTarget - curveValue) * 0.03;
      curveDur--;
      seg.curve = curveValue;
    }

    // Hills
    if (hillDur <= 0) {
      hillTarget = (Math.random() - 0.5) * 4000;
      hillDur = 50 + Math.random() * 100;
    }
    hillAmp += (hillTarget - hillAmp) * 0.02;
    hillDur--;
    hillPhase += 0.02;
    seg.y = Math.sin(hillPhase) * hillAmp;

    // Obstacles after initial safe zone
    if (totalCreated > 80) {
      nextObstacle--;
      if (nextObstacle <= 0) {
        var diff = Math.min(speed / MAX_SPEED, 1);
        var lanePos = (Math.floor(Math.random() * 3) - 1) * 0.55;
        seg.obstacle = {
          x: lanePos,
          w: 0.18 + Math.random() * 0.14,
          h: 280 + Math.random() * 220
        };
        var gap = Math.max(14, 45 - diff * 25);
        nextObstacle = gap + Math.floor(Math.random() * gap * 0.5);
        // Doubles at high speed
        if (diff > 0.4 && Math.random() < diff * 0.25) {
          nextObstacle = Math.max(10, 22 - diff * 10);
        }
      }
    }

    segments.push(seg);
    totalCreated++;
  }

  function ensureSegments() {
    var curIdx = Math.floor(position / SEG_LEN);
    var needed = curIdx + DRAW_DIST + 60;
    while (totalCreated < needed) genSegment();
    // Trim old
    while (segments.length > DRAW_DIST + 250 && segments[0].index < curIdx - 30) {
      segments.shift();
    }
  }

  function getSeg(index) {
    if (segments.length === 0) return null;
    var off = index - segments[0].index;
    if (off < 0 || off >= segments.length) return null;
    return segments[off];
  }

  // ---- Reset ----
  function resetGame() {
    segments = [];
    totalCreated = 0;
    curveTarget = 0; curveValue = 0; curveDur = 0;
    hillPhase = 0; hillAmp = 0; hillTarget = 0; hillDur = 0;
    nextObstacle = 50;
    playerX = 0;
    playerVX = 0;
    position = 0;
    speed = BASE_SPEED;
    score = 0;
    deadTimer = 0;
    ensureSegments();
  }

  // ---- Input ----
  document.addEventListener('keydown', function(e) {
    if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = true;
    if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = true;
    if (e.code === 'Space') { e.preventDefault(); handleAction(); }
  });
  document.addEventListener('keyup', function(e) {
    if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keyLeft = false;
    if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keyRight = false;
  });

  canvas.addEventListener('mousedown', function(e) {
    e.preventDefault();
    if (state !== 'playing') { handleAction(); return; }
    if (e.clientX < canvas.width / 2) tLeft = true; else tRight = true;
  });
  canvas.addEventListener('mouseup', function() { tLeft = false; tRight = false; });
  canvas.addEventListener('mouseleave', function() { tLeft = false; tRight = false; });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (state !== 'playing') { handleAction(); return; }
    for (var i = 0; i < e.touches.length; i++) {
      var rect = canvas.getBoundingClientRect();
      if (e.touches[i].clientX - rect.left < canvas.width / 2) tLeft = true; else tRight = true;
    }
  }, { passive: false });
  canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    tLeft = false; tRight = false;
    for (var i = 0; i < e.touches.length; i++) {
      var rect = canvas.getBoundingClientRect();
      if (e.touches[i].clientX - rect.left < canvas.width / 2) tLeft = true; else tRight = true;
    }
  }, { passive: false });

  function handleAction() {
    if (state === 'menu') {
      resetGame();
      state = 'playing';
    } else if (state === 'dead' && deadTimer > 0.5) {
      resetGame();
      state = 'playing';
    }
  }

  // ---- Update ----
  function update(dt) {
    if (state !== 'playing') {
      menuPulse += dt * 3;
      if (state === 'dead') deadTimer += dt;
      return;
    }

    // Accelerate
    speed += dt * 3.5;
    if (speed > MAX_SPEED) speed = MAX_SPEED;

    // Move forward
    position += speed * dt * 60;
    score = Math.floor(position / SEG_LEN);

    ensureSegments();

    // Current segment for curve
    var segIdx = Math.floor(position / SEG_LEN);
    var seg = getSeg(segIdx);

    // Steering
    var steerIn = (keyLeft || tLeft ? -1 : 0) + (keyRight || tRight ? 1 : 0);
    playerVX += steerIn * 5.0 * dt;
    playerVX *= Math.pow(0.88, dt * 60); // friction

    // Centrifugal force
    if (seg) {
      playerVX += seg.curve * speed * 0.00010;
    }

    playerX += playerVX * dt * 60;

    // Off track = death
    if (Math.abs(playerX) > 1.05) { die(); return; }

    // Obstacle collision
    for (var ci = segIdx - 1; ci <= segIdx + 3; ci++) {
      var cs = getSeg(ci);
      if (!cs || !cs.obstacle) continue;
      var sStart = ci * SEG_LEN;
      var sEnd = sStart + SEG_LEN;
      if (position >= sStart - SEG_LEN * 0.4 && position <= sEnd) {
        var obs = cs.obstacle;
        var hw = obs.w / 2;
        if (playerX > obs.x - hw - 0.07 && playerX < obs.x + hw + 0.07) {
          die();
          return;
        }
      }
    }
  }

  function die() {
    state = 'dead';
    deadTimer = 0;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('slope_best', bestScore.toString());
    }
    if (score > 0 && window.HallOfFame) {
      window.HallOfFame.submit('slope', score);
    }
    if (window.SFX && window.SFX.death) window.SFX.death();
  }

  // ---- Rendering ----
  function render() {
    var W = canvas.width, H = canvas.height;

    // Sky gradient
    var grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(0.6, '#12123a');
    grad.addColorStop(1, '#1a1a3e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // Stars
    var now = Date.now();
    for (var si = 0; si < stars.length; si++) {
      var st = stars[si];
      var flick = 0.75 + 0.25 * Math.sin(now * 0.001 + st.x * 80);
      ctx.globalAlpha = st.b * flick;
      ctx.fillStyle = '#fff';
      ctx.fillRect(st.x * W, st.y * H, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    if (state === 'menu') { renderMenu(W, H); return; }

    renderRoad(W, H);
    renderHUD(W, H);

    if (state === 'dead') renderDead(W, H);
  }

  function renderRoad(W, H) {
    var baseIdx = Math.floor(position / SEG_LEN);
    var cameraZ = position - CAM_DEPTH * CAM_H;
    var cameraY = CAM_H;
    var cameraX = playerX * TRACK_W * 0.5;

    // Project all visible segments
    var proj = new Array(DRAW_DIST + 1);
    var curveAccum = 0;

    for (var n = DRAW_DIST; n >= 0; n--) {
      var idx = baseIdx + n;
      var seg = getSeg(idx);
      if (!seg) continue;

      var segZ = idx * SEG_LEN;
      var worldY = seg.y || 0;
      var relZ = segZ - cameraZ;
      if (relZ <= 0) continue;

      var scale = (CAM_DEPTH * H) / relZ;
      var sx = W / 2 + scale * (-cameraX + curveAccum * TRACK_W);
      var sy = H / 2 - scale * (worldY - cameraY);
      var sw = scale * TRACK_W;

      curveAccum += (seg.curve || 0) * 0.002;

      proj[n] = { x: sx, y: sy, w: sw, scale: scale, seg: seg, idx: idx, relZ: relZ };
    }

    // Draw back-to-front
    for (var n = DRAW_DIST - 1; n >= 0; n--) {
      var p1 = proj[n + 1];
      var p2 = proj[n];
      if (!p1 || !p2) continue;

      var fog = Math.min(1, Math.pow(n / DRAW_DIST, 2.5));
      var alt = (p2.idx % 2 === 0);

      // Grass
      ctx.fillStyle = alt ? lerpC(13, 94, 26, fog) : lerpC(10, 77, 21, fog);
      ctx.fillRect(0, Math.min(p2.y, p1.y), W, Math.abs(p1.y - p2.y) + 2);

      // Road
      ctx.fillStyle = alt ? lerpC(26, 138, 58, fog) : lerpC(34, 170, 68, fog);
      trapezoid(p1.x, p1.y, p1.w * 0.52, p2.x, p2.y, p2.w * 0.52);

      // Edge rumble strips
      var edgeA = alt ? 255 : 200;
      ctx.fillStyle = lerpC(0, edgeA, alt ? 68 : 51, fog);
      var ew1 = p1.w * 0.028;
      var ew2 = p2.w * 0.028;
      trapezoid(p1.x - p1.w * 0.52, p1.y, ew1, p2.x - p2.w * 0.52, p2.y, ew2);
      trapezoid(p1.x + p1.w * 0.52 - ew1, p1.y, ew1, p2.x + p2.w * 0.52 - ew2, p2.y, ew2);

      // Center dashes
      if (alt && n % 4 < 2) {
        ctx.fillStyle = lerpC(51, 255, 102, fog * 1.3);
        var dw1 = p1.w * 0.006;
        var dw2 = p2.w * 0.006;
        trapezoid(p1.x - dw1, p1.y, dw1 * 2, p2.x - dw2, p2.y, dw2 * 2);
      }

      // Obstacles
      var segObs = p2.seg;
      if (segObs && segObs.obstacle && n < DRAW_DIST - 5) {
        var ob = segObs.obstacle;
        var oScale = p2.scale;
        var ox = p2.x + ob.x * p2.w * 0.5;
        var ohw = ob.w * p2.w * 0.25;
        var oh = ob.h * oScale;

        if (oh > 1 && ohw > 0.5) {
          var oAlpha = 1 - fog;
          if (oAlpha > 0.02) {
            ctx.globalAlpha = oAlpha;

            // Shadow on ground
            ctx.fillStyle = 'rgba(0,0,0,0.35)';
            ctx.fillRect(ox - ohw + 2, p2.y - 2, ohw * 2 + 4, 4);

            // Main front face
            ctx.fillStyle = '#cc2222';
            ctx.fillRect(ox - ohw, p2.y - oh, ohw * 2, oh);

            // Top highlight
            ctx.fillStyle = '#ee4444';
            var topH = Math.max(2, oh * 0.12);
            ctx.fillRect(ox - ohw, p2.y - oh - topH * 0.25, ohw * 2, topH * 0.3);

            // Right side darker
            ctx.fillStyle = '#881111';
            ctx.fillRect(ox + ohw * 0.65, p2.y - oh, ohw * 0.35, oh);

            // Left edge highlight
            ctx.fillStyle = 'rgba(255,120,120,0.35)';
            ctx.fillRect(ox - ohw, p2.y - oh, Math.max(1, ohw * 0.08), oh);

            ctx.globalAlpha = 1;
          }
        }
      }
    }

    // Ball
    var ballY = H * 0.72;
    var ballX = W / 2 + playerX * W * 0.25;
    var ballR = 16;

    ctx.save();
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 28;
    ctx.beginPath();
    ctx.arc(ballX, ballY, ballR, 0, Math.PI * 2);
    var bg = ctx.createRadialGradient(ballX - 4, ballY - 5, 2, ballX, ballY, ballR);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.45, '#ccffdd');
    bg.addColorStop(1, '#55bb77');
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();

    // Ball specular highlight
    ctx.beginPath();
    ctx.arc(ballX - 4, ballY - 5, ballR * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.fill();
  }

  function renderHUD(W, H) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(score + ' m', W / 2 + 2, 52);
    ctx.fillStyle = '#fff';
    ctx.fillText(score + ' m', W / 2, 50);

    var pct = Math.floor((speed / MAX_SPEED) * 100);
    ctx.textAlign = 'right';
    ctx.font = '14px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#88ffaa';
    ctx.fillText(pct + '% speed', W - 20, 30);
  }

  function renderMenu(W, H) {
    var pulse = 0.85 + 0.15 * Math.sin(menuPulse);

    ctx.save();
    ctx.textAlign = 'center';
    ctx.shadowColor = '#00ff88';
    ctx.shadowBlur = 40 * pulse;
    ctx.font = 'bold ' + Math.floor(80 * pulse) + 'px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#00ff66';
    ctx.fillText('SLOPE', W / 2, H * 0.38);
    ctx.shadowBlur = 0;

    ctx.font = '20px "Segoe UI", Arial, sans-serif';
    var alpha = 0.5 + 0.3 * Math.sin(menuPulse * 1.5);
    ctx.fillStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.fillText('Click or press Space to play', W / 2, H * 0.50);

    ctx.font = '15px "Segoe UI", Arial, sans-serif';
    ctx.fillStyle = '#667788';
    ctx.fillText('Arrow Keys / A, D to steer', W / 2, H * 0.60);
    ctx.fillText('Avoid obstacles and stay on the track', W / 2, H * 0.65);

    if (bestScore > 0) {
      ctx.font = '16px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#88ffaa';
      ctx.fillText('Best: ' + bestScore + ' m', W / 2, H * 0.74);
    }
    ctx.restore();
  }

  function renderDead(W, H) {
    var alpha = Math.min(0.7, deadTimer * 2);
    ctx.fillStyle = 'rgba(0,0,0,' + alpha + ')';
    ctx.fillRect(0, 0, W, H);

    if (deadTimer > 0.3) {
      ctx.textAlign = 'center';

      ctx.save();
      ctx.shadowColor = '#ff3333';
      ctx.shadowBlur = 30;
      ctx.font = 'bold 56px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#ff4444';
      ctx.fillText('GAME OVER', W / 2, H * 0.36);
      ctx.shadowBlur = 0;
      ctx.restore();

      ctx.font = 'bold 30px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#fff';
      ctx.fillText('Score: ' + score + ' m', W / 2, H * 0.48);

      ctx.font = '22px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#88ffaa';
      ctx.fillText('Best: ' + bestScore + ' m', W / 2, H * 0.55);

      if (deadTimer > 0.6) {
        var blink = 0.5 + 0.5 * Math.sin(now * 0.005);
        ctx.font = '18px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,' + blink + ')';
        ctx.fillText('Click or press Space to play again', W / 2, H * 0.66);
      }
    }
  }

  // ---- Helpers ----
  function trapezoid(x1, y1, w1, x2, y2, w2) {
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1);
    ctx.lineTo(x1 + w1, y1);
    ctx.lineTo(x2 + w2, y2);
    ctx.lineTo(x2 - w2, y2);
    ctx.closePath();
    ctx.fill();
  }

  // Fast lerp color toward #0a0a1a background by fog factor
  function lerpC(r, g, b, t) {
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var br = 10, bg2 = 10, bb = 26;
    var rr = Math.round(r + (br - r) * t);
    var gg = Math.round(g + (bg2 - g) * t);
    var bv = Math.round(b + (bb - b) * t);
    return 'rgb(' + rr + ',' + gg + ',' + bv + ')';
  }

  // ---- Game Loop ----
  var lastTime = 0;
  var now = 0;

  function loop(time) {
    now = time;
    var dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
