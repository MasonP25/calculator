<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0f0f1a;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: none;
  user-select: none;
}
canvas { display: block; border-radius: 8px; }
.back {
  position: fixed; top: 16px; left: 16px;
  color: #0f0; text-decoration: none; font-size: 18px;
  z-index: 100; font-weight: bold;
  text-shadow: 0 0 8px rgba(0,255,0,0.5);
}
.back:hover { text-shadow: 0 0 16px rgba(0,255,0,0.8); }
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<canvas id="c"></canvas>
<script>
(function() {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');

  var W, H;
  function resize() {
    W = Math.min(window.innerWidth, 500);
    H = Math.min(window.innerHeight, 700);
    canvas.width = W;
    canvas.height = H;
  }
  resize();
  window.addEventListener('resize', resize);

  // --- Constants ---
  var BASE_SPEED = 5.5;
  var GRAVITY = 28;
  var TRACK_HW = 2.0;
  var SEG_LEN = 2.0;
  var NUM_SEGS = 250;
  var FOCAL = 5.0;
  var VP_Y = 0.10;
  var BALL_SCREEN_Y = 0.76;
  var BALL_RAD = 0.26;

  var NEON = '#0f0';
  var NEON_RGB = '0,255,0';
  var RED_GLOW = '#ff2222';
  var RED_RGB = '255,34,34';
  var TRACK_COLOR = '#0d1a0d';
  var TRACK_EDGE = 'rgba(0,255,0,';

  // --- State ---
  var state = 'menu';
  var distance = 0;
  var bestScore = parseInt(localStorage.getItem('slope_best')) || 0;
  var ballX = 0;
  var ballY = 0; // Y offset from track surface (0 = on track, positive = above)
  var ballVY = 0; // vertical velocity
  var airborne = false;
  var speed = BASE_SPEED;
  var steerDir = 0;
  var shakeTimer = 0;
  var lastTime = 0;
  var deathParticles = [];
  var coinEarned = false;

  // Track generation state
  var track = [];
  var trackGenIndex = 0;
  var curveAccum = 0;
  var curveTarget = 0;
  var curveVel = 0;
  var tiltAccum = 0;
  var tiltTarget = 0;
  var heightAccum = 0; // track Y height in world
  var heightTarget = 0;
  var heightVel = 0;

  // Obstacle types
  var OBS_BLOCK = 0;       // standard red block
  var OBS_WALL_LEFT = 1;   // wall on left half
  var OBS_WALL_RIGHT = 2;  // wall on right half
  var OBS_PILLAR = 3;      // thin tall pillar
  var OBS_LOW_BAR = 4;     // low wide bar (must time around)
  var OBS_DOUBLE = 5;      // two blocks with gap between
  var OBS_TRIPLE = 6;      // three pillars

  // --- Track Generation ---
  function genSegment(idx) {
    var segDist = idx * SEG_LEN;

    // Curve evolution
    if (Math.random() < 0.02 + Math.min(distance * 0.00003, 0.04)) {
      curveTarget = (Math.random() - 0.5) * 5;
    }
    curveVel += (curveTarget - curveAccum) * 0.015;
    curveVel *= 0.95;
    curveAccum += curveVel;

    // Tilt / banking
    if (Math.random() < 0.012) {
      tiltTarget = (Math.random() - 0.5) * 0.5;
    }
    tiltAccum += (tiltTarget - tiltAccum) * 0.03;

    // Height evolution - track goes DOWN over time with variations
    if (Math.random() < 0.015) {
      heightTarget = heightAccum - (1 + Math.random() * 3); // mostly downward
      if (Math.random() < 0.15) heightTarget = heightAccum + 0.5; // occasional small rise
    }
    heightVel += (heightTarget - heightAccum) * 0.008;
    heightVel *= 0.97;
    heightAccum += heightVel;

    // Gaps - next section is LOWER so gravity lands you
    var isGap = false;
    var gapDrop = 0;
    if (segDist > 100) {
      var gapCycle = Math.max(45, 120 - distance * 0.025);
      var gapLen = 4 + Math.min(distance * 0.003, 4);
      var gapPhase = segDist % gapCycle;
      if (gapPhase < gapLen) {
        isGap = true;
      }
      // Drop the height after each gap so landing works
      if (gapPhase >= 0 && gapPhase < SEG_LEN && gapPhase < 1) {
        heightAccum -= (2 + Math.random() * 2);
        heightTarget = heightAccum;
      }
    }

    // Obstacles - 1.5x more frequent, more variety
    var obstacle = null;
    if (segDist > 25 && !isGap) {
      var freq = Math.max(4, 20 - distance * 0.012);
      var segInterval = Math.max(2, Math.floor(freq / SEG_LEN));
      if (idx % segInterval === 0 && Math.random() < 0.7) {
        var hw = TRACK_HW;
        var difficulty = Math.min(distance / 500, 1);
        var typeRoll = Math.random();

        if (typeRoll < 0.25) {
          // Standard block - left, right, or offset
          var side = Math.random();
          var ox = side < 0.4 ? -hw * 0.5 : side < 0.8 ? hw * 0.5 : (Math.random() - 0.5) * hw * 0.6;
          obstacle = { type: OBS_BLOCK, x: ox, w: 0.55, h: 0.55 };
        } else if (typeRoll < 0.40) {
          // Wall on one side - must go to other side
          var left = Math.random() < 0.5;
          obstacle = { type: left ? OBS_WALL_LEFT : OBS_WALL_RIGHT, x: left ? -hw * 0.35 : hw * 0.35, w: hw * 0.8, h: 0.7 };
        } else if (typeRoll < 0.52) {
          // Thin pillar
          var px = (Math.random() - 0.5) * hw * 1.2;
          obstacle = { type: OBS_PILLAR, x: px, w: 0.25, h: 0.9 };
        } else if (typeRoll < 0.62) {
          // Low wide bar across most of the track
          obstacle = { type: OBS_LOW_BAR, x: 0, w: hw * 1.5, h: 0.3 };
        } else if (typeRoll < 0.80) {
          // Double blocks with a gap in between
          var gapCenter = (Math.random() - 0.5) * hw * 0.6;
          var gapW = 0.6 + (1 - difficulty) * 0.3;
          obstacle = { type: OBS_DOUBLE, x: gapCenter, gapW: gapW, w: hw * 2, h: 0.55 };
        } else if (typeRoll < 0.90 && difficulty > 0.3) {
          // Triple pillars
          obstacle = { type: OBS_TRIPLE, x: 0, spacing: hw * 0.65, w: 0.22, h: 0.85 };
        } else {
          // Offset block (always dodgeable)
          var ox2 = (Math.random() < 0.5 ? -1 : 1) * hw * 0.55;
          obstacle = { type: OBS_BLOCK, x: ox2, w: 0.6, h: 0.5 };
        }
      }
    }

    return {
      idx: idx,
      cx: curveAccum,
      tilt: tiltAccum,
      height: heightAccum,
      gap: isGap,
      obstacle: obstacle
    };
  }

  function ensureTrack(ahead) {
    var needIdx = Math.floor((distance + ahead) / SEG_LEN) + 2;
    while (trackGenIndex <= needIdx) {
      track.push(genSegment(trackGenIndex));
      trackGenIndex++;
    }
    var minIdx = Math.floor(distance / SEG_LEN) - 5;
    while (track.length > 0 && track[0].idx < minIdx) {
      track.shift();
    }
  }

  function getSegByIdx(idx) {
    for (var i = 0; i < track.length; i++) {
      if (track[i].idx === idx) return track[i];
    }
    return null;
  }

  function interpTrack(d) {
    var fi = d / SEG_LEN;
    var i0 = Math.floor(fi);
    var frac = fi - i0;
    var s0 = getSegByIdx(i0);
    var s1 = getSegByIdx(i0 + 1);
    if (!s0) return { cx: 0, tilt: 0, height: 0, gap: false };
    if (!s1) return { cx: s0.cx, tilt: s0.tilt, height: s0.height, gap: s0.gap };
    return {
      cx: s0.cx + (s1.cx - s0.cx) * frac,
      tilt: s0.tilt + (s1.tilt - s0.tilt) * frac,
      height: s0.height + (s1.height - s0.height) * frac,
      gap: s0.gap
    };
  }

  // --- Perspective Projection ---
  function project(worldX, worldZ, worldY) {
    var z = Math.max(worldZ, 0.01);
    var scale = FOCAL / (FOCAL + z);
    var vpx = W / 2;
    var vpy = H * VP_Y;
    var ballSY = H * BALL_SCREEN_Y;
    var sx = vpx + worldX * scale * (W * 0.22);
    var sy = vpy + (ballSY - vpy) * scale;
    // Apply worldY (height) - negative Y = higher on screen
    sy -= (worldY || 0) * scale * (W * 0.18);
    return { x: sx, y: sy, s: scale };
  }

  // --- Init / Reset ---
  function initGame() {
    distance = 0;
    ballX = 0;
    ballY = 0;
    ballVY = 0;
    airborne = false;
    speed = BASE_SPEED;
    steerDir = 0;
    shakeTimer = 0;
    deathParticles = [];
    track = [];
    trackGenIndex = 0;
    curveAccum = 0;
    curveTarget = 0;
    curveVel = 0;
    tiltAccum = 0;
    tiltTarget = 0;
    heightAccum = 0;
    heightTarget = 0;
    heightVel = 0;
    coinEarned = false;
    ensureTrack(NUM_SEGS * SEG_LEN);
    state = 'play';
    lastTime = performance.now();
  }

  // --- Input ---
  var keys = {};
  document.addEventListener('keydown', function(e) {
    keys[e.code] = true;
    if (state === 'menu') { initGame(); e.preventDefault(); return; }
    if (state === 'over' && (e.code === 'Space' || e.code === 'Enter')) { initGame(); e.preventDefault(); }
    if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space','Enter'].indexOf(e.code) !== -1) e.preventDefault();
  });
  document.addEventListener('keyup', function(e) { keys[e.code] = false; });

  var touchL = false, touchR = false;
  function handleTouches(e) {
    touchL = false; touchR = false;
    for (var i = 0; i < e.touches.length; i++) {
      var t = e.touches[i];
      if (t.clientX < window.innerWidth / 2) touchL = true;
      else touchR = true;
    }
  }
  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (state === 'menu' || state === 'over') { initGame(); return; }
    handleTouches(e);
  });
  canvas.addEventListener('touchmove', function(e) { e.preventDefault(); handleTouches(e); });
  canvas.addEventListener('touchend', function(e) { e.preventDefault(); handleTouches(e); });
  canvas.addEventListener('mousedown', function(e) {
    if (state === 'menu' || state === 'over') initGame();
  });

  // --- Death Particles ---
  function spawnDeath(sx, sy) {
    for (var i = 0; i < 45; i++) {
      var angle = Math.random() * Math.PI * 2;
      var spd = 2 + Math.random() * 7;
      deathParticles.push({
        x: sx, y: sy,
        vx: Math.cos(angle) * spd,
        vy: Math.sin(angle) * spd - 4,
        life: 1,
        r: 2 + Math.random() * 4,
        green: Math.random() > 0.25
      });
    }
  }

  // --- Collision helpers ---
  function checkObstacleCollision(seg, relZ) {
    var obs = seg.obstacle;
    if (!obs) return false;
    var hitDist = BALL_RAD + 0.15;
    if (Math.abs(relZ) > 1.2) return false;

    // Only collide if ball is on or near ground level
    if (ballY > obs.h + 0.1) return false;

    switch (obs.type) {
      case OBS_BLOCK:
        return Math.abs(ballX - obs.x) < (obs.w / 2 + hitDist) && Math.abs(relZ) < (obs.w / 2 + hitDist);

      case OBS_WALL_LEFT:
        return ballX < obs.x + obs.w / 2 + 0.05 && Math.abs(relZ) < hitDist + 0.3;

      case OBS_WALL_RIGHT:
        return ballX > obs.x - obs.w / 2 - 0.05 && Math.abs(relZ) < hitDist + 0.3;

      case OBS_PILLAR:
        return Math.abs(ballX - obs.x) < (obs.w / 2 + hitDist) && Math.abs(relZ) < (obs.w / 2 + hitDist);

      case OBS_LOW_BAR:
        return Math.abs(relZ) < hitDist + 0.15 && ballY < obs.h + 0.1;

      case OBS_DOUBLE: {
        // Two blocks with a gap in the middle
        var gapLeft = obs.x - obs.gapW / 2;
        var gapRight = obs.x + obs.gapW / 2;
        if (Math.abs(relZ) > hitDist + 0.3) return false;
        // Hit if NOT in the gap
        return !(ballX > gapLeft + hitDist * 0.5 && ballX < gapRight - hitDist * 0.5);
      }

      case OBS_TRIPLE: {
        if (Math.abs(relZ) > hitDist + 0.15) return false;
        // Three pillars at -spacing, 0, +spacing
        for (var p = -1; p <= 1; p++) {
          if (Math.abs(ballX - p * obs.spacing) < (obs.w / 2 + hitDist)) return true;
        }
        return false;
      }
    }
    return false;
  }

  // --- Update ---
  function update(dt) {
    if (state !== 'play') return;

    speed = BASE_SPEED + distance * 0.005 + Math.min(distance * 0.00012, 4);
    var move = speed * dt;
    distance += move;

    // Steering
    steerDir = 0;
    if (keys['ArrowLeft'] || keys['KeyA'] || touchL) steerDir = -1;
    if (keys['ArrowRight'] || keys['KeyD'] || touchR) steerDir = 1;

    var steerSpeed = 5.5 + speed * 0.13;
    ballX += steerDir * steerSpeed * dt;

    // Track info at current position
    var tr = interpTrack(distance);

    // Tilt pushes ball sideways
    ballX += tr.tilt * speed * dt * 0.55;

    ensureTrack(NUM_SEGS * SEG_LEN);

    // --- Gravity & height ---
    var onGap = tr.gap;

    if (onGap) {
      // Ball is over a gap - apply gravity, let it fall
      airborne = true;
      ballVY -= GRAVITY * dt;
      ballY += ballVY * dt;
    } else {
      // Track surface height at current position
      if (airborne) {
        // Still apply gravity while airborne
        ballVY -= GRAVITY * dt;
        ballY += ballVY * dt;

        // Check if we've landed on the track
        if (ballY <= 0) {
          ballY = 0;
          ballVY = 0;
          airborne = false;
          // Landing sound could go here
        }
      } else {
        // On track surface
        ballY = 0;
        ballVY = 0;

        // Track height changes create a slope feel - sudden drops launch ball slightly
        var lookAhead = interpTrack(distance + move * 2);
        var heightDiff = lookAhead.height - tr.height;
        if (heightDiff < -0.3 * dt * speed) {
          // Track dropping away - ball gets a small launch
          ballVY = heightDiff * 0.15;
          airborne = true;
        }
      }
    }

    // Death: fell too far below track
    if (ballY < -12) {
      die(); return;
    }

    // Off-edge death (only when on track, not airborne over gap)
    if (!airborne || !onGap) {
      var hw = TRACK_HW;
      if (ballX < -hw - 0.15 || ballX > hw + 0.15) {
        die(); return;
      }
    }

    // Obstacle collision
    var curIdx = Math.floor(distance / SEG_LEN);
    for (var di = -1; di <= 2; di++) {
      var seg = getSegByIdx(curIdx + di);
      if (!seg || !seg.obstacle) continue;
      var segDist = seg.idx * SEG_LEN;
      var relZ = segDist - distance;
      if (relZ > 2 || relZ < -1.5) continue;
      if (checkObstacleCollision(seg, relZ)) {
        die(); return;
      }
    }

    if (shakeTimer > 0) shakeTimer -= dt;
  }

  function die() {
    state = 'over';
    var score = Math.floor(distance);
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('slope_best', score);
    }
    shakeTimer = 0.45;
    spawnDeath(W / 2, H * BALL_SCREEN_Y);
    if (window.SFX) window.SFX.death();
    if (score > 0 && window.HallOfFame) window.HallOfFame.submit('slope', score);
  }

  // --- Drawing ---
  function draw() {
    ctx.save();
    if (shakeTimer > 0) {
      var s = shakeTimer * 20;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }

    // Background gradient
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#020206');
    bg.addColorStop(1, '#0a0a14');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStars();

    if (state === 'menu') {
      drawMenuScene();
      ctx.restore();
      return;
    }

    drawTrack3D();
    drawBall();
    drawDeathParticles();
    drawHUD();

    if (state === 'over') drawGameOver();
    ctx.restore();
  }

  // Stars
  var stars = null;
  function drawStars() {
    if (!stars) {
      stars = [];
      for (var i = 0; i < 90; i++) {
        stars.push({
          x: Math.random(), y: Math.random() * 0.5,
          r: 0.3 + Math.random() * 1.0,
          phase: Math.random() * 6.28
        });
      }
    }
    var t = performance.now() * 0.001;
    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var a = 0.2 + Math.sin(t + st.phase) * 0.18;
      ctx.fillStyle = 'rgba(180,200,255,' + a + ')';
      ctx.beginPath();
      ctx.arc(st.x * W, st.y * H, st.r, 0, 6.28);
      ctx.fill();
    }
  }

  // --- 3D Track Drawing ---
  function drawTrack3D() {
    var ballTr = interpTrack(distance);
    var camCX = ballTr.cx;
    var camHeight = ballTr.height;

    var drawSegs = 120;
    var stepsPerSeg = 3;
    var totalSteps = drawSegs * stepsPerSeg;
    var stepLen = SEG_LEN / stepsPerSeg;

    // Build projected points
    var points = [];
    for (var i = 0; i <= totalSteps; i++) {
      var zWorld = i * stepLen;
      var absDist = distance + zWorld;
      var tr = interpTrack(absDist);
      var hw = TRACK_HW;

      var relCX = tr.cx - camCX - ballX;
      var relHeight = tr.height - camHeight;

      var tiltOffset = tr.tilt * 0.25;

      var pL = project(relCX - hw, zWorld, relHeight);
      var pR = project(relCX + hw, zWorld, relHeight);
      var pC = project(relCX, zWorld, relHeight);

      // Tilt shifts edges vertically
      pL.y += tiltOffset * pL.s * 35;
      pR.y -= tiltOffset * pR.s * 35;

      points.push({
        z: zWorld, absDist: absDist, tr: tr,
        pL: pL, pR: pR, pC: pC, hw: hw,
        gap: tr.gap,
        relHeight: relHeight,
        segIdx: Math.floor(absDist / SEG_LEN)
      });
    }

    // Draw track segments far to near
    for (var i = points.length - 2; i >= 0; i--) {
      var far = points[i + 1];
      var near = points[i];

      if (far.gap && near.gap) continue;

      var depthFade = Math.max(0, 1 - far.z / (drawSegs * SEG_LEN * 0.8));
      if (depthFade < 0.01) continue;

      // Smooth single-color track surface with subtle depth gradient
      var surfaceBright = 0.08 + depthFade * 0.12;
      var r = Math.floor(surfaceBright * 40);
      var g = Math.floor(surfaceBright * 80);
      var b = Math.floor(surfaceBright * 45);
      ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      ctx.globalAlpha = 0.5 + depthFade * 0.5;

      ctx.beginPath();
      ctx.moveTo(far.pL.x, far.pL.y);
      ctx.lineTo(far.pR.x, far.pR.y);
      ctx.lineTo(near.pR.x, near.pR.y);
      ctx.lineTo(near.pL.x, near.pL.y);
      ctx.closePath();
      ctx.fill();

      // Subtle grid lines (only at segment boundaries, very faint)
      if (near.segIdx !== far.segIdx && depthFade > 0.08) {
        ctx.strokeStyle = 'rgba(' + NEON_RGB + ',' + (0.06 * depthFade) + ')';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(far.pL.x, far.pL.y);
        ctx.lineTo(far.pR.x, far.pR.y);
        ctx.stroke();
      }

      // Neon edge glow - smooth gradient glow on edges
      if (depthFade > 0.03) {
        var alpha = 0.5 * depthFade;
        var lw = Math.max(0.5, 2 * depthFade);

        // Outer glow (wider, dimmer)
        ctx.strokeStyle = 'rgba(' + NEON_RGB + ',' + (alpha * 0.2) + ')';
        ctx.lineWidth = lw * 4;
        ctx.beginPath(); ctx.moveTo(far.pL.x, far.pL.y); ctx.lineTo(near.pL.x, near.pL.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(far.pR.x, far.pR.y); ctx.lineTo(near.pR.x, near.pR.y); ctx.stroke();

        // Core edge line
        ctx.strokeStyle = 'rgba(' + NEON_RGB + ',' + alpha + ')';
        ctx.lineWidth = lw;
        ctx.beginPath(); ctx.moveTo(far.pL.x, far.pL.y); ctx.lineTo(near.pL.x, near.pL.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(far.pR.x, far.pR.y); ctx.lineTo(near.pR.x, near.pR.y); ctx.stroke();
      }

      // Gap boundary glow
      if ((far.gap && !near.gap) || (!far.gap && near.gap)) {
        var edgeP = far.gap ? near : far;
        ctx.strokeStyle = 'rgba(' + NEON_RGB + ',' + (0.7 * depthFade) + ')';
        ctx.lineWidth = 2.5 * depthFade;
        ctx.shadowColor = NEON;
        ctx.shadowBlur = 10 * depthFade;
        ctx.beginPath();
        ctx.moveTo(edgeP.pL.x, edgeP.pL.y);
        ctx.lineTo(edgeP.pR.x, edgeP.pR.y);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;

    // Draw obstacles
    drawObstacles3D(points, camCX, camHeight);
  }

  function drawObstacles3D(points, camCX, camHeight) {
    var obsData = [];
    var curIdx = Math.floor(distance / SEG_LEN);
    var aheadIdx = curIdx + 110;

    for (var si = curIdx; si <= aheadIdx; si++) {
      var seg = getSegByIdx(si);
      if (!seg || !seg.obstacle) continue;
      var segDist = seg.idx * SEG_LEN;
      var relZ = segDist - distance;
      if (relZ < -2 || relZ > 280) continue;
      obsData.push({ seg: seg, relZ: relZ, segDist: segDist });
    }

    // Sort far to near for proper layering
    obsData.sort(function(a, b) { return b.relZ - a.relZ; });

    var ballTr = interpTrack(distance);

    for (var oi = 0; oi < obsData.length; oi++) {
      var od = obsData[oi];
      var seg = od.seg;
      var relZ = od.relZ;
      var obs = seg.obstacle;
      var depthFade = Math.max(0, 1 - relZ / 260);
      if (depthFade < 0.02) continue;

      var relHeight = seg.height - ballTr.height;

      switch (obs.type) {
        case OBS_BLOCK:
          drawBlock(obs.x + seg.cx - ballTr.cx - ballX, relZ, relHeight, obs.w, obs.h, depthFade);
          break;
        case OBS_WALL_LEFT:
        case OBS_WALL_RIGHT:
          drawWall(obs.x + seg.cx - ballTr.cx - ballX, relZ, relHeight, obs.w, obs.h, depthFade, obs.type === OBS_WALL_LEFT);
          break;
        case OBS_PILLAR:
          drawBlock(obs.x + seg.cx - ballTr.cx - ballX, relZ, relHeight, obs.w, obs.h, depthFade);
          break;
        case OBS_LOW_BAR:
          drawLowBar(seg.cx - ballTr.cx - ballX, relZ, relHeight, obs.w, obs.h, depthFade);
          break;
        case OBS_DOUBLE:
          drawDoubleObs(obs, seg.cx - ballTr.cx - ballX, relZ, relHeight, depthFade);
          break;
        case OBS_TRIPLE:
          for (var p = -1; p <= 1; p++) {
            drawBlock(p * obs.spacing + seg.cx - ballTr.cx - ballX, relZ, relHeight, obs.w, obs.h, depthFade);
          }
          break;
      }
    }
  }

  function drawBlock(ox, oz, oy, w, h, fade) {
    var p = project(ox, oz, oy);
    var sz = p.s * w * W * 0.14;
    var szH = p.s * h * W * 0.18;
    if (sz < 1) return;

    ctx.globalAlpha = fade;

    // Shadow
    ctx.fillStyle = 'rgba(' + RED_RGB + ',' + (0.15 * fade) + ')';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + sz * 0.05, sz * 0.7, sz * 0.12, 0, 0, 6.28);
    ctx.fill();

    // Front face
    ctx.fillStyle = '#cc1111';
    ctx.fillRect(p.x - sz / 2, p.y - szH, sz, szH);

    // Top face
    var topH = szH * 0.3;
    ctx.fillStyle = '#ff3838';
    ctx.beginPath();
    ctx.moveTo(p.x - sz / 2, p.y - szH);
    ctx.lineTo(p.x - sz / 2 + topH * 0.4, p.y - szH - topH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.4, p.y - szH - topH);
    ctx.lineTo(p.x + sz / 2, p.y - szH);
    ctx.closePath();
    ctx.fill();

    // Right face
    ctx.fillStyle = '#991010';
    ctx.beginPath();
    ctx.moveTo(p.x + sz / 2, p.y);
    ctx.lineTo(p.x + sz / 2, p.y - szH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.4, p.y - szH - topH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.4, p.y - topH);
    ctx.closePath();
    ctx.fill();

    // Glow
    ctx.shadowColor = RED_GLOW;
    ctx.shadowBlur = 10 * fade;
    ctx.strokeStyle = 'rgba(' + RED_RGB + ',' + (0.4 * fade) + ')';
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x - sz / 2, p.y - szH, sz, szH);
    ctx.shadowBlur = 0;

    ctx.globalAlpha = 1;
  }

  function drawWall(ox, oz, oy, w, h, fade, isLeft) {
    var p = project(ox, oz, oy);
    var sz = p.s * w * W * 0.14;
    var szH = p.s * h * W * 0.18;
    if (sz < 1) return;

    ctx.globalAlpha = fade;

    // Main wall face
    ctx.fillStyle = '#bb1515';
    if (isLeft) {
      ctx.fillRect(p.x - sz, p.y - szH, sz, szH);
    } else {
      ctx.fillRect(p.x, p.y - szH, sz, szH);
    }

    // Top face
    var topH = szH * 0.25;
    ctx.fillStyle = '#ee3333';
    ctx.beginPath();
    if (isLeft) {
      ctx.moveTo(p.x - sz, p.y - szH);
      ctx.lineTo(p.x - sz + topH * 0.3, p.y - szH - topH);
      ctx.lineTo(p.x + topH * 0.3, p.y - szH - topH);
      ctx.lineTo(p.x, p.y - szH);
    } else {
      ctx.moveTo(p.x, p.y - szH);
      ctx.lineTo(p.x + topH * 0.3, p.y - szH - topH);
      ctx.lineTo(p.x + sz + topH * 0.3, p.y - szH - topH);
      ctx.lineTo(p.x + sz, p.y - szH);
    }
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = RED_GLOW;
    ctx.shadowBlur = 8 * fade;
    ctx.strokeStyle = 'rgba(' + RED_RGB + ',' + (0.3 * fade) + ')';
    ctx.lineWidth = 1;
    if (isLeft) {
      ctx.strokeRect(p.x - sz, p.y - szH, sz, szH);
    } else {
      ctx.strokeRect(p.x, p.y - szH, sz, szH);
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawLowBar(ox, oz, oy, w, h, fade) {
    var p = project(ox, oz, oy);
    var sz = p.s * w * W * 0.12;
    var szH = p.s * h * W * 0.12;
    if (sz < 1) return;

    ctx.globalAlpha = fade;

    // Wide low bar
    ctx.fillStyle = '#dd2020';
    ctx.fillRect(p.x - sz / 2, p.y - szH, sz, szH);

    // Top
    ctx.fillStyle = '#ff4444';
    var topH = szH * 0.4;
    ctx.beginPath();
    ctx.moveTo(p.x - sz / 2, p.y - szH);
    ctx.lineTo(p.x - sz / 2 + topH * 0.3, p.y - szH - topH);
    ctx.lineTo(p.x + sz / 2 + topH * 0.3, p.y - szH - topH);
    ctx.lineTo(p.x + sz / 2, p.y - szH);
    ctx.closePath();
    ctx.fill();

    // Hazard stripes
    ctx.strokeStyle = 'rgba(255,200,0,' + (0.3 * fade) + ')';
    ctx.lineWidth = 2 * fade;
    var stripeCount = Math.max(2, Math.floor(sz / 12));
    for (var i = 0; i < stripeCount; i++) {
      var sx = p.x - sz / 2 + (sz / stripeCount) * (i + 0.5);
      ctx.beginPath();
      ctx.moveTo(sx, p.y);
      ctx.lineTo(sx + 3, p.y - szH);
      ctx.stroke();
    }

    ctx.shadowColor = RED_GLOW;
    ctx.shadowBlur = 8 * fade;
    ctx.fillStyle = 'rgba(' + RED_RGB + ',0.01)';
    ctx.fillRect(p.x - sz / 2, p.y - szH, sz, szH);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function drawDoubleObs(obs, ox, oz, oy, fade) {
    var hw = TRACK_HW;
    // Left block (from left edge to gap)
    var leftEnd = obs.x - obs.gapW / 2;
    var leftW = leftEnd + hw;
    if (leftW > 0.2) {
      drawBlock(ox + (-hw + leftEnd) / 2, oz, oy, leftW * 0.45, obs.h, fade);
    }
    // Right block (from gap to right edge)
    var rightStart = obs.x + obs.gapW / 2;
    var rightW = hw - rightStart;
    if (rightW > 0.2) {
      drawBlock(ox + (rightStart + hw) / 2, oz, oy, rightW * 0.45, obs.h, fade);
    }
  }

  // --- Ball ---
  function drawBall() {
    if (state === 'over') return;
    var bx = W / 2;
    var by = H * BALL_SCREEN_Y;

    // Adjust ball Y position for airborne state
    var ballScreenOffsetY = ballY * 25; // scale world Y to screen pixels
    by -= ballScreenOffsetY;

    var r = 14;

    // Shadow (on track, dimmer when airborne)
    var shadowAlpha = airborne ? Math.max(0.05, 0.4 - ballY * 0.05) : 0.45;
    ctx.fillStyle = 'rgba(0,0,0,' + shadowAlpha + ')';
    ctx.beginPath();
    var shadowY = H * BALL_SCREEN_Y + r * 0.4;
    var shadowScale = airborne ? Math.max(0.3, 1 - ballY * 0.08) : 1;
    ctx.ellipse(bx, shadowY, r * 1.3 * shadowScale, r * 0.25 * shadowScale, 0, 0, 6.28);
    ctx.fill();

    // Outer glow
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 22;
    ctx.fillStyle = 'rgba(0,255,0,0.06)';
    ctx.beginPath();
    ctx.arc(bx, by, r * 2, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Ball body
    var ballGrad = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.35, r * 0.05, bx, by, r);
    ballGrad.addColorStop(0, '#aaffaa');
    ballGrad.addColorStop(0.35, '#33ee33');
    ballGrad.addColorStop(0.7, '#00bb00');
    ballGrad.addColorStop(1, '#006600');
    ctx.fillStyle = ballGrad;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    ctx.arc(bx, by, r, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Specular highlight
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.beginPath();
    ctx.arc(bx - r * 0.25, by - r * 0.3, r * 0.32, 0, 6.28);
    ctx.fill();

    // Rolling lines
    var rot = distance * 0.9;
    ctx.strokeStyle = 'rgba(0,180,0,0.2)';
    ctx.lineWidth = 1;
    for (var i = 0; i < 3; i++) {
      var a = rot + i * 2.09;
      ctx.beginPath();
      ctx.arc(bx, by, r * 0.65, a, a + 0.7);
      ctx.stroke();
    }
  }

  // --- Death Particles ---
  function drawDeathParticles() {
    for (var i = 0; i < deathParticles.length; i++) {
      var p = deathParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.25;
      p.life -= 0.017;
      if (p.life <= 0) continue;
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.green ? NEON : '#88ff88';
      ctx.shadowColor = NEON;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, 6.28);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    deathParticles = deathParticles.filter(function(p) { return p.life > 0; });
  }

  // --- HUD ---
  function drawHUD() {
    ctx.textAlign = 'center';
    ctx.font = 'bold 26px Segoe UI, Arial, sans-serif';
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#fff';
    ctx.fillText(Math.floor(distance) + ' m', W / 2, 38);
    ctx.shadowBlur = 0;

    // Speed
    var sp = speed.toFixed(1);
    ctx.font = '14px Segoe UI, Arial, sans-serif';
    var fast = speed > 14;
    ctx.fillStyle = fast ? '#ff4444' : 'rgba(0,255,0,0.6)';
    if (fast) {
      ctx.shadowColor = '#ff4444';
      ctx.shadowBlur = 6;
    }
    ctx.fillText('Speed: ' + sp, W / 2, 58);
    ctx.shadowBlur = 0;

    if (bestScore > 0) {
      ctx.textAlign = 'right';
      ctx.font = '13px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#666';
      ctx.fillText('Best: ' + bestScore + ' m', W - 14, 30);
    }
  }

  // --- Menu ---
  var menuAnim = 0;
  function drawMenuScene() {
    menuAnim += 0.012;

    // Preview track
    var fakeSegs = 90;
    for (var i = fakeSegs; i >= 1; i--) {
      var zFar = i * 1.5;
      var zNear = (i - 1) * 1.5;
      var waveFar = Math.sin((zFar + menuAnim * 40) * 0.05) * 2;
      var waveNear = Math.sin((zNear + menuAnim * 40) * 0.05) * 2;
      var depthFade = Math.max(0, 1 - zFar / (fakeSegs * 1.5));

      var pLF = project(waveFar - TRACK_HW, zFar, 0);
      var pRF = project(waveFar + TRACK_HW, zFar, 0);
      var pLN = project(waveNear - TRACK_HW, zNear, 0);
      var pRN = project(waveNear + TRACK_HW, zNear, 0);

      var bright = 0.08 + depthFade * 0.1;
      ctx.fillStyle = 'rgb(' + Math.floor(bright * 35) + ',' + Math.floor(bright * 75) + ',' + Math.floor(bright * 40) + ')';
      ctx.globalAlpha = 0.3 + depthFade * 0.4;
      ctx.beginPath();
      ctx.moveTo(pLF.x, pLF.y);
      ctx.lineTo(pRF.x, pRF.y);
      ctx.lineTo(pRN.x, pRN.y);
      ctx.lineTo(pLN.x, pLN.y);
      ctx.closePath();
      ctx.fill();

      if (depthFade > 0.08) {
        ctx.globalAlpha = 0.2 * depthFade;
        ctx.strokeStyle = NEON;
        ctx.lineWidth = 1.5 * depthFade;
        ctx.beginPath(); ctx.moveTo(pLF.x, pLF.y); ctx.lineTo(pLN.x, pLN.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(pRF.x, pRF.y); ctx.lineTo(pRN.x, pRN.y); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    // Overlay
    ctx.fillStyle = 'rgba(4,4,10,0.45)';
    ctx.fillRect(0, 0, W, H);

    // Title
    ctx.save();
    var pulse = 1 + Math.sin(performance.now() * 0.003) * 0.04;
    ctx.translate(W / 2, H * 0.22);
    ctx.scale(pulse, pulse);
    ctx.font = 'bold 68px Segoe UI, Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 40;
    ctx.fillStyle = NEON;
    ctx.fillText('SLOPE', 0, 0);
    ctx.shadowBlur = 15;
    ctx.fillText('SLOPE', 0, 0);
    ctx.shadowBlur = 0;
    ctx.restore();

    // Ball icon
    var bx = W / 2, by = H * 0.36;
    var bgr = ctx.createRadialGradient(bx - 4, by - 4, 2, bx, by, 20);
    bgr.addColorStop(0, '#88ff88');
    bgr.addColorStop(0.5, '#00cc00');
    bgr.addColorStop(1, '#006600');
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 20;
    ctx.fillStyle = bgr;
    ctx.beginPath();
    ctx.arc(bx, by, 20, 0, 6.28);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(bx - 6, by - 6, 7, 0, 6.28);
    ctx.fill();

    // Instructions
    ctx.font = '17px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#7a7a9a';
    ctx.textAlign = 'center';
    ctx.fillText('Arrow Keys / A-D to steer', W / 2, H * 0.48);
    ctx.fillText('Tap left/right on mobile', W / 2, H * 0.53);

    if (bestScore > 0) {
      ctx.font = 'bold 16px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = NEON;
      ctx.shadowColor = NEON;
      ctx.shadowBlur = 8;
      ctx.fillText('Best: ' + bestScore + ' m', W / 2, H * 0.61);
      ctx.shadowBlur = 0;
    }

    // Start prompt
    var blink = Math.sin(performance.now() * 0.004) * 0.4 + 0.6;
    ctx.globalAlpha = blink;
    ctx.font = 'bold 20px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 12;
    ctx.fillText('Press any key or tap to start', W / 2, H * 0.74);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // --- Game Over ---
  function drawGameOver() {
    var score = Math.floor(distance);

    ctx.fillStyle = 'rgba(4,4,10,0.7)';
    ctx.fillRect(0, 0, W, H);

    var pw = 280, ph = 230;
    var px = (W - pw) / 2, py = (H - ph) / 2 - 20;
    ctx.fillStyle = '#0a0a18';
    ctx.strokeStyle = '#0a3';
    ctx.lineWidth = 2;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 15;
    ctx.beginPath();
    roundRect(ctx, px, py, pw, ph, 12);
    ctx.fill();
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.textAlign = 'center';

    ctx.font = 'bold 30px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 10;
    ctx.fillText('Game Over', W / 2, py + 48);
    ctx.shadowBlur = 0;

    ctx.font = 'bold 40px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.fillText(score + ' m', W / 2, py + 100);

    ctx.font = '16px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 6;
    ctx.fillText('Best: ' + bestScore + ' m', W / 2, py + 130);
    ctx.shadowBlur = 0;

    if (score >= bestScore && score > 0) {
      ctx.font = 'bold 14px Segoe UI, Arial, sans-serif';
      ctx.fillStyle = '#ffcc00';
      ctx.fillText('NEW BEST!', W / 2, py + 152);
    }

    var bw = 180, bh = 44;
    var bbx = (W - bw) / 2, bby = py + 168;
    var blink2 = Math.sin(performance.now() * 0.005) * 0.15 + 0.85;
    ctx.globalAlpha = blink2;
    ctx.fillStyle = NEON;
    ctx.shadowColor = NEON;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    roundRect(ctx, bbx, bby, bw, bh, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.font = 'bold 18px Segoe UI, Arial, sans-serif';
    ctx.fillStyle = '#0a0a18';
    ctx.fillText('Play Again', W / 2, bby + 29);
  }

  function roundRect(c, x, y, w, h, r) {
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }

  // --- Game Loop ---
  function loop(ts) {
    requestAnimationFrame(loop);
    var dt = Math.min((ts - lastTime) / 1000, 0.05);
    lastTime = ts;
    if (state === 'play') update(dt);
    draw();
  }

  lastTime = performance.now();
  requestAnimationFrame(loop);
})();
</script>
