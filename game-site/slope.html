<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Slope</title>
<script src="slope-build/TemplateData/unityloader41.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;overflow-y:auto;overflow-x:hidden;font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:1rem}
a.back{position:fixed;top:14px;left:14px;z-index:10001;color:#aaa;text-decoration:none;font-size:15px;background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 14px;border-radius:8px;transition:background .2s,color .2s}
a.back:hover{background:#2a2a4a;color:#fff}
h1.title{color:#0f0;font-size:28px;margin:10px 0 12px;text-shadow:0 0 20px rgba(0,255,0,0.4);text-align:center}
#game-wrapper{position:relative;width:100%;max-width:960px;aspect-ratio:16/9;border:2px solid #2a2a4a;border-radius:12px;overflow:hidden;background:#231F20;box-shadow:0 0 30px rgba(0,0,0,0.6)}
#gameContainer{width:100%;height:100%}
#gameContainer canvas{width:100%!important;height:100%!important}
#gameContainer .logo,
#gameContainer .progress{display:none!important}
#loading-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;transition:opacity 0.6s;border-radius:12px}
#loading-overlay.hidden{opacity:0;pointer-events:none}
#loading-overlay h2{color:#0f0;font-size:36px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:20px}
.loader{width:36px;height:36px;border:3px solid transparent;border-top:3px solid #0f0;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{color:#888;margin-top:12px;font-size:13px}
#gameover-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:15;border-radius:12px}
#gameover-overlay.visible{display:flex}
#gameover-overlay h2{color:#0f0;font-size:36px;text-shadow:0 0 30px rgba(0,255,0,0.6);margin-bottom:8px}
#gameover-score{color:#ccc;font-size:20px;margin-bottom:24px}
#score-row{display:flex;align-items:center;gap:10px;margin-bottom:20px}
#score-row label{color:#aaa;font-size:16px}
#score-input{width:100px;padding:8px 12px;border:2px solid #2a2a4a;border-radius:6px;background:#1a1a2e;color:#fff;font-size:18px;text-align:center;font-family:inherit;outline:none;transition:border-color 0.2s}
#score-input:focus{border-color:#0f0}
#score-input::-webkit-inner-spin-button,#score-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#score-input{-moz-appearance:textfield}
#score-saved{color:#0f0;font-size:14px;margin-bottom:16px;min-height:20px}
#play-again-btn{background:none;border:2px solid #0f0;color:#0f0;font-size:20px;padding:12px 40px;border-radius:8px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:2px;transition:all 0.2s;text-shadow:0 0 8px rgba(0,255,0,0.4)}
#play-again-btn:hover{background:#0f0;color:#111;text-shadow:none;box-shadow:0 0 20px rgba(0,255,0,0.5)}
</style>
</head>
<body>
<a class="back" href="index.html">&larr; Back</a>
<h1 class="title">SLOPE</h1>

<div id="game-wrapper">
  <div id="loading-overlay">
    <h2>SLOPE</h2>
    <div class="loader"></div>
    <div id="loading-text">Loading game...</div>
  </div>

  <div id="gameover-overlay">
    <h2>GAME OVER</h2>
    <div id="score-row">
      <label>Your Score:</label>
      <input type="number" id="score-input" min="0" placeholder="0">
    </div>
    <div id="score-saved"></div>
    <button id="play-again-btn">Play Again</button>
  </div>

  <div id="gameContainer"></div>
</div>

<script>
var gameLoaded = false;
var gameStarted = false;
var gameActive = false;
var lastInputTime = 0;
var deathCheckInterval = null;
var scoreAtDeath = 0;

function UnityProgress(inst, progress) {
  var txt = document.getElementById('loading-text');
  if (txt && typeof progress === 'number') {
    txt.textContent = 'Loading... ' + Math.floor(progress * 100) + '%';
  }
  if ((progress === 1 || progress === 'complete') && !gameLoaded) {
    gameLoaded = true;
    setTimeout(startAutoPlay, 3000);
  }
}

var gameInstance = UnityLoader.instantiate('gameContainer', 'slope-build/Build/slope.json', {
  onProgress: UnityProgress,
  Module: {
    onRuntimeInitialized: function() {
      UnityProgress(gameInstance, 'complete');
    }
  }
});

function startAutoPlay() {
  var canvas = document.querySelector('#gameContainer canvas');
  if (!canvas) {
    setTimeout(startAutoPlay, 500);
    return;
  }

  // Disable branding
  disableBranding();
  trySendMessages();

  // Click Play button at 58% vertical (where Play is in Y8 Slope)
  setTimeout(function() {
    var rect = canvas.getBoundingClientRect();
    fireClick(canvas, rect.left + rect.width * 0.5, rect.top + rect.height * 0.58);
  }, 500);

  setTimeout(function() {
    if (gameStarted) return;
    var rect = canvas.getBoundingClientRect();
    fireClick(canvas, rect.left + rect.width * 0.5, rect.top + rect.height * 0.52);
  }, 1200);

  setTimeout(function() {
    if (gameStarted) return;
    var rect = canvas.getBoundingClientRect();
    fireClick(canvas, rect.left + rect.width * 0.5, rect.top + rect.height * 0.45);
  }, 2000);

  // Try keyboard
  setTimeout(function() {
    if (gameStarted) return;
    canvas.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
    canvas.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', code: 'Enter', keyCode: 13, bubbles: true }));
  }, 2500);

  // Hide loading overlay
  setTimeout(function() {
    var overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.classList.add('hidden');
    setTimeout(function() { if (overlay) overlay.style.display = 'none'; }, 700);
    disableBranding();
    setTimeout(disableBranding, 2000);
    setTimeout(disableBranding, 5000);
  }, 3000);

  // Start monitoring for game over
  startDeathDetection();
}

// --- Game Over Detection ---
// When the player is actively playing, arrow keys are pressed frequently.
// When they die, input stops. We detect this transition.
function startDeathDetection() {
  deathCheckInterval = setInterval(function() {
    if (!gameActive) return;
    var now = Date.now();
    // If player was active but no input for 1.5 seconds, likely dead
    if (lastInputTime > 0 && (now - lastInputTime) > 1500) {
      showGameOver();
    }
  }, 500);
}

function showGameOver() {
  gameActive = false;
  var overlay = document.getElementById('gameover-overlay');
  if (overlay) overlay.classList.add('visible');

  // Reset score input and saved message
  var input = document.getElementById('score-input');
  if (input) { input.value = ''; input.focus(); }
  var saved = document.getElementById('score-saved');
  if (saved) saved.textContent = '';

  // Play death sound
  if (window.SFX && window.SFX.death) window.SFX.death();
}

function restartGame() {
  // Submit score to leaderboard if entered
  var input = document.getElementById('score-input');
  var saved = document.getElementById('score-saved');
  var score = input ? parseInt(input.value, 10) : 0;
  if (score > 0) {
    try { HallOfFame.submit('slope', score); } catch(e) {}
    if (saved) saved.textContent = 'Score saved!';
    if (window.SFX && window.SFX.coin) window.SFX.coin();
  }

  // Keep our overlay visible while we get the game restarted behind it
  gameActive = false;
  gameStarted = false;
  lastInputTime = 0;

  var canvas = document.querySelector('#gameContainer canvas');
  if (!canvas) return;
  var rect = canvas.getBoundingClientRect();

  // The Unity game over screen has its own buttons. We need to:
  // 1. Click through Unity's menu/play button to get back to gameplay
  // 2. Only THEN hide our overlay

  // Try SendMessage restart methods
  if (gameInstance) {
    var objects = ['GameLogic', 'CanvasScripts', 'GameManager', 'Game'];
    for (var i = 0; i < objects.length; i++) {
      try { gameInstance.SendMessage(objects[i], 'RestartLevel'); } catch(e) {}
      try { gameInstance.SendMessage(objects[i], 'HideAllScreens'); } catch(e) {}
      try { gameInstance.SendMessage(objects[i], 'PlayGame'); } catch(e) {}
      try { gameInstance.SendMessage(objects[i], 'StartGame'); } catch(e) {}
    }
  }

  disableBranding();

  // Unity's game-over screen likely has a "Menu" or "Play Again" button.
  // After death, the game goes to its menu. We need to click through that menu's
  // Play button just like we do at initial load.
  // First, wait a moment for the Unity menu to appear after our SendMessage calls
  // Then click the Play button position (same as initial auto-play)
  var clickSequence = [
    { delay: 300, yPct: 0.58 },  // Play button position
    { delay: 800, yPct: 0.52 },  // Slightly higher
    { delay: 1300, yPct: 0.45 }, // Even higher
    { delay: 1800, yPct: 0.58 }, // Try play button again
    { delay: 2300, yPct: 0.52 }, // One more try
  ];

  for (var c = 0; c < clickSequence.length; c++) {
    (function(delay, yPct) {
      setTimeout(function() {
        rect = canvas.getBoundingClientRect();
        fireClick(canvas, rect.left + rect.width * 0.5, rect.top + rect.height * yPct);
      }, delay);
    })(clickSequence[c].delay, clickSequence[c].yPct);
  }

  // After clicking sequence, hide our overlay
  setTimeout(function() {
    var overlay = document.getElementById('gameover-overlay');
    if (overlay) overlay.classList.remove('visible');
    disableBranding();
    setTimeout(disableBranding, 2000);
    setTimeout(disableBranding, 5000);
  }, 2800);
}

document.getElementById('play-again-btn').addEventListener('click', restartGame);
document.getElementById('score-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') restartGame();
});

function trySendMessages() {
  if (!gameInstance) return;
  var startMethods = [
    'PlayGame', 'StartGame', 'Play', 'Start', 'OnPlayButton',
    'OnPlayClick', 'OnPlay', 'BeginGame', 'NewGame',
    'HideAllScreens', 'RestartLevel', 'StartLevel', 'LoadLevel'
  ];
  var gameObjects = [
    'GameLogic', 'CanvasScripts', 'GameManager', 'Game',
    'Manager', 'Controller', 'GameController', 'LevelManager',
    'UIManager', 'MenuManager', 'MainMenu'
  ];
  for (var i = 0; i < gameObjects.length; i++) {
    for (var j = 0; j < startMethods.length; j++) {
      try { gameInstance.SendMessage(gameObjects[i], startMethods[j]); } catch(e) {}
    }
  }
  var fsmEvents = ['PLAY', 'START', 'GAME_START', 'BEGIN', 'START_GAME'];
  for (var k = 0; k < fsmEvents.length; k++) {
    try { gameInstance.SendMessage('PlayMakerFSM', 'SendEvent', fsmEvents[k]); } catch(e) {}
    try { gameInstance.SendMessage('GameLogic', 'SendEvent', fsmEvents[k]); } catch(e) {}
  }
  var screens = ['MainMenuScreen', 'GameOverScreen', 'PromoScreen', 'IDNETLogin',
    'IdnetSample', 'IdnetWrap', 'Leaderboard', 'LoginPanel'];
  for (var s = 0; s < screens.length; s++) {
    try { gameInstance.SendMessage(screens[s], 'SetActive', '0'); } catch(e) {}
  }
  setTimeout(function() {
    for (var i = 0; i < gameObjects.length; i++) {
      try { gameInstance.SendMessage(gameObjects[i], 'HideAllScreens'); } catch(e) {}
      try { gameInstance.SendMessage(gameObjects[i], 'RestartLevel'); } catch(e) {}
    }
  }, 1000);
}

function fireClick(el, x, y) {
  var common = {
    bubbles: true, cancelable: true, view: window,
    clientX: x, clientY: y, button: 0, pointerId: 1,
    pointerType: 'mouse'
  };
  el.dispatchEvent(new PointerEvent('pointerdown', common));
  el.dispatchEvent(new MouseEvent('mousedown', common));
  setTimeout(function() {
    el.dispatchEvent(new PointerEvent('pointerup', common));
    el.dispatchEvent(new MouseEvent('mouseup', common));
    el.dispatchEvent(new MouseEvent('click', common));
  }, 50);
}

function disableBranding() {
  if (!gameInstance) return;
  var objs = ['Branding', 'BrandingScript', 'Y8Branding', 'Branding_Y8',
    'Branding_Y8_MoreGames', 'Branding_IDnet', 'IDnetObject',
    'y8_logo', 'y8_logo_moregames', 'idnet_logo', 'PromoScreen',
    'IDNETLogin', 'IdnetSample', 'IdnetWrap', 'Leaderboard'];
  for (var i = 0; i < objs.length; i++) {
    try { gameInstance.SendMessage(objs[i], 'SetActive', '0'); } catch(e) {}
  }
  try { gameInstance.SendMessage('Branding', 'DisableMoreGames'); } catch(e) {}
  try { gameInstance.SendMessage('Y8Branding', 'DisableY8Link'); } catch(e) {}
}

// Track gameplay input to detect game over
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'a' || e.key === 'd') {
    if (!gameStarted) {
      gameStarted = true;
      gameActive = true;
    }
    lastInputTime = Date.now();
    gameActive = true;
  }
});

// Also track touch for mobile
document.addEventListener('touchstart', function(e) {
  if (gameStarted) {
    lastInputTime = Date.now();
    gameActive = true;
  }
});
</script>

<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
