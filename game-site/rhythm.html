<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rhythm</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1.5rem;
    user-select: none;
  }
  h1 { font-size: 2rem; background: linear-gradient(135deg, #ff4757, #ffd166); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.3rem; }
  .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
  .back { position: fixed; top: 12px; left: 16px; color: #aaa; text-decoration: none; font-size: 1.1rem; z-index: 100; }
  .back:hover { color: #fff; }
  canvas { border-radius: 8px; display: block; }
  .stats {
    display: flex; gap: 2rem; margin-top: 0.8rem;
  }
  .stats .stat { display: flex; flex-direction: column; align-items: center; }
  .stats .label { color: #888; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .stats .val { color: #00d4ff; font-size: 1.3rem; font-weight: 700; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Rhythm</h1>
<p class="subtitle">Hit the arrows in time with the beat</p>
<canvas id="gc" width="500" height="600"></canvas>
<div class="stats">
  <div class="stat"><span class="label">Score</span><span class="val" id="scoreDisp">0</span></div>
  <div class="stat"><span class="label">Combo</span><span class="val" id="comboDisp">0</span></div>
  <div class="stat"><span class="label">Time</span><span class="val" id="timeDisp">60</span></div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 500, H = 600;

// Lane config
const LANE_COLORS = ['#ff4757', '#00d4ff', '#44ff88', '#ffd166'];
const LANE_LABELS = ['LEFT', 'DOWN', 'UP', 'RIGHT'];
const LANE_KEYS = ['ArrowLeft', 'ArrowDown', 'ArrowUp', 'ArrowRight'];
const LANE_COUNT = 4;
const LANE_W = W / LANE_COUNT;
const TARGET_Y = H - 80;
const ARROW_SIZE = 28;

// Timing windows (ms)
const PERFECT_WINDOW = 30;
const GREAT_WINDOW = 60;
const GOOD_WINDOW = 100;
const MISS_WINDOW = 140;

// Scoring
const SCORE_PERFECT = 100;
const SCORE_GREAT = 75;
const SCORE_GOOD = 50;

// Game state
let state = 'start'; // start, playing, results
let score = 0;
let combo = 0;
let maxCombo = 0;
let counts = { perfect: 0, great: 0, good: 0, miss: 0 };
let arrows = [];
let feedbacks = [];
let lanePressed = [false, false, false, false];
let lanePressTime = [0, 0, 0, 0];
let gameStartTime = 0;
let songDuration = 0;
let lastTime = 0;
let elapsed = 0;
let songPattern = [];
let nextArrowIdx = 0;

// Generate a musical/rhythmic pattern
function generateSong() {
  const pattern = [];
  const BPM = 130;
  const beatMs = 60000 / BPM;
  let time = 2000; // 2s lead-in

  // Song structure: intro, verse, chorus, bridge, chorus, outro
  const sections = [
    { name: 'intro', beats: 8, density: 1, allowDoubles: false },
    { name: 'verse1', beats: 16, density: 1, allowDoubles: false },
    { name: 'chorus1', beats: 16, density: 2, allowDoubles: true },
    { name: 'verse2', beats: 12, density: 1.5, allowDoubles: false },
    { name: 'bridge', beats: 8, density: 2, allowDoubles: true },
    { name: 'chorus2', beats: 16, density: 2.5, allowDoubles: true },
    { name: 'outro', beats: 8, density: 1, allowDoubles: false },
  ];

  // Musical patterns (lane sequences that feel rhythmic)
  const riffs = [
    [0, 2, 1, 3],       // left up down right - sweep
    [1, 2, 1, 2],       // down up down up - bounce
    [0, 3, 0, 3],       // left right left right - alternating
    [0, 1, 2, 3],       // ascending
    [3, 2, 1, 0],       // descending
    [1, 1, 2, 2],       // double taps
    [0, 0, 3, 3],       // outer doubles
    [2, 1, 3, 0],       // mixed
    [1, 3, 2, 0],       // zigzag
    [0, 2, 3, 1],       // crossing
  ];

  let seed = Math.floor(Math.random() * 100000);
  function seededRand() {
    seed = (seed * 1103515245 + 12345) & 0x7fffffff;
    return (seed % 1000) / 1000;
  }

  for (const section of sections) {
    const riff = riffs[Math.floor(seededRand() * riffs.length)];
    let riffIdx = 0;
    let beat = 0;

    while (beat < section.beats) {
      const subdivision = section.density >= 2 ? 0.5 : 1;
      const steps = section.density >= 2.5 ? [0, 0.25, 0.5, 0.75] :
                    section.density >= 2 ? [0, 0.5] :
                    section.density >= 1.5 ? (seededRand() > 0.5 ? [0, 0.5] : [0]) : [0];

      for (const sub of steps) {
        const t = time + (beat + sub) * beatMs;
        const lane = riff[riffIdx % riff.length];
        pattern.push({ time: t, lane: lane });
        riffIdx++;

        // Add doubles in chorus/bridge sections
        if (section.allowDoubles && seededRand() > 0.75) {
          let otherLane = (lane + 2) % 4; // opposite-ish lane
          pattern.push({ time: t, lane: otherLane });
        }
      }

      beat += 1;
    }

    time += section.beats * beatMs;
  }

  // Sort by time
  pattern.sort((a, b) => a.time - b.time);
  songDuration = pattern[pattern.length - 1].time + 2000; // 2s buffer after last note
  return pattern;
}

// Speed: how fast arrows fall (pixels per ms)
const ARROW_SPEED = 0.35;
// How far ahead arrows spawn (in ms before they reach target)
const SPAWN_AHEAD = TARGET_Y / ARROW_SPEED;

function drawArrow(x, y, lane, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);

  const s = ARROW_SIZE;
  ctx.fillStyle = LANE_COLORS[lane];
  ctx.strokeStyle = LANE_COLORS[lane];
  ctx.lineWidth = 3;
  ctx.lineJoin = 'round';

  // Draw chevron/arrow shape based on direction
  ctx.beginPath();
  switch (lane) {
    case 0: // Left
      ctx.moveTo(s * 0.5, 0);
      ctx.lineTo(-s * 0.5, 0);
      ctx.lineTo(0, -s * 0.4);
      ctx.moveTo(-s * 0.5, 0);
      ctx.lineTo(0, s * 0.4);
      ctx.stroke();
      // Arrowhead
      ctx.beginPath();
      ctx.moveTo(-s * 0.5, 0);
      ctx.lineTo(-s * 0.2, -s * 0.25);
      ctx.lineTo(-s * 0.2, s * 0.25);
      ctx.closePath();
      ctx.fill();
      break;
    case 1: // Down
      ctx.moveTo(0, -s * 0.5);
      ctx.lineTo(0, s * 0.5);
      ctx.lineTo(-s * 0.4, 0);
      ctx.moveTo(0, s * 0.5);
      ctx.lineTo(s * 0.4, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, s * 0.5);
      ctx.lineTo(-s * 0.25, s * 0.2);
      ctx.lineTo(s * 0.25, s * 0.2);
      ctx.closePath();
      ctx.fill();
      break;
    case 2: // Up
      ctx.moveTo(0, s * 0.5);
      ctx.lineTo(0, -s * 0.5);
      ctx.lineTo(-s * 0.4, 0);
      ctx.moveTo(0, -s * 0.5);
      ctx.lineTo(s * 0.4, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.5);
      ctx.lineTo(-s * 0.25, -s * 0.2);
      ctx.lineTo(s * 0.25, -s * 0.2);
      ctx.closePath();
      ctx.fill();
      break;
    case 3: // Right
      ctx.moveTo(-s * 0.5, 0);
      ctx.lineTo(s * 0.5, 0);
      ctx.lineTo(0, -s * 0.4);
      ctx.moveTo(s * 0.5, 0);
      ctx.lineTo(0, s * 0.4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s * 0.5, 0);
      ctx.lineTo(s * 0.2, -s * 0.25);
      ctx.lineTo(s * 0.2, s * 0.25);
      ctx.closePath();
      ctx.fill();
      break;
  }

  ctx.restore();
}

function drawTargetZone() {
  for (let i = 0; i < LANE_COUNT; i++) {
    const x = i * LANE_W + LANE_W / 2;
    const pressed = lanePressed[i];
    const timeSincePress = performance.now() - lanePressTime[i];
    const glowAlpha = pressed ? 0.6 : Math.max(0, 0.3 - timeSincePress / 500);

    // Lane separator lines
    if (i > 0) {
      ctx.strokeStyle = 'rgba(255,255,255,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(i * LANE_W, 0);
      ctx.lineTo(i * LANE_W, H);
      ctx.stroke();
    }

    // Target zone glow
    ctx.save();
    const glow = ctx.createRadialGradient(x, TARGET_Y, 5, x, TARGET_Y, LANE_W * 0.6);
    glow.addColorStop(0, LANE_COLORS[i].replace(')', `, ${glowAlpha})`).replace('rgb', 'rgba').replace('#', ''));
    // Convert hex to rgba for glow
    const r = parseInt(LANE_COLORS[i].slice(1, 3), 16);
    const g = parseInt(LANE_COLORS[i].slice(3, 5), 16);
    const b = parseInt(LANE_COLORS[i].slice(5, 7), 16);
    const glow2 = ctx.createRadialGradient(x, TARGET_Y, 5, x, TARGET_Y, LANE_W * 0.6);
    glow2.addColorStop(0, `rgba(${r},${g},${b},${glowAlpha})`);
    glow2.addColorStop(1, `rgba(${r},${g},${b},0)`);
    ctx.fillStyle = glow2;
    ctx.fillRect(i * LANE_W, TARGET_Y - 40, LANE_W, 80);
    ctx.restore();

    // Target outline
    ctx.strokeStyle = `rgba(${r},${g},${b},${pressed ? 0.9 : 0.3})`;
    ctx.lineWidth = pressed ? 3 : 1.5;
    ctx.beginPath();
    ctx.arc(x, TARGET_Y, ARROW_SIZE * 0.7, 0, Math.PI * 2);
    ctx.stroke();

    // Draw static arrow outline in target
    ctx.globalAlpha = pressed ? 0.7 : 0.2;
    drawArrow(x, TARGET_Y, i, pressed ? 0.7 : 0.2);
    ctx.globalAlpha = 1;

    // Lane label at bottom
    ctx.fillStyle = `rgba(${r},${g},${b},0.4)`;
    ctx.font = 'bold 10px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(LANE_LABELS[i], x, H - 12);
  }

  // Target line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath();
  ctx.moveTo(0, TARGET_Y);
  ctx.lineTo(W, TARGET_Y);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFeedbacks(now) {
  feedbacks = feedbacks.filter(f => now - f.time < 800);
  for (const f of feedbacks) {
    const age = now - f.time;
    const alpha = 1 - age / 800;
    const rise = age * 0.08;
    const scale = 1 + age * 0.001;

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = `bold ${16 * scale}px "Segoe UI", Tahoma, sans-serif`;
    ctx.textAlign = 'center';

    const colors = {
      'PERFECT!': '#ffd166',
      'GREAT!': '#44ff88',
      'GOOD!': '#00d4ff',
      'MISS': '#ff4757'
    };
    ctx.fillStyle = colors[f.text] || '#fff';

    // Shadow
    ctx.shadowColor = colors[f.text] || '#fff';
    ctx.shadowBlur = 10;

    ctx.fillText(f.text, f.x, f.y - rise);
    ctx.restore();
  }
}

function drawStartScreen() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  drawTargetZone();

  // Overlay
  ctx.fillStyle = 'rgba(15, 15, 26, 0.85)';
  ctx.fillRect(0, 0, W, H);

  // Title
  ctx.font = 'bold 40px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  const grad = ctx.createLinearGradient(W / 2 - 80, 0, W / 2 + 80, 0);
  grad.addColorStop(0, '#ff4757');
  grad.addColorStop(0.33, '#00d4ff');
  grad.addColorStop(0.66, '#44ff88');
  grad.addColorStop(1, '#ffd166');
  ctx.fillStyle = grad;
  ctx.fillText('RHYTHM', W / 2, H / 2 - 60);

  // Instructions
  ctx.font = '16px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText('Use arrow keys to hit notes as they', W / 2, H / 2);
  ctx.fillText('reach the target zone', W / 2, H / 2 + 24);

  // Arrow key hints
  const hints = [
    { label: '\u2190', color: LANE_COLORS[0] },
    { label: '\u2193', color: LANE_COLORS[1] },
    { label: '\u2191', color: LANE_COLORS[2] },
    { label: '\u2192', color: LANE_COLORS[3] },
  ];
  const hintStartX = W / 2 - 90;
  hints.forEach((h, i) => {
    const hx = hintStartX + i * 60;
    ctx.fillStyle = 'rgba(255,255,255,0.1)';
    ctx.beginPath();
    ctx.roundRect(hx - 18, H / 2 + 50, 36, 36, 6);
    ctx.fill();
    ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
    ctx.fillStyle = h.color;
    ctx.fillText(h.label, hx, H / 2 + 75);
  });

  // Start prompt
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 400);
  ctx.globalAlpha = 0.6 + 0.4 * pulse;
  ctx.font = 'bold 18px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Press SPACE to start', W / 2, H / 2 + 140);
  ctx.globalAlpha = 1;
}

function drawResultsScreen() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  const totalNotes = counts.perfect + counts.great + counts.good + counts.miss;
  const accuracy = totalNotes > 0 ? ((counts.perfect + counts.great * 0.75 + counts.good * 0.5) / totalNotes * 100) : 0;

  // Grade
  let grade = 'F';
  if (accuracy >= 95) grade = 'S';
  else if (accuracy >= 90) grade = 'A';
  else if (accuracy >= 80) grade = 'B';
  else if (accuracy >= 70) grade = 'C';
  else if (accuracy >= 60) grade = 'D';

  const gradeColors = { S: '#ffd166', A: '#44ff88', B: '#00d4ff', C: '#888', D: '#ff9f43', F: '#ff4757' };

  ctx.font = 'bold 28px "Segoe UI", Tahoma, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.fillText('RESULTS', W / 2, 60);

  // Grade circle
  ctx.beginPath();
  ctx.arc(W / 2, 140, 45, 0, Math.PI * 2);
  ctx.strokeStyle = gradeColors[grade];
  ctx.lineWidth = 4;
  ctx.stroke();
  ctx.font = 'bold 48px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = gradeColors[grade];
  ctx.fillText(grade, W / 2, 158);

  // Score
  ctx.font = 'bold 36px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText(score.toLocaleString(), W / 2, 230);
  ctx.font = '14px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText('TOTAL SCORE', W / 2, 250);

  // Stats
  const statsY = 290;
  const stats = [
    { label: 'PERFECT', val: counts.perfect, color: '#ffd166' },
    { label: 'GREAT', val: counts.great, color: '#44ff88' },
    { label: 'GOOD', val: counts.good, color: '#00d4ff' },
    { label: 'MISS', val: counts.miss, color: '#ff4757' },
  ];

  stats.forEach((s, i) => {
    const sy = statsY + i * 40;
    ctx.font = 'bold 14px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillStyle = s.color;
    ctx.fillText(s.label, W / 2 - 80, sy);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
    ctx.fillText(s.val, W / 2 + 80, sy);
  });

  // Max combo & accuracy
  const extraY = statsY + stats.length * 40 + 20;
  ctx.textAlign = 'center';
  ctx.font = '14px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#888';
  ctx.fillText('MAX COMBO', W / 2 - 70, extraY);
  ctx.fillText('ACCURACY', W / 2 + 70, extraY);
  ctx.font = 'bold 24px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#00d4ff';
  ctx.fillText(maxCombo + 'x', W / 2 - 70, extraY + 30);
  ctx.fillStyle = '#44ff88';
  ctx.fillText(accuracy.toFixed(1) + '%', W / 2 + 70, extraY + 30);

  // Restart prompt
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 400);
  ctx.globalAlpha = 0.6 + 0.4 * pulse;
  ctx.font = 'bold 16px "Segoe UI", Tahoma, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('Press SPACE to play again', W / 2, H - 40);
  ctx.globalAlpha = 1;
}

function judgeHit(laneIdx) {
  const now = performance.now();
  const gameTime = now - gameStartTime;
  let bestArrow = null;
  let bestDiff = Infinity;

  for (const arrow of arrows) {
    if (arrow.lane !== laneIdx || arrow.hit || arrow.missed) continue;
    const diff = Math.abs(gameTime - arrow.time);
    if (diff < bestDiff) {
      bestDiff = diff;
      bestArrow = arrow;
    }
  }

  if (!bestArrow || bestDiff > MISS_WINDOW) return;

  bestArrow.hit = true;
  const x = laneIdx * LANE_W + LANE_W / 2;

  let grade, points, text;
  if (bestDiff <= PERFECT_WINDOW) {
    grade = 'perfect'; points = SCORE_PERFECT; text = 'PERFECT!';
    try { window.SFX?.correct(); } catch(e) {}
  } else if (bestDiff <= GREAT_WINDOW) {
    grade = 'great'; points = SCORE_GREAT; text = 'GREAT!';
    try { window.SFX?.correct(); } catch(e) {}
  } else if (bestDiff <= GOOD_WINDOW) {
    grade = 'good'; points = SCORE_GOOD; text = 'GOOD!';
    try { window.SFX?.coin(); } catch(e) {}
  } else {
    grade = 'miss'; points = 0; text = 'MISS';
    try { window.SFX?.fail(); } catch(e) {}
  }

  counts[grade]++;

  if (grade === 'miss') {
    combo = 0;
  } else {
    combo++;
    if (combo > maxCombo) maxCombo = combo;
    if (combo >= 10 && combo % 10 === 0) {
      try { window.SFX?.combo(); } catch(e) {}
    }
  }

  const multiplier = Math.min(4, 1 + Math.floor(combo / 10));
  score += points * multiplier;

  feedbacks.push({ text, x, y: TARGET_Y - 30, time: now });
  document.getElementById('scoreDisp').textContent = score;
  document.getElementById('comboDisp').textContent = combo;
}

function startGame() {
  state = 'playing';
  score = 0;
  combo = 0;
  maxCombo = 0;
  counts = { perfect: 0, great: 0, good: 0, miss: 0 };
  arrows = [];
  feedbacks = [];
  nextArrowIdx = 0;
  songPattern = generateSong();
  gameStartTime = performance.now();
  elapsed = 0;
  document.getElementById('scoreDisp').textContent = '0';
  document.getElementById('comboDisp').textContent = '0';
}

function endGame() {
  state = 'results';
  try { window.SFX?.win(); } catch(e) {}
  if (score > 0) {
    try { window.HallOfFame?.submit('rhythm', score); } catch(e) {}
  }
}

function update(now) {
  if (state !== 'playing') return;

  const gameTime = now - gameStartTime;
  elapsed = gameTime;

  const remaining = Math.max(0, Math.ceil((songDuration - gameTime) / 1000));
  document.getElementById('timeDisp').textContent = remaining;

  // Spawn arrows that are within view
  while (nextArrowIdx < songPattern.length) {
    const note = songPattern[nextArrowIdx];
    if (note.time - SPAWN_AHEAD <= gameTime) {
      arrows.push({
        lane: note.lane,
        time: note.time,
        hit: false,
        missed: false
      });
      nextArrowIdx++;
    } else {
      break;
    }
  }

  // Check for missed arrows
  for (const arrow of arrows) {
    if (!arrow.hit && !arrow.missed && gameTime - arrow.time > MISS_WINDOW) {
      arrow.missed = true;
      counts.miss++;
      combo = 0;
      document.getElementById('comboDisp').textContent = '0';
      feedbacks.push({
        text: 'MISS',
        x: arrow.lane * LANE_W + LANE_W / 2,
        y: TARGET_Y - 30,
        time: now
      });
      try { window.SFX?.fail(); } catch(e) {}
    }
  }

  // Remove old arrows
  arrows = arrows.filter(a => {
    if (a.hit) return now - gameStartTime - a.time < 300; // keep briefly for fade
    if (a.missed) return now - gameStartTime - a.time < 500;
    return a.time - gameTime < SPAWN_AHEAD + 500;
  });

  // Check end
  if (gameTime >= songDuration) {
    endGame();
  }
}

function draw(now) {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  if (state === 'start') {
    drawStartScreen();
    requestAnimationFrame(draw);
    return;
  }

  if (state === 'results') {
    drawResultsScreen();
    requestAnimationFrame(draw);
    return;
  }

  update(now);

  const gameTime = now - gameStartTime;

  // Draw beat lines (subtle horizontal lines pulsing to BPM)
  const BPM = 130;
  const beatMs = 60000 / BPM;
  const beatPhase = (gameTime % beatMs) / beatMs;
  const beatAlpha = Math.max(0, 0.08 * (1 - beatPhase));
  ctx.strokeStyle = `rgba(255,255,255,${beatAlpha})`;
  ctx.lineWidth = 1;
  for (let y = 0; y < H; y += 60) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Draw target zone
  drawTargetZone();

  // Draw combo multiplier
  const multiplier = Math.min(4, 1 + Math.floor(combo / 10));
  if (multiplier > 1) {
    ctx.font = 'bold 22px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = multiplier >= 4 ? '#ffd166' : multiplier >= 3 ? '#44ff88' : '#00d4ff';
    ctx.globalAlpha = 0.7;
    ctx.fillText(multiplier + 'x', W / 2, 30);
    ctx.globalAlpha = 1;
  }

  // Draw arrows
  for (const arrow of arrows) {
    const timeDiff = arrow.time - gameTime;
    const y = TARGET_Y - timeDiff * ARROW_SPEED;
    const x = arrow.lane * LANE_W + LANE_W / 2;

    if (arrow.hit) {
      // Fade out hit arrows
      const age = gameTime - arrow.time;
      const alpha = Math.max(0, 1 - age / 300);
      const scale = 1 + age / 200;
      ctx.save();
      ctx.globalAlpha = alpha;
      drawArrow(x, y, arrow.lane, alpha);
      ctx.restore();
    } else if (arrow.missed) {
      // Fade out missed arrows
      const age = gameTime - arrow.time;
      const alpha = Math.max(0, 0.3 - age / 500);
      drawArrow(x, y, arrow.lane, alpha);
    } else if (y > -ARROW_SIZE && y < H + ARROW_SIZE) {
      // Normal arrow with subtle trail
      const trailLen = 3;
      for (let t = trailLen; t >= 1; t--) {
        drawArrow(x, y - t * 8, arrow.lane, 0.05 * t);
      }
      drawArrow(x, y, arrow.lane, 1);
    }
  }

  // Draw feedbacks
  drawFeedbacks(now);

  // Combo display on canvas
  if (combo >= 5) {
    ctx.font = 'bold 14px "Segoe UI", Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText(combo + ' COMBO', W / 2, TARGET_Y + 50);
  }

  requestAnimationFrame(draw);
}

// Input handling
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    if (state === 'start' || state === 'results') {
      startGame();
    }
    return;
  }

  const laneIdx = LANE_KEYS.indexOf(e.key);
  if (laneIdx === -1) return;
  e.preventDefault();

  if (state === 'playing' && !e.repeat) {
    lanePressed[laneIdx] = true;
    lanePressTime[laneIdx] = performance.now();
    judgeHit(laneIdx);
  }
});

document.addEventListener('keyup', (e) => {
  const laneIdx = LANE_KEYS.indexOf(e.key);
  if (laneIdx === -1) return;
  lanePressed[laneIdx] = false;
});

// Start render loop
requestAnimationFrame(draw);
</script>
