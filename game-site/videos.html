<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTubeish — Arcade</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:#0f0f1a; color:#e0e0e0; min-height:100vh; }
a.back { position:fixed; top:12px; left:16px; color:#888; text-decoration:none; font-size:0.85rem; z-index:100; }
a.back:hover { color:#e0e0e0; }
.container { max-width:900px; margin:0 auto; padding:1rem; }
h1 { text-align:center; font-size:1.8rem; margin-bottom:0.3rem; }
h1 span { background:linear-gradient(135deg,#ff4757,#ff6b81); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.subtitle { text-align:center; color:#666; font-size:0.8rem; margin-bottom:1.2rem; }
.upload-btn { display:none; margin:0 auto 1.2rem; padding:0.5rem 1.5rem; border-radius:10px; border:2px solid #ff4757; background:linear-gradient(135deg,#ff4757,#ff6b81); color:#fff; font-family:inherit; font-size:0.9rem; font-weight:600; cursor:pointer; }
.upload-btn:hover { opacity:0.9; }
.vid-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
.vid-card { background:#1a1a2e; border:2px solid #2a2a4a; border-radius:12px; overflow:hidden; cursor:pointer; transition:transform 0.2s,border-color 0.2s; }
.vid-card:hover { transform:translateY(-3px); border-color:#ff4757; }
.vid-thumb { width:100%; aspect-ratio:16/9; background:#111; display:flex; align-items:center; justify-content:center; font-size:3rem; color:#333; }
.vid-info { padding:10px 12px; }
.vid-info h3 { font-size:0.9rem; margin-bottom:4px; }
.vid-info .vid-meta { font-size:0.7rem; color:#666; display:flex; gap:8px; }
#player-view { display:none; }
#player-view.active { display:block; }
#feed-view.hidden { display:none; }
.player-back { display:inline-flex; align-items:center; gap:6px; color:#aaa; font-size:0.85rem; cursor:pointer; padding:6px 10px; border-radius:8px; border:none; background:none; font-family:inherit; margin-bottom:12px; }
.player-back:hover { background:rgba(255,255,255,.08); color:#fff; }
.player-wrapper { width:100%; padding-top:56.25%; position:relative; background:#000; border-radius:12px; overflow:hidden; margin-bottom:16px; }
.player-wrapper iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
.player-title { font-size:1.3rem; font-weight:600; margin-bottom:4px; }
.player-meta { font-size:0.75rem; color:#666; margin-bottom:12px; }
.like-btn { padding:6px 16px; border-radius:8px; border:2px solid #ff4757; background:none; color:#ff4757; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; margin-bottom:16px; }
.like-btn.liked { background:#ff4757; color:#fff; }
.like-btn:hover { opacity:0.85; }
.player-desc { color:#aaa; font-size:0.85rem; margin-bottom:20px; padding:12px; background:#1a1a2e; border-radius:10px; }
.comments-section h3 { font-size:0.95rem; margin-bottom:10px; }
.comment-form { display:flex; gap:8px; margin-bottom:16px; }
.comment-form input { flex:1; background:#1a1a2e; border:1px solid #2a2a4a; border-radius:8px; color:#e0e0e0; font-family:inherit; font-size:0.85rem; padding:8px 12px; outline:none; }
.comment-form input:focus { border-color:#ff4757; }
.comment-form button { padding:8px 16px; border-radius:8px; border:none; background:#ff4757; color:#fff; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; }
.comment { padding:8px 12px; background:#1a1a2e; border-radius:8px; margin-bottom:6px; }
.comment .c-name { color:#ff6b81; font-weight:600; font-size:0.8rem; }
.comment .c-text { color:#ccc; font-size:0.82rem; margin-top:2px; }
.comment .c-date { color:#555; font-size:0.65rem; margin-top:2px; }
.no-comments { color:#555; font-size:0.8rem; font-style:italic; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:10000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#1a1a2e; border:2px solid #2a2a4a; border-radius:16px; padding:1.5rem; width:440px; max-width:90vw; }
.modal h2 { font-size:1.1rem; color:#ff4757; margin-bottom:1rem; }
.modal label { display:block; color:#888; font-size:0.75rem; margin-bottom:4px; margin-top:10px; }
.modal input,.modal textarea { width:100%; background:#0f0f1a; border:1px solid #2a2a4a; border-radius:8px; color:#e0e0e0; font-family:inherit; font-size:0.85rem; padding:8px 12px; outline:none; }
.modal input:focus,.modal textarea:focus { border-color:#ff4757; }
.modal textarea { resize:none; height:60px; }
.modal .modal-btns { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
.modal .modal-btns button { padding:8px 20px; border-radius:8px; font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer; border:none; }
.modal .btn-cancel { background:#2a2a4a; color:#aaa; }
.modal .btn-submit { background:#ff4757; color:#fff; }
.modal .btn-submit:disabled { opacity:0.5; cursor:default; }
.modal .modal-err { color:#ff4757; font-size:0.75rem; margin-top:8px; min-height:1em; }
.empty-msg { text-align:center; color:#555; padding:3rem 1rem; font-size:0.9rem; }
.drop-zone { border:2px dashed #3a3a5a; border-radius:12px; padding:2rem; text-align:center; color:#666; font-size:0.85rem; cursor:pointer; transition:border-color 0.2s,background 0.2s; margin-top:10px; }
.drop-zone:hover,.drop-zone.dragover { border-color:#ff4757; background:rgba(255,71,87,0.05); }
.drop-zone .drop-icon { font-size:2rem; margin-bottom:8px; }
.drop-zone .file-name { color:#ff6b81; font-weight:600; margin-top:6px; }
.progress-bar { width:100%; height:6px; background:#2a2a4a; border-radius:3px; margin-top:10px; overflow:hidden; display:none; }
.progress-bar .fill { height:100%; background:linear-gradient(90deg,#ff4757,#ff6b81); border-radius:3px; width:0%; }
.progress-text { font-size:0.7rem; color:#888; margin-top:4px; text-align:center; }
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<div class="container">
  <h1>&#127909; <span>YouTubeish</span></h1>
  <p class="subtitle">Share & watch videos with the arcade community</p>
  <button class="upload-btn" id="upload-btn" onclick="showUploadModal()">+ Upload Video</button>

  <div id="feed-view">
    <div class="vid-grid" id="vid-grid"></div>
    <div class="empty-msg" id="empty-msg" style="display:none;">No videos yet. Be the first to upload!</div>
  </div>

  <div id="player-view">
    <button class="player-back" onclick="closePlayer()">&#8592; Back to feed</button>
    <div class="player-wrapper">
      <iframe id="vid-iframe" src="" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <h2 class="player-title" id="vid-title"></h2>
    <div class="player-meta" id="vid-meta"></div>
    <button class="like-btn" id="like-btn" onclick="toggleLike()">&#10084; Like</button>
    <button class="like-btn" id="delete-btn" onclick="deleteVideo()" style="display:none;border-color:#666;color:#666;">&#128465; Delete</button>
    <div class="player-desc" id="vid-desc"></div>
    <div class="comments-section">
      <h3>Comments</h3>
      <div class="comment-form" id="comment-form" style="display:none;">
        <input id="comment-input" placeholder="Add a comment..." maxlength="300">
        <button onclick="postComment()">Post</button>
      </div>
      <div id="comments-list"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="upload-modal">
  <div class="modal">
    <h2>&#127909; Upload Video</h2>
    <label>Title</label>
    <input id="up-title" placeholder="My awesome video" maxlength="100">
    <label>Description (optional)</label>
    <textarea id="up-desc" placeholder="What's this video about?"></textarea>
    <div class="drop-zone" id="drop-zone">
      <div class="drop-icon">&#128228;</div>
      <div>Drag & drop a video here, or click to browse</div>
      <div class="file-name" id="file-name"></div>
      <input type="file" id="file-input" accept="video/*,image/*,audio/*" style="display:none;">
    </div>
    <div class="progress-bar" id="progress-bar"><div class="fill" id="progress-fill"></div></div>
    <div class="progress-text" id="progress-text"></div>
    <p style="color:#555;font-size:0.65rem;margin-top:6px;">Max 100MB. Videos, images, and audio supported.</p>
    <div class="modal-err" id="up-err"></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="hideUploadModal()">Cancel</button>
      <button class="btn-submit" id="submit-btn" onclick="submitVideo()">Upload</button>
    </div>
  </div>
</div>

<script>
var UPLOAD_URL = 'https://script.google.com/macros/s/AKfycbwE24DZ_KMueTFxFen2ORb-X9GOQYD8Tr69KPXGE9DybtsngxceYHi_Yyh5OeHAtL3-fw/exec';
var currentVideoId = null;
var videosCache = [];
var selectedFile = null;
var MAX_SIZE = 100 * 1024 * 1024;

function getUser() {
  return localStorage.getItem('arcade_currentUser') || '';
}

function timeAgo(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var s = Math.floor((Date.now() - d.getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  if (s < 604800) return Math.floor(s/86400) + 'd ago';
  return d.toLocaleDateString();
}

function escHtml(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// Drop zone
var dropZone = document.getElementById('drop-zone');
var fileInput = document.getElementById('file-input');

dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function() {
  if (fileInput.files[0]) handleFile(fileInput.files[0]);
});

function handleFile(f) {
  document.getElementById('up-err').textContent = '';
  if (!f.type.startsWith('video/') && !f.type.startsWith('image/') && !f.type.startsWith('audio/')) {
    document.getElementById('up-err').textContent = 'Please select a video, image, or audio file';
    return;
  }
  if (f.size > MAX_SIZE) {
    document.getElementById('up-err').textContent = 'File too large (max 100MB)';
    return;
  }
  selectedFile = f;
  document.getElementById('file-name').textContent = f.name + ' (' + (f.size / 1024 / 1024).toFixed(1) + ' MB)';
}

function showUploadModal() {
  document.getElementById('upload-modal').classList.add('show');
  document.getElementById('up-title').value = '';
  document.getElementById('up-desc').value = '';
  document.getElementById('up-err').textContent = '';
  document.getElementById('file-name').textContent = '';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('progress-text').textContent = '';
  document.getElementById('submit-btn').disabled = false;
  selectedFile = null;
  fileInput.value = '';
}

function hideUploadModal() {
  document.getElementById('upload-modal').classList.remove('show');
}

async function submitVideo() {
  var fdb = window._arcadeDB;
  if (!fdb) { document.getElementById('up-err').textContent = 'Firebase not loaded yet'; return; }
  var user = getUser();
  if (!user) { document.getElementById('up-err').textContent = 'Sign in first'; return; }
  var title = document.getElementById('up-title').value.trim();
  var desc = document.getElementById('up-desc').value.trim();
  if (!title) { document.getElementById('up-err').textContent = 'Title required'; return; }
  if (!selectedFile) { document.getElementById('up-err').textContent = 'Select a video file'; return; }

  document.getElementById('submit-btn').disabled = true;
  document.getElementById('up-err').textContent = '';
  document.getElementById('progress-bar').style.display = '';
  document.getElementById('progress-text').textContent = 'Reading file...';
  document.getElementById('progress-fill').style.width = '10%';

  try {
    // Read file as base64
    var base64 = await new Promise(function(resolve, reject) {
      var reader = new FileReader();
      reader.onload = function() {
        var result = reader.result.split(',')[1]; // strip data:video/...;base64,
        resolve(result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(selectedFile);
    });

    document.getElementById('progress-text').textContent = 'Uploading to server...';
    document.getElementById('progress-fill').style.width = '30%';

    // Upload to Google Apps Script
    document.getElementById('progress-fill').style.width = '30%';
    document.getElementById('progress-text').textContent = 'Uploading to server...';

    // Send as multipart form data via fetch with no-cors, then poll for the file
    var formData = new FormData();
    formData.append('data', base64);
    formData.append('name', selectedFile.name);
    formData.append('type', selectedFile.type);

    // Use no-cors to avoid redirect issues - we won't get the response
    await fetch(UPLOAD_URL, { method: 'POST', body: formData, mode: 'no-cors' });

    document.getElementById('progress-fill').style.width = '70%';
    document.getElementById('progress-text').textContent = 'Waiting for server...';

    // Poll the folder via doGet to find the new file
    var fileName = selectedFile.name;
    var result = null;
    for (var attempt = 0; attempt < 30; attempt++) {
      await new Promise(function(r) { setTimeout(r, 2000); });
      try {
        var checkResp = await fetch(UPLOAD_URL + '?check=' + encodeURIComponent(fileName));
        var checkData = await checkResp.json();
        if (checkData.id) { result = checkData; break; }
      } catch(e) {}
      document.getElementById('progress-fill').style.width = (70 + attempt) + '%';
    }

    document.getElementById('progress-fill').style.width = '90%';
    document.getElementById('progress-text').textContent = 'Processing...';

    if (!result || !result.id) throw new Error('Upload timed out - file may still be processing');

    document.getElementById('progress-fill').style.width = '95%';
    document.getElementById('progress-text').textContent = 'Saving...';

    // Save metadata to Firestore
    var fileType = selectedFile.type.startsWith('image/') ? 'image' : selectedFile.type.startsWith('audio/') ? 'audio' : 'video';
    await fdb.addDoc(fdb.collection(fdb.db, 'videos'), {
      title: title,
      description: desc,
      driveId: result.id,
      fileType: fileType,
      uploader: user,
      date: new Date().toISOString(),
      likes: [],
      comments: []
    });

    document.getElementById('progress-fill').style.width = '100%';
    document.getElementById('progress-text').textContent = 'Done!';
    setTimeout(function() {
      hideUploadModal();
      loadVideos();
    }, 500);
  } catch(e) {
    document.getElementById('up-err').textContent = 'Upload failed: ' + e.message;
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('progress-bar').style.display = 'none';
  }
}

async function loadVideos() {
  var fdb = window._arcadeDB;
  if (!fdb) { setTimeout(loadVideos, 500); return; }
  try {
    var snap = await fdb.getDocs(fdb.collection(fdb.db, 'videos'));
    var vids = [];
    snap.forEach(function(d) { vids.push({ id: d.id, ...d.data() }); });
    vids.sort(function(a,b) { return (b.date || '').localeCompare(a.date || ''); });
    videosCache = vids;
    renderFeed(vids);
  } catch(e) { console.error('Load videos error:', e); }
}

function renderFeed(vids) {
  var grid = document.getElementById('vid-grid');
  grid.innerHTML = '';
  document.getElementById('empty-msg').style.display = vids.length ? 'none' : '';
  vids.forEach(function(v) {
    var card = document.createElement('div');
    card.className = 'vid-card';
    card.innerHTML =
      '<div class="vid-thumb">&#9654;</div>' +
      '<div class="vid-info"><h3>' + escHtml(v.title) + '</h3>' +
      '<div class="vid-meta"><span>' + escHtml(v.uploader || 'Anonymous') + '</span>' +
      '<span>' + timeAgo(v.date) + '</span>' +
      '<span>&#10084; ' + (v.likes ? v.likes.length : 0) + '</span></div></div>';
    card.onclick = function() { openVideo(v.id); };
    grid.appendChild(card);
  });
}

function openVideo(id) {
  var v = videosCache.find(function(x) { return x.id === id; });
  if (!v) return;
  currentVideoId = id;
  document.getElementById('feed-view').classList.add('hidden');
  document.getElementById('player-view').classList.add('active');
  var wrapper = document.querySelector('.player-wrapper');
  var driveUrl = 'https://drive.google.com/file/d/' + v.driveId;
  if (v.fileType === 'image') {
    wrapper.innerHTML = '<img src="https://lh3.googleusercontent.com/d/' + v.driveId + '" style="width:100%;border-radius:12px;max-height:70vh;object-fit:contain;">';
    wrapper.style.paddingTop = '0';
  } else {
    wrapper.innerHTML = '<iframe id="vid-iframe" src="" allow="autoplay; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>';
    wrapper.style.paddingTop = '56.25%';
    document.getElementById('vid-iframe').src = driveUrl + '/preview';
  }
  document.getElementById('vid-title').textContent = v.title;
  document.getElementById('vid-meta').textContent = 'Uploaded by ' + (v.uploader || 'Anonymous') + ' \u2022 ' + timeAgo(v.date) + ' \u2022 ' + (v.likes ? v.likes.length : 0) + ' likes';
  document.getElementById('vid-desc').textContent = v.description || 'No description';
  var user = getUser();
  var liked = v.likes && v.likes.indexOf(user) !== -1;
  var likeBtn = document.getElementById('like-btn');
  likeBtn.className = 'like-btn' + (liked ? ' liked' : '');
  likeBtn.innerHTML = '&#10084; ' + (liked ? 'Liked' : 'Like') + ' (' + (v.likes ? v.likes.length : 0) + ')';
  document.getElementById('comment-form').style.display = user ? 'flex' : 'none';
  document.getElementById('comment-input').value = '';
  document.getElementById('delete-btn').style.display = (user && user === v.uploader) ? '' : 'none';
  renderComments(v.comments || []);
}

async function deleteVideo() {
  var fdb = window._arcadeDB;
  var user = getUser();
  if (!fdb || !currentVideoId || !user) return;
  var v = videosCache.find(function(x) { return x.id === currentVideoId; });
  if (!v || v.uploader !== user) return;
  if (!confirm('Delete this video? This cannot be undone.')) return;
  try {
    await fdb.deleteDoc(fdb.doc(fdb.db, 'videos', currentVideoId));
    closePlayer();
    loadVideos();
  } catch(e) { console.error('Delete error:', e); }
}

function closePlayer() {
  document.getElementById('player-view').classList.remove('active');
  document.getElementById('feed-view').classList.remove('hidden');
  var wrapper = document.querySelector('.player-wrapper');
  wrapper.innerHTML = '<iframe id="vid-iframe" src="" allow="autoplay; fullscreen" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:none;"></iframe>';
  wrapper.style.paddingTop = '56.25%';
  currentVideoId = null;
}

async function toggleLike() {
  var fdb = window._arcadeDB;
  var user = getUser();
  if (!user || !fdb || !currentVideoId) return;
  var v = videosCache.find(function(x) { return x.id === currentVideoId; });
  if (!v) return;
  var ref = fdb.doc(fdb.db, 'videos', currentVideoId);
  var liked = v.likes && v.likes.indexOf(user) !== -1;
  try {
    if (liked) {
      await fdb.updateDoc(ref, { likes: fdb.arrayRemove(user) });
      v.likes = v.likes.filter(function(u) { return u !== user; });
    } else {
      await fdb.updateDoc(ref, { likes: fdb.arrayUnion(user) });
      if (!v.likes) v.likes = [];
      v.likes.push(user);
    }
    openVideo(currentVideoId);
  } catch(e) { console.error('Like error:', e); }
}

async function postComment() {
  var fdb = window._arcadeDB;
  var user = getUser();
  if (!user || !fdb || !currentVideoId) return;
  var text = document.getElementById('comment-input').value.trim();
  if (!text) return;
  var v = videosCache.find(function(x) { return x.id === currentVideoId; });
  if (!v) return;
  var comment = { name: user, text: text, date: new Date().toISOString() };
  try {
    var ref = fdb.doc(fdb.db, 'videos', currentVideoId);
    await fdb.updateDoc(ref, { comments: fdb.arrayUnion(comment) });
    if (!v.comments) v.comments = [];
    v.comments.push(comment);
    document.getElementById('comment-input').value = '';
    renderComments(v.comments);
  } catch(e) { console.error('Comment error:', e); }
}

function renderComments(comments) {
  var list = document.getElementById('comments-list');
  list.innerHTML = '';
  if (!comments.length) { list.innerHTML = '<div class="no-comments">No comments yet</div>'; return; }
  comments.slice().reverse().forEach(function(c) {
    var el = document.createElement('div');
    el.className = 'comment';
    el.innerHTML = '<div class="c-name">' + escHtml(c.name) + '</div><div class="c-text">' + escHtml(c.text) + '</div><div class="c-date">' + timeAgo(c.date) + '</div>';
    list.appendChild(el);
  });
}

function checkAuth() {
  var user = getUser();
  document.getElementById('upload-btn').style.display = user ? 'block' : 'none';
}

window.addEventListener('arcade-auth-change', checkAuth);
window.addEventListener('load', function() {
  setTimeout(function() { checkAuth(); loadVideos(); }, 600);
});
</script>
