<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunnel Rush</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f1a;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 20px 20px}
  h1{font-size:2.2rem;margin-bottom:1rem;background:linear-gradient(90deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
  canvas{border:2px solid #2a2a4a;border-radius:12px;display:block;max-width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
  a.back{position:fixed;top:14px;left:14px;z-index:10001;color:#aaa;text-decoration:none;font-size:15px;background:#1a1a2e;border:1px solid #2a2a4a;padding:6px 14px;border-radius:8px;transition:background .2s,color .2s}
  a.back:hover{background:#2a2a4a;color:#fff}
</style>
</head>
<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>Tunnel Rush</h1>
<canvas id="c" width="600" height="600"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const W=600,H=600,CX=W/2,CY=H/2;
let playerAngle=0,speed=2,score=0,bestScore=0,state='menu';
let obstacles=[],hue=0,distance=0;

function spawnObstacle(){
  let type=Math.random();
  if(type<0.4){
    // Gap obstacle: ring with a gap
    let gapAngle=Math.random()*Math.PI*2;
    let gapSize=0.8+Math.random()*0.6;
    obstacles.push({z:800,type:'ring',gapAngle,gapSize,color:`hsl(${Math.random()*360},70%,55%)`});
  }else if(type<0.7){
    // Half wall
    let angle=Math.random()*Math.PI*2;
    obstacles.push({z:800,type:'half',angle,color:`hsl(${Math.random()*360},70%,55%)`});
  }else{
    // Double gap
    let a1=Math.random()*Math.PI*2;
    obstacles.push({z:800,type:'double',angle:a1,color:`hsl(${Math.random()*360},70%,55%)`});
  }
}

function reset(){
  playerAngle=0;speed=2;score=0;distance=0;obstacles=[];
  for(let i=0;i<8;i++){
    obstacles.push({z:200+i*100,type:'ring',gapAngle:Math.random()*Math.PI*2,gapSize:0.8+Math.random()*0.6,color:`hsl(${Math.random()*360},70%,55%)`});
  }
}

let keys={};
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if((state==='menu'||state==='dead')&&(e.code==='Space'||e.code==='Enter')){reset();state='play';}
  e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});
canvas.addEventListener('click',()=>{
  if(state==='menu'||state==='dead'){reset();state='play';}
});

function angleDiff(a,b){
  let d=((a-b)%(Math.PI*2)+(Math.PI*3))%(Math.PI*2)-Math.PI;
  return d;
}

function update(){
  if(state!=='play')return;
  // Steering
  let turnSpeed=0.045+speed*0.003;
  if(keys['ArrowLeft']||keys['KeyA'])playerAngle-=turnSpeed;
  if(keys['ArrowRight']||keys['KeyD'])playerAngle+=turnSpeed;

  // Speed increases over time
  speed=2+distance*0.003;
  if(speed>8)speed=8;
  distance+=speed;
  score=Math.floor(distance);

  // Move obstacles toward player
  for(let i=obstacles.length-1;i>=0;i--){
    obstacles[i].z-=speed;
    if(obstacles[i].z<-50){
      obstacles.splice(i,1);
    }
  }

  // Spawn new obstacles
  while(obstacles.length<10){
    let lastZ=obstacles.length>0?obstacles[obstacles.length-1].z:0;
    spawnObstacle();
    obstacles[obstacles.length-1].z=lastZ+80+Math.random()*40;
  }

  // Collision check with nearest obstacle
  for(let ob of obstacles){
    if(ob.z>5||ob.z<-15)continue;
    let playerR=0.3; // player radius as fraction of tunnel
    let tunnelR=1.0;
    let pAngle=playerAngle;
    let hit=false;

    if(ob.type==='ring'){
      let diff=Math.abs(angleDiff(pAngle,ob.gapAngle));
      if(diff>ob.gapSize/2){
        hit=true;
      }
    }else if(ob.type==='half'){
      let diff=angleDiff(pAngle,ob.angle);
      if(diff>0&&diff<Math.PI){
        hit=true;
      }
    }else if(ob.type==='double'){
      let diff1=Math.abs(angleDiff(pAngle,ob.angle));
      let diff2=Math.abs(angleDiff(pAngle,ob.angle+Math.PI));
      if(diff1>0.5&&diff2>0.5){
        hit=true;
      }
    }

    if(hit){
      state='dead';
      bestScore=Math.max(bestScore,score);
      if(typeof HallOfFame!=='undefined')HallOfFame.submit('tunnelrush',score);
      return;
    }
  }
  hue=(hue+0.5)%360;
}

function project(angle,z,radius){
  let scale=300/(z+100);
  let x=CX+Math.cos(angle)*radius*scale;
  let y=CY+Math.sin(angle)*radius*scale;
  return{x,y,scale};
}

function draw(){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);

  // Draw tunnel rings
  for(let d=600;d>0;d-=30){
    let scale=300/(d+100);
    let r=250*scale;
    ctx.strokeStyle=`hsla(${(hue+d*0.3)%360},50%,20%,0.3)`;
    ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(CX,CY,r,0,Math.PI*2);ctx.stroke();
  }

  // Draw obstacles (back to front)
  let sorted=[...obstacles].sort((a,b)=>b.z-a.z);
  for(let ob of sorted){
    if(ob.z<0)continue;
    let scale=300/(ob.z+100);
    let r=250*scale;
    ctx.lineWidth=Math.max(2,12*scale);

    if(ob.type==='ring'){
      ctx.strokeStyle=ob.color;
      let start=ob.gapAngle+ob.gapSize/2;
      let end=ob.gapAngle-ob.gapSize/2+Math.PI*2;
      ctx.beginPath();ctx.arc(CX,CY,r,start,end);ctx.stroke();
      // Glow
      ctx.strokeStyle=ob.color.replace('55%','70%').replace(')',',0.3)').replace('hsl','hsla');
      ctx.lineWidth=Math.max(1,18*scale);
      ctx.beginPath();ctx.arc(CX,CY,r,start,end);ctx.stroke();
    }else if(ob.type==='half'){
      ctx.strokeStyle=ob.color;
      ctx.beginPath();ctx.arc(CX,CY,r,ob.angle,ob.angle+Math.PI);ctx.stroke();
    }else if(ob.type==='double'){
      ctx.strokeStyle=ob.color;
      ctx.beginPath();ctx.arc(CX,CY,r,ob.angle-0.5,ob.angle+0.5);ctx.stroke();
      ctx.beginPath();ctx.arc(CX,CY,r,ob.angle+Math.PI-0.5,ob.angle+Math.PI+0.5);ctx.stroke();
    }
  }

  // Draw player
  if(state==='play'){
    let pr=250*300/(100+100)*0.85;
    let px=CX+Math.cos(playerAngle)*pr*0.4;
    let py=CY+Math.sin(playerAngle)*pr*0.4;
    // Glow
    let grad=ctx.createRadialGradient(px,py,0,px,py,20);
    grad.addColorStop(0,`hsla(${hue},100%,70%,0.6)`);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.beginPath();ctx.arc(px,py,20,0,Math.PI*2);ctx.fill();
    // Core
    ctx.fillStyle=`hsl(${hue},100%,70%)`;
    ctx.beginPath();ctx.arc(px,py,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();
  }

  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 22px Segoe UI';ctx.textAlign='center';
  ctx.fillText(score+'m',CX,40);

  if(state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#00d4ff';ctx.font='bold 48px Segoe UI';ctx.textAlign='center';
    ctx.fillText('TUNNEL RUSH',CX,CY-50);
    ctx.fillStyle='#aaa';ctx.font='20px Segoe UI';
    ctx.fillText('Click or Space to start',CX,CY+10);
    ctx.fillText('Left/Right arrows to dodge',CX,CY+40);
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e74c3c';ctx.font='bold 44px Segoe UI';ctx.textAlign='center';
    ctx.fillText('CRASHED!',CX,CY-50);
    ctx.fillStyle='#fff';ctx.font='24px Segoe UI';
    ctx.fillText('Distance: '+score+'m',CX,CY);
    ctx.fillText('Best: '+bestScore+'m',CX,CY+35);
    ctx.fillStyle='#aaa';ctx.font='18px Segoe UI';
    ctx.fillText('Click or Space to retry',CX,CY+75);
  }
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
<script src="sound.js?v=2"></script>
<script src="fame.js?v=4"></script>
<script type="module" src="firebase-lb.js?v=4"></script>
<script src="coins.js"></script>
<script src="avatar.js"></script>
<script src="admin.js"></script>
<script src="auth.js"></script>
<script src="theme.js?v=4"></script>
</body>
</html>
