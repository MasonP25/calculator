<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>
<style>
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    gap: 22px;
    max-width: 500px;
    width: 100%;
}

/* Mode & Difficulty Selectors */
.selector-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.selector-label {
    font-size: 0.85rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.selector-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

.selector-btn {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    color: #e0e0e0;
    padding: 8px 18px;
    border-radius: 8px;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: border-color 0.25s, background 0.25s, color 0.25s;
}

.selector-btn:hover {
    border-color: #7b2ff7;
}

.selector-btn.active {
    border-color: #7b2ff7;
    background: #2a1a4e;
    color: #ffffff;
}

/* Score Display */
.score-display {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 1.2rem;
    font-weight: 600;
    background: #1a1a2e;
    padding: 12px 28px;
    border-radius: 10px;
    border: 2px solid #2a2a4a;
}

.score-x { color: #00d4ff; }
.score-o { color: #ff4757; }
.score-draw { color: #aaa; }
.score-separator { color: #555; margin: 0 4px; }

/* Board */
.board {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    grid-template-rows: repeat(3, 100px);
    gap: 6px;
    background: #2a2a4a;
    border-radius: 12px;
    padding: 6px;
    position: relative;
}

.cell {
    background: #1a1a2e;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
}

.cell:hover:not(.taken):not(.game-over) {
    background: #22224a;
}

.cell.taken {
    cursor: default;
}

.cell.game-over {
    cursor: default;
}

/* X and O marks */
.cell .mark {
    opacity: 0;
    transform: scale(0.3) rotate(-20deg);
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.cell .mark.show {
    opacity: 1;
    transform: scale(1) rotate(0deg);
}

.cell .mark.x-mark {
    color: #00d4ff;
    text-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
}

.cell .mark.o-mark {
    color: #ff4757;
    text-shadow: 0 0 12px rgba(255, 71, 87, 0.4);
}

/* Winning highlight */
.cell.winner-cell {
    animation: winPulse 0.8s ease-in-out infinite alternate;
}

.cell.winner-cell .mark.x-mark {
    text-shadow: 0 0 24px rgba(0, 212, 255, 0.8), 0 0 48px rgba(0, 212, 255, 0.4);
}

.cell.winner-cell .mark.o-mark {
    text-shadow: 0 0 24px rgba(255, 71, 87, 0.8), 0 0 48px rgba(255, 71, 87, 0.4);
}

@keyframes winPulse {
    from { background: #1a1a2e; }
    to { background: #2a2a5a; }
}

/* Win line overlay */
.win-line {
    position: absolute;
    background: #7b2ff7;
    border-radius: 4px;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    box-shadow: 0 0 16px rgba(123, 47, 247, 0.6), 0 0 32px rgba(123, 47, 247, 0.3);
}

.win-line.show {
    opacity: 1;
}

/* Status */
.status {
    font-size: 1.15rem;
    font-weight: 600;
    min-height: 1.6em;
    text-align: center;
    transition: color 0.3s;
}

.status.x-turn { color: #00d4ff; }
.status.o-turn { color: #ff4757; }
.status.draw-msg { color: #aaa; }
.status.win-msg-x { color: #00d4ff; }
.status.win-msg-o { color: #ff4757; }

/* Buttons */
.new-game-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 12px 32px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}

.new-game-btn:hover {
    background: #6a22e0;
}

.new-game-btn:active {
    transform: scale(0.97);
}

a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
}
a.back:hover { color: #e0e0e0; }

/* Online Mode Styles */
.online-panel {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    text-align: center;
}

.online-panel h3 {
    margin-bottom: 15px;
    color: #e0e0e0;
    font-size: 1rem;
}

.online-lobby-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.online-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}

.online-btn:hover { background: #6a22e0; }
.online-btn:active { transform: scale(0.97); }

.online-btn.secondary {
    background: #2a2a4a;
}
.online-btn.secondary:hover { background: #3a3a5a; }

.room-code-display {
    font-size: 2.5rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 8px;
    margin: 15px 0;
    font-family: monospace;
}

.waiting-msg {
    color: #888;
    font-size: 0.9rem;
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.join-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.join-input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    color: #feca57;
    font-size: 1.8rem;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 6px;
    text-align: center;
    padding: 8px 16px;
    border-radius: 8px;
    width: 160px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.25s;
}

.join-input:focus { border-color: #7b2ff7; }
.join-input::placeholder {
    color: #444;
    letter-spacing: 2px;
    font-size: 1rem;
}

.join-error {
    color: #ff4757;
    font-size: 0.85rem;
}

.online-info {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 12px 20px;
    width: 100%;
    text-align: center;
    font-size: 0.85rem;
    color: #888;
}

.online-info .room-label {
    color: #feca57;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 3px;
}

.online-info .player-info {
    margin: 6px 0;
}

.you-x { color: #00d4ff; font-weight: 700; }
.you-o { color: #ff4757; font-weight: 700; }

.leave-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
}
.leave-btn:hover { background: #ff475722; }
</style>
</head>
<body>

<a class="back" href="index.html">&#8592; Back</a>
<h1>Tic Tac Toe</h1>

<div class="container">
    <!-- Mode Selector -->
    <div class="selector-group">
        <div class="selector-label">Mode</div>
        <div class="selector-row" id="mode-selector">
            <button class="selector-btn active" data-mode="2p">2 Player</button>
            <button class="selector-btn" data-mode="ai">vs AI</button>
            <button class="selector-btn" data-mode="online">Online</button>
        </div>
    </div>

    <!-- Difficulty Selector (visible only in AI mode) -->
    <div class="selector-group" id="difficulty-group" style="display:none;">
        <div class="selector-label">Difficulty</div>
        <div class="selector-row" id="difficulty-selector">
            <button class="selector-btn active" data-diff="easy">Easy</button>
            <button class="selector-btn" data-diff="medium">Medium</button>
            <button class="selector-btn" data-diff="hard">Hard</button>
        </div>
    </div>

    <!-- Online Panel -->
    <div class="online-panel" id="online-panel" style="display:none;">
        <h3>Online Multiplayer</h3>
        <div id="online-lobby-btns" class="online-lobby-btns">
            <button class="online-btn" id="create-game-btn">Create Game</button>
            <button class="online-btn secondary" id="join-game-btn">Join Game</button>
        </div>
        <div id="online-create-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Share this code with your friend:</p>
            <div class="room-code-display" id="room-code-display">----</div>
            <p class="waiting-msg" id="waiting-msg">Waiting for opponent to join...</p>
        </div>
        <div id="online-join-area" class="join-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem;">Enter room code:</p>
            <input class="join-input" id="join-code-input" type="text" maxlength="4" placeholder="CODE">
            <button class="online-btn" id="join-submit-btn">Join</button>
            <button class="leave-btn" id="join-back-btn" style="margin-top:4px;">Back</button>
            <p class="join-error" id="join-error" style="display:none;"></p>
        </div>
        <button class="leave-btn" id="online-leave-btn" style="display:none;">Cancel</button>
    </div>

    <!-- Online Info (shown during game) -->
    <div class="online-info" id="online-info" style="display:none;">
        <span>Room: <span class="room-label" id="game-room-code"></span></span>
        <div class="player-info" id="game-player-info"></div>
        <button class="leave-btn" id="online-leave-game-btn">Leave Game</button>
    </div>

    <div id="game-area">
    <!-- Score Display -->
    <div class="score-display">
        <span class="score-x">X: <span id="score-x">0</span></span>
        <span class="score-separator">|</span>
        <span class="score-draw">Draw: <span id="score-draw">0</span></span>
        <span class="score-separator">|</span>
        <span class="score-o">O: <span id="score-o">0</span></span>
    </div>

    <!-- Board -->
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
        <div class="win-line" id="win-line"></div>
    </div>

    <!-- Status -->
    <div class="status x-turn" id="status">X's turn</div>

    <!-- New Game Button -->
    <button class="new-game-btn" id="new-game-btn">New Game</button>
    </div>
</div>

<script>
(function() {
    var board = Array(9).fill(null);
    var currentPlayer = 'X';
    var gameOver = false;
    var mode = '2p';
    var difficulty = 'easy';
    var scores = { X: 0, O: 0, draw: 0 };
    var aiThinking = false;

    var WIN_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    var cells = document.querySelectorAll('.cell');
    var boardEl = document.getElementById('board');
    var statusEl = document.getElementById('status');
    var scoreXEl = document.getElementById('score-x');
    var scoreOEl = document.getElementById('score-o');
    var scoreDrawEl = document.getElementById('score-draw');
    var newGameBtn = document.getElementById('new-game-btn');
    var modeSelector = document.getElementById('mode-selector');
    var difficultyGroup = document.getElementById('difficulty-group');
    var difficultySelector = document.getElementById('difficulty-selector');
    var winLineEl = document.getElementById('win-line');

    var gameArea = document.getElementById('game-area');

    // Online DOM refs
    var onlinePanel = document.getElementById('online-panel');
    var onlineLobbyBtns = document.getElementById('online-lobby-btns');
    var onlineCreateArea = document.getElementById('online-create-area');
    var onlineJoinArea = document.getElementById('online-join-area');
    var createGameBtn = document.getElementById('create-game-btn');
    var joinGameBtn = document.getElementById('join-game-btn');
    var roomCodeDisplay = document.getElementById('room-code-display');
    var waitingMsg = document.getElementById('waiting-msg');
    var joinCodeInput = document.getElementById('join-code-input');
    var joinSubmitBtn = document.getElementById('join-submit-btn');
    var joinError = document.getElementById('join-error');
    var onlineLeaveBtn = document.getElementById('online-leave-btn');
    var joinBackBtn = document.getElementById('join-back-btn');
    var onlineInfo = document.getElementById('online-info');
    var gameRoomCode = document.getElementById('game-room-code');
    var gamePlayerInfo = document.getElementById('game-player-info');
    var onlineLeaveGameBtn = document.getElementById('online-leave-game-btn');

    // --- Mode & Difficulty Buttons ---
    modeSelector.addEventListener('click', function(e) {
        var btn = e.target.closest('.selector-btn');
        if (!btn) return;
        if (window.SFX) window.SFX.click();
        var newMode = btn.dataset.mode;
        if (newMode === mode) return;

        if (mode === 'online') {
            leaveOnlineRoom();
        }

        mode = newMode;
        modeSelector.querySelectorAll('.selector-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        difficultyGroup.style.display = mode === 'ai' ? '' : 'none';
        onlinePanel.style.display = mode === 'online' ? '' : 'none';
        onlineInfo.style.display = 'none';
        gameArea.style.display = mode === 'online' ? 'none' : '';
        if (mode === 'online') {
            showOnlineLobby();
        }
        resetGame();
    });

    difficultySelector.addEventListener('click', function(e) {
        var btn = e.target.closest('.selector-btn');
        if (!btn) return;
        if (window.SFX) window.SFX.click();
        var newDiff = btn.dataset.diff;
        if (newDiff === difficulty) return;
        difficulty = newDiff;
        difficultySelector.querySelectorAll('.selector-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        resetGame();
    });

    // --- New Game ---
    newGameBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        if (mode === 'online' && window._onlineState && window._onlineState.roomId) {
            onlineNewGame();
        } else {
            resetGame();
        }
    });

    function resetGame() {
        board = Array(9).fill(null);
        currentPlayer = 'X';
        gameOver = false;
        aiThinking = false;

        cells.forEach(function(cell) {
            cell.innerHTML = '';
            cell.classList.remove('taken', 'game-over', 'winner-cell');
        });

        winLineEl.classList.remove('show');
        winLineEl.style.width = '0';
        winLineEl.style.height = '0';

        updateStatus();
    }

    // --- Cell Click ---
    boardEl.addEventListener('click', function(e) {
        var cell = e.target.closest('.cell');
        if (!cell) return;
        var idx = parseInt(cell.dataset.index);
        if (board[idx] !== null || gameOver || aiThinking) return;

        if (mode === 'online') {
            onlineCellClick(idx);
            return;
        }

        makeMove(idx);

        if (mode === 'ai' && !gameOver && currentPlayer === 'O') {
            aiThinking = true;
            setTimeout(aiMove, 350);
        }
    });

    function makeMove(idx) {
        board[idx] = currentPlayer;
        var cell = cells[idx];
        cell.classList.add('taken');

        var mark = document.createElement('span');
        mark.classList.add('mark', currentPlayer === 'X' ? 'x-mark' : 'o-mark');
        mark.textContent = currentPlayer;
        cell.appendChild(mark);

        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                mark.classList.add('show');
            });
        });

        if (window.SFX) window.SFX.place();

        var winCombo = checkWin(currentPlayer);
        if (winCombo) {
            endGame(currentPlayer, winCombo);
            return;
        }

        if (board.every(function(c) { return c !== null; })) {
            endGame(null, null);
            return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus();
    }

    function checkWin(player) {
        for (var ci = 0; ci < WIN_COMBOS.length; ci++) {
            var combo = WIN_COMBOS[ci];
            if (combo.every(function(i) { return board[i] === player; })) {
                return combo;
            }
        }
        return null;
    }

    function endGame(winner, combo) {
        gameOver = true;
        cells.forEach(function(c) { c.classList.add('game-over'); });

        if (winner) {
            scores[winner]++;
            updateScores();
            combo.forEach(function(i) { cells[i].classList.add('winner-cell'); });
            drawWinLine(combo);

            var streakText = '';
            if (mode === 'ai') {
                var sk = (winner === 'X') ? (window.HallOfFame ? window.HallOfFame.winStreak('tictactoe') : null) : (window.HallOfFame ? window.HallOfFame.loseStreak('tictactoe') : null);
                if (sk) streakText = ' | Streak: ' + sk.current + ' | Best: ' + sk.best;
                if (winner === 'X' && window.HallOfFame) window.HallOfFame.submit('tictactoe', 1);
            }

            statusEl.className = 'status win-msg-' + winner.toLowerCase();
            statusEl.textContent = winner + ' wins!' + streakText;
            if (window.SFX) window.SFX.win();
        } else {
            scores.draw++;
            updateScores();
            statusEl.className = 'status draw-msg';
            statusEl.textContent = "It's a draw!";
            if (window.SFX) window.SFX.fail();
        }
    }

    function drawWinLine(combo) {
        var boardRect = boardEl.getBoundingClientRect();
        var startCell = cells[combo[0]].getBoundingClientRect();
        var endCell = cells[combo[2]].getBoundingClientRect();

        var startX = startCell.left + startCell.width / 2 - boardRect.left;
        var startY = startCell.top + startCell.height / 2 - boardRect.top;
        var endX = endCell.left + endCell.width / 2 - boardRect.left;
        var endY = endCell.top + endCell.height / 2 - boardRect.top;

        var length = Math.sqrt(Math.pow(endX - startX, 2) + Math.pow(endY - startY, 2));
        var angle = Math.atan2(endY - startY, endX - startX) * 180 / Math.PI;

        winLineEl.style.width = length + 'px';
        winLineEl.style.height = '5px';
        winLineEl.style.left = startX + 'px';
        winLineEl.style.top = startY + 'px';
        winLineEl.style.transformOrigin = '0 50%';
        winLineEl.style.transform = 'rotate(' + angle + 'deg)';

        requestAnimationFrame(function() {
            winLineEl.classList.add('show');
        });
    }

    function updateStatus() {
        if (mode === 'online' && window._onlineState && window._onlineState.myRole) {
            var st = window._onlineState;
            if (!st.playing) {
                statusEl.className = 'status x-turn';
                statusEl.textContent = 'Waiting for game to start...';
                return;
            }
            var turnName = currentPlayer === 'X' ? (st.hostName || 'X') : (st.guestName || 'O');
            var isMyTurn = currentPlayer === st.myRole;
            statusEl.className = 'status ' + (currentPlayer === 'X' ? 'x-turn' : 'o-turn');
            statusEl.textContent = isMyTurn ? "Your turn (" + st.myRole + ")" : turnName + "'s turn (" + currentPlayer + ")";
        } else {
            statusEl.className = 'status ' + (currentPlayer === 'X' ? 'x-turn' : 'o-turn');
            statusEl.textContent = currentPlayer + "'s turn";
        }
    }

    function updateScores() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
        scoreDrawEl.textContent = scores.draw;
    }

    // --- AI ---
    function aiMove() {
        if (gameOver) { aiThinking = false; return; }
        var move;
        switch (difficulty) {
            case 'easy': move = aiEasy(); break;
            case 'medium': move = aiMedium(); break;
            case 'hard': move = aiHard(); break;
        }
        if (move !== undefined && move !== null) {
            makeMove(move);
        }
        aiThinking = false;
    }

    function getEmpty() {
        var empty = [];
        for (var i = 0; i < 9; i++) {
            if (board[i] === null) empty.push(i);
        }
        return empty;
    }

    function aiEasy() {
        var empty = getEmpty();
        return empty[Math.floor(Math.random() * empty.length)];
    }

    function aiMedium() {
        var winMove = findWinningMove('O');
        if (winMove !== null) return winMove;
        var blockMove = findWinningMove('X');
        if (blockMove !== null) return blockMove;
        if (board[4] === null) return 4;
        return aiEasy();
    }

    function findWinningMove(player) {
        for (var ci = 0; ci < WIN_COMBOS.length; ci++) {
            var combo = WIN_COMBOS[ci];
            var values = combo.map(function(i) { return board[i]; });
            var playerCount = values.filter(function(v) { return v === player; }).length;
            var emptyCount = values.filter(function(v) { return v === null; }).length;
            if (playerCount === 2 && emptyCount === 1) {
                return combo[values.indexOf(null)];
            }
        }
        return null;
    }

    function aiHard() {
        var bestScore = -Infinity;
        var bestMove = null;
        for (var i = 0; i < 9; i++) {
            if (board[i] !== null) continue;
            board[i] = 'O';
            var score = minimax(board, 0, false);
            board[i] = null;
            if (score > bestScore) {
                bestScore = score;
                bestMove = i;
            }
        }
        return bestMove;
    }

    function minimax(b, depth, isMaximizing) {
        if (checkWin('O')) return 10 - depth;
        if (checkWin('X')) return depth - 10;
        if (b.every(function(c) { return c !== null; })) return 0;

        if (isMaximizing) {
            var best = -Infinity;
            for (var i = 0; i < 9; i++) {
                if (b[i] !== null) continue;
                b[i] = 'O';
                best = Math.max(best, minimax(b, depth + 1, false));
                b[i] = null;
            }
            return best;
        } else {
            var best2 = Infinity;
            for (var j = 0; j < 9; j++) {
                if (b[j] !== null) continue;
                b[j] = 'X';
                best2 = Math.min(best2, minimax(b, depth + 1, true));
                b[j] = null;
            }
            return best2;
        }
    }

    // --- Online Mode Helpers ---

    function getMyUsername() {
        return localStorage.getItem('arcade_currentUser') || localStorage.getItem('arcadePlayerName') || 'Guest';
    }

    function generateRoomCode() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var code = '';
        for (var i = 0; i < 4; i++) {
            code += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return code;
    }

    function showOnlineLobby() {
        onlineLobbyBtns.style.display = '';
        onlineCreateArea.style.display = 'none';
        onlineJoinArea.style.display = 'none';
        onlineLeaveBtn.style.display = 'none';
        onlineInfo.style.display = 'none';
        joinError.style.display = 'none';
        joinCodeInput.value = '';
    }

    function leaveOnlineRoom() {
        if (window._onlineUnsubscribe) {
            window._onlineUnsubscribe();
            window._onlineUnsubscribe = null;
        }
        window._onlineState = null;
        onlineInfo.style.display = 'none';
        onlinePanel.style.display = mode === 'online' ? '' : 'none';
        gameArea.style.display = mode === 'online' ? 'none' : '';
        showOnlineLobby();
    }

    function renderBoardFromState(boardData, turn) {
        board = boardData.map(function(v) { return v === '' ? null : v; });
        currentPlayer = turn;
        gameOver = false;

        cells.forEach(function(cell, i) {
            cell.innerHTML = '';
            cell.classList.remove('taken', 'game-over', 'winner-cell');
            if (board[i] !== null) {
                cell.classList.add('taken');
                var mark = document.createElement('span');
                mark.classList.add('mark', board[i] === 'X' ? 'x-mark' : 'o-mark', 'show');
                mark.textContent = board[i];
                cell.appendChild(mark);
            }
        });

        winLineEl.classList.remove('show');
        winLineEl.style.width = '0';
        winLineEl.style.height = '0';

        var winnerX = checkWin('X');
        var winnerO = checkWin('O');
        if (winnerX) {
            endOnlineGame('X', winnerX);
        } else if (winnerO) {
            endOnlineGame('O', winnerO);
        } else if (board.every(function(c) { return c !== null; })) {
            endOnlineGame(null, null);
        } else {
            updateStatus();
        }
    }

    function endOnlineGame(winner, combo) {
        gameOver = true;
        cells.forEach(function(c) { c.classList.add('game-over'); });

        if (winner) {
            scores[winner]++;
            updateScores();
            if (combo) {
                combo.forEach(function(i) { cells[i].classList.add('winner-cell'); });
                drawWinLine(combo);
            }
            var st = window._onlineState;
            var winnerName = winner === 'X' ? (st.hostName || 'X') : (st.guestName || 'O');
            var isMe = winner === st.myRole;
            statusEl.className = 'status win-msg-' + winner.toLowerCase();
            statusEl.textContent = isMe ? 'You win!' : winnerName + ' wins!';
            if (isMe) { if (window.SFX) window.SFX.win(); } else { if (window.SFX) window.SFX.fail(); }
        } else {
            scores.draw++;
            updateScores();
            statusEl.className = 'status draw-msg';
            statusEl.textContent = "It's a draw!";
            if (window.SFX) window.SFX.fail();
        }
    }

    // Expose for the module script
    window._tttOnline = {
        getMyUsername: getMyUsername,
        generateRoomCode: generateRoomCode,
        showOnlineLobby: showOnlineLobby,
        leaveOnlineRoom: leaveOnlineRoom,
        renderBoardFromState: renderBoardFromState,
        resetGame: resetGame,
        get mode() { return mode; },
        get board() { return board; },
        get gameOver() { return gameOver; },
        get currentPlayer() { return currentPlayer; }
    };

    window._onlineCellClickHandler = null;
    window._onlineNewGameHandler = null;

    function onlineCellClick(idx) {
        if (window._onlineCellClickHandler) {
            window._onlineCellClickHandler(idx);
        }
    }

    function onlineNewGame() {
        if (window._onlineNewGameHandler) {
            window._onlineNewGameHandler();
        }
    }

    createGameBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        if (window._onlineCreateGame) window._onlineCreateGame();
    });

    joinGameBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        onlineLobbyBtns.style.display = 'none';
        onlineJoinArea.style.display = '';
        joinCodeInput.focus();
    });

    joinSubmitBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        if (window._onlineJoinGame) window._onlineJoinGame(joinCodeInput.value.trim().toUpperCase());
    });

    joinCodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (window.SFX) window.SFX.click();
            if (window._onlineJoinGame) window._onlineJoinGame(joinCodeInput.value.trim().toUpperCase());
        }
    });

    joinBackBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        showOnlineLobby();
    });

    onlineLeaveBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        leaveOnlineRoom();
        resetGame();
    });

    onlineLeaveGameBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        leaveOnlineRoom();
        resetGame();
    });

    updateStatus();
})();
</script>

<!-- Online multiplayer Firebase module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

var firebaseConfig = {
    apiKey: "AIzaSyCyK7tEcAaqrVNFRggviaEmWH2SMkiwGKk",
    authDomain: "calculator-81d08.firebaseapp.com",
    projectId: "calculator-81d08",
    storageBucket: "calculator-81d08.firebasestorage.app",
    messagingSenderId: "375406495739",
    appId: "1:375406495739:web:fd28553263599864426d5e"
};

var app = initializeApp(firebaseConfig, 'ttt-online');
var db = getFirestore(app);

var ttt = window._tttOnline;

var onlinePanel = document.getElementById('online-panel');
var onlineLobbyBtns = document.getElementById('online-lobby-btns');
var onlineCreateArea = document.getElementById('online-create-area');
var roomCodeDisplay = document.getElementById('room-code-display');
var waitingMsg = document.getElementById('waiting-msg');
var joinError = document.getElementById('join-error');
var onlineLeaveBtn = document.getElementById('online-leave-btn');
var onlineInfo = document.getElementById('online-info');
var gameRoomCode = document.getElementById('game-room-code');
var gamePlayerInfo = document.getElementById('game-player-info');

function startListening(roomId) {
    if (window._onlineUnsubscribe) {
        window._onlineUnsubscribe();
    }

    var roomRef = doc(db, 'ttt_rooms', roomId);
    window._onlineUnsubscribe = onSnapshot(roomRef, function(snapshot) {
        if (!snapshot.exists()) return;
        var data = snapshot.data();
        var st = window._onlineState;
        if (!st || st.roomId !== roomId) return;

        st.hostName = data.hostPlayer || 'X';
        st.guestName = data.guestPlayer || 'O';

        if (data.status === 'playing' && !st.playing) {
            st.playing = true;
            onlinePanel.style.display = 'none';
            onlineInfo.style.display = '';
            document.getElementById('game-area').style.display = '';
            gameRoomCode.textContent = roomId;

            var opponentName = st.myRole === 'X' ? st.guestName : st.hostName;
            var roleClass = st.myRole === 'X' ? 'you-x' : 'you-o';
            gamePlayerInfo.innerHTML = 'You are <span class="' + roleClass + '">' + st.myRole +
                '</span> (' + ttt.getMyUsername() + ') vs ' + opponentName;
        }

        if (data.status === 'playing' || data.status === 'done') {
            ttt.renderBoardFromState(data.board, data.currentTurn);
        }
    });
}

window._onlineCreateGame = async function() {
    var username = ttt.getMyUsername();
    var roomCode = ttt.generateRoomCode();

    // Show UI immediately
    onlineLobbyBtns.style.display = 'none';
    onlineCreateArea.style.display = '';
    onlineLeaveBtn.style.display = '';
    roomCodeDisplay.textContent = roomCode;
    waitingMsg.textContent = 'Creating room...';
    waitingMsg.style.display = '';

    try {
        var roomRef = doc(db, 'ttt_rooms', roomCode);

        var existing = await getDoc(roomRef);
        if (existing.exists() && existing.data().status !== 'done') {
            window._onlineCreateGame();
            return;
        }

        await setDoc(roomRef, {
            board: ['', '', '', '', '', '', '', '', ''],
            currentTurn: 'X',
            hostPlayer: username,
            guestPlayer: '',
            status: 'waiting',
            winner: ''
        });

        window._onlineState = {
            roomId: roomCode,
            myRole: 'X',
            playing: false,
            hostName: username,
            guestName: ''
        };

        waitingMsg.textContent = 'Waiting for opponent to join...';
        ttt.resetGame();
        startListening(roomCode);
    } catch (err) {
        console.error('Create game error:', err);
        waitingMsg.textContent = 'Error: ' + err.message;
        waitingMsg.style.color = '#ff4757';
    }
};

window._onlineJoinGame = async function(code) {
    joinError.style.display = 'none';

    if (!code || code.length !== 4) {
        joinError.textContent = 'Enter a 4-character room code';
        joinError.style.display = '';
        return;
    }

    try {
        var roomRef = doc(db, 'ttt_rooms', code);
        var snapshot = await getDoc(roomRef);

        if (!snapshot.exists()) {
            joinError.textContent = 'Room not found';
            joinError.style.display = '';
            return;
        }

        var data = snapshot.data();
        if (data.status !== 'waiting') {
            joinError.textContent = 'Room is full or game already ended';
            joinError.style.display = '';
            return;
        }

        var username = ttt.getMyUsername();

        await updateDoc(roomRef, {
            guestPlayer: username,
            status: 'playing'
        });

        window._onlineState = {
            roomId: code,
            myRole: 'O',
            playing: true,
            hostName: data.hostPlayer,
            guestName: username
        };

        onlinePanel.style.display = 'none';
        onlineInfo.style.display = '';
        document.getElementById('game-area').style.display = '';
        gameRoomCode.textContent = code;
        gamePlayerInfo.innerHTML = 'You are <span class="you-o">O</span> (' + username + ') vs ' + data.hostPlayer;

        ttt.resetGame();
        startListening(code);
    } catch (err) {
        console.error('Join game error:', err);
        joinError.textContent = 'Error: ' + err.message;
        joinError.style.display = '';
    }
};

window._onlineCellClickHandler = async function(idx) {
    var st = window._onlineState;
    if (!st || !st.playing) return;
    if (ttt.gameOver) return;
    if (ttt.currentPlayer !== st.myRole) return;
    if (ttt.board[idx] !== null) return;

    var newBoard = ttt.board.map(function(v) { return v === null ? '' : v; });
    newBoard[idx] = st.myRole;

    var nextTurn = st.myRole === 'X' ? 'O' : 'X';

    var tempBoard = newBoard.map(function(v) { return v === '' ? null : v; });
    var newStatus = 'playing';
    var winner = '';

    var WIN_COMBOS = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    for (var ci = 0; ci < WIN_COMBOS.length; ci++) {
        var combo = WIN_COMBOS[ci];
        if (combo.every(function(i) { return tempBoard[i] === st.myRole; })) {
            newStatus = 'done';
            winner = st.myRole;
            break;
        }
    }

    if (!winner && tempBoard.every(function(c) { return c !== null; })) {
        newStatus = 'done';
        winner = 'draw';
    }

    var roomRef = doc(db, 'ttt_rooms', st.roomId);
    await updateDoc(roomRef, {
        board: newBoard,
        currentTurn: nextTurn,
        status: newStatus,
        winner: winner
    });
};

window._onlineNewGameHandler = async function() {
    var st = window._onlineState;
    if (!st || !st.roomId) return;

    var roomRef = doc(db, 'ttt_rooms', st.roomId);
    await updateDoc(roomRef, {
        board: ['', '', '', '', '', '', '', '', ''],
        currentTurn: 'X',
        status: 'playing',
        winner: ''
    });
};
</script>
