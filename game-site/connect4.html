<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
  }
  h1 { font-size: 2rem; }
  .mode-select { display: flex; gap: 1rem; margin-bottom: 0.8rem; }
  .mode-select button {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
    font-family: 'Segoe UI', Tahoma, sans-serif; font-weight: 600;
    transition: border-color 0.25s, background 0.25s, transform 0.15s;
  }
  .mode-select button:hover { border-color: #7b2ff7; }
  .mode-select button.active { border-color: #7b2ff7; background: #2a1a4e; color: #ffffff; }
  .diff-select { display: none; gap: 0.6rem; margin-bottom: 0.8rem; flex-wrap: wrap; justify-content: center; }
  .diff-select.show { display: flex; }
  .diff-select button {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 8px 20px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    transition: border-color 0.25s, background 0.25s;
  }
  .diff-select button:hover, .diff-select button.active { border-color: #7b2ff7; }
  .diff-select button.active { background: #2a1a4e; color: #ffffff; }
  .board {
    background: #1a1a6e;
    padding: 10px;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(7, 60px);
    gap: 6px;
    box-shadow: 0 0 30px rgba(30, 30, 120, 0.4);
  }
  .cell {
    width: 60px; height: 60px;
    background: #0f0f1a;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .cell.p1 {
    background: #ff4757;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(255,71,87,0.4);
  }
  .cell.p2 {
    background: #feca57;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(254,202,87,0.4);
  }
  .cell.win {
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 20px #fff;
  }
  .cell:hover:not(.p1):not(.p2) { background: #2a2a5a; }
  .col-header {
    width: 60px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #555; font-size: 0.8rem;
  }
  .col-header:hover { color: #00d4ff; }
  .headers { display: grid; grid-template-columns: repeat(7, 60px); gap: 6px; margin-bottom: 4px; padding: 0 10px; }
  .msg { margin-top: 1rem; font-size: 1.2rem; min-height: 2rem; text-align: center; }
  .msg .p1t { color: #ff4757; } .msg .p2t { color: #feca57; }
  button.restart {
    margin-top: 0.8rem;
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: white; border: none; padding: 0.6rem 1.8rem;
    border-radius: 8px; font-size: 1rem; cursor: pointer;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }
  button.restart:hover { opacity: 0.85; }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }

  /* Online Mode Styles */
  .online-panel {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    max-width: 460px;
    text-align: center;
    margin-bottom: 0.8rem;
  }
  .online-panel h3 {
    margin-bottom: 15px;
    color: #e0e0e0;
    font-size: 1rem;
  }
  .online-lobby-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .online-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
  }
  .online-btn:hover { background: #6a22e0; }
  .online-btn:active { transform: scale(0.97); }
  .online-btn.secondary {
    background: #2a2a4a;
  }
  .online-btn.secondary:hover { background: #3a3a5a; }
  .room-code-display {
    font-size: 2.5rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 8px;
    margin: 15px 0;
    font-family: monospace;
  }
  .waiting-msg {
    color: #888;
    font-size: 0.9rem;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .join-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .join-input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    color: #feca57;
    font-size: 1.8rem;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 6px;
    text-align: center;
    padding: 8px 16px;
    border-radius: 8px;
    width: 160px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.25s;
  }
  .join-input:focus { border-color: #7b2ff7; }
  .join-input::placeholder {
    color: #444;
    letter-spacing: 2px;
    font-size: 1rem;
  }
  .join-error {
    color: #ff4757;
    font-size: 0.85rem;
  }
  .online-info {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 12px 20px;
    width: 100%;
    max-width: 460px;
    text-align: center;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 0.8rem;
  }
  .online-info .room-label {
    color: #feca57;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 3px;
  }
  .online-info .player-info {
    margin: 6px 0;
  }
  .you-red { color: #ff4757; font-weight: 700; }
  .you-yellow { color: #feca57; font-weight: 700; }
  .leave-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
  }
  .leave-btn:hover { background: #ff475722; }
  .online-score {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    background: #1a1a2e;
    padding: 10px 24px;
    border-radius: 10px;
    border: 2px solid #2a2a4a;
    margin-bottom: 0.5rem;
  }
  .online-score .os-red { color: #ff4757; }
  .online-score .os-yellow { color: #feca57; }
  .online-score .os-draw { color: #aaa; }
  .online-score .os-sep { color: #555; margin: 0 2px; }

  .lobby-avatar { display: inline-flex; align-items: center; vertical-align: middle; }

  /* Chat Sidebar */
  #chat-toggle{position:fixed;bottom:120px;right:16px;width:50px;height:50px;border-radius:50%;background:#7b2ff7;border:none;color:#fff;font-size:1.5rem;cursor:pointer;z-index:9999;box-shadow:0 2px 12px rgba(123,47,247,0.4);transition:transform 0.2s;display:none;}
  #chat-toggle:hover{transform:scale(1.1);}
  #chat-badge{position:absolute;top:-4px;right:-4px;background:#ff4757;color:#fff;font-size:0.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}
  #chat-panel{position:fixed;top:0;right:-320px;width:300px;height:100%;background:#1a1a2e;border-left:2px solid #2a2a4a;z-index:10000;display:flex;flex-direction:column;transition:right 0.3s;}
  #chat-panel.open{right:0;}
  #chat-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #2a2a4a;}
  #chat-header span{font-weight:700;color:#e0e0e0;font-size:1rem;}
  #chat-close{background:#2a2a4a;border:none;color:#e0e0e0;font-size:1.1rem;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .2s}
  #chat-close:hover{background:#3a3a5a;color:#fff}
  #chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#2a2a4a #1a1a2e;}
  #chat-messages::-webkit-scrollbar{width:6px;}
  #chat-messages::-webkit-scrollbar-track{background:#1a1a2e;}
  #chat-messages::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px;}
  .chat-msg .chat-name{color:#feca57;font-weight:700;font-size:0.8rem;margin-right:6px;}
  .chat-msg .chat-text{color:#e0e0e0;font-size:0.85rem;word-break:break-word;}
  .chat-msg .chat-time{color:#555;font-size:0.7rem;margin-left:6px;}
  #chat-input-area{display:flex;gap:6px;padding:10px;border-top:2px solid #2a2a4a;}
  #chat-input{flex:1;background:#0f0f1a;border:2px solid #2a2a4a;color:#e0e0e0;font-size:0.85rem;font-family:inherit;padding:8px 10px;border-radius:6px;outline:none;}
  #chat-input:focus{border-color:#7b2ff7;}
  #chat-send{background:#7b2ff7;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600;font-size:0.85rem;}
  #chat-send:hover{background:#6a22e0;}
</style>
</head>

<div style="display:flex;flex-direction:column;align-items:center;width:100%;max-width:600px;margin:0 auto;">
<h1>Connect Four</h1>
<div class="mode-select">
  <button id="mode2p" class="active">2 Players</button>
  <button id="modeBot">vs Bot</button>
  <button id="modeOnline">Online</button>
</div>
<div class="diff-select" id="diff-select">
  <button data-d="easy">Easy</button>
  <button data-d="medium" class="active">Medium</button>
  <button data-d="hard">Hard</button>
  <button data-d="impossible">Impossible</button>
</div>

<!-- Online Panel -->
<div class="online-panel" id="online-panel" style="display:none;">
  <h3>Online Multiplayer</h3>
  <div id="online-lobby-btns" class="online-lobby-btns">
    <button class="online-btn" id="create-game-btn">Create Game</button>
    <button class="online-btn secondary" id="join-game-btn">Join Game</button>
  </div>
  <div id="online-create-area" style="display:none;">
    <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Share this code with your friend:</p>
    <div class="room-code-display" id="room-code-display">----</div>

<!-- Online Info (shown during game) -->
<div class="online-info" id="online-info" style="display:none;">
  <span>Room: <span class="room-label" id="game-room-code"></span></span>
  <div class="player-info" id="game-player-info"></div>
  <button class="leave-btn" id="online-leave-game-btn">Leave Game</button>
</div>
<div class="online-score" id="online-score" style="display:none;">
  <span class="os-red"><span id="os-red-name">Red</span>: <span id="os-red-wins">0</span></span>
  <span class="os-sep">|</span>
  <span class="os-draw">Draw: <span id="os-draws">0</span></span>
  <span class="os-sep">|</span>
  <span class="os-yellow"><span id="os-yellow-name">Yellow</span>: <span id="os-yellow-wins">0</span></span>
</div>

<!-- Chat Sidebar -->
<button id="chat-toggle"><span style="font-size:1.4rem">&#x1F4AC;</span><span id="chat-badge">0</span></button>
<div id="chat-panel">
    <div id="chat-header"><span>Chat</span><button id="chat-close">&#x2715;</button></div>
    <div id="chat-messages"></div>
    <div id="chat-input-area"><input id="chat-input" type="text" placeholder="Type a message..." maxlength="200" autocomplete="off"><button id="chat-send">Send</button></div>
</div>

<div id="game-area" style="display:flex;flex-direction:column;align-items:center;gap:10px;">
<div class="headers" id="headers"></div>
<div class="board" id="board"></div>
<div class="msg" id="msg"><span class="p1t">Red's turn</span></div>
<button class="restart" id="restart">New Game</button>
</div>
</div>
<script>
(function() {
const ROWS = 6, COLS = 7;
let board, currentPlayer, gameOver, mode, thinking, botDifficulty;
mode = '2p'; thinking = false; botDifficulty = 'medium';

const boardEl = document.getElementById('board');
const headersEl = document.getElementById('headers');
const msgEl = document.getElementById('msg');

// Online DOM refs
var onlinePanel = document.getElementById('online-panel');
var onlineLobbyBtns = document.getElementById('online-lobby-btns');
var onlineCreateArea = document.getElementById('online-create-area');
var onlineJoinArea = document.getElementById('online-join-area');
var createGameBtn = document.getElementById('create-game-btn');
var joinGameBtn = document.getElementById('join-game-btn');
var roomCodeDisplay = document.getElementById('room-code-display');
var waitingMsg = document.getElementById('waiting-msg');
var joinCodeInput = document.getElementById('join-code-input');
var joinSubmitBtn = document.getElementById('join-submit-btn');
var joinError = document.getElementById('join-error');
var onlineLeaveBtn = document.getElementById('online-leave-btn');
var joinBackBtn = document.getElementById('join-back-btn');
var onlineInfo = document.getElementById('online-info');
var gameRoomCode = document.getElementById('game-room-code');
var gamePlayerInfo = document.getElementById('game-player-info');
var onlineLeaveGameBtn = document.getElementById('online-leave-game-btn');

// Mode buttons
var gameArea = document.getElementById('game-area');

var diffSelect = document.getElementById('diff-select');
var diffBtns = diffSelect.querySelectorAll('button');
diffBtns.forEach(function(b) {
  b.addEventListener('click', function() {
    botDifficulty = b.dataset.d;
    diffBtns.forEach(function(x) { x.classList.toggle('active', x.dataset.d === botDifficulty); });
    if (window.SFX) window.SFX.click();
    init();
  });
});

document.getElementById('mode2p').addEventListener('click', function() {
  if (mode === 'online') leaveOnlineRoom();
  mode = '2p';
  updateModeButtons();
  diffSelect.classList.remove('show');
  onlinePanel.style.display = 'none';
  onlineInfo.style.display = 'none';
  gameArea.style.display = '';
  init();
});
document.getElementById('modeBot').addEventListener('click', function() {
  if (mode === 'online') leaveOnlineRoom();
  mode = 'bot';
  updateModeButtons();
  diffSelect.classList.add('show');
  onlinePanel.style.display = 'none';
  onlineInfo.style.display = 'none';
  gameArea.style.display = '';
  init();
});
document.getElementById('modeOnline').addEventListener('click', function() {
  if (mode === 'online') return;
  mode = 'online';
  updateModeButtons();
  diffSelect.classList.remove('show');
  onlinePanel.style.display = '';
  onlineInfo.style.display = 'none';
  gameArea.style.display = 'none';
  showOnlineLobby();
});

function updateModeButtons() {
  document.getElementById('mode2p').classList.toggle('active', mode === '2p');
  document.getElementById('modeBot').classList.toggle('active', mode === 'bot');
  document.getElementById('modeOnline').classList.toggle('active', mode === 'online');
}

document.getElementById('restart').addEventListener('click', function() {
  if (window.SFX) window.SFX.click();
  if (mode === 'online' && window._c4OnlineState && window._c4OnlineState.roomId) {
    onlineNewGame();
  } else {
    init();
  }
});

function init() {
  board = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  currentPlayer = 1;
  gameOver = false;
  thinking = false;
  render();
  updateTurnMsg();
}

function render() {
  boardEl.innerHTML = '';
  headersEl.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const h = document.createElement('div');
    h.className = 'col-header';
    h.textContent = '\u25BC';
    h.addEventListener('click', () => handleColumnClick(c));
    headersEl.appendChild(h);
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      if (board[r][c] === 1) cell.classList.add('p1');
      if (board[r][c] === 2) cell.classList.add('p2');
      cell.addEventListener('click', () => handleColumnClick(c));
      boardEl.appendChild(cell);
    }
  }
}

function handleColumnClick(col) {
  if (gameOver || thinking) return;

  if (mode === 'online') {
    onlineCellClick(col);
    return;
  }

  dropPiece(col);

  if (mode === 'bot' && currentPlayer === 2 && !gameOver) {
    thinking = true;
    setTimeout(botMove, 400);
  }
}

function getDropRow(col) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][col] === 0) return r;
  }
  return -1;
}

function dropPiece(col) {
  if (gameOver || (mode !== 'online' && thinking && currentPlayer === 1)) return;
  const row = getDropRow(col);
  if (row === -1) return;

  board[row][col] = currentPlayer;
  if (window.SFX) window.SFX.place();
  render();

  const win = checkWin(row, col, currentPlayer);
  if (win) {
    highlightWin(win);
    const name = currentPlayer === 1 ? 'Red' : 'Yellow';
    const cls = currentPlayer === 1 ? 'p1t' : 'p2t';
    let streakHtml = '';
    if (mode === 'bot') {
      if (currentPlayer === 1 && window.HallOfFame) {
        var sk = window.HallOfFame.winStreak('connect4');
        if (sk) {
          streakHtml = ' | Streak: <span style="color:#00d4ff;font-weight:bold;">' + sk.current + '</span> | Best: <span style="color:#00d4ff;font-weight:bold;">' + sk.best + '</span>';
          window.HallOfFame.submit('connect4', sk.current);
        }
      } else if (currentPlayer === 2 && window.HallOfFame) {
        var sk = window.HallOfFame.loseStreak('connect4');
        if (sk) streakHtml = ' | Streak: <span style="color:#00d4ff;font-weight:bold;">' + sk.current + '</span> | Best: <span style="color:#00d4ff;font-weight:bold;">' + sk.best + '</span>';
      }
    }
    msgEl.innerHTML = '<span class="' + cls + '">' + name + ' wins!</span>' + streakHtml;
    gameOver = true;
    if (window.SFX) window.SFX.win();
    return;
  }

  if (isDraw()) {
    msgEl.textContent = 'Draw!';
    gameOver = true;
    if (window.SFX) window.SFX.fail();
    return;
  }

  currentPlayer = 3 - currentPlayer;
  updateTurnMsg();
}

function updateTurnMsg() {
  if (mode === 'online' && window._c4OnlineState && window._c4OnlineState.myRole) {
    var st = window._c4OnlineState;
    if (!st.playing) {
      msgEl.innerHTML = '<span style="color:#888;">Waiting for game to start...</span>';
      return;
    }
    var isMyTurn = currentPlayer === st.myRole;
    var turnColor = currentPlayer === 1 ? 'p1t' : 'p2t';
    var turnName = currentPlayer === 1 ? (st.hostName || 'Red') : (st.guestName || 'Yellow');
    if (isMyTurn) {
      msgEl.innerHTML = '<span class="' + turnColor + '">Your turn (' + (currentPlayer === 1 ? 'Red' : 'Yellow') + ')</span>';
    } else {
      msgEl.innerHTML = '<span class="' + turnColor + '">' + turnName + '\'s turn (' + (currentPlayer === 1 ? 'Red' : 'Yellow') + ')</span>';
    }
  } else {
    const name = currentPlayer === 1 ? 'Red' : 'Yellow';
    const cls = currentPlayer === 1 ? 'p1t' : 'p2t';
    msgEl.innerHTML = '<span class="' + cls + '">' + name + '\'s turn</span>';
  }
}

function checkWin(row, col, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cells = [[row, col]];
    for (let d = -1; d <= 1; d += 2) {
      for (let i = 1; i < 4; i++) {
        const r = row + dr * i * d, c = col + dc * i * d;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== player) break;
        cells.push([r, c]);
      }
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}

// Full board scan for win (used by online rendering)
function checkWinFull(player) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] === player) {
        var result = checkWin(r, c, player);
        if (result) return result;
      }
    }
  }
  return null;
}

function isDraw() {
  return board[0].every(c => c !== 0);
}

function highlightWin(cells) {
  for (const [r, c] of cells) {
    const idx = r * COLS + c;
    boardEl.children[idx].classList.add('win');
  }
}

// Bot AI — difficulty levels
function botMove() {
  if (gameOver) { thinking = false; return; }
  var col;
  if (botDifficulty === 'easy') col = botMoveEasy();
  else if (botDifficulty === 'hard') col = botMoveMinimax(5);
  else if (botDifficulty === 'impossible') col = botMoveMinimax(9);
  else col = botMoveMedium();
  thinking = false;
  dropPiece(col);
}

// Easy: mostly random, only takes obvious wins, blocks 30% of the time
function botMoveEasy() {
  // Take a win if available
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c); if (r === -1) continue;
    board[r][c] = 2;
    if (checkWin(r, c, 2)) { board[r][c] = 0; return c; }
    board[r][c] = 0;
  }
  // Only block 30% of the time
  if (Math.random() < 0.3) {
    for (let c = 0; c < COLS; c++) {
      const r = getDropRow(c); if (r === -1) continue;
      board[r][c] = 1;
      if (checkWin(r, c, 1)) { board[r][c] = 0; return c; }
      board[r][c] = 0;
    }
  }
  // Random valid column
  const valid = [];
  for (let c = 0; c < COLS; c++) if (getDropRow(c) !== -1) valid.push(c);
  return valid[Math.floor(Math.random() * valid.length)];
}

// Medium: original heuristic
function botMoveMedium() {
  // Win
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c); if (r === -1) continue;
    board[r][c] = 2;
    if (checkWin(r, c, 2)) { board[r][c] = 0; return c; }
    board[r][c] = 0;
  }
  // Block
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c); if (r === -1) continue;
    board[r][c] = 1;
    if (checkWin(r, c, 1)) { board[r][c] = 0; return c; }
    board[r][c] = 0;
  }
  // Avoid giving opponent a win
  const safe = [];
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c); if (r === -1) continue;
    board[r][c] = 2;
    let dangerous = false;
    if (r > 0) {
      board[r-1][c] = 1;
      if (checkWin(r-1, c, 1)) dangerous = true;
      board[r-1][c] = 0;
    }
    board[r][c] = 0;
    if (!dangerous) safe.push(c);
  }
  const candidates = safe.length > 0 ? safe : Array.from({length: COLS}, (_,i) => i).filter(c => getDropRow(c) !== -1);
  // Score by center preference + adjacency
  const scored = candidates.map(c => {
    let s = (3 - Math.abs(c - 3)) * 3;
    const r = getDropRow(c);
    board[r][c] = 2;
    for (const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      let count = 1;
      for (let d of [-1, 1]) {
        for (let i = 1; i < 4; i++) {
          const nr = r+dr*i*d, nc = c+dc*i*d;
          if (nr<0||nr>=ROWS||nc<0||nc>=COLS||board[nr][nc]!==2) break;
          count++;
        }
      }
      s += count * 2;
    }
    board[r][c] = 0;
    return { c, s };
  });
  scored.sort((a, b) => b.s - a.s);
  const topScore = scored[0].s;
  const top = scored.filter(x => x.s >= topScore - 2);
  return top[Math.floor(Math.random() * top.length)].c;
}

// Hard & Impossible: minimax with alpha-beta pruning
function botMoveMinimax(depth) {
  var bestScore = -Infinity;
  var bestCols = [];
  // Try columns in center-first order for better pruning
  var order = [3, 2, 4, 1, 5, 0, 6];
  for (var i = 0; i < order.length; i++) {
    var c = order[i];
    var r = getDropRow(c);
    if (r === -1) continue;
    board[r][c] = 2;
    var score = minimax(depth - 1, false, -Infinity, Infinity);
    board[r][c] = 0;
    if (score > bestScore) {
      bestScore = score;
      bestCols = [c];
    } else if (score === bestScore) {
      bestCols.push(c);
    }
  }
  return bestCols[Math.floor(Math.random() * bestCols.length)];
}

function minimax(depth, isMaximizing, alpha, beta) {
  // Check terminal states
  // Check if last move created a win
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      if (board[r][c] !== 0) {
        var w = checkWin(r, c, board[r][c]);
        if (w) return board[r][c] === 2 ? 1000 + depth : -1000 - depth;
      }
    }
  }
  // Draw
  var anyEmpty = false;
  for (var c2 = 0; c2 < COLS; c2++) { if (getDropRow(c2) !== -1) { anyEmpty = true; break; } }
  if (!anyEmpty) return 0;
  if (depth === 0) return evaluateBoard();

  var order = [3, 2, 4, 1, 5, 0, 6];
  if (isMaximizing) {
    var maxEval = -Infinity;
    for (var i = 0; i < order.length; i++) {
      var c = order[i];
      var r = getDropRow(c);
      if (r === -1) continue;
      board[r][c] = 2;
      var ev = minimax(depth - 1, false, alpha, beta);
      board[r][c] = 0;
      if (ev > maxEval) maxEval = ev;
      if (ev > alpha) alpha = ev;
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    var minEval = Infinity;
    for (var i = 0; i < order.length; i++) {
      var c = order[i];
      var r = getDropRow(c);
      if (r === -1) continue;
      board[r][c] = 1;
      var ev = minimax(depth - 1, true, alpha, beta);
      board[r][c] = 0;
      if (ev < minEval) minEval = ev;
      if (ev < beta) beta = ev;
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

function evaluateBoard() {
  var score = 0;
  // Score all windows of 4
  var dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (var r = 0; r < ROWS; r++) {
    for (var c = 0; c < COLS; c++) {
      for (var d = 0; d < dirs.length; d++) {
        var dr = dirs[d][0], dc = dirs[d][1];
        var r2 = r + 3*dr, c2 = c + 3*dc;
        if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) continue;
        var p1 = 0, p2 = 0, empty = 0;
        for (var k = 0; k < 4; k++) {
          var v = board[r + k*dr][c + k*dc];
          if (v === 1) p1++;
          else if (v === 2) p2++;
          else empty++;
        }
        if (p1 === 0) {
          if (p2 === 3) score += 50;
          else if (p2 === 2) score += 5;
          else if (p2 === 1) score += 1;
        }
        if (p2 === 0) {
          if (p1 === 3) score -= 50;
          else if (p1 === 2) score -= 5;
          else if (p1 === 1) score -= 1;
        }
      }
    }
  }
  // Center column preference
  for (var r = 0; r < ROWS; r++) {
    if (board[r][3] === 2) score += 3;
    if (board[r][3] === 1) score -= 3;
  }
  return score;
}

// --- Online Mode Helpers ---

function getMyUsername() {
  return localStorage.getItem('arcade_currentUser') || localStorage.getItem('arcadePlayerName') || 'Guest';
}

function generateRoomCode() {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var code = '';
  for (var i = 0; i < 4; i++) {
    code += chars.charAt(Math.floor(Math.random() * chars.length));
  }
  return code;
}

function showOnlineLobby() {
  onlineLobbyBtns.style.display = '';
  onlineCreateArea.style.display = 'none';

}

function leaveOnlineRoom() {
  if (window._c4OnlineUnsubscribe) {
    window._c4OnlineUnsubscribe();

  }

  onlineInfo.style.display = 'none';
  hideOnlineScore();
  onlinePanel.style.display = mode === 'online' ? '' : 'none';
  gameArea.style.display = mode === 'online' ? 'none' : '';
  showOnlineLobby();
}

function stringToBoard(s) {
  var b = [];
  for (var c = 0; c < COLS; c++) {
    b.push([]);
    for (var r = 0; r < ROWS; r++) {
      b[c].push(parseInt(s[c * 6 + r]));
    }
  }
  return b;
}

function renderBoardFromState(boardData, turn) {
  // boardData is a flat string, convert via stringToBoard then to internal board[row][col]
  var colMajor = (typeof boardData === 'string') ? stringToBoard(boardData) : boardData;
  board = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  for (var c = 0; c < COLS; c++) {
    for (var r = 0; r < ROWS; r++) {
      board[r][c] = colMajor[c][r];
    }
  }
  currentPlayer = turn;
  gameOver = false;
  render();

  // Check for wins
  var winP1 = checkWinFull(1);
  var winP2 = checkWinFull(2);
  if (winP1) {
    endOnlineGame(1, winP1);
  } else if (winP2) {
    endOnlineGame(2, winP2);
  } else if (isDraw()) {
    endOnlineGame(0, null);
  } else {
    updateTurnMsg();
  }
}

var onlineScores = { red: 0, yellow: 0, draw: 0 };

function showOnlineScore() {
  var st = window._c4OnlineState;
  var el = document.getElementById('online-score');
  el.style.display = 'flex';

}

function hideOnlineScore() {
  document.getElementById('online-score').style.display = 'none';
  onlineScores = { red: 0, yellow: 0, draw: 0 };
}

function endOnlineGame(winner, combo) {
  gameOver = true;
  if (winner && combo) {
    highlightWin(combo);
  }

  var st = window._c4OnlineState;
  if (winner === 1 || winner === 2) {
    if (winner === 1) onlineScores.red++; else onlineScores.yellow++;
    var winnerName = winner === 1 ? (st.hostName || 'Red') : (st.guestName || 'Yellow');
    var colorName = winner === 1 ? 'Red' : 'Yellow';
    var cls = winner === 1 ? 'p1t' : 'p2t';
    var isMe = winner === st.myRole;
    msgEl.innerHTML = '<span class="' + cls + '">' + (isMe ? 'You win!' : winnerName + ' wins!') + '</span>';
    if (isMe) { if (window.SFX) window.SFX.win(); } else { if (window.SFX) window.SFX.fail(); }
  } else {
    onlineScores.draw++;
    msgEl.textContent = 'Draw!';
    if (window.SFX) window.SFX.fail();
  }
  showOnlineScore();
}

// ===== Chat =====
var chatPanel = document.getElementById('chat-panel');
var chatToggle = document.getElementById('chat-toggle');
var chatClose = document.getElementById('chat-close');
var chatMessagesEl = document.getElementById('chat-messages');
var chatInputEl = document.getElementById('chat-input');
var chatSendBtn = document.getElementById('chat-send');
var chatBadgeEl = document.getElementById('chat-badge');
var chatIsOpen = false, chatUnread = 0, chatPrevCount = 0;

chatToggle.addEventListener('click', function() {
    chatIsOpen = !chatIsOpen; chatPanel.classList.toggle('open', chatIsOpen);
    if (chatIsOpen) { chatUnread = 0; chatBadgeEl.style.display = 'none'; chatInputEl.focus(); requestAnimationFrame(function(){ chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight; }); }
});
chatClose.addEventListener('click', function() { chatIsOpen = false; chatPanel.classList.remove('open'); });
chatSendBtn.addEventListener('click', function() { if (window._c4ChatSend) { var t = chatInputEl.value.trim(); if (t) { chatInputEl.value = ''; window._c4ChatSend(t); } } });
chatInputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter' && window._c4ChatSend) { var t = chatInputEl.value.trim(); if (t) { chatInputEl.value = ''; window._c4ChatSend(t); } } });

function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function renderChat(msgs) {
    if (!msgs) msgs = [];
    var inRoom = window._c4OnlineState && window._c4OnlineState.roomId;
    chatToggle.style.display = inRoom ? 'block' : 'none';
    if (!inRoom) { chatPanel.classList.remove('open'); chatIsOpen = false; return; }
    if (msgs.length > chatPrevCount && !chatIsOpen) {
        chatUnread += msgs.length - chatPrevCount;
        chatBadgeEl.textContent = chatUnread > 99 ? '99+' : chatUnread;
        chatBadgeEl.style.display = 'flex';
        if (chatPrevCount > 0 && window.SFX) window.SFX.coin();
    }
    chatPrevCount = msgs.length;
    chatMessagesEl.innerHTML = '';
    for (var i = 0; i < msgs.length; i++) {
        var m = msgs[i];
        var div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = '<span class="chat-name" data-chat-user="' + escHtml(m.name) + '">' + escHtml(m.name) + '</span><span class="chat-text">' + escHtml(m.text) + '</span><span class="chat-time">' + escHtml(m.time || '') + '</span>';
        chatMessagesEl.appendChild(div);
    }
    // Apply nametag styles to chat names
    if (window.ArcadeAvatar && window.ArcadeCoins) {
        chatMessagesEl.querySelectorAll('.chat-name[data-chat-user]').forEach(function(el) {
            var name = el.dataset.chatUser;
            if (name && window.ArcadeCoins.getProfile) {
                window.ArcadeCoins.getProfile(name).then(function(profile) {
                    if (profile) {
                        window.ArcadeAvatar.styleName(el, profile);
                        window.ArcadeAvatar.styleNameEffect(el, profile);
                        var _md = el.closest('.chat-msg');
                        if (_md) window.ArcadeAvatar.styleBubble(_md, profile);
                    }
                });
            }
        });
    }
    requestAnimationFrame(function(){ chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight; });
}

function resetChat() {
    chatPrevCount = 0; chatUnread = 0; chatBadgeEl.style.display = 'none';
    chatMessagesEl.innerHTML = ''; chatToggle.style.display = 'none';
    chatPanel.classList.remove('open'); chatIsOpen = false;
}

// Patch leaveOnlineRoom
var origLeaveOnline = leaveOnlineRoom;
leaveOnlineRoom = function() { resetChat(); origLeaveOnline(); };

// Expose for the module script
window._c4Online = {
  getMyUsername: getMyUsername,
  generateRoomCode: generateRoomCode,
  showOnlineLobby: showOnlineLobby,
  leaveOnlineRoom: leaveOnlineRoom,
  renderBoardFromState: renderBoardFromState,
  init: init,
  get mode() { return mode; },
  get board() { return board; },
  get gameOver() { return gameOver; },
  get currentPlayer() { return currentPlayer; },
  ROWS: ROWS,
  COLS: COLS,
  getDropRow: getDropRow,
  checkWin: checkWin,
  renderChat: renderChat,
  resetChat: resetChat,
  showOnlineScore: showOnlineScore,
  hideOnlineScore: hideOnlineScore
};

init();
})();

<!-- Online multiplayer Firebase module -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc, onSnapshot }
    from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

var firebaseConfig = {
    apiKey: "AIzaSyCyK7tEcAaqrVNFRggviaEmWH2SMkiwGKk",

    messagingSenderId: "375406495739",
    appId: "1:375406495739:web:fd28553263599864426d5e"
};

var app = initializeApp(firebaseConfig, 'c4-online');
var db = getFirestore(app);

var c4 = window._c4Online;

var onlinePanel = document.getElementById('online-panel');
var onlineLobbyBtns = document.getElementById('online-lobby-btns');
var onlineCreateArea = document.getElementById('online-create-area');
var roomCodeDisplay = document.getElementById('room-code-display');
var waitingMsg = document.getElementById('waiting-msg');
var joinError = document.getElementById('join-error');
var onlineLeaveBtn = document.getElementById('online-leave-btn');
var onlineInfo = document.getElementById('online-info');
var gameRoomCode = document.getElementById('game-room-code');
var gamePlayerInfo = document.getElementById('game-player-info');

function makeEmptyBoard() {
    // Flat string: 42 chars, 7 cols x 6 rows, all zeros
    // Index = col * 6 + row
    return '000000000000000000000000000000000000000000';
}

function boardToString(internalBoard) {
    // Convert internal board[row][col] to flat string (col-major)
    var s = '';
    for (var c = 0; c < 7; c++) {
        for (var r = 0; r < 6; r++) {
            s += internalBoard[r][c];
        }
    }
    return s;
}

function stringToBoard(s) {
    // Convert flat string to boardData[col][row] format
    var b = [];
    for (var c = 0; c < 7; c++) {
        b.push([]);
        for (var r = 0; r < 6; r++) {
            b[c].push(parseInt(s[c * 6 + r]));
        }
    }
    return b;
}

function startListening(roomId) {
    if (window._c4OnlineUnsubscribe) {
        window._c4OnlineUnsubscribe();
    }

    var roomRef = doc(db, 'c4_rooms', roomId);
    window._c4OnlineUnsubscribe = onSnapshot(roomRef, function(snapshot) {
        if (!snapshot.exists()) return;
        var data = snapshot.data();
        var st = window._c4OnlineState;
        if (!st || st.roomId !== roomId) return;

        st.hostName = data.hostPlayer || 'Red';
        st.guestName = data.guestPlayer || 'Yellow';

        // Render chat
        c4.renderChat(data.chat || []);

        if (data.status === 'playing' && !st.playing) {
            st.playing = true;
            onlinePanel.style.display = 'none';
            onlineInfo.style.display = '';
            document.getElementById('game-area').style.display = '';
            gameRoomCode.textContent = roomId;

            var opponentName = st.myRole === 1 ? st.guestName : st.hostName;
            var myColor = st.myRole === 1 ? 'Red' : 'Yellow';
            var roleClass = st.myRole === 1 ? 'you-red' : 'you-yellow';
            gamePlayerInfo.innerHTML = 'You are <span class="' + roleClass + '">' + myColor +
                '</span> (<span class="lobby-avatar" data-player="' + c4.getMyUsername() + '"></span><span class="lobby-name" data-player-name="' + c4.getMyUsername() + '">' + c4.getMyUsername() + '</span>) vs <span class="lobby-avatar" data-player="' + opponentName + '"></span><span class="lobby-name" data-player-name="' + opponentName + '">' + opponentName + '</span>';
            // Render avatars in player info
            if (window.ArcadeAvatar && window.ArcadeCoins) {
                gamePlayerInfo.querySelectorAll('.lobby-avatar').forEach(function(el) {
                    var name = el.dataset.player;
                    if (name && window.ArcadeCoins.getProfile) {
                        window.ArcadeCoins.getProfile(name).then(function(profile) {
                            if (profile) {
                                window.ArcadeAvatar.renderMini(el, profile);
                                var nameEl = el.parentElement.querySelector('.lobby-name[data-player-name="' + name + '"]');
                                if (nameEl) window.ArcadeAvatar.styleName(nameEl, profile);
                            }
                        });
                    }
                });
            }
            c4.showOnlineScore();
        }

        if (data.status === 'playing' || data.status === 'done') {
            c4.renderBoardFromState(data.board, data.currentPlayer);
        }
    });
}

window._c4OnlineCreateGame = async function() {
    var username = c4.getMyUsername();
    var roomCode = c4.generateRoomCode();

    onlineLobbyBtns.style.display = 'none';
    onlineCreateArea.style.display = '';
    onlineLeaveBtn.style.display = '';
    roomCodeDisplay.textContent = roomCode;
    waitingMsg.textContent = 'Creating room...';
    waitingMsg.style.display = '';
    waitingMsg.style.color = '';

    try {
        var roomRef = doc(db, 'c4_rooms', roomCode);

        var existing = await getDoc(roomRef);
        if (existing.exists() && existing.data().status !== 'done') {
            // Code collision, try again
            window._c4OnlineCreateGame();
            return;
        }

        await setDoc(roomRef, {
            board: makeEmptyBoard(),
            currentPlayer: 1,
            hostPlayer: username,
            guestPlayer: '',
            status: 'waiting',
            winner: ''
        });

        window._c4OnlineState = {
            roomId: roomCode,
            myRole: 1,
            playing: false,
            hostName: username,
            guestName: ''
        };

        waitingMsg.textContent = 'Waiting for opponent to join...';
        c4.init();
        startListening(roomCode);
    } catch (err) {
        console.error('Create game error:', err);
        waitingMsg.textContent = 'Error: ' + err.message;
        waitingMsg.style.color = '#ff4757';
    }
};

window._c4OnlineJoinGame = async function(code) {
    joinError.style.display = 'none';

    if (!code || code.length !== 4) {
        joinError.textContent = 'Enter a 4-character room code';
        joinError.style.display = '';
        return;
    }

    try {
        var roomRef = doc(db, 'c4_rooms', code);
        var snapshot = await getDoc(roomRef);

        if (!snapshot.exists()) {
            joinError.textContent = 'Room not found';
            joinError.style.display = '';
            return;
        }

        var data = snapshot.data();
        if (data.status !== 'waiting') {
            joinError.textContent = 'Room is full or game already ended';
            joinError.style.display = '';
            return;
        }

        var username = c4.getMyUsername();

        await updateDoc(roomRef, {
            guestPlayer: username,
            status: 'playing'
        });

        window._c4OnlineState = {
            roomId: code,
            myRole: 2,
            playing: true,
            hostName: data.hostPlayer,
            guestName: username
        };

        onlinePanel.style.display = 'none';
        onlineInfo.style.display = '';
        document.getElementById('game-area').style.display = '';
        gameRoomCode.textContent = code;
        gamePlayerInfo.innerHTML = 'You are <span class="you-yellow">Yellow</span> (<span class="lobby-avatar" data-player="' + username + '"></span><span class="lobby-name" data-player-name="' + username + '">' + username + '</span>) vs <span class="lobby-avatar" data-player="' + data.hostPlayer + '"></span><span class="lobby-name" data-player-name="' + data.hostPlayer + '">' + data.hostPlayer + '</span>';
        // Render avatars in player info
        if (window.ArcadeAvatar && window.ArcadeCoins) {
            gamePlayerInfo.querySelectorAll('.lobby-avatar').forEach(function(el) {
                var name = el.dataset.player;
                if (name && window.ArcadeCoins.getProfile) {
                    window.ArcadeCoins.getProfile(name).then(function(profile) {
                        if (profile) {
                            window.ArcadeAvatar.renderMini(el, profile);
                            var nameEl = el.parentElement.querySelector('.lobby-name[data-player-name="' + name + '"]');
                            if (nameEl) window.ArcadeAvatar.styleName(nameEl, profile);
                        }
                    });
                }
            });
        }

        c4.init();
        startListening(code);
    } catch (err) {
        console.error('Join game error:', err);
        joinError.textContent = 'Error: ' + err.message;
        joinError.style.display = '';
    }
};

window._c4OnlineCellClickHandler = async function(col) {
    var st = window._c4OnlineState;
    if (!st || !st.playing) return;
    if (c4.gameOver) return;
    if (c4.currentPlayer !== st.myRole) return;

    // Find drop row
    var row = c4.getDropRow(col);
    if (row === -1) return;

    // Temporarily place on internal board
    var prevVal = c4.board[row][col];
    c4.board[row][col] = st.myRole;

    // Build new board as flat string for Firestore
    var newBoardStr = boardToString(c4.board);

    var winResult = c4.checkWin(row, col, st.myRole);
    c4.board[row][col] = prevVal;

    var nextPlayer = st.myRole === 1 ? 2 : 1;
    var newStatus = 'playing';
    var winner = '';

    if (winResult) {
        newStatus = 'done';
        winner = st.myRole === 1 ? 'red' : 'yellow';
    } else {
        // Check draw: top row all filled
        var allFilled = true;
        var colMajor = stringToBoard(newBoardStr);
        for (var dc = 0; dc < 7; dc++) {
            if (colMajor[dc][0] === 0) { allFilled = false; break; }
        }
        if (allFilled) {
            newStatus = 'done';
            winner = 'draw';
        }
    }

    try {
        var roomRef = doc(db, 'c4_rooms', st.roomId);
        await updateDoc(roomRef, {
            board: newBoardStr,
            currentPlayer: nextPlayer,
            status: newStatus,
            winner: winner
        });
    } catch (err) {
        console.error('Move error:', err);
    }
};

window._c4OnlineNewGameHandler = async function() {
    var st = window._c4OnlineState;
    if (!st || !st.roomId) return;

    try {
        var roomRef = doc(db, 'c4_rooms', st.roomId);
        await updateDoc(roomRef, {
            board: makeEmptyBoard(),
            currentPlayer: 1,
            status: 'playing',
            winner: ''
        });
    } catch (err) {
        console.error('New game error:', err);
    }
};

// ===== Chat Send =====
window._c4ChatSend = async function(text) {
    var st = window._c4OnlineState;
    if (!st || !st.roomId || !text) return;
    try {
        var roomRef = doc(db, 'c4_rooms', st.roomId);
        var snapshot = await getDoc(roomRef);
        if (!snapshot.exists()) return;
        var data = snapshot.data();
        var chat = (data.chat || []).slice();
        var username = c4.getMyUsername();
        var now = new Date();
        chat.push({ name: username, text: text, time: ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2) });
        if (chat.length > 50) chat = chat.slice(chat.length - 50);
        await updateDoc(roomRef, { chat: chat });
    } catch(e) { console.error('Chat error:', e); }
};
