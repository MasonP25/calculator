<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Four</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .top-bar { display: flex; align-items: center; gap: 2rem; margin-bottom: 0.5rem; }
  .top-bar a { color: #7b2ff7; text-decoration: none; font-size: 0.9rem; }
  h1 { font-size: 2rem; }
  .mode-select { display: flex; gap: 1rem; margin-bottom: 0.8rem; }
  .mode-select button {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 0.5rem 1.5rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem;
  }
  .mode-select button:hover, .mode-select button.active { border-color: #7b2ff7; }
  .board {
    background: #1a1a6e;
    padding: 10px;
    border-radius: 12px;
    display: grid;
    grid-template-columns: repeat(7, 60px);
    gap: 6px;
    box-shadow: 0 0 30px rgba(30, 30, 120, 0.4);
  }
  .cell {
    width: 60px; height: 60px;
    background: #0f0f1a;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s;
    position: relative;
  }
  .cell.p1 {
    background: #ff4757;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(255,71,87,0.4);
  }
  .cell.p2 {
    background: #feca57;
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 10px rgba(254,202,87,0.4);
  }
  .cell.win {
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.3), 0 0 20px #fff;
  }
  .cell:hover:not(.p1):not(.p2) { background: #2a2a5a; }
  .col-header {
    width: 60px; height: 20px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: #555; font-size: 0.8rem;
  }
  .col-header:hover { color: #00d4ff; }
  .headers { display: grid; grid-template-columns: repeat(7, 60px); gap: 6px; margin-bottom: 4px; padding: 0 10px; }
  .msg { margin-top: 1rem; font-size: 1.2rem; min-height: 2rem; }
  .msg .p1t { color: #ff4757; } .msg .p2t { color: #feca57; }
  button.restart {
    margin-top: 0.8rem;
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: white; border: none; padding: 0.6rem 1.8rem;
    border-radius: 8px; font-size: 1rem; cursor: pointer;
  }
  button.restart:hover { opacity: 0.85; }
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html">&larr; Back</a>
  <h1>Connect Four</h1>
</div>
<div class="mode-select">
  <button id="mode2p" class="active">2 Players</button>
  <button id="modeBot">vs Bot</button>
</div>
<div class="headers" id="headers"></div>
<div class="board" id="board"></div>
<div class="msg" id="msg"><span class="p1t">Red's turn</span></div>
<button class="restart" id="restart">New Game</button>
<script>
const ROWS = 6, COLS = 7;
let board, currentPlayer, gameOver, botMode, thinking;
botMode = false; thinking = false;

const boardEl = document.getElementById('board');
const headersEl = document.getElementById('headers');
const msgEl = document.getElementById('msg');

document.getElementById('mode2p').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('modeBot').classList.remove('active');
  botMode = false; init();
});
document.getElementById('modeBot').addEventListener('click', function() {
  this.classList.add('active');
  document.getElementById('mode2p').classList.remove('active');
  botMode = true; init();
});
document.getElementById('restart').addEventListener('click', init);

function init() {
  board = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
  currentPlayer = 1;
  gameOver = false;
  thinking = false;
  render();
  msgEl.innerHTML = '<span class="p1t">Red\'s turn</span>';
}

function render() {
  boardEl.innerHTML = '';
  headersEl.innerHTML = '';
  for (let c = 0; c < COLS; c++) {
    const h = document.createElement('div');
    h.className = 'col-header';
    h.textContent = '\u25BC';
    h.addEventListener('click', () => dropPiece(c));
    headersEl.appendChild(h);
  }
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.row = r;
      cell.dataset.col = c;
      if (board[r][c] === 1) cell.classList.add('p1');
      if (board[r][c] === 2) cell.classList.add('p2');
      cell.addEventListener('click', () => dropPiece(c));
      boardEl.appendChild(cell);
    }
  }
}

function getDropRow(col) {
  for (let r = ROWS - 1; r >= 0; r--) {
    if (board[r][col] === 0) return r;
  }
  return -1;
}

function dropPiece(col) {
  if (gameOver || thinking) return;
  const row = getDropRow(col);
  if (row === -1) return;

  board[row][col] = currentPlayer;
  render();

  const win = checkWin(row, col, currentPlayer);
  if (win) {
    highlightWin(win);
    const name = currentPlayer === 1 ? 'Red' : 'Yellow';
    const cls = currentPlayer === 1 ? 'p1t' : 'p2t';
    let streakHtml = '';
    if (botMode) {
      const sk = (currentPlayer === 1) ? window.HallOfFame?.winStreak('connect4') : window.HallOfFame?.loseStreak('connect4');
      if (sk) streakHtml = ' | Streak: <span style="color:#00d4ff;font-weight:bold;">' + sk.current + '</span> | Best: <span style="color:#00d4ff;font-weight:bold;">' + sk.best + '</span>';
      if(currentPlayer === 1 && window.HallOfFame) window.HallOfFame.submit('connect4', 1);
    }
    msgEl.innerHTML = '<span class="' + cls + '">' + name + ' wins!</span>' + streakHtml;
    gameOver = true;
    return;
  }

  if (isDraw()) {
    msgEl.textContent = 'Draw!';
    gameOver = true;
    return;
  }

  currentPlayer = 3 - currentPlayer;
  updateTurnMsg();

  if (botMode && currentPlayer === 2) {
    thinking = true;
    setTimeout(botMove, 400);
  }
}

function updateTurnMsg() {
  const name = currentPlayer === 1 ? 'Red' : 'Yellow';
  const cls = currentPlayer === 1 ? 'p1t' : 'p2t';
  msgEl.innerHTML = '<span class="' + cls + '">' + name + '\'s turn</span>';
}

function checkWin(row, col, player) {
  const dirs = [[0,1],[1,0],[1,1],[1,-1]];
  for (const [dr, dc] of dirs) {
    let cells = [[row, col]];
    for (let d = -1; d <= 1; d += 2) {
      for (let i = 1; i < 4; i++) {
        const r = row + dr * i * d, c = col + dc * i * d;
        if (r < 0 || r >= ROWS || c < 0 || c >= COLS || board[r][c] !== player) break;
        cells.push([r, c]);
      }
    }
    if (cells.length >= 4) return cells;
  }
  return null;
}

function isDraw() {
  return board[0].every(c => c !== 0);
}

function highlightWin(cells) {
  for (const [r, c] of cells) {
    const idx = r * COLS + c;
    boardEl.children[idx].classList.add('win');
  }
}

// Bot AI
function botMove() {
  // 1. Win if possible
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c);
    if (r === -1) continue;
    board[r][c] = 2;
    if (checkWin(r, c, 2)) { board[r][c] = 0; thinking = false; dropPiece(c); return; }
    board[r][c] = 0;
  }
  // 2. Block opponent win
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c);
    if (r === -1) continue;
    board[r][c] = 1;
    if (checkWin(r, c, 1)) { board[r][c] = 0; thinking = false; dropPiece(c); return; }
    board[r][c] = 0;
  }
  // 3. Don't play a move that lets opponent win next turn
  const safe = [];
  for (let c = 0; c < COLS; c++) {
    const r = getDropRow(c);
    if (r === -1) continue;
    board[r][c] = 2;
    let dangerous = false;
    // Check if opponent wins above
    if (r > 0) {
      board[r-1][c] = 1;
      if (checkWin(r-1, c, 1)) dangerous = true;
      board[r-1][c] = 0;
    }
    board[r][c] = 0;
    if (!dangerous) safe.push(c);
  }
  const candidates = safe.length > 0 ? safe : Array.from({length: COLS}, (_,i) => i).filter(c => getDropRow(c) !== -1);

  // 4. Prefer center
  const scored = candidates.map(c => {
    let s = 0;
    s += (3 - Math.abs(c - 3)) * 3; // center preference
    // Check how many in a row this creates
    const r = getDropRow(c);
    board[r][c] = 2;
    for (const [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]) {
      let count = 1;
      for (let d of [-1, 1]) {
        for (let i = 1; i < 4; i++) {
          const nr = r+dr*i*d, nc = c+dc*i*d;
          if (nr<0||nr>=ROWS||nc<0||nc>=COLS||board[nr][nc]!==2) break;
          count++;
        }
      }
      s += count * 2;
    }
    board[r][c] = 0;
    return { c, s };
  });

  scored.sort((a, b) => b.s - a.s);
  // Add some randomness among top choices
  const topScore = scored[0].s;
  const top = scored.filter(x => x.s >= topScore - 2);
  const pick = top[Math.floor(Math.random() * top.length)].c;

  thinking = false;
  dropPiece(pick);
}

init();
</script>
<script src="sound.js"></script>
<script src="fame.js"></script>
<script type="module" src="firebase-lb.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
</body>
</html>
