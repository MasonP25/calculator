<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Typing Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }
  a.back {
    position: fixed; top: 12px; left: 16px;
    color: #888; text-decoration: none; font-size: 0.85rem;
    z-index: 100; transition: color 0.2s;
  }
  a.back:hover { color: #e0e0e0; }

  #gameWrapper {
    position: relative;
    margin-top: 12px;
  }
  #canvasWrap {
    position: relative;
  }
  canvas {
    display: block;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    background: #0f0f1a;
  }

  /* HUD above canvas */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 600px;
    padding: 8px 4px;
  }
  .hud-left, .hud-right { display: flex; gap: 16px; align-items: center; }
  .hud-item {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 4px 14px;
    font-size: 0.85rem;
  }
  .hud-label { color: #888; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }
  .hud-value { font-weight: 700; font-size: 1.1rem; }
  .hud-value.score-val { color: #00d4ff; }
  .hud-value.words-val { color: #7b2ff7; }
  .hud-value.level-val { color: #feca57; }
  .hearts { font-size: 1.2rem; letter-spacing: 2px; }
  .heart-full { color: #ff4757; }
  .heart-empty { color: #2a2a4a; }

  /* Input area */
  .input-area {
    width: 600px;
    margin-top: 6px;
    display: flex;
    gap: 8px;
  }
  #wordInput {
    flex: 1;
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 8px;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 1.3rem;
    padding: 8px 16px;
    outline: none;
    letter-spacing: 1px;
    transition: border-color 0.2s;
  }
  #wordInput:focus { border-color: #7b2ff7; }
  #wordInput.match { border-color: #00d4ff; color: #00d4ff; }
  #wordInput.no-match { border-color: #ff4757; color: #ff4757; }

  /* Overlays */
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 15, 26, 0.92);
    border-radius: 12px;
    z-index: 10;
    animation: fadeIn 0.3s ease;
  }
  .overlay.hidden { display: none; }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  .overlay-title {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #00d4ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay-subtitle {
    color: #888;
    font-size: 0.95rem;
    margin-bottom: 28px;
    text-align: center;
    line-height: 1.6;
  }
  .overlay-score {
    font-size: 3.5rem;
    font-weight: 800;
    color: #00d4ff;
    margin-bottom: 4px;
  }
  .overlay-score-label {
    color: #888;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .overlay-stats {
    display: flex;
    gap: 24px;
    margin-bottom: 28px;
  }
  .overlay-stat {
    text-align: center;
  }
  .overlay-stat-val {
    font-size: 1.4rem;
    font-weight: 700;
    color: #7b2ff7;
  }
  .overlay-stat-label {
    font-size: 0.7rem;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn {
    background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    color: #fff;
    border: none;
    padding: 12px 40px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(123, 47, 247, 0.4);
  }
  .btn:active { transform: translateY(0); }

  .game-over-title {
    font-size: 2.2rem;
    font-weight: 800;
    color: #ff4757;
    margin-bottom: 12px;
  }
</style>

<a class="back" href="index.html">&#8592; Back</a>

<div class="input-area" id="inputArea">

<script>
// roundRect polyfill
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    if (typeof r === 'number') r = [r, r, r, r];
    const [tl, tr, br, bl] = r;
    this.moveTo(x + tl, y);
    this.lineTo(x + w - tr, y);
    this.quadraticCurveTo(x + w, y, x + w, y + tr);
    this.lineTo(x + w, y + h - br);
    this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
    this.lineTo(x + bl, y + h);
    this.quadraticCurveTo(x, y + h, x, y + h - bl);
    this.lineTo(x, y + tl);
    this.quadraticCurveTo(x, y, x + tl, y);
    this.closePath();
    return this;
  };
}

// ============================================================
// GAME STATE
// ============================================================
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = 600, H = 600;

const input = document.getElementById('wordInput');
const hudScore = document.getElementById('hudScore');
const hudWords = document.getElementById('hudWords');
const hudLevel = document.getElementById('hudLevel');
const hudHearts = document.getElementById('hudHearts');
const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');

let gameState = 'start'; // start, playing, over
let score = 0;
let wordsTyped = 0;
let lives = 3;
let level = 1;
let missed = 0;
let fallingWords = [];
let particles = [];
let spawnTimer = 0;
let frameId = null;
let lastTime = 0;
let comboCount = 0;
let screenShake = 0;

// Difficulty scaling
function getSpawnInterval() {
  return Math.max(600, 2200 - level * 160);
}
function getBaseSpeed() {
  return 30 + level * 8; // pixels per second
}
function getMaxWords() {
  return Math.min(8, 3 + Math.floor(level / 2));
}
function getWordPool() {
  // At higher levels, allow longer words
  const maxLen = Math.min(8, 3 + level);
  const minLen = level >= 5 ? 4 : 3;
  return DICTIONARY.filter(w => w.length >= minLen && w.length <= maxLen);
}

// ============================================================
// FALLING WORD CLASS
// ============================================================
function createFallingWord() {
  const pool = getWordPool();
  // Avoid duplicates on screen
  const activeTexts = new Set(fallingWords.map(w => w.text));
  let attempts = 0, word;
  do {
    word = pool[Math.floor(Math.random() * pool.length)];
    attempts++;
  } while (activeTexts.has(word) && attempts < 30);

  const speed = getBaseSpeed() + Math.random() * 20 - 10;
  const textWidth = ctx.measureText(word).width || word.length * 14;
  const x = 30 + Math.random() * (W - 60 - textWidth);

  return {
    text: word,
    x: x,
    y: -20,
    speed: speed,
    alpha: 1,
    highlighted: false,
    matchLen: 0,
    scale: 1,
    flash: 0
  };
}

// ============================================================
// PARTICLES
// ============================================================
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 60 + Math.random() * 140;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 40,
      life: 0.6 + Math.random() * 0.4,
      maxLife: 0.6 + Math.random() * 0.4,
      color: color,
      size: 2 + Math.random() * 3
    });
  }
}

function spawnTextParticle(x, y, text, color) {
  particles.push({
    x, y,
    vx: 0,
    vy: -60,
    life: 1.0,
    maxLife: 1.0,
    color: color,
    size: 0,
    text: text,
    fontSize: 18
  });
}

// ============================================================
// RENDER
// ============================================================
function drawBackground() {
  // Subtle grid
  ctx.strokeStyle = 'rgba(42, 42, 74, 0.3)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Danger zone at bottom
  const grad = ctx.createLinearGradient(0, H - 60, 0, H);
  grad.addColorStop(0, 'rgba(255, 71, 87, 0)');
  grad.addColorStop(1, 'rgba(255, 71, 87, 0.12)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H - 60, W, 60);

  // Bottom line
  ctx.strokeStyle = 'rgba(255, 71, 87, 0.4)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();
  ctx.moveTo(0, H - 8);
  ctx.lineTo(W, H - 8);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawFallingWords() {
  const typed = input.value.toLowerCase();

  fallingWords.forEach(fw => {
    const isMatch = typed.length > 0 && fw.text.startsWith(typed);
    fw.highlighted = isMatch;
    fw.matchLen = isMatch ? typed.length : 0;

    ctx.save();
    const shakeX = fw.flash > 0 ? (Math.random() - 0.5) * 4 : 0;
    ctx.translate(fw.x + shakeX, fw.y);

    // Glow behind highlighted word
    if (isMatch) {
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 20;
    }

    // Background pill
    ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
    const textW = ctx.measureText(fw.text).width;
    const pillW = textW + 24;
    const pillH = 32;
    const pillX = -12;
    const pillY = -22;
    const r = 8;

    ctx.beginPath();
    ctx.roundRect(pillX, pillY, pillW, pillH, r);
    ctx.fillStyle = isMatch ? 'rgba(0, 212, 255, 0.15)' : 'rgba(26, 26, 46, 0.85)';
    ctx.fill();
    ctx.strokeStyle = isMatch ? 'rgba(0, 212, 255, 0.6)' : 'rgba(42, 42, 74, 0.6)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.shadowBlur = 0;

    // Draw each letter
    let offsetX = 0;
    for (let i = 0; i < fw.text.length; i++) {
      const ch = fw.text[i];
      if (isMatch && i < typed.length) {
        ctx.fillStyle = '#00d4ff';
      } else if (fw.y > H - 100) {
        ctx.fillStyle = '#ff4757';
      } else {
        ctx.fillStyle = '#e0e0e0';
      }
      ctx.fillText(ch, offsetX, 0);
      offsetX += ctx.measureText(ch).width;
    }

    ctx.restore();
  });
}

function drawParticles(dt) {
  particles.forEach(p => {
    const alpha = Math.max(0, p.life / p.maxLife);
    if (p.text) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `bold ${p.fontSize}px "Segoe UI", Tahoma, sans-serif`;
      ctx.fillStyle = p.color;
      ctx.textAlign = 'center';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    } else {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

function updateHearts() {
  let html = '';
  for (let i = 0; i < 3; i++) {
    html += i < lives
      ? '<span class="heart-full">\u2764</span>'
      : '<span class="heart-empty">\u2764</span>';
  }
  hudHearts.innerHTML = html;
}

// ============================================================
// GAME LOOP
// ============================================================
function update(dt) {
  if (gameState !== 'playing') return;

  // Spawn words
  spawnTimer -= dt * 1000;
  if (spawnTimer <= 0 && fallingWords.length < getMaxWords()) {
    ctx.font = 'bold 20px "Segoe UI", Tahoma, sans-serif';
    fallingWords.push(createFallingWord());
    spawnTimer = getSpawnInterval() + Math.random() * 400;
  }

  // Move words
  for (let i = fallingWords.length - 1; i >= 0; i--) {
    const fw = fallingWords[i];
    fw.y += fw.speed * dt;
    fw.flash = Math.max(0, fw.flash - dt);

    // Reached bottom
    if (fw.y > H + 10) {
      // Miss!
      lives--;
      missed++;
      window.SFX?.fail();
      screenShake = 0.3;
      comboCount = 0;
      spawnParticles(fw.x + 30, H - 10, '#ff4757', 8);
      fallingWords.splice(i, 1);
      updateHearts();

      if (lives <= 0) {
        endGame();
        return;
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt; // gravity
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Screen shake decay
  screenShake = Math.max(0, screenShake - dt);

  // Level up check
  const newLevel = Math.floor(wordsTyped / 10) + 1;
  if (newLevel > level) {
    level = newLevel;
    hudLevel.textContent = level;
    window.SFX?.levelup();
    spawnTextParticle(W / 2, H / 2, 'LEVEL ' + level + '!', '#feca57');
  }
}

function render(dt) {
  ctx.save();

  // Screen shake
  if (screenShake > 0) {
    const intensity = screenShake * 8;
    ctx.translate(
      (Math.random() - 0.5) * intensity,
      (Math.random() - 0.5) * intensity
    );
  }

  // Clear
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(-5, -5, W + 10, H + 10);

  drawBackground();
  drawFallingWords();
  drawParticles(dt);

  ctx.restore();
}

function gameLoop(timestamp) {
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  update(dt);
  render(dt);

  frameId = requestAnimationFrame(gameLoop);
}

// ============================================================
// INPUT HANDLING
// ============================================================
function trySubmitWord() {
  const typed = input.value.toLowerCase().trim();
  if (!typed) return;

  // Find matching word
  const idx = fallingWords.findIndex(fw => fw.text === typed);
  if (idx !== -1) {
    const fw = fallingWords[idx];

    // Success!
    score++;
    wordsTyped++;
    comboCount++;
    hudScore.textContent = score;
    hudWords.textContent = wordsTyped;

    // Sound
    window.SFX?.correct();
    if (comboCount >= 5 && comboCount % 5 === 0) {
      window.SFX?.combo();
    }

    // Particles
    spawnParticles(fw.x + 30, fw.y, '#00d4ff', 12);
    spawnParticles(fw.x + 30, fw.y, '#7b2ff7', 6);

    // Combo text
    if (comboCount >= 3) {
      spawnTextParticle(fw.x + 30, fw.y - 20, comboCount + 'x COMBO!', '#feca57');
    } else {
      const bonusTexts = ['+1', 'Nice!', 'Great!', 'Good!'];
      spawnTextParticle(fw.x + 30, fw.y - 20, bonusTexts[Math.floor(Math.random() * bonusTexts.length)], '#00d4ff');
    }

    fallingWords.splice(idx, 1);
    input.value = '';
    updateInputStyle();
  }
}

function updateInputStyle() {
  const typed = input.value.toLowerCase();
  if (!typed) {
    input.className = '';
    return;
  }
  const hasMatch = fallingWords.some(fw => fw.text.startsWith(typed));
  input.className = hasMatch ? 'match' : 'no-match';
}

input.addEventListener('input', () => {
  updateInputStyle();
});

input.addEventListener('keydown', (e) => {
  if (gameState !== 'playing') return;

  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    trySubmitWord();
  }
});

// ============================================================
// GAME STATE MANAGEMENT
// ============================================================
function startGame() {
  gameState = 'playing';
  score = 0;
  wordsTyped = 0;
  lives = 3;
  level = 1;
  missed = 0;
  comboCount = 0;
  fallingWords = [];
  particles = [];
  spawnTimer = 500;
  screenShake = 0;

  hudScore.textContent = '0';
  hudWords.textContent = '0';
  hudLevel.textContent = '1';
  updateHearts();

  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  document.getElementById('inputArea').style.visibility = 'visible';
  input.value = '';
  input.className = '';
  input.disabled = false;
  input.focus();

  window.SFX?.click();
}

function endGame() {
  gameState = 'over';
  window.SFX?.death();
  screenShake = 0.5;

  input.disabled = true;

  // Submit to leaderboard
  if (score > 0 && window.HallOfFame) {
    window.HallOfFame.submit('typing', score);
  }

  // Show game over overlay
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalLevel').textContent = level;
  document.getElementById('finalMissed').textContent = missed;

  setTimeout(() => {
    gameOverOverlay.classList.remove('hidden');
  }, 600);
}

function restartGame() {
  window.SFX?.click();
  startGame();
}

// ============================================================
// EVENT LISTENERS
// ============================================================
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', restartGame);

// Allow keyboard restart from game over
document.addEventListener('keydown', (e) => {
  if (gameState === 'over' && !gameOverOverlay.classList.contains('hidden')) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      restartGame();
    }
  }
  if (gameState === 'start' && !startOverlay.classList.contains('hidden')) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      startGame();
    }
  }
});

// ============================================================
// INIT
// ============================================================
updateHearts();

// Initial background render
ctx.fillStyle = '#0f0f1a';
ctx.fillRect(0, 0, W, H);
drawBackground();

lastTime = performance.now();
frameId = requestAnimationFrame(gameLoop);
</script>
