<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 20px 20px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 1.5rem;
    background: linear-gradient(90deg, #ff0000, #ff4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .url-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
    width: 100%;
    max-width: 960px;
  }
  .url-bar input {
    flex: 1;
    padding: 10px 16px;
    border-radius: 8px;
    border: 2px solid #2a2a4a;
    background: #1a1a2e;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .url-bar input:focus {
    border-color: #ff4444;
  }
  .url-bar input::placeholder {
    color: #666;
  }
  .url-bar button {
    padding: 10px 24px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #ff0000, #cc0000);
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .url-bar button:hover {
    opacity: 0.85;
  }
  .game-container {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16 / 9;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    overflow: hidden;
    background: #231F20;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .game-container iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  .placeholder {
    color: #555;
    font-size: 1.1rem;
    text-align: center;
    padding: 20px;
  }
  .source-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .source-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #2a2a4a;
    background: #1a1a2e;
    color: #888;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .source-btn:hover { border-color: #ff4444; color: #ccc; }
  .source-btn.active { background: #ff0000; border-color: #ff0000; color: #fff; }
  .source-btn.fail { background: #331111; border-color: #662222; color: #884444; text-decoration: line-through; }
  .status { color: #666; font-size: 0.75rem; margin-bottom: 0.8rem; text-align: center; }
  a.back {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10001;
    color: #aaa;
    text-decoration: none;
    font-size: 15px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    padding: 6px 14px;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  a.back:hover {
    background: #2a2a4a;
    color: #fff;
  }
</style>

<body>
<a class="back" href="index.html">&#8592; Back</a>
<h1>YouTube Player</h1>
<div class="url-bar">
  <input type="text" id="url" placeholder="Paste a YouTube link here...">
  <button id="watch">Watch</button>
</div>
<div class="source-bar" id="sources"></div>
<div class="status" id="status"></div>
<div class="game-container" id="player">
  <div class="placeholder">Paste a YouTube URL above and click Watch</div>
</div>
<script>
(function() {
  var SOURCES = [
    { name: 'YouTube (Privacy)', base: 'https://www.youtube-nocookie.com/embed/', params: '?autoplay=1&iv_load_policy=3&rel=0&modestbranding=1' },
    { name: 'YouTube', base: 'https://www.youtube.com/embed/', params: '?autoplay=1&iv_load_policy=3&rel=0&modestbranding=1' },
    { name: 'Invidious 1', base: 'https://yewtu.be/embed/', params: '?autoplay=1' },
    { name: 'Invidious 2', base: 'https://inv.nadeko.net/embed/', params: '?autoplay=1' },
    { name: 'Piped', base: 'https://piped.video/embed/', params: '?autoplay=1' }
  ];

  var urlInput = document.getElementById('url');
  var watchBtn = document.getElementById('watch');
  var player = document.getElementById('player');
  var sourcesEl = document.getElementById('sources');
  var statusEl = document.getElementById('status');
  var currentId = null;
  var currentSource = 0;
  var tried = [];
  var btns = [];

  // Build source buttons
  SOURCES.forEach(function(s, i) {
    var btn = document.createElement('button');
    btn.className = 'source-btn' + (i === 0 ? ' active' : '');
    btn.textContent = s.name;
    btn.addEventListener('click', function() {
      currentSource = i;
      btns.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (currentId) embedVideo(currentId, i);
    });
    sourcesEl.appendChild(btn);
    btns.push(btn);
  });

  function extractId(url) {
    url = url.trim();
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/))([a-zA-Z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
    return null;
  }

  function embedVideo(id, srcIdx) {
    var s = SOURCES[srcIdx];
    statusEl.textContent = 'Loading from ' + s.name + '...';
    var iframe = document.createElement('iframe');
    iframe.allowFullscreen = true;
    iframe.src = s.base + id + s.params;

    // Detect load failure (blocked iframes usually fire load but show blank or error)
    var loaded = false;
    iframe.addEventListener('load', function() {
      loaded = true;
      statusEl.textContent = 'Playing via ' + s.name;
    });

    player.innerHTML = '';
    player.appendChild(iframe);
  }

  function tryAll(id) {
    currentId = id;
    tried = [];
    currentSource = 0;
    btns.forEach(function(b) { b.classList.remove('active', 'fail'); });
    btns[0].classList.add('active');
    embedVideo(id, 0);
  }

  function loadVideo() {
    var id = extractId(urlInput.value);
    if (!id) {
      player.innerHTML = '<div class="placeholder">Invalid YouTube URL. Try a link like https://youtube.com/watch?v=...</div>';
      statusEl.textContent = '';
      return;
    }
    tryAll(id);
  }

  watchBtn.addEventListener('click', loadVideo);
  urlInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loadVideo();
  });
})();
</script>
