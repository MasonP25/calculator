<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 60px 20px 20px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #f39c12, #e67e22);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 700;
  }
  .game-container {
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 1000/650;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    overflow: hidden;
    background: #1a1a2e;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    position: relative;
  }
  .game-container iframe {
    position: absolute;
    left: -164px;
    top: -16px;
    width: 1400px;
    height: 900px;
    border: none;
  }
  a.back {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10001;
    color: #aaa;
    text-decoration: none;
    font-size: 15px;
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    padding: 6px 14px;
    border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  a.back:hover { background: #2a2a4a; color: #fff; }
  .note {
    margin-top: 0.8rem;
    color: #666;
    font-size: 0.78rem;
    text-align: center;
  }
  @media (max-width: 1024px) {
    .game-container {
      max-width: 100%;
    }
    .game-container iframe {
      transform: scale(0.7);
      transform-origin: 0 0;
      left: -115px;
      top: -11px;
    }
  }
</style>
