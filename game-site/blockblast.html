<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;

  .back {

  .tray-slot:hover { border-color: #00d4ff55; transform: scale(1.04); }

  .btn {

  @media (max-width: 480px) {

<body>

<a class="back" href="index.html">&#8592; Back</a>
<h1>Block Blast</h1>

<div class="info">
  <div><span class="label">Score</span><span class="value" id="score-val">0</span></div>
  <div><span class="label">Best</span><span class="value" id="best-val">0</span></div>
</div>

<div id="game-container">
  <canvas id="grid-canvas"></canvas>
  <div id="combo-text"></div>
  <div id="tray-area"></div>
</div>

<canvas id="drag-ghost"></canvas>

<div class="overlay" id="game-over-overlay">
  <div class="modal">
    <h2>Game Over</h2>
    <div class="final-score" id="final-score">0</div>
    <div class="sub" id="final-sub">Great effort!</div>
    <button class="btn" id="restart-btn">Play Again</button>
  </div>
</div>

<script>
(() => {
  // --- Constants ---
  const COLS = 8, ROWS = 8;
  const STORAGE_KEY = 'blockblast_best';
  const PIECE_COLORS = {
    I: '#00d4ff',
    O: '#ffd700',
    T: '#7b2ff7',
    S: '#00e676',
    Z: '#ff4757',
    L: '#ff9f43',
    J: '#3498db',
    plus: '#e84393',
    bigL: '#1abc9c',
    line3: '#00d4ff',
    dot: '#aaa',
    corner: '#f39c12',
    twoH: '#e74c3c',
    twoV: '#2ecc71',
    square3: '#9b59b6',
  };

  // Piece definitions: arrays of [row, col] offsets
  const PIECE_DEFS = [
    { name: 'I4',    cells: [[0,0],[0,1],[0,2],[0,3]], color: '#00d4ff' },
    { name: 'I4v',   cells: [[0,0],[1,0],[2,0],[3,0]], color: '#00d4ff' },
    { name: 'I3',    cells: [[0,0],[0,1],[0,2]],       color: '#54a0ff' },
    { name: 'I3v',   cells: [[0,0],[1,0],[2,0]],       color: '#54a0ff' },
    { name: 'I2',    cells: [[0,0],[0,1]],              color: '#48dbfb' },
    { name: 'I2v',   cells: [[0,0],[1,0]],              color: '#48dbfb' },
    { name: 'O',     cells: [[0,0],[0,1],[1,0],[1,1]],  color: '#ffd700' },
    { name: 'T',     cells: [[0,0],[0,1],[0,2],[1,1]],  color: '#7b2ff7' },
    { name: 'Td',    cells: [[0,1],[1,0],[1,1],[1,2]],  color: '#7b2ff7' },
    { name: 'Tl',    cells: [[0,0],[1,0],[1,1],[2,0]],  color: '#7b2ff7' },
    { name: 'Tr',    cells: [[0,1],[1,0],[1,1],[2,1]],  color: '#7b2ff7' },
    { name: 'S',     cells: [[0,1],[0,2],[1,0],[1,1]],  color: '#00e676' },
    { name: 'Z',     cells: [[0,0],[0,1],[1,1],[1,2]],  color: '#ff4757' },
    { name: 'Sv',    cells: [[0,0],[1,0],[1,1],[2,1]],  color: '#00e676' },
    { name: 'Zv',    cells: [[0,1],[1,0],[1,1],[2,0]],  color: '#ff4757' },
    { name: 'L',     cells: [[0,0],[1,0],[2,0],[2,1]],  color: '#ff9f43' },
    { name: 'L2',    cells: [[0,0],[0,1],[1,0]],        color: '#ff9f43' },
    { name: 'L3',    cells: [[0,0],[1,0],[1,1],[1,2]],  color: '#ff9f43' },
    { name: 'J',     cells: [[0,1],[1,1],[2,0],[2,1]],  color: '#3498db' },
    { name: 'J2',    cells: [[0,0],[0,1],[1,1]],        color: '#3498db' },
    { name: 'J3',    cells: [[0,0],[0,1],[0,2],[1,2]],  color: '#3498db' },
    { name: 'dot',   cells: [[0,0]],                    color: '#aaaaaa' },
    { name: 'sq3',   cells: [[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], color: '#9b59b6' },
    { name: 'I5',    cells: [[0,0],[0,1],[0,2],[0,3],[0,4]], color: '#0abde3' },
    { name: 'I5v',   cells: [[0,0],[1,0],[2,0],[3,0],[4,0]], color: '#0abde3' },
    { name: 'plus',  cells: [[0,1],[1,0],[1,1],[1,2],[2,1]], color: '#e84393' },
    { name: 'bigL',  cells: [[0,0],[1,0],[2,0],[2,1],[2,2]], color: '#1abc9c' },
    { name: 'bigJ',  cells: [[0,2],[1,2],[2,0],[2,1],[2,2]], color: '#1abc9c' },
  ];

  // --- State ---
  let grid = [];   // grid[r][c] = null | colorString
  let score = 0;
  let bestScore = parseInt(localStorage.getItem(STORAGE_KEY)) || 0;
  let trayPieces = [null, null, null]; // current 3 pieces
  let selectedIdx = -1;
  let gameOver = false;
  let clearAnim = []; // {r, c, t} for white flash
  let animFrame = null;

  // Drag state
  let dragging = false;
  let dragPieceIdx = -1;
  let dragOffX = 0, dragOffY = 0;
  let dragX = 0, dragY = 0;
  let hoverGridR = -1, hoverGridC = -1;

  // --- DOM refs ---
  const canvas = document.getElementById('grid-canvas');
  const ctx = canvas.getContext('2d');
  const trayArea = document.getElementById('tray-area');
  const scoreEl = document.getElementById('score-val');
  const bestEl = document.getElementById('best-val');
  const comboEl = document.getElementById('combo-text');
  const overlayEl = document.getElementById('game-over-overlay');
  const finalScoreEl = document.getElementById('final-score');
  const finalSubEl = document.getElementById('final-sub');
  const restartBtn = document.getElementById('restart-btn');
  const ghostCanvas = document.getElementById('drag-ghost');
  const ghostCtx = ghostCanvas.getContext('2d');

  // --- Sizing ---
  let cellSize = 50;
  let padding = 10;
  let gridPx = 0;

  function resize() {
    const maxW = Math.min(window.innerWidth - 32, 500);
    cellSize = Math.floor((maxW - padding * 2) / COLS);
    if (cellSize < 30) cellSize = 30;
    if (cellSize > 60) cellSize = 60;
    gridPx = cellSize * COLS + padding * 2;
    canvas.width = gridPx;
    canvas.height = gridPx;
    canvas.style.width = gridPx + 'px';
    canvas.style.height = gridPx + 'px';
    renderTray();
    draw();
  }

  // --- Grid helpers ---
  function initGrid() {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) grid[r][c] = null;
    }
  }

  function canPlace(piece, gr, gc) {
    for (const [dr, dc] of piece.cells) {
      const r = gr + dr, c = gc + dc;
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return false;
      if (grid[r][c]) return false;
    }
    return true;
  }

  function canPlaceAnywhere(piece) {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (canPlace(piece, r, c)) return true;
    return false;
  }

  function placePiece(piece, gr, gc) {
    for (const [dr, dc] of piece.cells) {
      grid[gr + dr][gc + dc] = piece.color;
    }
  }

  function checkAndClear() {
    let rowsToClear = [];
    let colsToClear = [];
    for (let r = 0; r < ROWS; r++) {
      if (grid[r].every(c => c !== null)) rowsToClear.push(r);
    }
    for (let c = 0; c < COLS; c++) {
      let full = true;
      for (let r = 0; r < ROWS; r++) { if (!grid[r][c]) { full = false; break; } }
      if (full) colsToClear.push(c);
    }
    const lines = rowsToClear.length + colsToClear.length;
    if (lines === 0) return 0;

    // Collect cells to animate
    const cells = new Set();
    for (const r of rowsToClear) for (let c = 0; c < COLS; c++) cells.add(r * COLS + c);
    for (const c of colsToClear) for (let r = 0; r < ROWS; r++) cells.add(r * COLS + c);

    const now = performance.now();
    cells.forEach(k => {
      const r = Math.floor(k / COLS), c = k % COLS;
      clearAnim.push({ r, c, t: now });
      grid[r][c] = null;
    });

    // Scoring: 10 per cell cleared + bonus for combos
    const cellCount = cells.size;
    let pts = cellCount * 10;
    if (lines >= 2) pts += lines * 40;
    if (lines >= 3) pts += lines * 80;
    if (lines >= 4) pts += lines * 150;

    // Show combo text
    if (lines >= 2) {
      const names = ['', '', 'Double!', 'Triple!', 'Quad!', 'MEGA!', 'ULTRA!', 'INSANE!', 'GOD MODE!'];
      showCombo(names[Math.min(lines, names.length - 1)] || `${lines}x Combo!`);
    }

    try { if (window.SoundFX) window.SoundFX.play('score'); } catch(e) {}

    return pts;
  }

  function showCombo(text) {
    comboEl.textContent = text;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
  }

  function checkGameOver() {
    for (const p of trayPieces) {
      if (p && canPlaceAnywhere(p)) return false;
    }
    return true;
  }

  // --- Random piece ---
  function randomPiece() {
    const def = PIECE_DEFS[Math.floor(Math.random() * PIECE_DEFS.length)];
    return { ...def, cells: def.cells.map(c => [...c]) };
  }

  function spawnTray() {
    for (let i = 0; i < 3; i++) trayPieces[i] = randomPiece();
    selectedIdx = -1;
  }

  function refillTrayIfEmpty() {
    if (trayPieces.every(p => p === null)) {
      spawnTray();
      renderTray();
      if (checkGameOver()) endGame();
    }
  }

  // --- Drawing ---
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.roundRect(0, 0, canvas.width, canvas.height, 12);
    ctx.fill();

    const now = performance.now();

    // Draw grid cells
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const x = padding + c * cellSize;
        const y = padding + r * cellSize;
        const gap = 2;

        // Empty cell background
        ctx.fillStyle = '#12122a';
        ctx.beginPath();
        ctx.roundRect(x + gap, y + gap, cellSize - gap * 2, cellSize - gap * 2, 6);
        ctx.fill();

        if (grid[r][c]) {
          drawBlock(ctx, x + gap, y + gap, cellSize - gap * 2, grid[r][c]);
        }
      }
    }

    // Draw hover preview
    if (selectedIdx >= 0 && hoverGridR >= 0 && trayPieces[selectedIdx]) {
      const piece = trayPieces[selectedIdx];
      const valid = canPlace(piece, hoverGridR, hoverGridC);
      for (const [dr, dc] of piece.cells) {
        const r = hoverGridR + dr, c = hoverGridC + dc;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          const x = padding + c * cellSize + 2;
          const y = padding + r * cellSize + 2;
          const sz = cellSize - 4;
          ctx.globalAlpha = valid ? 0.45 : 0.2;
          ctx.fillStyle = valid ? piece.color : '#ff0000';
          ctx.beginPath();
          ctx.roundRect(x, y, sz, sz, 6);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    // Draw drag preview on grid
    if (dragging && dragPieceIdx >= 0 && trayPieces[dragPieceIdx]) {
      const piece = trayPieces[dragPieceIdx];
      const canvasRect = canvas.getBoundingClientRect();
      // Calculate grid position from drag coords
      const localX = dragX - canvasRect.left;
      const localY = dragY - canvasRect.top;
      const gc = Math.floor((localX - padding) / cellSize);
      const gr = Math.floor((localY - padding) / cellSize);

      // Center the piece on the cursor
      const pBounds = pieceBounds(piece);
      const centerR = gr - Math.floor(pBounds.rows / 2);
      const centerC = gc - Math.floor(pBounds.cols / 2);

      const valid = canPlace(piece, centerR, centerC);
      for (const [dr, dc] of piece.cells) {
        const r = centerR + dr, c = centerC + dc;
        if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
          const x = padding + c * cellSize + 2;
          const y = padding + r * cellSize + 2;
          const sz = cellSize - 4;
          ctx.globalAlpha = valid ? 0.5 : 0.25;
          ctx.fillStyle = valid ? piece.color : '#ff0000';
          ctx.beginPath();
          ctx.roundRect(x, y, sz, sz, 6);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
    }

    // Clear animations
    clearAnim = clearAnim.filter(a => {
      const elapsed = now - a.t;
      if (elapsed > 400) return false;
      const x = padding + a.c * cellSize + 2;
      const y = padding + a.r * cellSize + 2;
      const sz = cellSize - 4;
      const alpha = 1 - elapsed / 400;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(x, y, sz, sz, 6);
      ctx.fill();
      ctx.globalAlpha = 1;
      return true;
    });

    if (clearAnim.length > 0) requestAnimationFrame(draw);
  }

  function drawBlock(c2d, x, y, sz, color) {
    // Main block
    c2d.fillStyle = color;
    c2d.beginPath();
    c2d.roundRect(x, y, sz, sz, 6);
    c2d.fill();

    // Highlight (top-left shine)
    const grad = c2d.createLinearGradient(x, y, x + sz, y + sz);
    grad.addColorStop(0, 'rgba(255,255,255,0.25)');
    grad.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    grad.addColorStop(1, 'rgba(0,0,0,0.15)');
    c2d.fillStyle = grad;
    c2d.beginPath();
    c2d.roundRect(x, y, sz, sz, 6);
    c2d.fill();

    // Border
    c2d.strokeStyle = 'rgba(255,255,255,0.15)';
    c2d.lineWidth = 1;
    c2d.beginPath();
    c2d.roundRect(x + 0.5, y + 0.5, sz - 1, sz - 1, 6);
    c2d.stroke();
  }

  function pieceBounds(piece) {
    let minR = Infinity, maxR = -Infinity, minC = Infinity, maxC = -Infinity;
    for (const [r, c] of piece.cells) {
      minR = Math.min(minR, r); maxR = Math.max(maxR, r);
      minC = Math.min(minC, c); maxC = Math.max(maxC, c);
    }
    return { minR, maxR, minC, maxC, rows: maxR - minR + 1, cols: maxC - minC + 1 };
  }

  // --- Tray rendering ---
  function renderTray() {
    trayArea.innerHTML = '';
    const trayCellSize = Math.max(20, Math.min(32, cellSize * 0.6));

    trayPieces.forEach((piece, idx) => {
      const slot = document.createElement('div');
      slot.className = 'tray-slot' + (piece ? '' : ' empty') + (idx === selectedIdx ? ' selected' : '');

      if (piece) {
        const bounds = pieceBounds(piece);
        const cw = bounds.cols * trayCellSize + 8;
        const ch = bounds.rows * trayCellSize + 8;
        const tc = document.createElement('canvas');
        tc.width = cw;
        tc.height = ch;
        tc.style.width = cw + 'px';
        tc.style.height = ch + 'px';
        tc.style.display = 'block';
        const tctx = tc.getContext('2d');
        for (const [dr, dc] of piece.cells) {
          const x = (dc - bounds.minC) * trayCellSize + 4;
          const y = (dr - bounds.minR) * trayCellSize + 4;
          drawBlock(tctx, x, y, trayCellSize - 2, piece.color);
        }
        slot.appendChild(tc);

        // Click to select
        slot.addEventListener('click', (e) => {
          if (dragging) return;
          e.stopPropagation();
          selectedIdx = (selectedIdx === idx) ? -1 : idx;
          renderTray();
        });

        // Drag start (mouse)
        slot.addEventListener('mousedown', (e) => {
          e.preventDefault();
          startDrag(idx, e.clientX, e.clientY);
        });

        // Drag start (touch)
        slot.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const t = e.touches[0];
          startDrag(idx, t.clientX, t.clientY);
        }, { passive: false });
      }

      trayArea.appendChild(slot);
    });
  }

  // --- Drag and drop ---
  function startDrag(idx, x, y) {
    if (!trayPieces[idx]) return;
    dragging = true;
    dragPieceIdx = idx;
    selectedIdx = -1;
    dragX = x;
    dragY = y;

    // Create ghost
    const piece = trayPieces[idx];
    const bounds = pieceBounds(piece);
    const gs = Math.max(20, Math.min(cellSize, 40));
    const gw = bounds.cols * gs + 4;
    const gh = bounds.rows * gs + 4;
    ghostCanvas.width = gw;
    ghostCanvas.height = gh;
    ghostCanvas.style.width = gw + 'px';
    ghostCanvas.style.height = gh + 'px';
    ghostCtx.clearRect(0, 0, gw, gh);
    for (const [dr, dc] of piece.cells) {
      drawBlock(ghostCtx, (dc - bounds.minC) * gs + 2, (dr - bounds.minR) * gs + 2, gs - 2, piece.color);
    }
    ghostCanvas.style.display = 'block';
    ghostCanvas.style.left = (x - gw / 2) + 'px';
    ghostCanvas.style.top = (y - gh - 20) + 'px';

    renderTray();
    draw();
  }

  function moveDrag(x, y) {
    if (!dragging) return;
    dragX = x;
    dragY = y;
    const gw = ghostCanvas.width;
    const gh = ghostCanvas.height;
    ghostCanvas.style.left = (x - gw / 2) + 'px';
    ghostCanvas.style.top = (y - gh - 20) + 'px';
    draw();
  }

  function endDrag(x, y) {
    if (!dragging) return;
    dragging = false;
    ghostCanvas.style.display = 'none';

    const piece = trayPieces[dragPieceIdx];
    if (!piece) return;

    const canvasRect = canvas.getBoundingClientRect();
    const localX = x - canvasRect.left;
    const localY = y - canvasRect.top;
    const gc = Math.floor((localX - padding) / cellSize);
    const gr = Math.floor((localY - padding) / cellSize);

    const bounds = pieceBounds(piece);
    const centerR = gr - Math.floor(bounds.rows / 2);
    const centerC = gc - Math.floor(bounds.cols / 2);

    if (canPlace(piece, centerR, centerC)) {
      placePiece(piece, centerR, centerC);
      trayPieces[dragPieceIdx] = null;
      try { if (window.SoundFX) window.SoundFX.play('move'); } catch(e) {}

      const pts = checkAndClear();
      score += pts + piece.cells.length; // base points for placing
      updateScore();
      refillTrayIfEmpty();
      if (checkGameOver()) endGame();
    }

    dragPieceIdx = -1;
    renderTray();
    draw();
  }

  // Mouse events (global for drag)
  document.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', (e) => endDrag(e.clientX, e.clientY));

  // Touch events (global for drag)
  document.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const t = e.touches[0];
    moveDrag(t.clientX, t.clientY);
  }, { passive: false });
  document.addEventListener('touchend', (e) => {
    if (!dragging) return;
    const t = e.changedTouches[0];
    endDrag(t.clientX, t.clientY);
  });

  // --- Canvas click (for click-to-place) ---
  canvas.addEventListener('click', (e) => {
    if (gameOver || dragging) return;
    if (selectedIdx < 0 || !trayPieces[selectedIdx]) return;

    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const gc = Math.floor((mx - padding) / cellSize);
    const gr = Math.floor((my - padding) / cellSize);

    const piece = trayPieces[selectedIdx];
    const bounds = pieceBounds(piece);
    const placeR = gr - Math.floor(bounds.rows / 2);
    const placeC = gc - Math.floor(bounds.cols / 2);

    if (canPlace(piece, placeR, placeC)) {
      placePiece(piece, placeR, placeC);
      trayPieces[selectedIdx] = null;
      selectedIdx = -1;
      try { if (window.SoundFX) window.SoundFX.play('move'); } catch(e) {}

      const pts = checkAndClear();
      score += pts + piece.cells.length;
      updateScore();
      renderTray();
      refillTrayIfEmpty();
      if (checkGameOver()) endGame();
      draw();
    }
  });

  // Canvas hover for preview
  canvas.addEventListener('mousemove', (e) => {
    if (dragging) return;
    if (selectedIdx < 0 || !trayPieces[selectedIdx]) { hoverGridR = -1; return; }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const gc = Math.floor((mx - padding) / cellSize);
    const gr = Math.floor((my - padding) / cellSize);
    const piece = trayPieces[selectedIdx];
    const bounds = pieceBounds(piece);
    hoverGridR = gr - Math.floor(bounds.rows / 2);
    hoverGridC = gc - Math.floor(bounds.cols / 2);
    draw();
  });

  canvas.addEventListener('mouseleave', () => {
    hoverGridR = -1;
    draw();
  });

  // --- Score ---
  function updateScore() {
    scoreEl.textContent = score;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem(STORAGE_KEY, bestScore);
    }
    bestEl.textContent = bestScore;
  }

  // --- Game over ---
  function endGame() {
    gameOver = true;
    finalScoreEl.textContent = score;
    if (score >= bestScore && score > 0) {
      finalSubEl.textContent = 'New high score!';
    } else if (score > 200) {
      finalSubEl.textContent = 'Great game!';
    } else {
      finalSubEl.textContent = 'Keep practicing!';
    }
    setTimeout(() => {
      overlayEl.classList.add('show');
      try { if (window.SoundFX) window.SoundFX.play('gameover'); } catch(e) {}
      if (window.HallOfFame) window.HallOfFame.submit('blockblast', score);
    }, 500);
  }

  // --- Init / Restart ---
  function startGame() {
    gameOver = false;
    score = 0;
    selectedIdx = -1;
    dragging = false;
    dragPieceIdx = -1;
    hoverGridR = -1;
    clearAnim = [];
    overlayEl.classList.remove('show');
    initGrid();
    spawnTray();
    updateScore();
    renderTray();
    draw();
  }

  restartBtn.addEventListener('click', startGame);

  // --- Polyfill roundRect if needed ---
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (typeof r === 'number') r = [r, r, r, r];
      const [tl, tr, br, bl] = r;
      this.moveTo(x + tl, y);
      this.lineTo(x + w - tr, y);
      this.quadraticCurveTo(x + w, y, x + w, y + tr);
      this.lineTo(x + w, y + h - br);
      this.quadraticCurveTo(x + w, y + h, x + w - br, y + h);
      this.lineTo(x + bl, y + h);
      this.quadraticCurveTo(x, y + h, x, y + h - bl);
      this.lineTo(x, y + tl);
      this.quadraticCurveTo(x, y, x + tl, y);
      this.closePath();
    };
  }

  window.addEventListener('resize', resize);
  startGame();
  resize();
})();
</script>
