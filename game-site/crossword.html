<title>Crossword Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
a.back{position:fixed;top:18px;left:18px;color:#aaa;text-decoration:none;font-size:1.1rem;z-index:100;transition:color .2s;}
a.back:hover{color:#00e5ff;}
h1{font-size:2rem;margin:18px 0 6px;background:linear-gradient(135deg,#7b2ff7,#00e5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0;}
.controls button,.diff-btn{background:#1a1a2e;border:2px solid #2a2a4a;color:#e0e0e0;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:'Segoe UI',Tahoma,sans-serif;font-size:.9rem;transition:border-color .2s,background .2s;}
.controls button:hover,.diff-btn:hover{border-color:#7b2ff7;}
.controls button.active,.diff-btn.active{border-color:#7b2ff7;background:#2a1a4e;color:#fff;}
.timer{font-size:1.3rem;color:#00e5ff;margin:6px 0;font-variant-numeric:tabular-nums;}
.penalty{color:#ff4757;font-size:.85rem;margin-left:8px;}
.game-wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start;margin:10px auto;max-width:1100px;padding:0 12px;}
.grid-container{position:relative;}
.grid{display:inline-grid;gap:0;background:#2a2a4a;border:2px solid #2a2a4a;border-radius:6px;overflow:hidden;}
.cell{width:46px;height:46px;position:relative;display:flex;align-items:center;justify-content:center;font-size:1.3rem;font-weight:700;color:#e0e0e0;cursor:pointer;border:1px solid #2a2a4a;transition:background .15s;}
.cell.black{background:#0a0a14;cursor:default;}
.cell.white{background:#1a1a2e;}
.cell.highlight-word{background:#2a1a4e;}
.cell.highlight-current{background:#00e5ff33;box-shadow:inset 0 0 0 2px #00e5ff;}
.cell .num{position:absolute;top:1px;left:3px;font-size:.6rem;color:#aaa;font-weight:400;}
.cell input{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:none;outline:none;text-align:center;font-size:1.3rem;font-weight:700;color:#e0e0e0;font-family:'Segoe UI',Tahoma,sans-serif;text-transform:uppercase;caret-color:#00e5ff;cursor:pointer;padding:0;}
.cell input::selection{background:#7b2ff744;}
.cell.error input{color:#ff4757;}
.cell.correct-word{background:#1a3a1a;}
.clues-panel{display:flex;gap:20px;max-height:500px;}
.clue-section{min-width:180px;max-width:250px;}
.clue-section h3{color:#7b2ff7;margin-bottom:6px;font-size:1rem;border-bottom:1px solid #2a2a4a;padding-bottom:4px;}
.clue-list{list-style:none;max-height:420px;overflow-y:auto;padding-right:6px;}
.clue-list::-webkit-scrollbar{width:5px;}
.clue-list::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px;}
.clue-list::-webkit-scrollbar-track{background:transparent;}
.clue-item{padding:4px 8px;border-radius:4px;cursor:pointer;font-size:.85rem;line-height:1.3;margin-bottom:2px;transition:background .15s;color:#ccc;}
.clue-item:hover{background:#2a2a4a;}
.clue-item.active{background:#7b2ff733;color:#fff;}
.clue-item .clue-num{color:#00e5ff;font-weight:700;margin-right:4px;}
.msg{margin:10px 0;font-size:1.2rem;min-height:1.8rem;text-align:center;}
.msg.win{color:#00e5ff;text-shadow:0 0 12px #00e5ff55;}
@media(max-width:700px){
  .game-wrap{flex-direction:column;align-items:center;}
  .clues-panel{flex-direction:column;max-height:none;}
  .cell{width:38px;height:38px;font-size:1.1rem;}
  .cell input{font-size:1.1rem;}
}
</style>
</head>

</div>

const DIFF={easy:{size:5,minWords:4,maxWords:6,maxLen:5},medium:{size:7,minWords:6,maxWords:10,maxLen:7},hard:{size:9,minWords:8,maxWords:14,maxLen:9}};
let difficulty='medium',grid=[],placed=[],clues={across:[],down:[]},gridSize=7;
let selectedClue=null,selectedDir='across',selectedCells=[];
let timerInterval=null,seconds=0,penalties=0,solved=false;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function getWordPool(){
  const d=DIFF[difficulty];
  const pool=WORDS.filter(w=>w[0].length<=d.maxLen&&w[0].length>=3);
  return shuffle([...pool]);
}

function makeGrid(sz){return Array.from({length:sz},()=>Array.from({length:sz},()=>({letter:null,across:null,down:null,num:0})));}

function canPlace(g,word,r,c,dir){
  const sz=g.length,len=word.length;
  const dr=dir==='down'?1:0,dc=dir==='across'?1:0;
  if(r+dr*(len-1)>=sz||c+dc*(len-1)>=sz)return false;
  // check cell before word is empty or wall
  const br=r-dr,bc=c-dc;
  if(br>=0&&bc>=0&&g[br][bc].letter!==null)return false;
  // check cell after word is empty or wall
  const ar=r+dr*len,ac=c+dc*len;
  if(ar<sz&&ac<sz&&g[ar][ac].letter!==null)return false;

  let intersections=0;
  for(let i=0;i<len;i++){
    const cr=r+dr*i,cc=c+dc*i;
    const cell=g[cr][cc];
    if(cell.letter!==null){
      if(cell.letter!==word[i])return false;
      // already used in same direction?
      if(dir==='across'&&cell.across!==null)return false;
      if(dir==='down'&&cell.down!==null)return false;
      intersections++;
    } else {
      // check perpendicular neighbors don't create unwanted adjacency
      if(dir==='across'){
        if(cr>0&&g[cr-1][cc].letter!==null&&!willIntersect(g,cr-1,cc,word[i]))return false;
        if(cr<sz-1&&g[cr+1][cc].letter!==null&&!willIntersect(g,cr+1,cc,word[i]))return false;
      } else {
        if(cc>0&&g[cr][cc-1].letter!==null&&!willIntersect(g,cr,cc-1,word[i]))return false;
        if(cc<sz-1&&g[cr][cc+1].letter!==null&&!willIntersect(g,cr,cc+1,word[i]))return false;
      }
    }
  }
  return intersections;
}

function willIntersect(g,r,c,letter){return false;}

function placeWord(g,word,r,c,dir,idx){
  const dr=dir==='down'?1:0,dc=dir==='across'?1:0;
  for(let i=0;i<word.length;i++){
    const cr=r+dr*i,cc=c+dc*i;
    g[cr][cc].letter=word[i];
    if(dir==='across')g[cr][cc].across=idx;
    else g[cr][cc].down=idx;
  }
}

function removeWord(g,word,r,c,dir,idx){
  const dr=dir==='down'?1:0,dc=dir==='across'?1:0;
  for(let i=0;i<word.length;i++){
    const cr=r+dr*i,cc=c+dc*i;
    if(dir==='across'){
      g[cr][cc].across=null;
      if(g[cr][cc].down===null)g[cr][cc].letter=null;
    } else {
      g[cr][cc].down=null;
      if(g[cr][cc].across===null)g[cr][cc].letter=null;
    }
  }
}

function generatePuzzle(){
  const d=DIFF[difficulty];
  const sz=d.size;
  const pool=getWordPool();
  let bestGrid=null,bestPlaced=[];

  for(let attempt=0;attempt<40;attempt++){
    const g=makeGrid(sz);
    const pl=[];
    const wp=shuffle([...pool]);

    for(let wi=0;wi<wp.length&&pl.length<d.maxWords;wi++){
      const [word,clue]=wp[wi];
      if(pl.length===0){
        // place first word across, near center
        const row=Math.floor(sz/2);
        const col=Math.max(0,Math.floor((sz-word.length)/2));
        if(col+word.length<=sz){
          placeWord(g,word,row,col,'across',0);
          pl.push({word,clue,row,col,dir:'across'});
        }
        continue;
      }
      let bestPos=null,bestInt=-1;
      const dirs=['across','down'];
      for(const dir of dirs){
        const dr=dir==='down'?1:0,dc=dir==='across'?1:0;
        for(let r=0;r<sz;r++){
          for(let c=0;c<sz;c++){
            if(r+dr*(word.length-1)>=sz||c+dc*(word.length-1)>=sz)continue;
            const ints=canPlace(g,word,r,c,dir);
            if(ints>bestInt){
              bestInt=ints;
              bestPos={r,c,dir};
            }
          }
        }
      }
      if(bestInt>0){
        placeWord(g,word,bestPos.r,bestPos.c,bestPos.dir,pl.length);
        pl.push({word,clue,row:bestPos.r,col:bestPos.c,dir:bestPos.dir});
      }
    }
    if(pl.length>bestPlaced.length){
      bestGrid=g.map(row=>row.map(cell=>({...cell})));
      bestPlaced=[...pl];
    }
    if(pl.length>=d.maxWords)break;
  }

  if(!bestGrid||bestPlaced.length<d.minWords){
    // fallback: try again
    return generatePuzzle();
  }

  grid=bestGrid;
  placed=bestPlaced;
  gridSize=sz;
  numberCells();
}

function numberCells(){
  clues={across:[],down:[]};
  let num=1;
  const sz=gridSize;
  for(let r=0;r<sz;r++){
    for(let c=0;c<sz;c++){
      const cell=grid[r][c];
      if(cell.letter===null)continue;
      let needsNum=false;
      // check if start of across word
      const isAcrossStart=cell.across!==null&&(c===0||grid[r][c-1].letter===null);
      const isDownStart=cell.down!==null&&(r===0||grid[r-1][c].letter===null);
      if(isAcrossStart||isDownStart){
        cell.num=num;
        if(isAcrossStart){
          const p=placed.find(p=>p.dir==='across'&&p.row===r&&p.col===c);
          if(p)clues.across.push({num,clue:p.clue,word:p.word,row:r,col:c,dir:'across'});
        }
        if(isDownStart){
          const p=placed.find(p=>p.dir==='down'&&p.row===r&&p.col===c);
          if(p)clues.down.push({num,clue:p.clue,word:p.word,row:r,col:c,dir:'down'});
        }
        num++;
      }
    }
  }
}

function renderGrid(){
  const el=document.getElementById('grid');
  el.style.gridTemplateColumns=`repeat(${gridSize},46px)`;
  el.innerHTML='';
  for(let r=0;r<gridSize;r++){
    for(let c=0;c<gridSize;c++){
      const cell=grid[r][c];
      const div=document.createElement('div');
      div.className='cell '+(cell.letter?'white':'black');
      div.dataset.r=r;div.dataset.c=c;
      if(cell.num){
        const numSpan=document.createElement('span');
        numSpan.className='num';numSpan.textContent=cell.num;
        div.appendChild(numSpan);
      }
      if(cell.letter){
        const inp=document.createElement('input');
        inp.maxLength=1;
        inp.dataset.r=r;inp.dataset.c=c;
        inp.addEventListener('input',onInput);
        inp.addEventListener('keydown',onKeyDown);
        inp.addEventListener('click',onCellClick);
        inp.addEventListener('focus',onCellFocus);
        div.appendChild(inp);
      }
      el.appendChild(div);
    }
  }
}

function renderClues(){
  ['across','down'].forEach(dir=>{
    const ul=document.getElementById(dir==='across'?'acrossClues':'downClues');
    ul.innerHTML='';
    clues[dir].forEach(cl=>{
      const li=document.createElement('li');
      li.className='clue-item';
      li.dataset.dir=dir;
      li.dataset.num=cl.num;
      li.innerHTML=`<span class="clue-num">${cl.num}.</span> ${cl.clue}`;
      li.addEventListener('click',()=>{
        window.SFX?.select();
        selectClue(cl,dir);
        const cells=getWordCells(cl);
        if(cells.length){
          const firstEmpty=cells.find(([r,c])=>{
            const inp=getInput(r,c);
            return inp&&!inp.value;
          });
          const target=firstEmpty||cells[0];
          const inp=getInput(target[0],target[1]);
          if(inp)inp.focus();
        }
      });
      ul.appendChild(li);
    });
  });
}

function getInput(r,c){return document.querySelector(`input[data-r="${r}"][data-c="${c}"]`);}
function getCell(r,c){return document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);}

function getWordCells(cl){
  const cells=[];
  const dr=cl.dir==='down'?1:0,dc=cl.dir==='across'?1:0;
  for(let i=0;i<cl.word.length;i++){
    cells.push([cl.row+dr*i,cl.col+dc*i]);
  }
  return cells;
}

function findClueAt(r,c,dir){
  return clues[dir].find(cl=>{
    const cells=getWordCells(cl);
    return cells.some(([cr,cc])=>cr===r&&cc===c);
  });
}

function selectClue(cl,dir){
  selectedClue=cl;selectedDir=dir;
  highlightWord();
  document.querySelectorAll('.clue-item').forEach(li=>li.classList.remove('active'));
  const li=document.querySelector(`.clue-item[data-dir="${dir}"][data-num="${cl.num}"]`);
  if(li){li.classList.add('active');li.scrollIntoView({block:'nearest'});}
}

function highlightWord(){
  document.querySelectorAll('.cell').forEach(d=>{d.classList.remove('highlight-word','highlight-current');});
  if(!selectedClue)return;
  const cells=getWordCells(selectedClue);
  cells.forEach(([r,c])=>{
    const d=getCell(r,c);
    if(d)d.classList.add('highlight-word');
  });
  const focused=document.activeElement;
  if(focused&&focused.tagName==='INPUT'){
    const r=+focused.dataset.r,c=+focused.dataset.c;
    const d=getCell(r,c);
    if(d)d.classList.add('highlight-current');
  }
}

function onCellClick(e){
  const r=+e.target.dataset.r,c=+e.target.dataset.c;
  const cell=grid[r][c];
  // toggle direction if clicking same cell
  if(selectedClue){
    const cells=getWordCells(selectedClue);
    const isInCurrent=cells.some(([cr,cc])=>cr===r&&cc===c);
    if(isInCurrent&&document.activeElement===e.target){
      const otherDir=selectedDir==='across'?'down':'across';
      const otherClue=findClueAt(r,c,otherDir);
      if(otherClue){
        selectClue(otherClue,otherDir);
        highlightWord();
        return;
      }
    }
  }
  onCellFocus(e);
}

function onCellFocus(e){
  const r=+e.target.dataset.r,c=+e.target.dataset.c;
  // find clue for this cell
  let cl=findClueAt(r,c,selectedDir);
  if(!cl){
    cl=findClueAt(r,c,selectedDir==='across'?'down':'across');
    if(cl)selectedDir=cl.dir;
  }
  if(cl)selectClue(cl,cl.dir);
  highlightWord();
}

function onInput(e){
  if(solved)return;
  const inp=e.target;
  const val=inp.value.toUpperCase().replace(/[^A-Z]/g,'');
  inp.value=val;
  if(val){
    window.SFX?.click();
    inp.parentElement.classList.remove('error');
    moveToNext(+inp.dataset.r,+inp.dataset.c);
  }
}

function moveToNext(r,c){
  if(!selectedClue)return;
  const cells=getWordCells(selectedClue);
  const idx=cells.findIndex(([cr,cc])=>cr===r&&cc===c);
  // find next empty cell in word, or next cell
  for(let i=idx+1;i<cells.length;i++){
    const inp=getInput(cells[i][0],cells[i][1]);
    if(inp&&!inp.value){inp.focus();return;}
  }
  for(let i=idx+1;i<cells.length;i++){
    const inp=getInput(cells[i][0],cells[i][1]);
    if(inp){inp.focus();return;}
  }
}

function onKeyDown(e){
  if(solved)return;
  const r=+e.target.dataset.r,c=+e.target.dataset.c;
  if(e.key==='Backspace'){
    if(!e.target.value){
      e.preventDefault();
      moveToPrev(r,c);
    } else {
      e.target.value='';
      e.target.parentElement.classList.remove('error');
      e.preventDefault();
    }
    return;
  }
  if(e.key==='Tab'||e.key==='Enter'){
    e.preventDefault();
    moveToNextClue();
    return;
  }
  if(e.key.startsWith('Arrow')){
    e.preventDefault();
    let nr=r,nc=c;
    if(e.key==='ArrowUp')nr--;
    if(e.key==='ArrowDown')nr++;
    if(e.key==='ArrowLeft')nc--;
    if(e.key==='ArrowRight')nc++;
    if(nr>=0&&nr<gridSize&&nc>=0&&nc<gridSize){
      const inp=getInput(nr,nc);
      if(inp){
        // switch direction based on arrow
        if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
          const cl=findClueAt(nr,nc,'across');
          if(cl)selectClue(cl,'across');
        } else {
          const cl=findClueAt(nr,nc,'down');
          if(cl)selectClue(cl,'down');
        }
        inp.focus();
      }
    }
    return;
  }
  if(/^[a-zA-Z]$/.test(e.key)){
    e.preventDefault();
    e.target.value=e.key.toUpperCase();
    e.target.parentElement.classList.remove('error');
    window.SFX?.click();
    moveToNext(r,c);
  }
}

function moveToPrev(r,c){
  if(!selectedClue)return;
  const cells=getWordCells(selectedClue);
  const idx=cells.findIndex(([cr,cc])=>cr===r&&cc===c);
  if(idx>0){
    const inp=getInput(cells[idx-1][0],cells[idx-1][1]);
    if(inp){inp.focus();inp.value='';inp.parentElement.classList.remove('error');}
  }
}

function moveToNextClue(){
  const allClues=[...clues.across,...clues.down];
  if(!allClues.length)return;
  const idx=selectedClue?allClues.findIndex(c=>c.num===selectedClue.num&&c.dir===selectedDir):-1;
  const next=allClues[(idx+1)%allClues.length];
  window.SFX?.select();
  selectClue(next,next.dir);
  const cells=getWordCells(next);
  const firstEmpty=cells.find(([r,c])=>{const i=getInput(r,c);return i&&!i.value;});
  const target=firstEmpty||cells[0];
  const inp=getInput(target[0],target[1]);
  if(inp)inp.focus();
}

function checkPuzzle(){
  if(solved)return;
  let allCorrect=true,anyError=false;
  const allClues=[...clues.across,...clues.down];
  allClues.forEach(cl=>{
    const cells=getWordCells(cl);
    let wordCorrect=true,wordFilled=true;
    cells.forEach(([r,c],i)=>{
      const inp=getInput(r,c);
      const cell=getCell(r,c);
      if(!inp)return;
      if(!inp.value){wordCorrect=false;wordFilled=false;return;}
      if(inp.value.toUpperCase()!==cl.word[i]){
        wordCorrect=false;
        cell.classList.add('error');
        anyError=true;
      } else {
        cell.classList.remove('error');
      }
    });
    if(wordCorrect&&wordFilled){
      cells.forEach(([r,c])=>{
        const cell=getCell(r,c);
        if(cell)cell.classList.add('correct-word');
      });
    }
    if(!wordCorrect)allCorrect=false;
  });

  if(anyError)window.SFX?.fail();
  else if(!allCorrect)window.SFX?.correct();

  if(allCorrect){
    winGame();
  }
}

function winGame(){
  solved=true;
  clearInterval(timerInterval);
  window.SFX?.win();
  const total=seconds+penalties;
  document.getElementById('msg').innerHTML=`<span class="win">Puzzle Complete! Time: ${formatTime(total)}${penalties?' (includes '+penalties+'s penalty)':''}</span>`;
  if(total>0)window.HallOfFame?.submit('crossword',total);
  // disable inputs
  document.querySelectorAll('.cell input').forEach(inp=>inp.disabled=true);
}

function revealWord(){
  if(solved||!selectedClue)return;
  penalties+=30;
  const cells=getWordCells(selectedClue);
  cells.forEach(([r,c],i)=>{
    const inp=getInput(r,c);
    const cell=getCell(r,c);
    if(inp){
      inp.value=selectedClue.word[i];
      cell.classList.remove('error');
      cell.classList.add('correct-word');
    }
  });
  // check if all filled
  let allDone=true;
  [...clues.across,...clues.down].forEach(cl=>{
    getWordCells(cl).forEach(([r,c],i)=>{
      const inp=getInput(r,c);
      if(!inp||inp.value.toUpperCase()!==cl.word[i])allDone=false;
    });
  });
  if(allDone)winGame();
}

function startTimer(){
  clearInterval(timerInterval);
  seconds=0;penalties=0;
  timerInterval=setInterval(()=>{
    if(!solved){seconds++;updateTimer();}
  },1000);
  updateTimer();
}

function updateTimer(){
  const total=seconds+penalties;
  document.getElementById('timer').innerHTML=formatTime(total)+(penalties?`<span class="penalty"> (+${penalties}s penalty)</span>`:'');
}

function formatTime(s){const m=Math.floor(s/60);const sec=s%60;return m+':'+(sec<10?'0':'')+sec;}

function newPuzzle(){
  solved=false;
  document.getElementById('msg').textContent='';
  generatePuzzle();
  renderGrid();
  renderClues();
  startTimer();
  // select first clue
  if(clues.across.length){
    selectClue(clues.across[0],'across');
    setTimeout(()=>{
      const cells=getWordCells(clues.across[0]);
      const inp=getInput(cells[0][0],cells[0][1]);
      if(inp)inp.focus();
    },100);
  }
}

// difficulty buttons
document.querySelectorAll('.diff-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    difficulty=btn.dataset.diff;
    newPuzzle();
  });
});

newPuzzle();
