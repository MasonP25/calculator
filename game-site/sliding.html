<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sliding Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 1rem;
  }
  .top-bar { display: flex; align-items: center; gap: 2rem; margin-bottom: 0.5rem; }
  .top-bar a { color: #7b2ff7; text-decoration: none; font-size: 0.9rem; }
  .top-bar a:hover { text-decoration: underline; }
  h1 { font-size: 2rem; }
  .size-select { display: flex; gap: 0.5rem; margin-bottom: 0.8rem; }
  .size-btn {
    background: #1a1a2e; border: 2px solid #2a2a4a; color: #e0e0e0;
    padding: 0.4rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem;
  }
  .size-btn:hover, .size-btn.active { border-color: #7b2ff7; }
  .info { display: flex; gap: 2rem; margin-bottom: 1rem; font-size: 1.1rem; }
  .info span { color: #00d4ff; font-weight: bold; }
  .board-wrapper {
    background: #1a1a2e;
    border-radius: 12px;
    padding: 10px;
    position: relative;
    border: 2px solid #2a2a4a;
  }
  .board {
    position: relative;
  }
  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .tile:hover {
    filter: brightness(1.15);
  }
  .tile.hint-glow {
    animation: hintPulse 0.8s ease-in-out infinite alternate;
    z-index: 5;
  }
  @keyframes hintPulse {
    from { box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 8px rgba(0,212,255,0.5); }
    to { box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 22px rgba(0,212,255,1), 0 0 40px rgba(0,212,255,0.3); }
  }
  .ghost-target {
    position: absolute;
    border: 3px dashed rgba(0,212,255,0.5);
    border-radius: 8px;
    pointer-events: none;
    z-index: 1;
    animation: ghostPulse 1.2s ease-in-out infinite alternate;
  }
  @keyframes ghostPulse {
    from { opacity: 0.3; }
    to { opacity: 0.7; }
  }
  .hint-msg {
    color: #00d4ff;
    font-size: 0.85rem;
    margin-top: 0.3rem;
    min-height: 1.2rem;
    text-align: center;
  }
  .msg { margin-top: 1rem; min-height: 1.5rem; font-size: 1.1rem; color: #00d4ff; }
  .buttons { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
  .btn {
    background: linear-gradient(135deg, #7b2ff7, #5b1fd7);
    color: white; border: none; padding: 0.5rem 1.5rem;
    border-radius: 8px; font-size: 0.9rem; cursor: pointer;
  }
  .btn:hover { opacity: 0.85; }
  .btn.secondary {
    background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
    border: 2px solid #2a2a4a;
  }
  .btn.secondary:hover { border-color: #7b2ff7; }
  .hint-text { color: #555; font-size: 0.75rem; margin-top: 0.5rem; }
  .win-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,15,26,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    z-index: 10;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  .win-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .win-overlay h2 {
    font-size: 2rem;
    color: #00d4ff;
    margin-bottom: 0.5rem;
  }
  .win-overlay p {
    font-size: 1.1rem;
    color: #e0e0e0;
  }
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html">&larr; Back</a>
  <h1>Sliding Puzzle</h1>
</div>
<div class="size-select">
  <button class="size-btn" data-size="3">3x3</button>
  <button class="size-btn active" data-size="4">4x4</button>
  <button class="size-btn" data-size="5">5x5</button>
</div>
<div class="info">
  Moves: <span id="moves">0</span> &nbsp;|&nbsp;
  Time: <span id="timer">0</span>s &nbsp;|&nbsp;
  Best: <span id="best">-</span>
</div>
<div class="board-wrapper">
  <div class="board" id="board"></div>
  <div class="win-overlay" id="winOverlay">
    <h2>Puzzle Solved!</h2>
    <p id="winStats"></p>
  </div>
</div>
<div class="msg" id="msg"></div>
<div class="hint-msg" id="hintMsg"></div>
<div class="buttons">
  <button class="btn" id="shuffleBtn">Shuffle</button>
  <button class="btn secondary" id="hintBtn">Hint</button>
</div>
<p class="hint-text">Click a tile adjacent to the empty space to slide it</p>

<script>
const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('msg');
const winOverlay = document.getElementById('winOverlay');
const winStats = document.getElementById('winStats');

let N = 4;
let board = [];       // flat array of length N*N, 0 = empty
let tileEls = {};     // map number -> DOM element
let moves = 0;
let timerVal = 0;
let timerInt = null;
let started = false;
let solved = false;
let hintTile = null;

// Tile sizing
const TILE_SIZES = { 3: 110, 4: 85, 5: 68 };
const GAP = 6;

function getTileSize() { return TILE_SIZES[N] || 85; }
function getBoardPx() { return N * getTileSize() + (N - 1) * GAP; }

// --- Color gradient for tiles based on number ---
function getTileColor(num) {
  const total = N * N - 1;
  const t = (num - 1) / Math.max(total - 1, 1); // 0..1
  let r, g, b;
  if (t < 0.33) {
    // cyan-ish
    const s = t / 0.33;
    r = Math.round(20 + s * 40);
    g = Math.round(180 + s * (-40));
    b = Math.round(220 + s * (-30));
  } else if (t < 0.66) {
    // purple-ish
    const s = (t - 0.33) / 0.33;
    r = Math.round(60 + s * 70);
    g = Math.round(140 - s * 100);
    b = Math.round(190 + s * 50);
  } else {
    // warm tint
    const s = (t - 0.66) / 0.34;
    r = Math.round(130 + s * 110);
    g = Math.round(40 + s * 40);
    b = Math.round(240 - s * 140);
  }
  return { r, g, b };
}

function tileBackground(num) {
  const c = getTileColor(num);
  const lighter = `rgba(${Math.min(c.r+40,255)},${Math.min(c.g+40,255)},${Math.min(c.b+40,255)},1)`;
  const darker = `rgba(${c.r},${c.g},${c.b},1)`;
  return `linear-gradient(135deg, ${lighter}, ${darker})`;
}

// --- Board logic ---
function goalState() {
  const arr = [];
  for (let i = 1; i < N * N; i++) arr.push(i);
  arr.push(0);
  return arr;
}

function isSolved() {
  const goal = goalState();
  for (let i = 0; i < board.length; i++) {
    if (board[i] !== goal[i]) return false;
  }
  return true;
}

function emptyIndex() {
  return board.indexOf(0);
}

function getRow(i) { return Math.floor(i / N); }
function getCol(i) { return i % N; }

function neighbors(i) {
  const r = getRow(i), c = getCol(i);
  const result = [];
  if (r > 0) result.push(i - N);
  if (r < N - 1) result.push(i + N);
  if (c > 0) result.push(i - 1);
  if (c < N - 1) result.push(i + 1);
  return result;
}

function canMove(tileIndex) {
  const ei = emptyIndex();
  return neighbors(ei).includes(tileIndex);
}

function swap(i, j) {
  [board[i], board[j]] = [board[j], board[i]];
}

// --- Solvability ---
function countInversions(arr) {
  let inv = 0;
  const nums = arr.filter(x => x !== 0);
  for (let i = 0; i < nums.length; i++) {
    for (let j = i + 1; j < nums.length; j++) {
      if (nums[i] > nums[j]) inv++;
    }
  }
  return inv;
}

function isSolvable(arr) {
  const inv = countInversions(arr);
  if (N % 2 === 1) {
    return inv % 2 === 0;
  } else {
    const emptyRow = getRow(arr.indexOf(0));
    const emptyFromBottom = N - 1 - emptyRow;
    return (inv + emptyFromBottom) % 2 === 0;
  }
}

function shuffle() {
  // Fisher-Yates then check solvability
  do {
    board = goalState();
    for (let i = board.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [board[i], board[j]] = [board[j], board[i]];
    }
  } while (!isSolvable(board) || isSolved());
}

// --- Timer ---
function startTimer() {
  if (timerInt) return;
  timerVal = 0;
  timerEl.textContent = '0';
  timerInt = setInterval(() => {
    timerVal++;
    timerEl.textContent = timerVal;
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInt);
  timerInt = null;
}

// --- Best time ---
function bestKey() { return `sliding_best_${N}`; }
function loadBest() {
  const v = localStorage.getItem(bestKey());
  bestEl.textContent = v ? v + 's' : '-';
  return v ? parseInt(v) : null;
}
function saveBest(time) {
  const prev = loadBest();
  if (prev === null || time < prev) {
    localStorage.setItem(bestKey(), time);
    bestEl.textContent = time + 's';
  }
}

// --- Render ---
function render() {
  const size = getTileSize();
  const bpx = getBoardPx();
  boardEl.style.width = bpx + 'px';
  boardEl.style.height = bpx + 'px';

  // Clear old tiles
  boardEl.innerHTML = '';
  tileEls = {};

  const fontSize = N <= 3 ? '1.8rem' : (N <= 4 ? '1.5rem' : '1.2rem');

  for (let i = 0; i < board.length; i++) {
    const num = board[i];
    if (num === 0) continue;

    const el = document.createElement('div');
    el.className = 'tile';
    el.textContent = num;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.fontSize = fontSize;
    el.style.background = tileBackground(num);
    el.style.color = '#fff';
    el.style.left = '0px';
    el.style.top = '0px';

    const col = getCol(i);
    const row = getRow(i);
    const tx = col * (size + GAP);
    const ty = row * (size + GAP);
    el.style.transform = `translate(${tx}px, ${ty}px)`;

    el.addEventListener('click', () => onTileClick(num));
    boardEl.appendChild(el);
    tileEls[num] = el;
  }
}

function updateTilePositions() {
  const size = getTileSize();
  for (let i = 0; i < board.length; i++) {
    const num = board[i];
    if (num === 0) continue;
    const el = tileEls[num];
    if (!el) continue;
    const col = getCol(i);
    const row = getRow(i);
    const tx = col * (size + GAP);
    const ty = row * (size + GAP);
    el.style.transform = `translate(${tx}px, ${ty}px)`;
  }
}

// --- Click handler ---
function onTileClick(num) {
  if (solved) return;

  const ti = board.indexOf(num);
  if (!canMove(ti)) return;

  // Clear hint
  clearHint();

  if (!started) {
    started = true;
    startTimer();
  }

  const ei = emptyIndex();
  swap(ti, ei);
  moves++;
  movesEl.textContent = moves;
  updateTilePositions();
  window.SFX?.slide();

  if (isSolved()) {
    onWin();
  }
}

function onWin() {
  solved = true;
  stopTimer();
  saveBest(timerVal);
  msgEl.textContent = '';
  winStats.textContent = `${moves} moves in ${timerVal}s`;
  winOverlay.classList.add('show');
  window.SFX?.win();
  window.HallOfFame?.submit('sliding', timerVal);
}

// --- Hint system: deeper lookahead with visual target ---
let ghostEl = null;
const hintMsgEl = document.getElementById('hintMsg');

function clearHint() {
  if (hintTile !== null && tileEls[hintTile]) {
    tileEls[hintTile].classList.remove('hint-glow');
  }
  hintTile = null;
  if (ghostEl) { ghostEl.remove(); ghostEl = null; }
  hintMsgEl.textContent = '';
}

function manhattanDistance(arr) {
  let dist = 0;
  for (let i = 0; i < arr.length; i++) {
    const num = arr[i];
    if (num === 0) continue;
    const goalIdx = num - 1;
    dist += Math.abs(getRow(i) - getRow(goalIdx)) + Math.abs(getCol(i) - getCol(goalIdx));
  }
  return dist;
}

function linearConflict(arr) {
  let conflict = 0;
  for (let r = 0; r < N; r++) {
    for (let c1 = 0; c1 < N; c1++) {
      const i1 = r * N + c1;
      const n1 = arr[i1];
      if (n1 === 0 || getRow(n1 - 1) !== r) continue;
      for (let c2 = c1 + 1; c2 < N; c2++) {
        const i2 = r * N + c2;
        const n2 = arr[i2];
        if (n2 === 0 || getRow(n2 - 1) !== r) continue;
        if (getCol(n1 - 1) > getCol(n2 - 1)) conflict++;
      }
    }
  }
  for (let c = 0; c < N; c++) {
    for (let r1 = 0; r1 < N; r1++) {
      const i1 = r1 * N + c;
      const n1 = arr[i1];
      if (n1 === 0 || getCol(n1 - 1) !== c) continue;
      for (let r2 = r1 + 1; r2 < N; r2++) {
        const i2 = r2 * N + c;
        const n2 = arr[i2];
        if (n2 === 0 || getCol(n2 - 1) !== c) continue;
        if (getRow(n1 - 1) > getRow(n2 - 1)) conflict++;
      }
    }
  }
  return conflict;
}

function heuristic(arr) {
  return manhattanDistance(arr) + 2 * linearConflict(arr);
}

// BFS with heuristic pruning - search up to maxDepth moves ahead
function findBestMove(maxDepth) {
  const ei = emptyIndex();
  const adj = neighbors(ei);
  let bestScore = Infinity;
  let bestTile = null;

  for (const ti of adj) {
    const num = board[ti];
    const testBoard = [...board];
    [testBoard[ti], testBoard[ei]] = [testBoard[ei], testBoard[ti]];

    // DFS with alpha-beta style pruning
    const score = deepSearch(testBoard, maxDepth - 1, ti, bestScore);
    if (score < bestScore) {
      bestScore = score;
      bestTile = num;
    }
  }
  return bestTile;
}

function deepSearch(arr, depth, lastMoved, bestSoFar) {
  const h = heuristic(arr);
  if (h === 0) return -1000 + (depth); // solved = best possible
  if (depth <= 0) return h;

  const ei = arr.indexOf(0);
  const adj = neighbors(ei);
  let best = h; // at minimum, current heuristic

  // Sort neighbors by heuristic to try best first
  const moves = [];
  for (const ti of adj) {
    if (ti === lastMoved) continue; // don't undo last move
    const test = [...arr];
    [test[ti], test[ei]] = [test[ei], test[ti]];
    moves.push({ ti, h: heuristic(test), board: test });
  }
  moves.sort((a, b) => a.h - b.h);

  for (const m of moves) {
    if (m.h >= bestSoFar) continue; // prune
    const score = deepSearch(m.board, depth - 1, ei, Math.min(best, bestSoFar));
    if (score < best) best = score;
  }
  return best;
}

function getMoveDirection(tileNum) {
  const ti = board.indexOf(tileNum);
  const ei = emptyIndex();
  const tr = getRow(ti), tc = getCol(ti);
  const er = getRow(ei), ec = getCol(ei);
  if (tr > er) return '↑ up';
  if (tr < er) return '↓ down';
  if (tc > ec) return '← left';
  return '→ right';
}

function showHint() {
  if (solved) return;
  clearHint();

  // Use deeper search for smaller boards
  const depth = N <= 3 ? 8 : (N <= 4 ? 5 : 3);
  const tile = findBestMove(depth);

  if (tile !== null && tileEls[tile]) {
    hintTile = tile;
    tileEls[tile].classList.add('hint-glow');

    // Show ghost at target position
    const goalIdx = tile - 1;
    const size = getTileSize();
    const gx = getCol(goalIdx) * (size + GAP);
    const gy = getRow(goalIdx) * (size + GAP);

    ghostEl = document.createElement('div');
    ghostEl.className = 'ghost-target';
    ghostEl.style.width = size + 'px';
    ghostEl.style.height = size + 'px';
    ghostEl.style.left = '0px';
    ghostEl.style.top = '0px';
    ghostEl.style.transform = `translate(${gx}px, ${gy}px)`;
    boardEl.appendChild(ghostEl);

    // Show text hint
    const dir = getMoveDirection(tile);
    hintMsgEl.textContent = `Move tile ${tile} ${dir}`;
  }
}

// --- Init ---
function init() {
  solved = false;
  started = false;
  moves = 0;
  movesEl.textContent = '0';
  stopTimer();
  timerVal = 0;
  timerEl.textContent = '0';
  clearHint();
  winOverlay.classList.remove('show');
  msgEl.textContent = '';
  loadBest();
  shuffle();
  render();
}

// --- Size selector ---
document.querySelectorAll('.size-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    window.SFX?.click();
    document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    N = parseInt(btn.dataset.size);
    init();
  });
});

// Shuffle button
document.getElementById('shuffleBtn').addEventListener('click', () => {
  window.SFX?.swoosh();
  init();
});

// Hint button
document.getElementById('hintBtn').addEventListener('click', () => {
  window.SFX?.click();
  showHint();
});

// Keyboard support: arrow keys move tiles into the empty space
document.addEventListener('keydown', (e) => {
  if (solved) return;
  const ei = emptyIndex();
  const er = getRow(ei), ec = getCol(ei);
  let ti = -1;

  switch (e.key) {
    case 'ArrowUp':    if (er < N - 1) ti = ei + N; break; // tile below empty moves up
    case 'ArrowDown':  if (er > 0)     ti = ei - N; break; // tile above empty moves down
    case 'ArrowLeft':  if (ec < N - 1) ti = ei + 1; break; // tile right of empty moves left
    case 'ArrowRight': if (ec > 0)     ti = ei - 1; break; // tile left of empty moves right
  }

  if (ti >= 0 && ti < N * N) {
    e.preventDefault();
    onTileClick(board[ti]);
  }
});

// Start
init();
</script>

<script src="sound.js"></script>
<script src="fame.js"></script>
<script type="module" src="firebase-lb.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
</body>
</html>
