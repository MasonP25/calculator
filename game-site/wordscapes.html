*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f0f1a;color:#e0e0e0;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:1rem 1rem 2rem;user-select:none;overflow-x:hidden}

.info-bar{display:flex;align-items:center;gap:1rem;margin-bottom:.4rem;flex-wrap:wrap;justify-content:center}
.info-pill{background:#1a1a2e;border:1px solid #2a2a4a;border-radius:20px;padding:4px 14px;font-size:.85rem;color:#aaa}

.info-pill.accent{border-color:#7b2ff7;color:#ccc}
.hint-btn{background:linear-gradient(135deg,#7b2ff7,#5b1fd7);border:none;color:#fff;padding:6px 16px;border-radius:20px;font-size:.85rem;cursor:pointer;transition:transform .15s,box-shadow .15s}
.hint-btn:hover{transform:scale(1.05);box-shadow:0 0 12px rgba(123,47,247,.5)}
.hint-btn:active{transform:scale(.97)}
.crossword-wrap{position:relative;margin:.3rem 0 .5rem}
.crossword{display:grid;gap:3px}
.cw-cell{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:700;text-transform:uppercase;border-radius:6px;transition:background .3s,transform .3s,color .3s}
.cw-cell.empty{background:transparent}
.cw-cell.hidden{background:#1a1a2e;border:2px solid #2a2a4a;color:transparent}
.cw-cell.revealed{background:linear-gradient(135deg,#7b2ff7,#5b1fd7);border:2px solid #9b5ff9;color:#fff;animation:cellPop .4s ease both}
.cw-cell.hint-revealed{background:linear-gradient(135deg,#feca57,#f0a030);border:2px solid #ffe080;color:#1a1a2e;animation:cellPop .4s ease both}
@keyframes cellPop{0%{transform:scale(.2) rotateY(90deg);opacity:0}60%{transform:scale(1.15) rotateY(0);opacity:1}100%{transform:scale(1) rotateY(0);opacity:1}}
.current-word{height:2.2rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#00d4ff;margin-bottom:.1rem;text-shadow:0 0 10px rgba(0,212,255,.3);min-width:80px}
.circle-area{position:relative;width:260px;height:260px;margin:0 auto}
.circle-area canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.letter-node{position:absolute;width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;text-transform:uppercase;background:#1a1a2e;border:3px solid #2a2a4a;border-radius:50%;cursor:pointer;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s;z-index:2}
.letter-node:hover{border-color:#7b2ff7}
.letter-node.selected{background:#7b2ff7;border-color:#9b5ff9;color:#fff;transform:scale(1.12);box-shadow:0 0 16px rgba(123,47,247,.5)}
.shuffle-btn{position:absolute;width:44px;height:44px;top:50%;left:50%;transform:translate(-50%,-50%);background:#1a1a2e;border:2px solid #2a2a4a;border-radius:50%;color:#888;font-size:1.3rem;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s,transform .3s}

.nav-row{display:flex;gap:.8rem;margin-top:.4rem}

.nav-btn:hover:not(:disabled){border-color:#7b2ff7;color:#e0e0e0}
.nav-btn:disabled{opacity:.3;cursor:default}

// Lv25 CASTER 6L backbone
{L:"CASTER",W:[{w:"CASTER",r:0,c:0,d:1},{w:"CARE",r:0,c:0,d:0},{w:"ARCS",r:1,c:0,d:0},{w:"STAR",r:2,c:0,d:0},{w:"TEAR",r:3,c:0,d:0},{w:"EARS",r:4,c:0,d:0},{w:"REST",r:5,c:0,d:0}],R:6,C:4},

{L:"STREAM",W:[{w:"STREAM",r:0,c:0,d:1},{w:"STEM",r:0,c:0,d:0},{w:"TRAM",r:1,c:0,d:0},{w:"REAM",r:2,c:0,d:0},{w:"EARS",r:3,c:0,d:0},{w:"ARMS",r:4,c:0,d:0},{w:"MAST",r:5,c:0,d:0}],R:6,C:4},
// Lv27 LISTEN 6L backbone
{L:"LISTEN",W:[{w:"LISTEN",r:0,c:0,d:1},{w:"LINT",r:0,c:0,d:0},{w:"SITE",r:2,c:0,d:0},{w:"TINS",r:3,c:0,d:0},{w:"NEST",r:5,c:0,d:0}],R:6,C:4},
// Lv28 PIANOS 6L backbone
{L:"PIANOS",W:[{w:"PIANOS",r:0,c:0,d:1},{w:"PIN",r:0,c:0,d:0},{w:"ION",r:1,c:0,d:0},{w:"NAP",r:3,c:0,d:0},{w:"SNAP",r:5,c:0,d:0}],R:6,C:4},
// Lv29 DRIFTS 6L backbone
{L:"DRIFTS",W:[{w:"DRIFTS",r:0,c:0,d:1},{w:"DIRT",r:0,c:0,d:0},{w:"RID",r:1,c:0,d:0},{w:"IFS",r:2,c:0,d:0},{w:"FIST",r:3,c:0,d:0},{w:"SIR",r:5,c:0,d:0}],R:6,C:4},
// Lv30 TRAVELS 7L backbone
{L:"TRAVELS",W:[{w:"TRAVELS",r:0,c:0,d:1},{w:"TEAR",r:0,c:0,d:0},{w:"RAVE",r:1,c:0,d:0},{w:"ARTS",r:2,c:0,d:0},{w:"VALE",r:3,c:0,d:0},{w:"EARS",r:4,c:0,d:0},{w:"LAST",r:5,c:0,d:0},{w:"STAR",r:6,c:0,d:0}],R:7,C:4},
// Lv31 WONDERS 7L backbone
{L:"WONDERS",W:[{w:"WONDERS",r:0,c:0,d:1},{w:"WORN",r:0,c:0,d:0},{w:"OWN",r:1,c:0,d:0},{w:"NOR",r:2,c:0,d:0},{w:"DOSE",r:3,c:0,d:0},{w:"EROS",r:4,c:0,d:0},{w:"ROWS",r:5,c:0,d:0},{w:"SORE",r:6,c:0,d:0}],R:7,C:4},
// Lv32 DANGERS 7L backbone
{L:"DANGERS",W:[{w:"DANGERS",r:0,c:0,d:1},{w:"DRAG",r:0,c:0,d:0},{w:"AND",r:1,c:0,d:0},{w:"NAG",r:2,c:0,d:0},{w:"GRADE",r:3,c:0,d:0},{w:"EARS",r:4,c:0,d:0},{w:"RANG",r:5,c:0,d:0},{w:"SAND",r:6,c:0,d:0}],R:7,C:5}
];

// Add all level words to valid words
LEVELS.forEach(lv=>lv.W.forEach(w=>VALID_WORDS.add(w.w.toLowerCase())));

/* ========== GAME STATE ========== */
let curLv=0, foundWords=new Set(), bonusWords=new Set(), bonusCt=0, hints=3, score=0;
let grid=[], lvWords=[], letterOrder=[], selIdx=[], dragging=false;

const $=id=>document.getElementById(id);
const cwEl=$('cw'), curWordEl=$('curWord'), circleEl=$('circleArea');
const lineCanvas=$('lineCanvas'), ctx=lineCanvas.getContext('2d');
const msgEl=$('msgArea'), overlay=$('overlay'), overlayMsg=$('overlayMsg');

/* ========== INIT ========== */
function init(){
  curLv=parseInt(_gb('ws_level','0'));
  bonusCt=parseInt(_gb('ws_bonus','0'));
  hints=parseInt(_gb('ws_hints','3'));
  score=parseInt(_gb('ws_score','0'));
  $('lvlTotal').textContent=LEVELS.length;
  if(curLv>=LEVELS.length) curLv=LEVELS.length-1;
  loadLevel(curLv);
}

function loadLevel(n){
  curLv=Math.max(0,Math.min(n,LEVELS.length-1));
  const lv=LEVELS[curLv];
  lvWords=lv.W;
  foundWords=new Set();
  selIdx=[];dragging=false;

  const saved=_gb('ws_found_'+curLv,'');
  if(saved) saved.split(',').forEach(w=>{if(w)foundWords.add(w)});

  $('lvlNum').textContent=curLv+1;
  $('bonusCt').textContent=bonusCt;
  $('hintCt').textContent=hints;

  buildGrid(lv);
  buildWordTags();
  buildCircle(lv.L);
  updateNav();
  drawLines();
  curWordEl.innerHTML='&nbsp;';
}

/* ========== GRID ========== */
function buildGrid(lv){
  grid=[];
  for(let r=0;r<lv.R;r++){grid[r]=[];for(let c=0;c<lv.C;c++) grid[r][c]={ch:'',rev:false,hint:false,wi:[]};}
  lvWords.forEach((w,wi)=>{
    for(let i=0;i<w.w.length;i++){
      const r=w.d?w.r+i:w.r, c=w.d?w.c:w.c+i;
      if(r<lv.R&&c<lv.C){grid[r][c].ch=w.w[i];grid[r][c].wi.push(wi);}
    }
  });
  cwEl.style.gridTemplateColumns=`repeat(${lv.C},36px)`;
  cwEl.innerHTML='';
  for(let r=0;r<lv.R;r++) for(let c=0;c<lv.C;c++){
    const d=document.createElement('div');
    d.className='cw-cell';
    if(!grid[r][c].ch) d.classList.add('empty');
    else{d.classList.add('hidden');d.textContent=grid[r][c].ch;}
    cwEl.appendChild(d);
  }
  revealAllFound();
}

function revealAllFound(){foundWords.forEach(w=>{const i=lvWords.findIndex(x=>x.w===w);if(i>=0)revealWord(i,false)});}

function revealWord(wi,anim){
  const w=lvWords[wi],lv=LEVELS[curLv];
  for(let i=0;i<w.w.length;i++){
    const r=w.d?w.r+i:w.r, c=w.d?w.c:w.c+i;
    if(r>=lv.R||c>=lv.C) continue;
    grid[r][c].rev=true;
    const el=cwEl.children[r*lv.C+c];
    if(el&&!el.classList.contains('revealed')&&!el.classList.contains('hint-revealed')){
      el.classList.remove('hidden');el.classList.add('revealed');
      if(anim) el.style.animationDelay=(i*.1)+'s';
    }
  }
}

function buildWordTags(){
  const t=$('wordTags');t.innerHTML='';
  lvWords.forEach(w=>{
    const s=document.createElement('span');
    s.className='word-tag'+(foundWords.has(w.w)?' found':'');
    s.textContent=foundWords.has(w.w)?w.w:w.w.replace(/./g,'_');
    s.dataset.word=w.w;
    t.appendChild(s);
  });
}

/* ========== CIRCLE ========== */
function buildCircle(letters){
  circleEl.querySelectorAll('.letter-node').forEach(n=>n.remove());
  letterOrder=[...letters];
  shuffle(letterOrder);
  const cx=130,cy=130,rad=90,n=letterOrder.length;
  letterOrder.forEach((ch,i)=>{
    const a=2*Math.PI*i/n-Math.PI/2;
    const nd=document.createElement('div');
    nd.className='letter-node';nd.textContent=ch;
    nd.style.left=(cx+rad*Math.cos(a)-26)+'px';
    nd.style.top=(cy+rad*Math.sin(a)-26)+'px';
    nd.dataset.idx=i;
    nd.addEventListener('mousedown',e=>{e.preventDefault();startSel(i)});
    nd.addEventListener('mouseenter',()=>{if(dragging)addSel(i)});
    nd.addEventListener('mouseup',()=>endSel());
    nd.addEventListener('touchstart',e=>{e.preventDefault();startSel(i)},{passive:false});
    nd.addEventListener('touchend',e=>{e.preventDefault();endSel()});
    circleEl.appendChild(nd);
  });
  resizeCanvas();
}

// touch move
circleEl.addEventListener('touchmove',e=>{
  if(!dragging)return;e.preventDefault();
  const t=e.touches[0],el=document.elementFromPoint(t.clientX,t.clientY);
  if(el&&el.classList.contains('letter-node'))addSel(+el.dataset.idx);
},{passive:false});
document.addEventListener('mouseup',()=>{if(dragging)endSel()});

function startSel(i){dragging=true;selIdx=[i];updSel();window.SFX?.click();}
function addSel(i){
  if(!dragging)return;
  if(selIdx[selIdx.length-1]===i)return;
  if(selIdx.length>=2&&selIdx[selIdx.length-2]===i){selIdx.pop();updSel();window.SFX?.click();return;}
  if(selIdx.includes(i))return;
  selIdx.push(i);updSel();window.SFX?.click();
}
function endSel(){if(!dragging)return;dragging=false;submitWord();}

function updSel(){
  const nodes=circleEl.querySelectorAll('.letter-node');
  nodes.forEach((n,i)=>n.classList.toggle('selected',selIdx.includes(i)));
  curWordEl.textContent=selIdx.map(i=>letterOrder[i]).join('')||'\u00a0';
  drawLines();
}

function drawLines(){
  const dpr=window.devicePixelRatio||1;
  lineCanvas.width=circleEl.offsetWidth*dpr;lineCanvas.height=circleEl.offsetHeight*dpr;
  lineCanvas.style.width=circleEl.offsetWidth+'px';lineCanvas.style.height=circleEl.offsetHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,lineCanvas.width,lineCanvas.height);
  if(selIdx.length<2)return;
  const nodes=circleEl.querySelectorAll('.letter-node');
  // glow
  ctx.strokeStyle='rgba(0,212,255,.3)';ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();
  selIdx.forEach((si,i)=>{const n=nodes[si],x=n.offsetLeft+26,y=n.offsetTop+26;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
  // line
  ctx.strokeStyle='rgba(123,47,247,.7)';ctx.lineWidth=4;
  ctx.beginPath();
  selIdx.forEach((si,i)=>{const n=nodes[si],x=n.offsetLeft+26,y=n.offsetTop+26;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});
  ctx.stroke();
}

function resizeCanvas(){
  const dpr=window.devicePixelRatio||1;
  lineCanvas.width=circleEl.offsetWidth*dpr;lineCanvas.height=circleEl.offsetHeight*dpr;
  lineCanvas.style.width=circleEl.offsetWidth+'px';lineCanvas.style.height=circleEl.offsetHeight+'px';
}

/* ========== SUBMIT ========== */
function submitWord(){
  const word=selIdx.map(i=>letterOrder[i]).join('');
  selIdx=[];updSel();
  if(word.length<3){if(word.length>0)showMsg('Too short!');return;}
  const up=word.toUpperCase();
  // puzzle word?
  const wi=lvWords.findIndex(x=>x.w===up);
  if(wi>=0){
    if(foundWords.has(up)){showMsg('Already found!');window.SFX?.wrong();shake();return;}
    foundWords.add(up);revealWord(wi,true);window.SFX?.coin();
    showMsg('Nice! +'+up.length*10);score+=up.length*10;
    _sb('ws_score',score);saveProg();buildWordTags();
    if(foundWords.size>=lvWords.length) setTimeout(lvComplete,600);
    return;
  }
  // bonus?
  if(VALID_WORDS.has(word.toLowerCase())&&!bonusWords.has(up)){
    bonusWords.add(up);bonusCt++;$('bonusCt').textContent=bonusCt;_sb('ws_bonus',bonusCt);
    window.SFX?.powerup();showMsg('Bonus word!');score+=5;_sb('ws_score',score);
    if(bonusCt%3===0){hints++;$('hintCt').textContent=hints;_sb('ws_hints',hints);showMsg('Bonus hint earned!');}
    return;
  }
  if(bonusWords.has(up)){showMsg('Already found!');window.SFX?.wrong();return;}
  window.SFX?.wrong();showMsg('Not a word');shake();
}

function saveProg(){
  _sb('ws_found_'+curLv,[...foundWords].join(','));
  _sb('ws_level',Math.max(curLv,parseInt(_gb('ws_level','0'))));
}

function lvComplete(){
  window.SFX?.win();
  _sb('ws_level',Math.max(curLv+1,parseInt(_gb('ws_level','0'))));
  if(window.HallOfFame) window.HallOfFame.submit('wordscapes', curLv + 1);
  overlayMsg.textContent='You found all '+lvWords.length+' words! Score: '+score;
  overlay.classList.add('show');burstStars();
}

function showMsg(t){msgEl.innerHTML='<span class="msg">'+t+'</span>';}
function shake(){curWordEl.classList.add('shake');setTimeout(()=>curWordEl.classList.remove('shake'),500);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}}

function burstStars(){
  const b=document.createElement('div');b.className='star-burst';b.style.left='50%';b.style.top='40%';
  for(let i=0;i<20;i++){
    const s=document.createElement('span');s.className='star';
    s.textContent=['\u2B50','\u2728','\uD83C\uDF1F','\uD83D\uDCAB'][Math.random()*4|0];
    const ang=Math.random()*Math.PI*2,dist=60+Math.random()*120;
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.animationDelay=Math.random()*.3+'s';b.appendChild(s);
  }
  document.body.appendChild(b);setTimeout(()=>b.remove(),2000);
}

/* ========== HINTS ========== */
$('hintBtn').addEventListener('click',()=>{
  if(hints<=0)return;
  const lv=LEVELS[curLv];
  for(let wi=0;wi<lvWords.length;wi++){
    const w=lvWords[wi];if(foundWords.has(w.w))continue;
    for(let i=0;i<w.w.length;i++){
      const r=w.d?w.r+i:w.r, c=w.d?w.c:w.c+i;
      if(r<lv.R&&c<lv.C&&!grid[r][c].rev&&!grid[r][c].hint){
        grid[r][c].hint=true;grid[r][c].rev=true;
        const el=cwEl.children[r*lv.C+c];
        if(el){el.classList.remove('hidden');el.classList.add('hint-revealed');}
        hints--;$('hintCt').textContent=hints;_sb('ws_hints',hints);
        window.SFX?.click();return;
      }
    }
  }
});

/* ========== KEYBOARD ========== */
document.addEventListener('keydown',e=>{
  if(overlay.classList.contains('show')){if(e.key==='Enter')goNext();return;}
  const k=e.key.toUpperCase();
  if(k==='ENTER'){submitWord();return;}
  if(k==='BACKSPACE'){if(selIdx.length)selIdx.pop();updSel();return;}
  if(k==='ESCAPE'){selIdx=[];updSel();return;}
  if(/^[A-Z]$/.test(k)){
    for(let i=0;i<letterOrder.length;i++){
      if(letterOrder[i]===k&&!selIdx.includes(i)){selIdx.push(i);updSel();window.SFX?.click();break;}
    }
  }
});

/* ========== NAV ========== */
function goNext(){overlay.classList.remove('show');if(curLv<LEVELS.length-1)loadLevel(curLv+1);}
function updateNav(){
  $('prevBtn').disabled=curLv<=0;
  const mx=parseInt(_gb('ws_level','0'));
  $('nextBtn').disabled=curLv>=Math.min(mx,LEVELS.length-1);
}
$('prevBtn').addEventListener('click',()=>{if(curLv>0)loadLevel(curLv-1)});
$('nextBtn').addEventListener('click',()=>{const mx=parseInt(_gb('ws_level','0'));if(curLv<Math.min(mx,LEVELS.length-1))loadLevel(curLv+1)});
$('nextLvlBtn').addEventListener('click',goNext);

$('shuffleBtn').addEventListener('click',()=>{
  shuffle(letterOrder);
  circleEl.querySelectorAll('.letter-node').forEach((n,i)=>n.textContent=letterOrder[i]);
  selIdx=[];updSel();
});

init();
</script>
