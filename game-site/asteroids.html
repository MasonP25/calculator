<h1>Asteroids</h1>
<div class="info">
  Score: <span id="score">0</span>
  Lives: <span id="lives">3</span>
</div>
<canvas id="c" width="600" height="500"></canvas>
<div class="msg" id="msg">Press SPACE to start</div>
<div class="controls">Arrows: Rotate/Thrust &nbsp;|&nbsp; SPACE: Shoot</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const msgEl = document.getElementById('msg');
const W = canvas.width, H = canvas.height;

let ship, asteroids, bullets, particles, score, lives, playing, gameOver, keys, invincible, invTimer;

function init() {
  ship = { x: W/2, y: H/2, angle: -Math.PI/2, vx: 0, vy: 0, thrust: false };
  asteroids = [];
  bullets = [];
  particles = [];
  score = 0; lives = 3;
  playing = false; gameOver = false;
  invincible = false; invTimer = 0;
  keys = {};
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '3';
  spawnWave();
  msgEl.textContent = 'Press SPACE to start';
}

function spawnWave() {
  const count = Math.min(2 + Math.floor(score / 1000), 5);
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (Math.hypot(x - ship.x, y - ship.y) < 150);
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 0.8;
    asteroids.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: 3, // 3=large, 2=medium, 1=small
      radius: 35,
      spin: (Math.random() - 0.5) * 0.03,
      angle: Math.random() * Math.PI * 2,
      shape: genShape()
    });
  }
}

function genShape() {
  const verts = 8 + Math.floor(Math.random() * 5);
  const shape = [];
  for (let i = 0; i < verts; i++) {
    const a = (i / verts) * Math.PI * 2;
    const r = 0.7 + Math.random() * 0.3;
    shape.push({ a, r });
  }
  return shape;
}

function wrap(obj) {
  if (obj.x < -50) obj.x = W + 50;
  if (obj.x > W + 50) obj.x = -50;
  if (obj.y < -50) obj.y = H + 50;
  if (obj.y > H + 50) obj.y = -50;
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 20 + Math.random() * 20,
      color
    });
  }
}

let shootCooldown = 0;

function update() {
  if (!playing || gameOver) return;

  // Ship controls
  if (keys['ArrowLeft']) ship.angle -= 0.07;
  if (keys['ArrowRight']) ship.angle += 0.07;
  if (keys['ArrowUp']) {
    ship.vx += Math.cos(ship.angle) * 0.12;
    ship.vy += Math.sin(ship.angle) * 0.12;
    ship.thrust = true;
  } else {
    ship.thrust = false;
  }

  // Friction
  ship.vx *= 0.995;
  ship.vy *= 0.995;
  const maxSpeed = 6;
  const sp = Math.hypot(ship.vx, ship.vy);
  if (sp > maxSpeed) { ship.vx *= maxSpeed/sp; ship.vy *= maxSpeed/sp; }

  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);

  // Shooting
  if (shootCooldown > 0) shootCooldown--;
  if (keys[' '] && shootCooldown <= 0) {
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * 18,
      y: ship.y + Math.sin(ship.angle) * 18,
      vx: Math.cos(ship.angle) * 7 + ship.vx * 0.3,
      vy: Math.sin(ship.angle) * 7 + ship.vy * 0.3,
      life: 55
    });
    shootCooldown = 10;
    if (window.SFX) window.SFX.shoot();
  }

  // Invincibility timer
  if (invincible) {
    invTimer--;
    if (invTimer <= 0) invincible = false;
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    wrap(b);
    if (b.life <= 0) { bullets.splice(i, 1); continue; }

    // Hit asteroids
    for (let j = asteroids.length - 1; j >= 0; j--) {
      const a = asteroids[j];
      if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
        bullets.splice(i, 1);
        // Split asteroid
        const points = [0, 25, 50, 100][a.size];
        score += points;
        document.getElementById('score').textContent = score;
        spawnParticles(a.x, a.y, '#aaa', 8);
        if (window.SFX) window.SFX.explosion();

        if (a.size > 1) {
          for (let k = 0; k < 2; k++) {
            const na = Math.random() * Math.PI * 2;
            const ns = 0.6 + Math.random() * 0.8;
            asteroids.push({
              x: a.x, y: a.y,
              vx: Math.cos(na) * ns,
              vy: Math.sin(na) * ns,
              size: a.size - 1,
              radius: a.radius * 0.55,
              spin: (Math.random() - 0.5) * 0.05,
              angle: Math.random() * Math.PI * 2,
              shape: genShape()
            });
          }
        }
        asteroids.splice(j, 1);
        break;
      }
    }
  }

  // Update asteroids
  for (const a of asteroids) {
    a.x += a.vx; a.y += a.vy;
    a.angle += a.spin;
    wrap(a);

    // Hit ship
    if (!invincible && Math.hypot(a.x - ship.x, a.y - ship.y) < a.radius + 10) {
      lives--;
      document.getElementById('lives').textContent = lives;
      spawnParticles(ship.x, ship.y, '#00d4ff', 20);
      if (window.SFX) window.SFX.death();
      if (lives <= 0) {
        gameOver = true;
        if (score > 0 && window.HallOfFame) window.HallOfFame.submit('asteroids', score);
        msgEl.textContent = 'Game Over! Score: ' + score + '. Press SPACE to restart.';
        return;
      }
      // Reset ship
      ship.x = W/2; ship.y = H/2; ship.vx = 0; ship.vy = 0;
      invincible = true; invTimer = 120;
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life--;
    p.vx *= 0.97; p.vy *= 0.97;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // New wave
  if (asteroids.length === 0) spawnWave();
}

function draw() {
  ctx.fillStyle = '#0a0a15';
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#ffffff10';
  for (let i = 0; i < 80; i++) {
    ctx.fillRect((i * 137.5) % W, (i * 97.3) % H, 1.5, 1.5);
  }

  // Asteroids
  for (const a of asteroids) {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i < a.shape.length; i++) {
      const v = a.shape[i];
      const x = Math.cos(v.a) * v.r * a.radius;
      const y = Math.sin(v.a) * v.r * a.radius;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  }

  // Bullets
  ctx.fillStyle = '#fff';
  for (const b of bullets) {
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // Particles
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 40;
    ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  }
  ctx.globalAlpha = 1;

  // Ship
  if (!gameOver) {
    // Blink when invincible
    if (invincible && Math.floor(invTimer / 4) % 2 === 0) {
      // skip drawing
    } else {
      ctx.save();
      ctx.translate(ship.x, ship.y);
      ctx.rotate(ship.angle);
      ctx.strokeStyle = '#00d4ff';
      ctx.shadowColor = '#00d4ff';
      ctx.shadowBlur = 8;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(18, 0);
      ctx.lineTo(-12, -10);
      ctx.lineTo(-7, 0);
      ctx.lineTo(-12, 10);
      ctx.closePath();
      ctx.stroke();

      // Thrust flame
      if (ship.thrust) {
        ctx.strokeStyle = '#ff9f43';
        ctx.shadowColor = '#ff9f43';
        ctx.beginPath();
        ctx.moveTo(-8, -5);
        ctx.lineTo(-18 - Math.random() * 8, 0);
        ctx.lineTo(-8, 5);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  if (gameOver) {
    var T=window.TC||{};
    ctx.fillStyle = T.overlay?T.overlay(0.65):'rgba(15,15,26,0.65)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ff4757';
    ctx.font = 'bold 36px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W/2, H/2 - 10);
    ctx.fillStyle = T.dim||'#888';
    ctx.font = '18px Segoe UI';
    ctx.fillText('Score: ' + score, W/2, H/2 + 25);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === ' ') {
    if (gameOver) { init(); return; }
    if (!playing) { playing = true; msgEl.textContent = ''; }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

init();
loop();
</script>
