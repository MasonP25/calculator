<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
}

a.back { position: fixed; top: 12px; left: 16px; color: #888; text-decoration: none; font-size: 0.85rem; z-index: 100; transition: color 0.2s; }
a.back:hover { color: #e0e0e0; }

h1 {
    text-align: center;
    padding: 20px 0 5px;
    font-size: 2rem;
    background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
    letter-spacing: 4px;
}

/* Lobby Styles */
.lobby-container {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.online-panel {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    text-align: center;
}

.online-panel h3 {
    margin-bottom: 15px;
    color: #e0e0e0;
    font-size: 1rem;
}

.online-lobby-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.online-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}
.online-btn:hover { background: #6a22e0; }
.online-btn:active { transform: scale(0.97); }
.online-btn.secondary { background: #2a2a4a; }
.online-btn.secondary:hover { background: #3a3a5a; }
.online-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.room-code-display {
    font-size: 2.5rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 8px;
    margin: 15px 0;
    font-family: monospace;
}

.waiting-msg {
    color: #888;
    font-size: 0.9rem;
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.join-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.join-input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    color: #feca57;
    font-size: 1.8rem;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 6px;
    text-align: center;
    padding: 8px 16px;
    border-radius: 8px;
    width: 160px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.25s;
}
.join-input:focus { border-color: #7b2ff7; }
.join-input::placeholder { color: #444; letter-spacing: 2px; font-size: 1rem; }

.join-error { color: #ff4757; font-size: 0.85rem; }

.leave-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
}
.leave-btn:hover { background: #ff475722; }

.player-list {
    width: 100%;
    margin: 10px 0;
}

.player-list-item {
    background: #0f0f1a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 8px 14px;
    margin: 4px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
}

.player-list-item .host-badge {
    background: #feca57;
    color: #0f0f1a;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
}

/* Toast */
.toast-container {
    position: fixed;
    top: 60px;
    right: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.toast {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    color: #e0e0e0;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(0);
}

/* Game Container */
.game-container {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 20px;
}

/* Info Bar */
.info-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 10px 20px;
    background: #1a1a2e;
    border-bottom: 2px solid #2a2a4a;
    flex-wrap: wrap;
}

.info-bar .room-label {
    color: #feca57;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 3px;
    font-size: 0.9rem;
}

.info-bar .leave-game-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.info-bar .leave-game-btn:hover { background: #ff475722; }

/* Player Scoreboard */
.player-scoreboard {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    flex-wrap: wrap;
}

.player-chip {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.3s;
}

.player-chip .chip-name {
    color: #e0e0e0;
}

.player-chip .chip-score {
    color: #feca57;
    font-weight: 800;
}

.player-chip.is-psychic {
    border-color: #7b2ff7;
    background: #7b2ff722;
    box-shadow: 0 0 10px rgba(123, 47, 247, 0.3);
}

.player-chip.is-psychic .chip-name {
    color: #c4a0ff;
}

.round-info {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    padding: 4px 0;
}

/* Dial Area */
.dial-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 10px;
}

.dial-wrapper {
    position: relative;
    width: 420px;
    height: 230px;
    margin: 0 auto;
}

.dial-canvas {
    width: 420px;
    height: 230px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
}

.spectrum-labels {
    display: flex;
    justify-content: space-between;
    width: 420px;
    margin: 8px auto 0;
    padding: 0 10px;
}

.spectrum-labels .spec-label {
    font-size: 1rem;
    font-weight: 700;
    max-width: 180px;
    text-align: center;
}

.spectrum-labels .spec-left { color: #ff6b6b; }
.spectrum-labels .spec-right { color: #54a0ff; }

/* Clue Display */
.clue-display {
    text-align: center;
    padding: 12px 20px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.clue-display .clue-label {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 4px;
}

.clue-display .clue-text {
    font-size: 1.6rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 1px;
}

/* Action Area */
.action-area {
    text-align: center;
    padding: 10px 20px 20px;
    min-height: 80px;
}

.phase-msg {
    font-size: 1rem;
    font-weight: 600;
    color: #7b2ff7;
    margin-bottom: 10px;
}

.clue-input-area {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
}

.clue-input {
    background: #0f0f1a;
    border: 2px solid #7b2ff7;
    color: #feca57;
    font-size: 1.2rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    text-align: center;
    padding: 10px 20px;
    border-radius: 8px;
    width: 260px;
    outline: none;
    transition: border-color 0.2s;
}
.clue-input:focus { border-color: #feca57; }
.clue-input::placeholder { color: #555; }

.action-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}
.action-btn:hover { background: #6a22e0; }
.action-btn:active { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Score Popup */
.score-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #1a1a2e;
    border: 3px solid #7b2ff7;
    border-radius: 16px;
    padding: 30px 50px;
    text-align: center;
    z-index: 150;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.score-popup.visible { transform: translate(-50%, -50%) scale(1); }
.score-popup .sp-points {
    font-size: 3rem;
    font-weight: 800;
    color: #feca57;
}
.score-popup .sp-label {
    font-size: 1rem;
    color: #888;
    margin-top: 4px;
}
.score-popup .sp-psychic {
    font-size: 0.9rem;
    color: #7b2ff7;
    margin-top: 8px;
}

/* Winner Overlay */
.winner-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 180;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
}

.winner-overlay.visible { display: flex; }

.winner-overlay h2 {
    font-size: 2rem;
    background: linear-gradient(135deg, #feca57, #ff4757);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.winner-overlay p { color: #888; font-size: 1rem; }

.winner-scoreboard {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 16px 24px;
    min-width: 260px;
}

.winner-scoreboard .ws-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 1rem;
    border-bottom: 1px solid #2a2a4a;
}

.winner-scoreboard .ws-row:last-child {
    border-bottom: none;
}

.winner-scoreboard .ws-row.ws-winner {
    color: #feca57;
    font-weight: 700;
}

.winner-scoreboard .ws-row .ws-name {
    margin-right: 20px;
}

.winner-scoreboard .ws-row .ws-pts {
    font-weight: 800;
    color: #7b2ff7;
}

.winner-scoreboard .ws-row.ws-winner .ws-pts {
    color: #feca57;
}

/* Chat Sidebar */
#chat-toggle{position:fixed;bottom:120px;right:16px;width:50px;height:50px;border-radius:50%;background:#7b2ff7;border:none;color:#fff;font-size:1.5rem;cursor:pointer;z-index:9999;box-shadow:0 2px 12px rgba(123,47,247,0.4);transition:transform 0.2s;display:none;}
#chat-toggle:hover{transform:scale(1.1);}
#chat-badge{position:absolute;top:-4px;right:-4px;background:#ff4757;color:#fff;font-size:0.7rem;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:none;align-items:center;justify-content:center;padding:0 4px;}
#chat-panel{position:fixed;top:0;right:-320px;width:300px;height:100%;background:#1a1a2e;border-left:2px solid #2a2a4a;z-index:10000;display:flex;flex-direction:column;transition:right 0.3s;}
#chat-panel.open{right:0;}
#chat-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:2px solid #2a2a4a;}
#chat-header span{font-weight:700;color:#e0e0e0;font-size:1rem;}
#chat-close{background:#2a2a4a;border:none;color:#e0e0e0;font-size:1.1rem;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .2s}
#chat-close:hover{background:#3a3a5a;color:#fff}
#chat-messages{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px;scrollbar-width:thin;scrollbar-color:#2a2a4a #1a1a2e;}
#chat-messages::-webkit-scrollbar{width:6px;}
#chat-messages::-webkit-scrollbar-track{background:#1a1a2e;}
#chat-messages::-webkit-scrollbar-thumb{background:#2a2a4a;border-radius:3px;}
.chat-msg .chat-name{color:#feca57;font-weight:700;font-size:0.8rem;margin-right:6px;}
.chat-msg .chat-text{color:#e0e0e0;font-size:0.85rem;word-break:break-word;}
.chat-msg .chat-time{color:#555;font-size:0.7rem;margin-left:6px;}
#chat-input-area{display:flex;gap:6px;padding:10px;border-top:2px solid #2a2a4a;}
#chat-input{flex:1;background:#0f0f1a;border:2px solid #2a2a4a;color:#e0e0e0;font-size:0.85rem;font-family:inherit;padding:8px 10px;border-radius:6px;outline:none;}
#chat-input:focus{border-color:#7b2ff7;}
#chat-send{background:#7b2ff7;border:none;color:#fff;padding:8px 12px;border-radius:6px;cursor:pointer;font-family:inherit;font-weight:600;font-size:0.85rem;}
#chat-send:hover{background:#6a22e0;}

/* === ANIMATIONS === */
@keyframes scorePulse {
    0%, 100% { transform: scale(1); }
    40% { transform: scale(1.12); }
    70% { transform: scale(0.97); }
}
@keyframes lockInPulse {
    0%, 100% { box-shadow: 0 0 0px rgba(123, 47, 247, 0); }
    50% { box-shadow: 0 0 14px rgba(123, 47, 247, 0.5); }
}
@keyframes clueFadeIn {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
}

.score-pulse { animation: scorePulse 0.4s ease; }
.clue-fade-in { animation: clueFadeIn 0.4s ease; }
.action-btn.lock-in-pulse { animation: lockInPulse 1.5s ease-in-out infinite; }

/* Hotseat Overlay */
.hotseat-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.92);
    z-index: 190;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
}
.hotseat-overlay h2 {
    font-size: 1.8rem;
    color: #feca57;
}
.hotseat-overlay p {
    color: #888;
    font-size: 1rem;
}

/* Responsive */
@media (max-width: 500px) {
    .dial-wrapper { width: 320px; height: 180px; }
    .dial-canvas { width: 320px; height: 180px; }
    .spectrum-labels { width: 320px; }
    .spectrum-labels .spec-label { font-size: 0.85rem; }
    .player-scoreboard { gap: 5px; padding: 8px 10px; }
    .player-chip { padding: 4px 10px; font-size: 0.75rem; }
    .clue-input { width: 200px; font-size: 1rem; }
    h1 { font-size: 1.6rem; }
}
</style>

<a class="back" href="index.html">&#8592; Back</a>
<h1>WAVELENGTH</h1>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- LOBBY SCREEN -->
<div class="lobby-container" id="lobby-screen">
    <div class="online-panel" id="online-panel">
        <h3>Online Multiplayer (2-12 Players)</h3>
        <div id="lobby-main-btns" class="online-lobby-btns">
            <button class="online-btn" id="create-game-btn">Create Game</button>
            <button class="online-btn secondary" id="join-game-btn">Join Game</button>
        </div>

        <!-- Create area -->
        <div id="create-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Share this code with friends:</p>
            <div class="room-code-display" id="room-code-display">----</div>
            <div class="player-list" id="player-list"></div>
            <button class="online-btn" id="start-game-btn" style="display:none; margin-top:10px;">Start Game</button>
            <p class="waiting-msg" id="waiting-msg">Waiting for players to join...</p>
            <button class="leave-btn" id="create-leave-btn" style="margin-top:8px;">Cancel</button>
        </div>

        <!-- Join area -->
        <div id="join-area" class="join-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem;">Enter room code:</p>
            <input class="join-input" id="join-code-input" type="text" maxlength="4" placeholder="CODE">
            <button class="online-btn" id="join-submit-btn">Join</button>
            <button class="leave-btn" id="join-back-btn" style="margin-top:4px;">Back</button>
            <p class="join-error" id="join-error" style="display:none;"></p>
        </div>

        <!-- Guest waiting room -->
        <div id="guest-waiting-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Room:</p>
            <div class="room-code-display" id="guest-room-code">----</div>
            <div class="player-list" id="guest-player-list"></div>
            <p class="waiting-msg">Waiting for host to start the game...</p>
            <button class="leave-btn" id="guest-leave-btn" style="margin-top:8px;">Leave</button>
        </div>
    </div>

    <div class="online-panel" style="margin-top:10px;">
        <h3>Local Hotseat (2-8 Players)</h3>
        <div id="hotseat-setup">
            <p style="color:#888;font-size:0.85rem;margin-bottom:10px;">Enter player names:</p>
            <div id="hotseat-names" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;">
                <input class="join-input" style="width:100%;font-size:1rem;letter-spacing:1px;" placeholder="Player 1" maxlength="15">
                <input class="join-input" style="width:100%;font-size:1rem;letter-spacing:1px;" placeholder="Player 2" maxlength="15">
            </div>
            <div style="display:flex;gap:8px;justify-content:center;margin-bottom:10px;">
                <button class="online-btn secondary" id="hotseat-add-player">+ Add Player</button>
                <button class="online-btn" id="hotseat-start">Start Game</button>
            </div>
        </div>
    </div>
</div>

<!-- GAME SCREEN -->
<div class="game-container" id="game-screen">
    <!-- Info Bar -->
    <div class="info-bar">
        <span>Room: <span class="room-label" id="game-room-code"></span></span>
        <span id="phase-indicator" style="font-size:0.9rem; font-weight:600; color:#7b2ff7;">--</span>
        <button class="leave-game-btn" id="leave-game-btn">Leave</button>
    </div>

    <!-- Player Scoreboard -->
    <div class="player-scoreboard" id="player-scoreboard"></div>

    <div class="round-info" id="round-info"></div>

    <!-- Dial -->
    <div class="dial-area">
        <div class="dial-wrapper" id="dial-wrapper">
            <canvas class="dial-canvas" id="dial-canvas" width="840" height="460"></canvas>
        </div>
        <div class="spectrum-labels">
            <span class="spec-label spec-left" id="spec-left">Hot</span>
            <span class="spec-label spec-right" id="spec-right">Cold</span>
        </div>
    </div>

    <!-- Clue Display -->
    <div class="clue-display" id="clue-display" style="display:none;">
        <div class="clue-label">CLUE</div>
        <div class="clue-text" id="clue-text"></div>
    </div>

    <!-- Action Area -->
    <div class="action-area" id="action-area">
        <div class="phase-msg" id="phase-msg"></div>
        <div id="action-content"></div>
    </div>
</div>

<!-- Score Popup -->
<div class="score-popup" id="score-popup">
    <div class="sp-points" id="sp-points"></div>
    <div class="sp-label" id="sp-label"></div>
    <div class="sp-psychic" id="sp-psychic"></div>
</div>

<!-- Winner Overlay -->
<div class="winner-overlay" id="winner-overlay">
    <h2 id="winner-text"></h2>
    <div class="winner-scoreboard" id="winner-scoreboard"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
        <button class="online-btn" id="play-again-btn" style="display:none;">Play Again</button>
        <button class="online-btn secondary" id="back-to-lobby-btn">Back to Lobby</button>
    </div>

    function generateRoomCode() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var code = '';
        for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }

    function showToast(msg) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        toastContainer.appendChild(t);
        requestAnimationFrame(function() { t.classList.add('show'); });
        setTimeout(function() {
            t.classList.remove('show');
            setTimeout(function() { t.remove(); }, 300);
        }, 2500);
    }

    function showLobbyMain() {

    function showScreen(name) {
        lobbyScreen.style.display = name === 'lobby' ? '' : 'none';
        gameScreen.style.display = name === 'game' ? 'flex' : 'none';

    // === PLAYER LIST RENDER (LOBBY) ===
    function renderPlayerList(data, container) {
        container.innerHTML = '';
        if (!data || !data.players) return;
        data.players.forEach(function(name) {
            var div = document.createElement('div');
            div.className = 'player-list-item';
            div.style.display = 'flex';
            div.style.alignItems = 'center';
            div.style.gap = '8px';
            var avatarDiv = document.createElement('div');
            avatarDiv.style.cssText = 'width:24px;height:24px;flex-shrink:0;';
            avatarDiv.setAttribute('data-avatar-user', name);
            div.appendChild(avatarDiv);
            var left = document.createElement('span');
            left.textContent = name;
            left.setAttribute('data-chat-user', name);
            div.appendChild(left);
            var right = document.createElement('span');
            right.style.display = 'flex';
            right.style.alignItems = 'center';
            right.style.gap = '6px';
            right.style.marginLeft = 'auto';
            if (name === data.host) {
                var badge = document.createElement('span');
                badge.className = 'host-badge';
                badge.textContent = 'HOST';
                right.appendChild(badge);
            }
            div.appendChild(right);
            container.appendChild(div);
        });

            container.querySelectorAll('[data-chat-user]').forEach(function(el) {
                var name = el.dataset.chatUser;

                    window.ArcadeCoins.getProfile(name).then(function(profile) {
                        if (profile) window.ArcadeAvatar.renderMini(el, profile);
                    });
                }
            });

    function onLobbySnapshot(data) {
        if (!data) {
            showToast('Room closed');
            leaveLobby();
            return;
        }
        lastData = data;

        // Render chat
        if (window._wlGame && window._wlGame.renderChat) window._wlGame.renderChat(data.chat || []);

        // If game started
        if (data.status === 'playing' || data.status === 'done') {
            showScreen('game');
            document.getElementById('game-room-code').textContent = roomCode;
            onGameSnapshot(data);
            return;
        }

        // Render player list
        if (isHost) {
            renderPlayerList(data, playerList);
            startGameBtn.style.display = canStart(data) ? '' : 'none';
            waitingMsg.style.display = canStart(data) ? 'none' : '';
        } else {
            renderPlayerList(data, guestPlayerList);
        }

        // Check if I was removed
        var stillIn = data.players.indexOf(myUsername) !== -1;
        if (!stillIn) {
            showToast('You were removed from the room');
            leaveLobby();
        }
    }

    // === CREATE / JOIN / LEAVE ===
    window._wlCreateGame = async function() {
        myUsername = getMyUsername();
        roomCode = generateRoomCode();
        isHost = true;
        roomCodeDisplay.textContent = roomCode;
        lobbyMainBtns.style.display = 'none';
        createArea.style.display = '';

        var docRef = window._wlDoc(roomCode);
        await window._wlSetDoc(docRef, {
            host: myUsername,
            players: [myUsername],
            scores: {},
            status: 'waiting',
            psychicIndex: 0,
            spectrum: { left: '', right: '' },
            targetAngle: 90,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            roundScore: 0,
            winner: ''
        });

        unsubscribe = window._wlOnSnapshot(docRef, function(snap) {
            onLobbySnapshot(snap.exists() ? snap.data() : null);
        });
    };

    window._wlJoinGame = async function(code) {
        myUsername = getMyUsername();
        var docRef = window._wlDoc(code);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) {
            joinError.textContent = 'Room not found';
            joinError.style.display = '';
            return;
        }
        var data = snap.data();
        if (data.status !== 'waiting') {
            joinError.textContent = 'Game already in progress';
            joinError.style.display = '';
            return;
        }
        if (data.players.length >= 12) {
            joinError.textContent = 'Room is full';
            joinError.style.display = '';
            return;
        }
        if (data.players.indexOf(myUsername) !== -1) {
            joinError.textContent = 'Name already taken in this room';
            joinError.style.display = '';
            return;
        }

        roomCode = code;
        isHost = false;
        var players = data.players.slice();
        players.push(myUsername);
        await window._wlUpdateDoc(docRef, { players: players });

        joinArea.style.display = 'none';
        guestWaitingArea.style.display = '';
        guestRoomCode.textContent = roomCode;

        unsubscribe = window._wlOnSnapshot(docRef, function(snap) {
            onLobbySnapshot(snap.exists() ? snap.data() : null);
        });
    };

    function leaveLobby() {
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        if (roomCode && window._wlDB) {
            var docRef = window._wlDoc(roomCode);
            if (isHost) {
                window._wlUpdateDoc(docRef, { status: 'done' }).catch(function() {});
            } else {
                window._wlGetDoc(docRef).then(function(snap) {
                    if (!snap.exists()) return;
                    var d = snap.data();
                    var ps = d.players.filter(function(name) { return name !== myUsername; });
                    window._wlUpdateDoc(docRef, { players: ps }).catch(function() {});
                }).catch(function() {});
            }
        }
        roomCode = '';
        isHost = false;
        lastData = null;
        winnerOverlay.classList.remove('visible');
        scorePopup.classList.remove('visible');
        showScreen('lobby');
        showLobbyMain();
    }

    // === START GAME ===
    window._wlStartGame = async function() {
        if (!lastData || !canStart(lastData)) return;
        var spec = pickSpectrum();
        var target = Math.floor(Math.random() * 160) + 10;
        var docRef = window._wlDoc(roomCode);

        // Build initial scores object
        var scores = {};
        lastData.players.forEach(function(name) { scores[name] = 0; });

        await window._wlUpdateDoc(docRef, {
            status: 'playing',
            psychicIndex: 0,
            spectrum: { left: spec[0], right: spec[1] },
            targetAngle: target,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            roundScore: 0,
            winner: '',
            scores: scores
        });
    };

    function pickSpectrum() {
        var available = SPECTRUMS.filter(function(s, i) { return usedSpectrums.indexOf(i) === -1; });
        if (available.length === 0) { usedSpectrums = []; available = SPECTRUMS.slice(); }
        var idx = Math.floor(Math.random() * available.length);
        var chosen = available[idx];
        usedSpectrums.push(SPECTRUMS.indexOf(chosen));
        return chosen;
    }

    // ====================
    //   GAME RENDERING
    // ====================

    var currentNeedleAngle = 90;
    var isDragging = false;
    var lastPhase = '';

    function getPsychic(data) {
        if (!data.players || data.players.length === 0) return '';
        var idx = data.psychicIndex % data.players.length;
        return data.players[idx];
    }

    function amIPsychic(data) {
        return getPsychic(data) === myUsername;
    }

    function calcScore(targetAngle, guessAngle) {
        var diff = Math.abs(targetAngle - guessAngle);
        if (diff <= 4) return 4;
        if (diff <= 12) return 3;
        if (diff <= 22) return 2;
        return 0;
    }

    // === DRAW DIAL ===
    function drawDial(data, showTarget, showGuess) {
        var w = dialCanvas.width;
        var h = dialCanvas.height;
        var cx = w / 2;
        var cy = h - 20;
        var radius = Math.min(cx - 20, cy - 20);

        ctx.clearRect(0, 0, w, h);

        // Draw semicircle gradient background
        var segments = 180;
        for (var i = 0; i < segments; i++) {
            var a1 = Math.PI - (i / segments) * Math.PI;
            var a2 = Math.PI - ((i + 1) / segments) * Math.PI;
            var t = i / segments;
            var r, g, b;
            if (t < 0.25) {
                var p = t / 0.25;
                r = 255; g = Math.round(100 * p); b = Math.round(100 * p);
            } else if (t < 0.5) {
                var p = (t - 0.25) / 0.25;
                r = Math.round(255 - 80 * p); g = Math.round(100 - 50 * p); b = Math.round(100 + 100 * p);
            } else if (t < 0.75) {
                var p = (t - 0.5) / 0.25;
                r = Math.round(175 - 100 * p); g = Math.round(50 + 50 * p); b = Math.round(200 + 30 * p);
            } else {
                var p = (t - 0.75) / 0.25;
                r = Math.round(75 - 30 * p); g = Math.round(100 + 80 * p); b = Math.round(230 + 25 * p);
            }

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, a1, a2, true);
            ctx.closePath();
            ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ', 0.35)';
            ctx.fill();
        }

        // Arc border
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI, 0, false);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2a2a4a';
        ctx.stroke();

        // Base line
        ctx.beginPath();
        ctx.moveTo(cx - radius - 5, cy);
        ctx.lineTo(cx + radius + 5, cy);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2a2a4a';
        ctx.stroke();

        // Tick marks
        for (var deg = 0; deg <= 180; deg += 10) {
            var a = Math.PI - (deg / 180) * Math.PI;
            var inner = deg % 30 === 0 ? radius - 16 : radius - 10;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner * -1);
            ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius * -1);
            ctx.lineWidth = deg % 30 === 0 ? 2 : 1;
            ctx.strokeStyle = '#4a4a6a';
            ctx.stroke();
        }

        // Target zone (only for psychic or during reveal)
        if (showTarget && data.targetAngle !== undefined) {
            var tAngle = data.targetAngle;
            var zones = [
                { halfSize: 22, color: 'rgba(123, 47, 247, 0.15)', pts: 2 },
                { halfSize: 12, color: 'rgba(123, 47, 247, 0.25)', pts: 3 },
                { halfSize: 4, color: 'rgba(123, 47, 247, 0.45)', pts: 4 }
            ];
            zones.forEach(function(zone) {
                var a1 = Math.PI - ((tAngle - zone.halfSize) / 180) * Math.PI;
                var a2 = Math.PI - ((tAngle + zone.halfSize) / 180) * Math.PI;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius - 2, a1, a2, true);
                ctx.closePath();
                ctx.fillStyle = zone.color;
                ctx.fill();
            });

            // Bullseye center line
            var centerA = Math.PI - (tAngle / 180) * Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(centerA) * (radius - 2), cy - Math.sin(centerA) * (radius - 2));
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(123, 47, 247, 0.6)';
            ctx.stroke();

            // Point labels on zones (only during reveal, not for psychic preview)
            if (data.phase === 'reveal') {
                ctx.font = 'bold 18px Segoe UI, Tahoma, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                // Label positions: place text at midpoint angle of each zone ring (both sides)
                var labelZones = [
                    { halfSize: 30, innerHalf: 22, pts: 1, color: '#a080dd' },
                    { halfSize: 22, innerHalf: 12, pts: 2, color: '#c4a0ff' },
                    { halfSize: 12, innerHalf: 4, pts: 3, color: '#d4b8ff' },
                    { halfSize: 4, innerHalf: 0, pts: 4, color: '#fff' }
                ];
                labelZones.forEach(function(lz) {
                    var midOffset = (lz.halfSize + lz.innerHalf) / 2;
                    var labelDist = radius * 0.55;
                    // Draw on both sides of the target
                    [-1, 1].forEach(function(sign) {
                        var labelDeg = tAngle + sign * midOffset;
                        var labelRad = Math.PI - (labelDeg / 180) * Math.PI;
                        var lx = cx + Math.cos(labelRad) * labelDist;
                        var ly = cy - Math.sin(labelRad) * labelDist;
                        ctx.fillStyle = 'rgba(0,0,0,0.5)';
                        ctx.fillText('+' + lz.pts, lx + 1, ly + 1);
                        ctx.fillStyle = lz.color;
                        ctx.fillText('+' + lz.pts, lx, ly);
                    });
                });
            }
        }

        // Guess needle
        if (showGuess) {
            var gAngle = Math.PI - (currentNeedleAngle / 180) * Math.PI;
            // Needle shadow
            ctx.beginPath();
            ctx.moveTo(cx + 2, cy + 2);
            ctx.lineTo(cx + Math.cos(gAngle) * (radius - 25) + 2, cy - Math.sin(gAngle) * (radius - 25) + 2);
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();

            // Needle line
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(gAngle) * (radius - 25), cy - Math.sin(gAngle) * (radius - 25));
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#feca57';
            ctx.stroke();

            // Needle tip
            ctx.beginPath();
            ctx.arc(cx + Math.cos(gAngle) * (radius - 25), cy - Math.sin(gAngle) * (radius - 25), 8, 0, Math.PI * 2);
            ctx.fillStyle = '#feca57';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#e0a800';
            ctx.stroke();

            // Center hub
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#2a2a4a';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#feca57';
            ctx.stroke();
        }
    }

    // === ANGLE FROM MOUSE ===
    function angleFromEvent(e) {
        var rect = dialCanvas.getBoundingClientRect();
        var scaleX = dialCanvas.width / rect.width;
        var scaleY = dialCanvas.height / rect.height;
        var cx = dialCanvas.width / 2;
        var cy = dialCanvas.height - 20;
        var mx = (e.clientX - rect.left) * scaleX;
        var my = (e.clientY - rect.top) * scaleY;
        var dx = mx - cx;
        var dy = cy - my;
        // Use atan2 to get angle from center, then convert to dial degrees
        // atan2 convention: right=0rad, up=PI/2rad, left=PI rad
        // Dial convention: left=0deg, top=90deg, right=180deg
        var rad = Math.atan2(Math.abs(dy), dx);
        // rad goes from PI (left) to 0 (right)
        // We want degrees from 0 (left) to 180 (right)
        var degrees = ((Math.PI - rad) / Math.PI) * 180;
        degrees = Math.max(2, Math.min(178, degrees));
        return degrees;
    }

    function handlePointerDown(e) {
        if (!lastData || lastData.phase === 'reveal') return;
        if (lastData.phase === 'psychic') return;
        if (amIPsychic(lastData)) return;
        isDragging = true;
        var deg = angleFromEvent(e.touches ? e.touches[0] : e);
        currentNeedleAngle = deg;
        updateGuessAngle(deg);
        drawDial(lastData, amIPsychic(lastData), true);
    }

    function handlePointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        var deg = angleFromEvent(e.touches ? e.touches[0] : e);
        currentNeedleAngle = deg;
        drawDial(lastData, amIPsychic(lastData), true);
    }

    function handlePointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        if (lastData) updateGuessAngle(currentNeedleAngle);
    }

    dialCanvas.addEventListener('mousedown', handlePointerDown);
    dialCanvas.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('mouseup', handlePointerUp);
    dialCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); handlePointerDown(e); }, { passive: false });
    dialCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); handlePointerMove(e); }, { passive: false });
    document.addEventListener('touchend', handlePointerUp);

    function updateGuessAngle(angle) {
        if (!roomCode || !window._wlDB) return;
        var docRef = window._wlDoc(roomCode);
        window._wlUpdateDoc(docRef, { guessAngle: Math.round(angle) }).catch(function() {});

            var prevVal = prevScores[name];

                setTimeout(function() { chip.classList.remove('score-pulse'); }, 400);
            }
        });

    function onGameSnapshot(data) {
        lastData = data;
        if (!data) return;

        // Player scoreboard
        renderPlayerScoreboard(data);

        // Spectrum labels
        document.getElementById('spec-left').textContent = data.spectrum ? data.spectrum.left : '';
        document.getElementById('spec-right').textContent = data.spectrum ? data.spectrum.right : '';

        // Psychic info
        var psychic = getPsychic(data);
        var roundNum = (data.psychicIndex || 0) + 1;
        var totalRounds = data.players.length;
        var roundInfoEl = document.getElementById('round-info');
        roundInfoEl.innerHTML = '';
        var psychicSpan = document.createElement('span');
        psychicSpan.textContent = psychic;
        psychicSpan.setAttribute('data-chat-user', psychic);
        roundInfoEl.appendChild(psychicSpan);
        roundInfoEl.appendChild(document.createTextNode(' is the Psychic (Round ' + roundNum + '/' + totalRounds + ')'));
        if (window.ArcadeAvatar && window.ArcadeCoins && window.ArcadeCoins.getProfile) {
            window.ArcadeCoins.getProfile(psychic).then(function(profile) {
                if (profile) window.ArcadeAvatar.styleName(psychicSpan, profile);
            });
        }

        // Phase indicator
        var phaseLabels = {
            psychic: 'Psychic is thinking...',
            guessing: 'Players are guessing!',
            reveal: 'Revealing target!'
        };
        document.getElementById('phase-indicator').textContent = phaseLabels[data.phase] || '';

        // Clue display
        var clueDisplay = document.getElementById('clue-display');
        var clueText = document.getElementById('clue-text');
        if (data.clue && data.phase !== 'psychic') {
            var wasHidden = clueDisplay.style.display === 'none';
            clueDisplay.style.display = '';
            clueText.textContent = data.clue;
            if (wasHidden) {
                clueDisplay.classList.remove('clue-fade-in');
                void clueDisplay.offsetWidth;
                clueDisplay.classList.add('clue-fade-in');
                setTimeout(function() { clueDisplay.classList.remove('clue-fade-in'); }, 400);
            }
        } else {
            clueDisplay.style.display = 'none';
        }

        // Update needle position from server for non-dragging players
        if (!isDragging) {
            if (data.phase === 'guessing' || data.phase === 'reveal') {
                currentNeedleAngle = data.guessAngle || 90;
            } else {
                currentNeedleAngle = 90;
            }
        }

        // Determine what to show
        var showTarget = amIPsychic(data) || data.phase === 'reveal';
        var showNeedle = data.phase !== 'psychic';
        drawDial(data, showTarget, showNeedle);

        // Detect phase transitions
        if (data.phase === 'reveal' && lastPhase !== 'reveal') {
            onRevealPhase(data);
        }
        lastPhase = data.phase;

        // Render action area
        renderActionArea(data);

        // Winner check
        if (data.winner) {
            showWinnerOverlay(data);
        } else {
            winnerOverlay.classList.remove('visible');
        }
    }

    function renderActionArea(data) {
        var phaseMsg = document.getElementById('phase-msg');
        var content = document.getElementById('action-content');
        content.innerHTML = '';

        if (data.phase === 'psychic') {
            if (amIPsychic(data)) {

                var div = document.createElement('div');

            } else {

                btn.onclick = lockInGuess;

    // === GAME ACTIONS ===
    async function submitClue(clue) {
        if (!clue) { showToast('Enter a clue!'); return; }
        if (window.SFX) window.SFX.click();
        var docRef = window._wlDoc(roomCode);
        await window._wlUpdateDoc(docRef, {
            clue: clue,
            phase: 'guessing',
            guessAngle: 90
        });
    }

    async function lockInGuess() {
        if (window.SFX) window.SFX.click();
        await doReveal();
    }

    async function doReveal() {
        var docRef = window._wlDoc(roomCode);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) return;
        var data = snap.data();

        var pts = calcScore(data.targetAngle, data.guessAngle);
        var scores = JSON.parse(JSON.stringify(data.scores || {}));
        var psychic = getPsychic(data);

        // Psychic gets 1 point if guess is in any scoring zone
        if (pts > 0 && scores[psychic] !== undefined) {
            scores[psychic] += 1;
        }

        // All non-psychic players get the accuracy points
        data.players.forEach(function(name) {
            if (name !== psychic && scores[name] !== undefined) {
                scores[name] += pts;
            }
        });

        await window._wlUpdateDoc(docRef, {
            phase: 'reveal',
            roundScore: pts,
            scores: scores
        });
    }

    async function nextRound() {
        if (window.SFX) window.SFX.click();
        var docRef = window._wlDoc(roomCode);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) return;
        var data = snap.data();

        if (data.winner) return;

        var newPsychicIndex = data.psychicIndex + 1;

        // Check if game is over (every player has been psychic once)
        if (newPsychicIndex >= data.players.length) {
            // Find the winner
            var scores = data.scores || {};
            var bestPlayer = '';
            var bestScore = -1;
            data.players.forEach(function(name) {
                var s = scores[name] || 0;
                if (s > bestScore) {
                    bestScore = s;
                    bestPlayer = name;
                }
            });
            await window._wlUpdateDoc(docRef, { winner: bestPlayer });
            return;
        }

        var spec = pickSpectrum();
        var target = Math.floor(Math.random() * 160) + 10;

        await window._wlUpdateDoc(docRef, {
            psychicIndex: newPsychicIndex,
            spectrum: { left: spec[0], right: spec[1] },
            targetAngle: target,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            roundScore: 0
        });
    }

                            window.ArcadeAvatar.styleName(el, profile);
                            window.ArcadeAvatar.styleNameEffect(el, profile);
                            var _md = el.closest('.chat-msg');
                            if (_md) window.ArcadeAvatar.styleBubble(_md, profile);
                        }
                    });
                }
            });
        }
        requestAnimationFrame(function(){ chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight; });
    }

    function resetChatState() {
        chatPrevCount = 0; chatUnreadCount = 0; chatBadgeEl.style.display = 'none';
        chatMessagesEl.innerHTML = ''; chatToggleBtn.style.display = 'none';
        chatPanel.classList.remove('open'); chatIsOpen = false;
    }

    // Patch leaveLobby
    var origLeaveLobby = leaveLobby;
    leaveLobby = function() { resetChatState(); origLeaveLobby(); };

    // Expose for firebase module
    window._wlGame = {
        getMyUsername: getMyUsername,
        generateRoomCode: generateRoomCode,
        showToast: showToast,
        renderChat: renderChatMessages,
        resetChat: resetChatState
    };

    // ===== HOTSEAT MODE =====
    var hotseatMode = false;
    var hotseatPlayers = [];
    var hotseatScores = {};
    var hotseatPsychicIndex = 0;
    var hotseatTargetAngle = 0;
    var hotseatClue = '';
    var hotseatPhase = ''; // 'pass-to-psychic', 'psychic', 'pass-to-guesser', 'guessing', 'reveal'
    var hotseatUsedSpectrums = [];
    var hotseatCurrentSpectrum = null;
    var hotseatGuessAngle = 90;

    function hotseatPickSpectrum() {
        var available = SPECTRUMS.filter(function(s, i) { return hotseatUsedSpectrums.indexOf(i) === -1; });
        if (available.length === 0) { hotseatUsedSpectrums = []; available = SPECTRUMS.slice(); }
        var idx = Math.floor(Math.random() * available.length);
        var chosen = available[idx];
        hotseatUsedSpectrums.push(SPECTRUMS.indexOf(chosen));
        return chosen;
    }

    function startHotseat(names) {
        // Validate names
        var cleaned = [];
        for (var i = 0; i < names.length; i++) {
            var n = names[i].trim();
            if (n.length > 0) cleaned.push(n);
        }
        if (cleaned.length < 2) {
            showToast('Need at least 2 players!');
            return;
        }
        if (cleaned.length > 8) {
            showToast('Maximum 8 players!');
            return;
        }
        // Check for duplicates
        var seen = {};
        for (var i = 0; i < cleaned.length; i++) {
            var lower = cleaned[i].toLowerCase();
            if (seen[lower]) {
                showToast('Duplicate name: ' + cleaned[i]);
                return;
            }
            seen[lower] = true;
        }

        hotseatMode = true;
        hotseatPlayers = cleaned;
        hotseatScores = {};
        for (var i = 0; i < cleaned.length; i++) {
            hotseatScores[cleaned[i]] = 0;
        }
        hotseatPsychicIndex = 0;
        hotseatUsedSpectrums = [];
        hotseatGuessAngle = 90;
        currentNeedleAngle = 90;
        lastPhase = '';

        // Hide chat toggle for hotseat
        chatToggleBtn.style.display = 'none';
        chatPanel.classList.remove('open');
        chatIsOpen = false;

        // Show game screen
        showScreen('game');
        document.getElementById('game-room-code').textContent = 'Hotseat';

        hotseatNextRound();
    }

    function hotseatNextRound() {
        hotseatCurrentSpectrum = hotseatPickSpectrum();
        hotseatTargetAngle = Math.floor(Math.random() * 160) + 10;
        hotseatClue = '';
        hotseatGuessAngle = 90;
        currentNeedleAngle = 90;
        hotseatPhase = 'pass-to-psychic';

        renderHotseatGame();
        var psychicName = hotseatPlayers[hotseatPsychicIndex % hotseatPlayers.length];
        showHotseatOverlay('Pass to ' + psychicName, 'You are the Psychic this round!', "I'm Ready", function() {
            hotseatPhase = 'psychic';
            renderHotseatGame();
        });
    }

    function showHotseatOverlay(title, subtitle, buttonText, callback) {
        // Remove any existing overlay
        var existing = document.querySelector('.hotseat-overlay');
        if (existing) existing.remove();

        var overlay = document.createElement('div');
        overlay.className = 'hotseat-overlay';

        var h2 = document.createElement('h2');
        h2.textContent = title;
        overlay.appendChild(h2);

        if (subtitle) {
            var p = document.createElement('p');
            p.textContent = subtitle;
            overlay.appendChild(p);
        }

        var btn = document.createElement('button');
        btn.className = 'online-btn';
        btn.textContent = buttonText;
        btn.style.marginTop = '10px';
        btn.style.fontSize = '1.1rem';
        btn.style.padding = '12px 36px';
        btn.onclick = function() {
            overlay.remove();
            if (callback) callback();
        };
        overlay.appendChild(btn);

        document.body.appendChild(overlay);
    }

    function renderHotseatGame() {
        if (!hotseatMode) return;

        var psychicName = hotseatPlayers[hotseatPsychicIndex % hotseatPlayers.length];
        var roundNum = hotseatPsychicIndex + 1;
        var totalRounds = hotseatPlayers.length;

        // Build a fake data object for reusing drawDial and scoreboard
        var fakeData = {
            players: hotseatPlayers,
            scores: hotseatScores,
            psychicIndex: hotseatPsychicIndex,
            targetAngle: hotseatTargetAngle,
            spectrum: { left: hotseatCurrentSpectrum[0], right: hotseatCurrentSpectrum[1] },
            phase: hotseatPhase === 'reveal' ? 'reveal' : (hotseatPhase === 'guessing' ? 'guessing' : 'psychic'),
            clue: hotseatClue,
            guessAngle: hotseatGuessAngle
        };

        // Scoreboard
        renderHotseatScoreboard(fakeData);

        // Spectrum labels
        document.getElementById('spec-left').textContent = hotseatCurrentSpectrum[0];
        document.getElementById('spec-right').textContent = hotseatCurrentSpectrum[1];

        // Round info
        document.getElementById('round-info').textContent = psychicName + ' is the Psychic (Round ' + roundNum + '/' + totalRounds + ')';

        // Phase indicator
        var phaseLabels = {
            'pass-to-psychic': 'Passing device...',
            'psychic': psychicName + ' is thinking...',
            'pass-to-guesser': 'Passing device...',
            'guessing': 'Players are guessing!',
            'reveal': 'Revealing target!'
        };
        document.getElementById('phase-indicator').textContent = phaseLabels[hotseatPhase] || '';

        // Clue display
        var clueDisplay = document.getElementById('clue-display');
        var clueTextEl = document.getElementById('clue-text');
        if (hotseatClue && (hotseatPhase === 'guessing' || hotseatPhase === 'reveal' || hotseatPhase === 'pass-to-guesser')) {
            clueDisplay.style.display = '';
            clueTextEl.textContent = hotseatClue;
        } else {
            clueDisplay.style.display = 'none';
        }

        // Draw dial
        var showTarget = (hotseatPhase === 'psychic' || hotseatPhase === 'reveal');
        var showNeedle = (hotseatPhase === 'guessing' || hotseatPhase === 'reveal');
        drawDial(fakeData, showTarget, showNeedle);

        // Render action area for hotseat
        renderHotseatActionArea();
    }

    function renderHotseatScoreboard(data) {
        var container = document.getElementById('player-scoreboard');
        container.innerHTML = '';
        var psychic = data.players[data.psychicIndex % data.players.length];
        var scores = data.scores || {};
        data.players.forEach(function(name) {
            var chip = document.createElement('div');
            chip.className = 'player-chip' + (name === psychic ? ' is-psychic' : '');
            var nameSpan = document.createElement('span');
            nameSpan.className = 'chip-name';
            nameSpan.textContent = name;
            var scoreSpan = document.createElement('span');
            scoreSpan.className = 'chip-score';
            scoreSpan.textContent = scores[name] || 0;
            chip.appendChild(nameSpan);
            chip.appendChild(scoreSpan);
            container.appendChild(chip);

            var prevVal = prevScores[name];
            var currVal = scores[name] || 0;
            if (prevVal !== undefined && currVal !== prevVal) {
                chip.classList.add('score-pulse');
                setTimeout(function() { chip.classList.remove('score-pulse'); }, 400);
            }
        });
        var newPrev = {};
        data.players.forEach(function(name) { newPrev[name] = scores[name] || 0; });
        prevScores = newPrev;
    }

    function renderHotseatActionArea() {
        var phaseMsg = document.getElementById('phase-msg');
        var content = document.getElementById('action-content');
        content.innerHTML = '';

        var psychicName = hotseatPlayers[hotseatPsychicIndex % hotseatPlayers.length];

        if (hotseatPhase === 'psychic') {
            phaseMsg.textContent = psychicName + ', give a clue for where the target is on the spectrum.';
            var div = document.createElement('div');
            div.className = 'clue-input-area';
            var input = document.createElement('input');
            input.className = 'clue-input';
            input.type = 'text';
            input.placeholder = 'Enter your clue...';
            input.maxLength = 40;
            var btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.textContent = 'Submit Clue';
            btn.onclick = function() {
                var clue = input.value.trim();
                if (!clue) { showToast('Enter a clue!'); return; }
                if (window.SFX) window.SFX.click();
                hotseatClue = clue;
                hotseatPhase = 'pass-to-guesser';
                renderHotseatGame();
                showHotseatOverlay('Pass to the other players', "Don't let " + psychicName + ' see!', 'Ready', function() {
                    hotseatPhase = 'guessing';
                    currentNeedleAngle = 90;
                    hotseatGuessAngle = 90;
                    renderHotseatGame();
                });
            };
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') btn.onclick();
            });
            div.appendChild(input);
            div.appendChild(btn);
            content.appendChild(div);
            // Focus the input after render
            setTimeout(function() { input.focus(); }, 50);
        } else if (hotseatPhase === 'guessing') {
            phaseMsg.textContent = 'Move the needle to where you think the target is, then lock in!';
            var btn = document.createElement('button');
            btn.className = 'action-btn lock-in-pulse';
            btn.textContent = 'Lock In Guess';
            btn.onclick = function() {
                if (window.SFX) window.SFX.click();
                hotseatGuessAngle = Math.round(currentNeedleAngle);
                hotseatDoReveal();
            };
            content.appendChild(btn);
        } else if (hotseatPhase === 'reveal') {
            phaseMsg.textContent = '';
            var btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.textContent = 'Next Round';
            btn.style.marginTop = '10px';
            btn.onclick = function() {
                if (window.SFX) window.SFX.click();
                hotseatPsychicIndex++;
                if (hotseatPsychicIndex >= hotseatPlayers.length) {
                    hotseatShowWinner();
                } else {
                    hotseatNextRound();
                }
            };
            content.appendChild(btn);
        } else if (hotseatPhase === 'pass-to-psychic' || hotseatPhase === 'pass-to-guesser') {
            phaseMsg.textContent = 'Passing device...';
        }
    }

    function hotseatDoReveal() {
        var pts = calcScore(hotseatTargetAngle, hotseatGuessAngle);
        var psychicName = hotseatPlayers[hotseatPsychicIndex % hotseatPlayers.length];

        // Psychic gets 1 point if guess is in any scoring zone
        if (pts > 0) {
            hotseatScores[psychicName] = (hotseatScores[psychicName] || 0) + 1;
        }

        // All non-psychic players get the accuracy points
        hotseatPlayers.forEach(function(name) {
            if (name !== psychicName) {
                hotseatScores[name] = (hotseatScores[name] || 0) + pts;
            }
        });

        hotseatPhase = 'reveal';
        currentNeedleAngle = hotseatGuessAngle;
        renderHotseatGame();

        // Show score popup
        if (window.SFX) window.SFX.coin();
        document.getElementById('sp-points').textContent = pts > 0 ? '+' + pts : '0';
        document.getElementById('sp-label').textContent = pts === 4 ? 'BULLSEYE!' : pts === 3 ? 'Close!' : pts === 2 ? 'Near' : 'Miss!';
        document.getElementById('sp-psychic').textContent = pts > 0 ? ('Guessers +' + pts + ' | ' + psychicName + ' (Psychic) +1') : '';
        scorePopup.classList.add('visible');
        setTimeout(function() { scorePopup.classList.remove('visible'); }, 3500);
    }

    function hotseatShowWinner() {
        // Find winner
        var bestPlayer = '';
        var bestScore = -1;
        hotseatPlayers.forEach(function(name) {
            var s = hotseatScores[name] || 0;
            if (s > bestScore) {
                bestScore = s;
                bestPlayer = name;
            }
        });

        document.getElementById('winner-text').textContent = 'Game Over!';

        var sorted = hotseatPlayers.slice().sort(function(a, b) {
            return (hotseatScores[b] || 0) - (hotseatScores[a] || 0);
        });

        var sb = document.getElementById('winner-scoreboard');
        sb.innerHTML = '';
        var topScore = hotseatScores[sorted[0]] || 0;
        sorted.forEach(function(name) {
            var row = document.createElement('div');
            row.className = 'ws-row' + ((hotseatScores[name] || 0) === topScore ? ' ws-winner' : '');
            var nameSpan = document.createElement('span');
            nameSpan.className = 'ws-name';
            nameSpan.textContent = name;
            var ptsSpan = document.createElement('span');
            ptsSpan.className = 'ws-pts';
            ptsSpan.textContent = hotseatScores[name] || 0;
            row.appendChild(nameSpan);
            row.appendChild(ptsSpan);
            sb.appendChild(row);
        });

        // Hide play again (online-only feature), show back to lobby
        document.getElementById('play-again-btn').style.display = 'none';

        winnerOverlay.classList.add('visible');

        // Submit winner's score to HallOfFame
        if (window.HallOfFame) window.HallOfFame.submit('wavelength', bestScore);

        if (window.SFX) window.SFX.win();
    }

    // Hotseat pointer handling: override online pointer handlers when in hotseat mode
    var origHandlePointerDown = handlePointerDown;
    handlePointerDown = function(e) {
        if (hotseatMode) {
            if (hotseatPhase !== 'guessing') return;
            isDragging = true;
            var deg = angleFromEvent(e.touches ? e.touches[0] : e);
            currentNeedleAngle = deg;
            hotseatGuessAngle = deg;
            var fakeData = {
                players: hotseatPlayers,
                scores: hotseatScores,
                psychicIndex: hotseatPsychicIndex,
                targetAngle: hotseatTargetAngle,
                spectrum: { left: hotseatCurrentSpectrum[0], right: hotseatCurrentSpectrum[1] },
                phase: 'guessing',
                clue: hotseatClue,
                guessAngle: hotseatGuessAngle
            };
            drawDial(fakeData, false, true);
            return;
        }
        origHandlePointerDown(e);
    };

    var origHandlePointerMove = handlePointerMove;
    handlePointerMove = function(e) {
        if (hotseatMode) {
            if (!isDragging) return;
            e.preventDefault();
            var deg = angleFromEvent(e.touches ? e.touches[0] : e);
            currentNeedleAngle = deg;
            hotseatGuessAngle = deg;
            var fakeData = {
                players: hotseatPlayers,
                scores: hotseatScores,
                psychicIndex: hotseatPsychicIndex,
                targetAngle: hotseatTargetAngle,
                spectrum: { left: hotseatCurrentSpectrum[0], right: hotseatCurrentSpectrum[1] },
                phase: 'guessing',
                clue: hotseatClue,
                guessAngle: hotseatGuessAngle
            };
            drawDial(fakeData, false, true);
            return;
        }
        origHandlePointerMove(e);
    };

    var origHandlePointerUp = handlePointerUp;
    handlePointerUp = function(e) {
        if (hotseatMode) {
            isDragging = false;
            return;
        }
        origHandlePointerUp(e);
    };

    // Re-attach event listeners with the new wrapped functions
    dialCanvas.removeEventListener('mousedown', origHandlePointerDown);
    dialCanvas.removeEventListener('mousemove', origHandlePointerMove);
    document.removeEventListener('mouseup', origHandlePointerUp);
    dialCanvas.addEventListener('mousedown', handlePointerDown);
    dialCanvas.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('mouseup', handlePointerUp);
    // Touch events: remove old inline listeners and add new ones
    // (Since we can't remove anonymous listeners, we'll use a flag-based approach instead)
    // The touch handlers already call handlePointerDown/Move/Up which are now overridden

    // Hotseat event listeners
    document.getElementById('hotseat-add-player').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        var container = document.getElementById('hotseat-names');
        var inputs = container.querySelectorAll('input');
        if (inputs.length >= 8) {
            showToast('Maximum 8 players!');
            return;
        }
        var input = document.createElement('input');
        input.className = 'join-input';
        input.style.cssText = 'width:100%;font-size:1rem;letter-spacing:1px;';
        input.placeholder = 'Player ' + (inputs.length + 1);
        input.maxLength = 15;
        container.appendChild(input);
        input.focus();
    });

    document.getElementById('hotseat-start').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        var container = document.getElementById('hotseat-names');
        var inputs = container.querySelectorAll('input');
        var names = [];
        for (var i = 0; i < inputs.length; i++) {
            names.push(inputs[i].value);
        }
        startHotseat(names);
    });

    // Initial draw
    drawDial({ targetAngle: 90 }, false, false);

})();
</script>

var app = initializeApp(firebaseConfig, 'wavelength-game');
var db = getFirestore(app);

window._wlDB = db;
window._wlDoc = function(code) { return doc(db, 'wavelength_rooms', code); };
window._wlSetDoc = function(ref, data) { return setDoc(ref, data); };
window._wlGetDoc = function(ref) { return getDoc(ref); };
window._wlUpdateDoc = function(ref, data) { return updateDoc(ref, data); };
window._wlOnSnapshot = function(ref, cb) { return onSnapshot(ref, cb); };

// Chat send
window._wlChatSend = async function(text) {
    var wl = window._wlGame;
    var roomCode = '';
    // Get roomCode from the game-room-code element or from the room-code-display
    var rcEl = document.getElementById('game-room-code');
    if (rcEl && rcEl.textContent && rcEl.textContent !== '') roomCode = rcEl.textContent;
    if (!roomCode) {
        var rcEl2 = document.getElementById('room-code-display');
        if (rcEl2 && rcEl2.textContent && rcEl2.textContent !== '----') roomCode = rcEl2.textContent;
    }
    if (!roomCode) {
        var rcEl3 = document.getElementById('guest-room-code');
        if (rcEl3 && rcEl3.textContent && rcEl3.textContent !== '----') roomCode = rcEl3.textContent;
    }
    if (!roomCode || !text) return;
    try {
        var roomRef = doc(db, 'wavelength_rooms', roomCode);
        var snap = await getDoc(roomRef);
        if (!snap.exists()) return;
        var d = snap.data();
        var chat = (d.chat || []).slice();
        var username = wl.getMyUsername();
        var now = new Date();
        chat.push({ name: username, text: text, time: ('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2) });
        if (chat.length > 50) chat = chat.slice(chat.length - 50);
        await updateDoc(roomRef, { chat: chat });
    } catch(e) { console.error('Chat error:', e); }
};
