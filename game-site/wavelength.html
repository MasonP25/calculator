<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wavelength</title>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: #0f0f1a;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}

a.back { position: fixed; top: 12px; left: 16px; color: #888; text-decoration: none; font-size: 0.85rem; z-index: 100; transition: color 0.2s; }
a.back:hover { color: #e0e0e0; }

h1 {
    text-align: center;
    padding: 20px 0 5px;
    font-size: 2rem;
    background: linear-gradient(135deg, #7b2ff7, #00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
    letter-spacing: 4px;
}

/* Lobby Styles */
.lobby-container {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
}

.online-panel {
    background: #1a1a2e;
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    padding: 20px;
    width: 100%;
    text-align: center;
}

.online-panel h3 {
    margin-bottom: 15px;
    color: #e0e0e0;
    font-size: 1rem;
}

.online-lobby-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.online-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}
.online-btn:hover { background: #6a22e0; }
.online-btn:active { transform: scale(0.97); }
.online-btn.secondary { background: #2a2a4a; }
.online-btn.secondary:hover { background: #3a3a5a; }
.online-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.room-code-display {
    font-size: 2.5rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 8px;
    margin: 15px 0;
    font-family: monospace;
}

.waiting-msg {
    color: #888;
    font-size: 0.9rem;
    animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
}

.join-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}

.join-input {
    background: #0f0f1a;
    border: 2px solid #2a2a4a;
    color: #feca57;
    font-size: 1.8rem;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 6px;
    text-align: center;
    padding: 8px 16px;
    border-radius: 8px;
    width: 160px;
    text-transform: uppercase;
    outline: none;
    transition: border-color 0.25s;
}
.join-input:focus { border-color: #7b2ff7; }
.join-input::placeholder { color: #444; letter-spacing: 2px; font-size: 1rem; }

.join-error { color: #ff4757; font-size: 0.85rem; }

.leave-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 14px;
    font-size: 0.8rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.2s;
}
.leave-btn:hover { background: #ff475722; }

.player-list {
    width: 100%;
    margin: 10px 0;
}

.player-list-item {
    background: #0f0f1a;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    padding: 8px 14px;
    margin: 4px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.95rem;
}

.player-list-item .host-badge {
    background: #feca57;
    color: #0f0f1a;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
}

.team-badge {
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    margin-left: 6px;
}
.team-badge.t1 { background: #ff6b6b; color: #fff; }
.team-badge.t2 { background: #54a0ff; color: #fff; }
.team-badge.unchosen { background: #3a3a5a; color: #888; }

.team-selector {
    display: flex;
    gap: 8px;
    margin: 12px 0;
    justify-content: center;
}

.team-select-btn {
    padding: 8px 20px;
    font-size: 0.85rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border: 2px solid #2a2a4a;
    background: #1a1a2e;
    color: #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.team-select-btn:hover { border-color: #7b2ff7; }
.team-select-btn.active-t1 { border-color: #ff6b6b; background: #ff6b6b33; color: #ff6b6b; }
.team-select-btn.active-t2 { border-color: #54a0ff; background: #54a0ff33; color: #54a0ff; }

/* Toast */
.toast-container {
    position: fixed;
    top: 60px;
    right: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.toast {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    color: #e0e0e0;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(0);
}

/* Game Container */
.game-container {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding-bottom: 20px;
}

/* Info Bar */
.info-bar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    padding: 10px 20px;
    background: #1a1a2e;
    border-bottom: 2px solid #2a2a4a;
    flex-wrap: wrap;
}

.info-bar .room-label {
    color: #feca57;
    font-weight: 700;
    font-family: monospace;
    letter-spacing: 3px;
    font-size: 0.9rem;
}

.info-bar .leave-game-btn {
    background: none;
    border: 1px solid #ff475766;
    color: #ff4757;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.2s;
}
.info-bar .leave-game-btn:hover { background: #ff475722; }

/* Scoreboard */
.scoreboard {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    padding: 14px 20px;
    flex-wrap: wrap;
}

.team-score {
    text-align: center;
    min-width: 120px;
}

.team-score .team-name {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 4px;
}

.team-score .score-value {
    font-size: 2rem;
    font-weight: 800;
}

.team-score.t1 .team-name { color: #ff6b6b; }
.team-score.t1 .score-value { color: #ff6b6b; }
.team-score.t2 .team-name { color: #54a0ff; }
.team-score.t2 .score-value { color: #54a0ff; }

.team-score.active-team {
    position: relative;
}
.team-score.active-team::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    border-radius: 2px;
}
.team-score.active-team.t1::after { background: #ff6b6b; }
.team-score.active-team.t2::after { background: #54a0ff; }

.score-divider {
    font-size: 1.4rem;
    color: #3a3a5a;
    font-weight: 300;
}

.round-info {
    text-align: center;
    color: #888;
    font-size: 0.85rem;
    padding: 4px 0;
}

/* Dial Area */
.dial-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 20px 10px;
}

.dial-wrapper {
    position: relative;
    width: 420px;
    height: 230px;
    margin: 0 auto;
}

.dial-canvas {
    width: 420px;
    height: 230px;
    cursor: pointer;
    display: block;
    margin: 0 auto;
}

.spectrum-labels {
    display: flex;
    justify-content: space-between;
    width: 420px;
    margin: 8px auto 0;
    padding: 0 10px;
}

.spectrum-labels .spec-label {
    font-size: 1rem;
    font-weight: 700;
    max-width: 180px;
    text-align: center;
}

.spectrum-labels .spec-left { color: #ff6b6b; }
.spectrum-labels .spec-right { color: #54a0ff; }

/* Clue Display */
.clue-display {
    text-align: center;
    padding: 12px 20px;
    min-height: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.clue-display .clue-label {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 4px;
}

.clue-display .clue-text {
    font-size: 1.6rem;
    font-weight: 700;
    color: #feca57;
    letter-spacing: 1px;
}

/* Action Area */
.action-area {
    text-align: center;
    padding: 10px 20px 20px;
    min-height: 80px;
}

.phase-msg {
    font-size: 1rem;
    font-weight: 600;
    color: #7b2ff7;
    margin-bottom: 10px;
}

.clue-input-area {
    display: flex;
    gap: 10px;
    justify-content: center;
    align-items: center;
}

.clue-input {
    background: #0f0f1a;
    border: 2px solid #7b2ff7;
    color: #feca57;
    font-size: 1.2rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    text-align: center;
    padding: 10px 20px;
    border-radius: 8px;
    width: 260px;
    outline: none;
    transition: border-color 0.2s;
}
.clue-input:focus { border-color: #feca57; }
.clue-input::placeholder { color: #555; }

.action-btn {
    background: #7b2ff7;
    color: #fff;
    border: none;
    padding: 10px 28px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.25s, transform 0.15s;
}
.action-btn:hover { background: #6a22e0; }
.action-btn:active { transform: scale(0.97); }
.action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.oppose-btns {
    display: flex;
    gap: 12px;
    justify-content: center;
}

.oppose-btn {
    padding: 10px 30px;
    font-size: 1rem;
    font-weight: 600;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    border: 2px solid #2a2a4a;
    background: #1a1a2e;
    color: #e0e0e0;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.oppose-btn:hover { border-color: #7b2ff7; color: #7b2ff7; }
.oppose-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Score Popup */
.score-popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: #1a1a2e;
    border: 3px solid #7b2ff7;
    border-radius: 16px;
    padding: 30px 50px;
    text-align: center;
    z-index: 150;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.score-popup.visible { transform: translate(-50%, -50%) scale(1); }
.score-popup .sp-points {
    font-size: 3rem;
    font-weight: 800;
    color: #feca57;
}
.score-popup .sp-label {
    font-size: 1rem;
    color: #888;
    margin-top: 4px;
}
.score-popup .sp-oppose {
    font-size: 0.9rem;
    color: #7b2ff7;
    margin-top: 8px;
}

/* Winner Overlay */
.winner-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85);
    z-index: 180;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 20px;
}

.winner-overlay.visible { display: flex; }

.winner-overlay h2 {
    font-size: 2rem;
    background: linear-gradient(135deg, #feca57, #ff4757);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.winner-overlay p { color: #888; font-size: 1rem; }

/* Responsive */
@media (max-width: 500px) {
    .dial-wrapper { width: 320px; height: 180px; }
    .dial-canvas { width: 320px; height: 180px; }
    .spectrum-labels { width: 320px; }
    .spectrum-labels .spec-label { font-size: 0.85rem; }
    .scoreboard { gap: 16px; }
    .team-score .score-value { font-size: 1.6rem; }
    .clue-input { width: 200px; font-size: 1rem; }
    h1 { font-size: 1.6rem; }
}
</style>
</head>
<body>

<a class="back" href="index.html">&#8592; Back</a>
<h1>WAVELENGTH</h1>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<!-- LOBBY SCREEN -->
<div class="lobby-container" id="lobby-screen">
    <div class="online-panel" id="online-panel">
        <h3>Online Multiplayer (3-12 Players)</h3>
        <div id="lobby-main-btns" class="online-lobby-btns">
            <button class="online-btn" id="create-game-btn">Create Game</button>
            <button class="online-btn secondary" id="join-game-btn">Join Game</button>
        </div>

        <!-- Create area -->
        <div id="create-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Share this code with friends:</p>
            <div class="room-code-display" id="room-code-display">----</div>
            <p style="color:#aaa; font-size:0.85rem; margin-bottom:6px;">Choose your team:</p>
            <div class="team-selector" id="team-selector">
                <button class="team-select-btn" id="team1-btn" data-team="1">Red Team</button>
                <button class="team-select-btn" id="team2-btn" data-team="2">Blue Team</button>
            </div>
            <div class="player-list" id="player-list"></div>
            <button class="online-btn" id="start-game-btn" style="display:none; margin-top:10px;">Start Game</button>
            <p class="waiting-msg" id="waiting-msg">Waiting for players to join...</p>
            <button class="leave-btn" id="create-leave-btn" style="margin-top:8px;">Cancel</button>
        </div>

        <!-- Join area -->
        <div id="join-area" class="join-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem;">Enter room code:</p>
            <input class="join-input" id="join-code-input" type="text" maxlength="4" placeholder="CODE">
            <button class="online-btn" id="join-submit-btn">Join</button>
            <button class="leave-btn" id="join-back-btn" style="margin-top:4px;">Back</button>
            <p class="join-error" id="join-error" style="display:none;"></p>
        </div>

        <!-- Guest waiting room -->
        <div id="guest-waiting-area" style="display:none;">
            <p style="color:#888; font-size:0.85rem; margin-bottom:8px;">Room:</p>
            <div class="room-code-display" id="guest-room-code">----</div>
            <p style="color:#aaa; font-size:0.85rem; margin-bottom:6px;">Choose your team:</p>
            <div class="team-selector" id="guest-team-selector">
                <button class="team-select-btn" id="guest-team1-btn" data-team="1">Red Team</button>
                <button class="team-select-btn" id="guest-team2-btn" data-team="2">Blue Team</button>
            </div>
            <div class="player-list" id="guest-player-list"></div>
            <p class="waiting-msg">Waiting for host to start the game...</p>
            <button class="leave-btn" id="guest-leave-btn" style="margin-top:8px;">Leave</button>
        </div>
    </div>
</div>

<!-- GAME SCREEN -->
<div class="game-container" id="game-screen">
    <!-- Info Bar -->
    <div class="info-bar">
        <span>Room: <span class="room-label" id="game-room-code"></span></span>
        <span id="phase-indicator" style="font-size:0.9rem; font-weight:600; color:#7b2ff7;">--</span>
        <button class="leave-game-btn" id="leave-game-btn">Leave</button>
    </div>

    <!-- Scoreboard -->
    <div class="scoreboard">
        <div class="team-score t1" id="team1-score-box">
            <div class="team-name">Red Team</div>
            <div class="score-value" id="t1-score">0</div>
        </div>
        <div class="score-divider">|</div>
        <div class="team-score t2" id="team2-score-box">
            <div class="team-name">Blue Team</div>
            <div class="score-value" id="t2-score">0</div>
        </div>
    </div>

    <div class="round-info" id="round-info"></div>

    <!-- Dial -->
    <div class="dial-area">
        <div class="dial-wrapper" id="dial-wrapper">
            <canvas class="dial-canvas" id="dial-canvas" width="840" height="460"></canvas>
        </div>
        <div class="spectrum-labels">
            <span class="spec-label spec-left" id="spec-left">Hot</span>
            <span class="spec-label spec-right" id="spec-right">Cold</span>
        </div>
    </div>

    <!-- Clue Display -->
    <div class="clue-display" id="clue-display" style="display:none;">
        <div class="clue-label">CLUE</div>
        <div class="clue-text" id="clue-text"></div>
    </div>

    <!-- Action Area -->
    <div class="action-area" id="action-area">
        <div class="phase-msg" id="phase-msg"></div>
        <div id="action-content"></div>
    </div>
</div>

<!-- Score Popup -->
<div class="score-popup" id="score-popup">
    <div class="sp-points" id="sp-points"></div>
    <div class="sp-label" id="sp-label"></div>
    <div class="sp-oppose" id="sp-oppose"></div>
</div>

<!-- Winner Overlay -->
<div class="winner-overlay" id="winner-overlay">
    <h2 id="winner-text"></h2>
    <p id="winner-sub"></p>
    <button class="online-btn" id="back-to-lobby-btn">Back to Lobby</button>
</div>

<script>
(function() {
    'use strict';

    // === SPECTRUM CARDS ===
    var SPECTRUMS = [
        ["Hot", "Cold"],

        ["Would survive a zombie apocalypse", "Would not survive"],
        ["Acceptable in public", "Only acceptable in private"],
        ["Easy to explain", "Hard to explain"],
        ["Worth the wait", "Not worth the wait"],
        ["Socially acceptable", "Socially unacceptable"],
        ["Mainstream", "Niche"],
        ["Overpriced", "A steal"],
        ["Kid-friendly", "Adults only"],
        ["Timeless", "Trendy"],
        ["Natural talent", "Learned skill"],
        ["Round", "Pointy"],
        ["Peaceful", "Chaotic"],
        ["Romantic", "Unromantic"],
        ["Requires bravery", "Requires patience"],
        ["Instagrammable", "Unphotogenic"]
    ];

    // === STATE ===
    var myUsername = '';
    var roomCode = '';
    var isHost = false;
    var unsubscribe = null;
    var lastData = null;
    var usedSpectrums = [];

    // === DOM REFS ===
    var lobbyScreen = document.getElementById('lobby-screen');
    var gameScreen = document.getElementById('game-screen');
    var lobbyMainBtns = document.getElementById('lobby-main-btns');
    var createArea = document.getElementById('create-area');
    var joinArea = document.getElementById('join-area');
    var guestWaitingArea = document.getElementById('guest-waiting-area');
    var roomCodeDisplay = document.getElementById('room-code-display');
    var guestRoomCode = document.getElementById('guest-room-code');
    var playerList = document.getElementById('player-list');
    var guestPlayerList = document.getElementById('guest-player-list');
    var startGameBtn = document.getElementById('start-game-btn');
    var waitingMsg = document.getElementById('waiting-msg');
    var joinCodeInput = document.getElementById('join-code-input');
    var joinError = document.getElementById('join-error');
    var toastContainer = document.getElementById('toast-container');
    var dialCanvas = document.getElementById('dial-canvas');
    var ctx = dialCanvas.getContext('2d');
    var winnerOverlay = document.getElementById('winner-overlay');
    var scorePopup = document.getElementById('score-popup');

    function getMyUsername() {
        return localStorage.getItem('arcade_currentUser') || localStorage.getItem('arcadePlayerName') || 'Guest';
    }

    function generateRoomCode() {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var code = '';
        for (var i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
        return code;
    }

    function showToast(msg) {
        var t = document.createElement('div');
        t.className = 'toast';
        t.textContent = msg;
        toastContainer.appendChild(t);
        requestAnimationFrame(function() { t.classList.add('show'); });
        setTimeout(function() {
            t.classList.remove('show');
            setTimeout(function() { t.remove(); }, 300);
        }, 2500);
    }

    function showLobbyMain() {
        lobbyMainBtns.style.display = '';
        createArea.style.display = 'none';
        joinArea.style.display = 'none';
        guestWaitingArea.style.display = 'none';
    }

    function showScreen(name) {
        lobbyScreen.style.display = name === 'lobby' ? '' : 'none';
        gameScreen.style.display = name === 'game' ? 'flex' : 'none';
    }

    // === PLAYER LIST RENDER ===
    function renderPlayerList(data, container) {
        container.innerHTML = '';
        if (!data || !data.players) return;
        data.players.forEach(function(p) {
            var div = document.createElement('div');
            div.className = 'player-list-item';
            var left = document.createElement('span');
            left.textContent = p.name;
            div.appendChild(left);
            var right = document.createElement('span');
            right.style.display = 'flex';
            right.style.alignItems = 'center';
            right.style.gap = '6px';
            if (p.name === data.host) {
                var badge = document.createElement('span');
                badge.className = 'host-badge';
                badge.textContent = 'HOST';
                right.appendChild(badge);
            }
            var tb = document.createElement('span');
            tb.className = 'team-badge ' + (p.team === 1 ? 't1' : p.team === 2 ? 't2' : 'unchosen');
            tb.textContent = p.team === 1 ? 'RED' : p.team === 2 ? 'BLUE' : '?';
            right.appendChild(tb);
            div.appendChild(right);
            container.appendChild(div);
        });
    }

    // === TEAM SELECT ===
    function updateTeamButtons(data) {
        var me = data.players.find(function(p) { return p.name === myUsername; });
        var myTeam = me ? me.team : 0;
        ['team1-btn', 'team2-btn', 'guest-team1-btn', 'guest-team2-btn'].forEach(function(id) {
            var btn = document.getElementById(id);
            if (!btn) return;
            var t = parseInt(btn.dataset.team);
            btn.className = 'team-select-btn' + (myTeam === t ? ' active-t' + t : '');
        });
    }

    async function setMyTeam(team) {
        if (!window._wlDB || !roomCode) return;
        var docRef = window._wlDoc(roomCode);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) return;
        var data = snap.data();
        var players = data.players.slice();
        var idx = players.findIndex(function(p) { return p.name === myUsername; });
        if (idx === -1) return;
        players[idx].team = team;
        await window._wlUpdateDoc(docRef, { players: players });
    }

    // === CAN START CHECK ===
    function canStart(data) {
        if (!data || !data.players) return false;
        var t1 = data.players.filter(function(p) { return p.team === 1; });
        var t2 = data.players.filter(function(p) { return p.team === 2; });
        return t1.length >= 1 && t2.length >= 1 && data.players.length >= 3;
    }

    // === LOBBY SNAPSHOT HANDLER ===
    function onLobbySnapshot(data) {
        if (!data) {
            showToast('Room closed');
            leaveLobby();
            return;
        }
        lastData = data;

        // If game started
        if (data.status === 'playing' || data.status === 'done') {
            showScreen('game');
            document.getElementById('game-room-code').textContent = roomCode;
            onGameSnapshot(data);
            return;
        }

        // Render player list
        if (isHost) {
            renderPlayerList(data, playerList);
            startGameBtn.style.display = canStart(data) ? '' : 'none';
            waitingMsg.style.display = canStart(data) ? 'none' : '';
        } else {
            renderPlayerList(data, guestPlayerList);
        }
        updateTeamButtons(data);

        // Check if I was removed
        var stillIn = data.players.some(function(p) { return p.name === myUsername; });
        if (!stillIn) {
            showToast('You were removed from the room');
            leaveLobby();
        }
    }

    // === CREATE / JOIN / LEAVE ===
    window._wlCreateGame = async function() {
        myUsername = getMyUsername();
        roomCode = generateRoomCode();
        isHost = true;
        roomCodeDisplay.textContent = roomCode;
        lobbyMainBtns.style.display = 'none';
        createArea.style.display = '';

        var docRef = window._wlDoc(roomCode);
        await window._wlSetDoc(docRef, {
            host: myUsername,
            players: [{ name: myUsername, team: 0 }],
            status: 'waiting',
            teams: { 1: { score: 0, name: 'Red Team' }, 2: { score: 0, name: 'Blue Team' } },
            activeTeam: 1,
            psychicIndex: 0,
            spectrum: { left: '', right: '' },
            targetAngle: 90,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            opposingGuess: '',
            roundScore: 0,
            winner: ''
        });

        unsubscribe = window._wlOnSnapshot(docRef, function(snap) {
            onLobbySnapshot(snap.exists() ? snap.data() : null);
        });
    };

    window._wlJoinGame = async function(code) {
        myUsername = getMyUsername();
        var docRef = window._wlDoc(code);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) {
            joinError.textContent = 'Room not found';
            joinError.style.display = '';
            return;
        }
        var data = snap.data();
        if (data.status !== 'waiting') {
            joinError.textContent = 'Game already in progress';
            joinError.style.display = '';
            return;
        }
        if (data.players.length >= 12) {
            joinError.textContent = 'Room is full';
            joinError.style.display = '';
            return;
        }
        if (data.players.some(function(p) { return p.name === myUsername; })) {
            joinError.textContent = 'Name already taken in this room';
            joinError.style.display = '';
            return;
        }

        roomCode = code;
        isHost = false;
        var players = data.players.slice();
        players.push({ name: myUsername, team: 0 });
        await window._wlUpdateDoc(docRef, { players: players });

        joinArea.style.display = 'none';
        guestWaitingArea.style.display = '';
        guestRoomCode.textContent = roomCode;

        unsubscribe = window._wlOnSnapshot(docRef, function(snap) {
            onLobbySnapshot(snap.exists() ? snap.data() : null);
        });
    };

    function leaveLobby() {
        if (unsubscribe) { unsubscribe(); unsubscribe = null; }
        if (roomCode && window._wlDB) {
            var docRef = window._wlDoc(roomCode);
            if (isHost) {
                window._wlUpdateDoc(docRef, { status: 'done' }).catch(function() {});
            } else {
                window._wlGetDoc(docRef).then(function(snap) {
                    if (!snap.exists()) return;
                    var d = snap.data();
                    var ps = d.players.filter(function(p) { return p.name !== myUsername; });
                    window._wlUpdateDoc(docRef, { players: ps }).catch(function() {});
                }).catch(function() {});
            }
        }
        roomCode = '';
        isHost = false;
        lastData = null;
        winnerOverlay.classList.remove('visible');
        scorePopup.classList.remove('visible');
        showScreen('lobby');
        showLobbyMain();
    }

    // === START GAME ===
    window._wlStartGame = async function() {
        if (!lastData || !canStart(lastData)) return;
        var spec = pickSpectrum();
        var target = Math.floor(Math.random() * 160) + 10; // 10-170 degrees
        var docRef = window._wlDoc(roomCode);
        await window._wlUpdateDoc(docRef, {
            status: 'playing',
            activeTeam: 1,
            psychicIndex: 0,
            spectrum: { left: spec[0], right: spec[1] },
            targetAngle: target,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            opposingGuess: '',
            roundScore: 0,
            winner: '',
            teams: { 1: { score: 0, name: 'Red Team' }, 2: { score: 0, name: 'Blue Team' } }
        });
    };

    function pickSpectrum() {
        var available = SPECTRUMS.filter(function(s, i) { return usedSpectrums.indexOf(i) === -1; });
        if (available.length === 0) { usedSpectrums = []; available = SPECTRUMS.slice(); }
        var idx = Math.floor(Math.random() * available.length);
        var chosen = available[idx];
        usedSpectrums.push(SPECTRUMS.indexOf(chosen));
        return chosen;
    }

    // ====================
    //   GAME RENDERING
    // ====================

    var currentNeedleAngle = 90;
    var isDragging = false;
    var revealAnimation = null;
    var lastPhase = '';

    function getTeamPlayers(data, team) {
        return data.players.filter(function(p) { return p.team === team; });
    }

    function getPsychic(data) {
        var teamPlayers = getTeamPlayers(data, data.activeTeam);
        if (teamPlayers.length === 0) return '';
        var idx = data.psychicIndex % teamPlayers.length;
        return teamPlayers[idx].name;
    }

    function amIPsychic(data) {
        return getPsychic(data) === myUsername;
    }

    function amIActiveTeam(data) {
        var me = data.players.find(function(p) { return p.name === myUsername; });
        return me && me.team === data.activeTeam;
    }

    function amIOpposingTeam(data) {
        var me = data.players.find(function(p) { return p.name === myUsername; });
        return me && me.team !== 0 && me.team !== data.activeTeam;
    }

    function calcScore(targetAngle, guessAngle) {
        var diff = Math.abs(targetAngle - guessAngle);
        if (diff <= 4) return 4;
        if (diff <= 12) return 3;
        if (diff <= 22) return 2;
        return 0;
    }

    // === DRAW DIAL ===
    function drawDial(data, showTarget, showGuess) {
        var w = dialCanvas.width;
        var h = dialCanvas.height;
        var cx = w / 2;
        var cy = h - 20;
        var radius = Math.min(cx - 20, cy - 20);

        ctx.clearRect(0, 0, w, h);

        // Draw semicircle gradient background
        var segments = 180;
        for (var i = 0; i < segments; i++) {
            var a1 = Math.PI - (i / segments) * Math.PI;
            var a2 = Math.PI - ((i + 1) / segments) * Math.PI;
            var t = i / segments;
            // gradient from red (left) through purple to blue (right)
            var r, g, b;
            if (t < 0.25) {
                var p = t / 0.25;
                r = 255; g = Math.round(100 * p); b = Math.round(100 * p);
            } else if (t < 0.5) {
                var p = (t - 0.25) / 0.25;
                r = Math.round(255 - 80 * p); g = Math.round(100 - 50 * p); b = Math.round(100 + 100 * p);
            } else if (t < 0.75) {
                var p = (t - 0.5) / 0.25;
                r = Math.round(175 - 100 * p); g = Math.round(50 + 50 * p); b = Math.round(200 + 30 * p);
            } else {
                var p = (t - 0.75) / 0.25;
                r = Math.round(75 - 30 * p); g = Math.round(100 + 80 * p); b = Math.round(230 + 25 * p);
            }

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, radius, a1, a2, true);
            ctx.closePath();
            ctx.fillStyle = 'rgba(' + r + ',' + g + ',' + b + ', 0.35)';
            ctx.fill();
        }

        // Arc border
        ctx.beginPath();
        ctx.arc(cx, cy, radius, Math.PI, 0, false);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2a2a4a';
        ctx.stroke();

        // Base line
        ctx.beginPath();
        ctx.moveTo(cx - radius - 5, cy);
        ctx.lineTo(cx + radius + 5, cy);
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#2a2a4a';
        ctx.stroke();

        // Tick marks
        for (var deg = 0; deg <= 180; deg += 10) {
            var a = Math.PI - (deg / 180) * Math.PI;
            var inner = deg % 30 === 0 ? radius - 16 : radius - 10;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(a) * inner, cy + Math.sin(a) * inner * -1);
            ctx.lineTo(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius * -1);
            ctx.lineWidth = deg % 30 === 0 ? 2 : 1;
            ctx.strokeStyle = '#4a4a6a';
            ctx.stroke();
        }

        // Target zone (only for psychic or during reveal)
        if (showTarget && data.targetAngle !== undefined) {
            var tAngle = data.targetAngle;
            // Draw 3 zones: outer (2pts), inner (3pts), bullseye (4pts)
            var zones = [
                { halfSize: 22, color: 'rgba(123, 47, 247, 0.15)', pts: 2 },
                { halfSize: 12, color: 'rgba(123, 47, 247, 0.25)', pts: 3 },
                { halfSize: 4, color: 'rgba(123, 47, 247, 0.45)', pts: 4 }
            ];
            zones.forEach(function(zone) {
                var a1 = Math.PI - ((tAngle - zone.halfSize) / 180) * Math.PI;
                var a2 = Math.PI - ((tAngle + zone.halfSize) / 180) * Math.PI;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius - 2, a1, a2, true);
                ctx.closePath();
                ctx.fillStyle = zone.color;
                ctx.fill();
            });

            // Bullseye center line
            var centerA = Math.PI - (tAngle / 180) * Math.PI;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(centerA) * (radius - 2), cy - Math.sin(centerA) * (radius - 2));
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(123, 47, 247, 0.6)';
            ctx.stroke();
        }

        // Guess needle
        if (showGuess) {
            var gAngle = Math.PI - (currentNeedleAngle / 180) * Math.PI;
            // Needle shadow
            ctx.beginPath();
            ctx.moveTo(cx + 2, cy + 2);
            ctx.lineTo(cx + Math.cos(gAngle) * (radius - 25) + 2, cy - Math.sin(gAngle) * (radius - 25) + 2);
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'rgba(0,0,0,0.3)';
            ctx.stroke();

            // Needle line
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(gAngle) * (radius - 25), cy - Math.sin(gAngle) * (radius - 25));
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#feca57';
            ctx.stroke();

            // Needle tip
            ctx.beginPath();
            ctx.arc(cx + Math.cos(gAngle) * (radius - 25), cy - Math.sin(gAngle) * (radius - 25), 8, 0, Math.PI * 2);
            ctx.fillStyle = '#feca57';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#e0a800';
            ctx.stroke();

            // Center hub
            ctx.beginPath();
            ctx.arc(cx, cy, 10, 0, Math.PI * 2);
            ctx.fillStyle = '#2a2a4a';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#feca57';
            ctx.stroke();
        }
    }

    // === ANGLE FROM MOUSE ===
    function angleFromEvent(e) {
        var rect = dialCanvas.getBoundingClientRect();
        var scaleX = dialCanvas.width / rect.width;
        var scaleY = dialCanvas.height / rect.height;
        var cx = dialCanvas.width / 2;
        var cy = dialCanvas.height - 20;
        var mx = (e.clientX - rect.left) * scaleX;
        var my = (e.clientY - rect.top) * scaleY;
        var dx = mx - cx;
        var dy = cy - my;
        var angle = Math.atan2(dy, dx);
        var degrees = (angle * 180) / Math.PI;
        degrees = Math.max(2, Math.min(178, degrees));
        return degrees;
    }

    function handlePointerDown(e) {
        if (!lastData || lastData.phase === 'reveal' || lastData.phase === 'oppose') return;
        if (lastData.phase === 'psychic') return; // can't move needle during psychic phase
        if (!amIActiveTeam(lastData) || amIPsychic(lastData)) return;
        isDragging = true;
        var deg = angleFromEvent(e.touches ? e.touches[0] : e);
        currentNeedleAngle = deg;
        updateGuessAngle(deg);
        drawDial(lastData, amIPsychic(lastData), true);
    }

    function handlePointerMove(e) {
        if (!isDragging) return;
        e.preventDefault();
        var deg = angleFromEvent(e.touches ? e.touches[0] : e);
        currentNeedleAngle = deg;
        drawDial(lastData, amIPsychic(lastData), true);
    }

    function handlePointerUp(e) {
        if (!isDragging) return;
        isDragging = false;
        if (lastData) updateGuessAngle(currentNeedleAngle);
    }

    dialCanvas.addEventListener('mousedown', handlePointerDown);
    dialCanvas.addEventListener('mousemove', handlePointerMove);
    document.addEventListener('mouseup', handlePointerUp);
    dialCanvas.addEventListener('touchstart', function(e) { e.preventDefault(); handlePointerDown(e); }, { passive: false });
    dialCanvas.addEventListener('touchmove', function(e) { e.preventDefault(); handlePointerMove(e); }, { passive: false });
    document.addEventListener('touchend', handlePointerUp);

    function updateGuessAngle(angle) {
        if (!roomCode || !window._wlDB) return;
        var docRef = window._wlDoc(roomCode);
        window._wlUpdateDoc(docRef, { guessAngle: Math.round(angle) }).catch(function() {});
    }

    // === GAME SNAPSHOT ===
    function onGameSnapshot(data) {
        lastData = data;
        if (!data) return;

        // Update scores
        var t1s = data.teams && data.teams[1] ? data.teams[1].score : 0;
        var t2s = data.teams && data.teams[2] ? data.teams[2].score : 0;
        document.getElementById('t1-score').textContent = t1s;
        document.getElementById('t2-score').textContent = t2s;

        // Active team highlight
        var t1box = document.getElementById('team1-score-box');
        var t2box = document.getElementById('team2-score-box');
        t1box.classList.toggle('active-team', data.activeTeam === 1);
        t2box.classList.toggle('active-team', data.activeTeam === 2);

        // Spectrum labels
        document.getElementById('spec-left').textContent = data.spectrum ? data.spectrum.left : '';
        document.getElementById('spec-right').textContent = data.spectrum ? data.spectrum.right : '';

        // Psychic info
        var psychic = getPsychic(data);
        var teamName = data.activeTeam === 1 ? 'Red' : 'Blue';
        document.getElementById('round-info').textContent = psychic + ' is the Psychic (' + teamName + ' Team)';

        // Phase indicator
        var phaseLabels = {
            psychic: 'Psychic is thinking...',
            guessing: 'Team is guessing!',
            oppose: 'Opposing team: Left or Right?',
            reveal: 'Revealing target!'
        };
        document.getElementById('phase-indicator').textContent = phaseLabels[data.phase] || '';

        // Clue display
        var clueDisplay = document.getElementById('clue-display');
        var clueText = document.getElementById('clue-text');
        if (data.clue && data.phase !== 'psychic') {
            clueDisplay.style.display = '';
            clueText.textContent = data.clue;
        } else {
            clueDisplay.style.display = 'none';
        }

        // Update needle position from server for non-active team members
        if (!isDragging) {
            if (data.phase === 'guessing' || data.phase === 'oppose' || data.phase === 'reveal') {
                currentNeedleAngle = data.guessAngle || 90;
            } else {
                currentNeedleAngle = 90;
            }
        }

        // Determine what to show
        var showTarget = amIPsychic(data) || data.phase === 'reveal';
        var showNeedle = data.phase !== 'psychic';
        drawDial(data, showTarget, showNeedle);

        // Detect phase transitions
        if (data.phase === 'reveal' && lastPhase !== 'reveal') {
            onRevealPhase(data);
        }
        lastPhase = data.phase;

        // Render action area
        renderActionArea(data);

        // Winner check
        if (data.winner) {
            document.getElementById('winner-text').textContent = data.winner + ' Wins!';
            var ws = data.teams[data.winner === 'Red Team' ? 1 : 2].score;
            var ls = data.teams[data.winner === 'Red Team' ? 2 : 1].score;
            document.getElementById('winner-sub').textContent = ws + ' - ' + ls;
            winnerOverlay.classList.add('visible');
            if (window.SFX) {
                var me = data.players.find(function(p) { return p.name === myUsername; });
                var winTeam = data.winner === 'Red Team' ? 1 : 2;
                if (me && me.team === winTeam) window.SFX.win();
                else window.SFX.fail();
            }
        }
    }

    function onRevealPhase(data) {
        if (window.SFX) window.SFX.coin();
        // Show score popup
        var pts = calcScore(data.targetAngle, data.guessAngle);
        var sp = document.getElementById('score-popup');
        document.getElementById('sp-points').textContent = pts > 0 ? '+' + pts : '0';
        document.getElementById('sp-label').textContent = pts === 4 ? 'BULLSEYE!' : pts === 3 ? 'Close!' : pts === 2 ? 'Near' : 'Miss!';
        var oppMsg = '';
        if (data.opposingGuess) {
            var guessCorrect = false;
            if (data.opposingGuess === 'left' && data.targetAngle > data.guessAngle) guessCorrect = true;
            if (data.opposingGuess === 'right' && data.targetAngle < data.guessAngle) guessCorrect = true;
            oppMsg = 'Opposing team guessed ' + data.opposingGuess + (guessCorrect ? ' (+1 bonus!)' : ' (wrong)');
        }
        document.getElementById('sp-oppose').textContent = oppMsg;
        sp.classList.add('visible');
        setTimeout(function() { sp.classList.remove('visible'); }, 3500);
    }

    function renderActionArea(data) {
        var phaseMsg = document.getElementById('phase-msg');
        var content = document.getElementById('action-content');
        content.innerHTML = '';

        if (data.phase === 'psychic') {
            if (amIPsychic(data)) {
                phaseMsg.textContent = 'You are the Psychic! Give a clue for where the target is on the spectrum.';
                var div = document.createElement('div');
                div.className = 'clue-input-area';
                var input = document.createElement('input');
                input.className = 'clue-input';
                input.type = 'text';
                input.placeholder = 'Enter your clue...';
                input.maxLength = 40;
                input.id = 'psychic-clue-input';
                var btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = 'Submit Clue';
                btn.onclick = function() { submitClue(input.value.trim()); };
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') submitClue(input.value.trim());
                });
                div.appendChild(input);
                div.appendChild(btn);
                content.appendChild(div);
            } else if (amIActiveTeam(data)) {
                phaseMsg.textContent = 'Waiting for ' + getPsychic(data) + ' to give a clue...';
            } else {
                phaseMsg.textContent = 'Waiting for ' + getPsychic(data) + ' to give a clue...';
            }
        } else if (data.phase === 'guessing') {
            if (amIPsychic(data)) {
                phaseMsg.textContent = 'Your team is guessing. Watch them place the needle!';
            } else if (amIActiveTeam(data)) {
                phaseMsg.textContent = 'Move the needle to where you think the target is, then lock in!';
                var btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = 'Lock In Guess';
                btn.onclick = lockInGuess;
                content.appendChild(btn);
            } else {
                phaseMsg.textContent = 'The other team is guessing...';
            }
        } else if (data.phase === 'oppose') {
            if (amIOpposingTeam(data)) {
                phaseMsg.textContent = 'Is the target to the LEFT or RIGHT of the needle? (+1 bonus point)';
                var div = document.createElement('div');
                div.className = 'oppose-btns';
                var leftBtn = document.createElement('button');
                leftBtn.className = 'oppose-btn';
                leftBtn.textContent = 'Left (' + data.spectrum.left + ')';
                leftBtn.onclick = function() { submitOppose('left'); };
                var rightBtn = document.createElement('button');
                rightBtn.className = 'oppose-btn';
                rightBtn.textContent = 'Right (' + data.spectrum.right + ')';
                rightBtn.onclick = function() { submitOppose('right'); };
                div.appendChild(leftBtn);
                div.appendChild(rightBtn);
                content.appendChild(div);
            } else {
                phaseMsg.textContent = 'Opposing team is deciding Left or Right...';
            }
        } else if (data.phase === 'reveal') {
            phaseMsg.textContent = '';
            if (isHost) {
                var btn = document.createElement('button');
                btn.className = 'action-btn';
                btn.textContent = 'Next Round';
                btn.style.marginTop = '10px';
                btn.onclick = nextRound;
                content.appendChild(btn);
            } else {
                var p = document.createElement('p');
                p.style.color = '#888';
                p.style.fontSize = '0.9rem';
                p.textContent = 'Waiting for host to start next round...';
                content.appendChild(p);
            }
        }
    }

    // === GAME ACTIONS ===
    async function submitClue(clue) {
        if (!clue) { showToast('Enter a clue!'); return; }
        if (window.SFX) window.SFX.click();
        var docRef = window._wlDoc(roomCode);
        await window._wlUpdateDoc(docRef, {
            clue: clue,
            phase: 'guessing',
            guessAngle: 90
        });
    }

    async function lockInGuess() {
        if (window.SFX) window.SFX.click();
        var docRef = window._wlDoc(roomCode);
        // Check if opposing team exists
        var opTeam = lastData.activeTeam === 1 ? 2 : 1;
        var oppPlayers = getTeamPlayers(lastData, opTeam);
        if (oppPlayers.length > 0) {
            await window._wlUpdateDoc(docRef, { phase: 'oppose' });
        } else {
            // No opposing team, skip to reveal
            await doReveal('');
        }
    }

    async function submitOppose(direction) {
        if (window.SFX) window.SFX.click();
        await doReveal(direction);
    }

    async function doReveal(opposingGuess) {
        var docRef = window._wlDoc(roomCode);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) return;
        var data = snap.data();

        var pts = calcScore(data.targetAngle, data.guessAngle);
        var teams = JSON.parse(JSON.stringify(data.teams));
        teams[data.activeTeam].score += pts;

        // Opposing team bonus
        var opTeam = data.activeTeam === 1 ? 2 : 1;
        if (opposingGuess) {
            var guessCorrect = false;
            if (opposingGuess === 'left' && data.targetAngle > data.guessAngle) guessCorrect = true;
            if (opposingGuess === 'right' && data.targetAngle < data.guessAngle) guessCorrect = true;
            if (guessCorrect) teams[opTeam].score += 1;
        }

        // Check winner
        var winner = '';
        if (teams[1].score >= 10) winner = 'Red Team';
        if (teams[2].score >= 10) winner = 'Blue Team';

        await window._wlUpdateDoc(docRef, {
            phase: 'reveal',
            opposingGuess: opposingGuess || '',
            roundScore: pts,
            teams: teams,
            winner: winner
        });
    }

    async function nextRound() {
        if (window.SFX) window.SFX.click();
        var docRef = window._wlDoc(roomCode);
        var snap = await window._wlGetDoc(docRef);
        if (!snap.exists()) return;
        var data = snap.data();

        if (data.winner) return;

        // Rotate: switch active team and advance psychic index
        var newActiveTeam = data.activeTeam === 1 ? 2 : 1;
        var newPsychicIndex = data.psychicIndex;
        // When we come back to team 1, advance the psychic
        if (newActiveTeam === 1) {
            newPsychicIndex = data.psychicIndex + 1;
        }

        var spec = pickSpectrum();
        var target = Math.floor(Math.random() * 160) + 10;

        await window._wlUpdateDoc(docRef, {
            activeTeam: newActiveTeam,
            psychicIndex: newPsychicIndex,
            spectrum: { left: spec[0], right: spec[1] },
            targetAngle: target,
            clue: '',
            guessAngle: 90,
            phase: 'psychic',
            opposingGuess: '',
            roundScore: 0
        });
    }

    // === EVENT LISTENERS ===
    document.getElementById('create-game-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        window._wlCreateGame();
    });

    document.getElementById('join-game-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        lobbyMainBtns.style.display = 'none';
        joinArea.style.display = '';
    });

    document.getElementById('join-submit-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        var code = joinCodeInput.value.trim().toUpperCase();
        joinError.style.display = 'none';
        window._wlJoinGame(code);
    });

    joinCodeInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            if (window.SFX) window.SFX.click();
            var code = joinCodeInput.value.trim().toUpperCase();
            joinError.style.display = 'none';
            window._wlJoinGame(code);
        }
    });

    document.getElementById('join-back-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        showLobbyMain();
    });

    document.getElementById('create-leave-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        leaveLobby();
    });

    document.getElementById('guest-leave-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        leaveLobby();
    });

    startGameBtn.addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        window._wlStartGame();
    });

    document.getElementById('leave-game-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        leaveLobby();
    });

    document.getElementById('back-to-lobby-btn').addEventListener('click', function() {
        if (window.SFX) window.SFX.click();
        winnerOverlay.classList.remove('visible');
        leaveLobby();
    });

    // Team selection buttons
    ['team1-btn', 'guest-team1-btn'].forEach(function(id) {
        document.getElementById(id).addEventListener('click', function() {
            if (window.SFX) window.SFX.click();
            setMyTeam(1);
        });
    });
    ['team2-btn', 'guest-team2-btn'].forEach(function(id) {
        document.getElementById(id).addEventListener('click', function() {
            if (window.SFX) window.SFX.click();
            setMyTeam(2);
        });
    });

    // Expose for firebase module
    window._wlGame = {
        getMyUsername: getMyUsername,
        generateRoomCode: generateRoomCode,
        showToast: showToast
    };

    // Initial draw
    drawDial({ targetAngle: 90 }, false, false);

})();
</script>
